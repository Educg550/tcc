events {
    worker_connections 1024;
}

http {
    client_max_body_size 10M;
    
    upstream forms_app {
        server forms:5000;
    }

    include       mime.types;
    default_type  application/octet-stream;

    limit_req_zone $binary_remote_addr zone=one_limit:10m rate=5r/s;  
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
    gzip_disable "msie6";

    server {
        listen 80;

        # block sensitive headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        error_page 502 503 504 /maintenance/index.html;

        location / {
            proxy_pass http://forms_app;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            limit_conn addr 10;
            limit_req zone=one_limit burst=20 nodelay;
        }

        location /maintenance/ {
            root /usr/share/nginx/html;
            internal;
        }

        location /prejanus {
            proxy_pass http://prejanus-front:3000;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            limit_conn addr 10;
            limit_req zone=one_limit burst=40 nodelay;
        }

        location /static {
            alias /usr/share/nginx/static-assets/dist;
            autoindex off; 

            expires 30d;         
            add_header Last-Modified $date_gmt;         
            if_modified_since exact;  

            types {
                text/css css;
                application/javascript js;
                image/png png;
                image/jpeg jpg jpeg;
                image/x-icon ico;
                font/woff2 woff2;
                image/svg+xml svg;
            }
        }

        location /api {
            proxy_pass http://forms_app/api;

            limit_req zone=one_limit burst=20; 

            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # location /smtp4dev {
        #     proxy_pass http://smtp:80;
        #     proxy_set_header Host $host:$server_port;
        #     proxy_set_header X-Forwarded-Host $host;
        #     proxy_set_header X-Forwarded-Port $server_port;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;

        #     limit_conn addr 10;
        #     limit_req zone=one_limit burst=20 nodelay;
        # }
    }
}