<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
<img class="logo" src="/assets/usp-logo.png" alt="Logo da USP">
<h1>Solicitação de Auxílio Financeiro</h1>
</header>
<main>
<nav class="abas">
<button id="aba-alunos" class="aba ativa">ALUNOS</button>
<button id="aba-docentes" class="aba">DOCENTES</button>
</nav>
<form id="form-alunos" class="formulario">
<div class="erros" hidden></div>
<label>Nome<input name="nome" placeholder="Maria da Silva"></label>
<label>E-mail<input name="email" placeholder="maria@ime.usp.br"></label>
<label>Valor solicitado (R$)<input name="valor" placeholder="150,00"></label>
<label>CPF<input name="cpf" placeholder="123.456.789-09"></label>
<button type="submit">Enviar</button>
</form>
<form id="form-docentes" class="formulario" hidden>
<div class="erros" hidden></div>
<label>Nome<input name="nome" placeholder="João de Souza"></label>
<label>E-mail<input name="email" placeholder="joao@ime.usp.br"></label>
<label>Valor solicitado (R$)<input name="valor" placeholder="200,00"></label>
<label>CPF<input name="cpf" placeholder="987.654.321-00"></label>
<button type="submit">Enviar</button>
</form>
<section id="confirmacao" hidden>
<h2>Solicitação registrada</h2>
<pre id="oficio"></pre>
</section>
</main>
<script src="/app.js"></script>
</body>
</html>
