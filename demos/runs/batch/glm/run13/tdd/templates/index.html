<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="logo-titulo">
      <img src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
      <div>
        <h1>Universidade de São Paulo</h1>
        <span class="programa">Pós-Graduação do IME-USP</span>
      </div>
    </div>
  </header>
  <main>
    <div class="tabs" role="tablist">
      <button type="button" class="tab" data-aba="ALUNOS">ALUNOS</button>
      <button type="button" class="tab" data-aba="DOCENTES">DOCENTES</button>
    </div>

    {% for aba in ['ALUNOS', 'DOCENTES'] %}
    <section id="form-{{ aba }}" class="formulario aba-painel">
      <ul class="erros" aria-live="polite"></ul>
      <form class="aba-form" method="post" action="/enviar">
        <input type="hidden" name="aba" value="{{ aba }}">
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="campos">
            <div class="col-2">
              <label class="obrigatorio" for="nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input type="text" id="nome" name="nome" required placeholder="Maria da Silva Souza">
            </div>
            <div>
              <label class="obrigatorio" for="n_usp">N. USP</label>
              <input type="text" id="n_usp" name="n_usp" required placeholder="12345678">
            </div>
            <div>
              <label class="obrigatorio" for="programa">PROGRAMA</label>
              <input type="text" id="programa" name="programa" required placeholder="Matemática">
            </div>
            {% if aba == 'ALUNOS' %}
            <div>
              <label class="obrigatorio" for="nivel">NÍVEL</label>
              <select id="nivel" name="nivel" required>
                <option value="Mestrado">Mestrado</option>
                <option value="Doutorado">Doutorado</option>
              </select>
            </div>
            <div>
              <label class="obrigatorio" for="tipo_auxilio">TIPO DE AUXÍLIO</label>
              <select id="tipo_auxilio" name="tipo_auxilio" required>
                <option value="Participação em evento">Participação em evento</option>
                <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
                <option value="Outro">Outro</option>
              </select>
            </div>
            {% endif %}
            <div class="col-2">
              <label class="obrigatorio" for="email">E-MAIL</label>
              <input type="email" id="email" name="email" required placeholder="nome@ime.usp.br">
            </div>
            <div class="col-2">
              <label class="obrigatorio" for="evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input type="text" id="evento" name="evento" required placeholder="Congresso Latino de Matemática">
            </div>
            <div>
              <label class="obrigatorio" for="periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="periodo" name="periodo" required placeholder="10 a 12 de outubro de 2026">
            </div>
            <div>
              <label class="obrigatorio" for="cidade_evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="cidade_evento" name="cidade_evento" required placeholder="Gramado">
            </div>
            <div>
              <label class="obrigatorio" for="estado_evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="estado_evento" name="estado_evento" required placeholder="RS">
            </div>
            <div>
              <label class="obrigatorio" for="pais_evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="pais_evento" name="pais_evento" required placeholder="Brasil">
            </div>
            <div class="col-2">
              <label for="link_evento">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input type="url" id="link_evento" name="link_evento" placeholder="https://www.exemplo.com.br">
            </div>
            <div>
              <label class="obrigatorio" for="valor">VALOR SOLICITADO (R$)</label>
              <input type="text" id="valor" name="valor" required placeholder="R$ 1.500,00">
            </div>
            <div class="col-4">
              <label class="obrigatorio" for="detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="detalhamento" name="detalhamento" required placeholder="Inscrição e hospedagem durante o evento"></textarea>
            </div>
            <div class="col-2">
              <label class="obrigatorio" for="apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="apresentacao" name="apresentacao" required>
                <option value="Pôster">Pôster</option>
                <option value="Apresentação oral">Apresentação oral</option>
                <option value="Outra">Outra</option>
                <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
              </select>
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="campos">
            <div>
              <label class="obrigatorio" for="data_nascimento">DATA DE NASCIMENTO</label>
              <input type="text" id="data_nascimento" name="data_nascimento" required placeholder="01/02/1980">
            </div>
            <div class="col-2">
              <label class="obrigatorio" for="logradouro">LOGRADOURO</label>
              <input type="text" id="logradouro" name="logradouro" required placeholder="Rua do Matão">
            </div>
            <div>
              <label class="obrigatorio" for="numero">NÚMERO</label>
              <input type="text" id="numero" name="numero" required placeholder="1010">
            </div>
            <div>
              <label for="complemento">COMPLEMENTO</label>
              <input type="text" id="complemento" name="complemento" placeholder="Bloco B">
            </div>
            <div>
              <label class="obrigatorio" for="bairro">BAIRRO</label>
              <input type="text" id="bairro" name="bairro" required placeholder="Butantã">
            </div>
            <div>
              <label class="obrigatorio" for="cep">CEP</label>
              <input type="text" id="cep" name="cep" required placeholder="05508-090">
            </div>
            <div>
              <label class="obrigatorio" for="cidade">CIDADE</label>
              <input type="text" id="cidade" name="cidade" required placeholder="São Paulo">
            </div>
            <div>
              <label class="obrigatorio" for="estado">ESTADO</label>
              <input type="text" id="estado" name="estado" required placeholder="SP">
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="campos">
            <div>
              <label class="obrigatorio" for="cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input type="text" id="cpf" name="cpf" required placeholder="529.982.247-25">
            </div>
            <div>
              <label class="obrigatorio" for="rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input type="text" id="rg" name="rg" required placeholder="12.345.678-9">
            </div>
            <div class="col-2">
              <label class="obrigatorio" for="banco">NOME DO BANCO</label>
              <input type="text" id="banco" name="banco" required placeholder="Banco do Brasil">
            </div>
            <div>
              <label class="obrigatorio" for="agencia">NÚMERO DA AGÊNCIA</label>
              <input type="text" id="agencia" name="agencia" required placeholder="1234">
            </div>
            <div>
              <label class="obrigatorio" for="conta">NÚMERO DA CONTA</label>
              <input type="text" id="conta" name="conta" required placeholder="98765-4">
            </div>
          </div>
        </fieldset>
        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>
    {% endfor %}

    <section id="confirmacao">
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
