<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
<div class="cabecalho-conteudo">
<img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo" class="usp-logo">
<div class="cabecalho-texto">
<h1>Universidade de São Paulo</h1>
<p>Instituto de Matemática e Estatística</p>
</div>
</div>
</header>

<main>
<div class="abas">
<button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
<button type="button" class="aba" data-aba="docentes">DOCENTES</button>
</div>

<div class="mensagens-erro" id="erro-alunos"></div>
<div class="mensagens-erro" id="erro-docentes"></div>

<form id="form-alunos" class="formulario visivel">
<fieldset>
<legend>SOLICITANTE E EVENTO</legend>
<div class="grade-campos">
<div class="campo campo-largo">
<label for="aluno-nome">NOME COMPLETO - SEM ABREVIAR</label>
<input type="text" id="aluno-nome" name="nome_completo" placeholder="Maria Silva Santos">
</div>
<div class="campo">
<label for="aluno-nusp">N. USP</label>
<input type="text" id="aluno-nusp" name="nusp" placeholder="12345678">
</div>
<div class="campo">
<label for="aluno-programa">PROGRAMA</label>
<input type="text" id="aluno-programa" name="programa" placeholder="Matemática">
</div>
<div class="campo">
<label for="aluno-nivel">NÍVEL</label>
<select id="aluno-nivel" name="nivel">
<option value="Mestrado">Mestrado</option>
<option value="Doutorado">Doutorado</option>
</select>
</div>
<div class="campo">
<label for="aluno-tipo">TIPO DE AUXÍLIO</label>
<select id="aluno-tipo" name="tipo_auxilio">
<option value="Participação em evento">Participação em evento</option>
<option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
<option value="Outro">Outro</option>
</select>
</div>
<div class="campo">
<label for="aluno-email">E-MAIL</label>
<input type="text" id="aluno-email" name="email" placeholder="exemplo@ime.usp.br">
</div>
<div class="campo">
<label for="aluno-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
<input type="text" id="aluno-evento" name="nome_evento" placeholder="Congresso Latino-Americano de Matemática">
</div>
<div class="campo">
<label for="aluno-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
<input type="text" id="aluno-periodo" name="periodo" placeholder="15 a 20 de julho de 2024">
</div>
<div class="campo">
<label for="aluno-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
<input type="text" id="aluno-cidade-evento" name="cidade_evento" placeholder="São Paulo">
</div>
<div class="campo">
<label for="aluno-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
<input type="text" id="aluno-estado-evento" name="estado_evento" placeholder="São Paulo">
</div>
<div class="campo">
<label for="aluno-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
<input type="text" id="aluno-pais-evento" name="pais_evento" placeholder="Brasil">
</div>
<div class="campo">
<label for="aluno-link">LINK DO EVENTO, EXAME OU DEFESA (opcional)</label>
<input type="text" id="aluno-link" name="link_evento" placeholder="https://exemplo.com.br">
</div>
<div class="campo">
<label for="aluno-valor">VALOR SOLICITADO (R$)</label>
<input type="text" id="aluno-valor" name="valor" class="campo-moeda" placeholder="1500">
</div>
<div class="campo campo-texto-longo">
<label for="aluno-detalhamento">DETALHAMENTO DO PEDIDO</label>
<textarea id="aluno-detalhamento" name="detalhamento" rows="3" placeholder="Passagem aérea, inscrição e diárias de hotel"></textarea>
</div>
<div class="campo">
<label for="aluno-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
<select id="aluno-apresentacao" name="apresentacao">
<option value="Pôster">Pôster</option>
<option value="Apresentação oral">Apresentação oral</option>
<option value="Outra">Outra</option>
<option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
</select>
</div>
</div>
</fieldset>

<fieldset>
<legend>ENDEREÇO DO SOLICITANTE</legend>
<div class="grade-campos">
<div class="campo">
<label for="aluno-nascimento">DATA DE NASCIMENTO</label>
<input type="text" id="aluno-nascimento" name="data_nascimento" class="campo-data" placeholder="01021980">
</div>
<div class="campo campo-largo">
<label for="aluno-logradouro">LOGRADOURO</label>
<input type="text" id="aluno-logradouro" name="logradouro" placeholder="Rua do Matão">
</div>
<div class="campo">
<label for="aluno-numero">NÚMERO</label>
<input type="text" id="aluno-numero" name="numero" placeholder="1010">
</div>
<div class="campo">
<label for="aluno-complemento">COMPLEMENTO (opcional)</label>
<input type="text" id="aluno-complemento" name="complemento" placeholder="Prédio B, sala 301">
</div>
<div class="campo">
<label for="aluno-bairro">BAIRRO</label>
<input type="text" id="aluno-bairro" name="bairro" placeholder="Butantã">
</div>
<div class="campo">
<label for="aluno-cep">CEP</label>
<input type="text" id="aluno-cep" name="cep" class="campo-cep" placeholder="05508090">
</div>
<div class="campo">
<label for="aluno-cidade">CIDADE</label>
<input type="text" id="aluno-cidade" name="cidade" placeholder="São Paulo">
</div>
<div class="campo">
<label for="aluno-estado">ESTADO</label>
<input type="text" id="aluno-estado" name="estado" placeholder="SP">
</div>
</div>
</fieldset>

<fieldset>
<legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
<div class="grade-campos">
<div class="campo">
<label for="aluno-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
<input type="text" id="aluno-cpf" name="cpf" class="campo-cpf" placeholder="12345678909">
</div>
<div class="campo">
<label for="aluno-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
<input type="text" id="aluno-rg" name="rg_rnm" placeholder="34.567.890-1">
</div>
<div class="campo">
<label for="aluno-banco">NOME DO BANCO</label>
<input type="text" id="aluno-banco" name="banco" placeholder="Banco do Brasil">
</div>
<div class="campo">
<label for="aluno-agencia">NÚMERO DA AGÊNCIA</label>
<input type="text" id="aluno-agencia" name="agencia" placeholder="1234">
</div>
<div class="campo">
<label for="aluno-conta">NÚMERO DA CONTA</label>
<input type="text" id="aluno-conta" name="conta" placeholder="12345-6">
</div>
</div>
</fieldset>

<button type="submit" class="botao-enviar">Enviar solicitação</button>
</form>

<form id="form-docentes" class="formulario">
<fieldset>
<legend>SOLICITANTE E EVENTO</legend>
<div class="grade-campos">
<div class="campo campo-largo">
<label for="docente-nome">NOME COMPLETO - SEM ABREVIAR</label>
<input type="text" id="docente-nome" name="nome_completo" placeholder="João Pereira Oliveira">
</div>
<div class="campo">
<label for="docente-nusp">N. USP</label>
<input type="text" id="docente-nusp" name="nusp" placeholder="87654321">
</div>
<div class="campo">
<label for="docente-programa">PROGRAMA</label>
<input type="text" id="docente-programa" name="programa" placeholder="Estatística">
</div>
<div class="campo">
<label for="docente-email">E-MAIL</label>
<input type="text" id="docente-email" name="email" placeholder="exemplo@ime.usp.br">
</div>
<div class="campo">
<label for="docente-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
<input type="text" id="docente-evento" name="nome_evento" placeholder="Simpósio Brasileiro de Probabilidade">
</div>
<div class="campo">
<label for="docente-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
<input type="text" id="docente-periodo" name="periodo" placeholder="10 a 12 de agosto de 2024">
</div>
<div class="campo">
<label for="docente-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
<input type="text" id="docente-cidade-evento" name="cidade_evento" placeholder="Rio de Janeiro">
</div>
<div class="campo">
<label for="docente-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
<input type="text" id="docente-estado-evento" name="estado_evento" placeholder="Rio de Janeiro">
</div>
<div class="campo">
<label for="docente-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
<input type="text" id="docente-pais-evento" name="pais_evento" placeholder="Portugal">
</div>
<div class="campo">
<label for="docente-link">LINK DO EVENTO, EXAME OU DEFESA (opcional)</label>
<input type="text" id="docente-link" name="link_evento" placeholder="https://exemplo.com.br">
</div>
<div class="campo">
<label for="docente-valor">VALOR SOLICITADO (R$)</label>
<input type="text" id="docente-valor" name="valor" class="campo-moeda" placeholder="2500">
</div>
<div class="campo campo-texto-longo">
<label for="docente-detalhamento">DETALHAMENTO DO PEDIDO</label>
<textarea id="docente-detalhamento" name="detalhamento" rows="3" placeholder="Passagem aérea e inscrição no evento"></textarea>
</div>
<div class="campo">
<label for="docente-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
<select id="docente-apresentacao" name="apresentacao">
<option value="Pôster">Pôster</option>
<option value="Apresentação oral">Apresentação oral</option>
<option value="Outra">Outra</option>
<option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
</select>
</div>
</div>
</fieldset>

<fieldset>
<legend>ENDEREÇO DO SOLICITANTE</legend>
<div class="grade-campos">
<div class="campo">
<label for="docente-nascimento">DATA DE NASCIMENTO</label>
<input type="text" id="docente-nascimento" name="data_nascimento" class="campo-data" placeholder="03071975">
</div>
<div class="campo campo-largo">
<label for="docente-logradouro">LOGRADOURO</label>
<input type="text" id="docente-logradouro" name="logradouro" placeholder="Av. Professor Mário Moraes">
</div>
<div class="campo">
<label for="docente-numero">NÚMERO</label>
<input type="text" id="docente-numero" name="numero" placeholder="1750">
</div>
<div class="campo">
<label for="docente-complemento">COMPLEMENTO (opcional)</label>
<input type="text" id="docente-complemento" name="complemento" placeholder="Bloco C">
</div>
<div class="campo">
<label for="docente-bairro">BAIRRO</label>
<input type="text" id="docente-bairro" name="bairro" placeholder="Centro">
</div>
<div class="campo">
<label for="docente-cep">CEP</label>
<input type="text" id="docente-cep" name="cep" class="campo-cep" placeholder="01310000">
</div>
<div class="campo">
<label for="docente-cidade">CIDADE</label>
<input type="text" id="docente-cidade" name="cidade" placeholder="Lisboa">
</div>
<div class="campo">
<label for="docente-estado">ESTADO</label>
<input type="text" id="docente-estado" name="estado" placeholder="RJ">
</div>
</div>
</fieldset>

<fieldset>
<legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
<div class="grade-campos">
<div class="campo">
<label for="docente-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
<input type="text" id="docente-cpf" name="cpf" class="campo-cpf" placeholder="98765432100">
</div>
<div class="campo">
<label for="docente-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
<input type="text" id="docente-rg" name="rg_rnm" placeholder="12.345.678-9">
</div>
<div class="campo">
<label for="docente-banco">NOME DO BANCO</label>
<input type="text" id="docente-banco" name="banco" placeholder="Itaú">
</div>
<div class="campo">
<label for="docente-agencia">NÚMERO DA AGÊNCIA</label>
<input type="text" id="docente-agencia" name="agencia" placeholder="5678">
</div>
<div class="campo">
<label for="docente-conta">NÚMERO DA CONTA</label>
<input type="text" id="docente-conta" name="conta" placeholder="98765-4">
</div>
</div>
</fieldset>

<button type="submit" class="botao-enviar">Enviar solicitação</button>
</form>

<div id="confirmacao" class="confirmacao oculto">
<h2>Solicitação registrada</h2>
<pre id="oficio" class="oficio"></pre>
</div>
</main>

<script src="app.js"></script>
</body>
</html>
