<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div>
    <p class="universidade">Universidade de São Paulo</p>
    <p class="instituto">Instituto de Matemática e Estatística</p>
  </div>
</header>
<main>
  <nav class="abas" role="tablist">
    <button class="aba ativa" data-aba="alunos" role="tab">ALUNOS</button>
    <button class="aba" data-aba="docentes" role="tab">DOCENTES</button>
  </nav>

  <form class="painel" data-aba="alunos" novalidate>
    <div class="erros" hidden></div>
    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class="grade">
        <label>NOME COMPLETO - SEM ABREVIAR
          <input name="nome" placeholder="Maria da Silva Souza">
        </label>
        <label>N. USP
          <input name="n_usp" inputmode="numeric" placeholder="12345678">
        </label>
        <label>PROGRAMA
          <input name="programa" placeholder="Matemática">
        </label>
        <label>NÍVEL
          <select name="nivel">
            <option value="">Selecione</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select>
        </label>
        <label>TIPO DE AUXÍLIO
          <select name="tipo_auxilio">
            <option value="">Selecione</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select>
        </label>
        <label>E-MAIL
          <input name="email" type="email" placeholder="maria@ime.usp.br">
        </label>
        <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA
          <input name="evento" placeholder="Congresso Brasileiro de Matemática">
        </label>
        <label>PERÍODO DO EVENTO, EXAME OU DEFESA
          <input name="periodo" placeholder="10 a 14 de julho de 2025">
        </label>
        <label>CIDADE DO EVENTO, EXAME OU DEFESA
          <input name="cidade_evento" placeholder="Porto Alegre">
        </label>
        <label>ESTADO DO EVENTO, EXAME OU DEFESA
          <input name="estado_evento" placeholder="RS">
        </label>
        <label>PAÍS DO EVENTO, EXAME OU DEFESA
          <input name="pais_evento" placeholder="Brasil">
        </label>
        <label>LINK DO EVENTO, EXAME OU DEFESA
          <input name="link" placeholder="https://cbm.exemplo.br">
        </label>
        <label>VALOR SOLICITADO (R$)
          <input name="valor" class="moeda" inputmode="numeric" placeholder="R$ 1.500,00">
        </label>
        <label class="amplo">DETALHAMENTO DO PEDIDO
          <textarea name="detalhamento" rows="2" placeholder="Inscrição no evento e passagens aéreas."></textarea>
        </label>
        <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
          <select name="apresentacao">
            <option value="">Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class="grade">
        <label>DATA DE NASCIMENTO
          <input name="data_nascimento" class="data" inputmode="numeric" placeholder="01/02/1980">
        </label>
        <label>LOGRADOURO
          <input name="logradouro" placeholder="Rua do Matão">
        </label>
        <label>NÚMERO
          <input name="numero" placeholder="1010">
        </label>
        <label>COMPLEMENTO
          <input name="complemento" placeholder="Apto 21">
        </label>
        <label>BAIRRO
          <input name="bairro" placeholder="Butantã">
        </label>
        <label>CEP
          <input name="cep" class="cep" inputmode="numeric" placeholder="05508-090">
        </label>
        <label>CIDADE
          <input name="cidade" placeholder="São Paulo">
        </label>
        <label>ESTADO
          <input name="estado" placeholder="SP">
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="grade">
        <label>CPF (SEPARADOS POR PONTOS E TRAÇO)
          <input name="cpf" class="cpf" inputmode="numeric" placeholder="123.456.789-09">
        </label>
        <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
          <input name="rg" placeholder="12.345.678-9">
        </label>
        <label>NOME DO BANCO
          <input name="banco" placeholder="Banco do Brasil">
        </label>
        <label>NÚMERO DA AGÊNCIA
          <input name="agencia" inputmode="numeric" placeholder="1234">
        </label>
        <label>NÚMERO DA CONTA
          <input name="conta" placeholder="56789-0">
        </label>
      </div>
    </fieldset>

    <button type="submit">Enviar solicitação</button>
  </form>

    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="grade">
        <label>CPF (SEPARADOS POR PONTOS E TRAÇO)
          <input name="cpf" class="cpf" inputmode="numeric" placeholder="123.456.789-09">
        </label>
        <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
          <input name="rg" placeholder="12.345.678-9">
        </label>
        <label>NOME DO BANCO
          <input name="banco" placeholder="Banco do Brasil">
        </label>
        <label>NÚMERO DA AGÊNCIA
          <input name="agencia" inputmode="numeric" placeholder="1234">
        </label>
        <label>NÚMERO DA CONTA
          <input name="conta" placeholder="56789-0">
        </label>
      </div>
    </fieldset>

    <button type="submit">Enviar solicitação</button>
  </form>

  <section id="confirmacao" hidden>
    <h1>Solicitação registrada</h1>
    <pre id="oficio"></pre>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
