<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="cabecalho">
  <img src="/static/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div>
    <h1>Universidade de São Paulo</h1>
    <p>Instituto de Matemática e Estatística</p>
  </div>
</header>

<nav class="abas">
  <button class="aba ativa" data-aba="alunos" type="button">ALUNOS</button>
  <button class="aba" data-aba="docentes" type="button">DOCENTES</button>
</nav>

<main>
  <section id="alunos" class="painel ativo">
    <div class="erros" hidden></div>
    <form id="form-alunos" data-aba="alunos">
      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <label>NOME COMPLETO - SEM ABREVIAR<input name="nome" required placeholder="Maria da Silva"></label>
        <label>N. USP<input name="n_usp" required inputmode="numeric" placeholder="12345678"></label>
        <label>PROGRAMA<input name="programa" required placeholder="Matemática"></label>
        <label>NÍVEL<select name="nivel" required><option value=""></option><option>Mestrado</option><option>Doutorado</option></select></label>
        <label>TIPO DE AUXÍLIO<select name="tipo_auxilio" required><option value=""></option><option>Participação em evento</option><option>Banca de exame ou defesa</option><option>Outro</option></select></label>
        <label>E-MAIL<input name="email" required type="email" placeholder="maria@ime.usp.br"></label>
        <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA<input name="nome_evento" required placeholder="Congresso Nacional de Matemática"></label>
        <label>PERÍODO DO EVENTO, EXAME OU DEFESA<input name="periodo_evento" required placeholder="10 a 12 de outubro"></label>
        <label>CIDADE DO EVENTO, EXAME OU DEFESA<input name="cidade_evento" required placeholder="São Paulo"></label>
        <label>ESTADO DO EVENTO, EXAME OU DEFESA<input name="estado_evento" required placeholder="SP"></label>
        <label>PAÍS DO EVENTO, EXAME OU DEFESA<input name="pais_evento" required placeholder="Brasil"></label>
        <label>LINK DO EVENTO, EXAME OU DEFESA<input name="link_evento" placeholder="https://exemplo.com"></label>
        <label>VALOR SOLICITADO (R$)<input name="valor_solicitado" required inputmode="numeric" placeholder="1500" data-formato="moeda"></label>
        <label class="inteiro">DETALHAMENTO DO PEDIDO<textarea name="detalhamento" required rows="2" placeholder="Passagem aérea, duas diárias de hotel e inscrição"></textarea></label>
        <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?<select name="apresentacao" required><option value=""></option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
      </fieldset>
      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <label>DATA DE NASCIMENTO<input name="data_nascimento" required inputmode="numeric" placeholder="01/02/1980" data-formato="data"></label>
        <label>LOGRADOURO<input name="logradouro" required placeholder="Rua do Matão"></label>
        <label>NÚMERO<input name="numero" required placeholder="1010"></label>
        <label>COMPLEMENTO<input name="complemento" placeholder="Predio 3"></label>
        <label>BAIRRO<input name="bairro" required placeholder="Butantã"></label>
        <label>CEP<input name="cep" required inputmode="numeric" placeholder="05508-090" data-formato="cep"></label>
        <label>CIDADE<input name="cidade" required placeholder="São Paulo"></label>
        <label>ESTADO<input name="estado" required placeholder="SP"></label>
      </fieldset>
      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input name="cpf" required inputmode="numeric" placeholder="123.456.789-09" data-formato="cpf"></label>
        <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input name="rg" required placeholder="12.345.678-9"></label>
        <label>NOME DO BANCO<input name="banco" required placeholder="Banco do Brasil"></label>
        <label>NÚMERO DA AGÊNCIA<input name="agencia" required inputmode="numeric" placeholder="1234"></label>
        <label>NÚMERO DA CONTA<input name="conta" required placeholder="56789-0"></label>
      </fieldset>
      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section id="docentes" class="painel" hidden>
    <div class="erros" hidden></div>
    <form id="form-docentes" data-aba="docentes">
      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <label>NOME COMPLETO - SEM ABREVIAR<input name="nome" required placeholder="Maria da Silva"></label>
        <label>N. USP<input name="n_usp" required inputmode="numeric" placeholder="12345678"></label>
        <label>PROGRAMA<input name="programa" required placeholder="Matemática"></label>
        <label>E-MAIL<input name="email" required type="email" placeholder="maria@ime.usp.br"></label>
        <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA<input name="nome_evento" required placeholder="Congresso Nacional de Matemática"></label>
        <label>PERÍODO DO EVENTO, EXAME OU DEFESA<input name="periodo_evento" required placeholder="10 a 12 de outubro"></label>
        <label>CIDADE DO EVENTO, EXAME OU DEFESA<input name="cidade_evento" required placeholder="São Paulo"></label>
        <label>ESTADO DO EVENTO, EXAME OU DEFESA<input name="estado_evento" required placeholder="SP"></label>
        <label>PAÍS DO EVENTO, EXAME OU DEFESA<input name="pais_evento" required placeholder="Brasil"></label>
        <label>LINK DO EVENTO, EXAME OU DEFESA<input name="link_evento" placeholder="https://exemplo.com"></label>
        <label>VALOR SOLICITADO (R$)<input name="valor_solicitado" required inputmode="numeric" placeholder="1500" data-formato="moeda"></label>
        <label class="inteiro">DETALHAMENTO DO PEDIDO<textarea name="detalhamento" required rows="2" placeholder="Passagem aérea, duas diárias de hotel e inscrição"></textarea></label>
        <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?<select name="apresentacao" required><option value=""></option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
      </fieldset>
      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <label>DATA DE NASCIMENTO<input name="data_nascimento" required inputmode="numeric" placeholder="01/02/1980" data-formato="data"></label>
        <label>LOGRADOURO<input name="logradouro" required placeholder="Rua do Matão"></label>
        <label>NÚMERO<input name="numero" required placeholder="1010"></label>
        <label>COMPLEMENTO<input name="complemento" placeholder="Predio 3"></label>
        <label>BAIRRO<input name="bairro" required placeholder="Butantã"></label>
        <label>CEP<input name="cep" required inputmode="numeric" placeholder="05508-090" data-formato="cep"></label>
        <label>CIDADE<input name="cidade" required placeholder="São Paulo"></label>
        <label>ESTADO<input name="estado" required placeholder="SP"></label>
      </fieldset>
      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input name="cpf" required inputmode="numeric" placeholder="123.456.789-09" data-formato="cpf"></label>
        <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input name="rg" required placeholder="12.345.678-9"></label>
        <label>NOME DO BANCO<input name="banco" required placeholder="Banco do Brasil"></label>
        <label>NÚMERO DA AGÊNCIA<input name="agencia" required inputmode="numeric" placeholder="1234"></label>
        <label>NÚMERO DA CONTA<input name="conta" required placeholder="56789-0"></label>
      </fieldset>
      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
