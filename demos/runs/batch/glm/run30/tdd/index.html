<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <img src="assets/usp-logo.png" alt="Logotipo da USP">
        <div>
            <h1>Universidade de São Paulo</h1>
            <h2>Instituto de Matemática e Estatística - Pós-Graduação</h2>
        </div>
    </header>
    <main>
        <nav class="abas">
            <button class="aba ativa" data-aba="alunos" type="button">ALUNOS</button>
            <button class="aba" data-aba="docentes" type="button">DOCENTES</button>
        </nav>

        <form id="form-alunos" class="formulario visivel" data-aba="alunos" action="/solicitacao" method="post">
            <div class="erros" aria-live="polite"></div>
            <fieldset>
                <legend>SOLICITANTE E EVENTO</legend>
                <div class="grade">
                    <label>NOME COMPLETO - SEM ABREVIAR
                        <input type="text" name="nome_completo" placeholder="Maria da Silva" required>
                    </label>
                    <label>N. USP
                        <input type="text" name="n_usp" placeholder="12345678" required>
                    </label>
                    <label>PROGRAMA
                        <input type="text" name="programa" placeholder="Matemática" required>
                    </label>
                    <label>NÍVEL
                        <select name="nivel" required>
                            <option value="Mestrado">Mestrado</option>
                            <option value="Doutorado">Doutorado</option>
                        </select>
                    </label>
                    <label>TIPO DE AUXÍLIO
                        <select name="tipo_auxilio" required>
                            <option value="Participação em evento">Participação em evento</option>
                            <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </label>
                    <label>E-MAIL
                        <input type="email" name="email" placeholder="maria@ime.usp.br" required>
                    </label>
                    <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA
                        <input type="text" name="nome_evento" placeholder="Congresso Nacional" required>
                    </label>
                    <label>PERÍODO DO EVENTO, EXAME OU DEFESA
                        <input type="text" name="periodo" placeholder="10 a 12 de julho" required>
                    </label>
                    <label>CIDADE DO EVENTO, EXAME OU DEFESA
                        <input type="text" name="cidade" placeholder="São Paulo" required>
                    </label>
                    <label>ESTADO DO EVENTO, EXAME OU DEFESA
                        <input type="text" name="estado" placeholder="SP" required>
                    </label>
                    <label>PAÍS DO EVENTO, EXAME OU DEFESA
                        <input type="text" name="pais" placeholder="Brasil" required>
                    </label>
                    <label>LINK DO EVENTO, EXAME OU DEFESA
                        <input type="text" name="link" placeholder="http://exemplo.com">
                    </label>
                    <label>VALOR SOLICITADO (R$)
                        <input type="text" name="valor" class="campo-moeda" placeholder="R$ 1.500,00" required>
                    </label>
                    <label>DETALHAMENTO DO PEDIDO
                        <textarea name="detalhamento" placeholder="Inscrição e hospedagem" required></textarea>
                    </label>
                    <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
                        <select name="apresentacao" required>
                            <option value="Pôster">Pôster</option>
                            <option value="Apresentação oral">Apresentação oral</option>
                            <option value="Outra">Outra</option>
                            <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
                        </select>
                    </label>
                </div>
            </fieldset>
            <fieldset>
                <legend>ENDEREÇO DO SOLICITANTE</legend>
                <div class="grade">
                    <label>DATA DE NASCIMENTO
                        <input type="text" name="data_nascimento" class="campo-data" placeholder="01/02/1980" required>
                    </label>
                    <label>LOGRADOURO
                        <input type="text" name="logradouro" placeholder="Rua do Matão" required>
                    </label>
                    <label>NÚMERO
                        <input type="text" name="numero" placeholder="1010" required>
                    </label>
                    <label>COMPLEMENTO
                        <input type="text" name="complemento" placeholder="Apto 101">
                    </label>
                    <label>BAIRRO
                        <input type="text" name="bairro" placeholder="Butantã" required>
                    </label>
                    <label>CEP
                        <input type="text" name="cep" class="campo-cep" placeholder="05508-090" required>
                    </label>
                    <label>CIDADE
                        <input type="text" name="cidade_end" placeholder="São Paulo" required>
                    </label>
                    <label>ESTADO
                        <input type="text" name="estado_end" placeholder="SP" required>
                    </label>
                </div>
            </fieldset>
            <fieldset>
                <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
                <div class="grade">
                    <label>CPF (SEPARADOS POR PONTOS E TRAÇO)
                        <input type="text" name="cpf" class="campo-cpf" placeholder="123.456.789-09" required>
                    </label>
                    <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
                        <input type="text" name="rg" placeholder="12.345.678-9" required>
                    </label>
                    <label>NOME DO BANCO
                        <input type="text" name="banco" placeholder="Banco do Brasil" required>
                    </label>
                    <label>NÚMERO DA AGÊNCIA
                        <input type="text" name="agencia" placeholder="1234" required>
                    </label>
                    <label>NÚMERO DA CONTA
                        <input type="text" name="conta" placeholder="56789-0" required>
                    </label>
                </div>
            </fieldset>
            <input type="hidden" name="aba" value="alunos">
            <button type="submit" class="enviar">Enviar solicitação</button>
        </form>

                        <select name="apresentacao" required>

            <fieldset>

                    </label>
                    <label>LOGRADOURO

                    </label>
                    <label>BAIRRO

                    </label>
                    <label>CEP
                        <input type="text" name="cep" class="campo-cep" placeholder="05508-090" required>
                    </label>
                    <label>CIDADE
                        <input type="text" name="cidade_end" placeholder="São Paulo" required>
                    </label>
                    <label>ESTADO
                        <input type="text" name="estado_end" placeholder="SP" required>
                    </label>
                </div>
            </fieldset>
            <fieldset>
                <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
                <div class="grade">
                    <label>CPF (SEPARADOS POR PONTOS E TRAÇO)
                        <input type="text" name="cpf" class="campo-cpf" placeholder="123.456.789-09" required>
                    </label>
                    <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
                        <input type="text" name="rg" placeholder="12.345.678-9" required>
                    </label>
                    <label>NOME DO BANCO
                        <input type="text" name="banco" placeholder="Banco do Brasil" required>
                    </label>
                    <label>NÚMERO DA AGÊNCIA
                        <input type="text" name="agencia" placeholder="1234" required>
                    </label>
                    <label>NÚMERO DA CONTA
                        <input type="text" name="conta" placeholder="56789-0" required>
                    </label>
                </div>
            </fieldset>
            <input type="hidden" name="aba" value="docentes">
            <button type="submit" class="enviar">Enviar solicitação</button>
        </form>

        <section id="confirmacao" class="confirmacao" hidden>
            <h2>Solicitação registrada</h2>
            <pre id="oficio"></pre>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
