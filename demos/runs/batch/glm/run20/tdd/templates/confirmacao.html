<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação - Auxílio Financeiro IME-USP</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page-confirmation">

    <header class="usp-header">
        <div class="usp-header__logo">
            <a href="https://www.usp.br" target="_blank" rel="noopener">
                <img src="/static/img/usp-logo.png" alt="Logotipo da Universidade de São Paulo" class="usp-header__logo-img">
            </a>
        </div>
        <div class="usp-header__titles">
            <h1 class="usp-header__institution">Universidade de São Paulo</h1>
            <p class="usp-header__subtitle">Instituto de Matemática e Estatística</p>
            <p class="usp-header__program">Pós-Graduação</p>
        </div>
    </header>

    <main class="page-confirmation__content">
        <h1 class="page-confirmation__title">Solicitação registrada</h1>

        <section class="oficio">
            <h2 class="oficio__title">Ofício de Solicitação</h2>
            <pre class="oficio__text">{{ oficio }}</pre>
        </section>
    </main>

    <script src="/static/js/confirmation.js"></script>
</body>
</html>
