<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <img src="assets/usp-logo.png" alt="Logo USP">
    <div>
      <h1>Universidade de São Paulo</h1>
      <h2>Pós-Graduação do IME-USP</h2>
    </div>
  </header>
  <main>
    <nav class="abas">
      <button class="aba ativa" data-aba="alunos">ALUNOS</button>
      <button class="aba" data-aba="docentes">DOCENTES</button>
    </nav>
    <section id="alunos" class="formulario ativo">
      <form id="form-alunos">
        <div class="erros"></div>
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="campos">
            <label>NOME COMPLETO - SEM ABREVIAR<input name="nome" placeholder="Maria da Silva Santos"></label>
            <label>N. USP<input name="n_usp" placeholder="12345678" inputmode="numeric"></label>
            <label>PROGRAMA<input name="programa" placeholder="Matemática"></label>
            <label>NÍVEL<select name="nivel"><option>Mestrado</option><option>Doutorado</option></select></label>
            <label>TIPO DE AUXÍLIO<select name="tipo_auxilio"><option>Participação em evento</option><option>Banca de exame ou defesa</option><option>Outro</option></select></label>
            <label>E-MAIL<input type="email" name="email" placeholder="maria.santos@ime.usp.br"></label>
            <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA<input name="evento" placeholder="XXX Congresso Nacional de Matemática"></label>
            <label>PERÍODO DO EVENTO, EXAME OU DEFESA<input name="periodo" placeholder="10 a 12 de outubro de 2025"></label>
            <label>CIDADE DO EVENTO, EXAME OU DEFESA<input name="cidade_evento" placeholder="São Paulo"></label>
            <label>ESTADO DO EVENTO, EXAME OU DEFESA<input name="estado_evento" placeholder="SP"></label>
            <label>PAÍS DO EVENTO, EXAME OU DEFESA<input name="pais_evento" placeholder="Brasil"></label>
            <label>LINK DO EVENTO, EXAME OU DEFESA<input name="link" placeholder="https://exemplo.br/congresso"></label>
            <label>VALOR SOLICITADO (R$)<input name="valor" placeholder="150000" inputmode="numeric"></label>
            <label class="largo">DETALHAMENTO DO PEDIDO<textarea name="detalhamento" rows="2" placeholder="Inscrição no evento e passagens aéreas"></textarea></label>
            <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?<select name="apresentacao"><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="campos">
            <label>DATA DE NASCIMENTO<input name="data_nascimento" placeholder="01/02/1980" inputmode="numeric"></label>
            <label>LOGRADOURO<input name="logradouro" placeholder="Rua do Matão"></label>
            <label>NÚMERO<input name="numero" placeholder="1010"></label>
            <label>COMPLEMENTO<input name="complemento" placeholder="Prédio C"></label>
            <label>BAIRRO<input name="bairro" placeholder="Cidade Universitária"></label>
            <label>CEP<input name="cep" placeholder="05508-090" inputmode="numeric"></label>
            <label>CIDADE<input name="cidade" placeholder="São Paulo"></label>
            <label>ESTADO<input name="estado" placeholder="SP"></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="campos">
            <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input name="cpf" placeholder="123.456.789-09" inputmode="numeric"></label>
            <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input name="rg" placeholder="12.345.678-9"></label>
            <label>NOME DO BANCO<input name="banco" placeholder="Banco do Brasil"></label>
            <label>NÚMERO DA AGÊNCIA<input name="agencia" placeholder="1234" inputmode="numeric"></label>
            <label>NÚMERO DA CONTA<input name="conta" placeholder="56789-0"></label>
          </div>
        </fieldset>
        <button type="submit">Enviar solicitação</button>
      </form>
    </section>
    <section id="docentes" class="formulario">
      <form id="form-docentes">
        <div class="erros"></div>
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="campos">
            <label>NOME COMPLETO - SEM ABREVIAR<input name="nome" placeholder="João Carlos de Oliveira"></label>
            <label>N. USP<input name="n_usp" placeholder="87654321" inputmode="numeric"></label>
            <label>PROGRAMA<input name="programa" placeholder="Estatística"></label>
            <label>E-MAIL<input type="email" name="email" placeholder="joao.carlos@ime.usp.br"></label>
            <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA<input name="evento" placeholder="XXX Congresso Nacional de Matemática"></label>
            <label>PERÍODO DO EVENTO, EXAME OU DEFESA<input name="periodo" placeholder="10 a 12 de outubro de 2025"></label>
            <label>CIDADE DO EVENTO, EXAME OU DEFESA<input name="cidade_evento" placeholder="São Paulo"></label>
            <label>ESTADO DO EVENTO, EXAME OU DEFESA<input name="estado_evento" placeholder="SP"></label>
            <label>PAÍS DO EVENTO, EXAME OU DEFESA<input name="pais_evento" placeholder="Brasil"></label>
            <label>LINK DO EVENTO, EXAME OU DEFESA<input name="link" placeholder="https://exemplo.br/congresso"></label>
            <label>VALOR SOLICITADO (R$)<input name="valor" placeholder="150000" inputmode="numeric"></label>
            <label class="largo">DETALHAMENTO DO PEDIDO<textarea name="detalhamento" rows="2" placeholder="Inscrição no evento e passagens aéreas"></textarea></label>
            <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?<select name="apresentacao"><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="campos">
            <label>DATA DE NASCIMENTO<input name="data_nascimento" placeholder="01/02/1980" inputmode="numeric"></label>
            <label>LOGRADOURO<input name="logradouro" placeholder="Rua do Matão"></label>
            <label>NÚMERO<input name="numero" placeholder="1010"></label>
            <label>COMPLEMENTO<input name="complemento" placeholder="Prédio C"></label>
            <label>BAIRRO<input name="bairro" placeholder="Cidade Universitária"></label>
            <label>CEP<input name="cep" placeholder="05508-090" inputmode="numeric"></label>
            <label>CIDADE<input name="cidade" placeholder="São Paulo"></label>
            <label>ESTADO<input name="estado" placeholder="SP"></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="campos">
            <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input name="cpf" placeholder="529.982.247-25" inputmode="numeric"></label>
            <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input name="rg" placeholder="12.345.678-9"></label>
            <label>NOME DO BANCO<input name="banco" placeholder="Banco do Brasil"></label>
            <label>NÚMERO DA AGÊNCIA<input name="agencia" placeholder="1234" inputmode="numeric"></label>
            <label>NÚMERO DA CONTA<input name="conta" placeholder="56789-0"></label>
          </div>
        </fieldset>
        <button type="submit">Enviar solicitação</button>
      </form>
    </section>
  </main>
  <div id="confirmacao" class="oculto">
    <h3>Solicitação registrada</h3>
    <pre id="oficio"></pre>
    <button id="nova-solicitacao">Nova solicitação</button>
  </div>
  <script src="/app.js"></script>
</body>
</html>
