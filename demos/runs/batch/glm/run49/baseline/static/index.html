<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="cabecalho">
    <img src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo" class="logo">
    <div class="cabecalho-texto">
      <h1>Universidade de São Paulo</h1>
      <h2>Instituto de Matemática e Estatística</h2>
    </div>
  </header>

  <main class="container">
    <nav class="abas">
      <button class="aba ativa" data-aba="alunos" id="aba-alunos">ALUNOS</button>
      <button class="aba" data-aba="docentes" id="aba-docentes">DOCENTES</button>
    </nav>

    <form id="form-alunos" class="painel ativo" data-aba="alunos">
      <div class="erros"></div>
      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grid">
          <label>NOME COMPLETO - SEM ABREVIAR<input type="text" name="nome_completo" placeholder="Ex.: Maria da Silva Santos" required></label>
          <label>N. USP<input type="text" name="n_usp" placeholder="Ex.: 12345678" required></label>
          <label>PROGRAMA<input type="text" name="programa" placeholder="Ex.: Matemática" required></label>
          <label>NÍVEL<select name="nivel" required><option value="">Selecione...</option><option>Mestrado</option><option>Doutorado</option></select></label>
          <label>TIPO DE AUXÍLIO<select name="tipo_auxilio" required><option value="">Selecione...</option><option>Participação em evento</option><option>Banca de exame ou defesa</option><option>Outro</option></select></label>
          <label>E-MAIL<input type="email" name="email" placeholder="Ex.: maria@ime.usp.br" required></label>
          <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA<input type="text" name="evento_nome" placeholder="Ex.: XII Encontro Brasileiro de Estatística" required></label>
          <label>PERÍODO DO EVENTO, EXAME OU DEFESA<input type="text" name="periodo" placeholder="Ex.: 15 a 20 de julho de 2025" required></label>
          <label>CIDADE DO EVENTO, EXAME OU DEFESA<input type="text" name="cidade_evento" placeholder="Ex.: São Paulo" required></label>
          <label>ESTADO DO EVENTO, EXAME OU DEFESA<input type="text" name="estado_evento" placeholder="Ex.: SP" required></label>
          <label>PAÍS DO EVENTO, EXAME OU DEFESA<input type="text" name="pais_evento" placeholder="Ex.: Brasil" required></label>
          <label>LINK DO EVENTO, EXAME OU DEFESA<input type="text" name="link_evento" placeholder="Ex.: https://evento.com.br"></label>
          <label>VALOR SOLICITADO (R$)<input type="text" name="valor" placeholder="Ex.: 1500,00" required></label>
          <label class="duplo">DETALHAMENTO DO PEDIDO<textarea name="detalhamento" rows="3" placeholder="Ex.: Passagem aérea, diárias de hotel, inscrição no evento" required></textarea></label>
          <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?<select name="apresentacao" required><option value="">Selecione...</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grid">
          <label>DATA DE NASCIMENTO<input type="text" name="nascimento" placeholder="Ex.: 01/02/1980" required></label>
          <label>LOGRADOURO<input type="text" name="logradouro" placeholder="Ex.: Rua Oscar Freire" required></label>
          <label>NÚMERO<input type="text" name="numero" placeholder="Ex.: 123" required></label>
          <label>COMPLEMENTO<input type="text" name="complemento" placeholder="Ex.: Apto 45"></label>
          <label>BAIRRO<input type="text" name="bairro" placeholder="Ex.: Jardins" required></label>
          <label>CEP<input type="text" name="cep" placeholder="Ex.: 05508-090" required></label>
          <label>CIDADE<input type="text" name="cidade" placeholder="Ex.: São Paulo" required></label>
          <label>ESTADO<input type="text" name="estado" placeholder="Ex.: SP" required></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grid">
          <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input type="text" name="cpf" placeholder="Ex.: 123.456.789-09" required></label>
          <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input type="text" name="rg" placeholder="Ex.: 12.345.678-9" required></label>
          <label>NOME DO BANCO<input type="text" name="banco" placeholder="Ex.: Banco do Brasil" required></label>
          <label>NÚMERO DA AGÊNCIA<input type="text" name="agencia" placeholder="Ex.: 1234" required></label>
          <label>NÚMERO DA CONTA<input type="text" name="conta" placeholder="Ex.: 12345-6" required></label>
        </div>
      </fieldset>

      <button type="submit">Enviar solicitação</button>
    </form>

    <form id="form-docentes" class="painel" data-aba="docentes">
      <div class="erros"></div>
      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grid">
          <label>NOME COMPLETO - SEM ABREVIAR<input type="text" name="nome_completo" placeholder="Ex.: João Carlos Pereira" required></label>
          <label>N. USP<input type="text" name="n_usp" placeholder="Ex.: 87654321" required></label>
          <label>PROGRAMA<input type="text" name="programa" placeholder="Ex.: Ciência da Computação" required></label>
          <label>E-MAIL<input type="email" name="email" placeholder="Ex.: joao@ime.usp.br" required></label>
          <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA<input type="text" name="evento_nome" placeholder="Ex.: Banca de defesa de doutorado" required></label>
          <label>PERÍODO DO EVENTO, EXAME OU DEFESA<input type="text" name="periodo" placeholder="Ex.: 10 de agosto de 2025" required></label>
          <label>CIDADE DO EVENTO, EXAME OU DEFESA<input type="text" name="cidade_evento" placeholder="Ex.: São Paulo" required></label>
          <label>ESTADO DO EVENTO, EXAME OU DEFESA<input type="text" name="estado_evento" placeholder="Ex.: SP" required></label>
          <label>PAÍS DO EVENTO, EXAME OU DEFESA<input type="text" name="pais_evento" placeholder="Ex.: Brasil" required></label>
          <label>LINK DO EVENTO, EXAME OU DEFESA<input type="text" name="link_evento" placeholder="Ex.: https://evento.com.br"></label>
          <label>VALOR SOLICITADO (R$)<input type="text" name="valor" placeholder="Ex.: 2500,00" required></label>
          <label class="duplo">DETALHAMENTO DO PEDIDO<textarea name="detalhamento" rows="3" placeholder="Ex.: Passagem aérea, diárias de hotel" required></textarea></label>
          <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?<select name="apresentacao" required><option value="">Selecione...</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grid">
          <label>DATA DE NASCIMENTO<input type="text" name="nascimento" placeholder="Ex.: 01/02/1980" required></label>
          <label>LOGRADOURO<input type="text" name="logradouro" placeholder="Ex.: Avenida Paulista" required></label>
          <label>NÚMERO<input type="text" name="numero" placeholder="Ex.: 500" required></label>
          <label>COMPLEMENTO<input type="text" name="complemento" placeholder="Ex.: Sala 12"></label>
          <label>BAIRRO<input type="text" name="bairro" placeholder="Ex.: Bela Vista" required></label>
          <label>CEP<input type="text" name="cep" placeholder="Ex.: 01310-100" required></label>
          <label>CIDADE<input type="text" name="cidade" placeholder="Ex.: São Paulo" required></label>
          <label>ESTADO<input type="text" name="estado" placeholder="Ex.: SP" required></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grid">
          <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input type="text" name="cpf" placeholder="Ex.: 987.654.321-00" required></label>
          <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input type="text" name="rg" placeholder="Ex.: 98.765.432-1" required></label>
          <label>NOME DO BANCO<input type="text" name="banco" placeholder="Ex.: Itaú" required></label>
          <label>NÚMERO DA AGÊNCIA<input type="text" name="agencia" placeholder="Ex.: 5678" required></label>
          <label>NÚMERO DA CONTA<input type="text" name="conta" placeholder="Ex.: 98765-4" required></label>
        </div>
      </fieldset>

      <button type="submit">Enviar solicitação</button>
    </form>
  </main>

  <div id="confirmacao" class="confirmacao" style="display:none;">
    <h1>Solicitação registrada</h1>
    <pre id="oficio"></pre>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
