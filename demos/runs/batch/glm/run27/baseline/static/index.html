  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="usp-header">
      <img src="/static/usp-logo.png" alt="Logotipo da USP">
      <div>
        <h1>Universidade de São Paulo</h1>
        <h2>Instituto de Matemática e Estatística - Pós-Graduação</h2>
      </div>
    </header>
    <nav class="tabs">
      <button class="tab active" id="tab-alunos">ALUNOS</button>
      <button class="tab" id="tab-docentes">DOCENTES</button>
    </nav>
    <main>
      <section id="form-alunos" class="form-panel active">
        <div class="error-box" id="err-alunos"></div>
        <form id="solic-alunos" data-aba="alunos">
          <fieldset>
            <legend>SOLICITANTE E EVENTO</legend>
            <div class="grid">
              <label class="c2">NOME COMPLETO - SEM ABREVIAR<input name="nome" placeholder="Ex.: Maria da Silva Santos"></label>
              <label>N. USP<input name="nusp" placeholder="Ex.: 12345678"></label>
              <label>PROGRAMA<input name="programa" placeholder="Ex.: Matemática"></label>
              <label>NÍVEL
                <select name="nivel"><option value="">Selecione</option><option>Mestrado</option><option>Doutorado</option></select>
              </label>
              <label>TIPO DE AUXÍLIO
                <select name="tipo"><option value="">Selecione</option><option>Participação em evento</option><option>Banca de exame ou defesa</option><option>Outro</option></select>
              </label>
              <label class="c2">E-MAIL<input name="email" type="email" placeholder="Ex.: nome@usp.br"></label>
              <label class="c2">NOME DO EVENTO / BANCA DE EXAME OU DEFESA<input name="evento_nome" placeholder="Ex.: XXXIII Congresso..."></label>
              <label class="c2">PERÍODO DO EVENTO, EXAME OU DEFESA<input name="periodo" placeholder="Ex.: 10 a 12 de julho de 2025"></label>
              <label>CIDADE DO EVENTO, EXAME OU DEFESA<input name="evento_cidade" placeholder="Ex.: São Paulo"></label>
              <label>ESTADO DO EVENTO, EXAME OU DEFESA<input name="evento_estado" placeholder="Ex.: SP"></label>
              <label>PAÍS DO EVENTO, EXAME OU DEFESA<input name="evento_pais" placeholder="Ex.: Brasil"></label>
              <label class="c2">LINK DO EVENTO, EXAME OU DEFESA<input name="evento_link" placeholder="Ex.: https://exemplo.com.br"></label>
              <label>VALOR SOLICITADO (R$)<input name="valor" placeholder="Ex.: 1500" data-mask="moeda"></label>
              <label class="c2">DETALHAMENTO DO PEDIDO<textarea name="detalhamento" rows="2" placeholder="Ex.: Inscrição e diárias"></label>
              <label class="c2">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
                <select name="apresentacao"><option value="">Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select>
              </label>
            </div>
          </fieldset>
          <fieldset>
            <legend>ENDEREÇO DO SOLICITANTE</legend>
            <div class="grid">
              <label>DATA DE NASCIMENTO<input name="nascimento" placeholder="Ex.: 01021980" data-mask="data"></label>
              <label class="c2">LOGRADOURO<input name="logradouro" placeholder="Ex.: Rua do Matão"></label>
              <label>NÚMERO<input name="numero" placeholder="Ex.: 1010"></label>
              <label>COMPLEMENTO<input name="complemento" placeholder="Ex.: Predio 2"></label>
              <label>BAIRRO<input name="bairro" placeholder="Ex.: Butantã"></label>
              <label>CEP<input name="cep" placeholder="Ex.: 05508090" data-mask="cep"></label>
              <label>CIDADE<input name="cidade" placeholder="Ex.: São Paulo"></label>
              <label>ESTADO<input name="estado" placeholder="Ex.: SP"></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
            <div class="grid">
              <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input name="cpf" placeholder="Ex.: 123.456.789-09" data-mask="cpf"></label>
              <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input name="rg" placeholder="Ex.: 12.345.678-9"></label>
              <label>NOME DO BANCO<input name="banco" placeholder="Ex.: Banco do Brasil"></label>
              <label>NÚMERO DA AGÊNCIA<input name="agencia" placeholder="Ex.: 1234"></label>
              <label>NÚMERO DA CONTA<input name="conta" placeholder="Ex.: 12345-6"></label>
            </div>
          </fieldset>
          <button type="submit">Enviar solicitação</button>
        </form>
      </section>
      <section id="form-docentes" class="form-panel">
        <div class="error-box" id="err-docentes"></div>
        <form id="solic-docentes" data-aba="docentes">

            <legend>SOLICITANTE E EVENTO</legend>

              <label>CIDADE DO EVENTO, EXAME OU DEFESA<input name="evento_cidade" placeholder="Ex.: São Paulo"></label>
              <label>ESTADO DO EVENTO, EXAME OU DEFESA<input name="evento_estado" placeholder="Ex.: SP"></label>
              <label>PAÍS DO EVENTO, EXAME OU DEFESA<input name="evento_pais" placeholder="Ex.: Brasil"></label>
              <label class="c2">LINK DO EVENTO, EXAME OU DEFESA<input name="evento_link" placeholder="Ex.: https://exemplo.com.br"></label>
              <label>VALOR SOLICITADO (R$)<input name="valor" placeholder="Ex.: 1500" data-mask="moeda"></label>
              <label class="c2">DETALHAMENTO DO PEDIDO<textarea name="detalhamento" rows="2" placeholder="Ex.: Inscrição e diárias"></label>
              <label class="c2">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
                <select name="apresentacao"><option value="">Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select>
              </label>
            </div>
          </fieldset>
          <fieldset>
            <legend>ENDEREÇO DO SOLICITANTE</legend>
            <div class="grid">
              <label>DATA DE NASCIMENTO<input name="nascimento" placeholder="Ex.: 01021980" data-mask="data"></label>
              <label class="c2">LOGRADOURO<input name="logradouro" placeholder="Ex.: Rua do Matão"></label>
              <label>NÚMERO<input name="numero" placeholder="Ex.: 1010"></label>
              <label>COMPLEMENTO<input name="complemento" placeholder="Ex.: Predio 2"></label>
              <label>BAIRRO<input name="bairro" placeholder="Ex.: Butantã"></label>
              <label>CEP<input name="cep" placeholder="Ex.: 05508090" data-mask="cep"></label>
              <label>CIDADE<input name="cidade" placeholder="Ex.: São Paulo"></label>
              <label>ESTADO<input name="estado" placeholder="Ex.: SP"></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
            <div class="grid">
              <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input name="cpf" placeholder="Ex.: 123.456.789-09" data-mask="cpf"></label>
              <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input name="rg" placeholder="Ex.: 12.345.678-9"></label>
              <label>NOME DO BANCO<input name="banco" placeholder="Ex.: Banco do Brasil"></label>
              <label>NÚMERO DA AGÊNCIA<input name="agencia" placeholder="Ex.: 1234"></label>
              <label>NÚMERO DA CONTA<input name="conta" placeholder="Ex.: 12345-6"></label>
            </div>
          </fieldset>
          <button type="submit">Enviar solicitação</button>
        </form>
      </section>
      <section id="confirmacao" class="hidden">
        <h1>Solicitação registrada</h1>
        <pre id="oficio"></pre>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
  </html>
