<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel='stylesheet' href='/static/style.css'>
</head>
<body>
  <header class='cabecalho'>
    <div class='institucional'>
      <div class='logo-area'>
        <img src='/static/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
      </div>
      <div class='institucional-texto'>
        <p class='universidade'>Universidade de São Paulo</p>
        <p class='programa'>Programa de Pós-Graduação do Instituto de Matemática e Estatística</p>
      </div>
    </div>
  </header>

  <main class='pagina'>
    <nav class='abas' aria-label='Perfil do solicitante'>
      <button type='button' class='aba ativa' data-aba='alunos'>ALUNOS</button>
      <button type='button' class='aba' data-aba='docentes'>DOCENTES</button>
    </nav>

    <form id='form-alunos' class='form' data-aba='alunos' novalidate>
      <div class='erros' hidden></div>

      <section class='bloco'>
        <h2>SOLICITANTE E EVENTO</h2>
        <div class='grid'>
          <p class='campo s5'>
            <label for='a-nome'>NOME COMPLETO - SEM ABREVIAR</label>
            <input id='a-nome' name='nome' type='text' placeholder='Ex.: Maria da Silva Souza' required>
          </p>
          <p class='campo'>
            <label for='a-nusp'>N. USP</label>
            <input id='a-nusp' name='n_usp' type='text' inputmode='numeric' placeholder='Ex.: 12345678' required>
          </p>
          <p class='campo s3'>
            <label for='a-programa'>PROGRAMA</label>
            <input id='a-programa' name='programa' type='text' placeholder='Ex.: Matemática' required>
          </p>
          <p class='campo'>
            <label for='a-nivel'>NÍVEL</label>
            <select id='a-nivel' name='nivel' required>
              <option value=''>Ex.: Mestrado</option>
              <option value='Mestrado'>Mestrado</option>
              <option value='Doutorado'>Doutorado</option>
            </select>
          </p>
          <p class='campo s4'>
            <label for='a-tipo'>TIPO DE AUXÍLIO</label>
            <select id='a-tipo' name='tipo' required>
              <option value=''>Ex.: Participação em evento</option>
              <option value='Participação em evento'>Participação em evento</option>
              <option value='Banca de exame ou defesa'>Banca de exame ou defesa</option>
              <option value='Outro'>Outro</option>
            </select>
          </p>
          <p class='campo s4'>
            <label for='a-email'>E-MAIL</label>
            <input id='a-email' name='email' type='email' placeholder='Ex.: maria@ime.usp.br' required>
          </p>
          <p class='campo s4'>
            <label for='a-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id='a-evento' name='evento' type='text' placeholder='Ex.: Congresso Nacional de Matemática' required>
          </p>
          <p class='campo s3'>
            <label for='a-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id='a-periodo' name='periodo' type='text' placeholder='Ex.: 10 a 12 de outubro de 2025' required>
          </p>
          <p class='campo s3'>
            <label for='a-cidade'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id='a-cidade' name='cidade' type='text' placeholder='Ex.: São Paulo' required>
          </p>
          <p class='campo'>
            <label for='a-estado'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id='a-estado' name='estado' type='text' placeholder='Ex.: SP' required>
          </p>
          <p class='campo'>
            <label for='a-pais'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id='a-pais' name='pais' type='text' placeholder='Ex.: Brasil' required>
          </p>
          <p class='campo'>
            <label for='a-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id='a-link' name='link' type='text' placeholder='Ex.: https://exemplo.com.br'>
          </p>
          <p class='campo'>
            <label for='a-valor'>VALOR SOLICITADO (R$)</label>
            <input id='a-valor' name='valor' type='text' inputmode='numeric' data-formato='valor' placeholder='Ex.: 150000 (R$ 1.500,00)' required>
          </p>
          <p class='campo s7'>
            <label for='a-detalhamento'>DETALHAMENTO DO PEDIDO</label>
            <textarea id='a-detalhamento' name='detalhamento' rows='2' placeholder='Ex.: Inscrição no evento e passagens aéreas.' required></textarea>
          </p>
          <p class='campo s3'>
            <label for='a-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id='a-apresentacao' name='apresentacao' required>
              <option value=''>Ex.: Pôster</option>
              <option value='Pôster'>Pôster</option>
              <option value='Apresentação oral'>Apresentação oral</option>
              <option value='Outra'>Outra</option>
              <option value='Não irá apresentar trabalho'>Não irá apresentar trabalho</option>
            </select>
          </p>
        </div>
      </section>

      <section class='bloco'>
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class='grid'>
          <p class='campo'>
            <label for='a-nascimento'>DATA DE NASCIMENTO</label>
            <input id='a-nascimento' name='nascimento' type='text' inputmode='numeric' data-formato='data' placeholder='Ex.: 01021980' required>
          </p>
          <p class='campo s4'>
            <label for='a-logradouro'>LOGRADOURO</label>
            <input id='a-logradouro' name='logradouro' type='text' placeholder='Ex.: Rua do Matão' required>
          </p>
          <p class='campo'>
            <label for='a-numero'>NÚMERO</label>
            <input id='a-numero' name='numero' type='text' placeholder='Ex.: 1010' required>
          </p>
          <p class='campo'>
            <label for='a-complemento'>COMPLEMENTO</label>
            <input id='a-complemento' name='complemento' type='text' placeholder='Ex.: Apto 12'>
          </p>
          <p class='campo'>
            <label for='a-bairro'>BAIRRO</label>
            <input id='a-bairro' name='bairro' type='text' placeholder='Ex.: Butantã' required>
          </p>
          <p class='campo'>
            <label for='a-cep'>CEP</label>
            <input id='a-cep' name='cep' type='text' inputmode='numeric' data-formato='cep' placeholder='Ex.: 05508090' required>
          </p>
          <p class='campo s6'>
            <label for='a-cidade-endereco'>CIDADE</label>
            <input id='a-cidade-endereco' name='cidade_endereco' type='text' placeholder='Ex.: São Paulo' required>
          </p>
          <p class='campo s4'>
            <label for='a-estado-endereco'>ESTADO</label>
            <input id='a-estado-endereco' name='estado_endereco' type='text' placeholder='Ex.: SP' required>
          </p>
        </div>
      </section>

      <section class='bloco'>
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class='grid'>
          <p class='campo s3'>
            <label for='a-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id='a-cpf' name='cpf' type='text' inputmode='numeric' data-formato='cpf' placeholder='Ex.: 12345678909' required>
          </p>
          <p class='campo s3'>
            <label for='a-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id='a-rg' name='rg' type='text' placeholder='Ex.: 12.345.678-9' required>
          </p>
          <p class='campo'>
            <label for='a-banco'>NOME DO BANCO</label>
            <input id='a-banco' name='banco' type='text' placeholder='Ex.: Banco do Brasil' required>
          </p>
          <p class='campo'>
            <label for='a-agencia'>NÚMERO DA AGÊNCIA</label>
            <input id='a-agencia' name='agencia' type='text' inputmode='numeric' placeholder='Ex.: 1234' required>
          </p>
          <p class='campo'>
            <label for='a-conta'>NÚMERO DA CONTA</label>
            <input id='a-conta' name='conta' type='text' placeholder='Ex.: 12345-6' required>
          </p>
        </div>
      </section>

      <button type='submit' class='enviar'>Enviar solicitação</button>
    </form>

    <form id='form-docentes' class='form' data-aba='docentes' hidden novalidate>
      <div class='erros' hidden></div>

      <section class='bloco'>
        <h2>SOLICITANTE E EVENTO</h2>
        <div class='grid'>
          <p class='campo s5'>
            <label for='d-nome'>NOME COMPLETO - SEM ABREVIAR</label>
            <input id='d-nome' name='nome' type='text' placeholder='Ex.: João Cardoso de Almeida' required>
          </p>
          <p class='campo'>
            <label for='d-nusp'>N. USP</label>
            <input id='d-nusp' name='n_usp' type='text' inputmode='numeric' placeholder='Ex.: 9876543' required>
          </p>
          <p class='campo s5'>
            <label for='d-programa'>PROGRAMA</label>
            <input id='d-programa' name='programa' type='text' placeholder='Ex.: Matemática' required>
          </p>
          <p class='campo s4'>
            <label for='d-email'>E-MAIL</label>
            <input id='d-email' name='email' type='email' placeholder='Ex.: joao@ime.usp.br' required>
          </p>
          <p class='campo s5'>
            <label for='d-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id='d-evento' name='evento' type='text' placeholder='Ex.: Congresso Nacional de Matemática' required>
          </p>
          <p class='campo s3'>
            <label for='d-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id='d-periodo' name='periodo' type='text' placeholder='Ex.: 10 a 12 de outubro de 2025' required>
          </p>
          <p class='campo s3'>
            <label for='d-cidade'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id='d-cidade' name='cidade' type='text' placeholder='Ex.: São Paulo' required>
          </p>
          <p class='campo'>
            <label for='d-estado'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id='d-estado' name='estado' type='text' placeholder='Ex.: SP' required>
          </p>
          <p class='campo'>
            <label for='d-pais'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id='d-pais' name='pais' type='text' placeholder='Ex.: Brasil' required>
          </p>
          <p class='campo'>
            <label for='d-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id='d-link' name='link' type='text' placeholder='Ex.: https://exemplo.com.br'>
          </p>
          <p class='campo s3'>
            <label for='d-valor'>VALOR SOLICITADO (R$)</label>
            <input id='d-valor' name='valor' type='text' inputmode='numeric' data-formato='valor' placeholder='Ex.: 150000 (R$ 1.500,00)' required>
          </p>
          <p class='campo s8'>
            <label for='d-detalhamento'>DETALHAMENTO DO PEDIDO</label>
            <textarea id='d-detalhamento' name='detalhamento' rows='2' placeholder='Ex.: Inscrição no evento e passagens aéreas.' required></textarea>
          </p>
          <p class='campo s4'>
            <label for='d-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id='d-apresentacao' name='apresentacao' required>
              <option value=''>Ex.: Pôster</option>
              <option value='Pôster'>Pôster</option>
              <option value='Apresentação oral'>Apresentação oral</option>
              <option value='Outra'>Outra</option>
              <option value='Não irá apresentar trabalho'>Não irá apresentar trabalho</option>
            </select>
          </p>
        </div>
      </section>

      <section class='bloco'>
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class='grid'>
          <p class='campo'>
            <label for='d-nascimento'>DATA DE NASCIMENTO</label>
            <input id='d-nascimento' name='nascimento' type='text' inputmode='numeric' data-formato='data' placeholder='Ex.: 01021980' required>
          </p>
          <p class='campo s4'>
            <label for='d-logradouro'>LOGRADOURO</label>
            <input id='d-logradouro' name='logradouro' type='text' placeholder='Ex.: Rua do Matão' required>
          </p>
          <p class='campo'>
            <label for='d-numero'>NÚMERO</label>
            <input id='d-numero' name='numero' type='text' placeholder='Ex.: 1010' required>
          </p>
          <p class='campo'>
            <label for='d-complemento'>COMPLEMENTO</label>
            <input id='d-complemento' name='complemento' type='text' placeholder='Ex.: Apto 12'>
          </p>
          <p class='campo'>
            <label for='d-bairro'>BAIRRO</label>
            <input id='d-bairro' name='bairro' type='text' placeholder='Ex.: Butantã' required>
          </p>
          <p class='campo'>
            <label for='d-cep'>CEP</label>
            <input id='d-cep' name='cep' type='text' inputmode='numeric' data-formato='cep' placeholder='Ex.: 05508090' required>
          </p>
          <p class='campo s6'>
            <label for='d-cidade-endereco'>CIDADE</label>
            <input id='d-cidade-endereco' name='cidade_endereco' type='text' placeholder='Ex.: São Paulo' required>
          </p>
          <p class='campo s4'>
            <label for='d-estado-endereco'>ESTADO</label>
            <input id='d-estado-endereco' name='estado_endereco' type='text' placeholder='Ex.: SP' required>
          </p>
        </div>
      </section>

      <section class='bloco'>
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class='grid'>
          <p class='campo s3'>
            <label for='d-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id='d-cpf' name='cpf' type='text' inputmode='numeric' data-formato='cpf' placeholder='Ex.: 12345678909' required>
          </p>
          <p class='campo s3'>
            <label for='d-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id='d-rg' name='rg' type='text' placeholder='Ex.: 12.345.678-9' required>
          </p>
          <p class='campo'>
            <label for='d-banco'>NOME DO BANCO</label>
            <input id='d-banco' name='banco' type='text' placeholder='Ex.: Banco do Brasil' required>
          </p>
          <p class='campo'>
            <label for='d-agencia'>NÚMERO DA AGÊNCIA</label>
            <input id='d-agencia' name='agencia' type='text' inputmode='numeric' placeholder='Ex.: 1234' required>
          </p>
          <p class='campo'>
            <label for='d-conta'>NÚMERO DA CONTA</label>
            <input id='d-conta' name='conta' type='text' placeholder='Ex.: 12345-6' required>
          </p>
        </div>
      </section>

      <button type='submit' class='enviar'>Enviar solicitação</button>
    </form>

    <section id='confirmacao' class='confirmacao' hidden>
      <h2 id='titulo-confirmacao'>Solicitação registrada</h2>
      <pre id='oficio' class='oficio'></pre>
    </section>
  </main>

  <script src='/static/app.js'></script>
</body>
</html>
