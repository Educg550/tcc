<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="cabecalho">
  <div class="logo">
    <img src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  </div>
  <div class="identidade">
    <p class="universidade">Universidade de São Paulo</p>
    <p class="unidade">Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>

<main class="conteudo">
  <section id="formulario">
    <nav class="abas">
      <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
      <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
    </nav>

    <form id="form-alunos" class="painel" novalidate>
      <div class="erros" id="erros-alunos" hidden></div>

      <section class="bloco">
        <h3>SOLICITANTE E EVENTO</h3>
        <div class="campos">
          <div class="campo largo">
            <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="a-nome" name="nome" type="text" placeholder="Maria da Silva">
          </div>
          <div class="campo">
            <label for="a-nusp">N. USP</label>
            <input id="a-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="1234567">
          </div>
          <div class="campo">
            <label for="a-programa">PROGRAMA</label>
            <input id="a-programa" name="programa" type="text" placeholder="Matemática Aplicada">
          </div>
          <div class="campo">
            <label for="a-nivel">NÍVEL</label>
            <select id="a-nivel" name="nivel">
              <option value="" selected disabled>Selecione o nível</option>
              <option value="Mestrado">Mestrado</option>
              <option value="Doutorado">Doutorado</option>
            </select>
          </div>
          <div class="campo largo">
            <label for="a-tipo-auxilio">TIPO DE AUXÍLIO</label>
            <select id="a-tipo-auxilio" name="tipo_auxilio">
              <option value="" selected disabled>Selecione o tipo de auxílio</option>
              <option value="Participação em evento">Participação em evento</option>
              <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div class="campo largo">
            <label for="a-email">E-MAIL</label>
            <input id="a-email" name="email" type="email" placeholder="maria@ime.usp.br">
          </div>
          <div class="campo largo">
            <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="a-evento" name="evento" type="text" placeholder="XX Congresso Brasileiro de Matemática">
          </div>
          <div class="campo largo">
            <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-periodo" name="periodo" type="text" placeholder="10 a 12 de março de 2025">
          </div>
          <div class="campo">
            <label for="a-cidade">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-cidade" name="cidade" type="text" placeholder="Gramado">
          </div>
          <div class="campo">
            <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-estado-evento" name="estado_evento" type="text" placeholder="RS">
          </div>
          <div class="campo">
            <label for="a-pais">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-pais" name="pais" type="text" placeholder="Brasil">
          </div>
          <div class="campo">
            <label for="a-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-link" name="link" type="text" placeholder="https://www.ime.usp.br/">
          </div>
          <div class="campo">
            <label for="a-valor">VALOR SOLICITADO (R$)</label>
            <input id="a-valor" name="valor" type="text" inputmode="numeric" data-mascara="valor" placeholder="R$ 1.500,00">
          </div>
          <div class="campo amplo">
            <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="a-detalhamento" name="detalhamento" rows="2" placeholder="Inscrição no evento, passagem aérea e diárias"></textarea>
          </div>
          <div class="campo largo">
            <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="a-apresentacao" name="apresentacao">
              <option value="" selected disabled>Selecione a modalidade</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </section>

      <section class="bloco">
        <h3>ENDEREÇO DO SOLICITANTE</h3>
        <div class="campos">
          <div class="campo">
            <label for="a-nascimento">DATA DE NASCIMENTO</label>
            <input id="a-nascimento" name="data_nascimento" type="text" inputmode="numeric" data-mascara="data" placeholder="01/02/1980">
          </div>
          <div class="campo">
            <label for="a-cep">CEP</label>
            <input id="a-cep" name="cep" type="text" inputmode="numeric" data-mascara="cep" placeholder="05508-090">
          </div>
          <div class="campo largo">
            <label for="a-logradouro">LOGRADOURO</label>
            <input id="a-logradouro" name="logradouro" type="text" placeholder="Rua Methódio Fonseca Leal">
          </div>
          <div class="campo">
            <label for="a-numero">NÚMERO</label>
            <input id="a-numero" name="numero" type="text" placeholder="45">
          </div>
          <div class="campo">
            <label for="a-complemento">COMPLEMENTO</label>
            <input id="a-complemento" name="complemento" type="text" placeholder="Apto 12">
          </div>
          <div class="campo">
            <label for="a-bairro">BAIRRO</label>
            <input id="a-bairro" name="bairro" type="text" placeholder="Jardim Leonor">
          </div>
          <div class="campo largo">
            <label for="a-cidade-endereco">CIDADE</label>
            <input id="a-cidade-endereco" name="cidade_endereco" type="text" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="a-estado-endereco">ESTADO</label>
            <input id="a-estado-endereco" name="estado_endereco" type="text" placeholder="SP">
          </div>
        </div>
      </section>

      <section class="bloco">
        <h3>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h3>
        <div class="campos">
          <div class="campo largo">
            <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-cpf" name="cpf" type="text" inputmode="numeric" data-mascara="cpf" placeholder="153.509.460-56">
          </div>
          <div class="campo largo">
            <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-rg" name="rg" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo">
            <label for="a-banco">NOME DO BANCO</label>
            <input id="a-banco" name="banco" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo">
            <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="a-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo">
            <label for="a-conta">NÚMERO DA CONTA</label>
            <input id="a-conta" name="conta" type="text" placeholder="56789-0">
          </div>
        </div>
      </section>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>

    <form id="form-docentes" class="painel" hidden novalidate>
      <div class="erros" id="erros-docentes" hidden></div>

      <section class="bloco">
        <h3>SOLICITANTE E EVENTO</h3>
        <div class="campos">
          <div class="campo largo">
            <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="d-nome" name="nome" type="text" placeholder="João da Silva">
          </div>
          <div class="campo">
            <label for="d-nusp">N. USP</label>
            <input id="d-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="7654321">
          </div>
          <div class="campo largo">
            <label for="d-programa">PROGRAMA</label>
            <input id="d-programa" name="programa" type="text" placeholder="Estatística">
          </div>
          <div class="campo largo">
            <label for="d-email">E-MAIL</label>
            <input id="d-email" name="email" type="email" placeholder="joao@ime.usp.br">
          </div>
          <div class="campo largo">
            <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="d-evento" name="evento" type="text" placeholder="Workshop de Estatística">
          </div>
          <div class="campo largo">
            <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-periodo" name="periodo" type="text" placeholder="10 a 12 de março de 2025">
          </div>
          <div class="campo">
            <label for="d-cidade">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-cidade" name="cidade" type="text" placeholder="Gramado">
          </div>
          <div class="campo">
            <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-estado-evento" name="estado_evento" type="text" placeholder="RS">
          </div>
          <div class="campo">
            <label for="d-pais">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-pais" name="pais" type="text" placeholder="Brasil">
          </div>
          <div class="campo">
            <label for="d-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-link" name="link" type="text" placeholder="https://www.ime.usp.br/">
          </div>
          <div class="campo">
            <label for="d-valor">VALOR SOLICITADO (R$)</label>
            <input id="d-valor" name="valor" type="text" inputmode="numeric" data-mascara="valor" placeholder="R$ 1.500,00">
          </div>
          <div class="campo amplo">
            <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="d-detalhamento" name="detalhamento" rows="2" placeholder="Inscrição no evento, passagem aérea e diárias"></textarea>
          </div>
          <div class="campo largo">
            <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="d-apresentacao" name="apresentacao">
              <option value="" selected disabled>Selecione a modalidade</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </section>

      <section class="bloco">
        <h3>ENDEREÇO DO SOLICITANTE</h3>
        <div class="campos">
          <div class="campo">
            <label for="d-nascimento">DATA DE NASCIMENTO</label>
            <input id="d-nascimento" name="data_nascimento" type="text" inputmode="numeric" data-mascara="data" placeholder="01/02/1980">
          </div>
          <div class="campo">
            <label for="d-cep">CEP</label>
            <input id="d-cep" name="cep" type="text" inputmode="numeric" data-mascara="cep" placeholder="05508-090">
          </div>
          <div class="campo largo">
            <label for="d-logradouro">LOGRADOURO</label>
            <input id="d-logradouro" name="logradouro" type="text" placeholder="Rua Methódio Fonseca Leal">
          </div>
          <div class="campo">
            <label for="d-numero">NÚMERO</label>
            <input id="d-numero" name="numero" type="text" placeholder="45">
          </div>
          <div class="campo">
            <label for="d-complemento">COMPLEMENTO</label>
            <input id="d-complemento" name="complemento" type="text" placeholder="Apto 12">
          </div>
          <div class="campo">
            <label for="d-bairro">BAIRRO</label>
            <input id="d-bairro" name="bairro" type="text" placeholder="Jardim Leonor">
          </div>
          <div class="campo largo">
            <label for="d-cidade-endereco">CIDADE</label>
            <input id="d-cidade-endereco" name="cidade_endereco" type="text" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="d-estado-endereco">ESTADO</label>
            <input id="d-estado-endereco" name="estado_endereco" type="text" placeholder="SP">
          </div>
        </div>
      </section>

      <section class="bloco">
        <h3>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h3>
        <div class="campos">
          <div class="campo largo">
            <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-cpf" name="cpf" type="text" inputmode="numeric" data-mascara="cpf" placeholder="153.509.460-56">
          </div>
          <div class="campo largo">
            <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-rg" name="rg" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo">
            <label for="d-banco">NOME DO BANCO</label>
            <input id="d-banco" name="banco" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo">
            <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="d-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo">
            <label for="d-conta">NÚMERO DA CONTA</label>
            <input id="d-conta" name="conta" type="text" placeholder="56789-0">
          </div>
        </div>
      </section>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio" class="oficio"></pre>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
