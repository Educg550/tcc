<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <img src="/static/assets/usp-logo.png" alt="Logo da USP">
    <h1>Universidade de São Paulo</h1>
    <h2>Instituto de Matemática e Estatística</h2>
  </header>
  <main>
    <div class="tabs">
      <button type="button" class="tab active" id="tab-alunos">ALUNOS</button>
      <button type="button" class="tab" id="tab-docentes">DOCENTES</button>
    </div>
    <section id="form-alunos-section">
      <form id="form-alunos" action="/solicitacao" method="post">
        <input type="hidden" name="aba" value="alunos">
        <ul class="errors" id="errors-alunos"></ul>
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <label>NOME COMPLETO - SEM ABREVIAR
            <input type="text" name="nome" id="nome" required placeholder="Maria da Silva Sauro">
          </label>
          <label>N. USP
            <input type="text" name="nusp" id="nusp" inputmode="numeric" required placeholder="12345678">
          </label>
          <label>PROGRAMA
            <input type="text" name="programa" id="programa" required placeholder="Matemática Aplicada">
          </label>
          <label>NÍVEL
            <select name="nivel" id="nivel" required>
              <option value="Mestrado">Mestrado</option>
              <option value="Doutorado">Doutorado</option>
            </select>
          </label>
          <label>TIPO DE AUXÍLIO
            <select name="auxilio" id="auxilio" required>
              <option value="Participação em evento">Participação em evento</option>
              <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
              <option value="Outro">Outro</option>
            </select>
          </label>
          <label>E-MAIL
            <input type="email" name="email" id="email" required placeholder="aluno@ime.usp.br">
          </label>
          <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA
            <input type="text" name="evento" id="evento" required placeholder="Congresso Brasileiro de Matemática">
          </label>
          <label>PERÍODO DO EVENTO, EXAME OU DEFESA
            <input type="text" name="periodo" id="periodo" required placeholder="10 a 12 de julho de 2024">
          </label>
          <label>CIDADE DO EVENTO, EXAME OU DEFESA
            <input type="text" name="cidade" id="cidade" required placeholder="Porto Alegre">
          </label>
          <label>ESTADO DO EVENTO, EXAME OU DEFESA
            <input type="text" name="estado" id="estado" required placeholder="RS">
          </label>
          <label>PAÍS DO EVENTO, EXAME OU DEFESA
            <input type="text" name="pais" id="pais" required placeholder="Brasil">
          </label>
          <label>LINK DO EVENTO, EXAME OU DEFESA
            <input type="text" name="link" id="link" placeholder="https://exemplo.com.br">
          </label>
          <label>VALOR SOLICITADO (R$)
            <input type="text" name="valor" id="valor" inputmode="numeric" required placeholder="R$ 1.500,00">
          </label>
          <label class="wide">DETALHAMENTO DO PEDIDO
            <textarea name="detalhamento" id="detalhamento" required placeholder="Inscrição, diárias e passagens aéreas"></textarea>
          </label>
          <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
            <select name="apresentacao" id="apresentacao-alunos" required>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </label>
        </fieldset>
        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <label>DATA DE NASCIMENTO
            <input type="text" name="nascimento" id="nascimento" inputmode="numeric" required placeholder="01/02/1980">
          </label>
          <label>LOGRADOURO
            <input type="text" name="logradouro" id="logradouro" required placeholder="Rua do Matão">
          </label>
          <label>NÚMERO
            <input type="text" name="numero" id="numero" required placeholder="1010">
          </label>
          <label>COMPLEMENTO
            <input type="text" name="complemento" id="complemento" placeholder="Bloco A, sala 21">
          </label>
          <label>BAIRRO
            <input type="text" name="bairro" id="bairro" required placeholder="Butantã">
          </label>
          <label>CEP
            <input type="text" name="cep" id="cep" inputmode="numeric" required placeholder="05508-090">
          </label>
          <label>CIDADE
            <input type="text" name="cidade-end" id="cidade-end" required placeholder="São Paulo">
          </label>
          <label>ESTADO
            <input type="text" name="estado-end" id="estado-end" required placeholder="SP">
          </label>
        </fieldset>
        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <label>CPF (SEPARADOS POR PONTOS E TRAÇO)
            <input type="text" name="cpf" id="cpf" inputmode="numeric" required placeholder="123.456.789-09">
          </label>
          <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
            <input type="text" name="rg" id="rg" required placeholder="12.345.678-9">
          </label>
          <label>NOME DO BANCO
            <input type="text" name="banco" id="banco" required placeholder="Banco do Brasil">
          </label>
          <label>NÚMERO DA AGÊNCIA
            <input type="text" name="agencia" id="agencia" inputmode="numeric" required placeholder="1234">
          </label>
          <label>NÚMERO DA CONTA
            <input type="text" name="conta" id="conta" required placeholder="5678-9">
          </label>
        </fieldset>
        <button type="submit">Enviar solicitação</button>
      </form>
    </section>
    <section id="form-docentes-section" hidden>
      <form id="form-docentes" action="/solicitacao" method="post">
        <input type="hidden" name="aba" value="docentes">
        <ul class="errors" id="errors-docentes"></ul>
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <label>NOME COMPLETO - SEM ABREVIAR
            <input type="text" name="nome" id="nome-docentes" required placeholder="João da Silva Sauro">
          </label>
          <label>N. USP
            <input type="text" name="nusp" id="nusp-docentes" inputmode="numeric" required placeholder="87654321">
          </label>
          <label>PROGRAMA
            <input type="text" name="programa" id="programa-docentes" required placeholder="Estatística">
          </label>
          <label>E-MAIL
            <input type="email" name="email" id="email-docentes" required placeholder="docente@ime.usp.br">
          </label>
          <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA
            <input type="text" name="evento" id="evento-docentes" required placeholder="Seminário de Estatística">
          </label>
          <label>PERÍODO DO EVENTO, EXAME OU DEFESA
            <input type="text" name="periodo" id="periodo-docentes" required placeholder="5 de agosto de 2024">
          </label>
          <label>CIDADE DO EVENTO, EXAME OU DEFESA
            <input type="text" name="cidade" id="cidade-docentes" required placeholder="Campinas">
          </label>
          <label>ESTADO DO EVENTO, EXAME OU DEFESA
            <input type="text" name="estado" id="estado-docentes" required placeholder="SP">
          </label>
          <label>PAÍS DO EVENTO, EXAME OU DEFESA
            <input type="text" name="pais" id="pais-docentes" required placeholder="Brasil">
          </label>
          <label>LINK DO EVENTO, EXAME OU DEFESA
            <input type="text" name="link" id="link-docentes" placeholder="https://exemplo.org">
          </label>
          <label>VALOR SOLICITADO (R$)
            <input type="text" name="valor" id="valor-docentes" inputmode="numeric" required placeholder="R$ 3.200,00">
          </label>
          <label class="wide">DETALHAMENTO DO PEDIDO
            <textarea name="detalhamento" id="detalhamento-docentes" required placeholder="Passagem de ônibus ida e volta"></textarea>
          </label>
          <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
            <select name="apresentacao" id="apresentacao-docentes" required>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </label>
        </fieldset>
        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <label>DATA DE NASCIMENTO
            <input type="text" name="nascimento" id="nascimento-docentes" inputmode="numeric" required placeholder="15/09/1975">
          </label>
          <label>LOGRADOURO
            <input type="text" name="logradouro" id="logradouro-docentes" required placeholder="Av. Professor Luciano Gualberto">
          </label>
          <label>NÚMERO
            <input type="text" name="numero" id="numero-docentes" required placeholder="117">
          </label>
          <label>COMPLEMENTO
            <input type="text" name="complemento" id="complemento-docentes" placeholder="Prédio Ciclo Básico">
          </label>
          <label>BAIRRO
            <input type="text" name="bairro" id="bairro-docentes" required placeholder="Butantã">
          </label>
          <label>CEP
            <input type="text" name="cep" id="cep-docentes" inputmode="numeric" required placeholder="05508-010">
          </label>
          <label>CIDADE
            <input type="text" name="cidade-end" id="cidade-end-docentes" required placeholder="São Paulo">
          </label>
          <label>ESTADO
            <input type="text" name="estado-end" id="estado-end-docentes" required placeholder="SP">
          </label>
        </fieldset>
        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <label>CPF (SEPARADOS POR PONTOS E TRAÇO)
            <input type="text" name="cpf" id="cpf-docentes" inputmode="numeric" required placeholder="987.654.321-00">
          </label>
          <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
            <input type="text" name="rg" id="rg-docentes" required placeholder="98.765.432-1">
          </label>
          <label>NOME DO BANCO
            <input type="text" name="banco" id="banco-docentes" required placeholder="Itaú">
          </label>
          <label>NÚMERO DA AGÊNCIA
            <input type="text" name="agencia" id="agencia-docentes" inputmode="numeric" required placeholder="4321">
          </label>
          <label>NÚMERO DA CONTA
            <input type="text" name="conta" id="conta-docentes" required placeholder="1234-5">
          </label>
        </fieldset>
        <button type="submit">Enviar solicitação</button>
      </form>
    </section>
    <section id="confirmation" hidden>
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
