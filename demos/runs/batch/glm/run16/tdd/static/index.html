<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="cabecalho">
  <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo" class="logo">
  <div class="cabecalho-texto">
    <h1>Universidade de São Paulo</h1>
    <p class="programa">Instituto de Matemática e Estatística - Pós-Graduação</p>
  </div>
</header>
<main>
  <nav class="abas">
    <button type="button" id="aba-alunos" class="aba ativa" onclick="mostrarAba('alunos')">ALUNOS</button>
    <button type="button" id="aba-docentes" class="aba" onclick="mostrarAba('docentes')">DOCENTES</button>
  </nav>
  <div id="erro-alunos" class="erros oculto"></div>
  <form id="form-alunos" class="visivel">
    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class="grid">
        <label>NOME COMPLETO - SEM ABREVIAR
          <input type="text" name="nome_completo" placeholder="Maria da Silva e Souza">
        </label>
        <label>N. USP
          <input type="text" name="n_usp" placeholder="12345678">
        </label>
        <label>PROGRAMA
          <input type="text" name="programa" placeholder="Matemática">
        </label>
        <label>NÍVEL
          <select name="nivel">
            <option value="Mestrado">Mestrado</option>
            <option value="Doutorado">Doutorado</option>
          </select>
        </label>
        <label>TIPO DE AUXÍLIO
          <select name="tipo_de_auxilio">
            <option value="Participação em evento">Participação em evento</option>
            <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
            <option value="Outro">Outro</option>
          </select>
        </label>
        <label>E-MAIL
          <input type="email" name="email" placeholder="nome@ime.usp.br">
        </label>
        <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA
          <input type="text" name="nome_do_evento" placeholder="Congresso Nacional de Matemática">
        </label>
        <label>PERÍODO DO EVENTO, EXAME OU DEFESA
          <input type="text" name="periodo_do_evento" placeholder="10 a 12 de outubro de 2025">
        </label>
        <label>CIDADE DO EVENTO, EXAME OU DEFESA
          <input type="text" name="cidade_do_evento" placeholder="São Paulo">
        </label>
        <label>ESTADO DO EVENTO, EXAME OU DEFESA
          <input type="text" name="estado_do_evento" placeholder="SP">
        </label>
        <label>PAÍS DO EVENTO, EXAME OU DEFESA
          <input type="text" name="pais_do_evento" placeholder="Brasil">
        </label>
        <label>LINK DO EVENTO, EXAME OU DEFESA
          <input type="text" name="link_do_evento" placeholder="https://exemplo.com">
        </label>
        <label>VALOR SOLICITADO (R$)
          <input type="text" name="valor_solicitado" class="moeda" placeholder="150000">
        </label>
        <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
          <select name="apresentacao">
            <option value="Pôster">Pôster</option>
            <option value="Apresentação oral">Apresentação oral</option>
            <option value="Outra">Outra</option>
            <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
          </select>
        </label>
        <label class="linha-inteira">DETALHAMENTO DO PEDIDO
          <textarea name="detalhamento" rows="3" placeholder="Passagem aérea, hospedagem e inscrição"></textarea>
        </label>
      </div>
    </fieldset>
    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class="grid">
        <label>DATA DE NASCIMENTO
          <input type="text" name="data_de_nascimento" class="data" placeholder="01021980">
        </label>
        <label>LOGRADOURO
          <input type="text" name="logradouro" placeholder="Rua do Matão">
        </label>
        <label>NÚMERO
          <input type="text" name="numero" placeholder="1010">
        </label>
        <label>COMPLEMENTO
          <input type="text" name="complemento" placeholder="Sala 3B">
        </label>
        <label>BAIRRO
          <input type="text" name="bairro" placeholder="Butantã">
        </label>
        <label>CEP
          <input type="text" name="cep" class="cep" placeholder="05508090">
        </label>
        <label>CIDADE
          <input type="text" name="cidade" placeholder="São Paulo">
        </label>
        <label>ESTADO
          <input type="text" name="estado" placeholder="SP">
        </label>
      </div>
    </fieldset>
    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="grid">
        <label>CPF (SEPARADOS POR PONTOS E TRAÇO)
          <input type="text" name="cpf" class="cpf" placeholder="12345678909">
        </label>
        <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
          <input type="text" name="rg" placeholder="12.345.678-9">
        </label>
        <label>NOME DO BANCO
          <input type="text" name="banco" placeholder="Banco do Brasil">
        </label>
        <label>NÚMERO DA AGÊNCIA
          <input type="text" name="agencia" placeholder="1234">
        </label>
        <label>NÚMERO DA CONTA
          <input type="text" name="conta" placeholder="12345-6">
        </label>
      </div>
    </fieldset>
    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>
  <div id="erro-docentes" class="erros oculto"></div>
  <form id="form-docentes" class="oculto">
    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class="grid">
        <label>NOME COMPLETO - SEM ABREVIAR
          <input type="text" name="nome_completo" placeholder="João da Silva e Souza">
        </label>
        <label>N. USP
          <input type="text" name="n_usp" placeholder="87654321">
        </label>
        <label>PROGRAMA
          <input type="text" name="programa" placeholder="Estatística">
        </label>
        <label>E-MAIL
          <input type="email" name="email" placeholder="nome@ime.usp.br">
        </label>
        <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA
          <input type="text" name="nome_do_evento" placeholder="Escola de Probabilidade">
        </label>
        <label>PERÍODO DO EVENTO, EXAME OU DEFESA
          <input type="text" name="periodo_do_evento" placeholder="5 a 7 de novembro de 2025">
        </label>
        <label>CIDADE DO EVENTO, EXAME OU DEFESA
          <input type="text" name="cidade_do_evento" placeholder="Rio de Janeiro">
        </label>
        <label>ESTADO DO EVENTO, EXAME OU DEFESA
          <input type="text" name="estado_do_evento" placeholder="RJ">
        </label>
        <label>PAÍS DO EVENTO, EXAME OU DEFESA
          <input type="text" name="pais_do_evento" placeholder="Brasil">
        </label>
        <label>LINK DO EVENTO, EXAME OU DEFESA
          <input type="text" name="link_do_evento" placeholder="https://exemplo.com">
        </label>
        <label>VALOR SOLICITADO (R$)
          <input type="text" name="valor_solicitado" class="moeda" placeholder="150000">
        </label>
        <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
          <select name="apresentacao">
            <option value="Pôster">Pôster</option>
            <option value="Apresentação oral">Apresentação oral</option>
            <option value="Outra">Outra</option>
            <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
          </select>
        </label>
        <label class="linha-inteira">DETALHAMENTO DO PEDIDO
          <textarea name="detalhamento" rows="3" placeholder="Passagem e diárias"></textarea>
        </label>
      </div>
    </fieldset>
    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class="grid">
        <label>DATA DE NASCIMENTO
          <input type="text" name="data_de_nascimento" class="data" placeholder="01021980">
        </label>
        <label>LOGRADOURO
          <input type="text" name="logradouro" placeholder="Avenida Professor Luciano Gualberto">
        </label>
        <label>NÚMERO
          <input type="text" name="numero" placeholder="1010">
        </label>
        <label>COMPLEMENTO
          <input type="text" name="complemento" placeholder="Sala 3B">
        </label>
        <label>BAIRRO
          <input type="text" name="bairro" placeholder="Butantã">
        </label>
        <label>CEP
          <input type="text" name="cep" class="cep" placeholder="05508090">
        </label>
        <label>CIDADE
          <input type="text" name="cidade" placeholder="São Paulo">
        </label>
        <label>ESTADO
          <input type="text" name="estado" placeholder="SP">
        </label>
      </div>
    </fieldset>
    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="grid">
        <label>CPF (SEPARADOS POR PONTOS E TRAÇO)
          <input type="text" name="cpf" class="cpf" placeholder="12345678909">
        </label>
        <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
          <input type="text" name="rg" placeholder="12.345.678-9">
        </label>
        <label>NOME DO BANCO
          <input type="text" name="banco" placeholder="Banco do Brasil">
        </label>
        <label>NÚMERO DA AGÊNCIA
          <input type="text" name="agencia" placeholder="1234">
        </label>
        <label>NÚMERO DA CONTA
          <input type="text" name="conta" placeholder="12345-6">
        </label>
      </div>
    </fieldset>
    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>
  <div id="confirmacao" class="oculto">
    <h1>Solicitação registrada</h1>
    <pre id="oficio"></pre>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
