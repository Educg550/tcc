<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Universidade de São Paulo">
  <div class="identidade">
    <h1>Universidade de São Paulo</h1>
    <p class="programa">Pós-Graduação - Instituto de Matemática e Estatística</p>
  </div>
</header>

<main>
  <div id="app">
    <nav class="abas" role="tablist">
      <button type="button" class="aba ativa" data-aba="alunos" role="tab">ALUNOS</button>
      <button type="button" class="aba" data-aba="docentes" role="tab">DOCENTES</button>
    </nav>

    <div class="painel ativo" id="painel-alunos">
      <form class="formulario" data-tipo="alunos" novalidate>
        <div class="erros" role="alert"></div>

        <div class="bloco">
          <h3>SOLICITANTE E EVENTO</h3>
          <div class="grade">
            <label class="campo largo"><span>NOME COMPLETO - SEM ABREVIAR</span>
              <input type="text" name="nome" placeholder="Maria Aparecida da Silva"></label>
            <label class="campo"><span>N. USP</span>
              <input type="text" name="n_usp" inputmode="numeric" placeholder="12345678"></label>
            <label class="campo largo3"><span>PROGRAMA</span>
              <input type="text" name="programa" placeholder="Matemática Aplicada"></label>

            <label class="campo largo3"><span>NÍVEL</span>
              <select name="nivel">
                <option value="">Selecione</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select></label>
            <label class="campo largo3"><span>TIPO DE AUXÍLIO</span>
              <select name="tipo_auxilio">
                <option value="">Selecione</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select></label>

            <label class="campo largo3"><span>E-MAIL</span>
              <input type="text" name="email" placeholder="maria.silva@usp.br"></label>
            <label class="campo largo3"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
              <input type="text" name="evento_nome" placeholder="Congresso Brasileiro de Matemática"></label>

            <label class="campo largo3"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="evento_periodo" placeholder="22 a 26 de julho de 2024"></label>
            <label class="campo"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="evento_cidade" placeholder="Rio de Janeiro"></label>
            <label class="campo"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="evento_estado" placeholder="RJ"></label>
            <label class="campo"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="evento_pais" placeholder="Brasil"></label>

            <label class="campo largo3"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="evento_link" placeholder="https://evento.exemplo.br"></label>
            <label class="campo largo3"><span>VALOR SOLICITADO (R$)</span>
              <input type="text" name="valor" data-mask="valor" placeholder="R$ 1.500,00"></label>

            <label class="campo cheio"><span>DETALHAMENTO DO PEDIDO</span>
              <textarea name="detalhamento" rows="2" placeholder="Passagem aérea e taxa de inscrição"></textarea></label>

            <label class="campo largo3"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
              <select name="apresentacao">
                <option value="">Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select></label>
          </div>
        </div>

        <div class="bloco">
          <h3>ENDEREÇO DO SOLICITANTE</h3>
          <div class="grade">
            <label class="campo largo"><span>DATA DE NASCIMENTO</span>
              <input type="text" name="data_nascimento" data-mask="data" inputmode="numeric" placeholder="01/02/1980"></label>
            <label class="campo largo3"><span>LOGRADOURO</span>
              <input type="text" name="logradouro" placeholder="Rua do Matão"></label>
            <label class="campo"><span>NÚMERO</span>
              <input type="text" name="numero" placeholder="1010"></label>

            <label class="campo largo"><span>COMPLEMENTO</span>
              <input type="text" name="complemento" placeholder="Bloco B, apto 12"></label>
            <label class="campo largo"><span>BAIRRO</span>
              <input type="text" name="bairro" placeholder="Butantã"></label>
            <label class="campo largo"><span>CEP</span>
              <input type="text" name="cep" data-mask="cep" inputmode="numeric" placeholder="05508-090"></label>

            <label class="campo largo3"><span>CIDADE</span>
              <input type="text" name="cidade" placeholder="São Paulo"></label>
            <label class="campo largo3"><span>ESTADO</span>
              <input type="text" name="estado" placeholder="SP"></label>
          </div>
        </div>

        <div class="bloco">
          <h3>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h3>
          <div class="grade">
            <label class="campo largo"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input type="text" name="cpf" data-mask="cpf" inputmode="numeric" placeholder="123.456.789-09"></label>
            <label class="campo largo"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input type="text" name="rg" placeholder="12.345.678-9"></label>
            <label class="campo largo"><span>NOME DO BANCO</span>
              <input type="text" name="banco" placeholder="Banco do Brasil"></label>

            <label class="campo largo"><span>NÚMERO DA AGÊNCIA</span>
              <input type="text" name="agencia" inputmode="numeric" placeholder="1234"></label>
            <label class="campo largo"><span>NÚMERO DA CONTA</span>
              <input type="text" name="conta" placeholder="12345-6"></label>
          </div>
        </div>

        <button type="submit" class="botao-enviar">Enviar solicitação</button>
      </form>
    </div>

    <div class="painel" id="painel-docentes">
      <form class="formulario" data-tipo="docentes" novalidate>
        <div class="erros" role="alert"></div>

        <div class="bloco">
          <h3>SOLICITANTE E EVENTO</h3>
          <div class="grade">
            <label class="campo largo"><span>NOME COMPLETO - SEM ABREVIAR</span>
              <input type="text" name="nome" placeholder="João Carlos Ferreira"></label>
            <label class="campo"><span>N. USP</span>
              <input type="text" name="n_usp" inputmode="numeric" placeholder="87654321"></label>
            <label class="campo largo3"><span>PROGRAMA</span>
              <input type="text" name="programa" placeholder="Matemática Aplicada"></label>

            <label class="campo largo3"><span>E-MAIL</span>
              <input type="text" name="email" placeholder="joao.ferreira@usp.br"></label>
            <label class="campo largo3"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
              <input type="text" name="evento_nome" placeholder="Congresso Brasileiro de Matemática"></label>

            <label class="campo largo3"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="evento_periodo" placeholder="22 a 26 de julho de 2024"></label>
            <label class="campo"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="evento_cidade" placeholder="Rio de Janeiro"></label>
            <label class="campo"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="evento_estado" placeholder="RJ"></label>
            <label class="campo"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="evento_pais" placeholder="Brasil"></label>

            <label class="campo largo3"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="evento_link" placeholder="https://evento.exemplo.br"></label>
            <label class="campo largo3"><span>VALOR SOLICITADO (R$)</span>
              <input type="text" name="valor" data-mask="valor" placeholder="R$ 1.500,00"></label>

            <label class="campo cheio"><span>DETALHAMENTO DO PEDIDO</span>
              <textarea name="detalhamento" rows="2" placeholder="Passagem aérea e taxa de inscrição"></textarea></label>

            <label class="campo largo3"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
              <select name="apresentacao">
                <option value="">Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select></label>
          </div>
        </div>

        <div class="bloco">
          <h3>ENDEREÇO DO SOLICITANTE</h3>
          <div class="grade">
            <label class="campo largo"><span>DATA DE NASCIMENTO</span>
              <input type="text" name="data_nascimento" data-mask="data" inputmode="numeric" placeholder="01/02/1980"></label>
            <label class="campo largo3"><span>LOGRADOURO</span>
              <input type="text" name="logradouro" placeholder="Rua do Matão"></label>
            <label class="campo"><span>NÚMERO</span>
              <input type="text" name="numero" placeholder="1010"></label>

            <label class="campo largo"><span>COMPLEMENTO</span>
              <input type="text" name="complemento" placeholder="Bloco B, apto 12"></label>
            <label class="campo largo"><span>BAIRRO</span>
              <input type="text" name="bairro" placeholder="Butantã"></label>
            <label class="campo largo"><span>CEP</span>
              <input type="text" name="cep" data-mask="cep" inputmode="numeric" placeholder="05508-090"></label>

            <label class="campo largo3"><span>CIDADE</span>
              <input type="text" name="cidade" placeholder="São Paulo"></label>
            <label class="campo largo3"><span>ESTADO</span>
              <input type="text" name="estado" placeholder="SP"></label>
          </div>
        </div>

        <div class="bloco">
          <h3>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h3>
          <div class="grade">
            <label class="campo largo"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input type="text" name="cpf" data-mask="cpf" inputmode="numeric" placeholder="123.456.789-09"></label>
            <label class="campo largo"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input type="text" name="rg" placeholder="12.345.678-9"></label>
            <label class="campo largo"><span>NOME DO BANCO</span>
              <input type="text" name="banco" placeholder="Banco do Brasil"></label>

            <label class="campo largo"><span>NÚMERO DA AGÊNCIA</span>
              <input type="text" name="agencia" inputmode="numeric" placeholder="1234"></label>
            <label class="campo largo"><span>NÚMERO DA CONTA</span>
              <input type="text" name="conta" placeholder="12345-6"></label>
          </div>
        </div>

        <button type="submit" class="botao-enviar">Enviar solicitação</button>
      </form>
    </div>
  </div>

  <section id="confirmacao" class="oculto">
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
