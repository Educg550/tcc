<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Universidade de São Paulo">
    <div class="identidade">
      <h1>Universidade de São Paulo</h1>
      <p>Programa de Pós-Graduação do Instituto de Matemática e Estatística - IME-USP</p>
    </div>
  </header>

  <main id="formularios">
    <nav class="abas" role="tablist">
      <button type="button" class="aba ativa" data-aba="alunos" role="tab" aria-selected="true">ALUNOS</button>
      <button type="button" class="aba" data-aba="docentes" role="tab" aria-selected="false">DOCENTES</button>
    </nav>

    <form class="painel" id="form-alunos" data-aba="alunos" novalidate>
      <p class="erros" hidden></p>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="campos">
          <label class="campo medio"><span>NOME COMPLETO - SEM ABREVIAR</span>
            <input type="text" name="nome" placeholder="Maria Aparecida da Silva"></label>
          <label class="campo"><span>N. USP</span>
            <input type="text" name="n_usp" inputmode="numeric" placeholder="12345678"></label>
          <label class="campo"><span>PROGRAMA</span>
            <input type="text" name="programa" placeholder="Matemática Aplicada"></label>
          <label class="campo"><span>NÍVEL</span>
            <select name="nivel">
              <option value="">Selecione</option>
              <option value="Mestrado">Mestrado</option>
              <option value="Doutorado">Doutorado</option>
            </select></label>
          <label class="campo"><span>TIPO DE AUXÍLIO</span>
            <select name="tipo_auxilio">
              <option value="">Selecione</option>
              <option value="Participação em evento">Participação em evento</option>
              <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
              <option value="Outro">Outro</option>
            </select></label>
          <label class="campo medio"><span>E-MAIL</span>
            <input type="text" name="email" inputmode="email" placeholder="maria.silva@usp.br"></label>
          <label class="campo medio"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
            <input type="text" name="evento" placeholder="Congresso Brasileiro de Matemática"></label>
          <label class="campo medio"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="periodo" placeholder="22 a 26/07/2025"></label>
          <label class="campo"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="cidade_evento" placeholder="São Paulo"></label>
          <label class="campo"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="estado_evento" placeholder="SP"></label>
          <label class="campo"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="pais_evento" placeholder="Brasil"></label>
          <label class="campo"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="link_evento" placeholder="https://evento.org.br"></label>
          <label class="campo"><span>VALOR SOLICITADO (R$)</span>
            <input type="text" name="valor" inputmode="numeric" data-formato="moeda" placeholder="R$ 1.500,00"></label>
          <label class="campo"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="apresentacao">
              <option value="">Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select></label>
          <label class="campo medio"><span>DETALHAMENTO DO PEDIDO</span>
            <textarea name="detalhamento" rows="2" placeholder="Inscrição, passagem aérea e hospedagem..."></textarea></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="campos">
          <label class="campo"><span>DATA DE NASCIMENTO</span>
            <input type="text" name="data_nascimento" inputmode="numeric" data-formato="data" placeholder="01/02/1980"></label>
          <label class="campo medio"><span>LOGRADOURO</span>
            <input type="text" name="logradouro" placeholder="Av. Prof. Luciano Gualberto"></label>
          <label class="campo"><span>NÚMERO</span>
            <input type="text" name="numero" placeholder="158"></label>
          <label class="campo"><span>COMPLEMENTO</span>
            <input type="text" name="complemento" placeholder="Bloco A, apto 42"></label>
          <label class="campo"><span>BAIRRO</span>
            <input type="text" name="bairro" placeholder="Butantã"></label>
          <label class="campo"><span>CEP</span>
            <input type="text" name="cep" inputmode="numeric" data-formato="cep" placeholder="05508-090"></label>
          <label class="campo medio"><span>CIDADE</span>
            <input type="text" name="cidade" placeholder="São Paulo"></label>
          <label class="campo"><span>ESTADO</span>
            <input type="text" name="estado" placeholder="SP"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="campos">
          <label class="campo"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="cpf" inputmode="numeric" data-formato="cpf" placeholder="123.456.789-09"></label>
          <label class="campo"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="rg" placeholder="12.345.678-9"></label>
          <label class="campo"><span>NOME DO BANCO</span>
            <input type="text" name="banco" placeholder="Banco do Brasil"></label>
          <label class="campo"><span>NÚMERO DA AGÊNCIA</span>
            <input type="text" name="agencia" inputmode="numeric" placeholder="1234"></label>
          <label class="campo"><span>NÚMERO DA CONTA</span>
            <input type="text" name="conta" placeholder="12345-6"></label>
        </div>
      </fieldset>

      <div class="acoes"><button type="submit">Enviar solicitação</button></div>
    </form>

    <form class="painel" id="form-docentes" data-aba="docentes" novalidate hidden>
      <p class="erros" hidden></p>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="campos">
          <label class="campo medio"><span>NOME COMPLETO - SEM ABREVIAR</span>
            <input type="text" name="nome" placeholder="João Carlos de Souza"></label>
          <label class="campo"><span>N. USP</span>
            <input type="text" name="n_usp" inputmode="numeric" placeholder="87654321"></label>
          <label class="campo"><span>PROGRAMA</span>
            <input type="text" name="programa" placeholder="Matemática Aplicada"></label>
          <label class="campo medio"><span>E-MAIL</span>
            <input type="text" name="email" inputmode="email" placeholder="joao.souza@usp.br"></label>
          <label class="campo medio"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
            <input type="text" name="evento" placeholder="Congresso Brasileiro de Matemática"></label>
          <label class="campo medio"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="periodo" placeholder="22 a 26/07/2025"></label>
          <label class="campo"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="cidade_evento" placeholder="São Paulo"></label>
          <label class="campo"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="estado_evento" placeholder="SP"></label>
          <label class="campo"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="pais_evento" placeholder="Brasil"></label>
          <label class="campo"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="link_evento" placeholder="https://evento.org.br"></label>
          <label class="campo"><span>VALOR SOLICITADO (R$)</span>
            <input type="text" name="valor" inputmode="numeric" data-formato="moeda" placeholder="R$ 1.500,00"></label>
          <label class="campo"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="apresentacao">
              <option value="">Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select></label>
          <label class="campo medio"><span>DETALHAMENTO DO PEDIDO</span>
            <textarea name="detalhamento" rows="2" placeholder="Inscrição, passagem aérea e hospedagem..."></textarea></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="campos">
          <label class="campo"><span>DATA DE NASCIMENTO</span>
            <input type="text" name="data_nascimento" inputmode="numeric" data-formato="data" placeholder="01/02/1980"></label>
          <label class="campo medio"><span>LOGRADOURO</span>
            <input type="text" name="logradouro" placeholder="Av. Prof. Luciano Gualberto"></label>
          <label class="campo"><span>NÚMERO</span>
            <input type="text" name="numero" placeholder="158"></label>
          <label class="campo"><span>COMPLEMENTO</span>
            <input type="text" name="complemento" placeholder="Bloco A, apto 42"></label>
          <label class="campo"><span>BAIRRO</span>
            <input type="text" name="bairro" placeholder="Butantã"></label>
          <label class="campo"><span>CEP</span>
            <input type="text" name="cep" inputmode="numeric" data-formato="cep" placeholder="05508-090"></label>
          <label class="campo medio"><span>CIDADE</span>
            <input type="text" name="cidade" placeholder="São Paulo"></label>
          <label class="campo"><span>ESTADO</span>
            <input type="text" name="estado" placeholder="SP"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="campos">
          <label class="campo"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="cpf" inputmode="numeric" data-formato="cpf" placeholder="123.456.789-09"></label>
          <label class="campo"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="rg" placeholder="12.345.678-9"></label>
          <label class="campo"><span>NOME DO BANCO</span>
            <input type="text" name="banco" placeholder="Banco do Brasil"></label>
          <label class="campo"><span>NÚMERO DA AGÊNCIA</span>
            <input type="text" name="agencia" inputmode="numeric" placeholder="1234"></label>
          <label class="campo"><span>NÚMERO DA CONTA</span>
            <input type="text" name="conta" placeholder="12345-6"></label>
        </div>
      </fieldset>

      <div class="acoes"><button type="submit">Enviar solicitação</button></div>
    </form>
  </main>

  <section class="confirmacao" id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre class="oficio" id="oficio"></pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
