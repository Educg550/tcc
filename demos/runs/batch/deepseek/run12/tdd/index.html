<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Universidade de São Paulo">
  <div class="identidade">
    <h1>Universidade de São Paulo</h1>
    <p class="programa">Pós-Graduação · Instituto de Matemática e Estatística</p>
  </div>
</header>

<nav class="abas" aria-label="Formulário de solicitação">
  <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
  <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
</nav>

<main>
  <section id="formulario-alunos" class="painel ativo" data-painel="alunos">
    <div class="erros" id="erros-alunos" hidden></div>
    <form data-aba="alunos" novalidate>
      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <label class="campo largo-2"><span>NOME COMPLETO - SEM ABREVIAR</span>
            <input type="text" name="nome_completo" placeholder="Ex.: João da Silva Santos"></label>
          <label class="campo"><span>N. USP</span>
            <input type="text" name="n_usp" inputmode="numeric" placeholder="Ex.: 12345678"></label>
          <label class="campo"><span>PROGRAMA</span>
            <input type="text" name="programa" placeholder="Ex.: Ciência da Computação"></label>
          <label class="campo"><span>NÍVEL</span>
            <select name="nivel">
              <option value="Mestrado">Mestrado</option>
              <option value="Doutorado">Doutorado</option>
            </select></label>
          <label class="campo"><span>TIPO DE AUXÍLIO</span>
            <select name="tipo_auxilio">
              <option value="Participação em evento">Participação em evento</option>
              <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
              <option value="Outro">Outro</option>
            </select></label>
          <label class="campo largo-2"><span>E-MAIL</span>
            <input type="email" name="email" placeholder="Ex.: joao@ime.usp.br"></label>
          <label class="campo largo-3"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
            <input type="text" name="evento_nome" placeholder="Ex.: Congresso Brasileiro de Computação"></label>
          <label class="campo largo-2"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="evento_periodo" placeholder="Ex.: 01/03/2025 a 05/03/2025"></label>
          <label class="campo"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="evento_cidade" placeholder="Ex.: São Paulo"></label>
          <label class="campo"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="evento_estado" placeholder="Ex.: SP"></label>
          <label class="campo"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="evento_pais" placeholder="Ex.: Brasil"></label>
          <label class="campo largo-2"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="evento_link" placeholder="Ex.: https://evento.exemplo.com"></label>
          <label class="campo"><span>VALOR SOLICITADO (R$)</span>
            <input type="text" name="valor" inputmode="numeric" data-formato="moeda" placeholder="Ex.: 150000"></label>
          <label class="campo largo-3"><span>DETALHAMENTO DO PEDIDO</span>
            <textarea name="detalhamento" rows="2" placeholder="Ex.: Passagem aérea e hospedagem"></textarea></label>
          <label class="campo largo-2"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="apresentacao">
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="campo"><span>DATA DE NASCIMENTO</span>
            <input type="text" name="data_nascimento" inputmode="numeric" data-formato="data" placeholder="Ex.: 01021980"></label>
          <label class="campo largo-2"><span>LOGRADOURO</span>
            <input type="text" name="logradouro" placeholder="Ex.: Rua do Matão"></label>
          <label class="campo"><span>NÚMERO</span>
            <input type="text" name="numero" placeholder="Ex.: 1010"></label>
          <label class="campo"><span>COMPLEMENTO</span>
            <input type="text" name="complemento" placeholder="Ex.: Bloco B"></label>
          <label class="campo"><span>BAIRRO</span>
            <input type="text" name="bairro" placeholder="Ex.: Butantã"></label>
          <label class="campo"><span>CEP</span>
            <input type="text" name="cep" inputmode="numeric" data-formato="cep" placeholder="Ex.: 05508090"></label>
          <label class="campo largo-2"><span>CIDADE</span>
            <input type="text" name="cidade" placeholder="Ex.: São Paulo"></label>
          <label class="campo"><span>ESTADO</span>
            <input type="text" name="estado" placeholder="Ex.: SP"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="campo"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="cpf" inputmode="numeric" data-formato="cpf" placeholder="Ex.: 12345678909"></label>
          <label class="campo"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="rg" placeholder="Ex.: 12.345.678-9"></label>
          <label class="campo largo-2"><span>NOME DO BANCO</span>
            <input type="text" name="banco" placeholder="Ex.: Banco do Brasil"></label>
          <label class="campo"><span>NÚMERO DA AGÊNCIA</span>
            <input type="text" name="agencia" inputmode="numeric" placeholder="Ex.: 1234"></label>
          <label class="campo"><span>NÚMERO DA CONTA</span>
            <input type="text" name="conta" placeholder="Ex.: 12345-6"></label>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section id="formulario-docentes" class="painel" data-painel="docentes">
    <div class="erros" id="erros-docentes" hidden></div>
    <form data-aba="docentes" novalidate>

          <label class="campo"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>

          <label class="campo"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>

          <label class="campo"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>

          <label class="campo largo-2"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="evento_link" placeholder="Ex.: https://evento.exemplo.com"></label>
          <label class="campo"><span>VALOR SOLICITADO (R$)</span>
            <input type="text" name="valor" inputmode="numeric" data-formato="moeda" placeholder="Ex.: 150000"></label>
          <label class="campo largo-3"><span>DETALHAMENTO DO PEDIDO</span>
            <textarea name="detalhamento" rows="2" placeholder="Ex.: Passagem aérea e hospedagem"></textarea></label>
          <label class="campo largo-2"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="apresentacao">
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="campo"><span>DATA DE NASCIMENTO</span>
            <input type="text" name="data_nascimento" inputmode="numeric" data-formato="data" placeholder="Ex.: 01021980"></label>
          <label class="campo largo-2"><span>LOGRADOURO</span>
            <input type="text" name="logradouro" placeholder="Ex.: Rua do Matão"></label>
          <label class="campo"><span>NÚMERO</span>
            <input type="text" name="numero" placeholder="Ex.: 1010"></label>
          <label class="campo"><span>COMPLEMENTO</span>
            <input type="text" name="complemento" placeholder="Ex.: Bloco B"></label>
          <label class="campo"><span>BAIRRO</span>
            <input type="text" name="bairro" placeholder="Ex.: Butantã"></label>
          <label class="campo"><span>CEP</span>
            <input type="text" name="cep" inputmode="numeric" data-formato="cep" placeholder="Ex.: 05508090"></label>
          <label class="campo largo-2"><span>CIDADE</span>
            <input type="text" name="cidade" placeholder="Ex.: São Paulo"></label>
          <label class="campo"><span>ESTADO</span>
            <input type="text" name="estado" placeholder="Ex.: SP"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="campo"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="cpf" inputmode="numeric" data-formato="cpf" placeholder="Ex.: 12345678909"></label>
          <label class="campo"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="rg" placeholder="Ex.: 12.345.678-9"></label>
          <label class="campo largo-2"><span>NOME DO BANCO</span>
            <input type="text" name="banco" placeholder="Ex.: Banco do Brasil"></label>
          <label class="campo"><span>NÚMERO DA AGÊNCIA</span>
            <input type="text" name="agencia" inputmode="numeric" placeholder="Ex.: 1234"></label>
          <label class="campo"><span>NÚMERO DA CONTA</span>
            <input type="text" name="conta" placeholder="Ex.: 12345-6"></label>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section id="confirmacao" class="painel">
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
