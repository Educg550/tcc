<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="identidade">
      <h1>Universidade de São Paulo</h1>
      <p class="programa">Pós-Graduação &middot; Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <main class="conteudo">
    <div id="area-formulario">
      <nav class="abas">
        <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
        <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
      </nav>

      <form id="form-alunos" class="formulario ativo" data-aba="ALUNOS">
        <div class="erros" role="alert"></div>

        <fieldset class="bloco">
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grade">
            <div class="campo col-2">
              <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input id="a-nome" name="NOME COMPLETO - SEM ABREVIAR" type="text" placeholder="Maria da Silva">
            </div>
            <div class="campo col-1">
              <label for="a-usp">N. USP</label>
              <input id="a-usp" name="N. USP" type="text" inputmode="numeric" placeholder="12345678">
            </div>
            <div class="campo col-1">
              <label for="a-programa">PROGRAMA</label>
              <input id="a-programa" name="PROGRAMA" type="text" placeholder="Ciência da Computação">
            </div>
            <div class="campo col-1">
              <label for="a-nivel">NÍVEL</label>
              <select id="a-nivel" name="NÍVEL">
                <option value="">Selecione o nível</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select>
            </div>
            <div class="campo col-1">
              <label for="a-tipo">TIPO DE AUXÍLIO</label>
              <select id="a-tipo" name="TIPO DE AUXÍLIO">
                <option value="">Selecione o tipo</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select>
            </div>
            <div class="campo col-2">
              <label for="a-email">E-MAIL</label>
              <input id="a-email" name="E-MAIL" type="text" placeholder="maria@ime.usp.br">
            </div>
            <div class="campo col-2">
              <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id="a-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" type="text" placeholder="Congresso Brasileiro de Computação">
            </div>
            <div class="campo col-2">
              <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="10/10/2025 a 12/10/2025">
            </div>
            <div class="campo col-1">
              <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" type="text" placeholder="São Paulo">
            </div>
            <div class="campo col-1">
              <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="SP">
            </div>
            <div class="campo col-1">
              <label for="a-pais">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-pais" name="PAÍS DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Brasil">
            </div>
            <div class="campo col-1">
              <label for="a-link">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-link" name="LINK DO EVENTO, EXAME OU DEFESA" type="text" placeholder="https://evento.usp.br (opcional)">
            </div>
            <div class="campo col-1">
              <label for="a-valor">VALOR SOLICITADO (R$)</label>
              <input id="a-valor" name="VALOR SOLICITADO (R$)" type="text" inputmode="numeric" placeholder="R$ 1.500,00">
            </div>
            <div class="campo col-1">
              <label for="a-apresentar">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="a-apresentar" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
                <option value="">Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
            <div class="campo col-4">
              <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="a-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Descreva o motivo do pedido e as despesas previstas."></textarea>
            </div>
          </div>
        </fieldset>

        <fieldset class="bloco">
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <div class="campo col-1">
              <label for="a-nascimento">DATA DE NASCIMENTO</label>
              <input id="a-nascimento" name="DATA DE NASCIMENTO" type="text" inputmode="numeric" placeholder="01/02/1980">
            </div>
            <div class="campo col-2">
              <label for="a-logradouro">LOGRADOURO</label>
              <input id="a-logradouro" name="LOGRADOURO" type="text" placeholder="Rua do Matão">
            </div>
            <div class="campo col-1">
              <label for="a-numero">NÚMERO</label>
              <input id="a-numero" name="NÚMERO" type="text" placeholder="1010">
            </div>
            <div class="campo col-1">
              <label for="a-complemento">COMPLEMENTO</label>
              <input id="a-complemento" name="COMPLEMENTO" type="text" placeholder="Bloco B (opcional)">
            </div>
            <div class="campo col-1">
              <label for="a-bairro">BAIRRO</label>
              <input id="a-bairro" name="BAIRRO" type="text" placeholder="Butantã">
            </div>
            <div class="campo col-1">
              <label for="a-cep">CEP</label>
              <input id="a-cep" name="CEP" type="text" inputmode="numeric" placeholder="05508-090">
            </div>
            <div class="campo col-1">
              <label for="a-cidade">CIDADE</label>
              <input id="a-cidade" name="CIDADE" type="text" placeholder="São Paulo">
            </div>
            <div class="campo col-1">
              <label for="a-estado">ESTADO</label>
              <input id="a-estado" name="ESTADO" type="text" placeholder="SP">
            </div>
          </div>
        </fieldset>

        <fieldset class="bloco">
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <div class="campo col-1">
              <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="a-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" type="text" inputmode="numeric" placeholder="123.456.789-09">
            </div>
            <div class="campo col-1">
              <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="a-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" type="text" placeholder="12.345.678-9">
            </div>
            <div class="campo col-2">
              <label for="a-banco">NOME DO BANCO</label>
              <input id="a-banco" name="NOME DO BANCO" type="text" placeholder="Banco do Brasil">
            </div>
            <div class="campo col-1">
              <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
              <input id="a-agencia" name="NÚMERO DA AGÊNCIA" type="text" inputmode="numeric" placeholder="1234">
            </div>
            <div class="campo col-1">
              <label for="a-conta">NÚMERO DA CONTA</label>
              <input id="a-conta" name="NÚMERO DA CONTA" type="text" placeholder="12345-6">
            </div>
          </div>
        </fieldset>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>

      <form id="form-docentes" class="formulario" data-aba="DOCENTES">
        <div class="erros" role="alert"></div>

        <fieldset class="bloco">
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grade">
            <div class="campo col-2">
              <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input id="d-nome" name="NOME COMPLETO - SEM ABREVIAR" type="text" placeholder="João Pereira">
            </div>
            <div class="campo col-1">
              <label for="d-usp">N. USP</label>
              <input id="d-usp" name="N. USP" type="text" inputmode="numeric" placeholder="12345678">
            </div>
            <div class="campo col-1">
              <label for="d-programa">PROGRAMA</label>
              <input id="d-programa" name="PROGRAMA" type="text" placeholder="Ciência da Computação">
            </div>
            <div class="campo col-2">
              <label for="d-email">E-MAIL</label>
              <input id="d-email" name="E-MAIL" type="text" placeholder="joao@ime.usp.br">
            </div>
            <div class="campo col-2">
              <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id="d-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" type="text" placeholder="Congresso Brasileiro de Computação">
            </div>
            <div class="campo col-2">
              <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="10/10/2025 a 12/10/2025">
            </div>
            <div class="campo col-1">
              <label for="d-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" type="text" placeholder="São Paulo">
            </div>
            <div class="campo col-1">
              <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="SP">
            </div>
            <div class="campo col-1">
              <label for="d-pais">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-pais" name="PAÍS DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Brasil">
            </div>
            <div class="campo col-1">
              <label for="d-link">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-link" name="LINK DO EVENTO, EXAME OU DEFESA" type="text" placeholder="https://evento.usp.br (opcional)">
            </div>
            <div class="campo col-1">
              <label for="d-valor">VALOR SOLICITADO (R$)</label>
              <input id="d-valor" name="VALOR SOLICITADO (R$)" type="text" inputmode="numeric" placeholder="R$ 1.500,00">
            </div>
            <div class="campo col-1">
              <label for="d-apresentar">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="d-apresentar" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
                <option value="">Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
            <div class="campo col-4">
              <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="d-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Descreva o motivo do pedido e as despesas previstas."></textarea>
            </div>
          </div>
        </fieldset>

        <fieldset class="bloco">
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <div class="campo col-1">
              <label for="d-nascimento">DATA DE NASCIMENTO</label>
              <input id="d-nascimento" name="DATA DE NASCIMENTO" type="text" inputmode="numeric" placeholder="01/02/1980">
            </div>
            <div class="campo col-2">
              <label for="d-logradouro">LOGRADOURO</label>
              <input id="d-logradouro" name="LOGRADOURO" type="text" placeholder="Rua do Matão">
            </div>
            <div class="campo col-1">
              <label for="d-numero">NÚMERO</label>
              <input id="d-numero" name="NÚMERO" type="text" placeholder="1010">
            </div>
            <div class="campo col-1">
              <label for="d-complemento">COMPLEMENTO</label>
              <input id="d-complemento" name="COMPLEMENTO" type="text" placeholder="Bloco B (opcional)">
            </div>
            <div class="campo col-1">
              <label for="d-bairro">BAIRRO</label>
              <input id="d-bairro" name="BAIRRO" type="text" placeholder="Butantã">
            </div>
            <div class="campo col-1">
              <label for="d-cep">CEP</label>
              <input id="d-cep" name="CEP" type="text" inputmode="numeric" placeholder="05508-090">
            </div>
            <div class="campo col-1">
              <label for="d-cidade">CIDADE</label>
              <input id="d-cidade" name="CIDADE" type="text" placeholder="São Paulo">
            </div>
            <div class="campo col-1">
              <label for="d-estado">ESTADO</label>
              <input id="d-estado" name="ESTADO" type="text" placeholder="SP">
            </div>
          </div>
        </fieldset>

        <fieldset class="bloco">
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <div class="campo col-1">
              <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="d-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" type="text" inputmode="numeric" placeholder="123.456.789-09">
            </div>
            <div class="campo col-1">
              <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="d-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" type="text" placeholder="12.345.678-9">
            </div>
            <div class="campo col-2">
              <label for="d-banco">NOME DO BANCO</label>
              <input id="d-banco" name="NOME DO BANCO" type="text" placeholder="Banco do Brasil">
            </div>
            <div class="campo col-1">
              <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
              <input id="d-agencia" name="NÚMERO DA AGÊNCIA" type="text" inputmode="numeric" placeholder="1234">
            </div>
            <div class="campo col-1">
              <label for="d-conta">NÚMERO DA CONTA</label>
              <input id="d-conta" name="NÚMERO DA CONTA" type="text" placeholder="12345-6">
            </div>
          </div>
        </fieldset>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </div>

    <section id="confirmacao" class="confirmacao" hidden></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
