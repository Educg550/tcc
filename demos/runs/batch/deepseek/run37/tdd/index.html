<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identidade">
    <h1>Universidade de São Paulo</h1>
    <p>Instituto de Matemática e Estatística - Programa de Pós-Graduação</p>
  </div>
</header>

<main class="conteudo">
  <nav class="abas">
    <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>

  <form class="formulario" data-aba="alunos" novalidate>
    <div class="erros" hidden></div>
    <h2>SOLICITANTE E EVENTO</h2>
    <div class="bloco">
      <p class="campo">
        <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
        <input id="a-nome" name="nome" type="text" placeholder="Maria Aparecida de Souza" required>
      </p>
      <p class="campo">
        <label for="a-nusp">N. USP</label>
        <input id="a-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="12345678" required>
      </p>
      <p class="campo">
        <label for="a-programa">PROGRAMA</label>
        <input id="a-programa" name="programa" type="text" placeholder="Ciência da Computação" required>
      </p>
      <p class="campo">
        <label for="a-nivel">NÍVEL</label>
        <select id="a-nivel" name="nivel" required>
          <option value="">Selecione</option>
          <option>Mestrado</option>
          <option>Doutorado</option>
        </select>
      </p>
      <p class="campo">
        <label for="a-tipo">TIPO DE AUXÍLIO</label>
        <select id="a-tipo" name="tipo_auxilio" required>
          <option value="">Selecione</option>
          <option>Participação em evento</option>
          <option>Banca de exame ou defesa</option>
          <option>Outro</option>
        </select>
      </p>
      <p class="campo">
        <label for="a-email">E-MAIL</label>
        <input id="a-email" name="email" type="email" placeholder="maria.souza@ime.usp.br" required>
      </p>
      <p class="campo dobra">
        <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
        <input id="a-evento" name="evento" type="text" placeholder="Congresso Brasileiro de Computação" required>
      </p>
      <p class="campo dobra">
        <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
        <input id="a-periodo" name="periodo" type="text" placeholder="10 a 15 de março de 2025" required>
      </p>
      <p class="campo">
        <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
        <input id="a-cidade-evento" name="cidade_evento" type="text" placeholder="São Paulo" required>
      </p>
      <p class="campo">
        <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
        <input id="a-estado-evento" name="estado_evento" type="text" placeholder="SP" required>
      </p>
      <p class="campo">
        <label for="a-pais">PAÍS DO EVENTO, EXAME OU DEFESA</label>
        <input id="a-pais" name="pais" type="text" placeholder="Brasil" required>
      </p>
      <p class="campo dobra">
        <label for="a-link">LINK DO EVENTO, EXAME OU DEFESA</label>
        <input id="a-link" name="link" type="text" placeholder="https://evento.exemplo.br">
      </p>
      <p class="campo">
        <label for="a-valor">VALOR SOLICITADO (R$)</label>
        <input id="a-valor" name="valor" type="text" inputmode="numeric" placeholder="R$ 1.500,00" required>
      </p>
      <p class="campo dobra">
        <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
        <textarea id="a-detalhamento" name="detalhamento" placeholder="Passagem aérea e hospedagem." required></textarea>
      </p>
      <p class="campo dobra">
        <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
        <select id="a-apresentacao" name="apresentacao" required>
          <option value="">Selecione</option>
          <option>Pôster</option>
          <option>Apresentação oral</option>
          <option>Outra</option>
          <option>Não irá apresentar trabalho</option>
        </select>
      </p>
    </div>

    <h2>ENDEREÇO DO SOLICITANTE</h2>
    <div class="bloco">
      <p class="campo">
        <label for="a-nascimento">DATA DE NASCIMENTO</label>
        <input id="a-nascimento" name="data_nascimento" type="text" inputmode="numeric" placeholder="01/02/1980" required>
      </p>
      <p class="campo dobra">
        <label for="a-logradouro">LOGRADOURO</label>
        <input id="a-logradouro" name="logradouro" type="text" placeholder="Rua do Matão" required>
      </p>
      <p class="campo">
        <label for="a-numero">NÚMERO</label>
        <input id="a-numero" name="numero" type="text" placeholder="1010" required>
      </p>
      <p class="campo">
        <label for="a-complemento">COMPLEMENTO</label>
        <input id="a-complemento" name="complemento" type="text" placeholder="Bloco B">
      </p>
      <p class="campo">
        <label for="a-bairro">BAIRRO</label>
        <input id="a-bairro" name="bairro" type="text" placeholder="Butantã" required>
      </p>
      <p class="campo">
        <label for="a-cep">CEP</label>
        <input id="a-cep" name="cep" type="text" inputmode="numeric" placeholder="05508-090" required>
      </p>
      <p class="campo">
        <label for="a-cidade">CIDADE</label>
        <input id="a-cidade" name="cidade" type="text" placeholder="São Paulo" required>
      </p>
      <p class="campo">
        <label for="a-estado">ESTADO</label>
        <input id="a-estado" name="estado" type="text" placeholder="SP" required>
      </p>
    </div>

    <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
    <div class="bloco">
      <p class="campo">
        <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
        <input id="a-cpf" name="cpf" type="text" inputmode="numeric" placeholder="123.456.789-09" required>
      </p>
      <p class="campo">
        <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
        <input id="a-rg" name="rg" type="text" placeholder="12.345.678-9" required>
      </p>
      <p class="campo">
        <label for="a-banco">NOME DO BANCO</label>
        <input id="a-banco" name="banco" type="text" placeholder="Banco do Brasil" required>
      </p>
      <p class="campo">
        <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
        <input id="a-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234" required>
      </p>
      <p class="campo">
        <label for="a-conta">NÚMERO DA CONTA</label>
        <input id="a-conta" name="conta" type="text" placeholder="56789-0" required>
      </p>
    </div>

    <button type="submit">Enviar solicitação</button>
  </form>

      <p class="campo dobra">

      <p class="campo">

      <p class="campo dobra">

          <option>Não irá apresentar trabalho</option>
        </select>
      </p>
    </div>

    <h2>ENDEREÇO DO SOLICITANTE</h2>
    <div class="bloco">
      <p class="campo">

        <input id="d-nascimento" name="data_nascimento" type="text" inputmode="numeric" placeholder="01/02/1980" required>
      </p>
      <p class="campo dobra">
        <label for="d-logradouro">LOGRADOURO</label>
        <input id="d-logradouro" name="logradouro" type="text" placeholder="Rua do Matão" required>
      </p>
      <p class="campo">
        <label for="d-numero">NÚMERO</label>
        <input id="d-numero" name="numero" type="text" placeholder="1010" required>
      </p>
      <p class="campo">
        <label for="d-complemento">COMPLEMENTO</label>
        <input id="d-complemento" name="complemento" type="text" placeholder="Bloco B">
      </p>
      <p class="campo">
        <label for="d-bairro">BAIRRO</label>
        <input id="d-bairro" name="bairro" type="text" placeholder="Butantã" required>
      </p>
      <p class="campo">
        <label for="d-cep">CEP</label>
        <input id="d-cep" name="cep" type="text" inputmode="numeric" placeholder="05508-090" required>
      </p>
      <p class="campo">
        <label for="d-cidade">CIDADE</label>
        <input id="d-cidade" name="cidade" type="text" placeholder="São Paulo" required>
      </p>
      <p class="campo">
        <label for="d-estado">ESTADO</label>
        <input id="d-estado" name="estado" type="text" placeholder="SP" required>
      </p>
    </div>

    <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
    <div class="bloco">
      <p class="campo">
        <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
        <input id="d-cpf" name="cpf" type="text" inputmode="numeric" placeholder="123.456.789-09" required>
      </p>
      <p class="campo">
        <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
        <input id="d-rg" name="rg" type="text" placeholder="12.345.678-9" required>
      </p>
      <p class="campo">
        <label for="d-banco">NOME DO BANCO</label>
        <input id="d-banco" name="banco" type="text" placeholder="Banco do Brasil" required>
      </p>
      <p class="campo">
        <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
        <input id="d-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234" required>
      </p>
      <p class="campo">
        <label for="d-conta">NÚMERO DA CONTA</label>
        <input id="d-conta" name="conta" type="text" placeholder="56789-0" required>
      </p>
    </div>

    <button type="submit">Enviar solicitação</button>
  </form>
</main>

<script src="/app.js"></script>
</body>
</html>
