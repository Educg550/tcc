<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="identidade">
      <h1>Universidade de São Paulo</h1>
      <p>Pós-Graduação - Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <main>
    <div class="abas" role="tablist">
      <button type="button" class="aba ativa" data-aba="ALUNOS" role="tab">ALUNOS</button>
      <button type="button" class="aba" data-aba="DOCENTES" role="tab">DOCENTES</button>
    </div>

    <section class="painel ativa" data-aba="ALUNOS">
      <form data-aba="ALUNOS" novalidate>
        <div class="erros" role="alert"></div>

        <div class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="grade">
            <div class="campo col-2">
              <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input id="a-nome" name="NOME COMPLETO - SEM ABREVIAR" type="text" placeholder="Ex.: Maria da Silva Santos">
            </div>
            <div class="campo">
              <label for="a-nusp">N. USP</label>
              <input id="a-nusp" name="N. USP" type="text" inputmode="numeric" placeholder="Ex.: 12345678">
            </div>
            <div class="campo col-2">
              <label for="a-programa">PROGRAMA</label>
              <input id="a-programa" name="PROGRAMA" type="text" placeholder="Ex.: Ciência da Computação">
            </div>
            <div class="campo">
              <label for="a-nivel">NÍVEL</label>
              <select id="a-nivel" name="NÍVEL">
                <option value="">Selecione</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select>
            </div>
            <div class="campo col-2">
              <label for="a-tipo">TIPO DE AUXÍLIO</label>
              <select id="a-tipo" name="TIPO DE AUXÍLIO">
                <option value="">Selecione</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select>
            </div>
            <div class="campo col-2">
              <label for="a-email">E-MAIL</label>
              <input id="a-email" name="E-MAIL" type="email" placeholder="Ex.: maria@ime.usp.br">
            </div>
            <div class="campo col-2">
              <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id="a-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" type="text" placeholder="Ex.: Congresso SBC 2024">
            </div>
            <div class="campo col-2">
              <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: 21 a 25 de julho de 2024">
            </div>
            <div class="campo">
              <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: Brasília">
            </div>
            <div class="campo">
              <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: DF">
            </div>
            <div class="campo">
              <label for="a-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: Brasil">
            </div>
            <div class="campo col-2">
              <label for="a-link">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-link" name="LINK DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: https://sbc.example.org/2024">
            </div>
            <div class="campo">
              <label for="a-valor">VALOR SOLICITADO (R$)</label>
              <input id="a-valor" name="VALOR SOLICITADO (R$)" type="text" inputmode="numeric" placeholder="Ex.: 150000">
            </div>
            <div class="campo col-3">
              <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="a-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
                <option value="">Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
            <div class="campo col-full">
              <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="a-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Ex.: Passagem aérea e hospedagem"></textarea>
            </div>
          </div>
        </div>

        <div class="bloco">
          <h2>ENDEREÇO DO SOLICITANTE</h2>
          <div class="grade">
            <div class="campo">
              <label for="a-nascimento">DATA DE NASCIMENTO</label>
              <input id="a-nascimento" name="DATA DE NASCIMENTO" type="text" inputmode="numeric" placeholder="Ex.: 01021980">
            </div>
            <div class="campo col-2">
              <label for="a-logradouro">LOGRADOURO</label>
              <input id="a-logradouro" name="LOGRADOURO" type="text" placeholder="Ex.: Rua do Matão">
            </div>
            <div class="campo">
              <label for="a-numero">NÚMERO</label>
              <input id="a-numero" name="NÚMERO" type="text" placeholder="Ex.: 1010">
            </div>
            <div class="campo">
              <label for="a-complemento">COMPLEMENTO</label>
              <input id="a-complemento" name="COMPLEMENTO" type="text" placeholder="Ex.: Bloco A">
            </div>
            <div class="campo">
              <label for="a-bairro">BAIRRO</label>
              <input id="a-bairro" name="BAIRRO" type="text" placeholder="Ex.: Butantã">
            </div>
            <div class="campo">
              <label for="a-cep">CEP</label>
              <input id="a-cep" name="CEP" type="text" inputmode="numeric" placeholder="Ex.: 05508090">
            </div>
            <div class="campo col-2">
              <label for="a-cidade">CIDADE</label>
              <input id="a-cidade" name="CIDADE" type="text" placeholder="Ex.: São Paulo">
            </div>
            <div class="campo">
              <label for="a-estado">ESTADO</label>
              <input id="a-estado" name="ESTADO" type="text" placeholder="Ex.: SP">
            </div>
          </div>
        </div>

        <div class="bloco">
          <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class="grade">
            <div class="campo">
              <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="a-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" type="text" inputmode="numeric" placeholder="Ex.: 12345678909">
            </div>
            <div class="campo col-2">
              <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="a-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" type="text" placeholder="Ex.: 12.345.678-9">
            </div>
            <div class="campo">
              <label for="a-banco">NOME DO BANCO</label>
              <input id="a-banco" name="NOME DO BANCO" type="text" placeholder="Ex.: Banco do Brasil">
            </div>
            <div class="campo">
              <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
              <input id="a-agencia" name="NÚMERO DA AGÊNCIA" type="text" inputmode="numeric" placeholder="Ex.: 1234">
            </div>
            <div class="campo">
              <label for="a-conta">NÚMERO DA CONTA</label>
              <input id="a-conta" name="NÚMERO DA CONTA" type="text" placeholder="Ex.: 56789-0">
            </div>
          </div>
        </div>

        <div class="acoes">
          <button type="submit">Enviar solicitação</button>
        </div>
      </form>
    </section>

    <section class="painel" data-aba="DOCENTES">
      <form data-aba="DOCENTES" novalidate>
        <div class="erros" role="alert"></div>

        <div class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="grade">
            <div class="campo col-2">
              <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input id="d-nome" name="NOME COMPLETO - SEM ABREVIAR" type="text" placeholder="Ex.: João Pereira Lima">
            </div>
            <div class="campo">
              <label for="d-nusp">N. USP</label>
              <input id="d-nusp" name="N. USP" type="text" inputmode="numeric" placeholder="Ex.: 87654321">
            </div>
            <div class="campo col-2">
              <label for="d-programa">PROGRAMA</label>
              <input id="d-programa" name="PROGRAMA" type="text" placeholder="Ex.: Ciência da Computação">
            </div>
            <div class="campo col-2">
              <label for="d-email">E-MAIL</label>
              <input id="d-email" name="E-MAIL" type="email" placeholder="Ex.: joao@ime.usp.br">
            </div>
            <div class="campo col-2">
              <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id="d-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" type="text" placeholder="Ex.: Banca de defesa de tese">
            </div>
            <div class="campo col-2">
              <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: 10 de março de 2024">
            </div>
            <div class="campo">
              <label for="d-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: São Paulo">
            </div>
            <div class="campo">
              <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: SP">
            </div>
            <div class="campo">
              <label for="d-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: Brasil">
            </div>
            <div class="campo col-2">
              <label for="d-link">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-link" name="LINK DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: https://ime.usp.br/defesa">
            </div>
            <div class="campo">
              <label for="d-valor">VALOR SOLICITADO (R$)</label>
              <input id="d-valor" name="VALOR SOLICITADO (R$)" type="text" inputmode="numeric" placeholder="Ex.: 250000">
            </div>
            <div class="campo col-3">
              <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="d-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
                <option value="">Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
            <div class="campo col-full">
              <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="d-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Ex.: Despesas com a banca de defesa"></textarea>
            </div>
          </div>
        </div>

        <div class="bloco">
          <h2>ENDEREÇO DO SOLICITANTE</h2>
          <div class="grade">
            <div class="campo">
              <label for="d-nascimento">DATA DE NASCIMENTO</label>
              <input id="d-nascimento" name="DATA DE NASCIMENTO" type="text" inputmode="numeric" placeholder="Ex.: 15051970">
            </div>
            <div class="campo col-2">
              <label for="d-logradouro">LOGRADOURO</label>
              <input id="d-logradouro" name="LOGRADOURO" type="text" placeholder="Ex.: Av. Professor Luciano Gualberto">
            </div>
            <div class="campo">
              <label for="d-numero">NÚMERO</label>
              <input id="d-numero" name="NÚMERO" type="text" placeholder="Ex.: 1178">
            </div>
            <div class="campo">
              <label for="d-complemento">COMPLEMENTO</label>
              <input id="d-complemento" name="COMPLEMENTO" type="text" placeholder="Ex.: Sala 202">
            </div>
            <div class="campo">
              <label for="d-bairro">BAIRRO</label>
              <input id="d-bairro" name="BAIRRO" type="text" placeholder="Ex.: Butantã">
            </div>
            <div class="campo">
              <label for="d-cep">CEP</label>
              <input id="d-cep" name="CEP" type="text" inputmode="numeric" placeholder="Ex.: 05508090">
            </div>
            <div class="campo col-2">
              <label for="d-cidade">CIDADE</label>
              <input id="d-cidade" name="CIDADE" type="text" placeholder="Ex.: São Paulo">
            </div>
            <div class="campo">
              <label for="d-estado">ESTADO</label>
              <input id="d-estado" name="ESTADO" type="text" placeholder="Ex.: SP">
            </div>
          </div>
        </div>

        <div class="bloco">
          <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class="grade">
            <div class="campo">
              <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="d-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" type="text" inputmode="numeric" placeholder="Ex.: 98765432100">
            </div>
            <div class="campo col-2">
              <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="d-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" type="text" placeholder="Ex.: 98.765.432-1">
            </div>
            <div class="campo">
              <label for="d-banco">NOME DO BANCO</label>
              <input id="d-banco" name="NOME DO BANCO" type="text" placeholder="Ex.: Itaú">
            </div>
            <div class="campo">
              <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
              <input id="d-agencia" name="NÚMERO DA AGÊNCIA" type="text" inputmode="numeric" placeholder="Ex.: 4321">
            </div>
            <div class="campo">
              <label for="d-conta">NÚMERO DA CONTA</label>
              <input id="d-conta" name="NÚMERO DA CONTA" type="text" placeholder="Ex.: 12345-6">
            </div>
          </div>
        </div>

        <div class="acoes">
          <button type="submit">Enviar solicitação</button>
        </div>
      </form>
    </section>

    <section id="confirmacao" class="painel">
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
