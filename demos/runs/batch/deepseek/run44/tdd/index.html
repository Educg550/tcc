<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Universidade de São Paulo">
    <div class="identidade">
      <h1>Universidade de São Paulo</h1>
      <p>Pós-Graduação - Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <nav class="abas">
    <button type="button" class="aba active" id="alunos" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" id="docentes" data-aba="docentes">DOCENTES</button>
  </nav>

  <main id="conteudo">
    <section class="painel ativo" id="painel-alunos" data-painel="alunos">
      <div class="erros" data-erros hidden></div>
      <form id="form-alunos" autocomplete="off">
        <input type="hidden" name="aba" value="alunos">
        <fieldset class="bloco">
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grade">
            <label class="campo c2"><span>NOME COMPLETO - SEM ABREVIAR</span><input type="text" name="nome_completo" placeholder="Maria da Silva Santos"></label>
            <label class="campo c1"><span>N. USP</span><input type="text" name="n_usp" inputmode="numeric" placeholder="12345678"></label>
            <label class="campo c2"><span>PROGRAMA</span><input type="text" name="programa" placeholder="Ciência da Computação"></label>
            <label class="campo c1"><span>NÍVEL</span>
              <select name="nivel">
                <option value="" selected>Selecione</option>
                <option value="Mestrado">Mestrado</option>
                <option value="Doutorado">Doutorado</option>
              </select>
            </label>
            <label class="campo c2"><span>TIPO DE AUXÍLIO</span>
              <select name="tipo_auxilio">
                <option value="" selected>Selecione</option>
                <option value="Participação em evento">Participação em evento</option>
                <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
                <option value="Outro">Outro</option>
              </select>
            </label>
            <label class="campo c2"><span>E-MAIL</span><input type="text" name="email" placeholder="maria@ime.usp.br"></label>
            <label class="campo c3"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input type="text" name="evento" placeholder="Simpósio Internacional de Matemática"></label>
            <label class="campo c2"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="periodo" placeholder="10 a 15 de janeiro de 2025"></label>
            <label class="campo c1"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span><input type="text" name="cidade_evento" placeholder="São Paulo"></label>
            <label class="campo c1"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="estado_evento" placeholder="SP"></label>
            <label class="campo c1"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span><input type="text" name="pais_evento" placeholder="Brasil"></label>
            <label class="campo c2"><span>LINK DO EVENTO, EXAME OU DEFESA</span><input type="text" name="link_evento" placeholder="https://evento.example.com"></label>
            <label class="campo c1"><span>VALOR SOLICITADO (R$)</span><input type="text" name="valor_solicitado" inputmode="numeric" placeholder="R$ 1.500,00"></label>
            <label class="campo cfull"><span>DETALHAMENTO DO PEDIDO</span><textarea name="detalhamento" rows="2" placeholder="Passagens, hospedagem e taxa de inscrição"></textarea></label>
            <label class="campo c2"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
              <select name="apresentacao">
                <option value="" selected>Selecione</option>
                <option value="Pôster">Pôster</option>
                <option value="Apresentação oral">Apresentação oral</option>
                <option value="Outra">Outra</option>
                <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
              </select>
            </label>
          </div>
        </fieldset>

        <fieldset class="bloco">
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <label class="campo c1"><span>DATA DE NASCIMENTO</span><input type="text" name="data_nascimento" inputmode="numeric" placeholder="01/02/1980"></label>
            <label class="campo c2"><span>LOGRADOURO</span><input type="text" name="logradouro" placeholder="Rua do Matão"></label>
            <label class="campo c1"><span>NÚMERO</span><input type="text" name="numero" placeholder="1010"></label>
            <label class="campo c1"><span>COMPLEMENTO</span><input type="text" name="complemento" placeholder="Bloco B, sala 2"></label>
            <label class="campo c1"><span>BAIRRO</span><input type="text" name="bairro" placeholder="Cidade Universitária"></label>
            <label class="campo c1"><span>CEP</span><input type="text" name="cep" inputmode="numeric" placeholder="05508-090"></label>
            <label class="campo c1"><span>CIDADE</span><input type="text" name="cidade" placeholder="São Paulo"></label>
            <label class="campo c1"><span>ESTADO</span><input type="text" name="estado" placeholder="SP"></label>
          </div>
        </fieldset>

        <fieldset class="bloco">
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <label class="campo c2"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" name="cpf" inputmode="numeric" placeholder="123.456.789-09"></label>
            <label class="campo c2"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" name="rg" placeholder="12.345.678-9"></label>
            <label class="campo c2"><span>NOME DO BANCO</span><input type="text" name="banco" placeholder="Banco do Brasil"></label>
            <label class="campo c1"><span>NÚMERO DA AGÊNCIA</span><input type="text" name="agencia" inputmode="numeric" placeholder="1234"></label>
            <label class="campo c1"><span>NÚMERO DA CONTA</span><input type="text" name="conta" placeholder="56789-0"></label>
          </div>
        </fieldset>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>

    <section class="painel" id="painel-docentes" data-painel="docentes">
      <div class="erros" data-erros hidden></div>
      <form id="form-docentes" autocomplete="off">
        <input type="hidden" name="aba" value="docentes">
        <fieldset class="bloco">
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grade">
            <label class="campo c2"><span>NOME COMPLETO - SEM ABREVIAR</span><input type="text" name="nome_completo" placeholder="João Pereira Lima"></label>
            <label class="campo c1"><span>N. USP</span><input type="text" name="n_usp" inputmode="numeric" placeholder="12345678"></label>
            <label class="campo c2"><span>PROGRAMA</span><input type="text" name="programa" placeholder="Ciência da Computação"></label>
            <label class="campo c2"><span>E-MAIL</span><input type="text" name="email" placeholder="joao@ime.usp.br"></label>
            <label class="campo c3"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input type="text" name="evento" placeholder="Simpósio Internacional de Matemática"></label>
            <label class="campo c2"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="periodo" placeholder="10 a 15 de janeiro de 2025"></label>
            <label class="campo c1"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span><input type="text" name="cidade_evento" placeholder="São Paulo"></label>
            <label class="campo c1"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="estado_evento" placeholder="SP"></label>
            <label class="campo c1"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span><input type="text" name="pais_evento" placeholder="Brasil"></label>
            <label class="campo c2"><span>LINK DO EVENTO, EXAME OU DEFESA</span><input type="text" name="link_evento" placeholder="https://evento.example.com"></label>
            <label class="campo c1"><span>VALOR SOLICITADO (R$)</span><input type="text" name="valor_solicitado" inputmode="numeric" placeholder="R$ 1.500,00"></label>
            <label class="campo cfull"><span>DETALHAMENTO DO PEDIDO</span><textarea name="detalhamento" rows="2" placeholder="Verba para visita técnica e diárias"></textarea></label>
            <label class="campo c2"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
              <select name="apresentacao">
                <option value="" selected>Selecione</option>
                <option value="Pôster">Pôster</option>
                <option value="Apresentação oral">Apresentação oral</option>
                <option value="Outra">Outra</option>
                <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
              </select>
            </label>
          </div>
        </fieldset>

        <fieldset class="bloco">
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <label class="campo c1"><span>DATA DE NASCIMENTO</span><input type="text" name="data_nascimento" inputmode="numeric" placeholder="01/02/1970"></label>
            <label class="campo c2"><span>LOGRADOURO</span><input type="text" name="logradouro" placeholder="Rua do Matão"></label>
            <label class="campo c1"><span>NÚMERO</span><input type="text" name="numero" placeholder="1010"></label>
            <label class="campo c1"><span>COMPLEMENTO</span><input type="text" name="complemento" placeholder="Bloco B, sala 2"></label>
            <label class="campo c1"><span>BAIRRO</span><input type="text" name="bairro" placeholder="Cidade Universitária"></label>
            <label class="campo c1"><span>CEP</span><input type="text" name="cep" inputmode="numeric" placeholder="05508-090"></label>
            <label class="campo c1"><span>CIDADE</span><input type="text" name="cidade" placeholder="São Paulo"></label>
            <label class="campo c1"><span>ESTADO</span><input type="text" name="estado" placeholder="SP"></label>
          </div>
        </fieldset>

        <fieldset class="bloco">
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <label class="campo c2"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" name="cpf" inputmode="numeric" placeholder="123.456.789-09"></label>
            <label class="campo c2"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" name="rg" placeholder="12.345.678-9"></label>
            <label class="campo c2"><span>NOME DO BANCO</span><input type="text" name="banco" placeholder="Banco do Brasil"></label>
            <label class="campo c1"><span>NÚMERO DA AGÊNCIA</span><input type="text" name="agencia" inputmode="numeric" placeholder="1234"></label>
            <label class="campo c1"><span>NÚMERO DA CONTA</span><input type="text" name="conta" placeholder="56789-0"></label>
          </div>
        </fieldset>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>

    <section class="confirmacao" id="confirmacao" hidden>
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
