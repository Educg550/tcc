<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
  <span class="logo"><img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo"></span>
  <span class="marca">
    <span class="universidade">Universidade de São Paulo</span>
    <span class="programa">Pós-Graduação do Instituto de Matemática e Estatística</span>
  </span>
</header>

<nav class="abas">
  <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
  <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
</nav>

<main>
  <form class="painel ativo" data-aba="alunos" novalidate>
    <div class="erros" hidden></div>

    <section class="bloco">
      <h2>SOLICITANTE E EVENTO</h2>
      <div class="grade">
        <label class="campo c4"><span class="rotulo">NOME COMPLETO - SEM ABREVIAR</span>
          <input type="text" name="nome" placeholder="Maria Aparecida da Silva"></label>
        <label class="campo c2"><span class="rotulo">N. USP</span>
          <input type="text" name="nusp" placeholder="12345678"></label>
        <label class="campo c2"><span class="rotulo">PROGRAMA</span>
          <input type="text" name="programa" placeholder="Matemática Aplicada"></label>

        <label class="campo c2"><span class="rotulo">NÍVEL</span>
          <select name="nivel">
            <option value="">Selecione</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select></label>
        <label class="campo c2"><span class="rotulo">TIPO DE AUXÍLIO</span>
          <select name="tipo_auxilio">
            <option value="">Selecione</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select></label>
        <label class="campo c2"><span class="rotulo">E-MAIL</span>
          <input type="email" name="email" placeholder="maria.silva@usp.br"></label>
        <label class="campo c2"><span class="rotulo">VALOR SOLICITADO (R$)</span>
          <input type="text" name="valor" data-format="valor" placeholder="150000"></label>

        <label class="campo c4"><span class="rotulo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
          <input type="text" name="evento" placeholder="Congresso Brasileiro de Matemática"></label>
        <label class="campo c4"><span class="rotulo">PERÍODO DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="periodo" placeholder="22 a 26 de julho de 2024"></label>

        <label class="campo c2"><span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="cidade_evento" placeholder="Rio de Janeiro"></label>
        <label class="campo c2"><span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="estado_evento" placeholder="RJ"></label>
        <label class="campo c2"><span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="pais_evento" placeholder="Brasil"></label>
        <label class="campo c2"><span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="link" placeholder="https://evento.exemplo.br"></label>

        <label class="campo c5"><span class="rotulo">DETALHAMENTO DO PEDIDO</span>
          <textarea name="detalhamento" rows="2" placeholder="Passagem aérea, hospedagem e inscrição"></textarea></label>
        <label class="campo c3"><span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
          <select name="apresentacao">
            <option value="">Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select></label>
      </div>
    </section>

    <section class="bloco">
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <label class="campo c2"><span class="rotulo">DATA DE NASCIMENTO</span>
          <input type="text" name="data_nascimento" data-format="data" placeholder="01021980"></label>
        <label class="campo c4"><span class="rotulo">LOGRADOURO</span>
          <input type="text" name="logradouro" placeholder="Rua do Matão"></label>
        <label class="campo c2"><span class="rotulo">NÚMERO</span>
          <input type="text" name="numero" placeholder="1010"></label>

        <label class="campo c3"><span class="rotulo">COMPLEMENTO</span>
          <input type="text" name="complemento" placeholder="Bloco B, apto 42"></label>
        <label class="campo c3"><span class="rotulo">BAIRRO</span>
          <input type="text" name="bairro" placeholder="Butantã"></label>
        <label class="campo c2"><span class="rotulo">CEP</span>
          <input type="text" name="cep" data-format="cep" placeholder="05508090"></label>

        <label class="campo c5"><span class="rotulo">CIDADE</span>
          <input type="text" name="cidade" placeholder="São Paulo"></label>
        <label class="campo c3"><span class="rotulo">ESTADO</span>
          <input type="text" name="estado" placeholder="SP"></label>
      </div>
    </section>

    <section class="bloco">
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <label class="campo c3"><span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="cpf" data-format="cpf" placeholder="12345678909"></label>
        <label class="campo c3"><span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="rg" placeholder="12.345.678-9"></label>
        <label class="campo c2"><span class="rotulo">NOME DO BANCO</span>
          <input type="text" name="banco" placeholder="Banco do Brasil"></label>

        <label class="campo c2"><span class="rotulo">NÚMERO DA AGÊNCIA</span>
          <input type="text" name="agencia" placeholder="1234"></label>
        <label class="campo c2"><span class="rotulo">NÚMERO DA CONTA</span>
          <input type="text" name="conta" placeholder="12345-6"></label>
      </div>
    </section>

    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>

  <form class="painel" data-aba="docentes" novalidate>
    <div class="erros" hidden></div>

    <section class="bloco">
      <h2>SOLICITANTE E EVENTO</h2>
      <div class="grade">
        <label class="campo c4"><span class="rotulo">NOME COMPLETO - SEM ABREVIAR</span>
          <input type="text" name="nome" placeholder="João Carlos de Oliveira"></label>
        <label class="campo c2"><span class="rotulo">N. USP</span>
          <input type="text" name="nusp" placeholder="12345678"></label>
        <label class="campo c2"><span class="rotulo">PROGRAMA</span>
          <input type="text" name="programa" placeholder="Matemática Aplicada"></label>

        <label class="campo c2"><span class="rotulo">E-MAIL</span>
          <input type="email" name="email" placeholder="joao.oliveira@usp.br"></label>
        <label class="campo c2"><span class="rotulo">VALOR SOLICITADO (R$)</span>
          <input type="text" name="valor" data-format="valor" placeholder="150000"></label>
        <label class="campo c4"><span class="rotulo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
          <input type="text" name="evento" placeholder="Congresso Brasileiro de Matemática"></label>

        <label class="campo c4"><span class="rotulo">PERÍODO DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="periodo" placeholder="22 a 26 de julho de 2024"></label>
        <label class="campo c2"><span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="cidade_evento" placeholder="Rio de Janeiro"></label>
        <label class="campo c2"><span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="estado_evento" placeholder="RJ"></label>

        <label class="campo c2"><span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="pais_evento" placeholder="Brasil"></label>
        <label class="campo c2"><span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="link" placeholder="https://evento.exemplo.br"></label>
        <label class="campo c4"><span class="rotulo">DETALHAMENTO DO PEDIDO</span>
          <textarea name="detalhamento" rows="2" placeholder="Passagem aérea e diárias"></textarea></label>

        <label class="campo c4"><span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
          <select name="apresentacao">
            <option value="">Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select></label>
      </div>
    </section>

    <section class="bloco">
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <label class="campo c2"><span class="rotulo">DATA DE NASCIMENTO</span>
          <input type="text" name="data_nascimento" data-format="data" placeholder="01021980"></label>
        <label class="campo c4"><span class="rotulo">LOGRADOURO</span>
          <input type="text" name="logradouro" placeholder="Rua do Matão"></label>
        <label class="campo c2"><span class="rotulo">NÚMERO</span>
          <input type="text" name="numero" placeholder="1010"></label>

        <label class="campo c3"><span class="rotulo">COMPLEMENTO</span>
          <input type="text" name="complemento" placeholder="Bloco B, apto 42"></label>
        <label class="campo c3"><span class="rotulo">BAIRRO</span>
          <input type="text" name="bairro" placeholder="Butantã"></label>
        <label class="campo c2"><span class="rotulo">CEP</span>
          <input type="text" name="cep" data-format="cep" placeholder="05508090"></label>

        <label class="campo c5"><span class="rotulo">CIDADE</span>
          <input type="text" name="cidade" placeholder="São Paulo"></label>
        <label class="campo c3"><span class="rotulo">ESTADO</span>
          <input type="text" name="estado" placeholder="SP"></label>
      </div>
    </section>

    <section class="bloco">
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <label class="campo c3"><span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="cpf" data-format="cpf" placeholder="12345678909"></label>
        <label class="campo c3"><span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="rg" placeholder="12.345.678-9"></label>
        <label class="campo c2"><span class="rotulo">NOME DO BANCO</span>
          <input type="text" name="banco" placeholder="Banco do Brasil"></label>

        <label class="campo c2"><span class="rotulo">NÚMERO DA AGÊNCIA</span>
          <input type="text" name="agencia" placeholder="1234"></label>
        <label class="campo c2"><span class="rotulo">NÚMERO DA CONTA</span>
          <input type="text" name="conta" placeholder="12345-6"></label>
      </div>
    </section>

    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>
</main>

<section id="confirmacao" hidden>
  <h1>Solicitação registrada</h1>
  <pre id="oficio"></pre>
</section>

<script src="app.js"></script>
</body>
</html>
