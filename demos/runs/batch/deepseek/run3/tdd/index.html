<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="cabecalho">
  <img class="logo" src="/assets/usp-logo.png" alt="Universidade de São Paulo">
  <div class="identidade">
    <span class="instituicao">Universidade de São Paulo</span>
    <span class="programa">Pós-Graduação - Instituto de Matemática e Estatística</span>
  </div>
</header>

<main class="conteudo">

  <nav class="abas">
    <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>

  <section class="painel" id="painel-alunos">
    <form class="formulario" data-aba="alunos" novalidate>
      <div class="erros oculto" id="erros-alunos" role="alert"></div>

      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="campos">
          <label class="campo largo">
            <span class="rotulo">NOME COMPLETO - SEM ABREVIAR</span>
            <input type="text" name="nome" placeholder="Maria da Silva Santos">
          </label>
          <label class="campo curto">
            <span class="rotulo">N. USP</span>
            <input type="text" name="nusp" inputmode="numeric" placeholder="12345678">
          </label>
          <label class="campo">
            <span class="rotulo">PROGRAMA</span>
            <input type="text" name="programa" placeholder="Ciência da Computação">
          </label>
          <label class="campo curto">
            <span class="rotulo">NÍVEL</span>
            <select name="nivel">
              <option value="" disabled selected>Selecione</option>
              <option value="Mestrado">Mestrado</option>
              <option value="Doutorado">Doutorado</option>
            </select>
          </label>
          <label class="campo">
            <span class="rotulo">TIPO DE AUXÍLIO</span>
            <select name="tipo_auxilio">
              <option value="" disabled selected>Selecione</option>
              <option value="Participação em evento">Participação em evento</option>
              <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
              <option value="Outro">Outro</option>
            </select>
          </label>
          <label class="campo">
            <span class="rotulo">E-MAIL</span>
            <input type="email" name="email" placeholder="maria.santos@usp.br">
          </label>
          <label class="campo largo">
            <span class="rotulo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
            <input type="text" name="evento" placeholder="Simpósio Brasileiro de Computação">
          </label>
          <label class="campo">
            <span class="rotulo">PERÍODO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="periodo" placeholder="10 a 15 de março de 2025">
          </label>
          <label class="campo curto">
            <span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="cidade_evento" placeholder="Florianópolis">
          </label>
          <label class="campo curto">
            <span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="estado_evento" placeholder="SC">
          </label>
          <label class="campo curto">
            <span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="pais_evento" placeholder="Brasil">
          </label>
          <label class="campo largo">
            <span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="link" placeholder="https://evento.exemplo.br">
          </label>
          <label class="campo curto">
            <span class="rotulo">VALOR SOLICITADO (R$)</span>
            <input type="text" name="valor" class="js-moeda" inputmode="numeric" placeholder="R$ 1.500,00">
          </label>
          <label class="campo todo">
            <span class="rotulo">DETALHAMENTO DO PEDIDO</span>
            <textarea name="detalhamento" rows="2" placeholder="Passagem aérea e hospedagem"></textarea>
          </label>
          <label class="campo largo">
            <span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="apresentacao">
              <option value="" disabled selected>Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="campos">
          <label class="campo curto">
            <span class="rotulo">DATA DE NASCIMENTO</span>
            <input type="text" name="nascimento" class="js-data" inputmode="numeric" placeholder="01/02/1980">
          </label>
          <label class="campo largo">
            <span class="rotulo">LOGRADOURO</span>
            <input type="text" name="logradouro" placeholder="Av. Prof. Luciano Gualberto">
          </label>
          <label class="campo curto">
            <span class="rotulo">NÚMERO</span>
            <input type="text" name="numero" placeholder="158">
          </label>
          <label class="campo">
            <span class="rotulo">COMPLEMENTO</span>
            <input type="text" name="complemento" placeholder="Bloco B, sala 3">
          </label>
          <label class="campo">
            <span class="rotulo">BAIRRO</span>
            <input type="text" name="bairro" placeholder="Butantã">
          </label>
          <label class="campo curto">
            <span class="rotulo">CEP</span>
            <input type="text" name="cep" class="js-cep" inputmode="numeric" placeholder="05508-090">
          </label>
          <label class="campo">
            <span class="rotulo">CIDADE</span>
            <input type="text" name="cidade" placeholder="São Paulo">
          </label>
          <label class="campo curto">
            <span class="rotulo">ESTADO</span>
            <input type="text" name="estado" placeholder="SP">
          </label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="campos">
          <label class="campo">
            <span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="cpf" class="js-cpf" inputmode="numeric" placeholder="123.456.789-09">
          </label>
          <label class="campo">
            <span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="rg" placeholder="12.345.678-9">
          </label>
          <label class="campo">
            <span class="rotulo">NOME DO BANCO</span>
            <input type="text" name="banco" placeholder="Banco do Brasil">
          </label>
          <label class="campo curto">
            <span class="rotulo">NÚMERO DA AGÊNCIA</span>
            <input type="text" name="agencia" inputmode="numeric" placeholder="1234">
          </label>
          <label class="campo curto">
            <span class="rotulo">NÚMERO DA CONTA</span>
            <input type="text" name="conta" placeholder="12345-6">
          </label>
        </div>
      </fieldset>

      <button type="submit" class="botao">Enviar solicitação</button>
    </form>
  </section>

        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="campos">

          <label class="campo">

  </section>

  <section class="confirmacao oculto" id="confirmacao">
    <h1>Solicitação registrada</h1>
    <pre class="oficio" id="oficio"></pre>
  </section>

</main>

<script src="/app.js"></script>
</body>
</html>
