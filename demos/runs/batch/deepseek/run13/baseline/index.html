<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação do IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identidade">
    <span class="universidade">Universidade de São Paulo</span>
    <span class="pos">Pós-Graduação do IME-USP</span>
  </div>
</header>

<main id="formulario">
  <nav class="abas">
    <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>

  <form class="painel ativo" data-form="alunos" novalidate>
    <div class="erros"></div>

    <fieldset class="bloco">
      <legend>SOLICITANTE E EVENTO</legend>
      <div class="campos">
        <label class="campo col2"><span>NOME COMPLETO - SEM ABREVIAR</span><input type="text" name="nome_completo" placeholder="Ex.: Maria Aparecida da Silva"></label>
        <label class="campo"><span>N. USP</span><input type="text" inputmode="numeric" name="n_usp" placeholder="Ex.: 12345678"></label>
        <label class="campo"><span>PROGRAMA</span><input type="text" name="programa" placeholder="Ex.: Ciência da Computação"></label>
        <label class="campo"><span>NÍVEL</span><select name="nivel"><option value="" disabled selected>Selecione</option><option>Mestrado</option><option>Doutorado</option></select></label>
        <label class="campo"><span>TIPO DE AUXÍLIO</span><select name="tipo_auxilio"><option value="" disabled selected>Selecione</option><option>Participação em evento</option><option>Banca de exame ou defesa</option><option>Outro</option></select></label>
        <label class="campo"><span>E-MAIL</span><input type="text" name="email" placeholder="Ex.: maria@usp.br"></label>
        <label class="campo"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input type="text" name="nome_evento" placeholder="Ex.: Congresso Brasileiro de Computação"></label>
        <label class="campo"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="periodo" placeholder="Ex.: 10/03/2025 a 14/03/2025"></label>
        <label class="campo"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span><input type="text" name="cidade_evento" placeholder="Ex.: Campinas"></label>
        <label class="campo"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="estado_evento" placeholder="Ex.: SP"></label>
        <label class="campo"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span><input type="text" name="pais_evento" placeholder="Ex.: Brasil"></label>
        <label class="campo col2"><span>LINK DO EVENTO, EXAME OU DEFESA</span><input type="text" name="link_evento" placeholder="Ex.: https://evento.exemplo.org"></label>
        <label class="campo"><span>VALOR SOLICITADO (R$)</span><input type="text" inputmode="numeric" name="valor" placeholder="Ex.: 150000"></label>
        <label class="campo"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span><select name="apresentacao"><option value="" disabled selected>Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
        <label class="campo col4"><span>DETALHAMENTO DO PEDIDO</span><textarea name="detalhamento" rows="2" placeholder="Ex.: Passagem aérea e hospedagem durante o evento"></textarea></label>
      </div>
    </fieldset>

    <fieldset class="bloco">
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class="campos">
        <label class="campo"><span>DATA DE NASCIMENTO</span><input type="text" inputmode="numeric" name="data_nascimento" placeholder="Ex.: 01021980"></label>
        <label class="campo col2"><span>LOGRADOURO</span><input type="text" name="logradouro" placeholder="Ex.: Av. Professor Luciano Gualberto"></label>
        <label class="campo"><span>NÚMERO</span><input type="text" name="numero" placeholder="Ex.: 158"></label>
        <label class="campo col2"><span>COMPLEMENTO</span><input type="text" name="complemento" placeholder="Ex.: Bloco A, sala 100"></label>
        <label class="campo"><span>BAIRRO</span><input type="text" name="bairro" placeholder="Ex.: Butantã"></label>
        <label class="campo"><span>CEP</span><input type="text" inputmode="numeric" name="cep" placeholder="Ex.: 05508090"></label>
        <label class="campo"><span>CIDADE</span><input type="text" name="cidade" placeholder="Ex.: São Paulo"></label>
        <label class="campo"><span>ESTADO</span><input type="text" name="estado" placeholder="Ex.: SP"></label>
      </div>
    </fieldset>

    <fieldset class="bloco">
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="campos">
        <label class="campo"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" inputmode="numeric" name="cpf" placeholder="Ex.: 12345678909"></label>
        <label class="campo"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" name="rg" placeholder="Ex.: 12.345.678-9"></label>
        <label class="campo col2"><span>NOME DO BANCO</span><input type="text" name="banco" placeholder="Ex.: Banco do Brasil"></label>
        <label class="campo"><span>NÚMERO DA AGÊNCIA</span><input type="text" inputmode="numeric" name="agencia" placeholder="Ex.: 1234"></label>
        <label class="campo"><span>NÚMERO DA CONTA</span><input type="text" name="conta" placeholder="Ex.: 12345-6"></label>
      </div>
    </fieldset>

    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>

  <form class="painel" data-form="docentes" novalidate>
    <div class="erros"></div>

    <fieldset class="bloco">
      <legend>SOLICITANTE E EVENTO</legend>
      <div class="campos">
        <label class="campo col2"><span>NOME COMPLETO - SEM ABREVIAR</span><input type="text" name="nome_completo" placeholder="Ex.: João Carlos de Souza"></label>
        <label class="campo"><span>N. USP</span><input type="text" inputmode="numeric" name="n_usp" placeholder="Ex.: 12345678"></label>
        <label class="campo"><span>PROGRAMA</span><input type="text" name="programa" placeholder="Ex.: Ciência da Computação"></label>
        <label class="campo"><span>E-MAIL</span><input type="text" name="email" placeholder="Ex.: joao@usp.br"></label>
        <label class="campo col2"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input type="text" name="nome_evento" placeholder="Ex.: Congresso Brasileiro de Computação"></label>
        <label class="campo"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="periodo" placeholder="Ex.: 10/03/2025 a 14/03/2025"></label>
        <label class="campo"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span><input type="text" name="cidade_evento" placeholder="Ex.: Campinas"></label>
        <label class="campo"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="estado_evento" placeholder="Ex.: SP"></label>
        <label class="campo"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span><input type="text" name="pais_evento" placeholder="Ex.: Brasil"></label>
        <label class="campo col2"><span>LINK DO EVENTO, EXAME OU DEFESA</span><input type="text" name="link_evento" placeholder="Ex.: https://evento.exemplo.org"></label>
        <label class="campo"><span>VALOR SOLICITADO (R$)</span><input type="text" inputmode="numeric" name="valor" placeholder="Ex.: 150000"></label>
        <label class="campo"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span><select name="apresentacao"><option value="" disabled selected>Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
        <label class="campo col4"><span>DETALHAMENTO DO PEDIDO</span><textarea name="detalhamento" rows="2" placeholder="Ex.: Passagem aérea e hospedagem durante o evento"></textarea></label>
      </div>
    </fieldset>

    <fieldset class="bloco">
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class="campos">
        <label class="campo"><span>DATA DE NASCIMENTO</span><input type="text" inputmode="numeric" name="data_nascimento" placeholder="Ex.: 01021980"></label>
        <label class="campo col2"><span>LOGRADOURO</span><input type="text" name="logradouro" placeholder="Ex.: Av. Professor Luciano Gualberto"></label>
        <label class="campo"><span>NÚMERO</span><input type="text" name="numero" placeholder="Ex.: 158"></label>
        <label class="campo col2"><span>COMPLEMENTO</span><input type="text" name="complemento" placeholder="Ex.: Bloco A, sala 100"></label>
        <label class="campo"><span>BAIRRO</span><input type="text" name="bairro" placeholder="Ex.: Butantã"></label>
        <label class="campo"><span>CEP</span><input type="text" inputmode="numeric" name="cep" placeholder="Ex.: 05508090"></label>
        <label class="campo"><span>CIDADE</span><input type="text" name="cidade" placeholder="Ex.: São Paulo"></label>
        <label class="campo"><span>ESTADO</span><input type="text" name="estado" placeholder="Ex.: SP"></label>
      </div>
    </fieldset>

    <fieldset class="bloco">
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="campos">
        <label class="campo"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" inputmode="numeric" name="cpf" placeholder="Ex.: 12345678909"></label>
        <label class="campo"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" name="rg" placeholder="Ex.: 12.345.678-9"></label>
        <label class="campo col2"><span>NOME DO BANCO</span><input type="text" name="banco" placeholder="Ex.: Banco do Brasil"></label>
        <label class="campo"><span>NÚMERO DA AGÊNCIA</span><input type="text" inputmode="numeric" name="agencia" placeholder="Ex.: 1234"></label>
        <label class="campo"><span>NÚMERO DA CONTA</span><input type="text" name="conta" placeholder="Ex.: 12345-6"></label>
      </div>
    </fieldset>

    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>
</main>

<section id="confirmacao">
  <h2>Solicitação registrada</h2>
  <pre id="oficio"></pre>
</section>

<script src="app.js"></script>
</body>
</html>
