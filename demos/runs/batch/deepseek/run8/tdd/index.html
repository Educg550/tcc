<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>

<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Universidade de São Paulo">
  <div class="identidade">
    <h1>Universidade de São Paulo</h1>
    <p>Programa de Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>

<nav class="abas" role="tablist" aria-label="Solicitação de auxílio financeiro">
  <button type="button" class="aba ativa" role="tab" aria-selected="true" data-aba="alunos">ALUNOS</button>
  <button type="button" class="aba" role="tab" aria-selected="false" data-aba="docentes">DOCENTES</button>
</nav>

<main>

<section class="painel" data-aba="alunos">
<form class="formulario" data-aba="alunos" novalidate>
  <div class="erros" hidden></div>

  <fieldset class="bloco">
    <legend>SOLICITANTE E EVENTO</legend>
    <div class="grade">
      <label class="campo c3"><span>NOME COMPLETO - SEM ABREVIAR</span>
        <input type="text" name="nome" placeholder="Maria Aparecida da Silva"></label>
      <label class="campo c1"><span>N. USP</span>
        <input type="text" name="n_usp" inputmode="numeric" placeholder="12345678"></label>
      <label class="campo c2"><span>PROGRAMA</span>
        <input type="text" name="programa" placeholder="Matemática Aplicada"></label>

      <label class="campo c1"><span>NÍVEL</span>
        <select name="nivel">
          <option value="">Selecione</option>
          <option>Mestrado</option>
          <option>Doutorado</option>
        </select></label>
      <label class="campo c2"><span>TIPO DE AUXÍLIO</span>
        <select name="tipo_auxilio">
          <option value="">Selecione</option>
          <option>Participação em evento</option>
          <option>Banca de exame ou defesa</option>
          <option>Outro</option>
        </select></label>
      <label class="campo c3"><span>E-MAIL</span>
        <input type="email" name="email" placeholder="maria.silva@usp.br"></label>

      <label class="campo c3"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
        <input type="text" name="evento" placeholder="Congresso Brasileiro de Matemática"></label>
      <label class="campo c1"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
        <input type="text" name="periodo" placeholder="20 a 25 de julho de 2025"></label>
      <label class="campo c1"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
        <input type="text" name="cidade_evento" placeholder="Rio de Janeiro"></label>
      <label class="campo c1"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
        <input type="text" name="estado_evento" placeholder="RJ"></label>

      <label class="campo c1"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
        <input type="text" name="pais_evento" placeholder="Brasil"></label>
      <label class="campo c2"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
        <input type="text" name="link_evento" placeholder="https://evento.exemplo.br"></label>
      <label class="campo c1"><span>VALOR SOLICITADO (R$)</span>
        <input type="text" name="valor" inputmode="numeric" data-mascara="valor" placeholder="R$ 1.500,00"></label>
      <label class="campo c2"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
        <select name="apresentacao">
          <option value="">Selecione</option>
          <option>Pôster</option>
          <option>Apresentação oral</option>
          <option>Outra</option>
          <option>Não irá apresentar trabalho</option>
        </select></label>

      <label class="campo c6"><span>DETALHAMENTO DO PEDIDO</span>
        <textarea name="detalhamento" rows="2" placeholder="Passagem aérea e hospedagem, 4 diárias"></textarea></label>
    </div>
  </fieldset>

  <fieldset class="bloco">
    <legend>ENDEREÇO DO SOLICITANTE</legend>
    <div class="grade">
      <label class="campo c1"><span>DATA DE NASCIMENTO</span>
        <input type="text" name="data_nascimento" inputmode="numeric" data-mascara="data_nascimento" placeholder="01/02/1980"></label>
      <label class="campo c2"><span>LOGRADOURO</span>
        <input type="text" name="logradouro" placeholder="Rua do Matão"></label>
      <label class="campo c1"><span>NÚMERO</span>
        <input type="text" name="numero" placeholder="1010"></label>
      <label class="campo c2"><span>COMPLEMENTO</span>
        <input type="text" name="complemento" placeholder="Bloco B, ap. 42"></label>

      <label class="campo c2"><span>BAIRRO</span>
        <input type="text" name="bairro" placeholder="Butantã"></label>
      <label class="campo c1"><span>CEP</span>
        <input type="text" name="cep" inputmode="numeric" data-mascara="cep" placeholder="05508-090"></label>
      <label class="campo c2"><span>CIDADE</span>
        <input type="text" name="cidade" placeholder="São Paulo"></label>
      <label class="campo c1"><span>ESTADO</span>
        <input type="text" name="estado" placeholder="SP"></label>
    </div>
  </fieldset>

  <fieldset class="bloco">
    <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
    <div class="grade">
      <label class="campo c1"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
        <input type="text" name="cpf" inputmode="numeric" data-mascara="cpf" placeholder="123.456.789-09"></label>
      <label class="campo c1"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
        <input type="text" name="rg" placeholder="12.345.678-9"></label>
      <label class="campo c2"><span>NOME DO BANCO</span>
        <input type="text" name="banco" placeholder="Banco do Brasil"></label>
      <label class="campo c1"><span>NÚMERO DA AGÊNCIA</span>
        <input type="text" name="agencia" inputmode="numeric" placeholder="1234"></label>
      <label class="campo c1"><span>NÚMERO DA CONTA</span>
        <input type="text" name="conta" placeholder="12345-6"></label>
    </div>
  </fieldset>

  <div class="acoes"><button type="submit" class="enviar">Enviar solicitação</button></div>
</form>
</section>

<section class="painel" data-aba="docentes" hidden>
<form class="formulario" data-aba="docentes" novalidate>
  <div class="erros" hidden></div>

  <fieldset class="bloco">
    <legend>SOLICITANTE E EVENTO</legend>
    <div class="grade">
      <label class="campo c3"><span>NOME COMPLETO - SEM ABREVIAR</span>
        <input type="text" name="nome" placeholder="João Carlos Ferreira"></label>
      <label class="campo c1"><span>N. USP</span>
        <input type="text" name="n_usp" inputmode="numeric" placeholder="87654321"></label>
      <label class="campo c2"><span>PROGRAMA</span>
        <input type="text" name="programa" placeholder="Ciência da Computação"></label>

      <label class="campo c3"><span>E-MAIL</span>
        <input type="email" name="email" placeholder="joao.ferreira@usp.br"></label>
      <label class="campo c3"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
        <input type="text" name="evento" placeholder="Simpósio de Estatística"></label>

      <label class="campo c1"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
        <input type="text" name="periodo" placeholder="05 a 08 de agosto de 2025"></label>
      <label class="campo c1"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
        <input type="text" name="cidade_evento" placeholder="Belo Horizonte"></label>
      <label class="campo c1"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
        <input type="text" name="estado_evento" placeholder="MG"></label>
      <label class="campo c1"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
        <input type="text" name="pais_evento" placeholder="Brasil"></label>

      <label class="campo c2"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
        <input type="text" name="link_evento" placeholder="https://evento.exemplo.br"></label>
      <label class="campo c1"><span>VALOR SOLICITADO (R$)</span>
        <input type="text" name="valor" inputmode="numeric" data-mascara="valor" placeholder="R$ 2.300,00"></label>
      <label class="campo c3"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
        <select name="apresentacao">
          <option value="">Selecione</option>
          <option>Pôster</option>
          <option>Apresentação oral</option>
          <option>Outra</option>
          <option>Não irá apresentar trabalho</option>
        </select></label>

      <label class="campo c6"><span>DETALHAMENTO DO PEDIDO</span>
        <textarea name="detalhamento" rows="2" placeholder="Mesa-redonda e deslocamento, 3 diárias"></textarea></label>
    </div>
  </fieldset>

  <fieldset class="bloco">
    <legend>ENDEREÇO DO SOLICITANTE</legend>
    <div class="grade">
      <label class="campo c1"><span>DATA DE NASCIMENTO</span>
        <input type="text" name="data_nascimento" inputmode="numeric" data-mascara="data_nascimento" placeholder="23/11/1975"></label>
      <label class="campo c2"><span>LOGRADOURO</span>
        <input type="text" name="logradouro" placeholder="Av. Prof. Luciano Gualberto"></label>
      <label class="campo c1"><span>NÚMERO</span>
        <input type="text" name="numero" placeholder="1178"></label>
      <label class="campo c2"><span>COMPLEMENTO</span>
        <input type="text" name="complemento" placeholder="Sala 205"></label>

      <label class="campo c2"><span>BAIRRO</span>
        <input type="text" name="bairro" placeholder="Butantã"></label>
      <label class="campo c1"><span>CEP</span>
        <input type="text" name="cep" inputmode="numeric" data-mascara="cep" placeholder="05508-010"></label>
      <label class="campo c2"><span>CIDADE</span>
        <input type="text" name="cidade" placeholder="São Paulo"></label>
      <label class="campo c1"><span>ESTADO</span>
        <input type="text" name="estado" placeholder="SP"></label>
    </div>
  </fieldset>

  <fieldset class="bloco">
    <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
    <div class="grade">
      <label class="campo c1"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
        <input type="text" name="cpf" inputmode="numeric" data-mascara="cpf" placeholder="987.654.321-00"></label>
      <label class="campo c1"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
        <input type="text" name="rg" placeholder="98.765.432-1"></label>
      <label class="campo c2"><span>NOME DO BANCO</span>
        <input type="text" name="banco" placeholder="Itaú Unibanco"></label>
      <label class="campo c1"><span>NÚMERO DA AGÊNCIA</span>
        <input type="text" name="agencia" inputmode="numeric" placeholder="0987"></label>
      <label class="campo c1"><span>NÚMERO DA CONTA</span>
        <input type="text" name="conta" placeholder="98765-4"></label>
    </div>
  </fieldset>

  <div class="acoes"><button type="submit" class="enviar">Enviar solicitação</button></div>
</form>
</section>

<section id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <pre id="oficio"></pre>
</section>

</main>

</body>
</html>
