<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação do IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identificacao">
    <p class="universidade">Universidade de São Paulo</p>
    <p class="programa">Pós-Graduação do IME-USP</p>
  </div>
</header>

<main id="principal">

  <div class="abas" role="tablist">
    <button type="button" class="aba ativa" id="aba-alunos" role="tab" aria-selected="true" aria-controls="painel-alunos">ALUNOS</button>
    <button type="button" class="aba" id="aba-docentes" role="tab" aria-selected="false" aria-controls="painel-docentes">DOCENTES</button>
  </div>

  <section class="painel" id="painel-alunos" role="tabpanel" aria-labelledby="aba-alunos">
    <form id="form-alunos" data-aba="alunos" novalidate>
      <div class="erros" role="alert" aria-live="polite"></div>

      <div class="bloco">
        <h2>SOLICITANTE E EVENTO</h2>
        <div class="campos">
          <div class="campo c6">
            <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="a-nome" name="nome" type="text" placeholder="Maria Aparecida de Souza">
          </div>
          <div class="campo c2">
            <label for="a-n-usp">N. USP</label>
            <input id="a-n-usp" name="n_usp" type="text" inputmode="numeric" placeholder="12345678">
          </div>
          <div class="campo c4">
            <label for="a-programa">PROGRAMA</label>
            <input id="a-programa" name="programa" type="text" placeholder="Ciência da Computação">
          </div>
          <div class="campo c3">
            <label for="a-nivel">NÍVEL</label>
            <select id="a-nivel" name="nivel">
              <option value="">Doutorado</option>
              <option value="Mestrado">Mestrado</option>
              <option value="Doutorado">Doutorado</option>
            </select>
          </div>
          <div class="campo c3">
            <label for="a-tipo">TIPO DE AUXÍLIO</label>
            <select id="a-tipo" name="tipo_auxilio">
              <option value="">Participação em evento</option>
              <option value="Participação em evento">Participação em evento</option>
              <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div class="campo c6">
            <label for="a-email">E-MAIL</label>
            <input id="a-email" name="email" type="text" inputmode="email" placeholder="maria.souza@usp.br">
          </div>
          <div class="campo c6">
            <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="a-evento" name="nome_evento" type="text" placeholder="Congresso Brasileiro de Computação">
          </div>
          <div class="campo c6">
            <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-periodo" name="periodo" type="text" placeholder="20 a 24 de outubro de 2025">
          </div>
          <div class="campo c3">
            <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-cidade-evento" name="cidade_evento" type="text" placeholder="São Paulo">
          </div>
          <div class="campo c3">
            <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-estado-evento" name="estado_evento" type="text" placeholder="SP">
          </div>
          <div class="campo c3">
            <label for="a-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-pais-evento" name="pais_evento" type="text" placeholder="Brasil">
          </div>
          <div class="campo c3">
            <label for="a-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-link" name="link_evento" type="text" placeholder="https://evento.exemplo.com">
          </div>
          <div class="campo c3">
            <label for="a-valor">VALOR SOLICITADO (R$)</label>
            <input id="a-valor" name="valor" type="text" inputmode="numeric" placeholder="150000">
          </div>
          <div class="campo c6">
            <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="a-detalhamento" name="detalhamento" placeholder="Deslocamento, hospedagem e taxa de inscrição"></textarea>
          </div>
          <div class="campo c3">
            <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="a-apresentacao" name="apresentacao">
              <option value="">Apresentação oral</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </div>

      <div class="bloco">
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="campos">
          <div class="campo c3">
            <label for="a-nascimento">DATA DE NASCIMENTO</label>
            <input id="a-nascimento" name="data_nascimento" type="text" inputmode="numeric" placeholder="01021980">
          </div>
          <div class="campo c5">
            <label for="a-logradouro">LOGRADOURO</label>
            <input id="a-logradouro" name="logradouro" type="text" placeholder="Av. Prof. Luciano Gualberto">
          </div>
          <div class="campo c2">
            <label for="a-numero">NÚMERO</label>
            <input id="a-numero" name="numero" type="text" placeholder="158">
          </div>
          <div class="campo c2">
            <label for="a-complemento">COMPLEMENTO</label>
            <input id="a-complemento" name="complemento" type="text" placeholder="Bloco A, sala 12">
          </div>
          <div class="campo c4">
            <label for="a-bairro">BAIRRO</label>
            <input id="a-bairro" name="bairro" type="text" placeholder="Butantã">
          </div>
          <div class="campo c3">
            <label for="a-cep">CEP</label>
            <input id="a-cep" name="cep" type="text" inputmode="numeric" placeholder="05508090">
          </div>
          <div class="campo c3">
            <label for="a-cidade">CIDADE</label>
            <input id="a-cidade" name="cidade" type="text" placeholder="São Paulo">
          </div>
          <div class="campo c2">
            <label for="a-estado">ESTADO</label>
            <input id="a-estado" name="estado" type="text" placeholder="SP">
          </div>
        </div>
      </div>

      <div class="bloco">
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="campos">
          <div class="campo c3">
            <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-cpf" name="cpf" type="text" inputmode="numeric" placeholder="12345678909">
          </div>
          <div class="campo c3">
            <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-rg" name="rg" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo c2">
            <label for="a-banco">NOME DO BANCO</label>
            <input id="a-banco" name="banco" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo c2">
            <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="a-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo c2">
            <label for="a-conta">NÚMERO DA CONTA</label>
            <input id="a-conta" name="conta" type="text" placeholder="12345-6">
          </div>
        </div>
      </div>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section class="painel oculto" id="painel-docentes" role="tabpanel" aria-labelledby="aba-docentes">
    <form id="form-docentes" data-aba="docentes" novalidate>
      <div class="erros" role="alert" aria-live="polite"></div>

          <div class="campo c4">

          <div class="campo c4">

              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </div>

      <div class="bloco">
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="campos">
          <div class="campo c3">
            <label for="d-nascimento">DATA DE NASCIMENTO</label>
            <input id="d-nascimento" name="data_nascimento" type="text" inputmode="numeric" placeholder="01021980">
          </div>
          <div class="campo c5">
            <label for="d-logradouro">LOGRADOURO</label>
            <input id="d-logradouro" name="logradouro" type="text" placeholder="Av. Prof. Luciano Gualberto">
          </div>
          <div class="campo c2">
            <label for="d-numero">NÚMERO</label>
            <input id="d-numero" name="numero" type="text" placeholder="158">
          </div>
          <div class="campo c2">
            <label for="d-complemento">COMPLEMENTO</label>
            <input id="d-complemento" name="complemento" type="text" placeholder="Bloco A, sala 12">
          </div>
          <div class="campo c4">
            <label for="d-bairro">BAIRRO</label>
            <input id="d-bairro" name="bairro" type="text" placeholder="Butantã">
          </div>
          <div class="campo c3">
            <label for="d-cep">CEP</label>
            <input id="d-cep" name="cep" type="text" inputmode="numeric" placeholder="05508090">
          </div>
          <div class="campo c3">
            <label for="d-cidade">CIDADE</label>
            <input id="d-cidade" name="cidade" type="text" placeholder="São Paulo">
          </div>
          <div class="campo c2">
            <label for="d-estado">ESTADO</label>
            <input id="d-estado" name="estado" type="text" placeholder="SP">
          </div>
        </div>
      </div>

      <div class="bloco">
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="campos">
          <div class="campo c3">
            <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-cpf" name="cpf" type="text" inputmode="numeric" placeholder="12345678909">

          <div class="campo c3">
            <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-rg" name="rg" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo c2">
            <label for="d-banco">NOME DO BANCO</label>

          </div>
          <div class="campo c2">

    </form>
  </section>

</main>

<section id="confirmacao" class="oculto">
  <h1>Solicitação registrada</h1>
  <pre id="oficio"></pre>
</section>

<script src="app.js"></script>
</body>
</html>
