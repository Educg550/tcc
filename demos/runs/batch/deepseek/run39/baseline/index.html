<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div>
      <h1>Universidade de São Paulo</h1>
      <p>Programa de Pós-Graduação - Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <main id="formulario">
    <div class="tabs">
      <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
      <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
    </div>

    <form id="form-alunos" class="painel">
      <div class="erros" hidden></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <label class="campo c3"><span>NOME COMPLETO - SEM ABREVIAR</span><input name="nome" placeholder="Maria Aparecida da Silva"></label>
          <label class="campo c1"><span>N. USP</span><input name="n_usp" placeholder="12345678"></label>
          <label class="campo c2"><span>PROGRAMA</span><input name="programa" placeholder="Matemática Aplicada"></label>
          <label class="campo c2"><span>NÍVEL</span>
            <select name="nivel">
              <option value="">Selecione</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </label>
          <label class="campo c2"><span>TIPO DE AUXÍLIO</span>
            <select name="tipo_auxilio">
              <option value="">Selecione</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </label>
          <label class="campo c2"><span>E-MAIL</span><input name="email" placeholder="maria@ime.usp.br"></label>
          <label class="campo c4"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input name="evento" placeholder="Congresso Brasileiro de Matemática"></label>
          <label class="campo c2"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input name="periodo" placeholder="20 a 25 de julho de 2025"></label>
          <label class="campo c2"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span><input name="cidade_evento" placeholder="Rio de Janeiro"></label>
          <label class="campo c2"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span><input name="estado_evento" placeholder="RJ"></label>
          <label class="campo c2"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span><input name="pais_evento" placeholder="Brasil"></label>
          <label class="campo c3"><span>LINK DO EVENTO, EXAME OU DEFESA</span><input name="link" placeholder="https://evento.org.br"></label>
          <label class="campo c3"><span>VALOR SOLICITADO (R$)</span><input name="valor" inputmode="numeric" placeholder="R$ 1.500,00"></label>
          <label class="campo c4"><span>DETALHAMENTO DO PEDIDO</span><textarea name="detalhamento" placeholder="Passagem aérea e hospedagem para apresentação de trabalho."></textarea></label>
          <label class="campo c2"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="apresentacao">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="campo c2"><span>DATA DE NASCIMENTO</span><input name="data_nascimento" inputmode="numeric" placeholder="01/02/1980"></label>
          <label class="campo c3"><span>LOGRADOURO</span><input name="logradouro" placeholder="Av. Prof. Luciano Gualberto"></label>
          <label class="campo c1"><span>NÚMERO</span><input name="numero" placeholder="1234"></label>
          <label class="campo c2"><span>COMPLEMENTO</span><input name="complemento" placeholder="Bloco B, apto 42"></label>
          <label class="campo c2"><span>BAIRRO</span><input name="bairro" placeholder="Butantã"></label>
          <label class="campo c2"><span>CEP</span><input name="cep" inputmode="numeric" placeholder="05508-090"></label>
          <label class="campo c3"><span>CIDADE</span><input name="cidade" placeholder="São Paulo"></label>
          <label class="campo c3"><span>ESTADO</span><input name="estado" placeholder="SP"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="campo c2"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input name="cpf" inputmode="numeric" placeholder="123.456.789-09"></label>
          <label class="campo c2"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input name="rg" placeholder="12.345.678-9"></label>
          <label class="campo c2"><span>NOME DO BANCO</span><input name="banco" placeholder="Banco do Brasil"></label>
          <label class="campo c2"><span>NÚMERO DA AGÊNCIA</span><input name="agencia" inputmode="numeric" placeholder="1234"></label>
          <label class="campo c2"><span>NÚMERO DA CONTA</span><input name="conta" placeholder="12345-6"></label>
        </div>
      </fieldset>

      <div class="acoes"><button type="submit" class="enviar">Enviar solicitação</button></div>
    </form>

    <form id="form-docentes" class="painel" hidden>
      <div class="erros" hidden></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <label class="campo c3"><span>NOME COMPLETO - SEM ABREVIAR</span><input name="nome" placeholder="João Batista de Souza"></label>
          <label class="campo c1"><span>N. USP</span><input name="n_usp" placeholder="12345678"></label>
          <label class="campo c2"><span>PROGRAMA</span><input name="programa" placeholder="Matemática Aplicada"></label>
          <label class="campo c2"><span>E-MAIL</span><input name="email" placeholder="joao@ime.usp.br"></label>
          <label class="campo c4"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input name="evento" placeholder="Congresso Brasileiro de Matemática"></label>
          <label class="campo c2"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input name="periodo" placeholder="20 a 25 de julho de 2025"></label>
          <label class="campo c2"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span><input name="cidade_evento" placeholder="Rio de Janeiro"></label>
          <label class="campo c2"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span><input name="estado_evento" placeholder="RJ"></label>
          <label class="campo c2"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span><input name="pais_evento" placeholder="Brasil"></label>
          <label class="campo c2"><span>LINK DO EVENTO, EXAME OU DEFESA</span><input name="link" placeholder="https://evento.org.br"></label>
          <label class="campo c2"><span>VALOR SOLICITADO (R$)</span><input name="valor" inputmode="numeric" placeholder="R$ 1.500,00"></label>
          <label class="campo c2"><span>DETALHAMENTO DO PEDIDO</span><textarea name="detalhamento" placeholder="Passagem aérea e hospedagem para apresentação de trabalho."></textarea></label>
          <label class="campo c6"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="apresentacao">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="campo c2"><span>DATA DE NASCIMENTO</span><input name="data_nascimento" inputmode="numeric" placeholder="01/02/1980"></label>
          <label class="campo c3"><span>LOGRADOURO</span><input name="logradouro" placeholder="Av. Prof. Luciano Gualberto"></label>
          <label class="campo c1"><span>NÚMERO</span><input name="numero" placeholder="1234"></label>
          <label class="campo c2"><span>COMPLEMENTO</span><input name="complemento" placeholder="Bloco B, apto 42"></label>
          <label class="campo c2"><span>BAIRRO</span><input name="bairro" placeholder="Butantã"></label>
          <label class="campo c2"><span>CEP</span><input name="cep" inputmode="numeric" placeholder="05508-090"></label>
          <label class="campo c3"><span>CIDADE</span><input name="cidade" placeholder="São Paulo"></label>
          <label class="campo c3"><span>ESTADO</span><input name="estado" placeholder="SP"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="campo c2"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input name="cpf" inputmode="numeric" placeholder="123.456.789-09"></label>
          <label class="campo c2"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input name="rg" placeholder="12.345.678-9"></label>
          <label class="campo c2"><span>NOME DO BANCO</span><input name="banco" placeholder="Banco do Brasil"></label>
          <label class="campo c2"><span>NÚMERO DA AGÊNCIA</span><input name="agencia" inputmode="numeric" placeholder="1234"></label>
          <label class="campo c2"><span>NÚMERO DA CONTA</span><input name="conta" placeholder="12345-6"></label>
        </div>
      </fieldset>

      <div class="acoes"><button type="submit" class="enviar">Enviar solicitação</button></div>
    </form>
  </main>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio" class="oficio"></pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
