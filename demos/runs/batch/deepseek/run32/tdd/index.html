<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="institucional">
  <img class="logo" src="/assets/usp-logo.png" alt="Universidade de São Paulo">
  <div class="identidade">
    <h1>Universidade de São Paulo</h1>
    <p>Instituto de Matemática e Estatística &middot; Pós-Graduação</p>
  </div>
</header>

<nav class="abas" role="tablist" aria-label="Tipo de solicitante">
  <button type="button" class="aba ativa" data-aba="alunos" role="tab" aria-selected="true">ALUNOS</button>
  <button type="button" class="aba" data-aba="docentes" role="tab" aria-selected="false">DOCENTES</button>
</nav>

<main id="area-formularios">
  <form class="painel ativo" data-aba="alunos" novalidate>
    <div class="erros" hidden></div>

    <section class="bloco">
      <h2>SOLICITANTE E EVENTO</h2>
      <div class="grade">
        <div class="campo c3">
          <label for="a-nome_completo">NOME COMPLETO - SEM ABREVIAR</label>
          <input id="a-nome_completo" name="nome_completo" placeholder="Maria da Silva">
        </div>
        <div class="campo c1">
          <label for="a-n_usp">N. USP</label>
          <input id="a-n_usp" name="n_usp" inputmode="numeric" placeholder="12345678">
        </div>
        <div class="campo c2">
          <label for="a-programa">PROGRAMA</label>
          <input id="a-programa" name="programa" placeholder="Matemática Aplicada">
        </div>
        <div class="campo c1">
          <label for="a-nivel">NÍVEL</label>
          <select id="a-nivel" name="nivel">
            <option value="" selected>Selecione</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select>
        </div>
        <div class="campo c2">
          <label for="a-tipo_auxilio">TIPO DE AUXÍLIO</label>
          <select id="a-tipo_auxilio" name="tipo_auxilio">
            <option value="" selected>Selecione</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select>
        </div>
        <div class="campo c3">
          <label for="a-email">E-MAIL</label>
          <input id="a-email" name="email" placeholder="maria@ime.usp.br">
        </div>
        <div class="campo c3">
          <label for="a-nome_evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input id="a-nome_evento" name="nome_evento" placeholder="Congresso Brasileiro de Matemática">
        </div>
        <div class="campo c3">
          <label for="a-periodo_evento">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input id="a-periodo_evento" name="periodo_evento" placeholder="10 a 15 de julho de 2024">
        </div>
        <div class="campo c2">
          <label for="a-cidade_evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input id="a-cidade_evento" name="cidade_evento" placeholder="Rio de Janeiro">
        </div>
        <div class="campo c1">
          <label for="a-estado_evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input id="a-estado_evento" name="estado_evento" placeholder="RJ">
        </div>
        <div class="campo c1">
          <label for="a-pais_evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input id="a-pais_evento" name="pais_evento" placeholder="Brasil">
        </div>
        <div class="campo c2">
          <label for="a-link_evento">LINK DO EVENTO, EXAME OU DEFESA</label>
          <input id="a-link_evento" name="link_evento" placeholder="https://evento.ime.usp.br">
        </div>
        <div class="campo c2">
          <label for="a-valor_solicitado">VALOR SOLICITADO (R$)</label>
          <input id="a-valor_solicitado" name="valor_solicitado" inputmode="numeric" placeholder="150000">
        </div>
        <div class="campo c4">
          <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id="a-apresentacao" name="apresentacao">
            <option value="" selected>Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </div>
        <div class="campo c6">
          <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
          <textarea id="a-detalhamento" name="detalhamento" rows="2" placeholder="Passagem aérea, hospedagem e taxa de inscrição"></textarea>
        </div>
      </div>
    </section>

    <section class="bloco">
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <div class="campo c2">
          <label for="a-data_nascimento">DATA DE NASCIMENTO</label>
          <input id="a-data_nascimento" name="data_nascimento" inputmode="numeric" placeholder="01021980">
        </div>
        <div class="campo c3">
          <label for="a-logradouro">LOGRADOURO</label>
          <input id="a-logradouro" name="logradouro" placeholder="Rua do Matão">
        </div>
        <div class="campo c1">
          <label for="a-numero">NÚMERO</label>
          <input id="a-numero" name="numero" placeholder="1010">
        </div>
        <div class="campo c2">
          <label for="a-complemento">COMPLEMENTO</label>
          <input id="a-complemento" name="complemento" placeholder="Bloco B, sala 3">
        </div>
        <div class="campo c2">
          <label for="a-bairro">BAIRRO</label>
          <input id="a-bairro" name="bairro" placeholder="Cidade Universitária">
        </div>
        <div class="campo c2">
          <label for="a-cep">CEP</label>
          <input id="a-cep" name="cep" inputmode="numeric" placeholder="05508090">
        </div>
        <div class="campo c3">
          <label for="a-cidade">CIDADE</label>
          <input id="a-cidade" name="cidade" placeholder="São Paulo">
        </div>
        <div class="campo c3">
          <label for="a-estado">ESTADO</label>
          <input id="a-estado" name="estado" placeholder="SP">
        </div>
      </div>
    </section>

    <section class="bloco">
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <div class="campo c2">
          <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id="a-cpf" name="cpf" inputmode="numeric" placeholder="12345678909">
        </div>
        <div class="campo c2">
          <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id="a-rg" name="rg" placeholder="12.345.678-9">
        </div>
        <div class="campo c2">
          <label for="a-banco">NOME DO BANCO</label>
          <input id="a-banco" name="banco" placeholder="Banco do Brasil">
        </div>
        <div class="campo c2">
          <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
          <input id="a-agencia" name="agencia" inputmode="numeric" placeholder="1234">
        </div>
        <div class="campo c2">
          <label for="a-conta">NÚMERO DA CONTA</label>
          <input id="a-conta" name="conta" placeholder="12345-6">
        </div>
      </div>
    </section>

    <button class="enviar" type="submit">Enviar solicitação</button>
  </form>

  <form class="painel" data-aba="docentes" novalidate>
    <div class="erros" hidden></div>

    <section class="bloco">
      <h2>SOLICITANTE E EVENTO</h2>
      <div class="grade">
        <div class="campo c3">
          <label for="d-nome_completo">NOME COMPLETO - SEM ABREVIAR</label>
          <input id="d-nome_completo" name="nome_completo" placeholder="João Pereira">
        </div>
        <div class="campo c1">
          <label for="d-n_usp">N. USP</label>
          <input id="d-n_usp" name="n_usp" inputmode="numeric" placeholder="1234567">
        </div>
        <div class="campo c2">
          <label for="d-programa">PROGRAMA</label>
          <input id="d-programa" name="programa" placeholder="Matemática Aplicada">
        </div>
        <div class="campo c2">
          <label for="d-email">E-MAIL</label>
          <input id="d-email" name="email" placeholder="joao@ime.usp.br">
        </div>
        <div class="campo c4">
          <label for="d-nome_evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input id="d-nome_evento" name="nome_evento" placeholder="Congresso Brasileiro de Matemática">
        </div>
        <div class="campo c2">
          <label for="d-periodo_evento">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input id="d-periodo_evento" name="periodo_evento" placeholder="10 a 15 de julho de 2024">
        </div>
        <div class="campo c2">
          <label for="d-cidade_evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input id="d-cidade_evento" name="cidade_evento" placeholder="Rio de Janeiro">
        </div>
        <div class="campo c1">
          <label for="d-estado_evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input id="d-estado_evento" name="estado_evento" placeholder="RJ">
        </div>
        <div class="campo c1">
          <label for="d-pais_evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input id="d-pais_evento" name="pais_evento" placeholder="Brasil">
        </div>
        <div class="campo c3">
          <label for="d-link_evento">LINK DO EVENTO, EXAME OU DEFESA</label>
          <input id="d-link_evento" name="link_evento" placeholder="https://evento.ime.usp.br">
        </div>
        <div class="campo c3">
          <label for="d-valor_solicitado">VALOR SOLICITADO (R$)</label>
          <input id="d-valor_solicitado" name="valor_solicitado" inputmode="numeric" placeholder="150000">
        </div>
        <div class="campo c3">
          <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id="d-apresentacao" name="apresentacao">
            <option value="" selected>Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </div>
        <div class="campo c6">
          <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
          <textarea id="d-detalhamento" name="detalhamento" rows="2" placeholder="Passagens, hospedagem e taxa de inscrição"></textarea>
        </div>
      </div>
    </section>

    <section class="bloco">
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <div class="campo c2">
          <label for="d-data_nascimento">DATA DE NASCIMENTO</label>
          <input id="d-data_nascimento" name="data_nascimento" inputmode="numeric" placeholder="01021980">
        </div>
        <div class="campo c3">
          <label for="d-logradouro">LOGRADOURO</label>
          <input id="d-logradouro" name="logradouro" placeholder="Rua do Matão">
        </div>
        <div class="campo c1">
          <label for="d-numero">NÚMERO</label>
          <input id="d-numero" name="numero" placeholder="1010">
        </div>
        <div class="campo c2">
          <label for="d-complemento">COMPLEMENTO</label>
          <input id="d-complemento" name="complemento" placeholder="Bloco B, sala 3">
        </div>
        <div class="campo c2">
          <label for="d-bairro">BAIRRO</label>
          <input id="d-bairro" name="bairro" placeholder="Cidade Universitária">
        </div>
        <div class="campo c2">
          <label for="d-cep">CEP</label>
          <input id="d-cep" name="cep" inputmode="numeric" placeholder="05508090">
        </div>
        <div class="campo c3">
          <label for="d-cidade">CIDADE</label>
          <input id="d-cidade" name="cidade" placeholder="São Paulo">
        </div>
        <div class="campo c3">
          <label for="d-estado">ESTADO</label>
          <input id="d-estado" name="estado" placeholder="SP">
        </div>
      </div>
    </section>

    <section class="bloco">
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <div class="campo c2">
          <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id="d-cpf" name="cpf" inputmode="numeric" placeholder="12345678909">
        </div>
        <div class="campo c2">
          <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id="d-rg" name="rg" placeholder="12.345.678-9">
        </div>
        <div class="campo c2">
          <label for="d-banco">NOME DO BANCO</label>
          <input id="d-banco" name="banco" placeholder="Banco do Brasil">
        </div>
        <div class="campo c2">
          <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
          <input id="d-agencia" name="agencia" inputmode="numeric" placeholder="1234">
        </div>
        <div class="campo c2">
          <label for="d-conta">NÚMERO DA CONTA</label>
          <input id="d-conta" name="conta" placeholder="12345-6">
        </div>
      </div>
    </section>

    <button class="enviar" type="submit">Enviar solicitação</button>
  </form>
</main>

<section id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <pre id="oficio"></pre>
</section>

<script src="/app.js"></script>
</body>
</html>
