<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <div class="logo-area">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  </div>
  <div class="identidade">
    <h1>Universidade de São Paulo</h1>
    <p class="programa-nome">Programa de Pós-Graduação em Ciência da Computação - IME-USP</p>
  </div>
</header>

<nav class="abas" aria-label="Escolha do formulário">
  <button type="button" class="aba ativa" data-aba="ALUNOS">ALUNOS</button>
  <button type="button" class="aba" data-aba="DOCENTES">DOCENTES</button>
</nav>

<main class="conteudo">
  <section class="painel" id="painel-ALUNOS">
    <form class="formulario" data-aba="ALUNOS" novalidate>
      <div class="erros" role="alert" aria-live="polite"></div>
      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <label class="campo largo">
            <span>NOME COMPLETO - SEM ABREVIAR</span>
            <input type="text" name="nome_completo" placeholder="Ex.: Maria da Silva Souza">
          </label>
          <label class="campo">
            <span>N. USP</span>
            <input type="text" name="n_usp" inputmode="numeric" placeholder="Ex.: 12345678">
          </label>
          <label class="campo">
            <span>PROGRAMA</span>
            <input type="text" name="programa" placeholder="Ex.: Ciência da Computação">
          </label>
          <label class="campo">
            <span>NÍVEL</span>
            <select name="nivel">
              <option value="">Selecione</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </label>
          <label class="campo">
            <span>TIPO DE AUXÍLIO</span>
            <select name="tipo_auxilio">
              <option value="">Selecione</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </label>
          <label class="campo">
            <span>E-MAIL</span>
            <input type="email" name="email" placeholder="Ex.: maria@ime.usp.br">
          </label>
          <label class="campo largo">
            <span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
            <input type="text" name="nome_evento" placeholder="Ex.: Congresso Brasileiro de Computação">
          </label>
          <label class="campo">
            <span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="periodo_evento" placeholder="Ex.: 10/10/2024 a 12/10/2024">
          </label>
          <label class="campo">
            <span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="cidade_evento" placeholder="Ex.: São Paulo">
          </label>
          <label class="campo curto">
            <span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="estado_evento" placeholder="Ex.: SP">
          </label>
          <label class="campo curto">
            <span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="pais_evento" placeholder="Ex.: Brasil">
          </label>
          <label class="campo">
            <span>LINK DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="link_evento" placeholder="Ex.: https://evento.usp.br">
          </label>
          <label class="campo">
            <span>VALOR SOLICITADO (R$)</span>
            <input type="text" name="valor_solicitado" inputmode="numeric" placeholder="Ex.: 150000">
          </label>
          <label class="campo largo">
            <span>DETALHAMENTO DO PEDIDO</span>
            <textarea name="detalhamento" rows="2" placeholder="Ex.: Passagens, hospedagem e inscrição"></textarea>
          </label>
          <label class="campo">
            <span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="apresentacao">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </label>
        </div>
      </fieldset>
      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="campo">
            <span>DATA DE NASCIMENTO</span>
            <input type="text" name="data_nascimento" inputmode="numeric" placeholder="Ex.: 01021980">
          </label>
          <label class="campo largo">
            <span>LOGRADOURO</span>
            <input type="text" name="logradouro" placeholder="Ex.: Rua do Matão">
          </label>
          <label class="campo curto">
            <span>NÚMERO</span>
            <input type="text" name="numero" placeholder="Ex.: 1010">
          </label>
          <label class="campo">
            <span>COMPLEMENTO</span>
            <input type="text" name="complemento" placeholder="Ex.: Bloco B, sala 102">
          </label>
          <label class="campo">
            <span>BAIRRO</span>
            <input type="text" name="bairro" placeholder="Ex.: Butantã">
          </label>
          <label class="campo curto">
            <span>CEP</span>
            <input type="text" name="cep" inputmode="numeric" placeholder="Ex.: 05508090">
          </label>
          <label class="campo">
            <span>CIDADE</span>
            <input type="text" name="cidade" placeholder="Ex.: São Paulo">
          </label>
          <label class="campo curto">
            <span>ESTADO</span>
            <input type="text" name="estado" placeholder="Ex.: SP">
          </label>
        </div>
      </fieldset>
      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="campo">
            <span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="cpf" inputmode="numeric" placeholder="Ex.: 12345678909">
          </label>
          <label class="campo">
            <span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="rg" placeholder="Ex.: 12.345.678-9">
          </label>
          <label class="campo">
            <span>NOME DO BANCO</span>
            <input type="text" name="nome_banco" placeholder="Ex.: Banco do Brasil">
          </label>
          <label class="campo curto">
            <span>NÚMERO DA AGÊNCIA</span>
            <input type="text" name="numero_agencia" inputmode="numeric" placeholder="Ex.: 1234">
          </label>
          <label class="campo">
            <span>NÚMERO DA CONTA</span>
            <input type="text" name="numero_conta" placeholder="Ex.: 12345-6">
          </label>
        </div>
      </fieldset>
      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section class="painel oculto" id="painel-DOCENTES">
    <form class="formulario" data-aba="DOCENTES" novalidate>
      <div class="erros" role="alert" aria-live="polite"></div>
      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <label class="campo largo">
            <span>NOME COMPLETO - SEM ABREVIAR</span>
            <input type="text" name="nome_completo" placeholder="Ex.: João Pereira Lima">
          </label>
          <label class="campo">
            <span>N. USP</span>
            <input type="text" name="n_usp" inputmode="numeric" placeholder="Ex.: 87654321">
          </label>
          <label class="campo">
            <span>PROGRAMA</span>
            <input type="text" name="programa" placeholder="Ex.: Ciência da Computação">
          </label>
          <label class="campo">
            <span>E-MAIL</span>
            <input type="email" name="email" placeholder="Ex.: joao@ime.usp.br">
          </label>
          <label class="campo largo">
            <span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
            <input type="text" name="nome_evento" placeholder="Ex.: Simpósio de Matemática Aplicada">
          </label>
          <label class="campo">
            <span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="periodo_evento" placeholder="Ex.: 05/11/2024 a 08/11/2024">
          </label>
          <label class="campo">
            <span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="cidade_evento" placeholder="Ex.: Campinas">
          </label>
          <label class="campo curto">
            <span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="estado_evento" placeholder="Ex.: SP">
          </label>
          <label class="campo curto">
            <span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="pais_evento" placeholder="Ex.: Brasil">
          </label>
          <label class="campo">
            <span>LINK DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="link_evento" placeholder="Ex.: https://evento.usp.br">
          </label>
          <label class="campo">
            <span>VALOR SOLICITADO (R$)</span>
            <input type="text" name="valor_solicitado" inputmode="numeric" placeholder="Ex.: 150000">
          </label>
          <label class="campo largo">
            <span>DETALHAMENTO DO PEDIDO</span>
            <textarea name="detalhamento" rows="2" placeholder="Ex.: Passagens e diárias"></textarea>
          </label>
          <label class="campo">
            <span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="apresentacao">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </label>
        </div>
      </fieldset>
      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="campo">
            <span>DATA DE NASCIMENTO</span>
            <input type="text" name="data_nascimento" inputmode="numeric" placeholder="Ex.: 01021980">
          </label>
          <label class="campo largo">
            <span>LOGRADOURO</span>
            <input type="text" name="logradouro" placeholder="Ex.: Av. Prof. Luciano Gualberto">
          </label>
          <label class="campo curto">
            <span>NÚMERO</span>
            <input type="text" name="numero" placeholder="Ex.: 158">
          </label>
          <label class="campo">
            <span>COMPLEMENTO</span>
            <input type="text" name="complemento" placeholder="Ex.: Sala 210">
          </label>
          <label class="campo">
            <span>BAIRRO</span>
            <input type="text" name="bairro" placeholder="Ex.: Butantã">
          </label>
          <label class="campo curto">
            <span>CEP</span>
            <input type="text" name="cep" inputmode="numeric" placeholder="Ex.: 05508090">
          </label>
          <label class="campo">
            <span>CIDADE</span>
            <input type="text" name="cidade" placeholder="Ex.: São Paulo">
          </label>
          <label class="campo curto">
            <span>ESTADO</span>
            <input type="text" name="estado" placeholder="Ex.: SP">
          </label>
        </div>
      </fieldset>
      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="campo">
            <span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="cpf" inputmode="numeric" placeholder="Ex.: 12345678909">
          </label>
          <label class="campo">
            <span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="rg" placeholder="Ex.: 12.345.678-9">
          </label>
          <label class="campo">
            <span>NOME DO BANCO</span>
            <input type="text" name="nome_banco" placeholder="Ex.: Banco do Brasil">
          </label>
          <label class="campo curto">
            <span>NÚMERO DA AGÊNCIA</span>
            <input type="text" name="numero_agencia" inputmode="numeric" placeholder="Ex.: 1234">
          </label>
          <label class="campo">
            <span>NÚMERO DA CONTA</span>
            <input type="text" name="numero_conta" placeholder="Ex.: 12345-6">
          </label>
        </div>
      </fieldset>
      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section class="confirmacao oculto" id="confirmacao">
    <h2>Solicitação registrada</h2>
    <pre class="oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
