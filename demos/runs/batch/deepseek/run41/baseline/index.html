<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identidade">
    <span class="universidade">Universidade de São Paulo</span>
    <span class="programa">Programa de Pós-Graduação do IME-USP</span>
  </div>
</header>

<nav class="abas">
  <button type="button" class="aba ativa" id="aba-alunos" data-aba="alunos" aria-selected="true">ALUNOS</button>
  <button type="button" class="aba" id="aba-docentes" data-aba="docentes" aria-selected="false">DOCENTES</button>
</nav>

<main class="principal">

  <section class="painel" id="painel-alunos">
    <p class="erros" id="erros-alunos" role="alert" hidden></p>
    <form class="formulario" id="form-alunos" data-aba="alunos" novalidate>

      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo l3">
            <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="a-nome" name="nome" type="text" placeholder="Maria Aparecida da Silva" required>
          </div>
          <div class="campo">
            <label for="a-nusp">N. USP</label>
            <input id="a-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="12345678" required>
          </div>
          <div class="campo l2">
            <label for="a-programa">PROGRAMA</label>
            <input id="a-programa" name="programa" type="text" placeholder="Ciência da Computação" required>
          </div>
          <div class="campo l2">
            <label for="a-nivel">NÍVEL</label>
            <select id="a-nivel" name="nivel" required>
              <option value="">Selecione o nível</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class="campo l2">
            <label for="a-tipo">TIPO DE AUXÍLIO</label>
            <select id="a-tipo" name="tipo_auxilio" required>
              <option value="">Selecione o tipo de auxílio</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>
          <div class="campo l2">
            <label for="a-email">E-MAIL</label>
            <input id="a-email" name="email" type="email" placeholder="maria.silva@usp.br" required>
          </div>
          <div class="campo l3">
            <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="a-evento" name="evento" type="text" placeholder="Simpósio Brasileiro de Redes de Computadores" required>
          </div>
          <div class="campo l3">
            <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-periodo" name="periodo" type="text" placeholder="20 a 24 de maio de 2024" required>
          </div>
          <div class="campo l2">
            <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-cidade-evento" name="cidade_evento" type="text" placeholder="Belo Horizonte" required>
          </div>
          <div class="campo l2">
            <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-estado-evento" name="estado_evento" type="text" placeholder="MG" required>
          </div>
          <div class="campo l2">
            <label for="a-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-pais-evento" name="pais_evento" type="text" placeholder="Brasil" required>
          </div>
          <div class="campo l2">
            <label for="a-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-link" name="link_evento" type="text" placeholder="https://evento.exemplo.br">
          </div>
          <div class="campo l2">
            <label for="a-valor">VALOR SOLICITADO (R$)</label>
            <input id="a-valor" name="valor" type="text" inputmode="numeric" data-mascara="moeda" placeholder="R$ 1.500,00" required>
          </div>
          <div class="campo l2">
            <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="a-apresentacao" name="apresentacao" required>
              <option value="">Selecione o tipo de apresentação</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo l6">
            <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="a-detalhamento" name="detalhamento" rows="2" placeholder="Passagens aéreas, hospedagem e taxa de inscrição" required></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo l2">
            <label for="a-nascimento">DATA DE NASCIMENTO</label>
            <input id="a-nascimento" name="data_nascimento" type="text" inputmode="numeric" data-mascara="data" placeholder="01/02/1980" required>
          </div>
          <div class="campo l4">
            <label for="a-logradouro">LOGRADOURO</label>
            <input id="a-logradouro" name="logradouro" type="text" placeholder="Rua do Matão" required>
          </div>
          <div class="campo l2">
            <label for="a-numero">NÚMERO</label>
            <input id="a-numero" name="numero" type="text" placeholder="1010" required>
          </div>
          <div class="campo l4">
            <label for="a-complemento">COMPLEMENTO</label>
            <input id="a-complemento" name="complemento" type="text" placeholder="Bloco B, sala 12">
          </div>
          <div class="campo l2">
            <label for="a-bairro">BAIRRO</label>
            <input id="a-bairro" name="bairro" type="text" placeholder="Butantã" required>
          </div>
          <div class="campo">
            <label for="a-cep">CEP</label>
            <input id="a-cep" name="cep" type="text" inputmode="numeric" data-mascara="cep" placeholder="05508-090" required>
          </div>
          <div class="campo l2">
            <label for="a-cidade">CIDADE</label>
            <input id="a-cidade" name="cidade" type="text" placeholder="São Paulo" required>
          </div>
          <div class="campo">
            <label for="a-estado">ESTADO</label>
            <input id="a-estado" name="estado" type="text" placeholder="SP" required>
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo l2">
            <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-cpf" name="cpf" type="text" inputmode="numeric" data-mascara="cpf" placeholder="123.456.789-09" required>
          </div>
          <div class="campo l2">
            <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-rg" name="rg" type="text" placeholder="12.345.678-9" required>
          </div>
          <div class="campo l2">
            <label for="a-banco">NOME DO BANCO</label>
            <input id="a-banco" name="banco" type="text" placeholder="Banco do Brasil" required>
          </div>
          <div class="campo l2">
            <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="a-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234" required>
          </div>
          <div class="campo l4">
            <label for="a-conta">NÚMERO DA CONTA</label>
            <input id="a-conta" name="conta" type="text" placeholder="12345-6" required>
          </div>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section class="painel" id="painel-docentes" hidden>
    <p class="erros" id="erros-docentes" role="alert" hidden></p>
    <form class="formulario" id="form-docentes" data-aba="docentes" novalidate>

      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo l3">
            <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="d-nome" name="nome" type="text" placeholder="João Carlos Ferreira" required>
          </div>
          <div class="campo">
            <label for="d-nusp">N. USP</label>
            <input id="d-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="12345678" required>
          </div>
          <div class="campo l2">
            <label for="d-programa">PROGRAMA</label>
            <input id="d-programa" name="programa" type="text" placeholder="Ciência da Computação" required>
          </div>
          <div class="campo l2">
            <label for="d-email">E-MAIL</label>
            <input id="d-email" name="email" type="email" placeholder="joao.ferreira@usp.br" required>
          </div>
          <div class="campo l4">
            <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="d-evento" name="evento" type="text" placeholder="Congresso Brasileiro de Computação" required>
          </div>
          <div class="campo l3">
            <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-periodo" name="periodo" type="text" placeholder="20 a 24 de maio de 2024" required>
          </div>
          <div class="campo l3">
            <label for="d-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-cidade-evento" name="cidade_evento" type="text" placeholder="Belo Horizonte" required>
          </div>
          <div class="campo l2">
            <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-estado-evento" name="estado_evento" type="text" placeholder="MG" required>
          </div>
          <div class="campo l2">
            <label for="d-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-pais-evento" name="pais_evento" type="text" placeholder="Brasil" required>
          </div>
          <div class="campo l2">
            <label for="d-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-link" name="link_evento" type="text" placeholder="https://evento.exemplo.br">
          </div>
          <div class="campo l2">
            <label for="d-valor">VALOR SOLICITADO (R$)</label>
            <input id="d-valor" name="valor" type="text" inputmode="numeric" data-mascara="moeda" placeholder="R$ 1.500,00" required>
          </div>
          <div class="campo l4">
            <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="d-apresentacao" name="apresentacao" required>
              <option value="">Selecione o tipo de apresentação</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo l6">
            <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="d-detalhamento" name="detalhamento" rows="2" placeholder="Passagens aéreas, hospedagem e taxa de inscrição" required></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo l2">
            <label for="d-nascimento">DATA DE NASCIMENTO</label>
            <input id="d-nascimento" name="data_nascimento" type="text" inputmode="numeric" data-mascara="data" placeholder="01/02/1980" required>
          </div>
          <div class="campo l4">
            <label for="d-logradouro">LOGRADOURO</label>
            <input id="d-logradouro" name="logradouro" type="text" placeholder="Rua do Matão" required>
          </div>
          <div class="campo l2">
            <label for="d-numero">NÚMERO</label>
            <input id="d-numero" name="numero" type="text" placeholder="1010" required>
          </div>
          <div class="campo l4">
            <label for="d-complemento">COMPLEMENTO</label>
            <input id="d-complemento" name="complemento" type="text" placeholder="Bloco B, sala 12">
          </div>
          <div class="campo l2">
            <label for="d-bairro">BAIRRO</label>
            <input id="d-bairro" name="bairro" type="text" placeholder="Butantã" required>
          </div>
          <div class="campo">
            <label for="d-cep">CEP</label>
            <input id="d-cep" name="cep" type="text" inputmode="numeric" data-mascara="cep" placeholder="05508-090" required>
          </div>
          <div class="campo l2">
            <label for="d-cidade">CIDADE</label>
            <input id="d-cidade" name="cidade" type="text" placeholder="São Paulo" required>
          </div>
          <div class="campo">
            <label for="d-estado">ESTADO</label>
            <input id="d-estado" name="estado" type="text" placeholder="SP" required>
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo l2">
            <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-cpf" name="cpf" type="text" inputmode="numeric" data-mascara="cpf" placeholder="123.456.789-09" required>
          </div>
          <div class="campo l2">
            <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-rg" name="rg" type="text" placeholder="12.345.678-9" required>
          </div>
          <div class="campo l2">
            <label for="d-banco">NOME DO BANCO</label>
            <input id="d-banco" name="banco" type="text" placeholder="Banco do Brasil" required>
          </div>
          <div class="campo l2">
            <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="d-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234" required>
          </div>
          <div class="campo l4">
            <label for="d-conta">NÚMERO DA CONTA</label>
            <input id="d-conta" name="conta" type="text" placeholder="12345-6" required>
          </div>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section class="confirmacao" id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre class="oficio" id="oficio"></pre>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
