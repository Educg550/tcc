<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <div class="logo-area"><img src="assets/usp-logo.png" alt="Universidade de São Paulo"></div>
  <div class="titulos">
    <span class="universidade">Universidade de São Paulo</span>
    <span class="programa">Programa de Pós-Graduação - Instituto de Matemática e Estatística</span>
  </div>
</header>
<div id="app">
  <nav class="abas">
    <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>
  <main>
    <section id="form-alunos" class="painel ativo">
      <form class="form-solicitacao" data-tipo="aluno" novalidate>
        <div class="erros"></div>
        <div class="bloco">
          <h3>SOLICITANTE E EVENTO</h3>
          <div class="grade">
            <label class="campo c3"><span>NOME COMPLETO - SEM ABREVIAR</span><input type="text" name="nome" placeholder="Maria da Silva Santos"></label>
            <label class="campo c1"><span>N. USP</span><input type="text" inputmode="numeric" name="n_usp" placeholder="12345678"></label>
            <label class="campo c2"><span>PROGRAMA</span><input type="text" name="programa" placeholder="Ciência da Computação"></label>
            <label class="campo c1"><span>NÍVEL</span><select name="nivel"><option value="">Selecione</option><option>Mestrado</option><option>Doutorado</option></select></label>
            <label class="campo c2"><span>TIPO DE AUXÍLIO</span><select name="tipo_auxilio"><option value="">Selecione</option><option>Participação em evento</option><option>Banca de exame ou defesa</option><option>Outro</option></select></label>
            <label class="campo c3"><span>E-MAIL</span><input type="email" name="email" placeholder="maria.silva@usp.br"></label>
            <label class="campo c4"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input type="text" name="evento" placeholder="Congresso Brasileiro de Computação"></label>
            <label class="campo c2"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="periodo" placeholder="12 a 15 de julho de 2025"></label>
            <label class="campo c2"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span><input type="text" name="cidade_evento" placeholder="São Paulo"></label>
            <label class="campo c1"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="estado_evento" placeholder="SP"></label>
            <label class="campo c1"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span><input type="text" name="pais_evento" placeholder="Brasil"></label>
            <label class="campo c2"><span>LINK DO EVENTO, EXAME OU DEFESA</span><input type="text" name="link_evento" placeholder="https://evento.exemplo.br"></label>
            <label class="campo c2"><span>VALOR SOLICITADO (R$)</span><input type="text" inputmode="numeric" name="valor" data-format="valor" placeholder="150000"></label>
            <label class="campo c4"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span><select name="apresentacao"><option value="">Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
            <label class="campo c6"><span>DETALHAMENTO DO PEDIDO</span><textarea name="detalhamento" rows="2" placeholder="Passagem aérea e hospedagem"></textarea></label>
          </div>
        </div>
        <div class="bloco">
          <h3>ENDEREÇO DO SOLICITANTE</h3>
          <div class="grade">
            <label class="campo c1"><span>DATA DE NASCIMENTO</span><input type="text" inputmode="numeric" name="data_nascimento" data-format="data" placeholder="01021990"></label>
            <label class="campo c2"><span>LOGRADOURO</span><input type="text" name="logradouro" placeholder="Av. Prof. Luciano Gualberto"></label>
            <label class="campo c1"><span>NÚMERO</span><input type="text" name="numero" placeholder="158"></label>
            <label class="campo c2"><span>COMPLEMENTO</span><input type="text" name="complemento" placeholder="Bloco B, ap. 42"></label>
            <label class="campo c2"><span>BAIRRO</span><input type="text" name="bairro" placeholder="Butantã"></label>
            <label class="campo c2"><span>CEP</span><input type="text" inputmode="numeric" name="cep" data-format="cep" placeholder="05508090"></label>
            <label class="campo c1"><span>CIDADE</span><input type="text" name="cidade" placeholder="São Paulo"></label>
            <label class="campo c1"><span>ESTADO</span><input type="text" name="estado" placeholder="SP"></label>
          </div>
        </div>
        <div class="bloco">
          <h3>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h3>
          <div class="grade">
            <label class="campo c2"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" inputmode="numeric" name="cpf" data-format="cpf" placeholder="123.456.789-09"></label>
            <label class="campo c2"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" name="rg" placeholder="12.345.678-9"></label>
            <label class="campo c2"><span>NOME DO BANCO</span><input type="text" name="banco" placeholder="Banco do Brasil"></label>
            <label class="campo c3"><span>NÚMERO DA AGÊNCIA</span><input type="text" inputmode="numeric" name="agencia" placeholder="1234"></label>
            <label class="campo c3"><span>NÚMERO DA CONTA</span><input type="text" name="conta" placeholder="12345-6"></label>
          </div>
        </div>
        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>
    <section id="form-docentes" class="painel">
      <form class="form-solicitacao" data-tipo="docente" novalidate>
        <div class="erros"></div>
        <div class="bloco">
          <h3>SOLICITANTE E EVENTO</h3>
          <div class="grade">
            <label class="campo c3"><span>NOME COMPLETO - SEM ABREVIAR</span><input type="text" name="nome" placeholder="João Pereira Lima"></label>
            <label class="campo c1"><span>N. USP</span><input type="text" inputmode="numeric" name="n_usp" placeholder="87654321"></label>
            <label class="campo c2"><span>PROGRAMA</span><input type="text" name="programa" placeholder="Ciência da Computação"></label>
            <label class="campo c6"><span>E-MAIL</span><input type="email" name="email" placeholder="joao.lima@usp.br"></label>
            <label class="campo c4"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input type="text" name="evento" placeholder="Banca de defesa de doutorado"></label>
            <label class="campo c2"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="periodo" placeholder="20 de agosto de 2025"></label>
            <label class="campo c2"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span><input type="text" name="cidade_evento" placeholder="São Paulo"></label>
            <label class="campo c1"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="estado_evento" placeholder="SP"></label>
            <label class="campo c1"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span><input type="text" name="pais_evento" placeholder="Brasil"></label>
            <label class="campo c2"><span>LINK DO EVENTO, EXAME OU DEFESA</span><input type="text" name="link_evento" placeholder="https://evento.exemplo.br"></label>
            <label class="campo c2"><span>VALOR SOLICITADO (R$)</span><input type="text" inputmode="numeric" name="valor" data-format="valor" placeholder="150000"></label>
            <label class="campo c4"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span><select name="apresentacao"><option value="">Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
            <label class="campo c6"><span>DETALHAMENTO DO PEDIDO</span><textarea name="detalhamento" rows="2" placeholder="Passagem aérea e hospedagem"></textarea></label>
          </div>
        </div>
        <div class="bloco">
          <h3>ENDEREÇO DO SOLICITANTE</h3>
          <div class="grade">
            <label class="campo c1"><span>DATA DE NASCIMENTO</span><input type="text" inputmode="numeric" name="data_nascimento" data-format="data" placeholder="01021990"></label>
            <label class="campo c2"><span>LOGRADOURO</span><input type="text" name="logradouro" placeholder="Av. Prof. Luciano Gualberto"></label>
            <label class="campo c1"><span>NÚMERO</span><input type="text" name="numero" placeholder="158"></label>
            <label class="campo c2"><span>COMPLEMENTO</span><input type="text" name="complemento" placeholder="Bloco B, ap. 42"></label>
            <label class="campo c2"><span>BAIRRO</span><input type="text" name="bairro" placeholder="Butantã"></label>
            <label class="campo c2"><span>CEP</span><input type="text" inputmode="numeric" name="cep" data-format="cep" placeholder="05508090"></label>
            <label class="campo c1"><span>CIDADE</span><input type="text" name="cidade" placeholder="São Paulo"></label>
            <label class="campo c1"><span>ESTADO</span><input type="text" name="estado" placeholder="SP"></label>
          </div>
        </div>
        <div class="bloco">
          <h3>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h3>
          <div class="grade">
            <label class="campo c2"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" inputmode="numeric" name="cpf" data-format="cpf" placeholder="123.456.789-09"></label>
            <label class="campo c2"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" name="rg" placeholder="12.345.678-9"></label>
            <label class="campo c2"><span>NOME DO BANCO</span><input type="text" name="banco" placeholder="Banco do Brasil"></label>
            <label class="campo c3"><span>NÚMERO DA AGÊNCIA</span><input type="text" inputmode="numeric" name="agencia" placeholder="1234"></label>
            <label class="campo c3"><span>NÚMERO DA CONTA</span><input type="text" name="conta" placeholder="12345-6"></label>
          </div>
        </div>
        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>
  </main>
</div>
<section id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <pre id="oficio"></pre>
</section>
<script src="app.js"></script>
</body>
</html>
