<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    </div>
    <div class="identidade">
      <h1>Universidade de São Paulo</h1>
      <p>Programa de Pós-Graduação do IME-USP</p>
    </div>
  </header>

  <nav class="abas">
    <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>

  <main>
    <form id="form-alunos" class="formulario ativo" novalidate>
      <div class="erros" hidden></div>

      <section class="bloco">
        <h2>SOLICITANTE E EVENTO</h2>
        <div class="grade">
          <div class="campo s2">
            <label for="a-nome_completo">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="a-nome_completo" name="nome_completo" type="text" placeholder="Maria da Silva Santos">
          </div>
          <div class="campo">
            <label for="a-n_usp">N. USP</label>
            <input id="a-n_usp" name="n_usp" type="text" inputmode="numeric" placeholder="12345678">
          </div>
          <div class="campo">
            <label for="a-programa">PROGRAMA</label>
            <input id="a-programa" name="programa" type="text" placeholder="Ciência da Computação">
          </div>
          <div class="campo">
            <label for="a-nivel">NÍVEL</label>
            <select id="a-nivel" name="nivel">
              <option value="">Selecione</option>
              <option value="Mestrado">Mestrado</option>
              <option value="Doutorado">Doutorado</option>
            </select>
          </div>
          <div class="campo">
            <label for="a-tipo_auxilio">TIPO DE AUXÍLIO</label>
            <select id="a-tipo_auxilio" name="tipo_auxilio">
              <option value="">Selecione</option>
              <option value="Participação em evento">Participação em evento</option>
              <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div class="campo">
            <label for="a-email">E-MAIL</label>
            <input id="a-email" name="email" type="text" placeholder="maria.silva@usp.br">
          </div>
          <div class="campo s2">
            <label for="a-nome_evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="a-nome_evento" name="nome_evento" type="text" placeholder="Congresso Brasileiro de Computação">
          </div>
          <div class="campo">
            <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-periodo" name="periodo" type="text" placeholder="10/09/2024 a 14/09/2024">
          </div>
          <div class="campo">
            <label for="a-cidade_evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-cidade_evento" name="cidade_evento" type="text" placeholder="Belo Horizonte">
          </div>
          <div class="campo">
            <label for="a-estado_evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-estado_evento" name="estado_evento" type="text" placeholder="MG">
          </div>
          <div class="campo">
            <label for="a-pais_evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-pais_evento" name="pais_evento" type="text" placeholder="Brasil">
          </div>
          <div class="campo">
            <label for="a-link_evento">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-link_evento" name="link_evento" type="text" placeholder="https://evento.exemplo.br">
          </div>
          <div class="campo">
            <label for="a-valor_solicitado">VALOR SOLICITADO (R$)</label>
            <input id="a-valor_solicitado" name="valor_solicitado" type="text" inputmode="numeric" data-formato="moeda" placeholder="R$ 1.500,00">
          </div>
          <div class="campo s2">
            <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="a-apresentacao" name="apresentacao">
              <option value="">Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo s3">
            <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="a-detalhamento" name="detalhamento" rows="2" placeholder="Passagem aérea e hospedagem"></textarea>
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="grade">
          <div class="campo">
            <label for="a-data_nascimento">DATA DE NASCIMENTO</label>
            <input id="a-data_nascimento" name="data_nascimento" type="text" inputmode="numeric" data-formato="data" placeholder="01/02/1980">
          </div>
          <div class="campo s2">
            <label for="a-logradouro">LOGRADOURO</label>
            <input id="a-logradouro" name="logradouro" type="text" placeholder="Av. Prof. Luciano Gualberto">
          </div>
          <div class="campo">
            <label for="a-numero">NÚMERO</label>
            <input id="a-numero" name="numero" type="text" placeholder="158">
          </div>
          <div class="campo">
            <label for="a-complemento">COMPLEMENTO</label>
            <input id="a-complemento" name="complemento" type="text" placeholder="Sala 101">
          </div>
          <div class="campo">
            <label for="a-bairro">BAIRRO</label>
            <input id="a-bairro" name="bairro" type="text" placeholder="Butantã">
          </div>
          <div class="campo">
            <label for="a-cep">CEP</label>
            <input id="a-cep" name="cep" type="text" inputmode="numeric" data-formato="cep" placeholder="05508-090">
          </div>
          <div class="campo s2">
            <label for="a-cidade">CIDADE</label>
            <input id="a-cidade" name="cidade" type="text" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="a-estado">ESTADO</label>
            <input id="a-estado" name="estado" type="text" placeholder="SP">
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="grade">
          <div class="campo">
            <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-cpf" name="cpf" type="text" inputmode="numeric" data-formato="cpf" placeholder="123.456.789-09">
          </div>
          <div class="campo">
            <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-rg" name="rg" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo">
            <label for="a-banco">NOME DO BANCO</label>
            <input id="a-banco" name="banco" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo">
            <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="a-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo">
            <label for="a-conta">NÚMERO DA CONTA</label>
            <input id="a-conta" name="conta" type="text" placeholder="12345-6">
          </div>
        </div>
      </section>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>

    <form id="form-docentes" class="formulario" novalidate>
      <div class="erros" hidden></div>

      <section class="bloco">
        <h2>SOLICITANTE E EVENTO</h2>
        <div class="grade">
          <div class="campo s2">
            <label for="d-nome_completo">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="d-nome_completo" name="nome_completo" type="text" placeholder="João Pereira Lima">
          </div>
          <div class="campo">
            <label for="d-n_usp">N. USP</label>
            <input id="d-n_usp" name="n_usp" type="text" inputmode="numeric" placeholder="12345678">
          </div>
          <div class="campo s2">
            <label for="d-programa">PROGRAMA</label>
            <input id="d-programa" name="programa" type="text" placeholder="Física">
          </div>
          <div class="campo">
            <label for="d-email">E-MAIL</label>
            <input id="d-email" name="email" type="text" placeholder="joao.lima@usp.br">
          </div>
          <div class="campo s2">
            <label for="d-nome_evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="d-nome_evento" name="nome_evento" type="text" placeholder="Congresso Brasileiro de Física">
          </div>
          <div class="campo">
            <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-periodo" name="periodo" type="text" placeholder="10/09/2024 a 14/09/2024">
          </div>
          <div class="campo">
            <label for="d-cidade_evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-cidade_evento" name="cidade_evento" type="text" placeholder="Belo Horizonte">
          </div>
          <div class="campo">
            <label for="d-estado_evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-estado_evento" name="estado_evento" type="text" placeholder="MG">
          </div>
          <div class="campo">
            <label for="d-pais_evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-pais_evento" name="pais_evento" type="text" placeholder="Brasil">
          </div>
          <div class="campo">
            <label for="d-link_evento">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-link_evento" name="link_evento" type="text" placeholder="https://evento.exemplo.br">
          </div>
          <div class="campo">
            <label for="d-valor_solicitado">VALOR SOLICITADO (R$)</label>
            <input id="d-valor_solicitado" name="valor_solicitado" type="text" inputmode="numeric" data-formato="moeda" placeholder="R$ 1.500,00">
          </div>
          <div class="campo">
            <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="d-apresentacao" name="apresentacao">
              <option value="">Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo s5">
            <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="d-detalhamento" name="detalhamento" rows="2" placeholder="Passagem aérea e hospedagem"></textarea>
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="grade">
          <div class="campo">
            <label for="d-data_nascimento">DATA DE NASCIMENTO</label>
            <input id="d-data_nascimento" name="data_nascimento" type="text" inputmode="numeric" data-formato="data" placeholder="01/02/1980">
          </div>
          <div class="campo s2">
            <label for="d-logradouro">LOGRADOURO</label>
            <input id="d-logradouro" name="logradouro" type="text" placeholder="Av. Prof. Luciano Gualberto">
          </div>
          <div class="campo">
            <label for="d-numero">NÚMERO</label>
            <input id="d-numero" name="numero" type="text" placeholder="158">
          </div>
          <div class="campo">
            <label for="d-complemento">COMPLEMENTO</label>
            <input id="d-complemento" name="complemento" type="text" placeholder="Sala 101">
          </div>
          <div class="campo">
            <label for="d-bairro">BAIRRO</label>
            <input id="d-bairro" name="bairro" type="text" placeholder="Butantã">
          </div>
          <div class="campo">
            <label for="d-cep">CEP</label>
            <input id="d-cep" name="cep" type="text" inputmode="numeric" data-formato="cep" placeholder="05508-090">
          </div>
          <div class="campo s2">
            <label for="d-cidade">CIDADE</label>
            <input id="d-cidade" name="cidade" type="text" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="d-estado">ESTADO</label>
            <input id="d-estado" name="estado" type="text" placeholder="SP">
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="grade">
          <div class="campo">
            <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-cpf" name="cpf" type="text" inputmode="numeric" data-formato="cpf" placeholder="123.456.789-09">
          </div>
          <div class="campo">
            <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-rg" name="rg" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo">
            <label for="d-banco">NOME DO BANCO</label>
            <input id="d-banco" name="banco" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo">
            <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="d-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo">
            <label for="d-conta">NÚMERO DA CONTA</label>
            <input id="d-conta" name="conta" type="text" placeholder="12345-6">
          </div>
        </div>
      </section>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>

    <section id="confirmacao" hidden>
      <h2>Solicitação registrada</h2>
      <pre class="oficio"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
