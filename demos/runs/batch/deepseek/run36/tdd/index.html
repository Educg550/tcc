<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header class="cabecalho">
    <div class="logo-area">
      <img class="logo" src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    </div>
    <div class="identidade">
      <h1>Universidade de São Paulo</h1>
      <p class="programa">Pós-Graduação &ndash; Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <nav class="abas" role="tablist" aria-label="Formulários de solicitação">
    <button type="button" class="aba ativa" role="tab" aria-selected="true" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" role="tab" aria-selected="false" data-aba="docentes">DOCENTES</button>
  </nav>

  <main class="conteudo">

    <form id="form-alunos" class="formulario ativo" data-aba="alunos" novalidate>
      <div class="erros" role="alert" hidden></div>

      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo campo-largo">
            <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="a-nome" name="nome_completo" type="text" placeholder="Ex.: Maria Aparecida de Souza">
          </div>
          <div class="campo">
            <label for="a-nusp">N. USP</label>
            <input id="a-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="Ex.: 12345678">
          </div>
          <div class="campo">
            <label for="a-programa">PROGRAMA</label>
            <input id="a-programa" name="programa" type="text" placeholder="Ex.: Ciência da Computação">
          </div>
          <div class="campo">
            <label for="a-nivel">NÍVEL</label>
            <select id="a-nivel" name="nivel">
              <option value="">Selecione</option>
              <option value="Mestrado">Mestrado</option>
              <option value="Doutorado">Doutorado</option>
            </select>
          </div>
          <div class="campo campo-largo">
            <label for="a-tipo-auxilio">TIPO DE AUXÍLIO</label>
            <select id="a-tipo-auxilio" name="tipo_de_auxilio">
              <option value="">Selecione</option>
              <option value="Participação em evento">Participação em evento</option>
              <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div class="campo campo-largo">
            <label for="a-email">E-MAIL</label>
            <input id="a-email" name="email" type="email" placeholder="Ex.: nome@usp.br">
          </div>
          <div class="campo campo-total">
            <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="a-evento" name="nome_do_evento" type="text" placeholder="Ex.: Congresso Brasileiro de Computação">
          </div>
          <div class="campo campo-largo">
            <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-periodo" name="periodo" type="text" placeholder="Ex.: 01/03/2024 a 05/03/2024">
          </div>
          <div class="campo">
            <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-cidade-evento" name="cidade_do_evento" type="text" placeholder="Ex.: Campinas">
          </div>
          <div class="campo">
            <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-estado-evento" name="estado_do_evento" type="text" placeholder="Ex.: SP">
          </div>
          <div class="campo campo-largo">
            <label for="a-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-pais-evento" name="pais_do_evento" type="text" placeholder="Ex.: Brasil">
          </div>
          <div class="campo campo-largo">
            <label for="a-link-evento">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-link-evento" name="link_do_evento" type="text" placeholder="Opcional - endereço da página do evento">
          </div>
          <div class="campo">
            <label for="a-valor">VALOR SOLICITADO (R$)</label>
            <input id="a-valor" name="valor_solicitado" type="text" inputmode="numeric" data-formato="moeda" placeholder="Ex.: R$ 1.500,00">
          </div>
          <div class="campo campo-largo">
            <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="a-apresentacao" name="ira_apresentar_trabalho">
              <option value="">Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo campo-total">
            <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="a-detalhamento" name="detalhamento" rows="2" placeholder="Ex.: passagens aéreas e hospedagem"></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo campo-largo">
            <label for="a-nascimento">DATA DE NASCIMENTO</label>
            <input id="a-nascimento" name="data_de_nascimento" type="text" inputmode="numeric" data-formato="data" placeholder="Ex.: 01/02/1980">
          </div>
          <div class="campo campo-largo">
            <label for="a-logradouro">LOGRADOURO</label>
            <input id="a-logradouro" name="logradouro" type="text" placeholder="Ex.: Av. Prof. Luciano Gualberto">
          </div>
          <div class="campo">
            <label for="a-numero">NÚMERO</label>
            <input id="a-numero" name="numero" type="text" placeholder="Ex.: 128">
          </div>
          <div class="campo">
            <label for="a-complemento">COMPLEMENTO</label>
            <input id="a-complemento" name="complemento" type="text" placeholder="Opcional - apto, bloco">
          </div>
          <div class="campo">
            <label for="a-bairro">BAIRRO</label>
            <input id="a-bairro" name="bairro" type="text" placeholder="Ex.: Butantã">
          </div>
          <div class="campo">
            <label for="a-cep">CEP</label>
            <input id="a-cep" name="cep" type="text" inputmode="numeric" data-formato="cep" placeholder="Ex.: 05508-090">
          </div>
          <div class="campo">
            <label for="a-cidade">CIDADE</label>
            <input id="a-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo">
            <label for="a-estado">ESTADO</label>
            <input id="a-estado" name="estado" type="text" placeholder="Ex.: SP">
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo campo-largo">
            <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-cpf" name="cpf" type="text" inputmode="numeric" data-formato="cpf" placeholder="Ex.: 111.444.777-35">
          </div>
          <div class="campo campo-largo">
            <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-rg" name="rg" type="text" placeholder="Ex.: 12.345.678-9">
          </div>
          <div class="campo campo-largo">
            <label for="a-banco">NOME DO BANCO</label>
            <input id="a-banco" name="banco" type="text" placeholder="Ex.: Banco do Brasil">
          </div>
          <div class="campo">
            <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="a-agencia" name="agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234">
          </div>
          <div class="campo">
            <label for="a-conta">NÚMERO DA CONTA</label>
            <input id="a-conta" name="conta" type="text" placeholder="Ex.: 5678-9">
          </div>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>

    <form id="form-docentes" class="formulario" data-aba="docentes" novalidate>
      <div class="erros" role="alert" hidden></div>

      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo campo-largo">
            <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="d-nome" name="nome_completo" type="text" placeholder="Ex.: João Carlos Pereira">
          </div>
          <div class="campo">
            <label for="d-nusp">N. USP</label>
            <input id="d-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="Ex.: 12345678">
          </div>
          <div class="campo campo-largo">
            <label for="d-programa">PROGRAMA</label>
            <input id="d-programa" name="programa" type="text" placeholder="Ex.: Ciência da Computação">
          </div>
          <div class="campo campo-largo">
            <label for="d-email">E-MAIL</label>
            <input id="d-email" name="email" type="email" placeholder="Ex.: nome@usp.br">
          </div>
          <div class="campo campo-total">
            <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="d-evento" name="nome_do_evento" type="text" placeholder="Ex.: Congresso Brasileiro de Computação">
          </div>
          <div class="campo campo-largo">
            <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-periodo" name="periodo" type="text" placeholder="Ex.: 01/03/2024 a 05/03/2024">
          </div>
          <div class="campo">
            <label for="d-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-cidade-evento" name="cidade_do_evento" type="text" placeholder="Ex.: Campinas">
          </div>
          <div class="campo">
            <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-estado-evento" name="estado_do_evento" type="text" placeholder="Ex.: SP">
          </div>
          <div class="campo campo-largo">
            <label for="d-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-pais-evento" name="pais_do_evento" type="text" placeholder="Ex.: Brasil">
          </div>
          <div class="campo campo-largo">
            <label for="d-link-evento">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-link-evento" name="link_do_evento" type="text" placeholder="Opcional - endereço da página do evento">
          </div>
          <div class="campo">
            <label for="d-valor">VALOR SOLICITADO (R$)</label>
            <input id="d-valor" name="valor_solicitado" type="text" inputmode="numeric" data-formato="moeda" placeholder="Ex.: R$ 1.500,00">
          </div>
          <div class="campo campo-largo">
            <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="d-apresentacao" name="ira_apresentar_trabalho">
              <option value="">Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo campo-total">
            <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="d-detalhamento" name="detalhamento" rows="2" placeholder="Ex.: passagens aéreas e hospedagem"></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo campo-largo">
            <label for="d-nascimento">DATA DE NASCIMENTO</label>
            <input id="d-nascimento" name="data_de_nascimento" type="text" inputmode="numeric" data-formato="data" placeholder="Ex.: 01/02/1980">
          </div>
          <div class="campo campo-largo">
            <label for="d-logradouro">LOGRADOURO</label>
            <input id="d-logradouro" name="logradouro" type="text" placeholder="Ex.: Av. Prof. Luciano Gualberto">
          </div>
          <div class="campo">
            <label for="d-numero">NÚMERO</label>
            <input id="d-numero" name="numero" type="text" placeholder="Ex.: 128">
          </div>
          <div class="campo">
            <label for="d-complemento">COMPLEMENTO</label>
            <input id="d-complemento" name="complemento" type="text" placeholder="Opcional - apto, bloco">
          </div>
          <div class="campo">
            <label for="d-bairro">BAIRRO</label>
            <input id="d-bairro" name="bairro" type="text" placeholder="Ex.: Butantã">
          </div>
          <div class="campo">
            <label for="d-cep">CEP</label>
            <input id="d-cep" name="cep" type="text" inputmode="numeric" data-formato="cep" placeholder="Ex.: 05508-090">
          </div>
          <div class="campo">
            <label for="d-cidade">CIDADE</label>
            <input id="d-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo">
            <label for="d-estado">ESTADO</label>
            <input id="d-estado" name="estado" type="text" placeholder="Ex.: SP">
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo campo-largo">
            <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-cpf" name="cpf" type="text" inputmode="numeric" data-formato="cpf" placeholder="Ex.: 111.444.777-35">
          </div>
          <div class="campo campo-largo">
            <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-rg" name="rg" type="text" placeholder="Ex.: 12.345.678-9">
          </div>
          <div class="campo campo-largo">
            <label for="d-banco">NOME DO BANCO</label>
            <input id="d-banco" name="banco" type="text" placeholder="Ex.: Banco do Brasil">
          </div>
          <div class="campo">
            <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="d-agencia" name="agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234">
          </div>
          <div class="campo">
            <label for="d-conta">NÚMERO DA CONTA</label>
            <input id="d-conta" name="conta" type="text" placeholder="Ex.: 5678-9">
          </div>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>

    <section id="confirmacao" class="confirmacao" hidden>
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </section>

  </main>

  <script src="/app.js"></script>
</body>
</html>
