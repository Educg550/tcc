<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <img class="logo-usp" src="assets/usp-logo.png" alt="Universidade de São Paulo">
  <div class="identidade">
    <p class="universidade">Universidade de São Paulo</p>
    <p class="unidade">Programa de Pós-Graduação - Instituto de Matemática e Estatística</p>
  </div>
</header>

<main>
  <nav class="abas">
    <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>

  <section id="painel-alunos" class="painel ativa">
    <div class="erros" id="erros-alunos" role="alert"></div>
    <form id="form-alunos" data-aba="alunos" novalidate>
      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo col-3">
            <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="a-nome" name="nome_completo" type="text" placeholder="Maria Aparecida da Silva">
          </div>
          <div class="campo col-1">
            <label for="a-nusp">N. USP</label>
            <input id="a-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="12345678">
          </div>
          <div class="campo col-2">
            <label for="a-programa">PROGRAMA</label>
            <input id="a-programa" name="programa" type="text" placeholder="Ciência da Computação">
          </div>
          <div class="campo col-1">
            <label for="a-nivel">NÍVEL</label>
            <select id="a-nivel" name="nivel">
              <option value="">Selecione</option>
              <option value="Mestrado">Mestrado</option>
              <option value="Doutorado">Doutorado</option>
            </select>
          </div>
          <div class="campo col-1">
            <label for="a-tipo">TIPO DE AUXÍLIO</label>
            <select id="a-tipo" name="tipo_auxilio">
              <option value="">Selecione</option>
              <option value="Participação em evento">Participação em evento</option>
              <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div class="campo col-2">
            <label for="a-email">E-MAIL</label>
            <input id="a-email" name="email" type="text" placeholder="maria.silva@usp.br">
          </div>
          <div class="campo col-2">
            <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="a-evento" name="nome_evento" type="text" placeholder="Congresso Brasileiro de Computação">
          </div>
          <div class="campo col-2">
            <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-periodo" name="periodo" type="text" placeholder="10 a 15 de outubro de 2024">
          </div>
          <div class="campo col-1">
            <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-cidade-evento" name="cidade_evento" type="text" placeholder="São Paulo">
          </div>
          <div class="campo col-1">
            <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-estado-evento" name="estado_evento" type="text" placeholder="SP">
          </div>
          <div class="campo col-1">
            <label for="a-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-pais-evento" name="pais_evento" type="text" placeholder="Brasil">
          </div>
          <div class="campo col-1">
            <label for="a-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-link" name="link_evento" type="text" placeholder="https://evento.ime.usp.br">
          </div>
          <div class="campo col-2">
            <label for="a-valor">VALOR SOLICITADO (R$)</label>
            <input id="a-valor" name="valor_solicitado" type="text" inputmode="numeric" placeholder="R$ 1.500,00">
          </div>
          <div class="campo col-3">
            <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="a-detalhamento" name="detalhamento" rows="2" placeholder="Taxa de inscrição e passagens."></textarea>
          </div>
          <div class="campo col-1">
            <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="a-apresentacao" name="apresentacao">
              <option value="">Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo col-1">
            <label for="a-nascimento">DATA DE NASCIMENTO</label>
            <input id="a-nascimento" name="data_nascimento" type="text" inputmode="numeric" placeholder="01/02/1980">
          </div>
          <div class="campo col-3">
            <label for="a-logradouro">LOGRADOURO</label>
            <input id="a-logradouro" name="logradouro" type="text" placeholder="Av. Prof. Luciano Gualberto">
          </div>
          <div class="campo col-1">
            <label for="a-numero">NÚMERO</label>
            <input id="a-numero" name="numero" type="text" placeholder="158">
          </div>
          <div class="campo col-1">
            <label for="a-complemento">COMPLEMENTO</label>
            <input id="a-complemento" name="complemento" type="text" placeholder="Bloco B">
          </div>
          <div class="campo col-1">
            <label for="a-bairro">BAIRRO</label>
            <input id="a-bairro" name="bairro" type="text" placeholder="Butantã">
          </div>
          <div class="campo col-1">
            <label for="a-cep">CEP</label>
            <input id="a-cep" name="cep" type="text" inputmode="numeric" placeholder="05508-090">
          </div>
          <div class="campo col-2">
            <label for="a-cidade">CIDADE</label>
            <input id="a-cidade" name="cidade" type="text" placeholder="São Paulo">
          </div>
          <div class="campo col-2">
            <label for="a-estado">ESTADO</label>
            <input id="a-estado" name="estado" type="text" placeholder="SP">
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo col-1">
            <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-cpf" name="cpf" type="text" inputmode="numeric" placeholder="111.444.777-35">
          </div>
          <div class="campo col-1">
            <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-rg" name="rg" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo col-1">
            <label for="a-banco">NOME DO BANCO</label>
            <input id="a-banco" name="nome_banco" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo col-1">
            <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="a-agencia" name="numero_agencia" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo col-2">
            <label for="a-conta">NÚMERO DA CONTA</label>
            <input id="a-conta" name="numero_conta" type="text" placeholder="12345-6">
          </div>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section id="painel-docentes" class="painel">
    <div class="erros" id="erros-docentes" role="alert"></div>
    <form id="form-docentes" data-aba="docentes" novalidate>
      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo col-3">
            <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="d-nome" name="nome_completo" type="text" placeholder="Maria Aparecida da Silva">
          </div>
          <div class="campo col-1">
            <label for="d-nusp">N. USP</label>
            <input id="d-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="12345678">
          </div>
          <div class="campo col-2">
            <label for="d-programa">PROGRAMA</label>
            <input id="d-programa" name="programa" type="text" placeholder="Ciência da Computação">
          </div>
          <div class="campo col-2">
            <label for="d-email">E-MAIL</label>
            <input id="d-email" name="email" type="text" placeholder="maria.silva@usp.br">
          </div>
          <div class="campo col-2">
            <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="d-evento" name="nome_evento" type="text" placeholder="Congresso Brasileiro de Computação">
          </div>
          <div class="campo col-2">
            <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-periodo" name="periodo" type="text" placeholder="10 a 15 de outubro de 2024">
          </div>
          <div class="campo col-1">
            <label for="d-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-cidade-evento" name="cidade_evento" type="text" placeholder="São Paulo">
          </div>
          <div class="campo col-1">
            <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-estado-evento" name="estado_evento" type="text" placeholder="SP">
          </div>
          <div class="campo col-1">
            <label for="d-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-pais-evento" name="pais_evento" type="text" placeholder="Brasil">
          </div>
          <div class="campo col-1">
            <label for="d-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-link" name="link_evento" type="text" placeholder="https://evento.ime.usp.br">
          </div>
          <div class="campo col-2">
            <label for="d-valor">VALOR SOLICITADO (R$)</label>
            <input id="d-valor" name="valor_solicitado" type="text" inputmode="numeric" placeholder="R$ 1.500,00">
          </div>
          <div class="campo col-2">
            <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="d-detalhamento" name="detalhamento" rows="2" placeholder="Taxa de inscrição e passagens."></textarea>
          </div>
          <div class="campo col-2">
            <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="d-apresentacao" name="apresentacao">
              <option value="">Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo col-1">
            <label for="d-nascimento">DATA DE NASCIMENTO</label>
            <input id="d-nascimento" name="data_nascimento" type="text" inputmode="numeric" placeholder="01/02/1980">
          </div>
          <div class="campo col-3">
            <label for="d-logradouro">LOGRADOURO</label>
            <input id="d-logradouro" name="logradouro" type="text" placeholder="Av. Prof. Luciano Gualberto">
          </div>
          <div class="campo col-1">
            <label for="d-numero">NÚMERO</label>
            <input id="d-numero" name="numero" type="text" placeholder="158">
          </div>
          <div class="campo col-1">
            <label for="d-complemento">COMPLEMENTO</label>
            <input id="d-complemento" name="complemento" type="text" placeholder="Bloco B">
          </div>
          <div class="campo col-1">
            <label for="d-bairro">BAIRRO</label>
            <input id="d-bairro" name="bairro" type="text" placeholder="Butantã">
          </div>
          <div class="campo col-1">
            <label for="d-cep">CEP</label>
            <input id="d-cep" name="cep" type="text" inputmode="numeric" placeholder="05508-090">
          </div>
          <div class="campo col-2">
            <label for="d-cidade">CIDADE</label>
            <input id="d-cidade" name="cidade" type="text" placeholder="São Paulo">
          </div>
          <div class="campo col-2">
            <label for="d-estado">ESTADO</label>
            <input id="d-estado" name="estado" type="text" placeholder="SP">
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo col-1">
            <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-cpf" name="cpf" type="text" inputmode="numeric" placeholder="111.444.777-35">
          </div>
          <div class="campo col-1">
            <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-rg" name="rg" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo col-1">
            <label for="d-banco">NOME DO BANCO</label>
            <input id="d-banco" name="nome_banco" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo col-1">
            <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="d-agencia" name="numero_agencia" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo col-2">
            <label for="d-conta">NÚMERO DA CONTA</label>
            <input id="d-conta" name="numero_conta" type="text" placeholder="12345-6">
          </div>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section id="confirmacao" class="escondido">
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
