<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <div class="logo-caixa">
    <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo" class="logo">
  </div>
  <div class="identidade">
    <h1>Universidade de São Paulo</h1>
    <p class="programa">Pós-Graduação - Instituto de Matemática e Estatística</p>
  </div>
</header>

<main>
  <div id="painel">
    <nav class="abas">
      <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
      <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
    </nav>

    <form id="form-alunos" class="formulario ativo" data-aba="alunos">
      <div class="erros" role="alert"></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <label class="c3">NOME COMPLETO - SEM ABREVIAR
            <input type="text" name="nome" placeholder="Maria da Silva Santos">
          </label>
          <label class="c1">N. USP
            <input type="text" name="nusp" inputmode="numeric" placeholder="12345678">
          </label>
          <label class="c2">PROGRAMA
            <input type="text" name="programa" placeholder="Matemática Aplicada">
          </label>

          <label class="c1">NÍVEL
            <select name="nivel">
              <option value="">Selecione</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </label>
          <label class="c2">TIPO DE AUXÍLIO
            <select name="tipo_auxilio">
              <option value="">Selecione</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </label>
          <label class="c3">E-MAIL
            <input type="text" name="email" placeholder="maria.santos@usp.br">
          </label>

          <label class="c3">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
            <input type="text" name="evento" placeholder="Congresso Brasileiro de Matemática">
          </label>
          <label class="c1">PERÍODO DO EVENTO, EXAME OU DEFESA
            <input type="text" name="periodo" placeholder="10 a 15/07/2024">
          </label>
          <label class="c1">CIDADE DO EVENTO, EXAME OU DEFESA
            <input type="text" name="cidade_evento" placeholder="São Paulo">
          </label>
          <label class="c1">ESTADO DO EVENTO, EXAME OU DEFESA
            <input type="text" name="estado_evento" placeholder="SP">
          </label>

          <label class="c1">PAÍS DO EVENTO, EXAME OU DEFESA
            <input type="text" name="pais_evento" placeholder="Brasil">
          </label>
          <label class="c2">LINK DO EVENTO, EXAME OU DEFESA
            <input type="text" name="link_evento" placeholder="https://evento.usp.br">
          </label>
          <label class="c1">VALOR SOLICITADO (R$)
            <input type="text" name="valor" inputmode="numeric" placeholder="R$ 1.500,00">
          </label>
          <label class="c2">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
            <select name="apresentacao">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </label>

          <label class="c6">DETALHAMENTO DO PEDIDO
            <textarea name="detalhamento" rows="2" placeholder="Descreva o motivo do pedido, despesas previstas, etc."></textarea>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="c1">DATA DE NASCIMENTO
            <input type="text" name="nascimento" inputmode="numeric" placeholder="01/02/1980">
          </label>
          <label class="c3">LOGRADOURO
            <input type="text" name="logradouro" placeholder="Rua do Matão">
          </label>
          <label class="c1">NÚMERO
            <input type="text" name="numero" placeholder="1010">
          </label>
          <label class="c1">COMPLEMENTO
            <input type="text" name="complemento" placeholder="Apto 42">
          </label>

          <label class="c2">BAIRRO
            <input type="text" name="bairro" placeholder="Butantã">
          </label>
          <label class="c1">CEP
            <input type="text" name="cep" inputmode="numeric" placeholder="05508-090">
          </label>
          <label class="c2">CIDADE
            <input type="text" name="cidade" placeholder="São Paulo">
          </label>
          <label class="c1">ESTADO
            <input type="text" name="estado" placeholder="SP">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="c2">CPF (SEPARADOS POR PONTOS E TRAÇO)
            <input type="text" name="cpf" inputmode="numeric" placeholder="123.456.789-09">
          </label>
          <label class="c2">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
            <input type="text" name="rg" placeholder="12.345.678-9">
          </label>
          <label class="c2">NOME DO BANCO
            <input type="text" name="banco" placeholder="Banco do Brasil">
          </label>

          <label class="c2">NÚMERO DA AGÊNCIA
            <input type="text" name="agencia" inputmode="numeric" placeholder="1234">
          </label>
          <label class="c2">NÚMERO DA CONTA
            <input type="text" name="conta" placeholder="12345-6">
          </label>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>

    <form id="form-docentes" class="formulario" data-aba="docentes">
      <div class="erros" role="alert"></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <label class="c3">NOME COMPLETO - SEM ABREVIAR
            <input type="text" name="nome" placeholder="João Pereira Lima">
          </label>
          <label class="c1">N. USP
            <input type="text" name="nusp" inputmode="numeric" placeholder="12345678">
          </label>
          <label class="c2">PROGRAMA
            <input type="text" name="programa" placeholder="Matemática Aplicada">
          </label>

          <label class="c3">E-MAIL
            <input type="text" name="email" placeholder="joao.lima@usp.br">
          </label>
          <label class="c3">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
            <input type="text" name="evento" placeholder="Congresso Brasileiro de Matemática">
          </label>

          <label class="c1">PERÍODO DO EVENTO, EXAME OU DEFESA
            <input type="text" name="periodo" placeholder="10 a 15/07/2024">
          </label>
          <label class="c1">CIDADE DO EVENTO, EXAME OU DEFESA
            <input type="text" name="cidade_evento" placeholder="São Paulo">
          </label>
          <label class="c1">ESTADO DO EVENTO, EXAME OU DEFESA
            <input type="text" name="estado_evento" placeholder="SP">
          </label>
          <label class="c1">PAÍS DO EVENTO, EXAME OU DEFESA
            <input type="text" name="pais_evento" placeholder="Brasil">
          </label>
          <label class="c2">LINK DO EVENTO, EXAME OU DEFESA
            <input type="text" name="link_evento" placeholder="https://evento.usp.br">
          </label>

          <label class="c2">VALOR SOLICITADO (R$)
            <input type="text" name="valor" inputmode="numeric" placeholder="R$ 1.500,00">
          </label>
          <label class="c2">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
            <select name="apresentacao">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </label>

          <label class="c6">DETALHAMENTO DO PEDIDO
            <textarea name="detalhamento" rows="2" placeholder="Descreva o motivo do pedido, despesas previstas, etc."></textarea>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="c1">DATA DE NASCIMENTO
            <input type="text" name="nascimento" inputmode="numeric" placeholder="01/02/1970">
          </label>
          <label class="c3">LOGRADOURO
            <input type="text" name="logradouro" placeholder="Rua do Matão">
          </label>
          <label class="c1">NÚMERO
            <input type="text" name="numero" placeholder="1010">
          </label>
          <label class="c1">COMPLEMENTO
            <input type="text" name="complemento" placeholder="Sala 250">
          </label>

          <label class="c2">BAIRRO
            <input type="text" name="bairro" placeholder="Butantã">
          </label>
          <label class="c1">CEP
            <input type="text" name="cep" inputmode="numeric" placeholder="05508-090">
          </label>
          <label class="c2">CIDADE
            <input type="text" name="cidade" placeholder="São Paulo">
          </label>
          <label class="c1">ESTADO
            <input type="text" name="estado" placeholder="SP">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="c2">CPF (SEPARADOS POR PONTOS E TRAÇO)
            <input type="text" name="cpf" inputmode="numeric" placeholder="123.456.789-09">
          </label>
          <label class="c2">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
            <input type="text" name="rg" placeholder="12.345.678-9">
          </label>
          <label class="c2">NOME DO BANCO
            <input type="text" name="banco" placeholder="Banco do Brasil">
          </label>

          <label class="c2">NÚMERO DA AGÊNCIA
            <input type="text" name="agencia" inputmode="numeric" placeholder="1234">
          </label>
          <label class="c2">NÚMERO DA CONTA
            <input type="text" name="conta" placeholder="12345-6">
          </label>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </div>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
