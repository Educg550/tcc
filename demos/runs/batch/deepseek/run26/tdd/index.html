<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identidade">
    <span class="universidade">Universidade de São Paulo</span>
    <span class="programa">Pós-Graduação - Instituto de Matemática e Estatística</span>
  </div>
</header>

<nav class="abas">
  <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
  <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
</nav>

<main>
  <form class="formulario" data-aba="alunos">
    <input type="hidden" name="aba" value="alunos">
    <div class="erros" hidden></div>

    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class="grade">
        <div class="campo col-2">
          <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
          <input id="a-nome" name="nome" type="text" placeholder="Maria Aparecida da Silva">
        </div>
        <div class="campo">
          <label for="a-nusp">N. USP</label>
          <input id="a-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="12345678">
        </div>
        <div class="campo">
          <label for="a-programa">PROGRAMA</label>
          <input id="a-programa" name="programa" type="text" placeholder="Ciência da Computação">
        </div>
        <div class="campo">
          <label for="a-nivel">NÍVEL</label>
          <select id="a-nivel" name="nivel">
            <option value="">Selecione</option>
            <option value="Mestrado">Mestrado</option>
            <option value="Doutorado">Doutorado</option>
          </select>
        </div>
        <div class="campo col-2">
          <label for="a-tipo">TIPO DE AUXÍLIO</label>
          <select id="a-tipo" name="tipo_auxilio">
            <option value="">Selecione</option>
            <option value="Participação em evento">Participação em evento</option>
            <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
        <div class="campo">
          <label for="a-email">E-MAIL</label>
          <input id="a-email" name="email" type="email" placeholder="maria@usp.br">
        </div>
        <div class="campo col-2">
          <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input id="a-evento" name="evento" type="text" placeholder="Congresso Brasileiro de Computação">
        </div>
        <div class="campo col-2">
          <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input id="a-periodo" name="periodo" type="text" placeholder="12 a 15 de outubro de 2024">
        </div>
        <div class="campo">
          <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input id="a-cidade-evento" name="cidade_evento" type="text" placeholder="São Paulo">
        </div>
        <div class="campo">
          <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input id="a-estado-evento" name="estado_evento" type="text" placeholder="SP">
        </div>
        <div class="campo">
          <label for="a-pais">PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input id="a-pais" name="pais" type="text" placeholder="Brasil">
        </div>
        <div class="campo">
          <label for="a-link">LINK DO EVENTO, EXAME OU DEFESA</label>
          <input id="a-link" name="link" type="text" placeholder="evento.exemplo.com">
        </div>
        <div class="campo">
          <label for="a-valor">VALOR SOLICITADO (R$)</label>
          <input id="a-valor" name="valor" type="text" inputmode="numeric" placeholder="150000" data-mascara="valor">
        </div>
        <div class="campo col-2">
          <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
          <textarea id="a-detalhamento" name="detalhamento" rows="2" placeholder="Apresentação de artigo aceito no evento"></textarea>
        </div>
        <div class="campo">
          <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id="a-apresentacao" name="apresentacao">
            <option value="">Selecione</option>
            <option value="Pôster">Pôster</option>
            <option value="Apresentação oral">Apresentação oral</option>
            <option value="Outra">Outra</option>
            <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
          </select>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class="grade">
        <div class="campo">
          <label for="a-nascimento">DATA DE NASCIMENTO</label>
          <input id="a-nascimento" name="data_nascimento" type="text" inputmode="numeric" placeholder="01021980" data-mascara="data">
        </div>
        <div class="campo">
          <label for="a-logradouro">LOGRADOURO</label>
          <input id="a-logradouro" name="logradouro" type="text" placeholder="Av. Prof. Luciano Gualberto">
        </div>
        <div class="campo">
          <label for="a-numero">NÚMERO</label>
          <input id="a-numero" name="numero" type="text" placeholder="158">
        </div>
        <div class="campo">
          <label for="a-complemento">COMPLEMENTO</label>
          <input id="a-complemento" name="complemento" type="text" placeholder="Sala 100">
        </div>
        <div class="campo">
          <label for="a-bairro">BAIRRO</label>
          <input id="a-bairro" name="bairro" type="text" placeholder="Butantã">
        </div>
        <div class="campo">
          <label for="a-cep">CEP</label>
          <input id="a-cep" name="cep" type="text" inputmode="numeric" placeholder="05508090" data-mascara="cep">
        </div>
        <div class="campo">
          <label for="a-cidade">CIDADE</label>
          <input id="a-cidade" name="cidade" type="text" placeholder="São Paulo">
        </div>
        <div class="campo">
          <label for="a-estado">ESTADO</label>
          <input id="a-estado" name="estado" type="text" placeholder="SP">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="grade">
        <div class="campo">
          <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id="a-cpf" name="cpf" type="text" inputmode="numeric" placeholder="12345678909" data-mascara="cpf">
        </div>
        <div class="campo">
          <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id="a-rg" name="rg" type="text" placeholder="12.345.678-9">
        </div>
        <div class="campo col-2">
          <label for="a-banco">NOME DO BANCO</label>
          <input id="a-banco" name="banco" type="text" placeholder="Banco do Brasil">
        </div>
        <div class="campo">
          <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
          <input id="a-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234">
        </div>
        <div class="campo">
          <label for="a-conta">NÚMERO DA CONTA</label>
          <input id="a-conta" name="conta" type="text" placeholder="12345-6">
        </div>
      </div>
    </fieldset>

    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>

  <form class="formulario" data-aba="docentes" hidden>
    <input type="hidden" name="aba" value="docentes">
    <div class="erros" hidden></div>

    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class="grade">
        <div class="campo col-2">
          <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
          <input id="d-nome" name="nome" type="text" placeholder="João Carlos de Oliveira">
        </div>
        <div class="campo">
          <label for="d-nusp">N. USP</label>
          <input id="d-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="87654321">
        </div>
        <div class="campo">
          <label for="d-programa">PROGRAMA</label>
          <input id="d-programa" name="programa" type="text" placeholder="Matemática Aplicada">
        </div>
        <div class="campo">
          <label for="d-email">E-MAIL</label>
          <input id="d-email" name="email" type="email" placeholder="joao@ime.usp.br">
        </div>
        <div class="campo col-3">
          <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input id="d-evento" name="evento" type="text" placeholder="Simpósio Nacional de Matemática">
        </div>
        <div class="campo col-2">
          <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input id="d-periodo" name="periodo" type="text" placeholder="03 a 07 de março de 2025">
        </div>
        <div class="campo">
          <label for="d-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input id="d-cidade-evento" name="cidade_evento" type="text" placeholder="Campinas">
        </div>
        <div class="campo">
          <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input id="d-estado-evento" name="estado_evento" type="text" placeholder="SP">
        </div>
        <div class="campo">
          <label for="d-pais">PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input id="d-pais" name="pais" type="text" placeholder="Brasil">
        </div>
        <div class="campo col-2">
          <label for="d-link">LINK DO EVENTO, EXAME OU DEFESA</label>
          <input id="d-link" name="link" type="text" placeholder="evento.exemplo.com">
        </div>
        <div class="campo">
          <label for="d-valor">VALOR SOLICITADO (R$)</label>
          <input id="d-valor" name="valor" type="text" inputmode="numeric" placeholder="250000" data-mascara="valor">
        </div>
        <div class="campo col-3">
          <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
          <textarea id="d-detalhamento" name="detalhamento" rows="2" placeholder="Participação em banca de defesa de doutorado"></textarea>
        </div>
        <div class="campo">
          <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id="d-apresentacao" name="apresentacao">
            <option value="">Selecione</option>
            <option value="Pôster">Pôster</option>
            <option value="Apresentação oral">Apresentação oral</option>
            <option value="Outra">Outra</option>
            <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
          </select>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class="grade">
        <div class="campo">
          <label for="d-nascimento">DATA DE NASCIMENTO</label>
          <input id="d-nascimento" name="data_nascimento" type="text" inputmode="numeric" placeholder="15071975" data-mascara="data">
        </div>
        <div class="campo">
          <label for="d-logradouro">LOGRADOURO</label>
          <input id="d-logradouro" name="logradouro" type="text" placeholder="Rua do Matão">
        </div>
        <div class="campo">
          <label for="d-numero">NÚMERO</label>
          <input id="d-numero" name="numero" type="text" placeholder="1010">
        </div>
        <div class="campo">
          <label for="d-complemento">COMPLEMENTO</label>
          <input id="d-complemento" name="complemento" type="text" placeholder="Bloco B">
        </div>
        <div class="campo">
          <label for="d-bairro">BAIRRO</label>
          <input id="d-bairro" name="bairro" type="text" placeholder="Cidade Universitária">
        </div>
        <div class="campo">
          <label for="d-cep">CEP</label>
          <input id="d-cep" name="cep" type="text" inputmode="numeric" placeholder="05508090" data-mascara="cep">
        </div>
        <div class="campo">
          <label for="d-cidade">CIDADE</label>
          <input id="d-cidade" name="cidade" type="text" placeholder="São Paulo">
        </div>
        <div class="campo">
          <label for="d-estado">ESTADO</label>
          <input id="d-estado" name="estado" type="text" placeholder="SP">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="grade">
        <div class="campo">
          <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id="d-cpf" name="cpf" type="text" inputmode="numeric" placeholder="52998224725" data-mascara="cpf">
        </div>
        <div class="campo">
          <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id="d-rg" name="rg" type="text" placeholder="98.765.432-1">
        </div>
        <div class="campo col-2">
          <label for="d-banco">NOME DO BANCO</label>
          <input id="d-banco" name="banco" type="text" placeholder="Itaú Unibanco">
        </div>
        <div class="campo">
          <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
          <input id="d-agencia" name="agencia" type="text" inputmode="numeric" placeholder="5678">
        </div>
        <div class="campo">
          <label for="d-conta">NÚMERO DA CONTA</label>
          <input id="d-conta" name="conta" type="text" placeholder="98765-4">
        </div>
      </div>
    </fieldset>

    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>
</main>

<section id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <pre id="oficio"></pre>
</section>
</body>
</html>
