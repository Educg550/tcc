<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identidade">
    <p class="universidade">Universidade de São Paulo</p>
    <p class="unidade">Pós-Graduação - Instituto de Matemática e Estatística</p>
  </div>
</header>

<main>
  <nav class="abas" role="tablist">
    <button type="button" class="aba ativa" data-aba="ALUNOS" role="tab" aria-selected="true">ALUNOS</button>
    <button type="button" class="aba" data-aba="DOCENTES" role="tab" aria-selected="false">DOCENTES</button>
  </nav>

  <form id="form-ALUNOS" class="formulario ativo" data-aba="ALUNOS" novalidate>
    <div class="erros" hidden></div>

    <section class="bloco">
      <h2>SOLICITANTE E EVENTO</h2>
      <div class="grade">
        <label class="campo c3">NOME COMPLETO - SEM ABREVIAR
          <input type="text" name="nome_completo" placeholder="Maria Silva da Costa">
        </label>
        <label class="campo c1">N. USP
          <input type="text" name="n_usp" inputmode="numeric" placeholder="12345678">
        </label>
        <label class="campo c2">PROGRAMA
          <input type="text" name="programa" placeholder="Ciência da Computação">
        </label>
        <label class="campo c1">NÍVEL
          <select name="nivel">
            <option value="" disabled selected>Selecione</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select>
        </label>
        <label class="campo c2">TIPO DE AUXÍLIO
          <select name="tipo_auxilio">
            <option value="" disabled selected>Selecione</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select>
        </label>
        <label class="campo c3">E-MAIL
          <input type="text" name="email" placeholder="maria.silva@usp.br">
        </label>
        <label class="campo c3">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
          <input type="text" name="nome_evento" placeholder="Simpósio Brasileiro de Computação">
        </label>
        <label class="campo c3">PERÍODO DO EVENTO, EXAME OU DEFESA
          <input type="text" name="periodo_evento" placeholder="01/10/2024 a 05/10/2024">
        </label>
        <label class="campo c2">CIDADE DO EVENTO, EXAME OU DEFESA
          <input type="text" name="cidade_evento" placeholder="São Paulo">
        </label>
        <label class="campo c1">ESTADO DO EVENTO, EXAME OU DEFESA
          <input type="text" name="estado_evento" placeholder="SP">
        </label>
        <label class="campo c1">PAÍS DO EVENTO, EXAME OU DEFESA
          <input type="text" name="pais_evento" placeholder="Brasil">
        </label>
        <label class="campo c2">LINK DO EVENTO, EXAME OU DEFESA (opcional)
          <input type="text" name="link_evento" placeholder="https://evento.exemplo.com">
        </label>
        <label class="campo c2">VALOR SOLICITADO (R$)
          <input type="text" name="valor_solicitado" inputmode="numeric" data-formato="valor" placeholder="150000">
        </label>
        <label class="campo c4">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
          <select name="apresentacao_trabalho">
            <option value="" disabled selected>Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </label>
        <label class="campo c6">DETALHAMENTO DO PEDIDO
          <textarea name="detalhamento" rows="2" placeholder="Passagem aérea e hospedagem"></textarea>
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <label class="campo c1">DATA DE NASCIMENTO
          <input type="text" name="data_nascimento" inputmode="numeric" data-formato="data" placeholder="01021980">
        </label>
        <label class="campo c3">LOGRADOURO
          <input type="text" name="logradouro" placeholder="Rua do Matão">
        </label>
        <label class="campo c1">NÚMERO
          <input type="text" name="numero" placeholder="1010">
        </label>
        <label class="campo c1">COMPLEMENTO (opcional)
          <input type="text" name="complemento" placeholder="Bloco B, sala 45">
        </label>
        <label class="campo c2">BAIRRO
          <input type="text" name="bairro" placeholder="Butantã">
        </label>
        <label class="campo c2">CEP
          <input type="text" name="cep" inputmode="numeric" data-formato="cep" placeholder="05508090">
        </label>
        <label class="campo c1">CIDADE
          <input type="text" name="cidade" placeholder="São Paulo">
        </label>
        <label class="campo c1">ESTADO
          <input type="text" name="estado" placeholder="SP">
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <label class="campo c2">CPF (SEPARADOS POR PONTOS E TRAÇO)
          <input type="text" name="cpf" inputmode="numeric" data-formato="cpf" placeholder="52998224725">
        </label>
        <label class="campo c2">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
          <input type="text" name="rg" placeholder="12.345.678-9">
        </label>
        <label class="campo c2">NOME DO BANCO
          <input type="text" name="banco" placeholder="Banco do Brasil">
        </label>
        <label class="campo c2">NÚMERO DA AGÊNCIA
          <input type="text" name="agencia" inputmode="numeric" placeholder="1234">
        </label>
        <label class="campo c2">NÚMERO DA CONTA
          <input type="text" name="conta" placeholder="56789-0">
        </label>
      </div>
    </section>

    <div class="acoes">
      <button type="submit">Enviar solicitação</button>
    </div>
  </form>

  <form id="form-DOCENTES" class="formulario" data-aba="DOCENTES" novalidate>
    <div class="erros" hidden></div>

    <section class="bloco">
      <h2>SOLICITANTE E EVENTO</h2>
      <div class="grade">
        <label class="campo c3">NOME COMPLETO - SEM ABREVIAR
          <input type="text" name="nome_completo" placeholder="João Souza">
        </label>
        <label class="campo c1">N. USP
          <input type="text" name="n_usp" inputmode="numeric" placeholder="87654321">
        </label>
        <label class="campo c2">PROGRAMA
          <input type="text" name="programa" placeholder="Ciência da Computação">
        </label>
        <label class="campo c3">E-MAIL
          <input type="text" name="email" placeholder="joao.souza@usp.br">
        </label>
        <label class="campo c3">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
          <input type="text" name="nome_evento" placeholder="Congresso de Matemática">
        </label>
        <label class="campo c3">PERÍODO DO EVENTO, EXAME OU DEFESA
          <input type="text" name="periodo_evento" placeholder="10/11/2024 a 15/11/2024">
        </label>
        <label class="campo c2">CIDADE DO EVENTO, EXAME OU DEFESA
          <input type="text" name="cidade_evento" placeholder="Rio de Janeiro">
        </label>
        <label class="campo c1">ESTADO DO EVENTO, EXAME OU DEFESA
          <input type="text" name="estado_evento" placeholder="RJ">
        </label>
        <label class="campo c1">PAÍS DO EVENTO, EXAME OU DEFESA
          <input type="text" name="pais_evento" placeholder="Brasil">
        </label>
        <label class="campo c2">LINK DO EVENTO, EXAME OU DEFESA (opcional)
          <input type="text" name="link_evento" placeholder="https://evento.exemplo.com">
        </label>
        <label class="campo c1">VALOR SOLICITADO (R$)
          <input type="text" name="valor_solicitado" inputmode="numeric" data-formato="valor" placeholder="250000">
        </label>
        <label class="campo c2">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
          <select name="apresentacao_trabalho">
            <option value="" disabled selected>Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </label>
        <label class="campo c6">DETALHAMENTO DO PEDIDO
          <textarea name="detalhamento" rows="2" placeholder="Inscrição e deslocamento"></textarea>
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <label class="campo c1">DATA DE NASCIMENTO
          <input type="text" name="data_nascimento" inputmode="numeric" data-formato="data" placeholder="02031975">
        </label>
        <label class="campo c3">LOGRADOURO
          <input type="text" name="logradouro" placeholder="Av. Brasil">
        </label>
        <label class="campo c1">NÚMERO
          <input type="text" name="numero" placeholder="456">
        </label>
        <label class="campo c1">COMPLEMENTO (opcional)
          <input type="text" name="complemento" placeholder="Apto 45">
        </label>
        <label class="campo c2">BAIRRO
          <input type="text" name="bairro" placeholder="Copacabana">
        </label>
        <label class="campo c2">CEP
          <input type="text" name="cep" inputmode="numeric" data-formato="cep" placeholder="22040002">
        </label>
        <label class="campo c1">CIDADE
          <input type="text" name="cidade" placeholder="Rio de Janeiro">
        </label>
        <label class="campo c1">ESTADO
          <input type="text" name="estado" placeholder="RJ">
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <label class="campo c2">CPF (SEPARADOS POR PONTOS E TRAÇO)
          <input type="text" name="cpf" inputmode="numeric" data-formato="cpf" placeholder="11144477735">
        </label>
        <label class="campo c2">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
          <input type="text" name="rg" placeholder="98.765.432-1">
        </label>
        <label class="campo c2">NOME DO BANCO
          <input type="text" name="banco" placeholder="Itaú">
        </label>
        <label class="campo c2">NÚMERO DA AGÊNCIA
          <input type="text" name="agencia" inputmode="numeric" placeholder="5678">
        </label>
        <label class="campo c2">NÚMERO DA CONTA
          <input type="text" name="conta" placeholder="12345-6">
        </label>
      </div>
    </section>

    <div class="acoes">
      <button type="submit">Enviar solicitação</button>
    </div>
  </form>

  <section id="confirmacao" class="confirmacao" hidden>
    <h1>Solicitação registrada</h1>
    <pre id="oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
