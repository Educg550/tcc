<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="titulos">
    <div class="universidade">Universidade de São Paulo</div>
    <div class="programa">Programa de Pós-Graduação do IME-USP</div>
  </div>
</header>

<div id="abainterface">
  <nav class="abas">
    <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>

  <main>
    <form class="formulario ativo" data-aba="alunos">
      <div class="erros"></div>

      <section class="bloco">
        <h2>SOLICITANTE E EVENTO</h2>
        <div class="campos">
          <div class="campo">
            <label for="al_nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="al_nome" name="nome" type="text" placeholder="Maria da Silva Santos">
          </div>
          <div class="campo">
            <label for="al_n_usp">N. USP</label>
            <input id="al_n_usp" name="n_usp" type="text" inputmode="numeric" placeholder="12345678">
          </div>
          <div class="campo">
            <label for="al_programa">PROGRAMA</label>
            <input id="al_programa" name="programa" type="text" placeholder="Ciência da Computação">
          </div>
          <div class="campo">
            <label for="al_nivel">NÍVEL</label>
            <select id="al_nivel" name="nivel">
              <option value="">Selecione</option>
              <option value="Mestrado">Mestrado</option>
              <option value="Doutorado">Doutorado</option>
            </select>
          </div>
          <div class="campo">
            <label for="al_tipo_auxilio">TIPO DE AUXÍLIO</label>
            <select id="al_tipo_auxilio" name="tipo_auxilio">
              <option value="">Selecione</option>
              <option value="Participação em evento">Participação em evento</option>
              <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div class="campo">
            <label for="al_email">E-MAIL</label>
            <input id="al_email" name="email" type="text" placeholder="maria.silva@usp.br">
          </div>
          <div class="campo">
            <label for="al_evento_nome">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="al_evento_nome" name="evento_nome" type="text" placeholder="Congresso Brasileiro de Computação">
          </div>
          <div class="campo">
            <label for="al_evento_periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="al_evento_periodo" name="evento_periodo" type="text" placeholder="15 a 18 de julho de 2025">
          </div>
          <div class="campo">
            <label for="al_evento_cidade">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="al_evento_cidade" name="evento_cidade" type="text" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="al_evento_estado">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="al_evento_estado" name="evento_estado" type="text" placeholder="SP">
          </div>
          <div class="campo">
            <label for="al_evento_pais">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="al_evento_pais" name="evento_pais" type="text" placeholder="Brasil">
          </div>
          <div class="campo">
            <label for="al_evento_link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="al_evento_link" name="evento_link" type="text" placeholder="https://evento.exemplo.com">
          </div>
          <div class="campo">
            <label for="al_valor">VALOR SOLICITADO (R$)</label>
            <input id="al_valor" name="valor" type="text" inputmode="numeric" data-format="moeda" placeholder="R$ 1.500,00">
          </div>
          <div class="campo">
            <label for="al_apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="al_apresentacao" name="apresentacao">
              <option value="">Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo span-full">
            <label for="al_detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="al_detalhamento" name="detalhamento" rows="2" placeholder="Transporte, hospedagem e taxa de inscrição."></textarea>
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="campos">
          <div class="campo">
            <label for="al_data_nascimento">DATA DE NASCIMENTO</label>
            <input id="al_data_nascimento" name="data_nascimento" type="text" inputmode="numeric" data-format="data" placeholder="01/02/1980">
          </div>
          <div class="campo">
            <label for="al_logradouro">LOGRADOURO</label>
            <input id="al_logradouro" name="logradouro" type="text" placeholder="Av. Prof. Luciano Gualberto">
          </div>
          <div class="campo">
            <label for="al_numero">NÚMERO</label>
            <input id="al_numero" name="numero" type="text" placeholder="128">
          </div>
          <div class="campo">
            <label for="al_complemento">COMPLEMENTO</label>
            <input id="al_complemento" name="complemento" type="text" placeholder="Apto 42">
          </div>
          <div class="campo">
            <label for="al_bairro">BAIRRO</label>
            <input id="al_bairro" name="bairro" type="text" placeholder="Butantã">
          </div>
          <div class="campo">
            <label for="al_cep">CEP</label>
            <input id="al_cep" name="cep" type="text" inputmode="numeric" data-format="cep" placeholder="05508-090">
          </div>
          <div class="campo">
            <label for="al_cidade">CIDADE</label>
            <input id="al_cidade" name="cidade" type="text" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="al_estado">ESTADO</label>
            <input id="al_estado" name="estado" type="text" placeholder="SP">
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="campos">
          <div class="campo">
            <label for="al_cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="al_cpf" name="cpf" type="text" inputmode="numeric" data-format="cpf" placeholder="123.456.789-09">
          </div>
          <div class="campo">
            <label for="al_rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="al_rg" name="rg" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo">
            <label for="al_banco">NOME DO BANCO</label>
            <input id="al_banco" name="banco" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo">
            <label for="al_agencia">NÚMERO DA AGÊNCIA</label>
            <input id="al_agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo">
            <label for="al_conta">NÚMERO DA CONTA</label>
            <input id="al_conta" name="conta" type="text" placeholder="12345-6">
          </div>
        </div>
      </section>

      <button type="submit" class="botao-enviar">Enviar solicitação</button>
    </form>

          </div>
          <div class="campo">
            <label for="do_evento_estado">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="do_evento_estado" name="evento_estado" type="text" placeholder="SP">

          <div class="campo">

          <div class="campo">

            <select id="do_apresentacao" name="apresentacao">

              <option value="Apresentação oral">Apresentação oral</option>

              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo span-full">

            <textarea id="do_detalhamento" name="detalhamento" rows="2" placeholder="Passagens e diárias para participação em banca."></textarea>
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="campos">
          <div class="campo">
            <label for="do_data_nascimento">DATA DE NASCIMENTO</label>
            <input id="do_data_nascimento" name="data_nascimento" type="text" inputmode="numeric" data-format="data" placeholder="01/02/1980">
          </div>
          <div class="campo">
            <label for="do_logradouro">LOGRADOURO</label>
            <input id="do_logradouro" name="logradouro" type="text" placeholder="Av. Prof. Luciano Gualberto">
          </div>
          <div class="campo">
            <label for="do_numero">NÚMERO</label>
            <input id="do_numero" name="numero" type="text" placeholder="128">
          </div>
          <div class="campo">
            <label for="do_complemento">COMPLEMENTO</label>
            <input id="do_complemento" name="complemento" type="text" placeholder="Apto 42">
          </div>
          <div class="campo">
            <label for="do_bairro">BAIRRO</label>
            <input id="do_bairro" name="bairro" type="text" placeholder="Butantã">
          </div>
          <div class="campo">
            <label for="do_cep">CEP</label>
            <input id="do_cep" name="cep" type="text" inputmode="numeric" data-format="cep" placeholder="05508-090">
          </div>
          <div class="campo">
            <label for="do_cidade">CIDADE</label>
            <input id="do_cidade" name="cidade" type="text" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="do_estado">ESTADO</label>
            <input id="do_estado" name="estado" type="text" placeholder="SP">
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="campos">
          <div class="campo">
            <label for="do_cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="do_cpf" name="cpf" type="text" inputmode="numeric" data-format="cpf" placeholder="123.456.789-09">
          </div>
          <div class="campo">
            <label for="do_rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="do_rg" name="rg" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo">
            <label for="do_banco">NOME DO BANCO</label>
            <input id="do_banco" name="banco" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo">
            <label for="do_agencia">NÚMERO DA AGÊNCIA</label>
            <input id="do_agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo">
            <label for="do_conta">NÚMERO DA CONTA</label>
            <input id="do_conta" name="conta" type="text" placeholder="12345-6">
          </div>
        </div>
      </section>

      <button type="submit" class="botao-enviar">Enviar solicitação</button>
    </form>
  </main>
</div>

<div id="confirmacao">
  <h1>Solicitação registrada</h1>
  <pre id="oficio"></pre>
</div>

<script src="app.js"></script>
</body>
</html>
