<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel='stylesheet' href='/style.css'>
</head>
<body>
<header class='cabecalho'>
  <img src='/assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
  <div class='inst'>
    <h1>Universidade de São Paulo</h1>
    <p>Pós-Graduação - Instituto de Matemática e Estatística</p>
  </div>
</header>

<nav class='abas'>
  <button type='button' class='aba ativa' data-aba='alunos'>ALUNOS</button>
  <button type='button' class='aba' data-aba='docentes'>DOCENTES</button>
</nav>

<main id='conteudo'>
  <form class='formulario ativa' id='form-alunos' data-aba='alunos' novalidate>
    <div class='erros' hidden></div>

    <fieldset class='bloco'>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class='grade grade-1'>
        <label>NOME COMPLETO - SEM ABREVIAR<input name='nome_completo' type='text' placeholder='Maria da Silva Santos'></label>
        <label>N. USP<input name='n_usp' type='text' placeholder='12345678'></label>
        <label>PROGRAMA<input name='programa' type='text' placeholder='Ciência da Computação'></label>
        <label>NÍVEL<select name='nivel'><option>Mestrado</option><option>Doutorado</option></select></label>
        <label>TIPO DE AUXÍLIO<select name='tipo_auxilio'><option>Participação em evento</option><option>Banca de exame ou defesa</option><option>Outro</option></select></label>
        <label>E-MAIL<input name='email' type='text' placeholder='maria@ime.usp.br'></label>
        <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA<input name='nome_evento' type='text' placeholder='Simpósio Brasileiro de Computação'></label>
        <label>PERÍODO DO EVENTO, EXAME OU DEFESA<input name='periodo' type='text' placeholder='10 a 15 de julho de 2024'></label>
        <label>CIDADE DO EVENTO, EXAME OU DEFESA<input name='cidade_evento' type='text' placeholder='São Paulo'></label>
        <label>ESTADO DO EVENTO, EXAME OU DEFESA<input name='estado_evento' type='text' placeholder='SP'></label>
        <label>PAÍS DO EVENTO, EXAME OU DEFESA<input name='pais_evento' type='text' placeholder='Brasil'></label>
        <label>LINK DO EVENTO, EXAME OU DEFESA<input name='link_evento' type='text' placeholder='https://evento.ime.usp.br'></label>
        <label>VALOR SOLICITADO (R$)<input name='valor' type='text' placeholder='150000'></label>
        <label class='largo'>DETALHAMENTO DO PEDIDO<textarea name='detalhamento' rows='2' placeholder='Passagens e hospedagem'></textarea></label>
        <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?<select name='apresentacao'><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
      </div>
    </fieldset>

    <fieldset class='bloco'>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class='grade grade-2'>
        <label>DATA DE NASCIMENTO<input name='data_nascimento' type='text' placeholder='01021980'></label>
        <label>LOGRADOURO<input name='logradouro' type='text' placeholder='Rua do Matão'></label>
        <label>NÚMERO<input name='numero' type='text' placeholder='1010'></label>
        <label>COMPLEMENTO<input name='complemento' type='text' placeholder='Bloco B'></label>
        <label>BAIRRO<input name='bairro' type='text' placeholder='Butantã'></label>
        <label>CEP<input name='cep' type='text' placeholder='05508090'></label>
        <label>CIDADE<input name='cidade' type='text' placeholder='São Paulo'></label>
        <label>ESTADO<input name='estado' type='text' placeholder='SP'></label>
      </div>
    </fieldset>

    <fieldset class='bloco'>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class='grade grade-3'>
        <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input name='cpf' type='text' placeholder='12345678909'></label>
        <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input name='rg' type='text' placeholder='12.345.678-9'></label>
        <label>NOME DO BANCO<input name='banco' type='text' placeholder='Banco do Brasil'></label>
        <label>NÚMERO DA AGÊNCIA<input name='agencia' type='text' placeholder='1234'></label>
        <label>NÚMERO DA CONTA<input name='conta' type='text' placeholder='12345-6'></label>
      </div>
    </fieldset>

    <button type='submit' class='enviar'>Enviar solicitação</button>
  </form>

  <form class='formulario' id='form-docentes' data-aba='docentes' novalidate>
    <div class='erros' hidden></div>

    <fieldset class='bloco'>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class='grade grade-1'>
        <label>NOME COMPLETO - SEM ABREVIAR<input name='nome_completo' type='text' placeholder='Maria da Silva Santos'></label>
        <label>N. USP<input name='n_usp' type='text' placeholder='12345678'></label>
        <label>PROGRAMA<input name='programa' type='text' placeholder='Ciência da Computação'></label>
        <label>E-MAIL<input name='email' type='text' placeholder='maria@ime.usp.br'></label>
        <label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA<input name='nome_evento' type='text' placeholder='Simpósio Brasileiro de Computação'></label>
        <label>PERÍODO DO EVENTO, EXAME OU DEFESA<input name='periodo' type='text' placeholder='10 a 15 de julho de 2024'></label>
        <label>CIDADE DO EVENTO, EXAME OU DEFESA<input name='cidade_evento' type='text' placeholder='São Paulo'></label>
        <label>ESTADO DO EVENTO, EXAME OU DEFESA<input name='estado_evento' type='text' placeholder='SP'></label>
        <label>PAÍS DO EVENTO, EXAME OU DEFESA<input name='pais_evento' type='text' placeholder='Brasil'></label>
        <label>LINK DO EVENTO, EXAME OU DEFESA<input name='link_evento' type='text' placeholder='https://evento.ime.usp.br'></label>
        <label>VALOR SOLICITADO (R$)<input name='valor' type='text' placeholder='150000'></label>
        <label class='largo'>DETALHAMENTO DO PEDIDO<textarea name='detalhamento' rows='2' placeholder='Passagens e hospedagem'></textarea></label>
        <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?<select name='apresentacao'><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
      </div>
    </fieldset>

    <fieldset class='bloco'>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class='grade grade-2'>
        <label>DATA DE NASCIMENTO<input name='data_nascimento' type='text' placeholder='01021980'></label>
        <label>LOGRADOURO<input name='logradouro' type='text' placeholder='Rua do Matão'></label>
        <label>NÚMERO<input name='numero' type='text' placeholder='1010'></label>
        <label>COMPLEMENTO<input name='complemento' type='text' placeholder='Bloco B'></label>
        <label>BAIRRO<input name='bairro' type='text' placeholder='Butantã'></label>
        <label>CEP<input name='cep' type='text' placeholder='05508090'></label>
        <label>CIDADE<input name='cidade' type='text' placeholder='São Paulo'></label>
        <label>ESTADO<input name='estado' type='text' placeholder='SP'></label>
      </div>
    </fieldset>

    <fieldset class='bloco'>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class='grade grade-3'>
        <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input name='cpf' type='text' placeholder='12345678909'></label>
        <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input name='rg' type='text' placeholder='12.345.678-9'></label>
        <label>NOME DO BANCO<input name='banco' type='text' placeholder='Banco do Brasil'></label>
        <label>NÚMERO DA AGÊNCIA<input name='agencia' type='text' placeholder='1234'></label>
        <label>NÚMERO DA CONTA<input name='conta' type='text' placeholder='12345-6'></label>
      </div>
    </fieldset>

    <button type='submit' class='enviar'>Enviar solicitação</button>
  </form>
</main>

<section id='confirmacao' hidden>
  <h1>Solicitação registrada</h1>
  <pre id='oficio'></pre>
</section>

<script src='/app.js'></script>
</body>
</html>
