<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo" class="logo">
  <div class="identidade">
    <h1>Universidade de São Paulo</h1>
    <p class="programa">Pós-Graduação - Instituto de Matemática e Estatística</p>
  </div>
</header>
<main>
  <nav class="abas" role="tablist">
    <button type="button" id="tab-alunos" class="aba ativa" role="tab" aria-selected="true">ALUNOS</button>
    <button type="button" id="tab-docentes" class="aba" role="tab" aria-selected="false">DOCENTES</button>
  </nav>
  <section id="painel-alunos" class="painel" role="tabpanel"></section>
  <section id="painel-docentes" class="painel escondido" role="tabpanel"></section>
  <section id="confirmacao" class="escondido"></section>
</main>
<script src="app.js"></script>
</body>
</html>
