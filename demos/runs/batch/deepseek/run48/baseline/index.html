<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identificacao">
    <span class="universidade">Universidade de São Paulo</span>
    <span class="programa">Pós-Graduação - Instituto de Matemática e Estatística</span>
  </div>
</header>

<main>
  <section id="vista-formulario">
    <nav class="abas">
      <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
      <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
    </nav>

    <form class="formulario ativo" data-aba="alunos" novalidate>
      <div class="erros" role="alert"></div>

      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <label class="campo col-2"><span class="rotulo">NOME COMPLETO - SEM ABREVIAR</span>
            <input type="text" name="nome" placeholder="Maria Aparecida de Souza"></label>
          <label class="campo"><span class="rotulo">N. USP</span>
            <input type="text" name="n_usp" inputmode="numeric" placeholder="12345678"></label>
          <label class="campo"><span class="rotulo">PROGRAMA</span>
            <input type="text" name="programa" placeholder="Matemática Aplicada"></label>
          <label class="campo"><span class="rotulo">NÍVEL</span>
            <select name="nivel">
              <option value="">Selecione</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select></label>
          <label class="campo"><span class="rotulo">TIPO DE AUXÍLIO</span>
            <select name="tipo_auxilio">
              <option value="">Selecione</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select></label>
          <label class="campo col-2"><span class="rotulo">E-MAIL</span>
            <input type="email" name="email" placeholder="maria.souza@usp.br"></label>
          <label class="campo col-2"><span class="rotulo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
            <input type="text" name="evento" placeholder="Congresso Brasileiro de Matemática"></label>
          <label class="campo"><span class="rotulo">PERÍODO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="periodo" placeholder="20 a 25 de julho de 2025"></label>
          <label class="campo"><span class="rotulo">VALOR SOLICITADO (R$)</span>
            <input type="text" name="valor" inputmode="numeric" placeholder="R$ 1.500,00"></label>
          <label class="campo"><span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="cidade_evento" placeholder="São Paulo"></label>
          <label class="campo"><span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="estado_evento" placeholder="SP"></label>
          <label class="campo"><span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="pais_evento" placeholder="Brasil"></label>
          <label class="campo"><span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="link" placeholder="https://evento.exemplo.br"></label>
          <label class="campo col-3"><span class="rotulo">DETALHAMENTO DO PEDIDO</span>
            <textarea name="detalhamento" rows="2" placeholder="Passagem aérea e hospedagem"></textarea></label>
          <label class="campo"><span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="apresentacao">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select></label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="campo"><span class="rotulo">DATA DE NASCIMENTO</span>
            <input type="text" name="data_nascimento" inputmode="numeric" placeholder="01/02/1980"></label>
          <label class="campo col-2"><span class="rotulo">LOGRADOURO</span>
            <input type="text" name="logradouro" placeholder="Rua do Matão"></label>
          <label class="campo"><span class="rotulo">NÚMERO</span>
            <input type="text" name="numero" placeholder="1010"></label>
          <label class="campo"><span class="rotulo">COMPLEMENTO</span>
            <input type="text" name="complemento" placeholder="Bloco B, apto 42"></label>
          <label class="campo"><span class="rotulo">BAIRRO</span>
            <input type="text" name="bairro" placeholder="Butantã"></label>
          <label class="campo"><span class="rotulo">CEP</span>
            <input type="text" name="cep" inputmode="numeric" placeholder="05508-090"></label>
          <label class="campo"><span class="rotulo">CIDADE</span>
            <input type="text" name="cidade" placeholder="São Paulo"></label>
          <label class="campo"><span class="rotulo">ESTADO</span>
            <input type="text" name="estado" placeholder="SP"></label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="campo"><span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="cpf" inputmode="numeric" placeholder="123.456.789-09"></label>
          <label class="campo"><span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="rg" placeholder="12.345.678-9"></label>
          <label class="campo"><span class="rotulo">NOME DO BANCO</span>
            <input type="text" name="banco" placeholder="Banco do Brasil"></label>
          <label class="campo"><span class="rotulo">NÚMERO DA AGÊNCIA</span>
            <input type="text" name="agencia" inputmode="numeric" placeholder="1234"></label>
          <label class="campo col-2"><span class="rotulo">NÚMERO DA CONTA</span>
            <input type="text" name="conta" placeholder="12345-6"></label>
        </div>
      </fieldset>

      <button type="submit" class="botao-enviar">Enviar solicitação</button>
    </form>

    <form class="formulario" data-aba="docentes" novalidate>
      <div class="erros" role="alert"></div>

      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <label class="campo col-2"><span class="rotulo">NOME COMPLETO - SEM ABREVIAR</span>
            <input type="text" name="nome" placeholder="João Carlos de Oliveira"></label>
          <label class="campo"><span class="rotulo">N. USP</span>
            <input type="text" name="n_usp" inputmode="numeric" placeholder="12345678"></label>
          <label class="campo"><span class="rotulo">PROGRAMA</span>
            <input type="text" name="programa" placeholder="Matemática Aplicada"></label>

            <input type="text" name="evento" placeholder="Congresso Brasileiro de Matemática"></label>
          <label class="campo"><span class="rotulo">PERÍODO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="periodo" placeholder="20 a 25 de julho de 2025"></label>
          <label class="campo"><span class="rotulo">VALOR SOLICITADO (R$)</span>
            <input type="text" name="valor" inputmode="numeric" placeholder="R$ 1.500,00"></label>
          <label class="campo"><span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="cidade_evento" placeholder="São Paulo"></label>
          <label class="campo"><span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="estado_evento" placeholder="SP"></label>
          <label class="campo"><span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="pais_evento" placeholder="Brasil"></label>
          <label class="campo"><span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="link" placeholder="https://evento.exemplo.br"></label>
          <label class="campo col-3"><span class="rotulo">DETALHAMENTO DO PEDIDO</span>
            <textarea name="detalhamento" rows="2" placeholder="Passagem aérea e hospedagem"></textarea></label>
          <label class="campo"><span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="apresentacao">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select></label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="campo"><span class="rotulo">DATA DE NASCIMENTO</span>
            <input type="text" name="data_nascimento" inputmode="numeric" placeholder="01/02/1980"></label>
          <label class="campo col-2"><span class="rotulo">LOGRADOURO</span>
            <input type="text" name="logradouro" placeholder="Rua do Matão"></label>
          <label class="campo"><span class="rotulo">NÚMERO</span>
            <input type="text" name="numero" placeholder="1010"></label>
          <label class="campo"><span class="rotulo">COMPLEMENTO</span>
            <input type="text" name="complemento" placeholder="Bloco B, apto 42"></label>
          <label class="campo"><span class="rotulo">BAIRRO</span>
            <input type="text" name="bairro" placeholder="Butantã"></label>
          <label class="campo"><span class="rotulo">CEP</span>
            <input type="text" name="cep" inputmode="numeric" placeholder="05508-090"></label>
          <label class="campo"><span class="rotulo">CIDADE</span>
            <input type="text" name="cidade" placeholder="São Paulo"></label>
          <label class="campo"><span class="rotulo">ESTADO</span>
            <input type="text" name="estado" placeholder="SP"></label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="campo"><span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="cpf" inputmode="numeric" placeholder="123.456.789-09"></label>
          <label class="campo"><span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="rg" placeholder="12.345.678-9"></label>
          <label class="campo"><span class="rotulo">NOME DO BANCO</span>
            <input type="text" name="banco" placeholder="Banco do Brasil"></label>
          <label class="campo"><span class="rotulo">NÚMERO DA AGÊNCIA</span>
            <input type="text" name="agencia" inputmode="numeric" placeholder="1234"></label>
          <label class="campo col-2"><span class="rotulo">NÚMERO DA CONTA</span>
            <input type="text" name="conta" placeholder="12345-6"></label>
        </div>
      </fieldset>

      <button type="submit" class="botao-enviar">Enviar solicitação</button>
    </form>
  </section>

  <section id="vista-confirmacao" class="oculto">
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
