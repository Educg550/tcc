<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="identidade">
      <h1>Universidade de São Paulo</h1>
      <p>Programa de Pós-Graduação - IME-USP</p>
    </div>
  </header>

  <main>
    <div id="abas" class="abas" role="tablist">
      <button type="button" class="aba ativa" data-aba="alunos" role="tab" aria-selected="true">ALUNOS</button>
      <button type="button" class="aba" data-aba="docentes" role="tab" aria-selected="false">DOCENTES</button>
    </div>

    <section id="form-alunos" class="painel"></section>
    <section id="form-docentes" class="painel escondido"></section>

    <section id="confirmacao" class="escondido">
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
