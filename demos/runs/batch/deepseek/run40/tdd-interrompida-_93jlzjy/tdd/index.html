<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<header class='cabecalho'>
  <img class='logo' src='assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
  <div class='titulo'>
    <h1>Universidade de São Paulo</h1>
    <p class='programa'>Programa de Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>

<main>
  <div class='abas' role='tablist'>
    <button class='aba ativa' type='button' role='tab' id='aba-alunos' data-aba='alunos' aria-selected='true' aria-controls='painel-alunos'>ALUNOS</button>
    <button class='aba' type='button' role='tab' id='aba-docentes' data-aba='docentes' aria-selected='false' aria-controls='painel-docentes'>DOCENTES</button>
  </div>

  <section class='painel visivel' id='painel-alunos' role='tabpanel' aria-labelledby='aba-alunos'>
    <form class='solicitacao' data-aba='alunos' novalidate>
      <p class='erros' hidden></p>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class='grade'>
          <div class='campo'><label for='a-nome'>NOME COMPLETO - SEM ABREVIAR</label><input id='a-nome' name='nome' type='text' placeholder='Maria Aparecida da Silva'></div>
          <div class='campo'><label for='a-n-usp'>N. USP</label><input id='a-n-usp' name='n_usp' type='text' inputmode='numeric' placeholder='12345678'></div>
          <div class='campo'><label for='a-programa'>PROGRAMA</label><input id='a-programa' name='programa' type='text' placeholder='Ciência da Computação'></div>
          <div class='campo'><label for='a-nivel'>NÍVEL</label><select id='a-nivel' name='nivel'><option value=''>Selecione</option><option>Mestrado</option><option>Doutorado</option></select></div>
          <div class='campo'><label for='a-tipo-auxilio'>TIPO DE AUXÍLIO</label><select id='a-tipo-auxilio' name='tipo_auxilio'><option value=''>Selecione</option><option>Participação em evento</option><option>Banca de exame ou defesa</option><option>Outro</option></select></div>
          <div class='campo'><label for='a-email'>E-MAIL</label><input id='a-email' name='email' type='email' placeholder='maria.silva@usp.br'></div>
          <div class='campo'><label for='a-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label><input id='a-evento' name='evento' type='text' placeholder='Congresso Brasileiro de Computação'></div>
          <div class='campo'><label for='a-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label><input id='a-periodo' name='periodo' type='text' placeholder='10 a 14 de março de 2025'></div>
          <div class='campo'><label for='a-cidade'>CIDADE DO EVENTO, EXAME OU DEFESA</label><input id='a-cidade' name='cidade' type='text' placeholder='São Paulo'></div>
          <div class='campo'><label for='a-estado'>ESTADO DO EVENTO, EXAME OU DEFESA</label><input id='a-estado' name='estado' type='text' placeholder='SP'></div>
          <div class='campo'><label for='a-pais'>PAÍS DO EVENTO, EXAME OU DEFESA</label><input id='a-pais' name='pais' type='text' placeholder='Brasil'></div>
          <div class='campo'><label for='a-link'>LINK DO EVENTO, EXAME OU DEFESA</label><input id='a-link' name='link' type='text' placeholder='https://evento.exemplo.br'></div>
          <div class='campo'><label for='a-valor'>VALOR SOLICITADO (R$)</label><input id='a-valor' name='valor' type='text' inputmode='numeric' placeholder='R$ 1.500,00'></div>
          <div class='campo largo'><label for='a-detalhamento'>DETALHAMENTO DO PEDIDO</label><textarea id='a-detalhamento' name='detalhamento' rows='2' placeholder='Passagem aérea, hospedagem e taxa de inscrição.'></textarea></div>
          <div class='campo'><label for='a-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label><select id='a-apresentacao' name='apresentacao'><option value=''>Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class='grade'>
          <div class='campo'><label for='a-data-nascimento'>DATA DE NASCIMENTO</label><input id='a-data-nascimento' name='data_nascimento' type='text' inputmode='numeric' placeholder='01/02/1980'></div>
          <div class='campo'><label for='a-logradouro'>LOGRADOURO</label><input id='a-logradouro' name='logradouro' type='text' placeholder='Av. Prof. Luciano Gualberto'></div>
          <div class='campo'><label for='a-numero'>NÚMERO</label><input id='a-numero' name='numero' type='text' placeholder='1280'></div>
          <div class='campo'><label for='a-complemento'>COMPLEMENTO</label><input id='a-complemento' name='complemento' type='text' placeholder='Bloco B, sala 45'></div>
          <div class='campo'><label for='a-bairro'>BAIRRO</label><input id='a-bairro' name='bairro' type='text' placeholder='Butantã'></div>
          <div class='campo'><label for='a-cep'>CEP</label><input id='a-cep' name='cep' type='text' inputmode='numeric' placeholder='05508-090'></div>
          <div class='campo'><label for='a-cidade-sol'>CIDADE</label><input id='a-cidade-sol' name='cidade_sol' type='text' placeholder='São Paulo'></div>
          <div class='campo'><label for='a-estado-sol'>ESTADO</label><input id='a-estado-sol' name='estado_sol' type='text' placeholder='SP'></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class='grade'>
          <div class='campo'><label for='a-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label><input id='a-cpf' name='cpf' type='text' inputmode='numeric' placeholder='123.456.789-09'></div>
          <div class='campo'><label for='a-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label><input id='a-rg' name='rg' type='text' placeholder='12.345.678-9'></div>
          <div class='campo'><label for='a-banco'>NOME DO BANCO</label><input id='a-banco' name='banco' type='text' placeholder='Banco do Brasil'></div>
          <div class='campo'><label for='a-agencia'>NÚMERO DA AGÊNCIA</label><input id='a-agencia' name='agencia' type='text' inputmode='numeric' placeholder='1234'></div>
          <div class='campo'><label for='a-conta'>NÚMERO DA CONTA</label><input id='a-conta' name='conta' type='text' placeholder='12345-6'></div>
        </div>
      </fieldset>

      <div class='acoes'><button type='submit'>Enviar solicitação</button></div>
    </form>
  </section>

  <section class='painel' id='painel-docentes' role='tabpanel' aria-labelledby='aba-docentes'>
    <form class='solicitacao' data-aba='docentes' novalidate>
      <p class='erros' hidden></p>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class='grade'>
          <div class='campo'><label for='d-nome'>NOME COMPLETO - SEM ABREVIAR</label><input id='d-nome' name='nome' type='text' placeholder='João Carlos de Souza'></div>
          <div class='campo'><label for='d-n-usp'>N. USP</label><input id='d-n-usp' name='n_usp' type='text' inputmode='numeric' placeholder='12345678'></div>
          <div class='campo'><label for='d-programa'>PROGRAMA</label><input id='d-programa' name='programa' type='text' placeholder='Ciência da Computação'></div>
          <div class='campo'><label for='d-email'>E-MAIL</label><input id='d-email' name='email' type='email' placeholder='joao.souza@usp.br'></div>
          <div class='campo'><label for='d-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label><input id='d-evento' name='evento' type='text' placeholder='Congresso Brasileiro de Computação'></div>
          <div class='campo'><label for='d-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label><input id='d-periodo' name='periodo' type='text' placeholder='10 a 14 de março de 2025'></div>
          <div class='campo'><label for='d-cidade'>CIDADE DO EVENTO, EXAME OU DEFESA</label><input id='d-cidade' name='cidade' type='text' placeholder='São Paulo'></div>
          <div class='campo'><label for='d-estado'>ESTADO DO EVENTO, EXAME OU DEFESA</label><input id='d-estado' name='estado' type='text' placeholder='SP'></div>
          <div class='campo'><label for='d-pais'>PAÍS DO EVENTO, EXAME OU DEFESA</label><input id='d-pais' name='pais' type='text' placeholder='Brasil'></div>
          <div class='campo'><label for='d-link'>LINK DO EVENTO, EXAME OU DEFESA</label><input id='d-link' name='link' type='text' placeholder='https://evento.exemplo.br'></div>
          <div class='campo'><label for='d-valor'>VALOR SOLICITADO (R$)</label><input id='d-valor' name='valor' type='text' inputmode='numeric' placeholder='R$ 1.500,00'></div>
          <div class='campo largo'><label for='d-detalhamento'>DETALHAMENTO DO PEDIDO</label><textarea id='d-detalhamento' name='detalhamento' rows='2' placeholder='Diárias e passagem aérea para participação no evento.'></textarea></div>
          <div class='campo'><label for='d-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label><select id='d-apresentacao' name='apresentacao'><option value=''>Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class='grade'>
          <div class='campo'><label for='d-data-nascimento'>DATA DE NASCIMENTO</label><input id='d-data-nascimento' name='data_nascimento' type='text' inputmode='numeric' placeholder='01/02/1980'></div>
          <div class='campo'><label for='d-logradouro'>LOGRADOURO</label><input id='d-logradouro' name='logradouro' type='text' placeholder='Av. Prof. Luciano Gualberto'></div>
          <div class='campo'><label for='d-numero'>NÚMERO</label><input id='d-numero' name='numero' type='text' placeholder='1280'></div>
          <div class='campo'><label for='d-complemento'>COMPLEMENTO</label><input id='d-complemento' name='complemento' type='text' placeholder='Bloco B, sala 45'></div>
          <div class='campo'><label for='d-bairro'>BAIRRO</label><input id='d-bairro' name='bairro' type='text' placeholder='Butantã'></div>
          <div class='campo'><label for='d-cep'>CEP</label><input id='d-cep' name='cep' type='text' inputmode='numeric' placeholder='05508-090'></div>
          <div class='campo'><label for='d-cidade-sol'>CIDADE</label><input id='d-cidade-sol' name='cidade_sol' type='text' placeholder='São Paulo'></div>
          <div class='campo'><label for='d-estado-sol'>ESTADO</label><input id='d-estado-sol' name='estado_sol' type='text' placeholder='SP'></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class='grade'>
          <div class='campo'><label for='d-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label><input id='d-cpf' name='cpf' type='text' inputmode='numeric' placeholder='123.456.789-09'></div>
          <div class='campo'><label for='d-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label><input id='d-rg' name='rg' type='text' placeholder='12.345.678-9'></div>
          <div class='campo'><label for='d-banco'>NOME DO BANCO</label><input id='d-banco' name='banco' type='text' placeholder='Banco do Brasil'></div>
          <div class='campo'><label for='d-agencia'>NÚMERO DA AGÊNCIA</label><input id='d-agencia' name='agencia' type='text' inputmode='numeric' placeholder='1234'></div>
          <div class='campo'><label for='d-conta'>NÚMERO DA CONTA</label><input id='d-conta' name='conta' type='text' placeholder='12345-6'></div>
        </div>
      </fieldset>

      <div class='acoes'><button type='submit'>Enviar solicitação</button></div>
    </form>
  </section>
</main>

<section id='confirmacao' hidden>
  <h2>Solicitação registrada</h2>
  <pre id='oficio'></pre>
</section>

<script src='app.js'></script>
</body>
</html>
