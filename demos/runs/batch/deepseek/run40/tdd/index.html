<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="cabecalho">
    <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo" class="logo">
    <div class="identidade">
      <h1>Universidade de São Paulo</h1>
      <p class="programa">Programa de Pós-Graduação - Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <nav class="abas">
    <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>

  <main>

    <!-- ===================== ABA ALUNOS ===================== -->
    <section id="form-alunos" class="formulario ativa">
      <form data-aba="alunos" novalidate>
        <div class="erros" role="alert" hidden></div>

        <fieldset class="bloco">
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grade">
            <label class="campo col-2"><span>NOME COMPLETO - SEM ABREVIAR</span>
              <input type="text" name="nome" placeholder="Maria da Silva Santos" required></label>
            <label class="campo col-1"><span>N. USP</span>
              <input type="text" name="n_usp" inputmode="numeric" placeholder="12345678" required></label>
            <label class="campo col-2"><span>PROGRAMA</span>
              <input type="text" name="programa" placeholder="Ciência da Computação" required></label>
            <label class="campo col-1"><span>NÍVEL</span>
              <select name="nivel" required>
                <option value="">Selecione</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select></label>
            <label class="campo col-2"><span>TIPO DE AUXÍLIO</span>
              <select name="tipo_auxilio" required>
                <option value="">Selecione</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select></label>
            <label class="campo col-2"><span>E-MAIL</span>
              <input type="email" name="email" placeholder="maria@usp.br" required></label>
            <label class="campo col-3"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
              <input type="text" name="nome_evento" placeholder="Congresso Brasileiro de Computação" required></label>
            <label class="campo col-2"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="periodo" placeholder="10 a 15 de março de 2024" required></label>
            <label class="campo col-2"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="cidade_evento" placeholder="São Paulo" required></label>
            <label class="campo col-1"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="estado_evento" placeholder="SP" required></label>
            <label class="campo col-1"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="pais_evento" placeholder="Brasil" required></label>
            <label class="campo col-2"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="link_evento" placeholder="https://evento.exemplo.br"></label>
            <label class="campo col-1"><span>VALOR SOLICITADO (R$)</span>
              <input type="text" name="valor" inputmode="numeric" placeholder="R$ 1.500,00" required></label>
            <label class="campo col-2"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
              <select name="apresentacao" required>
                <option value="">Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select></label>
            <label class="campo col-6"><span>DETALHAMENTO DO PEDIDO</span>
              <textarea name="detalhamento" rows="2" placeholder="Descreva a finalidade do auxílio e os gastos previstos" required></textarea></label>
          </div>
        </fieldset>

        <fieldset class="bloco">
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <label class="campo col-1"><span>DATA DE NASCIMENTO</span>
              <input type="text" name="data_nascimento" inputmode="numeric" placeholder="01/02/1980" required></label>
            <label class="campo col-3"><span>LOGRADOURO</span>
              <input type="text" name="logradouro" placeholder="Av. Prof. Luciano Gualberto" required></label>
            <label class="campo col-1"><span>NÚMERO</span>
              <input type="text" name="numero" placeholder="128" required></label>
            <label class="campo col-1"><span>COMPLEMENTO</span>
              <input type="text" name="complemento" placeholder="Sala 101"></label>
            <label class="campo col-2"><span>BAIRRO</span>
              <input type="text" name="bairro" placeholder="Butantã" required></label>
            <label class="campo col-1"><span>CEP</span>
              <input type="text" name="cep" inputmode="numeric" placeholder="05508-090" required></label>
            <label class="campo col-2"><span>CIDADE</span>
              <input type="text" name="cidade" placeholder="São Paulo" required></label>
            <label class="campo col-1"><span>ESTADO</span>
              <input type="text" name="estado" placeholder="SP" required></label>
          </div>
        </fieldset>

        <fieldset class="bloco">
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <label class="campo col-2"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input type="text" name="cpf" inputmode="numeric" placeholder="123.456.789-09" required></label>
            <label class="campo col-1"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input type="text" name="rg" placeholder="12.345.678-9" required></label>
            <label class="campo col-1"><span>NOME DO BANCO</span>
              <input type="text" name="banco" placeholder="Banco do Brasil" required></label>
            <label class="campo col-1"><span>NÚMERO DA AGÊNCIA</span>
              <input type="text" name="agencia" inputmode="numeric" placeholder="1234" required></label>
            <label class="campo col-1"><span>NÚMERO DA CONTA</span>
              <input type="text" name="conta" placeholder="12345-6" required></label>
          </div>
        </fieldset>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>

    <!-- ===================== ABA DOCENTES ===================== -->
    <section id="form-docentes" class="formulario">
      <form data-aba="docentes" novalidate>
        <div class="erros" role="alert" hidden></div>

            <label class="campo col-2"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="periodo" placeholder="10 a 15 de março de 2024" required></label>
            <label class="campo col-2"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="cidade_evento" placeholder="São Paulo" required></label>
            <label class="campo col-1"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="estado_evento" placeholder="SP" required></label>
            <label class="campo col-1"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="pais_evento" placeholder="Brasil" required></label>
            <label class="campo col-2"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="link_evento" placeholder="https://evento.exemplo.br"></label>
            <label class="campo col-1"><span>VALOR SOLICITADO (R$)</span>
              <input type="text" name="valor" inputmode="numeric" placeholder="R$ 1.500,00" required></label>
            <label class="campo col-2"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
              <select name="apresentacao" required>
                <option value="">Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select></label>
            <label class="campo col-6"><span>DETALHAMENTO DO PEDIDO</span>
              <textarea name="detalhamento" rows="2" placeholder="Descreva a finalidade do auxílio e os gastos previstos" required></textarea></label>
          </div>
        </fieldset>

        <fieldset class="bloco">
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <label class="campo col-1"><span>DATA DE NASCIMENTO</span>
              <input type="text" name="data_nascimento" inputmode="numeric" placeholder="01/02/1980" required></label>
            <label class="campo col-3"><span>LOGRADOURO</span>
              <input type="text" name="logradouro" placeholder="Av. Prof. Luciano Gualberto" required></label>
            <label class="campo col-1"><span>NÚMERO</span>
              <input type="text" name="numero" placeholder="128" required></label>
            <label class="campo col-1"><span>COMPLEMENTO</span>
              <input type="text" name="complemento" placeholder="Sala 101"></label>
            <label class="campo col-2"><span>BAIRRO</span>
              <input type="text" name="bairro" placeholder="Butantã" required></label>
            <label class="campo col-1"><span>CEP</span>
              <input type="text" name="cep" inputmode="numeric" placeholder="05508-090" required></label>
            <label class="campo col-2"><span>CIDADE</span>
              <input type="text" name="cidade" placeholder="São Paulo" required></label>
            <label class="campo col-1"><span>ESTADO</span>
              <input type="text" name="estado" placeholder="SP" required></label>
          </div>
        </fieldset>

        <fieldset class="bloco">
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <label class="campo col-2"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input type="text" name="cpf" inputmode="numeric" placeholder="123.456.789-09" required></label>
            <label class="campo col-1"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input type="text" name="rg" placeholder="12.345.678-9" required></label>
            <label class="campo col-1"><span>NOME DO BANCO</span>
              <input type="text" name="banco" placeholder="Banco do Brasil" required></label>
            <label class="campo col-1"><span>NÚMERO DA AGÊNCIA</span>
              <input type="text" name="agencia" inputmode="numeric" placeholder="1234" required></label>
            <label class="campo col-1"><span>NÚMERO DA CONTA</span>
              <input type="text" name="conta" placeholder="12345-6" required></label>
          </div>
        </fieldset>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>

    <!-- ===================== CONFIRMAÇÃO ===================== -->
    <section id="confirmacao" class="confirmacao" hidden>
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
