<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identidade">
    <h1 class="universidade">Universidade de São Paulo</h1>
    <p class="programa">Pós-Graduação do IME-USP</p>
  </div>
</header>

<main id="principal">
  <nav class="abas">
    <button type="button" class="aba ativo" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>

  <section id="painel-alunos" class="painel ativo">
    <form data-aba="alunos" novalidate>
      <div class="erros oculto"></div>

      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <label class="campo">NOME COMPLETO - SEM ABREVIAR
            <input name="nome" type="text" placeholder="Maria Aparecida de Souza">
          </label>
          <label class="campo">N. USP
            <input name="n_usp" type="text" inputmode="numeric" placeholder="12345678">
          </label>
          <label class="campo">PROGRAMA
            <input name="programa" type="text" placeholder="Ciência da Computação">
          </label>
          <label class="campo">NÍVEL
            <select name="nivel">
              <option value="">Selecione</option>
              <option value="Mestrado">Mestrado</option>
              <option value="Doutorado">Doutorado</option>
            </select>
          </label>
          <label class="campo">TIPO DE AUXÍLIO
            <select name="tipo_auxilio">
              <option value="">Selecione</option>
              <option value="Participação em evento">Participação em evento</option>
              <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
              <option value="Outro">Outro</option>
            </select>
          </label>
          <label class="campo">E-MAIL
            <input name="email" type="email" placeholder="maria.souza@usp.br">
          </label>
          <label class="campo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
            <input name="nome_evento" type="text" placeholder="Congresso Brasileiro de Computação">
          </label>
          <label class="campo">PERÍODO DO EVENTO, EXAME OU DEFESA
            <input name="periodo" type="text" placeholder="10 a 14 de julho de 2024">
          </label>
          <label class="campo">CIDADE DO EVENTO, EXAME OU DEFESA
            <input name="cidade_evento" type="text" placeholder="Campinas">
          </label>
          <label class="campo">ESTADO DO EVENTO, EXAME OU DEFESA
            <input name="estado_evento" type="text" placeholder="SP">
          </label>
          <label class="campo">PAÍS DO EVENTO, EXAME OU DEFESA
            <input name="pais_evento" type="text" placeholder="Brasil">
          </label>
          <label class="campo">LINK DO EVENTO, EXAME OU DEFESA
            <input name="link_evento" type="text" placeholder="https://evento.exemplo.org">
          </label>
          <label class="campo">VALOR SOLICITADO (R$)
            <input name="valor" type="text" inputmode="numeric" data-fmt="moeda" placeholder="1500">
          </label>
          <label class="campo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
            <select name="apresentacao">
              <option value="">Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </label>
          <label class="campo largo">DETALHAMENTO DO PEDIDO
            <textarea name="detalhamento" rows="2" placeholder="Descreva as despesas previstas (transporte, hospedagem, inscrição...)"></textarea>
          </label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="campo">DATA DE NASCIMENTO
            <input name="data_nascimento" type="text" inputmode="numeric" data-fmt="data" placeholder="01/02/1980">
          </label>
          <label class="campo">LOGRADOURO
            <input name="logradouro" type="text" placeholder="Av. Professor Luciano Gualberto">
          </label>
          <label class="campo">NÚMERO
            <input name="numero" type="text" placeholder="158">
          </label>
          <label class="campo">COMPLEMENTO
            <input name="complemento" type="text" placeholder="Bloco A, ap. 42">
          </label>
          <label class="campo">BAIRRO
            <input name="bairro" type="text" placeholder="Butantã">
          </label>
          <label class="campo">CEP
            <input name="cep" type="text" inputmode="numeric" data-fmt="cep" placeholder="05508-090">
          </label>
          <label class="campo">CIDADE
            <input name="cidade" type="text" placeholder="São Paulo">
          </label>
          <label class="campo">ESTADO
            <input name="estado" type="text" placeholder="SP">
          </label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="campo">CPF (SEPARADOS POR PONTOS E TRAÇO)
            <input name="cpf" type="text" inputmode="numeric" data-fmt="cpf" placeholder="123.456.789-09">
          </label>
          <label class="campo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
            <input name="rg" type="text" placeholder="12.345.678-9">
          </label>
          <label class="campo">NOME DO BANCO
            <input name="banco" type="text" placeholder="Banco do Brasil">
          </label>
          <label class="campo">NÚMERO DA AGÊNCIA
            <input name="agencia" type="text" inputmode="numeric" placeholder="1234">
          </label>
          <label class="campo">NÚMERO DA CONTA
            <input name="conta" type="text" placeholder="12345-6">
          </label>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section id="painel-docentes" class="painel">
    <form data-aba="docentes" novalidate>
      <div class="erros oculto"></div>

      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <label class="campo">NOME COMPLETO - SEM ABREVIAR
            <input name="nome" type="text" placeholder="João Carlos de Oliveira">
          </label>
          <label class="campo">N. USP
            <input name="n_usp" type="text" inputmode="numeric" placeholder="87654321">
          </label>
          <label class="campo">PROGRAMA
            <input name="programa" type="text" placeholder="Ciência da Computação">
          </label>
          <label class="campo">E-MAIL
            <input name="email" type="email" placeholder="joao.oliveira@usp.br">
          </label>
          <label class="campo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
            <input name="nome_evento" type="text" placeholder="Congresso Brasileiro de Computação">
          </label>
          <label class="campo">PERÍODO DO EVENTO, EXAME OU DEFESA
            <input name="periodo" type="text" placeholder="10 a 14 de julho de 2024">
          </label>
          <label class="campo">CIDADE DO EVENTO, EXAME OU DEFESA
            <input name="cidade_evento" type="text" placeholder="Campinas">
          </label>
          <label class="campo">ESTADO DO EVENTO, EXAME OU DEFESA
            <input name="estado_evento" type="text" placeholder="SP">
          </label>
          <label class="campo">PAÍS DO EVENTO, EXAME OU DEFESA
            <input name="pais_evento" type="text" placeholder="Brasil">
          </label>
          <label class="campo">LINK DO EVENTO, EXAME OU DEFESA
            <input name="link_evento" type="text" placeholder="https://evento.exemplo.org">
          </label>
          <label class="campo">VALOR SOLICITADO (R$)
            <input name="valor" type="text" inputmode="numeric" data-fmt="moeda" placeholder="1500">
          </label>
          <label class="campo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
            <select name="apresentacao">
              <option value="">Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </label>
          <label class="campo largo">DETALHAMENTO DO PEDIDO
            <textarea name="detalhamento" rows="2" placeholder="Descreva as despesas previstas (transporte, hospedagem, inscrição...)"></textarea>
          </label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="campo">DATA DE NASCIMENTO
            <input name="data_nascimento" type="text" inputmode="numeric" data-fmt="data" placeholder="01/02/1980">
          </label>
          <label class="campo">LOGRADOURO
            <input name="logradouro" type="text" placeholder="Av. Professor Luciano Gualberto">
          </label>
          <label class="campo">NÚMERO
            <input name="numero" type="text" placeholder="158">
          </label>
          <label class="campo">COMPLEMENTO
            <input name="complemento" type="text" placeholder="Bloco A, ap. 42">
          </label>
          <label class="campo">BAIRRO
            <input name="bairro" type="text" placeholder="Butantã">
          </label>
          <label class="campo">CEP
            <input name="cep" type="text" inputmode="numeric" data-fmt="cep" placeholder="05508-090">
          </label>
          <label class="campo">CIDADE
            <input name="cidade" type="text" placeholder="São Paulo">
          </label>
          <label class="campo">ESTADO
            <input name="estado" type="text" placeholder="SP">
          </label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="campo">CPF (SEPARADOS POR PONTOS E TRAÇO)
            <input name="cpf" type="text" inputmode="numeric" data-fmt="cpf" placeholder="123.456.789-09">
          </label>
          <label class="campo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
            <input name="rg" type="text" placeholder="12.345.678-9">
          </label>
          <label class="campo">NOME DO BANCO
            <input name="banco" type="text" placeholder="Banco do Brasil">
          </label>
          <label class="campo">NÚMERO DA AGÊNCIA
            <input name="agencia" type="text" inputmode="numeric" placeholder="1234">
          </label>
          <label class="campo">NÚMERO DA CONTA
            <input name="conta" type="text" placeholder="12345-6">
          </label>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>
</main>

<section id="confirmacao" class="oculto">
  <h2>Solicitação registrada</h2>
  <div id="oficio"></div>
</section>

<script src="app.js"></script>
</body>
</html>
