<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identidade">
    <h1>Universidade de São Paulo</h1>
    <p>Programa de Pós-Graduação do IME-USP</p>
  </div>
</header>

<main>
  <div id="formulario">
    <nav class="abas">
      <button type="button" class="aba ativa" data-alvo="painel-alunos">ALUNOS</button>
      <button type="button" class="aba" data-alvo="painel-docentes">DOCENTES</button>
    </nav>

    <section id="painel-alunos" class="painel">
      <form id="form-alunos">
        <input type="hidden" name="aba" value="alunos">
        <div class="erros" hidden></div>

        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="campos">
            <label class="c4">NOME COMPLETO - SEM ABREVIAR
              <input type="text" name="nome" placeholder="Maria Aparecida da Silva">
            </label>
            <label class="c2">N. USP
              <input type="text" name="n_usp" placeholder="12345678">
            </label>
            <label class="c3">PROGRAMA
              <input type="text" name="programa" placeholder="Ciência da Computação">
            </label>
            <label class="c3">NÍVEL
              <select name="nivel">
                <option value="Mestrado">Mestrado</option>
                <option value="Doutorado">Doutorado</option>
              </select>
            </label>
            <label class="c4">TIPO DE AUXÍLIO
              <select name="tipo_auxilio">
                <option value="Participação em evento">Participação em evento</option>
                <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
                <option value="Outro">Outro</option>
              </select>
            </label>
            <label class="c4">E-MAIL
              <input type="email" name="email" placeholder="maria.silva@usp.br">
            </label>
            <label class="c4">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
              <input type="text" name="evento" placeholder="Congresso Brasileiro de Computação">
            </label>
            <label class="c4">PERÍODO DO EVENTO, EXAME OU DEFESA
              <input type="text" name="periodo" placeholder="10 a 14 de julho de 2025">
            </label>
            <label class="c3">CIDADE DO EVENTO, EXAME OU DEFESA
              <input type="text" name="cidade_evento" placeholder="São Paulo">
            </label>
            <label class="c2">ESTADO DO EVENTO, EXAME OU DEFESA
              <input type="text" name="estado_evento" placeholder="SP">
            </label>
            <label class="c3">PAÍS DO EVENTO, EXAME OU DEFESA
              <input type="text" name="pais_evento" placeholder="Brasil">
            </label>
            <label class="c6">LINK DO EVENTO, EXAME OU DEFESA
              <input type="text" name="link_evento" placeholder="www.evento.com.br">
            </label>
            <label class="c3">VALOR SOLICITADO (R$)
              <input type="text" name="valor" data-formatar="valor" placeholder="1.500,00">
            </label>
            <label class="c3">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
              <select name="apresentacao">
                <option value="Pôster">Pôster</option>
                <option value="Apresentação oral">Apresentação oral</option>
                <option value="Outra">Outra</option>
                <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
              </select>
            </label>
            <label class="c12">DETALHAMENTO DO PEDIDO
              <textarea name="detalhamento" rows="2" placeholder="Descreva a finalidade do auxílio e a justificativa do valor"></textarea>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="campos">
            <label class="c3">DATA DE NASCIMENTO
              <input type="text" name="data_nascimento" data-formatar="data_nascimento" placeholder="01/02/1980">
            </label>
            <label class="c5">LOGRADOURO
              <input type="text" name="logradouro" placeholder="Av. Prof. Luciano Gualberto">
            </label>
            <label class="c2">NÚMERO
              <input type="text" name="numero" placeholder="158">
            </label>
            <label class="c2">COMPLEMENTO
              <input type="text" name="complemento" placeholder="Bloco B, sala 12">
            </label>
            <label class="c3">BAIRRO
              <input type="text" name="bairro" placeholder="Butantã">
            </label>
            <label class="c3">CEP
              <input type="text" name="cep" data-formatar="cep" placeholder="05508-090">
            </label>
            <label class="c3">CIDADE
              <input type="text" name="cidade" placeholder="São Paulo">
            </label>
            <label class="c3">ESTADO
              <input type="text" name="estado" placeholder="SP">
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="campos">
            <label class="c3">CPF (SEPARADOS POR PONTOS E TRAÇO)
              <input type="text" name="cpf" data-formatar="cpf" placeholder="123.456.789-09">
            </label>
            <label class="c3">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
              <input type="text" name="rg" placeholder="12.345.678-9">
            </label>
            <label class="c3">NOME DO BANCO
              <input type="text" name="banco" placeholder="Banco do Brasil">
            </label>
            <label class="c3">NÚMERO DA AGÊNCIA
              <input type="text" name="agencia" placeholder="1234">
            </label>
            <label class="c3">NÚMERO DA CONTA
              <input type="text" name="conta" placeholder="12345-6">
            </label>
          </div>
        </fieldset>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>

    <section id="painel-docentes" class="painel" hidden>
      <form id="form-docentes">
        <input type="hidden" name="aba" value="docentes">
        <div class="erros" hidden></div>

        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="campos">
            <label class="c4">NOME COMPLETO - SEM ABREVIAR
              <input type="text" name="nome" placeholder="João Carlos de Oliveira">
            </label>
            <label class="c2">N. USP
              <input type="text" name="n_usp" placeholder="87654321">
            </label>
            <label class="c3">PROGRAMA
              <input type="text" name="programa" placeholder="Ciência da Computação">
            </label>
            <label class="c3">E-MAIL
              <input type="email" name="email" placeholder="joao.oliveira@usp.br">
            </label>
            <label class="c4">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
              <input type="text" name="evento" placeholder="Simpósio de Matemática Aplicada">
            </label>
            <label class="c4">PERÍODO DO EVENTO, EXAME OU DEFESA
              <input type="text" name="periodo" placeholder="3 a 7 de março de 2025">
            </label>
            <label class="c4">CIDADE DO EVENTO, EXAME OU DEFESA
              <input type="text" name="cidade_evento" placeholder="Campinas">
            </label>
            <label class="c3">ESTADO DO EVENTO, EXAME OU DEFESA
              <input type="text" name="estado_evento" placeholder="SP">
            </label>
            <label class="c3">PAÍS DO EVENTO, EXAME OU DEFESA
              <input type="text" name="pais_evento" placeholder="Brasil">
            </label>
            <label class="c3">LINK DO EVENTO, EXAME OU DEFESA
              <input type="text" name="link_evento" placeholder="www.simposio.com.br">
            </label>
            <label class="c3">VALOR SOLICITADO (R$)
              <input type="text" name="valor" data-formatar="valor" placeholder="2.000,00">
            </label>
            <label class="c6">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
              <select name="apresentacao">
                <option value="Pôster">Pôster</option>
                <option value="Apresentação oral">Apresentação oral</option>
                <option value="Outra">Outra</option>
                <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
              </select>
            </label>
            <label class="c12">DETALHAMENTO DO PEDIDO
              <textarea name="detalhamento" rows="2" placeholder="Descreva a finalidade do auxílio e a justificativa do valor"></textarea>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="campos">
            <label class="c3">DATA DE NASCIMENTO
              <input type="text" name="data_nascimento" data-formatar="data_nascimento" placeholder="15/06/1975">
            </label>
            <label class="c5">LOGRADOURO
              <input type="text" name="logradouro" placeholder="Rua do Matão">
            </label>
            <label class="c2">NÚMERO
              <input type="text" name="numero" placeholder="1010">
            </label>
            <label class="c2">COMPLEMENTO
              <input type="text" name="complemento" placeholder="Sala 45">
            </label>
            <label class="c3">BAIRRO
              <input type="text" name="bairro" placeholder="Cidade Universitária">
            </label>
            <label class="c3">CEP
              <input type="text" name="cep" data-formatar="cep" placeholder="05508-090">
            </label>
            <label class="c3">CIDADE
              <input type="text" name="cidade" placeholder="São Paulo">
            </label>
            <label class="c3">ESTADO
              <input type="text" name="estado" placeholder="SP">
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="campos">
            <label class="c3">CPF (SEPARADOS POR PONTOS E TRAÇO)
              <input type="text" name="cpf" data-formatar="cpf" placeholder="987.654.321-00">
            </label>
            <label class="c3">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
              <input type="text" name="rg" placeholder="98.765.432-1">
            </label>
            <label class="c3">NOME DO BANCO
              <input type="text" name="banco" placeholder="Caixa Econômica Federal">
            </label>
            <label class="c3">NÚMERO DA AGÊNCIA
              <input type="text" name="agencia" placeholder="5678">
            </label>
            <label class="c3">NÚMERO DA CONTA
              <input type="text" name="conta" placeholder="98765-4">
            </label>
          </div>
        </fieldset>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>
  </div>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
