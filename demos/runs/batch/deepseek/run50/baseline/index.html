<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="identidade">
      <h1>Universidade de São Paulo</h1>
      <p>Pós-Graduação do Instituto de Matemática e Estatística - IME-USP</p>
    </div>
  </header>

  <nav class="abas" role="tablist" aria-label="Formulários de solicitação">
    <button type="button" class="aba ativa" role="tab" aria-selected="true" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" role="tab" aria-selected="false" data-aba="docentes">DOCENTES</button>
  </nav>

  <main id="formularios">

    <form class="formulario" data-aba="alunos" novalidate>
      <div class="erros" hidden></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grid">
          <label class="campo c4"><span>NOME COMPLETO - SEM ABREVIAR</span>
            <input type="text" name="NOME COMPLETO - SEM ABREVIAR" placeholder="Maria Aparecida de Souza"></label>
          <label class="campo c2"><span>N. USP</span>
            <input type="text" name="N. USP" placeholder="12345678" inputmode="numeric"></label>
          <label class="campo c3"><span>PROGRAMA</span>
            <input type="text" name="PROGRAMA" placeholder="Matemática Aplicada"></label>
          <label class="campo c3"><span>NÍVEL</span>
            <select name="NÍVEL">
              <option value="" selected disabled>Selecione o nível</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select></label>

          <label class="campo c4"><span>TIPO DE AUXÍLIO</span>
            <select name="TIPO DE AUXÍLIO">
              <option value="" selected disabled>Selecione o tipo</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select></label>
          <label class="campo c4"><span>E-MAIL</span>
            <input type="email" name="E-MAIL" placeholder="maria.souza@usp.br"></label>
          <label class="campo c4"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
            <input type="text" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Congresso Brasileiro de Matemática"></label>

          <label class="campo c4"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="12 a 16 de julho de 2025"></label>
          <label class="campo c3"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Rio de Janeiro"></label>
          <label class="campo c2"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="RJ"></label>
          <label class="campo c3"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil"></label>

          <label class="campo c3"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="https://evento.exemplo.br"></label>
          <label class="campo c3"><span>VALOR SOLICITADO (R$)</span>
            <input type="text" name="VALOR SOLICITADO (R$)" placeholder="R$ 1.500,00" inputmode="numeric" data-mascara="moeda"></label>
          <label class="campo c6"><span>DETALHAMENTO DO PEDIDO</span>
            <textarea name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Passagem aérea, hospedagem e inscrição"></textarea></label>

          <label class="campo c4"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="" selected disabled>Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grid">
          <label class="campo c2"><span>DATA DE NASCIMENTO</span>
            <input type="text" name="DATA DE NASCIMENTO" placeholder="01/02/1980" inputmode="numeric" data-mascara="data"></label>
          <label class="campo c4"><span>LOGRADOURO</span>
            <input type="text" name="LOGRADOURO" placeholder="Av. Professor Luciano Gualberto"></label>
          <label class="campo c2"><span>NÚMERO</span>
            <input type="text" name="NÚMERO" placeholder="1280"></label>
          <label class="campo c4"><span>COMPLEMENTO</span>
            <input type="text" name="COMPLEMENTO" placeholder="Bloco B, apto 42"></label>

          <label class="campo c3"><span>BAIRRO</span>
            <input type="text" name="BAIRRO" placeholder="Butantã"></label>
          <label class="campo c3"><span>CEP</span>
            <input type="text" name="CEP" placeholder="05508-090" inputmode="numeric" data-mascara="cep"></label>
          <label class="campo c3"><span>CIDADE</span>
            <input type="text" name="CIDADE" placeholder="São Paulo"></label>
          <label class="campo c3"><span>ESTADO</span>
            <input type="text" name="ESTADO" placeholder="SP"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grid">
          <label class="campo c3"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" placeholder="123.456.789-09" inputmode="numeric" data-mascara="cpf"></label>
          <label class="campo c3"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9"></label>
          <label class="campo c2"><span>NOME DO BANCO</span>
            <input type="text" name="NOME DO BANCO" placeholder="Banco do Brasil"></label>
          <label class="campo c2"><span>NÚMERO DA AGÊNCIA</span>
            <input type="text" name="NÚMERO DA AGÊNCIA" placeholder="1234" inputmode="numeric"></label>
          <label class="campo c2"><span>NÚMERO DA CONTA</span>
            <input type="text" name="NÚMERO DA CONTA" placeholder="12345-6"></label>
        </div>
      </fieldset>

      <div class="barra-envio"><button type="submit" class="botao-enviar">Enviar solicitação</button></div>
    </form>

    <form class="formulario" data-aba="docentes" novalidate hidden>
      <div class="erros" hidden></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grid">

            <input type="text" name="PROGRAMA" placeholder="Matemática Aplicada"></label>
          <label class="campo c3"><span>E-MAIL</span>
            <input type="email" name="E-MAIL" placeholder="joao.oliveira@usp.br"></label>

          <label class="campo c4"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>

          <label class="campo c4"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="12 a 16 de julho de 2025"></label>
          <label class="campo c4"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Rio de Janeiro"></label>

          <label class="campo c3"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="RJ"></label>
          <label class="campo c3"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil"></label>
          <label class="campo c3"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="https://evento.exemplo.br"></label>
          <label class="campo c3"><span>VALOR SOLICITADO (R$)</span>
            <input type="text" name="VALOR SOLICITADO (R$)" placeholder="R$ 1.500,00" inputmode="numeric" data-mascara="moeda"></label>

          <label class="campo c8"><span>DETALHAMENTO DO PEDIDO</span>
            <textarea name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Passagem aérea, hospedagem e inscrição"></textarea></label>
          <label class="campo c4"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="" selected disabled>Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grid">
          <label class="campo c2"><span>DATA DE NASCIMENTO</span>
            <input type="text" name="DATA DE NASCIMENTO" placeholder="01/02/1980" inputmode="numeric" data-mascara="data"></label>
          <label class="campo c4"><span>LOGRADOURO</span>
            <input type="text" name="LOGRADOURO" placeholder="Av. Professor Luciano Gualberto"></label>
          <label class="campo c2"><span>NÚMERO</span>
            <input type="text" name="NÚMERO" placeholder="1280"></label>
          <label class="campo c4"><span>COMPLEMENTO</span>
            <input type="text" name="COMPLEMENTO" placeholder="Bloco B, apto 42"></label>

          <label class="campo c3"><span>BAIRRO</span>
            <input type="text" name="BAIRRO" placeholder="Butantã"></label>
          <label class="campo c3"><span>CEP</span>
            <input type="text" name="CEP" placeholder="05508-090" inputmode="numeric" data-mascara="cep"></label>
          <label class="campo c3"><span>CIDADE</span>
            <input type="text" name="CIDADE" placeholder="São Paulo"></label>
          <label class="campo c3"><span>ESTADO</span>
            <input type="text" name="ESTADO" placeholder="SP"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grid">
          <label class="campo c3"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" placeholder="123.456.789-09" inputmode="numeric" data-mascara="cpf"></label>
          <label class="campo c3"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9"></label>
          <label class="campo c2"><span>NOME DO BANCO</span>
            <input type="text" name="NOME DO BANCO" placeholder="Banco do Brasil"></label>
          <label class="campo c2"><span>NÚMERO DA AGÊNCIA</span>
            <input type="text" name="NÚMERO DA AGÊNCIA" placeholder="1234" inputmode="numeric"></label>
          <label class="campo c2"><span>NÚMERO DA CONTA</span>
            <input type="text" name="NÚMERO DA CONTA" placeholder="12345-6"></label>
        </div>
      </fieldset>

      <div class="barra-envio"><button type="submit" class="botao-enviar">Enviar solicitação</button></div>
    </form>

  </main>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio" class="oficio"></pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
