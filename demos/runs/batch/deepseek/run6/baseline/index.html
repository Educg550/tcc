<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identidade">
    <p class="universidade">Universidade de São Paulo</p>
    <p class="programa">Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>

<main>
<div id="painel-solicitacao">

  <nav class="abas" role="tablist" aria-label="Solicitante">
    <button type="button" class="aba ativa" role="tab" aria-selected="true" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" role="tab" aria-selected="false" data-aba="docentes">DOCENTES</button>
  </nav>

  <form class="painel ativa" data-aba="alunos" novalidate>
    <div class="erros" hidden></div>

    <fieldset class="bloco">
      <legend>SOLICITANTE E EVENTO</legend>
      <div class="grade">
        <label class="campo c3"><span>NOME COMPLETO - SEM ABREVIAR</span>
          <input type="text" name="nome" placeholder="Maria Aparecida da Silva"></label>
        <label class="campo c1"><span>N. USP</span>
          <input type="text" name="n_usp" inputmode="numeric" placeholder="12345678"></label>
        <label class="campo c2"><span>PROGRAMA</span>
          <input type="text" name="programa" placeholder="Matemática Aplicada"></label>
        <label class="campo c1"><span>NÍVEL</span>
          <select name="nivel">
            <option value="">Selecione</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select></label>
        <label class="campo c2"><span>TIPO DE AUXÍLIO</span>
          <select name="tipo_auxilio">
            <option value="">Selecione</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select></label>
        <label class="campo c3"><span>E-MAIL</span>
          <input type="email" name="email" placeholder="maria.silva@usp.br"></label>
        <label class="campo c3"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
          <input type="text" name="evento" placeholder="Congresso Brasileiro de Matemática"></label>
        <label class="campo c3"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="periodo" placeholder="21 a 26 de julho de 2024"></label>
        <label class="campo c2"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="cidade_evento" placeholder="Rio de Janeiro"></label>
        <label class="campo c2"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="estado_evento" placeholder="RJ"></label>
        <label class="campo c2"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="pais" placeholder="Brasil"></label>
        <label class="campo c2"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="link" placeholder="https://www.sbm.org.br/cbm"></label>
        <label class="campo c2"><span>VALOR SOLICITADO (R$)</span>
          <input type="text" name="valor" inputmode="numeric" placeholder="150000"></label>
        <label class="campo c2"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
          <select name="apresentacao">
            <option value="">Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select></label>
        <label class="campo c6"><span>DETALHAMENTO DO PEDIDO</span>
          <textarea name="detalhamento" placeholder="Passagens aéreas e hospedagem para apresentação de trabalho."></textarea></label>
      </div>
    </fieldset>

    <fieldset class="bloco">
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class="grade">
        <label class="campo c2"><span>DATA DE NASCIMENTO</span>
          <input type="text" name="nascimento" inputmode="numeric" placeholder="01021980"></label>
        <label class="campo c3"><span>LOGRADOURO</span>
          <input type="text" name="logradouro" placeholder="Av. Prof. Luciano Gualberto"></label>
        <label class="campo c1"><span>NÚMERO</span>
          <input type="text" name="numero" placeholder="1170"></label>
        <label class="campo c2"><span>COMPLEMENTO</span>
          <input type="text" name="complemento" placeholder="Bloco H, sala 102"></label>
        <label class="campo c2"><span>BAIRRO</span>
          <input type="text" name="bairro" placeholder="Cidade Universitária"></label>
        <label class="campo c2"><span>CEP</span>
          <input type="text" name="cep" inputmode="numeric" placeholder="05508010"></label>
        <label class="campo c3"><span>CIDADE</span>
          <input type="text" name="cidade" placeholder="São Paulo"></label>
        <label class="campo c3"><span>ESTADO</span>
          <input type="text" name="estado" placeholder="SP"></label>
      </div>
    </fieldset>

    <fieldset class="bloco">
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="grade">
        <label class="campo c2"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="cpf" inputmode="numeric" placeholder="12345678909"></label>
        <label class="campo c2"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="rg" placeholder="12.345.678-9"></label>
        <label class="campo c2"><span>NOME DO BANCO</span>
          <input type="text" name="banco" placeholder="Banco do Brasil"></label>
        <label class="campo c3"><span>NÚMERO DA AGÊNCIA</span>
          <input type="text" name="agencia" inputmode="numeric" placeholder="1234"></label>
        <label class="campo c3"><span>NÚMERO DA CONTA</span>
          <input type="text" name="conta" placeholder="12345-6"></label>
      </div>
    </fieldset>

    <div class="barra-envio"><button type="submit" class="enviar">Enviar solicitação</button></div>
  </form>

  <form class="painel" data-aba="docentes" novalidate>
    <div class="erros" hidden></div>

    <fieldset class="bloco">
      <legend>SOLICITANTE E EVENTO</legend>
      <div class="grade">
        <label class="campo c3"><span>NOME COMPLETO - SEM ABREVIAR</span>
          <input type="text" name="nome" placeholder="João Batista de Souza"></label>
        <label class="campo c1"><span>N. USP</span>
          <input type="text" name="n_usp" inputmode="numeric" placeholder="87654321"></label>
        <label class="campo c2"><span>PROGRAMA</span>
          <input type="text" name="programa" placeholder="Matemática Aplicada"></label>
        <label class="campo c3"><span>E-MAIL</span>
          <input type="email" name="email" placeholder="joao.souza@usp.br"></label>
        <label class="campo c3"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
          <input type="text" name="evento" placeholder="Congresso Brasileiro de Matemática"></label>
        <label class="campo c3"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="periodo" placeholder="21 a 26 de julho de 2024"></label>
        <label class="campo c2"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="cidade_evento" placeholder="Rio de Janeiro"></label>
        <label class="campo c2"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="estado_evento" placeholder="RJ"></label>
        <label class="campo c2"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="pais" placeholder="Brasil"></label>
        <label class="campo c2"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="link" placeholder="https://www.sbm.org.br/cbm"></label>
        <label class="campo c2"><span>VALOR SOLICITADO (R$)</span>
          <input type="text" name="valor" inputmode="numeric" placeholder="150000"></label>
        <label class="campo c2"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
          <select name="apresentacao">
            <option value="">Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select></label>
        <label class="campo c6"><span>DETALHAMENTO DO PEDIDO</span>
          <textarea name="detalhamento" placeholder="Passagens aéreas e hospedagem para participação em banca."></textarea></label>
      </div>
    </fieldset>

    <fieldset class="bloco">
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class="grade">
        <label class="campo c2"><span>DATA DE NASCIMENTO</span>
          <input type="text" name="nascimento" inputmode="numeric" placeholder="01021980"></label>
        <label class="campo c3"><span>LOGRADOURO</span>
          <input type="text" name="logradouro" placeholder="Av. Prof. Luciano Gualberto"></label>
        <label class="campo c1"><span>NÚMERO</span>
          <input type="text" name="numero" placeholder="1170"></label>
        <label class="campo c2"><span>COMPLEMENTO</span>
          <input type="text" name="complemento" placeholder="Bloco H, sala 102"></label>
        <label class="campo c2"><span>BAIRRO</span>
          <input type="text" name="bairro" placeholder="Cidade Universitária"></label>
        <label class="campo c2"><span>CEP</span>
          <input type="text" name="cep" inputmode="numeric" placeholder="05508010"></label>
        <label class="campo c3"><span>CIDADE</span>
          <input type="text" name="cidade" placeholder="São Paulo"></label>
        <label class="campo c3"><span>ESTADO</span>
          <input type="text" name="estado" placeholder="SP"></label>
      </div>
    </fieldset>

    <fieldset class="bloco">
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="grade">
        <label class="campo c2"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="cpf" inputmode="numeric" placeholder="12345678909"></label>
        <label class="campo c2"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="rg" placeholder="12.345.678-9"></label>
        <label class="campo c2"><span>NOME DO BANCO</span>
          <input type="text" name="banco" placeholder="Banco do Brasil"></label>
        <label class="campo c3"><span>NÚMERO DA AGÊNCIA</span>
          <input type="text" name="agencia" inputmode="numeric" placeholder="1234"></label>
        <label class="campo c3"><span>NÚMERO DA CONTA</span>
          <input type="text" name="conta" placeholder="12345-6"></label>
      </div>
    </fieldset>

    <div class="barra-envio"><button type="submit" class="enviar">Enviar solicitação</button></div>
  </form>

</div>

<section id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <pre id="oficio"></pre>
</section>
</main>

<script src="app.js"></script>
</body>
</html>
