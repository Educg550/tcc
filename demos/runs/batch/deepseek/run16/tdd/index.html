<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identidade">
    <h1>Universidade de São Paulo</h1>
    <p class="programa">Programa de Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>
<main>
  <div id="area-formularios">
    <nav class="abas">
      <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
      <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
    </nav>

    <form class="painel ativo" data-aba="alunos">
      <div class="erros" role="alert"></div>
      <section class="bloco">
        <h2>SOLICITANTE E EVENTO</h2>
        <div class="grade">
          <div class="campo col-2">
            <label for="al-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="al-nome" name="nome" type="text" placeholder="Ex.: Maria Aparecida de Souza">
          </div>
          <div class="campo">
            <label for="al-nusp">N. USP</label>
            <input id="al-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="Ex.: 12345678">
          </div>
          <div class="campo">
            <label for="al-programa">PROGRAMA</label>
            <input id="al-programa" name="programa" type="text" placeholder="Ex.: Matemática Aplicada">
          </div>
          <div class="campo">
            <label for="al-nivel">NÍVEL</label>
            <select id="al-nivel" name="nivel">
              <option value="">Selecione</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class="campo">
            <label for="al-tipo">TIPO DE AUXÍLIO</label>
            <select id="al-tipo" name="tipo_auxilio">
              <option value="">Selecione</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>
          <div class="campo">
            <label for="al-email">E-MAIL</label>
            <input id="al-email" name="email" type="email" placeholder="Ex.: maria.souza@usp.br">
          </div>
          <div class="campo col-2">
            <label for="al-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="al-evento" name="evento" type="text" placeholder="Ex.: Congresso Brasileiro de Matemática">
          </div>
          <div class="campo col-2">
            <label for="al-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="al-periodo" name="periodo" type="text" placeholder="Ex.: 20/07/2024 a 25/07/2024">
          </div>
          <div class="campo">
            <label for="al-cidadeev">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="al-cidadeev" name="cidade_evento" type="text" placeholder="Ex.: Belo Horizonte">
          </div>
          <div class="campo">
            <label for="al-estadoev">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="al-estadoev" name="estado_evento" type="text" placeholder="Ex.: MG">
          </div>
          <div class="campo">
            <label for="al-paisev">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="al-paisev" name="pais_evento" type="text" placeholder="Ex.: Brasil">
          </div>
          <div class="campo">
            <label for="al-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="al-link" name="link" type="text" placeholder="Ex.: https://evento.exemplo.org">
          </div>
          <div class="campo">
            <label for="al-valor">VALOR SOLICITADO (R$)</label>
            <input id="al-valor" name="valor" type="text" inputmode="numeric" placeholder="Ex.: 1.500,00">
          </div>
          <div class="campo col-2">
            <label for="al-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="al-detalhamento" name="detalhamento" rows="2" placeholder="Ex.: Passagens aéreas e hospedagem"></textarea>
          </div>
          <div class="campo col-2">
            <label for="al-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="al-apresentacao" name="apresentacao">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="grade">
          <div class="campo">
            <label for="al-nasc">DATA DE NASCIMENTO</label>
            <input id="al-nasc" name="data_nascimento" type="text" inputmode="numeric" placeholder="Ex.: 01/02/1980">
          </div>
          <div class="campo col-2">
            <label for="al-logradouro">LOGRADOURO</label>
            <input id="al-logradouro" name="logradouro" type="text" placeholder="Ex.: Rua do Matão">
          </div>
          <div class="campo">
            <label for="al-numero">NÚMERO</label>
            <input id="al-numero" name="numero" type="text" placeholder="Ex.: 1010">
          </div>
          <div class="campo">
            <label for="al-complemento">COMPLEMENTO</label>
            <input id="al-complemento" name="complemento" type="text" placeholder="Ex.: Bloco B, apto 42">
          </div>
          <div class="campo">
            <label for="al-bairro">BAIRRO</label>
            <input id="al-bairro" name="bairro" type="text" placeholder="Ex.: Butantã">
          </div>
          <div class="campo">
            <label for="al-cep">CEP</label>
            <input id="al-cep" name="cep" type="text" inputmode="numeric" placeholder="Ex.: 05508-090">
          </div>
          <div class="campo">
            <label for="al-cidade">CIDADE</label>
            <input id="al-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo">
            <label for="al-estado">ESTADO</label>
            <input id="al-estado" name="estado" type="text" placeholder="Ex.: SP">
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="grade">
          <div class="campo col-2">
            <label for="al-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="al-cpf" name="cpf" type="text" inputmode="numeric" placeholder="Ex.: 123.456.789-09">
          </div>
          <div class="campo col-2">
            <label for="al-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="al-rg" name="rg" type="text" placeholder="Ex.: 12.345.678-9">
          </div>
          <div class="campo">
            <label for="al-banco">NOME DO BANCO</label>
            <input id="al-banco" name="banco" type="text" placeholder="Ex.: Banco do Brasil">
          </div>
          <div class="campo">
            <label for="al-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="al-agencia" name="agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234">
          </div>
          <div class="campo col-2">
            <label for="al-conta">NÚMERO DA CONTA</label>
            <input id="al-conta" name="conta" type="text" placeholder="Ex.: 12345-6">
          </div>
        </div>
      </section>
      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>

    <form class="painel" data-aba="docentes">
      <div class="erros" role="alert"></div>
      <section class="bloco">
        <h2>SOLICITANTE E EVENTO</h2>
        <div class="grade">
          <div class="campo col-2">
            <label for="do-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="do-nome" name="nome" type="text" placeholder="Ex.: João Carlos de Oliveira">
          </div>
          <div class="campo">
            <label for="do-nusp">N. USP</label>
            <input id="do-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="Ex.: 87654321">
          </div>
          <div class="campo">
            <label for="do-programa">PROGRAMA</label>
            <input id="do-programa" name="programa" type="text" placeholder="Ex.: Ciência da Computação">
          </div>
          <div class="campo">
            <label for="do-email">E-MAIL</label>
            <input id="do-email" name="email" type="email" placeholder="Ex.: joao.oliveira@usp.br">
          </div>
          <div class="campo col-2">
            <label for="do-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="do-evento" name="evento" type="text" placeholder="Ex.: Simpósio Brasileiro de Pesquisa Operacional">
          </div>
          <div class="campo col-2">
            <label for="do-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="do-periodo" name="periodo" type="text" placeholder="Ex.: 10/09/2024 a 13/09/2024">
          </div>
          <div class="campo">
            <label for="do-cidadeev">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="do-cidadeev" name="cidade_evento" type="text" placeholder="Ex.: Florianópolis">
          </div>
          <div class="campo">
            <label for="do-estadoev">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="do-estadoev" name="estado_evento" type="text" placeholder="Ex.: SC">
          </div>
          <div class="campo">
            <label for="do-paisev">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="do-paisev" name="pais_evento" type="text" placeholder="Ex.: Brasil">
          </div>
          <div class="campo">
            <label for="do-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="do-link" name="link" type="text" placeholder="Ex.: https://evento.exemplo.org">
          </div>
          <div class="campo">
            <label for="do-valor">VALOR SOLICITADO (R$)</label>
            <input id="do-valor" name="valor" type="text" inputmode="numeric" placeholder="Ex.: 2.300,00">
          </div>
          <div class="campo col-2">
            <label for="do-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="do-detalhamento" name="detalhamento" rows="2" placeholder="Ex.: Diárias e taxa de inscrição"></textarea>
          </div>
          <div class="campo col-2">
            <label for="do-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="do-apresentacao" name="apresentacao">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="grade">
          <div class="campo">
            <label for="do-nasc">DATA DE NASCIMENTO</label>
            <input id="do-nasc" name="data_nascimento" type="text" inputmode="numeric" placeholder="Ex.: 15/03/1975">
          </div>
          <div class="campo col-2">
            <label for="do-logradouro">LOGRADOURO</label>
            <input id="do-logradouro" name="logradouro" type="text" placeholder="Ex.: Avenida Professor Luciano Gualberto">
          </div>
          <div class="campo">
            <label for="do-numero">NÚMERO</label>
            <input id="do-numero" name="numero" type="text" placeholder="Ex.: 128">
          </div>
          <div class="campo">
            <label for="do-complemento">COMPLEMENTO</label>
            <input id="do-complemento" name="complemento" type="text" placeholder="Ex.: Sala 205">
          </div>
          <div class="campo">
            <label for="do-bairro">BAIRRO</label>
            <input id="do-bairro" name="bairro" type="text" placeholder="Ex.: Butantã">
          </div>
          <div class="campo">
            <label for="do-cep">CEP</label>
            <input id="do-cep" name="cep" type="text" inputmode="numeric" placeholder="Ex.: 05508-900">
          </div>
          <div class="campo">
            <label for="do-cidade">CIDADE</label>
            <input id="do-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo">
            <label for="do-estado">ESTADO</label>
            <input id="do-estado" name="estado" type="text" placeholder="Ex.: SP">
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="grade">
          <div class="campo col-2">
            <label for="do-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="do-cpf" name="cpf" type="text" inputmode="numeric" placeholder="Ex.: 529.982.247-25">
          </div>
          <div class="campo col-2">
            <label for="do-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="do-rg" name="rg" type="text" placeholder="Ex.: 98.765.432-1">
          </div>
          <div class="campo">
            <label for="do-banco">NOME DO BANCO</label>
            <input id="do-banco" name="banco" type="text" placeholder="Ex.: Caixa Econômica Federal">
          </div>
          <div class="campo">
            <label for="do-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="do-agencia" name="agencia" type="text" inputmode="numeric" placeholder="Ex.: 3123">
          </div>
          <div class="campo col-2">
            <label for="do-conta">NÚMERO DA CONTA</label>
            <input id="do-conta" name="conta" type="text" placeholder="Ex.: 45678-9">
          </div>
        </div>
      </section>
      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </div>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
