<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <div class="logotipo">
      <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    </div>
    <div class="identidade">
      <h1>Universidade de São Paulo</h1>
      <p>Programa de Pós-Graduação - Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <div id="app-formulario">
    <nav class="abas" role="tablist" aria-label="Formulários de solicitação de auxílio">
      <button type="button" class="aba ativa" id="aba-alunos" role="tab" aria-selected="true" aria-controls="painel-alunos">ALUNOS</button>
      <button type="button" class="aba" id="aba-docentes" role="tab" aria-selected="false" aria-controls="painel-docentes">DOCENTES</button>
    </nav>

    <main>
      <section class="painel" id="painel-alunos" role="tabpanel" aria-labelledby="aba-alunos">
        <form id="form-alunos" data-aba="alunos" novalidate>
          <p class="erros" hidden></p>

          <fieldset>
            <legend>SOLICITANTE E EVENTO</legend>
            <div class="grade">
              <div class="campo">
                <label for="al-nome">NOME COMPLETO - SEM ABREVIAR</label>
                <input id="al-nome" name="nome" type="text" placeholder="Maria Aparecida da Silva">
              </div>
              <div class="campo">
                <label for="al-n-usp">N. USP</label>
                <input id="al-n-usp" name="n_usp" type="text" inputmode="numeric" placeholder="12345678">
              </div>
              <div class="campo">
                <label for="al-programa">PROGRAMA</label>
                <input id="al-programa" name="programa" type="text" placeholder="Ciência da Computação">
              </div>
              <div class="campo">
                <label for="al-nivel">NÍVEL</label>
                <select id="al-nivel" name="nivel">
                  <option value="">Selecione</option>
                  <option>Mestrado</option>
                  <option>Doutorado</option>
                </select>
              </div>
              <div class="campo">
                <label for="al-tipo">TIPO DE AUXÍLIO</label>
                <select id="al-tipo" name="tipo_auxilio">
                  <option value="">Selecione</option>
                  <option>Participação em evento</option>
                  <option>Banca de exame ou defesa</option>
                  <option>Outro</option>
                </select>
              </div>
              <div class="campo">
                <label for="al-email">E-MAIL</label>
                <input id="al-email" name="email" type="email" placeholder="maria.silva@usp.br">
              </div>
              <div class="campo largo">
                <label for="al-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
                <input id="al-evento" name="evento" type="text" placeholder="Congresso Brasileiro de Computação">
              </div>
              <div class="campo largo">
                <label for="al-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
                <input id="al-periodo" name="periodo" type="text" placeholder="10 a 14 de novembro de 2025">
              </div>
              <div class="campo">
                <label for="al-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
                <input id="al-cidade-evento" name="cidade_evento" type="text" placeholder="São Paulo">
              </div>
              <div class="campo">
                <label for="al-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
                <input id="al-estado-evento" name="estado_evento" type="text" placeholder="SP">
              </div>
              <div class="campo">
                <label for="al-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
                <input id="al-pais-evento" name="pais_evento" type="text" placeholder="Brasil">
              </div>
              <div class="campo largo">
                <label for="al-link">LINK DO EVENTO, EXAME OU DEFESA</label>
                <input id="al-link" name="link_evento" type="text" placeholder="https://evento.exemplo.br">
              </div>
              <div class="campo">
                <label for="al-valor">VALOR SOLICITADO (R$)</label>
                <input id="al-valor" name="valor" type="text" inputmode="numeric" placeholder="150000">
              </div>
              <div class="campo largo">
                <label for="al-detalhamento">DETALHAMENTO DO PEDIDO</label>
                <textarea id="al-detalhamento" name="detalhamento" rows="2" placeholder="Passagem aérea, hospedagem e taxa de inscrição"></textarea>
              </div>
              <div class="campo largo">
                <label for="al-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
                <select id="al-apresentacao" name="apresentacao">
                  <option value="">Selecione</option>
                  <option>Pôster</option>
                  <option>Apresentação oral</option>
                  <option>Outra</option>
                  <option>Não irá apresentar trabalho</option>
                </select>
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>ENDEREÇO DO SOLICITANTE</legend>
            <div class="grade">
              <div class="campo">
                <label for="al-nascimento">DATA DE NASCIMENTO</label>
                <input id="al-nascimento" name="data_nascimento" type="text" inputmode="numeric" placeholder="01021980">
              </div>
              <div class="campo largo">
                <label for="al-logradouro">LOGRADOURO</label>
                <input id="al-logradouro" name="logradouro" type="text" placeholder="Rua do Matão">
              </div>
              <div class="campo">
                <label for="al-numero">NÚMERO</label>
                <input id="al-numero" name="numero" type="text" placeholder="1010">
              </div>
              <div class="campo largo">
                <label for="al-complemento">COMPLEMENTO</label>
                <input id="al-complemento" name="complemento" type="text" placeholder="Bloco B, ap. 32">
              </div>
              <div class="campo">
                <label for="al-bairro">BAIRRO</label>
                <input id="al-bairro" name="bairro" type="text" placeholder="Butantã">
              </div>
              <div class="campo">
                <label for="al-cep">CEP</label>
                <input id="al-cep" name="cep" type="text" inputmode="numeric" placeholder="05508090">
              </div>
              <div class="campo">
                <label for="al-cidade">CIDADE</label>
                <input id="al-cidade" name="cidade" type="text" placeholder="São Paulo">
              </div>
              <div class="campo">
                <label for="al-estado">ESTADO</label>
                <input id="al-estado" name="estado" type="text" placeholder="SP">
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
            <div class="grade">
              <div class="campo largo">
                <label for="al-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
                <input id="al-cpf" name="cpf" type="text" inputmode="numeric" placeholder="12345678909">
              </div>
              <div class="campo largo">
                <label for="al-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
                <input id="al-rg" name="rg" type="text" placeholder="12.345.678-9">
              </div>
              <div class="campo largo">
                <label for="al-banco">NOME DO BANCO</label>
                <input id="al-banco" name="banco" type="text" placeholder="Banco do Brasil">
              </div>
              <div class="campo">
                <label for="al-agencia">NÚMERO DA AGÊNCIA</label>
                <input id="al-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234">
              </div>
              <div class="campo">
                <label for="al-conta">NÚMERO DA CONTA</label>
                <input id="al-conta" name="conta" type="text" placeholder="12345-6">
              </div>
            </div>
          </fieldset>

          <button type="submit">Enviar solicitação</button>
        </form>
      </section>

      <section class="painel" id="painel-docentes" role="tabpanel" aria-labelledby="aba-docentes" hidden>
        <form id="form-docentes" data-aba="docentes" novalidate>
          <p class="erros" hidden></p>

          <fieldset>

              <div class="campo">

                <input id="dc-programa" name="programa" type="text" placeholder="Ciência da Computação">

              <div class="campo">
                <label for="dc-email">E-MAIL</label>
                <input id="dc-email" name="email" type="email" placeholder="joao.oliveira@usp.br">
              </div>
              <div class="campo largo">
                <label for="dc-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>

              <div class="campo largo">

              </div>
              <div class="campo">

                <input id="dc-cidade-evento" name="cidade_evento" type="text" placeholder="São Paulo">
              </div>
              <div class="campo">
                <label for="dc-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
                <input id="dc-estado-evento" name="estado_evento" type="text" placeholder="SP">
              </div>
              <div class="campo">
                <label for="dc-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
                <input id="dc-pais-evento" name="pais_evento" type="text" placeholder="Brasil">
              </div>
              <div class="campo largo">

                <input id="dc-link" name="link_evento" type="text" placeholder="https://evento.exemplo.br">
              </div>
              <div class="campo">
                <label for="dc-valor">VALOR SOLICITADO (R$)</label>
                <input id="dc-valor" name="valor" type="text" inputmode="numeric" placeholder="150000">
              </div>
              <div class="campo largo">
                <label for="dc-detalhamento">DETALHAMENTO DO PEDIDO</label>

              </div>
              <div class="campo largo">
                <label for="dc-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
                <select id="dc-apresentacao" name="apresentacao">
                  <option value="">Selecione</option>
                  <option>Pôster</option>
                  <option>Apresentação oral</option>
                  <option>Outra</option>
                  <option>Não irá apresentar trabalho</option>
                </select>
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>ENDEREÇO DO SOLICITANTE</legend>
            <div class="grade">
              <div class="campo">
                <label for="dc-nascimento">DATA DE NASCIMENTO</label>
                <input id="dc-nascimento" name="data_nascimento" type="text" inputmode="numeric" placeholder="01021980">
              </div>
              <div class="campo largo">
                <label for="dc-logradouro">LOGRADOURO</label>
                <input id="dc-logradouro" name="logradouro" type="text" placeholder="Rua do Matão">
              </div>
              <div class="campo">
                <label for="dc-numero">NÚMERO</label>
                <input id="dc-numero" name="numero" type="text" placeholder="1010">
              </div>
              <div class="campo largo">
                <label for="dc-complemento">COMPLEMENTO</label>
                <input id="dc-complemento" name="complemento" type="text" placeholder="Bloco B, ap. 32">
              </div>
              <div class="campo">
                <label for="dc-bairro">BAIRRO</label>
                <input id="dc-bairro" name="bairro" type="text" placeholder="Butantã">
              </div>
              <div class="campo">
                <label for="dc-cep">CEP</label>
                <input id="dc-cep" name="cep" type="text" inputmode="numeric" placeholder="05508090">
              </div>
              <div class="campo">
                <label for="dc-cidade">CIDADE</label>
                <input id="dc-cidade" name="cidade" type="text" placeholder="São Paulo">
              </div>
              <div class="campo">
                <label for="dc-estado">ESTADO</label>
                <input id="dc-estado" name="estado" type="text" placeholder="SP">
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
            <div class="grade">
              <div class="campo largo">
                <label for="dc-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
                <input id="dc-cpf" name="cpf" type="text" inputmode="numeric" placeholder="12345678909">
              </div>
              <div class="campo largo">
                <label for="dc-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
                <input id="dc-rg" name="rg" type="text" placeholder="12.345.678-9">
              </div>
              <div class="campo largo">
                <label for="dc-banco">NOME DO BANCO</label>
                <input id="dc-banco" name="banco" type="text" placeholder="Banco do Brasil">
              </div>
              <div class="campo">
                <label for="dc-agencia">NÚMERO DA AGÊNCIA</label>
                <input id="dc-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234">
              </div>
              <div class="campo">
                <label for="dc-conta">NÚMERO DA CONTA</label>
                <input id="dc-conta" name="conta" type="text" placeholder="12345-6">
              </div>
            </div>
          </fieldset>

          <button type="submit">Enviar solicitação</button>
        </form>
      </section>
    </main>
  </div>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
