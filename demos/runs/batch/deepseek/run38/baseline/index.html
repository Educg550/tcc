<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identidade">
    <p class="universidade">Universidade de São Paulo</p>
    <p class="programa">Programa de Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>

<div id="app">
  <nav class="abas" role="tablist" aria-label="Formulários de solicitação de auxílio">
    <button type="button" class="aba ativa" data-aba="alunos" role="tab" aria-selected="true">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes" role="tab" aria-selected="false">DOCENTES</button>
  </nav>

  <main>
    <form id="form-alunos" class="formulario" novalidate>
      <div class="erros" id="erros-alunos" role="alert" hidden></div>

      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade grade-evento">
          <label class="campo span-3">
            <span class="rotulo">NOME COMPLETO - SEM ABREVIAR</span>
            <input type="text" name="nome_completo" placeholder="Maria Aparecida de Souza Santos" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">N. USP</span>
            <input type="text" name="n_usp" inputmode="numeric" placeholder="12345678" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">PROGRAMA</span>
            <input type="text" name="programa" placeholder="Matemática Aplicada" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">NÍVEL</span>
            <select name="nivel" required>
              <option value="">Selecione</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </label>
          <label class="campo span-2">
            <span class="rotulo">TIPO DE AUXÍLIO</span>
            <select name="tipo_auxilio" required>
              <option value="">Selecione</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </label>
          <label class="campo span-3">
            <span class="rotulo">E-MAIL</span>
            <input type="text" name="email" placeholder="maria.santos@usp.br" required>
          </label>
          <label class="campo span-3">
            <span class="rotulo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
            <input type="text" name="nome_evento" placeholder="Congresso Brasileiro de Matemática" required>
          </label>
          <label class="campo span-3">
            <span class="rotulo">PERÍODO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="periodo" placeholder="21 a 25 de julho de 2025" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="cidade_evento" placeholder="Rio de Janeiro" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="estado_evento" placeholder="RJ" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="pais_evento" placeholder="Brasil" required>
          </label>
          <label class="campo span-3">
            <span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="link_evento" placeholder="https://www.sbm.org.br/cbm">
          </label>
          <label class="campo span-1">
            <span class="rotulo">VALOR SOLICITADO (R$)</span>
            <input type="text" name="valor" inputmode="numeric" placeholder="R$ 1.500,00" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="apresentacao" required>
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </label>
          <label class="campo span-6">
            <span class="rotulo">DETALHAMENTO DO PEDIDO</span>
            <textarea name="detalhamento" rows="2" placeholder="Passagem aérea e hospedagem para o evento." required></textarea>
          </label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade grade-endereco">
          <label class="campo span-1">
            <span class="rotulo">DATA DE NASCIMENTO</span>
            <input type="text" name="data_nascimento" inputmode="numeric" placeholder="01/02/1980" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">LOGRADOURO</span>
            <input type="text" name="logradouro" placeholder="Rua do Matão" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">NÚMERO</span>
            <input type="text" name="numero" placeholder="1010" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">COMPLEMENTO</span>
            <input type="text" name="complemento" placeholder="Bloco B, sala 245">
          </label>
          <label class="campo span-1">
            <span class="rotulo">BAIRRO</span>
            <input type="text" name="bairro" placeholder="Cidade Universitária" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">CEP</span>
            <input type="text" name="cep" inputmode="numeric" placeholder="05508-090" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">CIDADE</span>
            <input type="text" name="cidade" placeholder="São Paulo" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">ESTADO</span>
            <input type="text" name="estado" placeholder="SP" required>
          </label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade grade-pagamento">
          <label class="campo span-1">
            <span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="cpf" inputmode="numeric" placeholder="123.456.789-09" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="rg" placeholder="12.345.678-9" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">NOME DO BANCO</span>
            <input type="text" name="banco" placeholder="Banco do Brasil" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">NÚMERO DA AGÊNCIA</span>
            <input type="text" name="agencia" inputmode="numeric" placeholder="1234" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">NÚMERO DA CONTA</span>
            <input type="text" name="conta" placeholder="12345-6" required>
          </label>
        </div>
      </fieldset>

      <button class="botao-enviar" type="submit">Enviar solicitação</button>
    </form>

    <form id="form-docentes" class="formulario" novalidate hidden>
      <div class="erros" id="erros-docentes" role="alert" hidden></div>

      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade grade-evento">
          <label class="campo span-3">

          </label>
          <label class="campo span-1">

            <input type="text" name="n_usp" inputmode="numeric" placeholder="12345678" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">PROGRAMA</span>
            <input type="text" name="programa" placeholder="Matemática Aplicada" required>
          </label>
          <label class="campo span-3">
            <span class="rotulo">E-MAIL</span>
            <input type="text" name="email" placeholder="joao.silva@usp.br" required>
          </label>
          <label class="campo span-3">

            <input type="text" name="nome_evento" placeholder="Congresso Brasileiro de Matemática" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">PERÍODO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="periodo" placeholder="21 a 25 de julho de 2025" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="cidade_evento" placeholder="Rio de Janeiro" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="estado_evento" placeholder="RJ" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="pais_evento" placeholder="Brasil" required>
          </label>
          <label class="campo span-3">
            <span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>
            <input type="text" name="link_evento" placeholder="https://www.sbm.org.br/cbm">
          </label>
          <label class="campo span-1">
            <span class="rotulo">VALOR SOLICITADO (R$)</span>
            <input type="text" name="valor" inputmode="numeric" placeholder="R$ 1.500,00" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
            <select name="apresentacao" required>
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </label>
          <label class="campo span-6">
            <span class="rotulo">DETALHAMENTO DO PEDIDO</span>
            <textarea name="detalhamento" rows="2" placeholder="Passagem aérea e hospedagem para o evento." required></textarea>
          </label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade grade-endereco">
          <label class="campo span-1">
            <span class="rotulo">DATA DE NASCIMENTO</span>
            <input type="text" name="data_nascimento" inputmode="numeric" placeholder="01/02/1980" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">LOGRADOURO</span>
            <input type="text" name="logradouro" placeholder="Rua do Matão" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">NÚMERO</span>
            <input type="text" name="numero" placeholder="1010" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">COMPLEMENTO</span>
            <input type="text" name="complemento" placeholder="Bloco B, sala 245">
          </label>
          <label class="campo span-1">
            <span class="rotulo">BAIRRO</span>
            <input type="text" name="bairro" placeholder="Cidade Universitária" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">CEP</span>
            <input type="text" name="cep" inputmode="numeric" placeholder="05508-090" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">CIDADE</span>
            <input type="text" name="cidade" placeholder="São Paulo" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">ESTADO</span>
            <input type="text" name="estado" placeholder="SP" required>
          </label>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade grade-pagamento">
          <label class="campo span-1">
            <span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="cpf" inputmode="numeric" placeholder="123.456.789-09" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
            <input type="text" name="rg" placeholder="12.345.678-9" required>
          </label>
          <label class="campo span-2">
            <span class="rotulo">NOME DO BANCO</span>
            <input type="text" name="banco" placeholder="Banco do Brasil" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">NÚMERO DA AGÊNCIA</span>
            <input type="text" name="agencia" inputmode="numeric" placeholder="1234" required>
          </label>
          <label class="campo span-1">
            <span class="rotulo">NÚMERO DA CONTA</span>
            <input type="text" name="conta" placeholder="12345-6" required>
          </label>
        </div>
      </fieldset>

      <button class="botao-enviar" type="submit">Enviar solicitação</button>
    </form>
  </main>
</div>

<section id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <pre id="oficio"></pre>
</section>

<script src="app.js"></script>
</body>
</html>
