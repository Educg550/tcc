<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
<img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
<div class="titulos">
<h1>Universidade de São Paulo</h1>
<p>Pós-Graduação do Instituto de Matemática e Estatística</p>
</div>
</header>
<nav class="abas" aria-label="Escolha do formulário">
<button type="button" class="aba active" data-aba="alunos" aria-selected="true">ALUNOS</button>
<button type="button" class="aba" data-aba="docentes" aria-selected="false">DOCENTES</button>
</nav>
<main id="formularios">
<section class="painel" data-painel="alunos">
<form id="form-alunos" novalidate>
<input type="hidden" name="aba" value="alunos">
<div class="erros" hidden></div>
<fieldset>
<legend>SOLICITANTE E EVENTO</legend>
<div class="campo"><label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label><input id="a-nome" name="nome" type="text" placeholder="Ex.: Maria Aparecida de Souza"></div>
<div class="campo curto"><label for="a-n_usp">N. USP</label><input id="a-n_usp" name="n_usp" type="text" inputmode="numeric" placeholder="Ex.: 12345678"></div>
<div class="campo"><label for="a-programa">PROGRAMA</label><input id="a-programa" name="programa" type="text" placeholder="Ex.: Ciência da Computação"></div>
<div class="campo curto"><label for="a-nivel">NÍVEL</label><select id="a-nivel" name="nivel"><option value="">Selecione</option><option>Mestrado</option><option>Doutorado</option></select></div>
<div class="campo"><label for="a-tipo_auxilio">TIPO DE AUXÍLIO</label><select id="a-tipo_auxilio" name="tipo_auxilio"><option value="">Selecione</option><option>Participação em evento</option><option>Banca de exame ou defesa</option><option>Outro</option></select></div>
<div class="campo"><label for="a-email">E-MAIL</label><input id="a-email" name="email" type="text" placeholder="Ex.: maria.souza@usp.br"></div>
<div class="campo largo"><label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label><input id="a-evento" name="evento" type="text" placeholder="Ex.: Congresso Brasileiro de Computação"></div>
<div class="campo"><label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label><input id="a-periodo" name="periodo" type="text" placeholder="Ex.: 10/10/2024 a 12/10/2024"></div>
<div class="campo curto"><label for="a-cidade_evento">CIDADE DO EVENTO, EXAME OU DEFESA</label><input id="a-cidade_evento" name="cidade_evento" type="text" placeholder="Ex.: Campinas"></div>
<div class="campo curto"><label for="a-estado_evento">ESTADO DO EVENTO, EXAME OU DEFESA</label><input id="a-estado_evento" name="estado_evento" type="text" placeholder="Ex.: SP"></div>
<div class="campo curto"><label for="a-pais_evento">PAÍS DO EVENTO, EXAME OU DEFESA</label><input id="a-pais_evento" name="pais_evento" type="text" placeholder="Ex.: Brasil"></div>
<div class="campo"><label for="a-link_evento">LINK DO EVENTO, EXAME OU DEFESA</label><input id="a-link_evento" name="link_evento" type="text" placeholder="Ex.: https://evento.exemplo.br"></div>
<div class="campo curto"><label for="a-valor">VALOR SOLICITADO (R$)</label><input id="a-valor" name="valor" type="text" inputmode="numeric" placeholder="Ex.: R$ 1.500,00"></div>
<div class="campo largo"><label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label><textarea id="a-detalhamento" name="detalhamento" rows="2" placeholder="Ex.: Passagens aéreas e hospedagem."></textarea></div>
<div class="campo largo"><label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label><select id="a-apresentacao" name="apresentacao"><option value="">Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></div>
</fieldset>
<fieldset>
<legend>ENDEREÇO DO SOLICITANTE</legend>
<div class="campo curto"><label for="a-data_nascimento">DATA DE NASCIMENTO</label><input id="a-data_nascimento" name="data_nascimento" type="text" inputmode="numeric" placeholder="Ex.: 01/02/1980"></div>
<div class="campo"><label for="a-logradouro">LOGRADOURO</label><input id="a-logradouro" name="logradouro" type="text" placeholder="Ex.: Rua do Matão"></div>
<div class="campo curto"><label for="a-numero">NÚMERO</label><input id="a-numero" name="numero" type="text" placeholder="Ex.: 1010"></div>
<div class="campo curto"><label for="a-complemento">COMPLEMENTO</label><input id="a-complemento" name="complemento" type="text" placeholder="Ex.: Bloco B"></div>
<div class="campo"><label for="a-bairro">BAIRRO</label><input id="a-bairro" name="bairro" type="text" placeholder="Ex.: Butantã"></div>
<div class="campo curto"><label for="a-cep">CEP</label><input id="a-cep" name="cep" type="text" inputmode="numeric" placeholder="Ex.: 05508-090"></div>
<div class="campo"><label for="a-cidade">CIDADE</label><input id="a-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo"></div>
<div class="campo curto"><label for="a-estado">ESTADO</label><input id="a-estado" name="estado" type="text" placeholder="Ex.: SP"></div>
</fieldset>
<fieldset>
<legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
<div class="campo"><label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label><input id="a-cpf" name="cpf" type="text" inputmode="numeric" placeholder="Ex.: 123.456.789-09"></div>
<div class="campo"><label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label><input id="a-rg" name="rg" type="text" placeholder="Ex.: 12.345.678-9"></div>
<div class="campo"><label for="a-banco">NOME DO BANCO</label><input id="a-banco" name="banco" type="text" placeholder="Ex.: Banco do Brasil"></div>
<div class="campo curto"><label for="a-agencia">NÚMERO DA AGÊNCIA</label><input id="a-agencia" name="agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234"></div>
<div class="campo"><label for="a-conta">NÚMERO DA CONTA</label><input id="a-conta" name="conta" type="text" placeholder="Ex.: 12345-6"></div>
</fieldset>
<button type="submit">Enviar solicitação</button>
</form>
</section>
<section class="painel" data-painel="docentes" hidden>
<form id="form-docentes" novalidate>
<input type="hidden" name="aba" value="docentes">
<div class="erros" hidden></div>

<div class="campo largo"><label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label><select id="d-apresentacao" name="apresentacao"><option value="">Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></div>
</fieldset>
<fieldset>

<div class="campo curto"><label for="d-data_nascimento">DATA DE NASCIMENTO</label><input id="d-data_nascimento" name="data_nascimento" type="text" inputmode="numeric" placeholder="Ex.: 01/02/1980"></div>
<div class="campo"><label for="d-logradouro">LOGRADOURO</label><input id="d-logradouro" name="logradouro" type="text" placeholder="Ex.: Rua do Matão"></div>
<div class="campo curto"><label for="d-numero">NÚMERO</label><input id="d-numero" name="numero" type="text" placeholder="Ex.: 1010"></div>
<div class="campo curto"><label for="d-complemento">COMPLEMENTO</label><input id="d-complemento" name="complemento" type="text" placeholder="Ex.: Bloco B"></div>
<div class="campo"><label for="d-bairro">BAIRRO</label><input id="d-bairro" name="bairro" type="text" placeholder="Ex.: Butantã"></div>
<div class="campo curto"><label for="d-cep">CEP</label><input id="d-cep" name="cep" type="text" inputmode="numeric" placeholder="Ex.: 05508-090"></div>
<div class="campo"><label for="d-cidade">CIDADE</label><input id="d-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo"></div>
<div class="campo curto"><label for="d-estado">ESTADO</label><input id="d-estado" name="estado" type="text" placeholder="Ex.: SP"></div>
</fieldset>
<fieldset>
<legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
<div class="campo"><label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label><input id="d-cpf" name="cpf" type="text" inputmode="numeric" placeholder="Ex.: 123.456.789-09"></div>
<div class="campo"><label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label><input id="d-rg" name="rg" type="text" placeholder="Ex.: 12.345.678-9"></div>
<div class="campo"><label for="d-banco">NOME DO BANCO</label><input id="d-banco" name="banco" type="text" placeholder="Ex.: Banco do Brasil"></div>
<div class="campo curto"><label for="d-agencia">NÚMERO DA AGÊNCIA</label><input id="d-agencia" name="agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234"></div>
<div class="campo"><label for="d-conta">NÚMERO DA CONTA</label><input id="d-conta" name="conta" type="text" placeholder="Ex.: 12345-6"></div>
</fieldset>
<button type="submit">Enviar solicitação</button>
</form>
</section>
</main>
<section id="confirmacao" hidden>
<h2>Solicitação registrada</h2>
<pre id="oficio"></pre>
</section>
<script src="app.js"></script>
</body>
</html>
