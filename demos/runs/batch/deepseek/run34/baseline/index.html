<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="identidade">
      <h1>Universidade de São Paulo</h1>
      <p>Pós-Graduação do Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <main id="app">
    <nav class="abas">
      <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
      <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
    </nav>

    <section class="painel ativo" data-painel="alunos">
      <div class="erros" hidden></div>
      <form class="formulario" data-form="alunos" novalidate>
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grade">
            <label class="campo span2">NOME COMPLETO - SEM ABREVIAR
              <input name="nome" type="text" placeholder="Maria da Silva Santos" required>
            </label>
            <label class="campo">N. USP
              <input name="n_usp" type="text" inputmode="numeric" placeholder="12345678" required>
            </label>
            <label class="campo">E-MAIL
              <input name="email" type="email" placeholder="maria.santos@usp.br" required>
            </label>
            <label class="campo span2">PROGRAMA
              <input name="programa" type="text" placeholder="Matemática Aplicada" required>
            </label>
            <label class="campo">NÍVEL
              <select name="nivel" required>
                <option value="">Selecione</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select>
            </label>
            <label class="campo">TIPO DE AUXÍLIO
              <select name="tipo_auxilio" required>
                <option value="">Selecione</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select>
            </label>
            <label class="campo span2">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
              <input name="evento" type="text" placeholder="Congresso Brasileiro de Matemática" required>
            </label>
            <label class="campo span2">PERÍODO DO EVENTO, EXAME OU DEFESA
              <input name="periodo" type="text" placeholder="10 a 15 de julho de 2024" required>
            </label>
            <label class="campo">CIDADE DO EVENTO, EXAME OU DEFESA
              <input name="cidade_evento" type="text" placeholder="Rio de Janeiro" required>
            </label>
            <label class="campo">ESTADO DO EVENTO, EXAME OU DEFESA
              <input name="estado_evento" type="text" placeholder="RJ" required>
            </label>
            <label class="campo">PAÍS DO EVENTO, EXAME OU DEFESA
              <input name="pais_evento" type="text" placeholder="Brasil" required>
            </label>
            <label class="campo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
              <select name="apresentacao" required>
                <option value="">Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </label>
            <label class="campo span3">LINK DO EVENTO, EXAME OU DEFESA
              <input name="link_evento" type="text" placeholder="https://evento.exemplo.br">
            </label>
            <label class="campo">VALOR SOLICITADO (R$)
              <input name="valor" type="text" inputmode="numeric" placeholder="R$ 1.500,00" required>
            </label>
            <label class="campo span4">DETALHAMENTO DO PEDIDO
              <textarea name="detalhamento" rows="2" placeholder="Passagens aéreas e hospedagem" required></textarea>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <label class="campo">DATA DE NASCIMENTO
              <input name="data_nascimento" type="text" inputmode="numeric" placeholder="01/02/1980" required>
            </label>
            <label class="campo">LOGRADOURO
              <input name="logradouro" type="text" placeholder="Rua do Matão" required>
            </label>
            <label class="campo">NÚMERO
              <input name="numero" type="text" placeholder="1010" required>
            </label>
            <label class="campo">COMPLEMENTO
              <input name="complemento" type="text" placeholder="Bloco B, apto 42">
            </label>
            <label class="campo">BAIRRO
              <input name="bairro" type="text" placeholder="Cidade Universitária" required>
            </label>
            <label class="campo">CEP
              <input name="cep" type="text" inputmode="numeric" placeholder="05508-090" required>
            </label>
            <label class="campo">CIDADE
              <input name="cidade" type="text" placeholder="São Paulo" required>
            </label>
            <label class="campo">ESTADO
              <input name="estado" type="text" placeholder="SP" required>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <label class="campo">CPF (SEPARADOS POR PONTOS E TRAÇO)
              <input name="cpf" type="text" inputmode="numeric" placeholder="123.456.789-09" required>
            </label>
            <label class="campo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
              <input name="rg" type="text" placeholder="12.345.678-9" required>
            </label>
            <label class="campo">NOME DO BANCO
              <input name="banco" type="text" placeholder="Banco do Brasil" required>
            </label>
            <label class="campo">NÚMERO DA AGÊNCIA
              <input name="agencia" type="text" inputmode="numeric" placeholder="1234" required>
            </label>
            <label class="campo">NÚMERO DA CONTA
              <input name="conta" type="text" placeholder="12345-6" required>
            </label>
          </div>
        </fieldset>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>

    <section class="painel" data-painel="docentes">
      <div class="erros" hidden></div>
      <form class="formulario" data-form="docentes" novalidate>
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grade">
            <label class="campo span2">NOME COMPLETO - SEM ABREVIAR
              <input name="nome" type="text" placeholder="João Pereira Lima" required>
            </label>
            <label class="campo">N. USP
              <input name="n_usp" type="text" inputmode="numeric" placeholder="12345678" required>
            </label>
            <label class="campo">E-MAIL
              <input name="email" type="email" placeholder="joao.lima@usp.br" required>
            </label>
            <label class="campo span2">PROGRAMA
              <input name="programa" type="text" placeholder="Matemática Aplicada" required>
            </label>
            <label class="campo span2">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
              <input name="evento" type="text" placeholder="Congresso Brasileiro de Matemática" required>
            </label>
            <label class="campo span2">PERÍODO DO EVENTO, EXAME OU DEFESA
              <input name="periodo" type="text" placeholder="10 a 15 de julho de 2024" required>
            </label>
            <label class="campo">CIDADE DO EVENTO, EXAME OU DEFESA
              <input name="cidade_evento" type="text" placeholder="Rio de Janeiro" required>
            </label>
            <label class="campo">ESTADO DO EVENTO, EXAME OU DEFESA
              <input name="estado_evento" type="text" placeholder="RJ" required>
            </label>
            <label class="campo">PAÍS DO EVENTO, EXAME OU DEFESA
              <input name="pais_evento" type="text" placeholder="Brasil" required>
            </label>
            <label class="campo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
              <select name="apresentacao" required>
                <option value="">Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </label>
            <label class="campo span3">LINK DO EVENTO, EXAME OU DEFESA
              <input name="link_evento" type="text" placeholder="https://evento.exemplo.br">
            </label>
            <label class="campo">VALOR SOLICITADO (R$)
              <input name="valor" type="text" inputmode="numeric" placeholder="R$ 1.500,00" required>
            </label>
            <label class="campo span4">DETALHAMENTO DO PEDIDO
              <textarea name="detalhamento" rows="2" placeholder="Passagens aéreas e hospedagem" required></textarea>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <label class="campo">DATA DE NASCIMENTO
              <input name="data_nascimento" type="text" inputmode="numeric" placeholder="01/02/1980" required>
            </label>
            <label class="campo">LOGRADOURO
              <input name="logradouro" type="text" placeholder="Rua do Matão" required>
            </label>
            <label class="campo">NÚMERO
              <input name="numero" type="text" placeholder="1010" required>
            </label>
            <label class="campo">COMPLEMENTO
              <input name="complemento" type="text" placeholder="Bloco B, apto 42">
            </label>
            <label class="campo">BAIRRO
              <input name="bairro" type="text" placeholder="Cidade Universitária" required>
            </label>
            <label class="campo">CEP
              <input name="cep" type="text" inputmode="numeric" placeholder="05508-090" required>
            </label>
            <label class="campo">CIDADE
              <input name="cidade" type="text" placeholder="São Paulo" required>
            </label>
            <label class="campo">ESTADO
              <input name="estado" type="text" placeholder="SP" required>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <label class="campo">CPF (SEPARADOS POR PONTOS E TRAÇO)
              <input name="cpf" type="text" inputmode="numeric" placeholder="123.456.789-09" required>
            </label>
            <label class="campo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
              <input name="rg" type="text" placeholder="12.345.678-9" required>
            </label>
            <label class="campo">NOME DO BANCO
              <input name="banco" type="text" placeholder="Banco do Brasil" required>
            </label>
            <label class="campo">NÚMERO DA AGÊNCIA
              <input name="agencia" type="text" inputmode="numeric" placeholder="1234" required>
            </label>
            <label class="campo">NÚMERO DA CONTA
              <input name="conta" type="text" placeholder="12345-6" required>
            </label>
          </div>
        </fieldset>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>

    <section id="confirmacao" hidden>
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
