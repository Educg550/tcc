<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <div class="marca">
      <img src="assets/usp-logo.png" alt="Universidade de São Paulo">
    </div>
    <div class="identidade">
      <h1>Universidade de São Paulo</h1>
      <p>Pós-Graduação - Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <main class="conteudo">
    <nav class="abas">
      <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
      <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
    </nav>

    <section class="painel" data-aba="alunos">
      <form class="formulario" data-aba="alunos" novalidate>
        <div class="erros escondido"></div>

        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grade">
            <label class="largo">NOME COMPLETO - SEM ABREVIAR
              <input type="text" name="nome" placeholder="Maria Aparecida da Silva">
            </label>
            <label>N. USP
              <input type="text" name="n_usp" inputmode="numeric" placeholder="12345678">
            </label>
            <label>PROGRAMA
              <input type="text" name="programa" placeholder="Matemática Aplicada">
            </label>
            <label>NÍVEL
              <select name="nivel">
                <option value="">Selecione o nível</option>
                <option value="Mestrado">Mestrado</option>
                <option value="Doutorado">Doutorado</option>
              </select>
            </label>
            <label>TIPO DE AUXÍLIO
              <select name="tipo_auxilio">
                <option value="">Selecione o tipo</option>
                <option value="Participação em evento">Participação em evento</option>
                <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
                <option value="Outro">Outro</option>
              </select>
            </label>
            <label>E-MAIL
              <input type="text" name="email" placeholder="maria.silva@usp.br">
            </label>
            <label class="largo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
              <input type="text" name="evento" placeholder="Congresso Brasileiro de Matemática">
            </label>
            <label>PERÍODO DO EVENTO, EXAME OU DEFESA
              <input type="text" name="periodo" placeholder="20 a 24 de julho de 2026">
            </label>
            <label>CIDADE DO EVENTO, EXAME OU DEFESA
              <input type="text" name="cidade_evento" placeholder="Rio de Janeiro">
            </label>
            <label>ESTADO DO EVENTO, EXAME OU DEFESA
              <input type="text" name="estado_evento" placeholder="RJ">
            </label>
            <label>PAÍS DO EVENTO, EXAME OU DEFESA
              <input type="text" name="pais_evento" placeholder="Brasil">
            </label>
            <label>LINK DO EVENTO, EXAME OU DEFESA
              <input type="text" name="link" placeholder="https://evento.exemplo.br">
            </label>
            <label>VALOR SOLICITADO (R$)
              <input type="text" name="valor" inputmode="numeric" placeholder="150000" data-formato="moeda">
            </label>
            <label class="largo">DETALHAMENTO DO PEDIDO
              <textarea name="detalhamento" placeholder="Passagem aérea e hospedagem"></textarea>
            </label>
            <label class="largo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
              <select name="apresentacao">
                <option value="">Selecione o tipo de apresentação</option>
                <option value="Pôster">Pôster</option>
                <option value="Apresentação oral">Apresentação oral</option>
                <option value="Outra">Outra</option>
                <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
              </select>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <label>DATA DE NASCIMENTO
              <input type="text" name="data_nascimento" inputmode="numeric" placeholder="01021980" data-formato="data">
            </label>
            <label class="largo">LOGRADOURO
              <input type="text" name="logradouro" placeholder="Rua do Matão">
            </label>
            <label>NÚMERO
              <input type="text" name="numero" placeholder="1010">
            </label>
            <label>COMPLEMENTO
              <input type="text" name="complemento" placeholder="Sala 265">
            </label>
            <label>BAIRRO
              <input type="text" name="bairro" placeholder="Butantã">
            </label>
            <label>CEP
              <input type="text" name="cep" inputmode="numeric" placeholder="05508090" data-formato="cep">
            </label>
            <label>CIDADE
              <input type="text" name="cidade" placeholder="São Paulo">
            </label>
            <label>ESTADO
              <input type="text" name="estado" placeholder="SP">
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <label>CPF (SEPARADOS POR PONTOS E TRAÇO)
              <input type="text" name="cpf" inputmode="numeric" placeholder="12345678909" data-formato="cpf">
            </label>
            <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
              <input type="text" name="rg" placeholder="12.345.678-9">
            </label>
            <label>NOME DO BANCO
              <input type="text" name="banco" placeholder="Banco do Brasil">
            </label>
            <label>NÚMERO DA AGÊNCIA
              <input type="text" name="agencia" inputmode="numeric" placeholder="1234">
            </label>
            <label>NÚMERO DA CONTA
              <input type="text" name="conta" placeholder="12345-6">
            </label>
          </div>
        </fieldset>

        <div class="acoes">
          <button type="submit" class="enviar">Enviar solicitação</button>
        </div>
      </form>
    </section>

    <section class="painel escondido" data-aba="docentes">
      <form class="formulario" data-aba="docentes" novalidate>
        <div class="erros escondido"></div>

        <fieldset>

            </label>
            <label>E-MAIL

              <input type="text" name="evento" placeholder="Congresso Brasileiro de Matemática">

              <textarea name="detalhamento" placeholder="Passagem aérea e hospedagem"></textarea>
            </label>
            <label class="largo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
              <select name="apresentacao">
                <option value="">Selecione o tipo de apresentação</option>
                <option value="Pôster">Pôster</option>
                <option value="Apresentação oral">Apresentação oral</option>

        </fieldset>

        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">

            <label>NÚMERO

            </label>
            <label>COMPLEMENTO
              <input type="text" name="complemento" placeholder="Sala 265">
            </label>
            <label>BAIRRO
              <input type="text" name="bairro" placeholder="Butantã">
            </label>
            <label>CEP
              <input type="text" name="cep" inputmode="numeric" placeholder="05508090" data-formato="cep">
            </label>
            <label>CIDADE
              <input type="text" name="cidade" placeholder="São Paulo">
            </label>
            <label>ESTADO
              <input type="text" name="estado" placeholder="SP">
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <label>CPF (SEPARADOS POR PONTOS E TRAÇO)
              <input type="text" name="cpf" inputmode="numeric" placeholder="12345678909" data-formato="cpf">
            </label>
            <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
              <input type="text" name="rg" placeholder="12.345.678-9">
            </label>
            <label>NOME DO BANCO
              <input type="text" name="banco" placeholder="Banco do Brasil">
            </label>
            <label>NÚMERO DA AGÊNCIA
              <input type="text" name="agencia" inputmode="numeric" placeholder="1234">
            </label>
            <label>NÚMERO DA CONTA
              <input type="text" name="conta" placeholder="12345-6">
            </label>
          </div>
        </fieldset>

        <div class="acoes">
          <button type="submit" class="enviar">Enviar solicitação</button>
        </div>
      </form>
    </section>

    <section id="confirmacao" class="escondido">
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
