<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação do IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="cabecalho">
<img src="/assets/usp-logo.png" alt="Universidade de São Paulo" class="logo-usp">
<div class="linhas-titulo">
<span class="nome-universidade">Universidade de São Paulo</span>
<span class="nome-programa">Solicitação de Auxílio Financeiro - Pós-Graduação do IME-USP</span>
</div>
</header>

<main id="conteudo">
<nav class="abas">
<button type="button" class="aba ativa" data-aba="alunos" aria-selected="true">ALUNOS</button>
<button type="button" class="aba" data-aba="docentes" aria-selected="false">DOCENTES</button>
</nav>

<form id="form-alunos" class="formulario" novalidate>
<div class="erros" id="erros-alunos" hidden></div>
<fieldset>
<legend>SOLICITANTE E EVENTO</legend>
<div class="grade">
<label class="campo grande">NOME COMPLETO - SEM ABREVIAR
<input type="text" name="nome" placeholder="Maria Aparecida da Silva Santos"></label>
<label class="campo">N. USP
<input type="text" name="nusp" placeholder="12345678"></label>
<label class="campo">PROGRAMA
<input type="text" name="programa" placeholder="Matemática"></label>
<label class="campo">NÍVEL
<select name="nivel">
<option value="">Selecione</option>
<option value="Mestrado">Mestrado</option>
<option value="Doutorado">Doutorado</option>
</select></label>
<label class="campo">TIPO DE AUXÍLIO
<select name="tipo_auxilio">
<option value="">Selecione</option>
<option value="Participação em evento">Participação em evento</option>
<option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
<option value="Outro">Outro</option>
</select></label>
<label class="campo">E-MAIL
<input type="text" name="email" placeholder="maria.silva@ime.usp.br"></label>
<label class="campo grande">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
<input type="text" name="evento" placeholder="XXV Colóquio Brasileiro de Matemática"></label>
<label class="campo">PERÍODO DO EVENTO, EXAME OU DEFESA
<input type="text" name="periodo" placeholder="10 a 14 de julho de 2025"></label>
<label class="campo">CIDADE DO EVENTO, EXAME OU DEFESA
<input type="text" name="cidade_evento" placeholder="São Paulo"></label>
<label class="campo">ESTADO DO EVENTO, EXAME OU DEFESA
<input type="text" name="estado_evento" placeholder="SP"></label>
<label class="campo">PAÍS DO EVENTO, EXAME OU DEFESA
<input type="text" name="pais_evento" placeholder="Brasil"></label>
<label class="campo">LINK DO EVENTO, EXAME OU DEFESA
<input type="text" name="link" placeholder="https://evento.edu.br"></label>
<label class="campo">VALOR SOLICITADO (R$)
<input type="text" name="valor" inputmode="numeric" placeholder="R$ 1.500,00"></label>
<label class="campo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
<select name="apresentacao">
<option value="">Selecione</option>
<option value="Pôster">Pôster</option>
<option value="Apresentação oral">Apresentação oral</option>
<option value="Outra">Outra</option>
<option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
</select></label>
<label class="campo grande">DETALHAMENTO DO PEDIDO
<textarea name="detalhamento" rows="2" placeholder="Descreva a justificativa da solicitação..."></textarea></label>
</div>
</fieldset>
<fieldset>
<legend>ENDEREÇO DO SOLICITANTE</legend>
<div class="grade">
<label class="campo">DATA DE NASCIMENTO
<input type="text" name="nascimento" inputmode="numeric" placeholder="01/02/1980"></label>
<label class="campo grande">LOGRADOURO
<input type="text" name="logradouro" placeholder="Rua do Matão"></label>
<label class="campo">NÚMERO
<input type="text" name="numero" placeholder="1010"></label>
<label class="campo">COMPLEMENTO
<input type="text" name="complemento" placeholder="Apto 42"></label>
<label class="campo">BAIRRO
<input type="text" name="bairro" placeholder="Butantã"></label>
<label class="campo">CEP
<input type="text" name="cep" inputmode="numeric" placeholder="05508-090"></label>
<label class="campo">CIDADE
<input type="text" name="cidade" placeholder="São Paulo"></label>
<label class="campo">ESTADO
<input type="text" name="estado" placeholder="SP"></label>
</div>
</fieldset>
<fieldset>
<legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
<div class="grade">
<label class="campo">CPF (SEPARADOS POR PONTOS E TRAÇO)
<input type="text" name="cpf" inputmode="numeric" placeholder="123.456.789-09"></label>
<label class="campo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
<input type="text" name="rg" placeholder="12.345.678-9"></label>
<label class="campo">NOME DO BANCO
<input type="text" name="banco" placeholder="Banco do Brasil"></label>
<label class="campo">NÚMERO DA AGÊNCIA
<input type="text" name="agencia" inputmode="numeric" placeholder="1234"></label>
<label class="campo">NÚMERO DA CONTA
<input type="text" name="conta" placeholder="12345-6"></label>
</div>
</fieldset>
<button type="submit" class="enviar">Enviar solicitação</button>
</form>

<form id="form-docentes" class="formulario" hidden novalidate>
<div class="erros" id="erros-docentes" hidden></div>
<fieldset>
<legend>SOLICITANTE E EVENTO</legend>
<div class="grade">
<label class="campo grande">NOME COMPLETO - SEM ABREVIAR
<input type="text" name="nome" placeholder="João Carlos Pereira Filho"></label>
<label class="campo">N. USP
<input type="text" name="nusp" placeholder="12345678"></label>
<label class="campo">PROGRAMA
<input type="text" name="programa" placeholder="Estatística"></label>
<label class="campo">E-MAIL
<input type="text" name="email" placeholder="joao.pereira@ime.usp.br"></label>
<label class="campo grande">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
<input type="text" name="evento" placeholder="XXXIV Congreso Latinoamericano de Probabilidad"></label>
<label class="campo">PERÍODO DO EVENTO, EXAME OU DEFESA
<input type="text" name="periodo" placeholder="15 a 19 de junho de 2025"></label>
<label class="campo">CIDADE DO EVENTO, EXAME OU DEFESA
<input type="text" name="cidade_evento" placeholder="Santiago"></label>
<label class="campo">ESTADO DO EVENTO, EXAME OU DEFESA
<input type="text" name="estado_evento" placeholder="RM"></label>
<label class="campo">PAÍS DO EVENTO, EXAME OU DEFESA
<input type="text" name="pais_evento" placeholder="Chile"></label>
<label class="campo">LINK DO EVENTO, EXAME OU DEFESA
<input type="text" name="link" placeholder="https://evento.edu.br"></label>
<label class="campo">VALOR SOLICITADO (R$)
<input type="text" name="valor" inputmode="numeric" placeholder="R$ 2.800,00"></label>
<label class="campo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
<select name="apresentacao">
<option value="">Selecione</option>
<option value="Pôster">Pôster</option>
<option value="Apresentação oral">Apresentação oral</option>
<option value="Outra">Outra</option>
<option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
</select></label>
<label class="campo grande">DETALHAMENTO DO PEDIDO
<textarea name="detalhamento" rows="2" placeholder="Descreva a justificativa da solicitação..."></textarea></label>
</div>
</fieldset>
<fieldset>
<legend>ENDEREÇO DO SOLICITANTE</legend>
<div class="grade">
<label class="campo">DATA DE NASCIMENTO
<input type="text" name="nascimento" inputmode="numeric" placeholder="01/02/1980"></label>
<label class="campo grande">LOGRADOURO
<input type="text" name="logradouro" placeholder="Rua do Matão"></label>
<label class="campo">NÚMERO
<input type="text" name="numero" placeholder="1010"></label>
<label class="campo">COMPLEMENTO
<input type="text" name="complemento" placeholder="Apto 42"></label>
<label class="campo">BAIRRO
<input type="text" name="bairro" placeholder="Butantã"></label>
<label class="campo">CEP
<input type="text" name="cep" inputmode="numeric" placeholder="05508-090"></label>
<label class="campo">CIDADE
<input type="text" name="cidade" placeholder="São Paulo"></label>
<label class="campo">ESTADO
<input type="text" name="estado" placeholder="SP"></label>
</div>
</fieldset>
<fieldset>
<legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
<div class="grade">
<label class="campo">CPF (SEPARADOS POR PONTOS E TRAÇO)
<input type="text" name="cpf" inputmode="numeric" placeholder="123.456.789-09"></label>
<label class="campo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
<input type="text" name="rg" placeholder="12.345.678-9"></label>
<label class="campo">NOME DO BANCO
<input type="text" name="banco" placeholder="Banco do Brasil"></label>
<label class="campo">NÚMERO DA AGÊNCIA
<input type="text" name="agencia" inputmode="numeric" placeholder="1234"></label>
<label class="campo">NÚMERO DA CONTA
<input type="text" name="conta" placeholder="12345-6"></label>
</div>
</fieldset>
<button type="submit" class="enviar">Enviar solicitação</button>
</form>
</main>

<main id="confirmacao" hidden>
<section class="caixa-oficio">
<h2 class="titulo-confirmacao">Solicitação registrada</h2>
<pre class="oficio" id="oficio"></pre>
</section>
</main>

<script src="/app.js"></script>
</body>
</html>
