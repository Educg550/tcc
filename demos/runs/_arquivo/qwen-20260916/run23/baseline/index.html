<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro — Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho"></header>

  <main>
    <nav class="abas" role="tablist" aria-label="Tipo de solicitante">
      <button type="button" role="tab" class="aba ativa" aria-selected="true" aria-controls="painel-alunos" id="tab-alunos" data-aba="alunos">ALUNOS</button>
      <button type="button" role="tab" class="aba" aria-selected="false" aria-controls="painel-docentes" id="tab-docentes" data-aba="docentes">DOCENTES</button>
    </nav>

    <section class="painel ativa" id="painel-alunos" role="tabpanel" aria-labelledby="tab-alunos" data-aba="alunos"></section>
    <section class="painel" id="painel-docentes" role="tabpanel" aria-labelledby="tab-docentes" data-aba="docentes"></section>

    <section class="confirmacao" id="confirmacao" hidden>
      <h1>Solicitação registrada</h1>
      <pre class="oficio" id="oficio"></pre>
      <button type="button" class="botao voltar">Voltar ao formulário</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
