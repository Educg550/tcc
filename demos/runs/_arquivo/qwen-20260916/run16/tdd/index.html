<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Auxílio Financeiro - IME-USP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="logo-container">
                <img src="assets/usp-logo.png" alt="Logo USP">
            </div>
            <h1>Universidade de São Paulo</h1>
            <h2>Instituto de Matemática e Estatística - Pós-Graduação</h2>
        </header>

        <main>
            <div class="tabs">
                <input type="radio" id="tab-alunos" name="aba" value="alunos" checked>
                <label for="tab-alunos" role="tab" aria-selected="true" class="tab">ALUNOS</label>
                
                <input type="radio" id="tab-docentes" name="aba" value="docentes">
                <label for="tab-docentes" role="tab" aria-selected="false" class="tab">DOCENTES</label>
            </div>

            <section id="form-alunos" role="tabpanel" class="form-container">
                <div id="erros-alunos" class="erros"></div>
                <form id="solicitacao-alunos">
                    <fieldset>
                        <legend>SOLICITANTE E EVENTO</legend>
                        <div class="grid-2">
                            <div class="col">
                                <label for="nome_completo_alunos">NOME COMPLETO - SEM ABREVIAR</label>
                                <input type="text" id="nome_completo_alunos" name="nome_completo" placeholder="Ex: João da Silva">
                            </div>
                            <div class="col">
                                <label for="numero_usp_alunos">N. USP</label>
                                <input type="text" id="numero_usp_alunos" name="numero_usp" placeholder="Ex: 12345678">
                            </div>
                            <div class="col">
                                <label for="programa_alunos">PROGRAMA</label>
                                <input type="text" id="programa_alunos" name="programa" placeholder="Ex: Matemática">
                            </div>
                            <div class="col">
                                <label for="nivel_alunos">NÍVEL</label>
                                <select id="nivel_alunos" name="nivel">
                                    <option value="">Selecione...</option>
                                    <option value="Mestrado">Mestrado</option>
                                    <option value="Doutorado">Doutorado</option>
                                </select>
                            </div>
                            <div class="col">
                                <label for="tipo_auxilio_alunos">TIPO DE AUXÍLIO</label>
                                <select id="tipo_auxilio_alunos" name="tipo_auxilio">
                                    <option value="">Selecione...</option>
                                    <option value="Participação em evento">Participação em evento</option>
                                    <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
                                    <option value="Outro">Outro</option>
                                </select>
                            </div>
                            <div class="col">
                                <label for="email_alunos">E-MAIL</label>
                                <input type="email" id="email_alunos" name="email" placeholder="Ex: joao@ime.usp.br">
                            </div>
                            <div class="col-2">
                                <label for="nome_evento_alunos">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
                                <input type="text" id="nome_evento_alunos" name="nome_evento" placeholder="Ex: Congresso de Matemática">
                            </div>
                            <div class="col">
                                <label for="periodo_alunos">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="periodo_alunos" name="periodo" placeholder="Ex: 01/01/2025 a 02/01/2025">
                            </div>
                            <div class="col">
                                <label for="cidade_evento_alunos">CIDADE DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="cidade_evento_alunos" name="cidade_evento" placeholder="Ex: São Paulo">
                            </div>
                            <div class="col">
                                <label for="estado_evento_alunos">ESTADO DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="estado_evento_alunos" name="estado_evento" placeholder="Ex: SP">
                            </div>
                            <div class="col">
                                <label for="pais_evento_alunos">PAÍS DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="pais_evento_alunos" name="pais_evento" placeholder="Ex: Brasil">
                            </div>
                            <div class="col-2">
                                <label for="link_evento_alunos">LINK DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="link_evento_alunos" name="link_evento" placeholder="Ex: https://exemplo.com">
                            </div>
                            <div class="col">
                                <label for="valor_alunos">VALOR SOLICITADO (R$)</label>
                                <input type="text" id="valor_alunos" name="valor" placeholder="Ex: 1500 (R$ 15,00)">
                            </div>
                            <div class="col">
                                <label for="apresentacao_alunos">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
                                <select id="apresentacao_alunos" name="apresentacao">
                                    <option value="">Selecione...</option>
                                    <option value="Pôster">Pôster</option>
                                    <option value="Apresentação oral">Apresentação oral</option>
                                    <option value="Outra">Outra</option>
                                    <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
                                </select>
                            </div>
                            <div class="col-2">
                                <label for="detalhamento_alunos">DETALHAMENTO DO PEDIDO</label>
                                <textarea id="detalhamento_alunos" name="detalhamento" placeholder="Ex: Solicitação de auxílio..." rows="3"></textarea>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>ENDEREÇO DO SOLICITANTE</legend>
                        <div class="grid-2">
                            <div class="col">
                                <label for="data_nascimento_alunos">DATA DE NASCIMENTO</label>
                                <input type="text" id="data_nascimento_alunos" name="data_nascimento" placeholder="Ex: 01/02/1980">
                            </div>
                            <div class="col-2">
                                <label for="logradouro_alunos">LOGRADOURO</label>
                                <input type="text" id="logradouro_alunos" name="logradouro" placeholder="Ex: Rua do Matão">
                            </div>
                            <div class="col">
                                <label for="numero_alunos">NÚMERO</label>
                                <input type="text" id="numero_alunos" name="numero" placeholder="Ex: 1010">
                            </div>
                            <div class="col">
                                <label for="complemento_alunos">COMPLEMENTO</label>
                                <input type="text" id="complemento_alunos" name="complemento" placeholder="Ex: Apto 12">
                            </div>
                            <div class="col">
                                <label for="bairro_alunos">BAIRRO</label>
                                <input type="text" id="bairro_alunos" name="bairro" placeholder="Ex: Butantã">
                            </div>
                            <div class="col">
                                <label for="cep_alunos">CEP</label>
                                <input type="text" id="cep_alunos" name="cep" placeholder="Ex: 05508-090">
                            </div>
                            <div class="col">
                                <label for="cidade_alunos">CIDADE</label>
                                <input type="text" id="cidade_alunos" name="cidade" placeholder="Ex: São Paulo">
                            </div>
                            <div class="col">
                                <label for="estado_alunos">ESTADO</label>
                                <input type="text" id="estado_alunos" name="estado" placeholder="Ex: SP">
                            </div>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
                        <div class="grid-2">
                            <div class="col">
                                <label for="cpf_alunos">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
                                <input type="text" id="cpf_alunos" name="cpf" placeholder="Ex: 123.456.789-09">
                            </div>
                            <div class="col">
                                <label for="rg_alunos">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
                                <input type="text" id="rg_alunos" name="rg" placeholder="Ex: 12.345.678-9">
                            </div>
                            <div class="col">
                                <label for="banco_alunos">NOME DO BANCO</label>
                                <input type="text" id="banco_alunos" name="banco" placeholder="Ex: Banco do Brasil">
                            </div>
                            <div class="col">
                                <label for="agencia_alunos">NÚMERO DA AGÊNCIA</label>
                                <input type="text" id="agencia_alunos" name="agencia" placeholder="Ex: 1234">
                            </div>
                            <div class="col">
                                <label for="conta_alunos">NÚMERO DA CONTA</label>
                                <input type="text" id="conta_alunos" name="conta" placeholder="Ex: 56789-0">
                            </div>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn-enviar">Enviar solicitação</button>
                </form>
            </section>

            <section id="form-docentes" role="tabpanel" class="form-container" style="display:none">
                <div id="erros-docentes" class="erros"></div>
                <form id="solicitacao-docentes">
                    <fieldset>
                        <legend>SOLICITANTE E EVENTO</legend>
                        <div class="grid-2">
                            <div class="col">
                                <label for="nome_completo_docentes">NOME COMPLETO - SEM ABREVIAR</label>
                                <input type="text" id="nome_completo_docentes" name="nome_completo" placeholder="Ex: João da Silva">
                            </div>
                            <div class="col">
                                <label for="numero_usp_docentes">N. USP</label>
                                <input type="text" id="numero_usp_docentes" name="numero_usp" placeholder="Ex: 12345678">
                            </div>
                            <div class="col">
                                <label for="programa_docentes">PROGRAMA</label>
                                <input type="text" id="programa_docentes" name="programa" placeholder="Ex: Matemática">
                            </div>
                            <div class="col">
                                <label for="email_docentes">E-MAIL</label>
                                <input type="email" id="email_docentes" name="email" placeholder="Ex: joao@ime.usp.br">
                            </div>
                            <div class="col-2">
                                <label for="nome_evento_docentes">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
                                <input type="text" id="nome_evento_docentes" name="nome_evento" placeholder="Ex: Congresso de Matemática">
                            </div>
                            <div class="col">
                                <label for="periodo_docentes">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="periodo_docentes" name="periodo" placeholder="Ex: 01/01/2025 a 02/01/2025">
                            </div>
                            <div class="col">
                                <label for="cidade_evento_docentes">CIDADE DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="cidade_evento_docentes" name="cidade_evento" placeholder="Ex: São Paulo">
                            </div>
                            <div class="col">
                                <label for="estado_evento_docentes">ESTADO DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="estado_evento_docentes" name="estado_evento" placeholder="Ex: SP">
                            </div>
                            <div class="col">
                                <label for="pais_evento_docentes">PAÍS DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="pais_evento_docentes" name="pais_evento" placeholder="Ex: Brasil">
                            </div>
                            <div class="col-2">
                                <label for="link_evento_docentes">LINK DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="link_evento_docentes" name="link_evento" placeholder="Ex: https://exemplo.com">
                            </div>
                            <div class="col">
                                <label for="valor_docentes">VALOR SOLICITADO (R$)</label>
                                <input type="text" id="valor_docentes" name="valor" placeholder="Ex: 1500 (R$ 15,00)">
                            </div>
                            <div class="col">
                                <label for="apresentacao_docentes">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
                                <select id="apresentacao_docentes" name="apresentacao">
                                    <option value="">Selecione...</option>
                                    <option value="Pôster">Pôster</option>
                                    <option value="Apresentação oral">Apresentação oral</option>
                                    <option value="Outra">Outra</option>
                                    <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
                                </select>
                            </div>
                            <div class="col-2">
                                <label for="detalhamento_docentes">DETALHAMENTO DO PEDIDO</label>
                                <textarea id="detalhamento_docentes" name="detalhamento" placeholder="Ex: Solicitação de auxílio..." rows="3"></textarea>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>ENDEREÇO DO SOLICITANTE</legend>
                        <div class="grid-2">
                            <div class="col">
                                <label for="data_nascimento_docentes">DATA DE NASCIMENTO</label>
                                <input type="text" id="data_nascimento_docentes" name="data_nascimento" placeholder="Ex: 01/02/1980">
                            </div>
                            <div class="col-2">
                                <label for="logradouro_docentes">LOGRADOURO</label>
                                <input type="text" id="logradouro_docentes" name="logradouro" placeholder="Ex: Rua do Matão">
                            </div>
                            <div class="col">
                                <label for="numero_docentes">NÚMERO</label>
                                <input type="text" id="numero_docentes" name="numero" placeholder="Ex: 1010">
                            </div>
                            <div class="col">
                                <label for="complemento_docentes">COMPLEMENTO</label>
                                <input type="text" id="complemento_docentes" name="complemento" placeholder="Ex: Apto 12">
                            </div>
                            <div class="col">
                                <label for="bairro_docentes">BAIRRO</label>
                                <input type="text" id="bairro_docentes" name="bairro" placeholder="Ex: Butantã">
                            </div>
                            <div class="col">
                                <label for="cep_docentes">CEP</label>
                                <input type="text" id="cep_docentes" name="cep" placeholder="Ex: 05508-090">
                            </div>
                            <div class="col">
                                <label for="cidade_docentes">CIDADE</label>
                                <input type="text" id="cidade_docentes" name="cidade" placeholder="Ex: São Paulo">
                            </div>
                            <div class="col">
                                <label for="estado_docentes">ESTADO</label>
                                <input type="text" id="estado_docentes" name="estado" placeholder="Ex: SP">
                            </div>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
                        <div class="grid-2">
                            <div class="col">
                                <label for="cpf_docentes">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
                                <input type="text" id="cpf_docentes" name="cpf" placeholder="Ex: 123.456.789-09">
                            </div>
                            <div class="col">
                                <label for="rg_docentes">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
                                <input type="text" id="rg_docentes" name="rg" placeholder="Ex: 12.345.678-9">
                            </div>
                            <div class="col">
                                <label for="banco_docentes">NOME DO BANCO</label>
                                <input type="text" id="banco_docentes" name="banco" placeholder="Ex: Banco do Brasil">
                            </div>
                            <div class="col">
                                <label for="agencia_docentes">NÚMERO DA AGÊNCIA</label>
                                <input type="text" id="agencia_docentes" name="agencia" placeholder="Ex: 1234">
                            </div>
                            <div class="col">
                                <label for="conta_docentes">NÚMERO DA CONTA</label>
                                <input type="text" id="conta_docentes" name="conta" placeholder="Ex: 56789-0">
                            </div>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn-enviar">Enviar solicitação</button>
                </form>
            </section>

            <section id="confirmacao" style="display:none">
                <h2>Solicitação registrada</h2>
                <pre id="oficio"></pre>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
