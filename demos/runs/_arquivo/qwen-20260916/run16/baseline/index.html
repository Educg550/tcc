<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação do IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topo">
  <div class="marca">
    <div class="logo"><img src="/assets/usp-logo.png" alt="Universidade de São Paulo"></div>
    <div class="institucional">
      <span class="universidade">Universidade de São Paulo</span>
      <span class="programa">Pós-Graduação do Instituto de Matemática e Estatística</span>
    </div>
  </div>
</header>

<main class="painel" id="painel">
  <nav class="abas" role="tablist">
    <button type="button" class="aba ativa" id="aba-alunos" role="tab" aria-selected="true" aria-controls="form-alunos">ALUNOS</button>
    <button type="button" class="aba" id="aba-docentes" role="tab" aria-selected="false" aria-controls="form-docentes">DOCENTES</button>
  </nav>

  <p class="erros" id="erros" hidden></p>

  <form id="form-alunos" class="form" role="tabpanel" aria-labelledby="aba-alunos" novalidate></form>

  <form id="form-docentes" class="form" role="tabpanel" aria-labelledby="aba-docentes" hidden novalidate></form>
</main>

<section class="painel confirmacao" id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <pre class="oficio" id="oficio"></pre>
</section>

<script src="/app.js"></script>
</body>
</html>
