<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Auxílio Financeiro</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header class="header-institucional">
            <div class="logo-wrapper">
                <img src="/assets/usp-logo.png" alt="USP Logo" class="usp-logo">
            </div>
            <div class="titulos">
                <h1>Universidade de São Paulo</h1>
                <h2>Pós-Graduação</h2>
            </div>
        </header>
        <main>
            <div id="form-section">
                <div class="tabs">
                    <button type="button" class="tab-button active" data-tab="ALUNOS">ALUNOS</button>
                    <button type="button" class="tab-button" data-tab="DOCENTES">DOCENTES</button>
                </div>
                <div id="error-display"></div>
                <form id="form-alunos" class="form-content active">
                    <fieldset>
                        <legend>SOLICITANTE E EVENTO</legend>
                        <div class="grid-2">
                            <div class="form-group">
                                <label for="alunos-nome">NOME COMPLETO - SEM ABREVIAR</label>
                                <input type="text" id="alunos-nome" name="nome_completo" placeholder="Maria da Silva" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-nusp">N. USP</label>
                                <input type="text" id="alunos-nusp" name="n_usp" placeholder="12345678" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-programa">PROGRAMA</label>
                                <input type="text" id="alunos-programa" name="programa" placeholder="Ciência da Computação" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-nivel">NÍVEL</label>
                                <select id="alunos-nivel" name="nivel" required>
                                    <option value="">Selecione</option>
                                    <option value="Mestrado">Mestrado</option>
                                    <option value="Doutorado">Doutorado</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="alunos-tipo">TIPO DE AUXÍLIO</label>
                                <select id="alunos-tipo" name="tipo_auxilio" required>
                                    <option value="">Selecione</option>
                                    <option value="Participação em evento">Participação em evento</option>
                                    <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
                                    <option value="Outro">Outro</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="alunos-email">E-MAIL</label>
                                <input type="email" id="alunos-email" name="email" placeholder="maria@usp.br" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
                                <input type="text" id="alunos-evento" name="nome_evento" placeholder="SBIA 2026" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="alunos-periodo" name="periodo_evento" placeholder="de 10 a 14 de março" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="alunos-cidade-evento" name="cidade_evento" placeholder="São Paulo" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="alunos-estado-evento" name="estado_evento" placeholder="SP" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="alunos-pais-evento" name="pais_evento" placeholder="Brasil" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-link">LINK DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="alunos-link" name="link_evento" placeholder="https://...">
                            </div>
                            <div class="form-group">
                                <label for="alunos-valor">VALOR SOLICITADO (R$)</label>
                                <input type="text" id="alunos-valor" name="valor_solicitado" class="moeda" placeholder="R$ 0,00" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-apresentar">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
                                <select id="alunos-apresentar" name="apresentar_trabalho" required>
                                    <option value="">Selecione</option>
                                    <option value="Pôster">Pôster</option>
                                    <option value="Apresentação oral">Apresentação oral</option>
                                    <option value="Outra">Outra</option>
                                    <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group full-width">
                            <label for="alunos-detalhamento">DETALHAMENTO DO PEDIDO</label>
                            <textarea id="alunos-detalhamento" name="detalhamento" placeholder="Contribuição para custear inscrição..." required></textarea>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>ENDEREÇO DO SOLICITANTE</legend>
                        <div class="grid-3">
                            <div class="form-group">
                                <label for="alunos-data">DATA DE NASCIMENTO</label>
                                <input type="text" id="alunos-data" name="data_nascimento" class="data" placeholder="dd/mm/aaaa" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-logradouro">LOGRADOURO</label>
                                <input type="text" id="alunos-logradouro" name="logradouro" placeholder="Rua do Matão" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-numero">NÚMERO</label>
                                <input type="text" id="alunos-numero" name="numero" placeholder="1010" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-complemento">COMPLEMENTO</label>
                                <input type="text" id="alunos-complemento" name="complemento" placeholder="Casa 2">
                            </div>
                            <div class="form-group">
                                <label for="alunos-bairro">BAIRRO</label>
                                <input type="text" id="alunos-bairro" name="bairro" placeholder="Butantã" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-cep">CEP</label>
                                <input type="text" id="alunos-cep" name="cep" class="cep" placeholder="00000-000" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-cidade">CIDADE</label>
                                <input type="text" id="alunos-cidade" name="cidade" placeholder="São Paulo" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-estado">ESTADO</label>
                                <input type="text" id="alunos-estado" name="estado" placeholder="SP" required>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
                        <div class="grid-3">
                            <div class="form-group">
                                <label for="alunos-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
                                <input type="text" id="alunos-cpf" name="cpf" class="cpf" placeholder="000.000.000-00" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
                                <input type="text" id="alunos-rg" name="rg_rnm" placeholder="12.345.678-9" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-banco">NOME DO BANCO</label>
                                <input type="text" id="alunos-banco" name="nome_banco" placeholder="Banco do Brasil" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-agencia">NÚMERO DA AGÊNCIA</label>
                                <input type="text" id="alunos-agencia" name="numero_agencia" placeholder="1234" required>
                            </div>
                            <div class="form-group">
                                <label for="alunos-conta">NÚMERO DA CONTA</label>
                                <input type="text" id="alunos-conta" name="numero_conta" placeholder="56789-0" required>
                            </div>
                        </div>
                    </fieldset>
                    <button type="submit" class="submit-btn">Enviar solicitação</button>
                </form>
                <form id="form-docentes" class="form-content" style="display:none">
                    <fieldset>
                        <legend>SOLICITANTE E EVENTO</legend>
                        <div class="grid-2">
                            <div class="form-group">
                                <label for="docentes-nome">NOME COMPLETO - SEM ABREVIAR</label>
                                <input type="text" id="docentes-nome" name="nome_completo" placeholder="João da Silva" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-nusp">N. USP</label>
                                <input type="text" id="docentes-nusp" name="n_usp" placeholder="12345678" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-programa">PROGRAMA</label>
                                <input type="text" id="docentes-programa" name="programa" placeholder="Matemática" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-email">E-MAIL</label>
                                <input type="email" id="docentes-email" name="email" placeholder="joao@usp.br" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
                                <input type="text" id="docentes-evento" name="nome_evento" placeholder="Workshop 2026" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="docentes-periodo" name="periodo_evento" placeholder="amanhã" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="docentes-cidade-evento" name="cidade_evento" placeholder="São Paulo" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="docentes-estado-evento" name="estado_evento" placeholder="SP" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="docentes-pais-evento" name="pais_evento" placeholder="Brasil" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-link">LINK DO EVENTO, EXAME OU DEFESA</label>
                                <input type="text" id="docentes-link" name="link_evento" placeholder="https://...">
                            </div>
                            <div class="form-group">
                                <label for="docentes-valor">VALOR SOLICITADO (R$)</label>
                                <input type="text" id="docentes-valor" name="valor_solicitado" class="moeda" placeholder="R$ 0,00" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-apresentar">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
                                <select id="docentes-apresentar" name="apresentar_trabalho" required>
                                    <option value="">Selecione</option>
                                    <option value="Pôster">Pôster</option>
                                    <option value="Apresentação oral">Apresentação oral</option>
                                    <option value="Outra">Outra</option>
                                    <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group full-width">
                            <label for="docentes-detalhamento">DETALHAMENTO DO PEDIDO</label>
                            <textarea id="docentes-detalhamento" name="detalhamento" placeholder="Custeio de deslocamento..." required></textarea>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>ENDEREÇO DO SOLICITANTE</legend>
                        <div class="grid-3">
                            <div class="form-group">
                                <label for="docentes-data">DATA DE NASCIMENTO</label>
                                <input type="text" id="docentes-data" name="data_nascimento" class="data" placeholder="dd/mm/aaaa" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-logradouro">LOGRADOURO</label>
                                <input type="text" id="docentes-logradouro" name="logradouro" placeholder="Avenida Paulista" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-numero">NÚMERO</label>
                                <input type="text" id="docentes-numero" name="numero" placeholder="1000" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-complemento">COMPLEMENTO</label>
                                <input type="text" id="docentes-complemento" name="complemento" placeholder="Sala 100">
                            </div>
                            <div class="form-group">
                                <label for="docentes-bairro">BAIRRO</label>
                                <input type="text" id="docentes-bairro" name="bairro" placeholder="Bela Vista" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-cep">CEP</label>
                                <input type="text" id="docentes-cep" name="cep" class="cep" placeholder="00000-000" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-cidade">CIDADE</label>
                                <input type="text" id="docentes-cidade" name="cidade" placeholder="São Paulo" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-estado">ESTADO</label>
                                <input type="text" id="docentes-estado" name="estado" placeholder="SP" required>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
                        <div class="grid-3">
                            <div class="form-group">
                                <label for="docentes-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
                                <input type="text" id="docentes-cpf" name="cpf" class="cpf" placeholder="000.000.000-00" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
                                <input type="text" id="docentes-rg" name="rg_rnm" placeholder="12.345.678-9" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-banco">NOME DO BANCO</label>
                                <input type="text" id="docentes-banco" name="nome_banco" placeholder="Caixa" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-agencia">NÚMERO DA AGÊNCIA</label>
                                <input type="text" id="docentes-agencia" name="numero_agencia" placeholder="567" required>
                            </div>
                            <div class="form-group">
                                <label for="docentes-conta">NÚMERO DA CONTA</label>
                                <input type="text" id="docentes-conta" name="numero_conta" placeholder="89012-3" required>
                            </div>
                        </div>
                    </fieldset>
                    <button type="submit" class="submit-btn">Enviar solicitação</button>
                </form>
            </div>
            <div id="confirmation-section" style="display:none">
                <h1>Solicitação registrada</h1>
                <div class="oficio-container">
                    <pre id="oficio-text"></pre>
                </div>
            </div>
        </main>
    </div>
    <script src="/app.js"></script>
</body>
</html>
