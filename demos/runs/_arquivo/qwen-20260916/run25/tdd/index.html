<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Auxílio Financeiro - IME-USP</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="/assets/usp-logo.png" alt="USP Logo" class="usp-logo">
            <div class="header-text">
                <h1>Universidade de São Paulo</h1>
                <h2>Instituto de Matemática e Estatística</h2>
            </div>
        </header>

        <div id="form-area">
            <nav class="tabs">
                <button class="tab active" id="tab-alunos">ALUNOS</button>
                <button class="tab" id="tab-docentes">DOCENTES</button>
            </nav>

            <div id="erro-mensagens" class="erros"></div>

            <form id="form-alunos" class="form-abas">
                <div id="form-alunos-inner"></div>
                <div class="botoes-container">
                    <button type="submit" class="btn">Enviar solicitação</button>
                </div>
            </form>

            <form id="form-docentes" class="form-abas" style="display: none;">
                <div id="form-docentes-inner"></div>
                <div class="botoes-container">
                    <button type="submit" class="btn">Enviar solicitação</button>
                </div>
            </form>
        </div>

        <div id="confirm-area" class="confirm-area" style="display: none;">
            <h2>Solicitação registrada</h2>
            <pre id="oficio-text"></pre>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
