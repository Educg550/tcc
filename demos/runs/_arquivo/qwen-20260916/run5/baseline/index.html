<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== TELA DO FORMULÁRIO ===== -->
<main id="tela-formulario">
  <header class="cabecalho">
    <div class="cabecalho-logo"><img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo"></div>
    <div class="cabecalho-texto">
      <p class="universidade">Universidade de São Paulo</p>
      <p class="programa">Instituto de Matemática e Estatística — Pós-Graduação</p>
    </div>
  </header>

  <div class="abas" role="tablist">
    <button type="button" class="aba ativa" role="tab" aria-selected="true" data-alvo="alunos">ALUNOS</button>
    <button type="button" class="aba" role="tab" aria-selected="false" data-alvo="docentes">DOCENTES</button>
  </div>

  <div class="painel-erro" id="alunos-erros"></div>
  <div class="painel-erro" id="docentes-erros"></div>

  <form id="form-alunos" class="formulario" novalidate></form>
  <form id="form-docentes" class="formulario escondido" novalidate></form>
</main>

<!-- ===== TELA DE CONFIRMAÇÃO ===== -->
<main id="tela-confirmacao" class="escondido">
  <header class="cabecalho">
    <div class="cabecalho-logo"><img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo"></div>
    <div class="cabecalho-texto">
      <p class="universidade">Universidade de São Paulo</p>
      <p class="programa">Instituto de Matemática e Estatística — Pós-Graduação</p>
    </div>
  </header>
  <h2 class="titulo-confirmacao">Solicitação registrada</h2>
  <pre class="oficio" id="oficio"></pre>
  <button type="button" class="botao voltar" id="botao-voltar">Voltar</button>
</main>

<script src="app.js"></script>
</body>
</html>
