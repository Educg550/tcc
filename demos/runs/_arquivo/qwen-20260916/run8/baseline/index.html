<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPG-IME USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="cabecalho">
<img src="assets/usp-logo.png" alt="Universidade de São Paulo">
<div class="cabecalho-nome">Universidade de São Paulo</div>
<div class="cabecalho-prog">Instituto de Matemática e Estatística - Pós-Graduação</div>
</div>
<div id="pagina">
<nav class="abas" role="tablist">
<button class="aba ativa" role="tab" data-tab="ALUNOS" aria-selected="true">ALUNOS</button>
<button class="aba" role="tab" data-tab="DOCENTES" aria-selected="false">DOCENTES</button>
</nav>
<form id="form-ALUNOS" class="formulario" role="tabpanel" data-tab="ALUNOS" novalidate></form>
<form id="form-DOCENTES" class="formulario" role="tabpanel" data-tab="DOCENTES" novalidate hidden></form>
</div>
<div id="confirmacao" hidden>
<h1>Solicitação registrada</h1>
<pre id="oficio"></pre>
</div>
<script src="app.js"></script>
</body>
</html>
