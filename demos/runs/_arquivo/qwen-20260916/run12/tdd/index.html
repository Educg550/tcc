<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="cabecalho">
  <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo" class="logo">
  <div class="titulos">
    <h1>Universidade de São Paulo</h1>
    <p>Instituto de Matemática e Estatística - Pós-Graduação</p>
  </div>
</header>

<main>
  <nav class="abas">
    <button type="button" class="tab active" data-alvo="alunos">ALUNOS</button>
    <button type="button" class="tab" data-alvo="docentes">DOCENTES</button>
  </nav>

  <section id="painel-alunos" class="painel ativo">
    <div class="erros" id="erros-alunos"></div>
    <form id="form-alunos" novalidate></form>
  </section>

  <section id="painel-docentes" class="painel">
    <div class="erros" id="erros-docentes"></div>
    <form id="form-docentes" novalidate></form>
  </section>

  <section id="confirmacao" class="painel">
    <h2 class="titulo-confirmacao">Solicitação registrada</h2>
    <pre class="oficio" id="oficio"></pre>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
