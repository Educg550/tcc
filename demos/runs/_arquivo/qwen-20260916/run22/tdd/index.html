<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitação de Auxílio Financeiro - IME-USP</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <div class="logo-area">
      <img src="/assets/usp-logo.png" alt="Logo USP" class="logo">
      <div class="names">
        <h1>Universidade de São Paulo</h1>
        <p>Instituto de Matemática e Estatística</p>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="form-section">
      <div class="tabs" role="tablist">
        <button class="tab active" role="tab" id="tab-alunos" aria-selected="true" aria-controls="form-alunos">ALUNOS</button>
        <button class="tab" role="tab" id="tab-docentes" aria-selected="false" aria-controls="form-docentes">DOCENTES</button>
      </div>

      <div id="errors-alunos" class="error-box hidden"></div>
      <form id="form-alunos" class="form-active" role="tabpanel" aria-labelledby="tab-alunos">
        <div class="bloc">
          <h3>SOLICITANTE E EVENTO</h3>
          <div class="grid">
            <label for="nome_completo">NOME COMPLETO - SEM ABREVIAR</label>
            <input type="text" id="nome_completo" name="nome_completo" placeholder="Ex: Maria da Silva">
            
            <label for="numero_usp">N. USP</label>
            <input type="text" id="numero_usp" name="numero_usp" placeholder="Ex: 12345678">
            
            <label for="programa">PROGRAMA</label>
            <input type="text" id="programa" name="programa" placeholder="Ex: Matemática">
            
            <label for="nivel">NÍVEL</label>
            <select id="nivel" name="nivel">
              <option value="">Selecione</option>
              <option value="Mestrado">Mestrado</option>
              <option value="Doutorado">Doutorado</option>
            </select>
            
            <label for="tipo_auxilio">TIPO DE AUXÍLIO</label>
            <select id="tipo_auxilio" name="tipo_auxilio">
              <option value="">Selecione</option>
              <option value="Participação em evento">Participação em evento</option>
              <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
              <option value="Outro">Outro</option>
            </select>
            
            <label for="email">E-MAIL</label>
            <input type="email" id="email" name="email" placeholder="Ex: maria@ime.usp.br">
            
            <label for="nome_evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type="text" id="nome_evento" name="nome_evento" placeholder="Ex: SBMAC">
            
            <label for="periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="periodo" name="periodo" placeholder="Ex: 2025-01-01 a 2025-01-05">
            
            <label for="cidade_evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="cidade_evento" name="cidade_evento" placeholder="Ex: Rio de Janeiro">
            
            <label for="estado_evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="estado_evento" name="estado_evento" placeholder="Ex: RJ">
            
            <label for="pais_evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="pais_evento" name="pais_evento" placeholder="Ex: Brasil">
            
            <label for="link_evento">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="link_evento" name="link_evento" placeholder="Ex: http://sbmac.org">
            
            <label for="valor">VALOR SOLICITADO (R$)</label>
            <input type="text" id="valor" name="valor" placeholder="Ex: 1500">
            
            <label for="detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="detalhamento" name="detalhamento" placeholder="Ex: Detalhes do pedido"></textarea>
            
            <label for="apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="apresentacao" name="apresentacao">
              <option value="">Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>

        <div class="bloc">
          <h3>ENDEREÇO DO SOLICITANTE</h3>
          <div class="grid">
            <label for="data_nascimento">DATA DE NASCIMENTO</label>
            <input type="text" id="data_nascimento" name="data_nascimento" placeholder="Ex: 01/02/1980">
            
            <label for="logradouro">LOGRADOURO</label>
            <input type="text" id="logradouro" name="logradouro" placeholder="Ex: Rua do Matao">
            
            <label for="numero">NÚMERO</label>
            <input type="text" id="numero" name="numero" placeholder="Ex: 101">
            
            <label for="complemento">COMPLEMENTO</label>
            <input type="text" id="complemento" name="complemento" placeholder="Ex: Apto 2">
            
            <label for="bairro">BAIRRO</label>
            <input type="text" id="bairro" name="bairro" placeholder="Ex: Butanta">
            
            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep" placeholder="Ex: 05508-090">
            
            <label for="cidade">CIDADE</label>
            <input type="text" id="cidade" name="cidade" placeholder="Ex: Sao Paulo">
            
            <label for="estado">ESTADO</label>
            <input type="text" id="estado" name="estado" placeholder="Ex: SP">
          </div>
        </div>

        <div class="bloc">
          <h3>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h3>
          <div class="grid">
            <label for="cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="cpf" name="cpf" placeholder="Ex: 529.982.247-25">
            
            <label for="rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="rg" name="rg" placeholder="Ex: 12.345.678-9">
            
            <label for="banco">NOME DO BANCO</label>
            <input type="text" id="banco" name="banco" placeholder="Ex: Banco do Brasil">
            
            <label for="agencia">NÚMERO DA AGÊNCIA</label>
            <input type="text" id="agencia" name="agencia" placeholder="Ex: 1234">
            
            <label for="conta">NÚMERO DA CONTA</label>
            <input type="text" id="conta" name="conta" placeholder="Ex: 56789-0">
          </div>
        </div>

        <button type="submit" class="btn">Enviar solicitação</button>
      </form>

      <div id="errors-docentes" class="error-box hidden"></div>
      <form id="form-docentes" class="hidden" role="tabpanel" aria-labelledby="tab-docentes">
        <div class="bloc">
          <h3>SOLICITANTE E EVENTO</h3>
          <div class="grid">
            <label for="nome_completo_d">NOME COMPLETO - SEM ABREVIAR</label>
            <input type="text" id="nome_completo_d" name="nome_completo" placeholder="Ex: Maria da Silva">
            
            <label for="numero_usp_d">N. USP</label>
            <input type="text" id="numero_usp_d" name="numero_usp" placeholder="Ex: 12345678">
            
            <label for="programa_d">PROGRAMA</label>
            <input type="text" id="programa_d" name="programa" placeholder="Ex: Matemática">
            
            <label for="email_d">E-MAIL</label>
            <input type="email" id="email_d" name="email" placeholder="Ex: maria@ime.usp.br">
            
            <label for="nome_evento_d">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type="text" id="nome_evento_d" name="nome_evento" placeholder="Ex: SBMAC">
            
            <label for="periodo_d">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="periodo_d" name="periodo" placeholder="Ex: 2025-01-01 a 2025-01-05">
            
            <label for="cidade_evento_d">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="cidade_evento_d" name="cidade_evento" placeholder="Ex: Rio de Janeiro">
            
            <label for="estado_evento_d">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="estado_evento_d" name="estado_evento" placeholder="Ex: RJ">
            
            <label for="pais_evento_d">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="pais_evento_d" name="pais_evento" placeholder="Ex: Brasil">
            
            <label for="link_evento_d">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="link_evento_d" name="link_evento" placeholder="Ex: http://sbmac.org">
            
            <label for="valor_d">VALOR SOLICITADO (R$)</label>
            <input type="text" id="valor_d" name="valor" placeholder="Ex: 1500">
            
            <label for="detalhamento_d">DETALHAMENTO DO PEDIDO</label>
            <textarea id="detalhamento_d" name="detalhamento" placeholder="Ex: Detalhes do pedido"></textarea>
            
            <label for="apresentacao_d">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="apresentacao_d" name="apresentacao">
              <option value="">Selecione</option>
              <option value="Pôster">Pôster</option>
              <option value="Apresentação oral">Apresentação oral</option>
              <option value="Outra">Outra</option>
              <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>

        <div class="bloc">
          <h3>ENDEREÇO DO SOLICITANTE</h3>
          <div class="grid">
            <label for="data_nascimento_d">DATA DE NASCIMENTO</label>
            <input type="text" id="data_nascimento_d" name="data_nascimento" placeholder="Ex: 01/02/1980">
            
            <label for="logradouro_d">LOGRADOURO</label>
            <input type="text" id="logradouro_d" name="logradouro" placeholder="Ex: Rua do Matao">
            
            <label for="numero_d">NÚMERO</label>
            <input type="text" id="numero_d" name="numero" placeholder="Ex: 101">
            
            <label for="complemento_d">COMPLEMENTO</label>
            <input type="text" id="complemento_d" name="complemento" placeholder="Ex: Apto 2">
            
            <label for="bairro_d">BAIRRO</label>
            <input type="text" id="bairro_d" name="bairro" placeholder="Ex: Butanta">
            
            <label for="cep_d">CEP</label>
            <input type="text" id="cep_d" name="cep" placeholder="Ex: 05508-090">
            
            <label for="cidade_d">CIDADE</label>
            <input type="text" id="cidade_d" name="cidade" placeholder="Ex: Sao Paulo">
            
            <label for="estado_d">ESTADO</label>
            <input type="text" id="estado_d" name="estado" placeholder="Ex: SP">
          </div>
        </div>

        <div class="bloc">
          <h3>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h3>
          <div class="grid">
            <label for="cpf_d">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="cpf_d" name="cpf" placeholder="Ex: 529.982.247-25">
            
            <label for="rg_d">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="rg_d" name="rg" placeholder="Ex: 12.345.678-9">
            
            <label for="banco_d">NOME DO BANCO</label>
            <input type="text" id="banco_d" name="banco" placeholder="Ex: Banco do Brasil">
            
            <label for="agencia_d">NÚMERO DA AGÊNCIA</label>
            <input type="text" id="agencia_d" name="agencia" placeholder="Ex: 1234">
            
            <label for="conta_d">NÚMERO DA CONTA</label>
            <input type="text" id="conta_d" name="conta" placeholder="Ex: 56789-0">
          </div>
        </div>

        <button type="submit" class="btn">Enviar solicitação</button>
      </form>
    </div>

    <div id="confirmation" class="hidden">
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
