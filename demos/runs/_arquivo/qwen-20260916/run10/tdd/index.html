<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pós-Graduação IME-USP - Auxílio Financeiro</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <img src="/assets/usp-logo.png" alt="Logo USP">
        <div class="titulos">
            <h1>Universidade de São Paulo</h1>
            <h2>Instituto de Matemática e Estatística - Pós-Graduação</h2>
        </div>
    </header>

    <main id="tela-formulario">
        <div class="abas">
            <button class="tab-btn aba ativa" data-target="form-alunos">ALUNOS</button>
            <button class="tab-btn" data-target="form-docentes">DOCENTES</button>
        </div>

        <div id="form-alunos" class="form-container">
            <div class="mensagens-erro"></div>
            <form id="alunos-form">
                <section>
                    <h3>SOLICITANTE E EVENTO</h3>
                    <div class="grid">
                        <div class="campo"><label>NOME COMPLETO - SEM ABREVIAR</label><input type="text" name="nome" placeholder="Ex.: Maria da Silva"></div>
                        <div class="campo"><label>N. USP</label><input type="text" name="nuspp" placeholder="Ex.: 1234567"></div>
                        <div class="campo"><label>PROGRAMA</label><input type="text" name="programa" placeholder="Ex.: Matemática"></div>
                        <div class="campo"><label>NÍVEL</label><select name="nivel" placeholder="Selecione"><option value="">Selecione</option><option value="Mestrado">Mestrado</option><option value="Doutorado">Doutorado</option></select></div>
                        <div class="campo"><label>TIPO DE AUXÍLIO</label><select name="tipo_auxilio" placeholder="Selecione"><option value="">Selecione</option><option value="Participação em evento">Participação em evento</option><option value="Banca de exame ou defesa">Banca de exame ou defesa</option><option value="Outro">Outro</option></select></div>
                        <div class="campo"><label>E-MAIL</label><input type="email" name="email" placeholder="Ex.: maria@ime.usp.br"></div>
                        <div class="campo"><label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label><input type="text" name="evento" placeholder="Ex.: CBM 2024"></div>
                        <div class="campo"><label>PERÍODO DO EVENTO, EXAME OU DEFESA</label><input type="text" name="periodo" placeholder="Ex.: 01/07/2024 a 05/07/2024"></div>
                        <div class="campo"><label>CIDADE DO EVENTO, EXAME OU DEFESA</label><input type="text" name="cidade_evento" placeholder="Ex.: São Paulo"></div>
                        <div class="campo"><label>ESTADO DO EVENTO, EXAME OU DEFESA</label><input type="text" name="estado_evento" placeholder="Ex.: SP"></div>
                        <div class="campo"><label>PAÍS DO EVENTO, EXAME OU DEFESA</label><input type="text" name="pais_evento" placeholder="Ex.: Brasil"></div>
                        <div class="campo"><label>LINK DO EVENTO, EXAME OU DEFESA</label><input type="text" name="link_evento" placeholder="Ex.: https://cbm.org (opcional)"></div>
                        <div class="campo"><label>VALOR SOLICITADO (R$)</label><input type="text" name="valor" class="formatar-moeda" placeholder="Ex.: 1500"></div>
                        <div class="campo campo-longo"><label>DETALHAMENTO DO PEDIDO</label><textarea name="detalhamento" placeholder="Descreva os detalhes do pedido"></textarea></div>
                        <div class="campo"><label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label><select name="apresentacao" placeholder="Selecione"><option value="">Selecione</option><option value="Pôster">Pôster</option><option value="Apresentação oral">Apresentação oral</option><option value="Outra">Outra</option><option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option></select></div>
                    </div>
                </section>
                <section>
                    <h3>ENDEREÇO DO SOLICITANTE</h3>
                    <div class="grid">
                        <div class="campo"><label>DATA DE NASCIMENTO</label><input type="text" name="data_nascimento" class="formatar-data" placeholder="Ex.: 01/02/1980"></div>
                        <div class="campo"><label>LOGRADOURO</label><input type="text" name="logradouro" placeholder="Ex.: Rua do Matão"></div>
                        <div class="campo"><label>NÚMERO</label><input type="text" name="numero" placeholder="Ex.: 1010"></div>
                        <div class="campo"><label>COMPLEMENTO</label><input type="text" name="complemento" placeholder="Ex.: Casa 3 (opcional)"></div>
                        <div class="campo"><label>BAIRRO</label><input type="text" name="bairro" placeholder="Ex.: Butantã"></div>
                        <div class="campo"><label>CEP</label><input type="text" name="cep" class="formatar-cep" placeholder="Ex.: 05508-090"></div>
                        <div class="campo"><label>CIDADE</label><input type="text" name="cidade" placeholder="Ex.: São Paulo"></div>
                        <div class="campo"><label>ESTADO</label><input type="text" name="estado" placeholder="Ex.: SP"></div>
                    </div>
                </section>
                <section>
                    <h3>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h3>
                    <div class="grid">
                        <div class="campo"><label>CPF (SEPARADOS POR PONTOS E TRAÇO)</label><input type="text" name="cpf" class="formatar-cpf" placeholder="Ex.: 123.456.789-09"></div>
                        <div class="campo"><label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label><input type="text" name="rg" placeholder="Ex.: 12.345.678-9"></div>
                        <div class="campo"><label>NOME DO BANCO</label><input type="text" name="banco" placeholder="Ex.: Banco do Brasil"></div>
                        <div class="campo"><label>NÚMERO DA AGÊNCIA</label><input type="text" name="agencia" placeholder="Ex.: 1234"></div>
                        <div class="campo"><label>NÚMERO DA CONTA</label><input type="text" name="conta" placeholder="Ex.: 56789-X"></div>
                    </div>
                </section>
                <button type="submit" class="btn-enviar">Enviar solicitação</button>
            </form>
        </div>

        <div id="form-docentes" class="form-container" style="display:none">
            <div class="mensagens-erro"></div>
            <form id="docentes-form">
                <section>
                    <h3>SOLICITANTE E EVENTO</h3>
                    <div class="grid">
                        <div class="campo"><label>NOME COMPLETO - SEM ABREVIAR</label><input type="text" name="nome" placeholder="Ex.: João da Silva"></div>
                        <div class="campo"><label>N. USP</label><input type="text" name="nuspp" placeholder="Ex.: 9876543"></div>
                        <div class="campo"><label>PROGRAMA</label><input type="text" name="programa" placeholder="Ex.: Estatística"></div>
                        <div class="campo"><label>E-MAIL</label><input type="email" name="email" placeholder="Ex.: jose@ime.usp.br"></div>
                        <div class="campo"><label>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label><input type="text" name="evento" placeholder="Ex.: Seminário"></div>
                        <div class="campo"><label>PERÍODO DO EVENTO, EXAME OU DEFESA</label><input type="text" name="periodo" placeholder="Ex.: 10/08/2024"></div>
                        <div class="campo"><label>CIDADE DO EVENTO, EXAME OU DEFESA</label><input type="text" name="cidade_evento" placeholder="Ex.: Campinas"></div>
                        <div class="campo"><label>ESTADO DO EVENTO, EXAME OU DEFESA</label><input type="text" name="estado_evento" placeholder="Ex.: SP"></div>
                        <div class="campo"><label>PAÍS DO EVENTO, EXAME OU DEFESA</label><input type="text" name="pais_evento" placeholder="Ex.: Brasil"></div>
                        <div class="campo"><label>LINK DO EVENTO, EXAME OU DEFESA</label><input type="text" name="link_evento" placeholder="Ex.: https://site.org (opcional)"></div>
                        <div class="campo"><label>VALOR SOLICITADO (R$)</label><input type="text" name="valor" class="formatar-moeda" placeholder="Ex.: 20000"></div>
                        <div class="campo campo-longo"><label>DETALHAMENTO DO PEDIDO</label><textarea name="detalhamento" placeholder="Descreva os detalhes do pedido"></textarea></div>
                        <div class="campo"><label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label><select name="apresentacao" placeholder="Selecione"><option value="">Selecione</option><option value="Pôster">Pôster</option><option value="Apresentação oral">Apresentação oral</option><option value="Outra">Outra</option><option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option></select></div>
                    </div>
                </section>
                <section>
                    <h3>ENDEREÇO DO SOLICITANTE</h3>
                    <div class="grid">
                        <div class="campo"><label>DATA DE NASCIMENTO</label><input type="text" name="data_nascimento" class="formatar-data" placeholder="Ex.: 15/03/1975"></div>
                        <div class="campo"><label>LOGRADOURO</label><input type="text" name="logradouro" placeholder="Ex.: Av. Paulista"></div>
                        <div class="campo"><label>NÚMERO</label><input type="text" name="numero" placeholder="Ex.: 1000"></div>
                        <div class="campo"><label>COMPLEMENTO</label><input type="text" name="complemento" placeholder="Ex.: Apto 2 (opcional)"></div>
                        <div class="campo"><label>BAIRRO</label><input type="text" name="bairro" placeholder="Ex.: Bela Vista"></div>
                        <div class="campo"><label>CEP</label><input type="text" name="cep" class="formatar-cep" placeholder="Ex.: 01310-100"></div>
                        <div class="campo"><label>CIDADE</label><input type="text" name="cidade" placeholder="Ex.: São Paulo"></div>
                        <div class="campo"><label>ESTADO</label><input type="text" name="estado" placeholder="Ex.: SP"></div>
                    </div>
                </section>
                <section>
                    <h3>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h3>
                    <div class="grid">
                        <div class="campo"><label>CPF (SEPARADOS POR PONTOS E TRAÇO)</label><input type="text" name="cpf" class="formatar-cpf" placeholder="Ex.: 123.456.789-09"></div>
                        <div class="campo"><label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label><input type="text" name="rg" placeholder="Ex.: 9.876.543-2"></div>
                        <div class="campo"><label>NOME DO BANCO</label><input type="text" name="banco" placeholder="Ex.: Caixa"></div>
                        <div class="campo"><label>NÚMERO DA AGÊNCIA</label><input type="text" name="agencia" placeholder="Ex.: 5678"></div>
                        <div class="campo"><label>NÚMERO DA CONTA</label><input type="text" name="conta" placeholder="Ex.: 12345-6"></div>
                    </div>
                </section>
                <button type="submit" class="btn-enviar">Enviar solicitação</button>
            </form>
        </div>
    </main>

    <main id="tela-oficio" style="display:none">
        <h1>Solicitação registrada</h1>
        <pre id="conteudo-oficio"></pre>
    </main>

    <script src="/app.js"></script>
</body>
</html>
