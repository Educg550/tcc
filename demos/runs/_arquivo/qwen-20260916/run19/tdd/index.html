<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <img src="assets/usp-logo.png" alt="Universidade de São Paulo" class="logo">
  <div class="titulos">
    <span class="universidade">Universidade de São Paulo</span>
    <span class="programa">Instituto de Matemática e Estatística - Pós-Graduação</span>
  </div>
</header>

<main class="container">
  <nav class="abas">
    <button type="button" class="aba ativa" data-alvo="form-alunos">ALUNOS</button>
    <button type="button" class="aba" data-alvo="form-docentes">DOCENTES</button>
  </nav>

  <section id="erros" class="erros" hidden></section>

  <form id="form-alunos" class="formulario ativo" novalidate>
    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class="grade">
        <label>NOME COMPLETO - SEM ABREVIAR<input name="nome_completo" type="text" placeholder="Ex.: Maria Silva Souza"></label>
        <label>N. USP<input name="nusp" type="text" placeholder="Ex.: 1234567"></label>
        <label>PROGRAMA<input name="programa" type="text" placeholder="Ex.: Ciência da Computação"></label>
        <label>NÍVEL<select name="nivel"><option value="Mestrado">Mestrado</option><option value="Doutorado">Doutorado</option></select></label>
        <label>TIPO DE AUXÍLIO<select name="tipo_auxilio"><option value="Participação em evento">Participação em evento</option><option value="Banca de exame ou defesa">Banca de exame ou defesa</option><option value="Outro">Outro</option></select></label>
        <label>E-MAIL<input name="email" type="email" placeholder="Ex.: maria.silva@ime.usp.br"></label>
        <label class="larga">NOME DO EVENTO / BANCA DE EXAME OU DEFESA<input name="nome_evento" type="text" placeholder="Ex.: XXII Conferência Internacional de Computação"></label>
        <label>PERÍODO DO EVENTO, EXAME OU DEFESA<input name="periodo_evento" type="text" placeholder="Ex.: 10 a 14 de julho de 2026"></label>
        <label>CIDADE DO EVENTO, EXAME OU DEFESA<input name="cidade_evento" type="text" placeholder="Ex.: São Paulo"></label>
        <label>ESTADO DO EVENTO, EXAME OU DEFESA<input name="estado_evento" type="text" placeholder="Ex.: SP"></label>
        <label>PAÍS DO EVENTO, EXAME OU DEFESA<input name="pais_evento" type="text" placeholder="Ex.: Brasil"></label>
        <label>LINK DO EVENTO, EXAME OU DEFESA<input name="link_evento" type="text" placeholder="Ex.: https://example.com/evento (opcional)"></label>
        <label>VALOR SOLICITADO (R$)<input name="valor_solicitado" type="text" inputmode="numeric" placeholder="Ex.: R$ 1.500,00"></label>
        <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?<select name="apresentar_trabalho"><option value="Pôster">Pôster</option><option value="Apresentação oral">Apresentação oral</option><option value="Outra">Outra</option><option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option></select></label>
        <label class="larga">DETALHAMENTO DO PEDIDO<textarea name="detalhamento" rows="2" placeholder="Ex.: Participação como ouvinte na conferência principal."></textarea></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class="grade">
        <label>DATA DE NASCIMENTO<input name="data_nascimento" type="text" inputmode="numeric" placeholder="Ex.: 01/02/1980"></label>
        <label>LOGRADOURO<input name="logradouro" type="text" placeholder="Ex.: Rua do Matão"></label>
        <label>NÚMERO<input name="numero" type="text" placeholder="Ex.: 1010"></label>
        <label>COMPLEMENTO<input name="complemento" type="text" placeholder="Ex.: Apto 501 (opcional)"></label>
        <label>BAIRRO<input name="bairro" type="text" placeholder="Ex.: Cidade Universitária"></label>
        <label>CEP<input name="cep" type="text" inputmode="numeric" placeholder="Ex.: 05508-090"></label>
        <label>CIDADE<input name="cidade" type="text" placeholder="Ex.: São Paulo"></label>
        <label>ESTADO<input name="estado" type="text" placeholder="Ex.: SP"></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="grade">
        <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input name="cpf" type="text" inputmode="numeric" placeholder="Ex.: 123.456.789-09"></label>
        <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input name="rg_rnm" type="text" placeholder="Ex.: 12.345.678-9"></label>
        <label>NOME DO BANCO<input name="nome_banco" type="text" placeholder="Ex.: Banco do Brasil"></label>
        <label>NÚMERO DA AGÊNCIA<input name="numero_agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234"></label>
        <label>NÚMERO DA CONTA<input name="numero_conta" type="text" placeholder="Ex.: 56789-0"></label>
      </div>
    </fieldset>
    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>

  <form id="form-docentes" class="formulario" novalidate>
    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class="grade">
        <label>NOME COMPLETO - SEM ABREVIAR<input name="nome_completo" type="text" placeholder="Ex.: João Oliveira"></label>
        <label>N. USP<input name="nusp" type="text" placeholder="Ex.: 7654321"></label>
        <label>PROGRAMA<input name="programa" type="text" placeholder="Ex.: Matemática"></label>
        <label>E-MAIL<input name="email" type="email" placeholder="Ex.: joao.oliveira@ime.usp.br"></label>
        <label class="larga">NOME DO EVENTO / BANCA DE EXAME OU DEFESA<input name="nome_evento" type="text" placeholder="Ex.: Colóquio de Matemática"></label>
        <label>PERÍODO DO EVENTO, EXAME OU DEFESA<input name="periodo_evento" type="text" placeholder="Ex.: 01 a 05 de agosto de 2026"></label>
        <label>CIDADE DO EVENTO, EXAME OU DEFESA<input name="cidade_evento" type="text" placeholder="Ex.: Rio de Janeiro"></label>
        <label>ESTADO DO EVENTO, EXAME OU DEFESA<input name="estado_evento" type="text" placeholder="Ex.: RJ"></label>
        <label>PAÍS DO EVENTO, EXAME OU DEFESA<input name="pais_evento" type="text" placeholder="Ex.: Brasil"></label>
        <label>LINK DO EVENTO, EXAME OU DEFESA<input name="link_evento" type="text" placeholder="Ex.: https://example.com/coloquio (opcional)"></label>
        <label>VALOR SOLICITADO (R$)<input name="valor_solicitado" type="text" inputmode="numeric" placeholder="Ex.: R$ 2.500,00"></label>
        <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?<select name="apresentar_trabalho"><option value="Pôster">Pôster</option><option value="Apresentação oral">Apresentação oral</option><option value="Outra">Outra</option><option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option></select></label>
        <label class="larga">DETALHAMENTO DO PEDIDO<textarea name="detalhamento" rows="2" placeholder="Ex.: Organização e participação no colóquio."></textarea></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class="grade">
        <label>DATA DE NASCIMENTO<input name="data_nascimento" type="text" inputmode="numeric" placeholder="Ex.: 15/03/1975"></label>
        <label>LOGRADOURO<input name="logradouro" type="text" placeholder="Ex.: Av. Prof. Almeida Prado"></label>
        <label>NÚMERO<input name="numero" type="text" placeholder="Ex.: 532"></label>
        <label>COMPLEMENTO<input name="complemento" type="text" placeholder="Ex.: Apto 501 (opcional)"></label>
        <label>BAIRRO<input name="bairro" type="text" placeholder="Ex.: Butantã"></label>
        <label>CEP<input name="cep" type="text" inputmode="numeric" placeholder="Ex.: 05508-090"></label>
        <label>CIDADE<input name="cidade" type="text" placeholder="Ex.: São Paulo"></label>
        <label>ESTADO<input name="estado" type="text" placeholder="Ex.: SP"></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="grade">
        <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input name="cpf" type="text" inputmode="numeric" placeholder="Ex.: 123.456.789-09"></label>
        <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input name="rg_rnm" type="text" placeholder="Ex.: 11.222.333-4"></label>
        <label>NOME DO BANCO<input name="nome_banco" type="text" placeholder="Ex.: Caixa Econômica Federal"></label>
        <label>NÚMERO DA AGÊNCIA<input name="numero_agencia" type="text" inputmode="numeric" placeholder="Ex.: 4321"></label>
        <label>NÚMERO DA CONTA<input name="numero_conta" type="text" placeholder="Ex.: 10000-1"></label>
      </div>
    </fieldset>
    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>

  <section id="confirmacao" class="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio" class="oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
