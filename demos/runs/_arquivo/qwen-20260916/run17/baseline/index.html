<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="logo-box">
                <img src="assets/usp-logo.png" alt="Logo USP">
            </div>
            <div class="titulos">
                <h1>Universidade de São Paulo</h1>
                <h2>Instituto de Matemática e Estatística</h2>
                <p>Solicitação de Auxílio Financeiro</p>
            </div>
        </div>
    </header>

    <main>
        <div class="tabs">
            <button class="tab active" data-target="form-alunos">ALUNOS</button>
            <button class="tab" data-target="form-docentes">DOCENTES</button>
        </div>
        <div id="erros" class="erros-box" hidden></div>

        <form id="form-alunos" class="tab-content active">
            <h3 class="bloco">SOLICITANTE E EVENTO</h3>
            <div class="grid-3">
                <label><span>NOME COMPLETO - SEM ABREVIAR</span><input type="text" name="nome" placeholder="Ex: Fulano de Tal"></label>
                <label><span>N. USP</span><input type="text" name="nusp" placeholder="Ex: 1234567890123"></label>
                <label><span>PROGRAMA</span><input type="text" name="programa" placeholder="Ex: Estatística"></label>
                <label><span>NÍVEL</span><select name="nivel"><option value="Mestrado">Mestrado</option><option value="Doutorado">Doutorado</option></select></label>
                <label><span>TIPO DE AUXÍLIO</span><select name="tipo"><option value="Participação em evento">Participação em evento</option><option value="Banca de exame ou defesa">Banca de exame ou defesa</option><option value="Outro">Outro</option></select></label>
                <label><span>E-MAIL</span><input type="text" name="email" placeholder="Ex: fulano@ime.usp.br"></label>
            </div>
            <div class="grid-3">
                <label><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input type="text" name="evento" placeholder="Ex: Evento internacional de matemática"></label>
                <label><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="periodo" placeholder="Ex: 10 a 15 de agosto de 2024"></label>
                <label><span>CIDADE DO EVENTO, EXAME OU DEFESA</span><input type="text" name="cidade_evento" placeholder="Ex: São Paulo"></label>
                <label><span>ESTADO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="estado_evento" placeholder="Ex: SP"></label>
                <label><span>PAÍS DO EVENTO, EXAME OU DEFESA</span><input type="text" name="pais_evento" placeholder="Ex: Brasil"></label>
                <label><span>LINK DO EVENTO, EXAME OU DEFESA</span><input type="text" name="link" placeholder="Ex: https://eventomatematica.com.br"></label>
            </div>
            <div class="grid-3">
                <label><span>VALOR SOLICITADO (R$)</span><input type="text" name="valor" class="autoformat" placeholder="Ex: 150000"></label>
                <label class="colspan-2"><span>DETALHAMENTO DO PEDIDO</span><textarea name="detalhamento" placeholder="Ex: Solicitação de passagem para evento internacional"></textarea></label>
            </div>
            <div class="grid-3">
                <label class="colspan-3"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span><select name="apresentacao"><option value="Pôster">Pôster</option><option value="Apresentação oral">Apresentação oral</option><option value="Outra">Outra</option><option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option></select></label>
            </div>

            <h3 class="bloco">ENDEREÇO DO SOLICITANTE</h3>
            <div class="grid-3">
                <label><span>DATA DE NASCIMENTO</span><input type="text" name="data_nascimento" class="autoformat" placeholder="Ex: 01021980"></label>
                <label><span>LOGRADOURO</span><input type="text" name="logradouro" placeholder="Ex: Rua do Matão"></label>
                <label><span>NÚMERO</span><input type="text" name="numero" placeholder="Ex: 1010"></label>
                <label><span>COMPLEMENTO</span><input type="text" name="complemento" placeholder="Ex: Apto 12"></label>
                <label><span>BAIRRO</span><input type="text" name="bairro" placeholder="Ex: Butantã"></label>
                <label><span>CEP</span><input type="text" name="cep" class="autoformat" placeholder="Ex: 05508090"></label>
                <label><span>CIDADE</span><input type="text" name="cidade" placeholder="Ex: São Paulo"></label>
                <label><span>ESTADO</span><input type="text" name="estado" placeholder="Ex: SP"></label>
            </div>

            <h3 class="bloco">INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h3>
            <div class="grid-3">
                <label><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" name="cpf" class="autoformat" placeholder="Ex: 12345678909"></label>
                <label><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" name="rg" placeholder="Ex: 123.456.789-0"></label>
                <label><span>NOME DO BANCO</span><input type="text" name="banco" placeholder="Ex: Banco do Brasil"></label>
                <label><span>NÚMERO DA AGÊNCIA</span><input type="text" name="agencia" placeholder="Ex: 1234"></label>
                <label><span>NÚMERO DA CONTA</span><input type="text" name="conta" placeholder="Ex: 12345678-9"></label>
            </div>
            <button type="submit" class="btn-enviar">Enviar solicitação</button>
        </form>

        <form id="form-docentes" class="tab-content">
            <h3 class="bloco">SOLICITANTE E EVENTO</h3>
            <div class="grid-3">
                <label><span>NOME COMPLETO - SEM ABREVIAR</span><input type="text" name="nome" placeholder="Ex: Professor de Matemática"></label>
                <label><span>N. USP</span><input type="text" name="nusp" placeholder="Ex: 9876543210987"></label>
                <label><span>PROGRAMA</span><input type="text" name="programa" placeholder="Ex: Matemática"></label>
                <label><span>E-MAIL</span><input type="text" name="email" placeholder="Ex: profmat@ime.usp.br"></label>
            </div>
            <div class="grid-3">
                <label><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input type="text" name="evento" placeholder="Ex: Banca de Defesa de Doutorado"></label>
                <label><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="periodo" placeholder="Ex: 20/09/2024"></label>
                <label><span>CIDADE DO EVENTO, EXAME OU DEFESA</span><input type="text" name="cidade_evento" placeholder="Ex: São Paulo"></label>
                <label><span>ESTADO DO EVENTO, EXAME OU DEFESA</span><input type="text" name="estado_evento" placeholder="Ex: SP"></label>
                <label><span>PAÍS DO EVENTO, EXAME OU DEFESA</span><input type="text" name="pais_evento" placeholder="Ex: Brasil"></label>
                <label><span>LINK DO EVENTO, EXAME OU DEFESA</span><input type="text" name="link" placeholder="Ex: https://bancadefesa.edu.br"></label>
            </div>
            <div class="grid-3">
                <label><span>VALOR SOLICITADO (R$)</span><input type="text" name="valor" class="autoformat" placeholder="Ex: 50000"></label>
                <label class="colspan-2"><span>DETALHAMENTO DO PEDIDO</span><textarea name="detalhamento" placeholder="Ex: Solicitação de auxílio para banca externa"></textarea></label>
            </div>
            <div class="grid-3">
                <label class="colspan-3"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span><select name="apresentacao"><option value="Pôster">Pôster</option><option value="Apresentação oral">Apresentação oral</option><option value="Outra">Outra</option><option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option></select></label>
            </div>

            <h3 class="bloco">ENDEREÇO DO SOLICITANTE</h3>
            <div class="grid-3">
                <label><span>DATA DE NASCIMENTO</span><input type="text" name="data_nascimento" class="autoformat" placeholder="Ex: 15051975"></label>
                <label><span>LOGRADOURO</span><input type="text" name="logradouro" placeholder="Ex: Rua da Praça"></label>
                <label><span>NÚMERO</span><input type="text" name="numero" placeholder="Ex: 200"></label>
                <label><span>COMPLEMENTO</span><input type="text" name="complemento" placeholder="Ex: Sala 45"></label>
                <label><span>BAIRRO</span><input type="text" name="bairro" placeholder="Ex: Centro"></label>
                <label><span>CEP</span><input type="text" name="cep" class="autoformat" placeholder="Ex: 01001000"></label>
                <label><span>CIDADE</span><input type="text" name="cidade" placeholder="Ex: São Paulo"></label>
                <label><span>ESTADO</span><input type="text" name="estado" placeholder="Ex: SP"></label>
            </div>

            <h3 class="bloco">INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h3>
            <div class="grid-3">
                <label><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" name="cpf" class="autoformat" placeholder="Ex: 98765432100"></label>
                <label><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input type="text" name="rg" placeholder="Ex: 456.789.012-3"></label>
                <label><span>NOME DO BANCO</span><input type="text" name="banco" placeholder="Ex: Bradesco"></label>
                <label><span>NÚMERO DA AGÊNCIA</span><input type="text" name="agencia" placeholder="Ex: 0001"></label>
                <label><span>NÚMERO DA CONTA</span><input type="text" name="conta" placeholder="Ex: 8765432-1"></label>
            </div>
            <button type="submit" class="btn-enviar">Enviar solicitação</button>
        </form>

        <div id="confirmacao" class="tab-content">
            <h1 class="titulo-oficio">Solicitação registrada</h1>
            <pre id="texto-oficio" class="oficio"></pre>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
