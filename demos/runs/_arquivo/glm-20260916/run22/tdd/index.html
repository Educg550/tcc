<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identidade">
    <h1>Universidade de São Paulo</h1>
    <p class="programa">Programa de Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>
<main>
  <nav class="abas" id="abas">
    <button type="button" class="aba ativa" data-form="form-alunos">ALUNOS</button>
    <button type="button" class="aba" data-form="form-docentes">DOCENTES</button>
  </nav>
  <section id="formularios">
    <form id="form-alunos" class="formulario" novalidate>
      <div class="erros" hidden></div>
      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="campos">
          <div class="campo span-2">
            <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="a-nome" name="NOME COMPLETO - SEM ABREVIAR" type="text" placeholder="Maria Souza da Silva">
          </div>
          <div class="campo">
            <label for="a-n-usp">N. USP</label>
            <input id="a-n-usp" name="N. USP" type="text" inputmode="numeric" placeholder="1234567">
          </div>
          <div class="campo span-2">
            <label for="a-programa">PROGRAMA</label>
            <input id="a-programa" name="PROGRAMA" type="text" placeholder="Ciência da Computação">
          </div>
          <div class="campo">
            <label for="a-nivel">NÍVEL</label>
            <select id="a-nivel" name="nivel">
              <option value="">Selecione</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class="campo span-2">
            <label for="a-tipo-auxilio">TIPO DE AUXÍLIO</label>
            <select id="a-tipo-auxilio" name="tipoAuxilio">
              <option value="">Selecione</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>
          <div class="campo span-2">
            <label for="a-email">E-MAIL</label>
            <input id="a-email" name="E-MAIL" type="email" placeholder="nome@usp.br">
          </div>
          <div class="campo span-2">
            <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="a-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" type="text" placeholder="SBBD 2025">
          </div>
          <div class="campo span-2">
            <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="10 a 14 de outubro de 2025">
          </div>
          <div class="campo">
            <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" type="text" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="SP">
          </div>
          <div class="campo">
            <label for="a-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Brasil">
          </div>
          <div class="campo">
            <label for="a-link-evento">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-link-evento" name="LINK DO EVENTO, EXAME OU DEFESA" type="text" placeholder="https://evento.org.br">
          </div>
          <div class="campo span-2">
            <label for="a-valor">VALOR SOLICITADO (R$)</label>
            <input id="a-valor" name="VALOR SOLICITADO (R$)" type="text" inputmode="numeric" class="campo-moeda" placeholder="Ex.: 150000">
          </div>
          <div class="campo span-3">
            <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="a-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Ex.: passagem aérea, inscrição e diárias"></textarea>
          </div>
          <div class="campo span-2">
            <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="a-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="campos">
          <div class="campo">
            <label for="a-nascimento">DATA DE NASCIMENTO</label>
            <input id="a-nascimento" name="DATA DE NASCIMENTO" type="text" inputmode="numeric" class="campo-data" placeholder="01021980">
          </div>
          <div class="campo span-2">
            <label for="a-logradouro">LOGRADOURO</label>
            <input id="a-logradouro" name="LOGRADOURO" type="text" placeholder="Rua do Anfiteatro">
          </div>
          <div class="campo">
            <label for="a-numero">NÚMERO</label>
            <input id="a-numero" name="NÚMERO" type="text" placeholder="123">
          </div>
          <div class="campo">
            <label for="a-complemento">COMPLEMENTO</label>
            <input id="a-complemento" name="COMPLEMENTO" type="text" placeholder="Sala 5">
          </div>
          <div class="campo">
            <label for="a-bairro">BAIRRO</label>
            <input id="a-bairro" name="BAIRRO" type="text" placeholder="Cidade Universitária">
          </div>
          <div class="campo">
            <label for="a-cep">CEP</label>
            <input id="a-cep" name="CEP" type="text" inputmode="numeric" class="campo-cep" placeholder="05508090">
          </div>
          <div class="campo span-2">
            <label for="a-cidade">CIDADE</label>
            <input id="a-cidade" name="CIDADE" type="text" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="a-estado">ESTADO</label>
            <input id="a-estado" name="ESTADO" type="text" placeholder="SP">
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="campos">
          <div class="campo">
            <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" type="text" inputmode="numeric" class="campo-cpf" placeholder="12345678909">
          </div>
          <div class="campo">
            <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo">
            <label for="a-banco">NOME DO BANCO</label>
            <input id="a-banco" name="NOME DO BANCO" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo">
            <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="a-agencia" name="NÚMERO DA AGÊNCIA" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo">
            <label for="a-conta">NÚMERO DA CONTA</label>
            <input id="a-conta" name="NÚMERO DA CONTA" type="text" placeholder="98765-4">
          </div>
        </div>
      </fieldset>
      <button type="submit">Enviar solicitação</button>
    </form>
    <form id="form-docentes" class="formulario" hidden novalidate>
      <div class="erros" hidden></div>
      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="campos">
          <div class="campo span-2">
            <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="d-nome" name="NOME COMPLETO - SEM ABREVIAR" type="text" placeholder="João Almeida Ferreira">
          </div>
          <div class="campo">
            <label for="d-n-usp">N. USP</label>
            <input id="d-n-usp" name="N. USP" type="text" inputmode="numeric" placeholder="1234567">
          </div>
          <div class="campo span-2">
            <label for="d-programa">PROGRAMA</label>
            <input id="d-programa" name="PROGRAMA" type="text" placeholder="Estatística">
          </div>
          <div class="campo span-2">
            <label for="d-email">E-MAIL</label>
            <input id="d-email" name="E-MAIL" type="email" placeholder="nome@usp.br">
          </div>
          <div class="campo span-2">
            <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="d-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" type="text" placeholder="Banca de mestrado de Maria Souza">
          </div>
          <div class="campo">
            <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="10 a 14 de outubro de 2025">
          </div>
          <div class="campo">
            <label for="d-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" type="text" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="SP">
          </div>
          <div class="campo">
            <label for="d-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Brasil">
          </div>
          <div class="campo">
            <label for="d-link-evento">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-link-evento" name="LINK DO EVENTO, EXAME OU DEFESA" type="text" placeholder="https://evento.org.br">
          </div>
          <div class="campo">
            <label for="d-valor">VALOR SOLICITADO (R$)</label>
            <input id="d-valor" name="VALOR SOLICITADO (R$)" type="text" inputmode="numeric" class="campo-moeda" placeholder="Ex.: 150000">
          </div>
          <div class="campo span-3">
            <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="d-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Ex.: passagem aérea e diárias"></textarea>
          </div>
          <div class="campo span-2">
            <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="d-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="campos">
          <div class="campo">
            <label for="d-nascimento">DATA DE NASCIMENTO</label>
            <input id="d-nascimento" name="DATA DE NASCIMENTO" type="text" inputmode="numeric" class="campo-data" placeholder="01021980">
          </div>
          <div class="campo span-2">
            <label for="d-logradouro">LOGRADOURO</label>
            <input id="d-logradouro" name="LOGRADOURO" type="text" placeholder="Rua do Anfiteatro">
          </div>
          <div class="campo">
            <label for="d-numero">NÚMERO</label>
            <input id="d-numero" name="NÚMERO" type="text" placeholder="123">
          </div>
          <div class="campo">
            <label for="d-complemento">COMPLEMENTO</label>
            <input id="d-complemento" name="COMPLEMENTO" type="text" placeholder="Sala 5">
          </div>
          <div class="campo">
            <label for="d-bairro">BAIRRO</label>
            <input id="d-bairro" name="BAIRRO" type="text" placeholder="Cidade Universitária">
          </div>
          <div class="campo">
            <label for="d-cep">CEP</label>
            <input id="d-cep" name="CEP" type="text" inputmode="numeric" class="campo-cep" placeholder="05508090">
          </div>
          <div class="campo span-2">
            <label for="d-cidade">CIDADE</label>
            <input id="d-cidade" name="CIDADE" type="text" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="d-estado">ESTADO</label>
            <input id="d-estado" name="ESTADO" type="text" placeholder="SP">
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="campos">
          <div class="campo">
            <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" type="text" inputmode="numeric" class="campo-cpf" placeholder="12345678909">
          </div>
          <div class="campo">
            <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo">
            <label for="d-banco">NOME DO BANCO</label>
            <input id="d-banco" name="NOME DO BANCO" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo">
            <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="d-agencia" name="NÚMERO DA AGÊNCIA" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo">
            <label for="d-conta">NÚMERO DA CONTA</label>
            <input id="d-conta" name="NÚMERO DA CONTA" type="text" placeholder="98765-4">
          </div>
        </div>
      </fieldset>
      <button type="submit">Enviar solicitação</button>
    </form>
  </section>
  <section id="confirmacao" class="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>
</main>
</body>
</html>
