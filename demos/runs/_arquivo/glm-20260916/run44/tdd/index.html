<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro — Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="identidade">
      <h1>Universidade de São Paulo</h1>
      <p class="subtitulo">Instituto de Matemática e Estatística — Programa de Pós-Graduação</p>
    </div>
  </header>

  <div id="visao-formularios">
    <nav class="abas" aria-label="Escolha o tipo de solicitante">
      <button type="button" class="aba ativa" id="aba-alunos" data-alvo="painel-alunos">ALUNOS</button>
      <button type="button" class="aba" id="aba-docentes" data-alvo="painel-docentes">DOCENTES</button>
    </nav>

    <main>
      <section class="painel" id="painel-alunos">
        <div class="erros" id="erros-alunos" hidden></div>
        <form id="form-alunos" novalidate>
          <fieldset>
            <legend>SOLICITANTE E EVENTO</legend>
            <div class="campos">
              <div class="campo c5">
                <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
                <input id="a-nome" name="nome_completo" type="text" placeholder="Ex.: Maria Souza da Silva">
              </div>
              <div class="campo c2">
                <label for="a-nusp">N. USP</label>
                <input id="a-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="Ex.: 1234567">
              </div>
              <div class="campo c5">
                <label for="a-programa">PROGRAMA</label>
                <input id="a-programa" name="programa" type="text" placeholder="Ex.: Ciência da Computação">
              </div>
              <div class="campo c2">
                <label for="a-nivel">NÍVEL</label>
                <select id="a-nivel" name="nivel">
                  <option value="">Selecione</option>
                  <option>Mestrado</option>
                  <option>Doutorado</option>
                </select>
              </div>
              <div class="campo c4">
                <label for="a-tipo">TIPO DE AUXÍLIO</label>
                <select id="a-tipo" name="tipo_de_auxilio">
                  <option value="">Selecione</option>
                  <option>Participação em evento</option>
                  <option>Banca de exame ou defesa</option>
                  <option>Outro</option>
                </select>
              </div>
              <div class="campo c3">
                <label for="a-email">E-MAIL</label>
                <input id="a-email" name="email" type="email" placeholder="Ex.: maria@usp.br">
              </div>
              <div class="campo c5">
                <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
                <input id="a-evento" name="nome_do_evento" type="text" placeholder="Ex.: Congresso Brasileiro de Computação">
              </div>
              <div class="campo c4">
                <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
                <input id="a-periodo" name="periodo_do_evento" type="text" placeholder="Ex.: 01/07/2025 a 05/07/2025">
              </div>
              <div class="campo c3">
                <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
                <input id="a-cidade-evento" name="cidade_do_evento" type="text" placeholder="Ex.: São Paulo">
              </div>
              <div class="campo c2">
                <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
                <input id="a-estado-evento" name="estado_do_evento" type="text" placeholder="Ex.: SP">
              </div>
              <div class="campo c3">
                <label for="a-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
                <input id="a-pais-evento" name="pais_do_evento" type="text" placeholder="Ex.: Brasil">
              </div>
              <div class="campo c4">
                <label for="a-link">LINK DO EVENTO, EXAME OU DEFESA</label>
                <input id="a-link" name="link_do_evento" type="text" placeholder="Ex.: https://evento.example.br">
              </div>
              <div class="campo c2">
                <label for="a-valor">VALOR SOLICITADO (R$)</label>
                <input id="a-valor" name="valor_solicitado" type="text" inputmode="numeric" data-formato="moeda" placeholder="Ex.: R$ 1.500,00">
              </div>
              <div class="campo c6">
                <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
                <textarea id="a-detalhamento" name="detalhamento_do_pedido" rows="3" placeholder="Ex.: Passagens aéreas e hospedagem para os dias do evento"></textarea>
              </div>
              <div class="campo c6">
                <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
                <select id="a-apresentacao" name="ira_apresentar_trabalho">
                  <option value="">Selecione</option>
                  <option>Pôster</option>
                  <option>Apresentação oral</option>
                  <option>Outra</option>
                  <option>Não irá apresentar trabalho</option>
                </select>
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>ENDEREÇO DO SOLICITANTE</legend>
            <div class="campos">
              <div class="campo c2">
                <label for="a-nascimento">DATA DE NASCIMENTO</label>
                <input id="a-nascimento" name="data_de_nascimento" type="text" inputmode="numeric" data-formato="data" placeholder="Ex.: 01/02/1980">
              </div>
              <div class="campo c5">
                <label for="a-logradouro">LOGRADOURO</label>
                <input id="a-logradouro" name="logradouro" type="text" placeholder="Ex.: Rua do Anfiteatro">
              </div>
              <div class="campo c2">
                <label for="a-numero">NÚMERO</label>
                <input id="a-numero" name="numero" type="text" placeholder="Ex.: 101">
              </div>
              <div class="campo c3">
                <label for="a-complemento">COMPLEMENTO</label>
                <input id="a-complemento" name="complemento" type="text" placeholder="Ex.: Sala 5">
              </div>
              <div class="campo c4">
                <label for="a-bairro">BAIRRO</label>
                <input id="a-bairro" name="bairro" type="text" placeholder="Ex.: Butantã">
              </div>
              <div class="campo c2">
                <label for="a-cep">CEP</label>
                <input id="a-cep" name="cep" type="text" inputmode="numeric" data-formato="cep" placeholder="Ex.: 05508-090">
              </div>
              <div class="campo c3">
                <label for="a-cidade">CIDADE</label>
                <input id="a-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
              </div>
              <div class="campo c3">
                <label for="a-estado">ESTADO</label>
                <input id="a-estado" name="estado" type="text" placeholder="Ex.: SP">
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
            <div class="campos">
              <div class="campo c3">
                <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
                <input id="a-cpf" name="cpf" type="text" inputmode="numeric" data-formato="cpf" placeholder="Ex.: 123.456.789-09">
              </div>
              <div class="campo c3">
                <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
                <input id="a-rg" name="rg_rnm" type="text" placeholder="Ex.: 12.345.678-9">
              </div>
              <div class="campo c2">
                <label for="a-banco">NOME DO BANCO</label>
                <input id="a-banco" name="nome_do_banco" type="text" placeholder="Ex.: Banco do Brasil">
              </div>
              <div class="campo c2">
                <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
                <input id="a-agencia" name="numero_da_agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234">
              </div>
              <div class="campo c2">
                <label for="a-conta">NÚMERO DA CONTA</label>
                <input id="a-conta" name="numero_da_conta" type="text" placeholder="Ex.: 98765-4">
              </div>
            </div>
          </fieldset>

          <div class="acoes">
            <button class="enviar" type="submit">Enviar solicitação</button>
          </div>
        </form>
      </section>

      <section class="painel" id="painel-docentes" hidden>
        <div class="erros" id="erros-docentes" hidden></div>
        <form id="form-docentes" novalidate>
          <fieldset>
            <legend>SOLICITANTE E EVENTO</legend>
            <div class="campos">
              <div class="campo c5">
                <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
                <input id="d-nome" name="nome_completo" type="text" placeholder="Ex.: João Pereira Alves">
              </div>
              <div class="campo c2">
                <label for="d-nusp">N. USP</label>
                <input id="d-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="Ex.: 1234567">
              </div>
              <div class="campo c5">
                <label for="d-programa">PROGRAMA</label>
                <input id="d-programa" name="programa" type="text" placeholder="Ex.: Ciência da Computação">
              </div>
              <div class="campo c3">
                <label for="d-email">E-MAIL</label>
                <input id="d-email" name="email" type="email" placeholder="Ex.: joao@ime.usp.br">
              </div>
              <div class="campo c5">
                <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
                <input id="d-evento" name="nome_do_evento" type="text" placeholder="Ex.: Congresso Brasileiro de Computação">
              </div>
              <div class="campo c4">
                <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
                <input id="d-periodo" name="periodo_do_evento" type="text" placeholder="Ex.: 01/07/2025 a 05/07/2025">
              </div>
              <div class="campo c3">
                <label for="d-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
                <input id="d-cidade-evento" name="cidade_do_evento" type="text" placeholder="Ex.: São Paulo">
              </div>
              <div class="campo c2">
                <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
                <input id="d-estado-evento" name="estado_do_evento" type="text" placeholder="Ex.: SP">
              </div>
              <div class="campo c3">
                <label for="d-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
                <input id="d-pais-evento" name="pais_do_evento" type="text" placeholder="Ex.: Brasil">
              </div>
              <div class="campo c4">
                <label for="d-link">LINK DO EVENTO, EXAME OU DEFESA</label>
                <input id="d-link" name="link_do_evento" type="text" placeholder="Ex.: https://evento.example.br">
              </div>
              <div class="campo c2">
                <label for="d-valor">VALOR SOLICITADO (R$)</label>
                <input id="d-valor" name="valor_solicitado" type="text" inputmode="numeric" data-formato="moeda" placeholder="Ex.: R$ 1.500,00">
              </div>
              <div class="campo c6">
                <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
                <textarea id="d-detalhamento" name="detalhamento_do_pedido" rows="3" placeholder="Ex.: Passagens aéreas e hospedagem para os dias do evento"></textarea>
              </div>
              <div class="campo c4">
                <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
                <select id="d-apresentacao" name="ira_apresentar_trabalho">
                  <option value="">Selecione</option>
                  <option>Pôster</option>
                  <option>Apresentação oral</option>
                  <option>Outra</option>
                  <option>Não irá apresentar trabalho</option>
                </select>
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>ENDEREÇO DO SOLICITANTE</legend>
            <div class="campos">
              <div class="campo c2">
                <label for="d-nascimento">DATA DE NASCIMENTO</label>
                <input id="d-nascimento" name="data_de_nascimento" type="text" inputmode="numeric" data-formato="data" placeholder="Ex.: 01/02/1980">
              </div>
              <div class="campo c5">
                <label for="d-logradouro">LOGRADOURO</label>
                <input id="d-logradouro" name="logradouro" type="text" placeholder="Ex.: Rua do Matão">
              </div>
              <div class="campo c2">
                <label for="d-numero">NÚMERO</label>
                <input id="d-numero" name="numero" type="text" placeholder="Ex.: 1010">
              </div>
              <div class="campo c3">
                <label for="d-complemento">COMPLEMENTO</label>
                <input id="d-complemento" name="complemento" type="text" placeholder="Ex.: Sala 5">
              </div>
              <div class="campo c4">
                <label for="d-bairro">BAIRRO</label>
                <input id="d-bairro" name="bairro" type="text" placeholder="Ex.: Cidade Universitária">
              </div>
              <div class="campo c2">
                <label for="d-cep">CEP</label>
                <input id="d-cep" name="cep" type="text" inputmode="numeric" data-formato="cep" placeholder="Ex.: 05508-090">
              </div>
              <div class="campo c3">
                <label for="d-cidade">CIDADE</label>
                <input id="d-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
              </div>
              <div class="campo c3">
                <label for="d-estado">ESTADO</label>
                <input id="d-estado" name="estado" type="text" placeholder="Ex.: SP">
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
            <div class="campos">
              <div class="campo c3">
                <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
                <input id="d-cpf" name="cpf" type="text" inputmode="numeric" data-formato="cpf" placeholder="Ex.: 123.456.789-09">
              </div>
              <div class="campo c3">
                <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
                <input id="d-rg" name="rg_rnm" type="text" placeholder="Ex.: 12.345.678-9">
              </div>
              <div class="campo c2">
                <label for="d-banco">NOME DO BANCO</label>
                <input id="d-banco" name="nome_do_banco" type="text" placeholder="Ex.: Banco do Brasil">
              </div>
              <div class="campo c2">
                <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
                <input id="d-agencia" name="numero_da_agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234">
              </div>
              <div class="campo c2">
                <label for="d-conta">NÚMERO DA CONTA</label>
                <input id="d-conta" name="numero_da_conta" type="text" placeholder="Ex.: 98765-4">
              </div>
            </div>
          </fieldset>

          <div class="acoes">
            <button class="enviar" type="submit">Enviar solicitação</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <section id="confirmacao" hidden>
    <main>
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </main>
  </section>

  <script src="app.js"></script>
</body>
</html>
