<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel='stylesheet' href='style.css'>
</head>
<body>
  <header class='cabecalho'>
    <div class='logo'>
      <img src='assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
    </div>
    <div>
      <h1>Universidade de São Paulo</h1>
      <p>Programa de Pós-Graduação do Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <div class='abas' id='abas' role='tablist'>
    <button type='button' class='aba ativa' data-alvo='alunos' aria-selected='true'>ALUNOS</button>
    <button type='button' class='aba' data-alvo='docentes' aria-selected='false'>DOCENTES</button>
  </div>

  <main id='conteudo'>
    <section id='painel-alunos' class='painel-formulario'>
      <form id='form-alunos' class='formulario' data-tipo='alunos' novalidate>
        <div class='erros oculto' role='alert'></div>

        <h2 class='bloco-titulo'>SOLICITANTE E EVENTO</h2>
        <div class='linha'>
          <div class='campo f3'>
            <label for='alunos-nome'>NOME COMPLETO - SEM ABREVIAR</label>
            <input type='text' id='alunos-nome' name='nome' placeholder='Maria de Souza Silva'>
          </div>
          <div class='campo f1'>
            <label for='alunos-n-usp'>N. USP</label>
            <input type='text' id='alunos-n-usp' name='n_usp' placeholder='1234567' inputmode='numeric'>
          </div>
          <div class='campo f2'>
            <label for='alunos-programa'>PROGRAMA</label>
            <input type='text' id='alunos-programa' name='programa' placeholder='Ciência da Computação'>
          </div>
        </div>
        <div class='linha'>
          <div class='campo f1'>
            <label for='alunos-nivel'>NÍVEL</label>
            <select id='alunos-nivel' name='nivel'>
              <option value=''>Selecione...</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class='campo f2'>
            <label for='alunos-tipo-auxilio'>TIPO DE AUXÍLIO</label>
            <select id='alunos-tipo-auxilio' name='tipo_auxilio'>
              <option value=''>Selecione...</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>
          <div class='campo f3'>
            <label for='alunos-email'>E-MAIL</label>
            <input type='text' id='alunos-email' name='email' placeholder='maria.silva@usp.br'>
          </div>
        </div>
        <div class='linha'>
          <div class='campo f3'>
            <label for='alunos-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type='text' id='alunos-evento' name='evento' placeholder='Simpósio Brasileiro de Computação'>
          </div>
          <div class='campo f3'>
            <label for='alunos-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='alunos-periodo' name='periodo' placeholder='10/03/2025 a 14/03/2025'>
          </div>
        </div>
        <div class='linha'>
          <div class='campo f2'>
            <label for='alunos-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='alunos-cidade-evento' name='cidade_evento' placeholder='Salvador'>
          </div>
          <div class='campo f2'>
            <label for='alunos-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='alunos-estado-evento' name='estado_evento' placeholder='Bahia'>
          </div>
          <div class='campo f2'>
            <label for='alunos-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='alunos-pais-evento' name='pais_evento' placeholder='Brasil'>
          </div>
        </div>
        <div class='linha'>
          <div class='campo f2'>
            <label for='alunos-link-evento'>LINK DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='alunos-link-evento' name='link_evento' placeholder='https://evento.exemplo.org.br/2025'>
          </div>
          <div class='campo f1'>
            <label for='alunos-valor'>VALOR SOLICITADO (R$)</label>
            <input type='text' id='alunos-valor' name='valor' placeholder='150000' inputmode='numeric'>
          </div>
          <div class='campo f3'>
            <label for='alunos-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id='alunos-apresentacao' name='apresentacao'>
              <option value=''>Selecione...</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
        <div class='linha'>
          <div class='campo f1'>
            <label for='alunos-detalhamento'>DETALHAMENTO DO PEDIDO</label>
            <textarea id='alunos-detalhamento' name='detalhamento' rows='2' placeholder='Passagem aérea, inscrição no evento e diárias'></textarea>
          </div>
        </div>

        <h2 class='bloco-titulo'>ENDEREÇO DO SOLICITANTE</h2>
        <div class='linha'>
          <div class='campo f1'>
            <label for='alunos-data-nascimento'>DATA DE NASCIMENTO</label>
            <input type='text' id='alunos-data-nascimento' name='data_nascimento' placeholder='01021980' inputmode='numeric'>
          </div>
          <div class='campo f3'>
            <label for='alunos-logradouro'>LOGRADOURO</label>
            <input type='text' id='alunos-logradouro' name='logradouro' placeholder='Rua do Anfiteatro'>
          </div>
          <div class='campo f1'>
            <label for='alunos-numero'>NÚMERO</label>
            <input type='text' id='alunos-numero' name='numero' placeholder='181'>
          </div>
          <div class='campo f1'>
            <label for='alunos-complemento'>COMPLEMENTO</label>
            <input type='text' id='alunos-complemento' name='complemento' placeholder='Sala 52'>
          </div>
        </div>
        <div class='linha'>
          <div class='campo f2'>
            <label for='alunos-bairro'>BAIRRO</label>
            <input type='text' id='alunos-bairro' name='bairro' placeholder='Butantã'>
          </div>
          <div class='campo f1'>
            <label for='alunos-cep'>CEP</label>
            <input type='text' id='alunos-cep' name='cep' placeholder='05508090' inputmode='numeric'>
          </div>
          <div class='campo f2'>
            <label for='alunos-cidade'>CIDADE</label>
            <input type='text' id='alunos-cidade' name='cidade' placeholder='São Paulo'>
          </div>
          <div class='campo f1'>
            <label for='alunos-estado'>ESTADO</label>
            <input type='text' id='alunos-estado' name='estado' placeholder='SP'>
          </div>
        </div>

        <h2 class='bloco-titulo'>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class='linha'>
          <div class='campo f2'>
            <label for='alunos-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type='text' id='alunos-cpf' name='cpf' placeholder='12345678909' inputmode='numeric'>
          </div>
          <div class='campo f2'>
            <label for='alunos-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type='text' id='alunos-rg' name='rg' placeholder='12.345.678-9'>
          </div>
          <div class='campo f2'>
            <label for='alunos-banco'>NOME DO BANCO</label>
            <input type='text' id='alunos-banco' name='banco' placeholder='Banco do Brasil'>
          </div>
        </div>
        <div class='linha'>
          <div class='campo f1'>
            <label for='alunos-agencia'>NÚMERO DA AGÊNCIA</label>
            <input type='text' id='alunos-agencia' name='agencia' placeholder='1234' inputmode='numeric'>
          </div>
          <div class='campo f2'>
            <label for='alunos-conta'>NÚMERO DA CONTA</label>
            <input type='text' id='alunos-conta' name='conta' placeholder='12345-6'>
          </div>
        </div>

        <div class='acoes'>
          <button type='submit'>Enviar solicitação</button>
        </div>
      </form>
    </section>

    <section id='painel-docentes' class='painel-formulario oculto'>
      <form id='form-docentes' class='formulario' data-tipo='docentes' novalidate>
        <div class='erros oculto' role='alert'></div>

        <h2 class='bloco-titulo'>SOLICITANTE E EVENTO</h2>
        <div class='linha'>
          <div class='campo f3'>
            <label for='docentes-nome'>NOME COMPLETO - SEM ABREVIAR</label>
            <input type='text' id='docentes-nome' name='nome' placeholder='Maria de Souza Silva'>
          </div>
          <div class='campo f1'>
            <label for='docentes-n-usp'>N. USP</label>
            <input type='text' id='docentes-n-usp' name='n_usp' placeholder='1234567' inputmode='numeric'>
          </div>
          <div class='campo f2'>
            <label for='docentes-programa'>PROGRAMA</label>
            <input type='text' id='docentes-programa' name='programa' placeholder='Ciência da Computação'>
          </div>
        </div>
        <div class='linha'>
          <div class='campo f3'>
            <label for='docentes-email'>E-MAIL</label>
            <input type='text' id='docentes-email' name='email' placeholder='maria.silva@usp.br'>
          </div>
          <div class='campo f3'>
            <label for='docentes-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type='text' id='docentes-evento' name='evento' placeholder='Banca de Defesa de Mestrado'>
          </div>
        </div>
        <div class='linha'>
          <div class='campo f2'>
            <label for='docentes-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='docentes-periodo' name='periodo' placeholder='10/03/2025 a 14/03/2025'>
          </div>
          <div class='campo f2'>
            <label for='docentes-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='docentes-cidade-evento' name='cidade_evento' placeholder='São Paulo'>
          </div>
          <div class='campo f1'>
            <label for='docentes-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='docentes-estado-evento' name='estado_evento' placeholder='SP'>
          </div>
          <div class='campo f1'>
            <label for='docentes-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='docentes-pais-evento' name='pais_evento' placeholder='Brasil'>
          </div>
        </div>
        <div class='linha'>
          <div class='campo f2'>
            <label for='docentes-link-evento'>LINK DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='docentes-link-evento' name='link_evento' placeholder='https://evento.exemplo.org.br/2025'>
          </div>
          <div class='campo f1'>
            <label for='docentes-valor'>VALOR SOLICITADO (R$)</label>
            <input type='text' id='docentes-valor' name='valor' placeholder='150000' inputmode='numeric'>
          </div>
          <div class='campo f3'>
            <label for='docentes-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id='docentes-apresentacao' name='apresentacao'>
              <option value=''>Selecione...</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
        <div class='linha'>
          <div class='campo f1'>
            <label for='docentes-detalhamento'>DETALHAMENTO DO PEDIDO</label>
            <textarea id='docentes-detalhamento' name='detalhamento' rows='2' placeholder='Passagem aérea, inscrição no evento e diárias'></textarea>
          </div>
        </div>

        <h2 class='bloco-titulo'>ENDEREÇO DO SOLICITANTE</h2>
        <div class='linha'>
          <div class='campo f1'>
            <label for='docentes-data-nascimento'>DATA DE NASCIMENTO</label>
            <input type='text' id='docentes-data-nascimento' name='data_nascimento' placeholder='01021980' inputmode='numeric'>
          </div>
          <div class='campo f3'>
            <label for='docentes-logradouro'>LOGRADOURO</label>
            <input type='text' id='docentes-logradouro' name='logradouro' placeholder='Rua do Anfiteatro'>
          </div>
          <div class='campo f1'>
            <label for='docentes-numero'>NÚMERO</label>
            <input type='text' id='docentes-numero' name='numero' placeholder='181'>
          </div>
          <div class='campo f1'>
            <label for='docentes-complemento'>COMPLEMENTO</label>
            <input type='text' id='docentes-complemento' name='complemento' placeholder='Sala 52'>
          </div>
        </div>
        <div class='linha'>
          <div class='campo f2'>
            <label for='docentes-bairro'>BAIRRO</label>
            <input type='text' id='docentes-bairro' name='bairro' placeholder='Butantã'>
          </div>
          <div class='campo f1'>
            <label for='docentes-cep'>CEP</label>
            <input type='text' id='docentes-cep' name='cep' placeholder='05508090' inputmode='numeric'>
          </div>
          <div class='campo f2'>
            <label for='docentes-cidade'>CIDADE</label>
            <input type='text' id='docentes-cidade' name='cidade' placeholder='São Paulo'>
          </div>
          <div class='campo f1'>
            <label for='docentes-estado'>ESTADO</label>
            <input type='text' id='docentes-estado' name='estado' placeholder='SP'>
          </div>
        </div>

        <h2 class='bloco-titulo'>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class='linha'>
          <div class='campo f2'>
            <label for='docentes-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type='text' id='docentes-cpf' name='cpf' placeholder='12345678909' inputmode='numeric'>
          </div>
          <div class='campo f2'>
            <label for='docentes-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type='text' id='docentes-rg' name='rg' placeholder='12.345.678-9'>
          </div>
          <div class='campo f2'>
            <label for='docentes-banco'>NOME DO BANCO</label>
            <input type='text' id='docentes-banco' name='banco' placeholder='Banco do Brasil'>
          </div>
        </div>
        <div class='linha'>
          <div class='campo f1'>
            <label for='docentes-agencia'>NÚMERO DA AGÊNCIA</label>
            <input type='text' id='docentes-agencia' name='agencia' placeholder='1234' inputmode='numeric'>
          </div>
          <div class='campo f2'>
            <label for='docentes-conta'>NÚMERO DA CONTA</label>
            <input type='text' id='docentes-conta' name='conta' placeholder='12345-6'>
          </div>
        </div>

        <div class='acoes'>
          <button type='submit'>Enviar solicitação</button>
        </div>
      </form>
    </section>

    <section id='confirmacao' class='oculto'>
      <h2>Solicitação registrada</h2>
      <pre id='oficio' class='oficio'></pre>
    </section>
  </main>

  <script src='app.js'></script>
</body>
</html>
