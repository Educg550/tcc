<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Solicitação de Auxílio Financeiro - Pós-Graduação do IME-USP</title>
<link rel='icon' href='data:,'>
<link rel='stylesheet' href='/style.css'>
</head>
<body>
<header class='cabecalho'>
<img class='logo' src='/assets/usp-logo.png' alt='Logotipo da Universidade de São USP'>
<div class='marca'>
<h1>Universidade de São USP</h1>
<p>Programa de Pós-Graduação do IME-USP</p>
</div>
</header>
<main class='conteudo'>
<div id='formularios'>
<nav class='abas' aria-label='Tipo de solicitante'>
<button type='button' class='aba ativa' data-alvo='form-alunos' role='tab' aria-selected='true' aria-controls='form-alunos'>ALUNOS</button>
<button type='button' class='aba' data-alvo='form-docentes' role='tab' aria-selected='false' aria-controls='form-docentes'>DOCENTES</button>
</nav>

<form id='form-alunos' class='painel' data-tipo='alunos' role='tabpanel' novalidate>
<div class='erros' role='alert' hidden></div>
<section class='bloco'>
<h2>SOLICITANTE E EVENTO</h2>
<div class='campos c4'>
<label class='campo s2'><span class='rotulo'>NOME COMPLETO - SEM ABREVIAR</span><input type='text' name='nome_completo' placeholder='Ex.: Maria Aparecida de Souza'></label>
<label class='campo'><span class='rotulo'>N. USP</span><input type='text' name='n_usp' inputmode='numeric' placeholder='Ex.: 1234567'></label>
<label class='campo'><span class='rotulo'>PROGRAMA</span><input type='text' name='programa' placeholder='Ex.: Ciência da Computação'></label>
<label class='campo'><span class='rotulo'>NÍVEL</span><select name='nivel'><option value=''>Selecione...</option><option>Mestrado</option><option>Doutorado</option></select></label>
<label class='campo s2'><span class='rotulo'>TIPO DE AUXÍLIO</span><select name='tipo_auxilio'><option value=''>Selecione...</option><option>Participação em evento</option><option>Banca de exame ou defesa</option><option>Outro</option></select></label>
<label class='campo'><span class='rotulo'>E-MAIL</span><input type='email' name='email' placeholder='Ex.: maria@usp.br'></label>
<label class='campo s2'><span class='rotulo'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input type='text' name='nome_evento' placeholder='Ex.: Congresso Brasileiro de Computação'></label>
<label class='campo s2'><span class='rotulo'>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input type='text' name='periodo' placeholder='Ex.: 10 a 15 de março de 2025'></label>
<label class='campo'><span class='rotulo'>CIDADE DO EVENTO, EXAME OU DEFESA</span><input type='text' name='cidade_evento' placeholder='Ex.: São Paulo'></label>
<label class='campo'><span class='rotulo'>ESTADO DO EVENTO, EXAME OU DEFESA</span><input type='text' name='estado_evento' placeholder='Ex.: SP'></label>
<label class='campo'><span class='rotulo'>PAÍS DO EVENTO, EXAME OU DEFESA</span><input type='text' name='pais_evento' placeholder='Ex.: Brasil'></label>
<label class='campo'><span class='rotulo'>LINK DO EVENTO, EXAME OU DEFESA</span><input type='text' name='link_evento' placeholder='Ex.: https://evento.org.br'></label>
<label class='campo'><span class='rotulo'>VALOR SOLICITADO (R$)</span><input type='text' name='valor' inputmode='numeric' placeholder='Ex.: R$ 1.500,00'></label>
<label class='campo s2'><span class='rotulo'>DETALHAMENTO DO PEDIDO</span><textarea name='detalhamento' rows='2' placeholder='Ex.: Inscrição no evento e passagem aérea'></textarea></label>
<label class='campo'><span class='rotulo'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span><select name='apresentacao'><option value=''>Selecione...</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
</div>
</section>
<section class='bloco'>
<h2>ENDEREÇO DO SOLICITANTE</h2>
<div class='campos c3'>
<label class='campo'><span class='rotulo'>DATA DE NASCIMENTO</span><input type='text' name='data_nascimento' inputmode='numeric' placeholder='Ex.: 01/02/1980'></label>
<label class='campo s2'><span class='rotulo'>LOGRADOURO</span><input type='text' name='logradouro' placeholder='Ex.: Rua do Anfiteatro'></label>
<label class='campo'><span class='rotulo'>NÚMERO</span><input type='text' name='numero' placeholder='Ex.: 375'></label>
<label class='campo'><span class='rotulo'>COMPLEMENTO</span><input type='text' name='complemento' placeholder='Ex.: Apto 42'></label>
<label class='campo'><span class='rotulo'>BAIRRO</span><input type='text' name='bairro' placeholder='Ex.: Butantã'></label>
<label class='campo'><span class='rotulo'>CEP</span><input type='text' name='cep' inputmode='numeric' placeholder='Ex.: 05508-090'></label>
<label class='campo'><span class='rotulo'>CIDADE</span><input type='text' name='cidade' placeholder='Ex.: São Paulo'></label>
<label class='campo'><span class='rotulo'>ESTADO</span><input type='text' name='estado' placeholder='Ex.: SP'></label>
</div>
</section>
<section class='bloco'>
<h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
<div class='campos c5'>
<label class='campo'><span class='rotulo'>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input type='text' name='cpf' inputmode='numeric' placeholder='Ex.: 123.456.789-09'></label>
<label class='campo'><span class='rotulo'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input type='text' name='rg' placeholder='Ex.: 12.345.678-9'></label>
<label class='campo'><span class='rotulo'>NOME DO BANCO</span><input type='text' name='banco' placeholder='Ex.: Banco do Brasil'></label>
<label class='campo'><span class='rotulo'>NÚMERO DA AGÊNCIA</span><input type='text' name='agencia' inputmode='numeric' placeholder='Ex.: 1234'></label>
<label class='campo'><span class='rotulo'>NÚMERO DA CONTA</span><input type='text' name='conta' placeholder='Ex.: 12345-6'></label>
</div>
</section>
<button type='submit' class='enviar'>Enviar solicitação</button>
</form>

<form id='form-docentes' class='painel' data-tipo='docentes' role='tabpanel' novalidate hidden>
<div class='erros' role='alert' hidden></div>
<section class='bloco'>
<h2>SOLICITANTE E EVENTO</h2>
<div class='campos c4'>
<label class='campo s2'><span class='rotulo'>NOME COMPLETO - SEM ABREVIAR</span><input type='text' name='nome_completo' placeholder='Ex.: João Carlos de Oliveira'></label>
<label class='campo'><span class='rotulo'>N. USP</span><input type='text' name='n_usp' inputmode='numeric' placeholder='Ex.: 1234567'></label>
<label class='campo'><span class='rotulo'>PROGRAMA</span><input type='text' name='programa' placeholder='Ex.: Estatística'></label>
<label class='campo s2'><span class='rotulo'>E-MAIL</span><input type='email' name='email' placeholder='Ex.: joao@ime.usp.br'></label>
<label class='campo s2'><span class='rotulo'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input type='text' name='nome_evento' placeholder='Ex.: Banca de defesa de doutorado'></label>
<label class='campo s2'><span class='rotulo'>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input type='text' name='periodo' placeholder='Ex.: 10 a 15 de março de 2025'></label>
<label class='campo'><span class='rotulo'>CIDADE DO EVENTO, EXAME OU DEFESA</span><input type='text' name='cidade_evento' placeholder='Ex.: São Paulo'></label>
<label class='campo'><span class='rotulo'>ESTADO DO EVENTO, EXAME OU DEFESA</span><input type='text' name='estado_evento' placeholder='Ex.: SP'></label>
<label class='campo'><span class='rotulo'>PAÍS DO EVENTO, EXAME OU DEFESA</span><input type='text' name='pais_evento' placeholder='Ex.: Brasil'></label>
<label class='campo'><span class='rotulo'>LINK DO EVENTO, EXAME OU DEFESA</span><input type='text' name='link_evento' placeholder='Ex.: https://evento.org.br'></label>
<label class='campo'><span class='rotulo'>VALOR SOLICITADO (R$)</span><input type='text' name='valor' inputmode='numeric' placeholder='Ex.: R$ 1.500,00'></label>
<label class='campo'><span class='rotulo'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span><select name='apresentacao'><option value=''>Selecione...</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
<label class='campo s4'><span class='rotulo'>DETALHAMENTO DO PEDIDO</span><textarea name='detalhamento' rows='2' placeholder='Ex.: Passagem rodoviária e diárias'></textarea></label>
</div>
</section>
<section class='bloco'>
<h2>ENDEREÇO DO SOLICITANTE</h2>
<div class='campos c3'>
<label class='campo'><span class='rotulo'>DATA DE NASCIMENTO</span><input type='text' name='data_nascimento' inputmode='numeric' placeholder='Ex.: 01/02/1980'></label>
<label class='campo s2'><span class='rotulo'>LOGRADOURO</span><input type='text' name='logradouro' placeholder='Ex.: Rua do Anfiteatro'></label>
<label class='campo'><span class='rotulo'>NÚMERO</span><input type='text' name='numero' placeholder='Ex.: 375'></label>
<label class='campo'><span class='rotulo'>COMPLEMENTO</span><input type='text' name='complemento' placeholder='Ex.: Apto 42'></label>
<label class='campo'><span class='rotulo'>BAIRRO</span><input type='text' name='bairro' placeholder='Ex.: Butantã'></label>
<label class='campo'><span class='rotulo'>CEP</span><input type='text' name='cep' inputmode='numeric' placeholder='Ex.: 05508-090'></label>
<label class='campo'><span class='rotulo'>CIDADE</span><input type='text' name='cidade' placeholder='Ex.: São Paulo'></label>
<label class='campo'><span class='rotulo'>ESTADO</span><input type='text' name='estado' placeholder='Ex.: SP'></label>
</div>
</section>
<section class='bloco'>
<h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
<div class='campos c5'>
<label class='campo'><span class='rotulo'>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input type='text' name='cpf' inputmode='numeric' placeholder='Ex.: 123.456.789-09'></label>
<label class='campo'><span class='rotulo'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input type='text' name='rg' placeholder='Ex.: 12.345.678-9'></label>
<label class='campo'><span class='rotulo'>NOME DO BANCO</span><input type='text' name='banco' placeholder='Ex.: Banco do Brasil'></label>
<label class='campo'><span class='rotulo'>NÚMERO DA AGÊNCIA</span><input type='text' name='agencia' inputmode='numeric' placeholder='Ex.: 1234'></label>
<label class='campo'><span class='rotulo'>NÚMERO DA CONTA</span><input type='text' name='conta' placeholder='Ex.: 12345-6'></label>
</div>
</section>
<button type='submit' class='enviar'>Enviar solicitação</button>
</form>
</div>

<section id='confirmacao' class='confirmacao' hidden>
<h2>Solicitação registrada</h2>
<pre id='oficio' class='oficio'></pre>
</section>
</main>
<script src='/app.js'></script>
</body>
</html>
