<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="titulos">
    <h1 class="universidade">Universidade de São Paulo</h1>
    <p class="programa">Instituto de Matemática e Estatística - Programa de Pós-Graduação</p>
  </div>
</header>
<main>
  <section id="formulario">
    <div class="abas" role="tablist" aria-label="Tipo de solicitante">
      <button type="button" class="aba ativa" id="aba-alunos" role="tab" aria-selected="true" aria-controls="painel-alunos" data-alvo="painel-alunos">ALUNOS</button>
      <button type="button" class="aba" id="aba-docentes" role="tab" aria-selected="false" aria-controls="painel-docentes" data-alvo="painel-docentes">DOCENTES</button>
    </div>

    <form id="painel-alunos" class="painel" role="tabpanel" aria-labelledby="aba-alunos" novalidate>
      <div class="erros" role="alert"></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo s5">
            <label for="a-nome-completo">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="a-nome-completo" name="NOME COMPLETO - SEM ABREVIAR" type="text" placeholder="Maria da Silva Souza">
          </div>
          <div class="campo s2">
            <label for="a-n-usp">N. USP</label>
            <input id="a-n-usp" name="N. USP" type="text" inputmode="numeric" placeholder="1234567">
          </div>
          <div class="campo s5">
            <label for="a-programa">PROGRAMA</label>
            <input id="a-programa" name="PROGRAMA" type="text" placeholder="Ciência da Computação">
          </div>
          <div class="campo s3">
            <label for="a-nivel">NÍVEL</label>
            <select id="a-nivel" name="NÍVEL">
              <option value="">Selecione o nível</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class="campo s4">
            <label for="a-tipo-auxilio">TIPO DE AUXÍLIO</label>
            <select id="a-tipo-auxilio" name="TIPO DE AUXÍLIO">
              <option value="">Selecione o tipo de auxílio</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>
          <div class="campo s5">
            <label for="a-email">E-MAIL</label>
            <input id="a-email" name="E-MAIL" type="email" placeholder="maria@usp.br">
          </div>
          <div class="campo s6">
            <label for="a-nome-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="a-nome-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" type="text" placeholder="Congresso Brasileiro de Computação">
          </div>
          <div class="campo s6">
            <label for="a-periodo-evento">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-periodo-evento" name="PERÍODO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="1 a 5 de julho de 2025">
          </div>
          <div class="campo s4">
            <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" type="text" placeholder="São Paulo">
          </div>
          <div class="campo s2">
            <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="SP">
          </div>
          <div class="campo s3">
            <label for="a-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Brasil">
          </div>
          <div class="campo s3">
            <label for="a-link-evento">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-link-evento" name="LINK DO EVENTO, EXAME OU DEFESA" type="text" placeholder="https://evento.usp.br">
          </div>
          <div class="campo s3">
            <label for="a-valor-solicitado">VALOR SOLICITADO (R$)</label>
            <input id="a-valor-solicitado" name="VALOR SOLICITADO (R$)" type="text" inputmode="numeric" data-formato="moeda" placeholder="150000 (R$ 1.500,00)">
          </div>
          <div class="campo s4">
            <label for="a-apresentacao-trabalho">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="a-apresentacao-trabalho" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="">Selecione uma opção</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo s5">
            <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="a-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Passagem aérea e inscrição no evento."></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo s2">
            <label for="a-data-nascimento">DATA DE NASCIMENTO</label>
            <input id="a-data-nascimento" name="DATA DE NASCIMENTO" type="text" inputmode="numeric" data-formato="data" placeholder="01021980">
          </div>
          <div class="campo s4">
            <label for="a-logradouro">LOGRADOURO</label>
            <input id="a-logradouro" name="LOGRADOURO" type="text" placeholder="Rua do Anfiteatro">
          </div>
          <div class="campo s2">
            <label for="a-numero">NÚMERO</label>
            <input id="a-numero" name="NÚMERO" type="text" placeholder="123">
          </div>
          <div class="campo s2">
            <label for="a-complemento">COMPLEMENTO</label>
            <input id="a-complemento" name="COMPLEMENTO" type="text" placeholder="Sala 5">
          </div>
          <div class="campo s2">
            <label for="a-cep">CEP</label>
            <input id="a-cep" name="CEP" type="text" inputmode="numeric" data-formato="cep" placeholder="05508090">
          </div>
          <div class="campo s5">
            <label for="a-bairro">BAIRRO</label>
            <input id="a-bairro" name="BAIRRO" type="text" placeholder="Butantã">
          </div>
          <div class="campo s4">
            <label for="a-cidade">CIDADE</label>
            <input id="a-cidade" name="CIDADE" type="text" placeholder="São Paulo">
          </div>
          <div class="campo s3">
            <label for="a-estado">ESTADO</label>
            <input id="a-estado" name="ESTADO" type="text" placeholder="SP">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo s3">
            <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" type="text" inputmode="numeric" data-formato="cpf" placeholder="12345678909">
          </div>
          <div class="campo s4">
            <label for="a-rg-rnm">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-rg-rnm" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo s5">
            <label for="a-banco">NOME DO BANCO</label>
            <input id="a-banco" name="NOME DO BANCO" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo s3">
            <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="a-agencia" name="NÚMERO DA AGÊNCIA" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo s4">
            <label for="a-conta">NÚMERO DA CONTA</label>
            <input id="a-conta" name="NÚMERO DA CONTA" type="text" placeholder="98765-4">
          </div>
        </div>
      </fieldset>

      <div class="acoes">
        <button type="submit">Enviar solicitação</button>
      </div>
    </form>

    <form id="painel-docentes" class="painel" role="tabpanel" aria-labelledby="aba-docentes" hidden novalidate>
      <div class="erros" role="alert"></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo s5">
            <label for="d-nome-completo">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="d-nome-completo" name="NOME COMPLETO - SEM ABREVIAR" type="text" placeholder="Maria da Silva Souza">
          </div>
          <div class="campo s2">
            <label for="d-n-usp">N. USP</label>
            <input id="d-n-usp" name="N. USP" type="text" inputmode="numeric" placeholder="1234567">
          </div>
          <div class="campo s5">
            <label for="d-programa">PROGRAMA</label>
            <input id="d-programa" name="PROGRAMA" type="text" placeholder="Ciência da Computação">
          </div>
          <div class="campo s6">
            <label for="d-nome-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="d-nome-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" type="text" placeholder="Congresso Brasileiro de Computação">
          </div>
          <div class="campo s6">
            <label for="d-periodo-evento">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-periodo-evento" name="PERÍODO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="1 a 5 de julho de 2025">
          </div>
          <div class="campo s4">
            <label for="d-email">E-MAIL</label>
            <input id="d-email" name="E-MAIL" type="email" placeholder="maria@usp.br">
          </div>
          <div class="campo s4">
            <label for="d-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" type="text" placeholder="São Paulo">
          </div>
          <div class="campo s2">
            <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="SP">
          </div>
          <div class="campo s2">
            <label for="d-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Brasil">
          </div>
          <div class="campo s4">
            <label for="d-link-evento">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-link-evento" name="LINK DO EVENTO, EXAME OU DEFESA" type="text" placeholder="https://evento.usp.br">
          </div>
          <div class="campo s4">
            <label for="d-valor-solicitado">VALOR SOLICITADO (R$)</label>
            <input id="d-valor-solicitado" name="VALOR SOLICITADO (R$)" type="text" inputmode="numeric" data-formato="moeda" placeholder="150000 (R$ 1.500,00)">
          </div>
          <div class="campo s4">
            <label for="d-apresentacao-trabalho">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="d-apresentacao-trabalho" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="">Selecione uma opção</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo s12">
            <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="d-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Passagem aérea e inscrição no evento."></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo s2">
            <label for="d-data-nascimento">DATA DE NASCIMENTO</label>
            <input id="d-data-nascimento" name="DATA DE NASCIMENTO" type="text" inputmode="numeric" data-formato="data" placeholder="01021980">
          </div>
          <div class="campo s4">
            <label for="d-logradouro">LOGRADOURO</label>
            <input id="d-logradouro" name="LOGRADOURO" type="text" placeholder="Rua do Anfiteatro">
          </div>
          <div class="campo s2">
            <label for="d-numero">NÚMERO</label>
            <input id="d-numero" name="NÚMERO" type="text" placeholder="123">
          </div>
          <div class="campo s2">
            <label for="d-complemento">COMPLEMENTO</label>
            <input id="d-complemento" name="COMPLEMENTO" type="text" placeholder="Sala 5">
          </div>
          <div class="campo s2">
            <label for="d-cep">CEP</label>
            <input id="d-cep" name="CEP" type="text" inputmode="numeric" data-formato="cep" placeholder="05508090">
          </div>
          <div class="campo s5">
            <label for="d-bairro">BAIRRO</label>
            <input id="d-bairro" name="BAIRRO" type="text" placeholder="Butantã">
          </div>
          <div class="campo s4">
            <label for="d-cidade">CIDADE</label>
            <input id="d-cidade" name="CIDADE" type="text" placeholder="São Paulo">
          </div>
          <div class="campo s3">
            <label for="d-estado">ESTADO</label>
            <input id="d-estado" name="ESTADO" type="text" placeholder="SP">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo s3">
            <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" type="text" inputmode="numeric" data-formato="cpf" placeholder="12345678909">
          </div>
          <div class="campo s4">
            <label for="d-rg-rnm">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-rg-rnm" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo s5">
            <label for="d-banco">NOME DO BANCO</label>
            <input id="d-banco" name="NOME DO BANCO" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo s3">
            <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="d-agencia" name="NÚMERO DA AGÊNCIA" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo s4">
            <label for="d-conta">NÚMERO DA CONTA</label>
            <input id="d-conta" name="NÚMERO DA CONTA" type="text" placeholder="98765-4">
          </div>
        </div>
      </fieldset>

      <div class="acoes">
        <button type="submit">Enviar solicitação</button>
      </div>
    </form>
  </section>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>
</main>
<script src="/app.js" defer></script>
</body>
</html>
