<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação do IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="faixa-institucional"></div>
<header class="cabecalho">
  <div class="logotipo">
    <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  </div>
  <div class="marca">
    <div class="nome-universidade">Universidade de São Paulo</div>
    <div class="nome-programa">Pós-Graduação do IME-USP</div>
  </div>
  <div class="titulo-documento">Solicitação de Auxílio Financeiro</div>
</header>
<main>
  <div id="app">
    <div class="abas" role="tablist" aria-label="Tipo de solicitante">
      <button type="button" class="aba ativa" data-aba="alunos" aria-selected="true" aria-controls="form-alunos">ALUNOS</button>
      <button type="button" class="aba" data-aba="docentes" aria-selected="false" aria-controls="form-docentes">DOCENTES</button>
    </div>
    <div class="folha">

      <form id="form-alunos" class="painel" data-aba="alunos" novalidate>
        <div class="erros" hidden></div>
        <section class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="grade">
            <label class="campo c2">
              <span class="rotulo">NOME COMPLETO - SEM ABREVIAR</span>
              <input type="text" name="nome_completo" placeholder="Ex.: Maria Silva de Oliveira">
            </label>
            <label class="campo c1">
              <span class="rotulo">N. USP</span>
              <input type="text" name="n_usp" inputmode="numeric" placeholder="Ex.: 1234567">
            </label>
            <label class="campo c1">
              <span class="rotulo">PROGRAMA</span>
              <input type="text" name="programa" placeholder="Ex.: Ciência da Computação">
            </label>
            <label class="campo c1">
              <span class="rotulo">NÍVEL</span>
              <select name="nivel">
                <option value="" selected disabled hidden>Ex.: Mestrado</option>
                <option value="Mestrado">Mestrado</option>
                <option value="Doutorado">Doutorado</option>
              </select>
            </label>
            <label class="campo c1">
              <span class="rotulo">TIPO DE AUXÍLIO</span>
              <select name="tipo_auxilio">
                <option value="" selected disabled hidden>Ex.: Participação em evento</option>
                <option value="Participação em evento">Participação em evento</option>
                <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
                <option value="Outro">Outro</option>
              </select>
            </label>
            <label class="campo c2">
              <span class="rotulo">E-MAIL</span>
              <input type="email" name="email" placeholder="Ex.: maria.silva@usp.br">
            </label>
            <label class="campo c2">
              <span class="rotulo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
              <input type="text" name="nome_evento" placeholder="Ex.: Congresso Brasileiro de Computação">
            </label>
            <label class="campo c2">
              <span class="rotulo">PERÍODO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="periodo_evento" placeholder="Ex.: 10 a 14 de março de 2025">
            </label>
            <label class="campo c1">
              <span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="cidade_evento" placeholder="Ex.: São Paulo">
            </label>
            <label class="campo c1">
              <span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="estado_evento" placeholder="Ex.: SP">
            </label>
            <label class="campo c1">
              <span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="pais_evento" placeholder="Ex.: Brasil">
            </label>
            <label class="campo c1">
              <span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="link_evento" placeholder="Ex.: https://evento.org.br">
            </label>
            <label class="campo c1">
              <span class="rotulo">VALOR SOLICITADO (R$)</span>
              <input type="text" name="valor_solicitado" inputmode="numeric" placeholder="Ex.: 1500">
            </label>
            <label class="campo c2">
              <span class="rotulo">DETALHAMENTO DO PEDIDO</span>
              <textarea name="detalhamento" rows="2" placeholder="Ex.: Inscrição no evento e passagem aérea de ida e volta."></textarea>
            </label>
            <label class="campo c1">
              <span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
              <select name="apresentacao_trabalho">
                <option value="" selected disabled hidden>Ex.: Pôster</option>
                <option value="Pôster">Pôster</option>
                <option value="Apresentação oral">Apresentação oral</option>
                <option value="Outra">Outra</option>
                <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
              </select>
            </label>
          </div>
        </section>
        <div class="duas-colunas">
          <section class="bloco">
            <h2>ENDEREÇO DO SOLICITANTE</h2>
            <div class="grade">
              <label class="campo c1">
                <span class="rotulo">DATA DE NASCIMENTO</span>
                <input type="text" name="data_nascimento" inputmode="numeric" placeholder="Ex.: 01021980">
              </label>
              <label class="campo c3">
                <span class="rotulo">LOGRADOURO</span>
                <input type="text" name="logradouro" placeholder="Ex.: Rua do Mata">
              </label>
              <label class="campo c1">
                <span class="rotulo">NÚMERO</span>
                <input type="text" name="numero" placeholder="Ex.: 1328">
              </label>
              <label class="campo c1">
                <span class="rotulo">COMPLEMENTO</span>
                <input type="text" name="complemento" placeholder="Ex.: Apartamento 52">
              </label>
              <label class="campo c2">
                <span class="rotulo">BAIRRO</span>
                <input type="text" name="bairro" placeholder="Ex.: Cidade Universitária">
              </label>
              <label class="campo c1">
                <span class="rotulo">CEP</span>
                <input type="text" name="cep" inputmode="numeric" placeholder="Ex.: 05508090">
              </label>
              <label class="campo c2">
                <span class="rotulo">CIDADE</span>
                <input type="text" name="cidade" placeholder="Ex.: São Paulo">
              </label>
              <label class="campo c1">
                <span class="rotulo">ESTADO</span>
                <input type="text" name="estado" placeholder="Ex.: SP">
              </label>
            </div>
          </section>
          <section class="bloco">
            <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
            <div class="grade">
              <label class="campo c2">
                <span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
                <input type="text" name="cpf" inputmode="numeric" placeholder="Ex.: 12345678909">
              </label>
              <label class="campo c2">
                <span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
                <input type="text" name="rg_rnm" placeholder="Ex.: 12.345.678-9">
              </label>
              <label class="campo c2">
                <span class="rotulo">NOME DO BANCO</span>
                <input type="text" name="nome_banco" placeholder="Ex.: Banco do Brasil">
              </label>
              <label class="campo c1">
                <span class="rotulo">NÚMERO DA AGÊNCIA</span>
                <input type="text" name="agencia" inputmode="numeric" placeholder="Ex.: 0132">
              </label>
              <label class="campo c1">
                <span class="rotulo">NÚMERO DA CONTA</span>
                <input type="text" name="numero_conta" placeholder="Ex.: 45782-3">
              </label>
            </div>
          </section>
        </div>
        <button class="enviar" type="submit">Enviar solicitação</button>
      </form>

      <form id="form-docentes" class="painel" data-aba="docentes" novalidate hidden>
        <div class="erros" hidden></div>
        <section class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="grade">
            <label class="campo c2">
              <span class="rotulo">NOME COMPLETO - SEM ABREVIAR</span>
              <input type="text" name="nome_completo" placeholder="Ex.: Carlos Eduardo de Souza">
            </label>
            <label class="campo c1">
              <span class="rotulo">N. USP</span>
              <input type="text" name="n_usp" inputmode="numeric" placeholder="Ex.: 1234567">
            </label>
            <label class="campo c1">
              <span class="rotulo">PROGRAMA</span>
              <input type="text" name="programa" placeholder="Ex.: Estatística">
            </label>
            <label class="campo c1">
              <span class="rotulo">E-MAIL</span>
              <input type="email" name="email" placeholder="Ex.: carlos.souza@ime.usp.br">
            </label>
            <label class="campo c3">
              <span class="rotulo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
              <input type="text" name="nome_evento" placeholder="Ex.: Banca de defesa de mestrado de Ana Lima">
            </label>
            <label class="campo c2">
              <span class="rotulo">PERÍODO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="periodo_evento" placeholder="Ex.: 3 de junho de 2025">
            </label>
            <label class="campo c1">
              <span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="cidade_evento" placeholder="Ex.: Campinas">
            </label>
            <label class="campo c1">
              <span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="estado_evento" placeholder="Ex.: SP">
            </label>
            <label class="campo c1">
              <span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="pais_evento" placeholder="Ex.: Brasil">
            </label>
            <label class="campo c1">
              <span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="link_evento" placeholder="Ex.: https://www.ime.usp.br/evento">
            </label>
            <label class="campo c2">
              <span class="rotulo">VALOR SOLICITADO (R$)</span>
              <input type="text" name="valor_solicitado" inputmode="numeric" placeholder="Ex.: 150000">
            </label>
            <label class="campo c3">
              <span class="rotulo">DETALHAMENTO DO PEDIDO</span>
              <textarea name="detalhamento" rows="2" placeholder="Ex.: Passagem rodoviária de ida e volta para a banca."></textarea>
            </label>
            <label class="campo c1">
              <span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
              <select name="apresentacao_trabalho">
                <option value="" selected disabled hidden>Ex.: Apresentação oral</option>
                <option value="Pôster">Pôster</option>
                <option value="Apresentação oral">Apresentação oral</option>
                <option value="Outra">Outra</option>
                <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
              </select>
            </label>
          </div>
        </section>
        <div class="duas-colunas">
          <section class="bloco">
            <h2>ENDEREÇO DO SOLICITANTE</h2>
            <div class="grade">
              <label class="campo c1">
                <span class="rotulo">DATA DE NASCIMENTO</span>
                <input type="text" name="data_nascimento" inputmode="numeric" placeholder="Ex.: 01021980">
              </label>
              <label class="campo c3">
                <span class="rotulo">LOGRADOURO</span>
                <input type="text" name="logradouro" placeholder="Ex.: Rua do Mata">
              </label>
              <label class="campo c1">
                <span class="rotulo">NÚMERO</span>
                <input type="text" name="numero" placeholder="Ex.: 1328">
              </label>
              <label class="campo c1">
                <span class="rotulo">COMPLEMENTO</span>
                <input type="text" name="complemento" placeholder="Ex.: Apartamento 52">
              </label>
              <label class="campo c2">
                <span class="rotulo">BAIRRO</span>
                <input type="text" name="bairro" placeholder="Ex.: Cidade Universitária">
              </label>
              <label class="campo c1">
                <span class="rotulo">CEP</span>
                <input type="text" name="cep" inputmode="numeric" placeholder="Ex.: 05508090">
              </label>
              <label class="campo c2">
                <span class="rotulo">CIDADE</span>
                <input type="text" name="cidade" placeholder="Ex.: São Paulo">
              </label>
              <label class="campo c1">
                <span class="rotulo">ESTADO</span>
                <input type="text" name="estado" placeholder="Ex.: SP">
              </label>
            </div>
          </section>
          <section class="bloco">
            <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
            <div class="grade">
              <label class="campo c2">
                <span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
                <input type="text" name="cpf" inputmode="numeric" placeholder="Ex.: 12345678909">
              </label>
              <label class="campo c2">
                <span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
                <input type="text" name="rg_rnm" placeholder="Ex.: 12.345.678-9">
              </label>
              <label class="campo c2">
                <span class="rotulo">NOME DO BANCO</span>
                <input type="text" name="nome_banco" placeholder="Ex.: Banco do Brasil">
              </label>
              <label class="campo c1">
                <span class="rotulo">NÚMERO DA AGÊNCIA</span>
                <input type="text" name="agencia" inputmode="numeric" placeholder="Ex.: 0132">
              </label>
              <label class="campo c1">
                <span class="rotulo">NÚMERO DA CONTA</span>
                <input type="text" name="numero_conta" placeholder="Ex.: 45782-3">
              </label>
            </div>
          </section>
        </div>
        <button class="enviar" type="submit">Enviar solicitação</button>
      </form>

    </div>
  </div>
  <section id="confirmacao" hidden>
    <h1 class="titulo-confirmacao">Solicitação registrada</h1>
    <pre class="oficio" id="oficio"></pre>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
