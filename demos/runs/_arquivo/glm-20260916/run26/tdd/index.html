<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação do IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="cabecalho">
  <div class="moldura-logo">
    <img class="logo" src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  </div>
  <h1>Universidade de São Paulo</h1>
  <p class="subtitulo">Solicitação de Auxílio Financeiro - Programa de Pós-Graduação do IME-USP</p>
</header>
<main id="conteudo">
  <nav class="abas">
    <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>

  <form id="form-alunos" class="formulario" data-aba="alunos" novalidate>
    <input type="hidden" name="aba" value="alunos">
    <div class="erros" hidden></div>

    <section class="bloco">
      <h2>SOLICITANTE E EVENTO</h2>
      <div class="grade">
        <label class="campo span2"><span class="rotulo">NOME COMPLETO - SEM ABREVIAR</span>
          <input type="text" name="nome_completo" placeholder="Maria da Silva">
        </label>
        <label class="campo"><span class="rotulo">N. USP</span>
          <input type="text" name="numero_usp" placeholder="1234567">
        </label>
        <label class="campo"><span class="rotulo">PROGRAMA</span>
          <input type="text" name="programa" placeholder="Ciência da Computação">
        </label>
        <label class="campo"><span class="rotulo">NÍVEL</span>
          <select name="nivel">
            <option value="">Selecione</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select>
        </label>
        <label class="campo"><span class="rotulo">TIPO DE AUXÍLIO</span>
          <select name="tipo_auxilio">
            <option value="">Selecione</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select>
        </label>
        <label class="campo span2"><span class="rotulo">E-MAIL</span>
          <input type="email" name="email" placeholder="maria.silva@usp.br">
        </label>
        <label class="campo span2"><span class="rotulo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
          <input type="text" name="nome_evento" placeholder="Simpósio de Sistemas Distribuídos">
        </label>
        <label class="campo span2"><span class="rotulo">PERÍODO DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="periodo_evento" placeholder="10/03/2025 a 14/03/2025">
        </label>
        <label class="campo"><span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="cidade_evento" placeholder="Campinas">
        </label>
        <label class="campo"><span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="estado_evento" placeholder="SP">
        </label>
        <label class="campo"><span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="pais_evento" placeholder="Brasil">
        </label>
        <label class="campo"><span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="link_evento" placeholder="https://ime.usp.br/evento">
        </label>
        <label class="campo"><span class="rotulo">VALOR SOLICITADO (R$)</span>
          <input type="text" name="valor_solicitado" data-fmt="moeda" placeholder="150000">
        </label>
        <label class="campo"><span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
          <select name="apresentacao_trabalho">
            <option value="">Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </label>
        <label class="campo span2"><span class="rotulo">DETALHAMENTO DO PEDIDO</span>
          <textarea name="detalhamento" rows="2" placeholder="Passagens aéreas e diárias"></textarea>
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <label class="campo"><span class="rotulo">DATA DE NASCIMENTO</span>
          <input type="text" name="data_nascimento" data-fmt="data" placeholder="01021980">
        </label>
        <label class="campo"><span class="rotulo">CEP</span>
          <input type="text" name="cep" data-fmt="cep" placeholder="05508090">
        </label>
        <label class="campo span2"><span class="rotulo">LOGRADOURO</span>
          <input type="text" name="logradouro" placeholder="Rua do Anfiteatro">
        </label>
        <label class="campo"><span class="rotulo">NÚMERO</span>
          <input type="text" name="numero" placeholder="375">
        </label>
        <label class="campo"><span class="rotulo">COMPLEMENTO</span>
          <input type="text" name="complemento" placeholder="Prédio A, sala 2">
        </label>
        <label class="campo"><span class="rotulo">BAIRRO</span>
          <input type="text" name="bairro" placeholder="Butantã">
        </label>
        <label class="campo"><span class="rotulo">CIDADE</span>
          <input type="text" name="cidade" placeholder="São Paulo">
        </label>
        <label class="campo"><span class="rotulo">ESTADO</span>
          <input type="text" name="estado" placeholder="SP">
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <label class="campo"><span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="cpf" data-fmt="cpf" placeholder="12345678909">
        </label>
        <label class="campo"><span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="rg" placeholder="12.345.678-9">
        </label>
        <label class="campo span2"><span class="rotulo">NOME DO BANCO</span>
          <input type="text" name="nome_banco" placeholder="Banco do Brasil">
        </label>
        <label class="campo"><span class="rotulo">NÚMERO DA AGÊNCIA</span>
          <input type="text" name="numero_agencia" placeholder="1234">
        </label>
        <label class="campo"><span class="rotulo">NÚMERO DA CONTA</span>
          <input type="text" name="numero_conta" placeholder="12345-6">
        </label>
      </div>
    </section>

    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>

  <form id="form-docentes" class="formulario" data-aba="docentes" hidden novalidate>
    <input type="hidden" name="aba" value="docentes">
    <div class="erros" hidden></div>

        <label class="campo"><span class="rotulo">VALOR SOLICITADO (R$)</span>

        <label class="campo span2"><span class="rotulo">DETALHAMENTO DO PEDIDO</span>

        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <label class="campo"><span class="rotulo">DATA DE NASCIMENTO</span>
          <input type="text" name="data_nascimento" data-fmt="data" placeholder="01021980">
        </label>
        <label class="campo"><span class="rotulo">CEP</span>

        </label>
        <label class="campo"><span class="rotulo">COMPLEMENTO</span>

        </label>
        <label class="campo"><span class="rotulo">BAIRRO</span>
          <input type="text" name="bairro" placeholder="Butantã">
        </label>
        <label class="campo"><span class="rotulo">CIDADE</span>
          <input type="text" name="cidade" placeholder="São Paulo">
        </label>
        <label class="campo"><span class="rotulo">ESTADO</span>
          <input type="text" name="estado" placeholder="SP">
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <label class="campo"><span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="cpf" data-fmt="cpf" placeholder="12345678909">
        </label>
        <label class="campo"><span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="rg" placeholder="12.345.678-9">
        </label>
        <label class="campo span2"><span class="rotulo">NOME DO BANCO</span>
          <input type="text" name="nome_banco" placeholder="Banco do Brasil">
        </label>
        <label class="campo"><span class="rotulo">NÚMERO DA AGÊNCIA</span>
          <input type="text" name="numero_agencia" placeholder="1234">
        </label>
        <label class="campo"><span class="rotulo">NÚMERO DA CONTA</span>
          <input type="text" name="numero_conta" placeholder="12345-6">
        </label>
      </div>
    </section>

    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>
</main>

<section id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <pre id="oficio" class="oficio"></pre>
</section>

<script src="/app.js"></script>
</body>
</html>
