<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel='stylesheet' href='style.css'>
</head>
<body>
  <header class='cabecalho'>
    <img class='logo' src='assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
    <div>
      <h1>Universidade de São Paulo</h1>
      <p>Pós-Graduação do Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <main>
    <div id='formulario-view'>
      <nav class='abas' aria-label='Tipo de solicitante'>
        <button type='button' class='aba ativa' data-aba='alunos'>ALUNOS</button>
        <button type='button' class='aba' data-aba='docentes'>DOCENTES</button>
      </nav>

      <form id='form-alunos' class='form' data-form='alunos' novalidate>
        <div class='erros' hidden></div>

        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class='campos'>
            <div class='campo s2'>
              <label for='a-nome'>NOME COMPLETO - SEM ABREVIAR</label>
              <input type='text' id='a-nome' name='nome' placeholder='Maria Aparecida dos Santos'>
            </div>
            <div class='campo'>
              <label for='a-nusp'>N. USP</label>
              <input type='text' id='a-nusp' name='nusp' placeholder='1234567'>
            </div>
            <div class='campo'>
              <label for='a-programa'>PROGRAMA</label>
              <input type='text' id='a-programa' name='programa' placeholder='Ciência da Computação'>
            </div>
            <div class='campo'>
              <label for='a-nivel'>NÍVEL</label>
              <select id='a-nivel' name='nivel'>
                <option value=''>Selecione</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select>
            </div>
            <div class='campo'>
              <label for='a-tipo-auxilio'>TIPO DE AUXÍLIO</label>
              <select id='a-tipo-auxilio' name='tipo_auxilio'>
                <option value=''>Selecione</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select>
            </div>
            <div class='campo s2'>
              <label for='a-email'>E-MAIL</label>
              <input type='text' id='a-email' name='email' placeholder='maria.santos@usp.br'>
            </div>
            <div class='campo s2'>
              <label for='a-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input type='text' id='a-evento' name='evento' placeholder='Congresso Brasileiro de Matemática'>
            </div>
            <div class='campo s2'>
              <label for='a-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input type='text' id='a-periodo' name='periodo' placeholder='10 a 14 de agosto de 2025'>
            </div>
            <div class='campo'>
              <label for='a-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input type='text' id='a-cidade-evento' name='cidade_evento' placeholder='São Paulo'>
            </div>
            <div class='campo'>
              <label for='a-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input type='text' id='a-estado-evento' name='estado_evento' placeholder='SP'>
            </div>
            <div class='campo'>
              <label for='a-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input type='text' id='a-pais-evento' name='pais_evento' placeholder='Brasil'>
            </div>
            <div class='campo'>
              <label for='a-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
              <input type='text' id='a-link' name='link' placeholder='https://evento.com.br'>
            </div>
            <div class='campo'>
              <label for='a-valor'>VALOR SOLICITADO (R$)</label>
              <input type='text' id='a-valor' name='valor' data-formato='moeda' placeholder='150000'>
            </div>
            <div class='campo s2'>
              <label for='a-detalhamento'>DETALHAMENTO DO PEDIDO</label>
              <textarea id='a-detalhamento' name='detalhamento' placeholder='Passagem aérea, inscrição no evento e diárias'></textarea>
            </div>
            <div class='campo'>
              <label for='a-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id='a-apresentacao' name='apresentacao'>
                <option value=''>Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class='campos'>
            <div class='campo'>
              <label for='a-data-nascimento'>DATA DE NASCIMENTO</label>
              <input type='text' id='a-data-nascimento' name='data_nascimento' data-formato='data' placeholder='01021980'>
            </div>
            <div class='campo'>
              <label for='a-logradouro'>LOGRADOURO</label>
              <input type='text' id='a-logradouro' name='logradouro' placeholder='Rua do Matão'>
            </div>
            <div class='campo'>
              <label for='a-numero'>NÚMERO</label>
              <input type='text' id='a-numero' name='numero' placeholder='1010'>
            </div>
            <div class='campo'>
              <label for='a-complemento'>COMPLEMENTO</label>
              <input type='text' id='a-complemento' name='complemento' placeholder='Sala 12'>
            </div>
            <div class='campo'>
              <label for='a-bairro'>BAIRRO</label>
              <input type='text' id='a-bairro' name='bairro' placeholder='Cidade Universitária'>
            </div>
            <div class='campo'>
              <label for='a-cep'>CEP</label>
              <input type='text' id='a-cep' name='cep' data-formato='cep' placeholder='05508090'>
            </div>
            <div class='campo'>
              <label for='a-cidade'>CIDADE</label>
              <input type='text' id='a-cidade' name='cidade' placeholder='São Paulo'>
            </div>
            <div class='campo'>
              <label for='a-estado'>ESTADO</label>
              <input type='text' id='a-estado' name='estado' placeholder='SP'>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class='campos'>
            <div class='campo s2'>
              <label for='a-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input type='text' id='a-cpf' name='cpf' data-formato='cpf' placeholder='12345678909'>
            </div>
            <div class='campo s2'>
              <label for='a-rg-rnm'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input type='text' id='a-rg-rnm' name='rg_rnm' placeholder='12.345.678-9'>
            </div>
            <div class='campo s2'>
              <label for='a-banco'>NOME DO BANCO</label>
              <input type='text' id='a-banco' name='banco' placeholder='Banco do Brasil'>
            </div>
            <div class='campo'>
              <label for='a-agencia'>NÚMERO DA AGÊNCIA</label>
              <input type='text' id='a-agencia' name='agencia' placeholder='0183'>
            </div>
            <div class='campo'>
              <label for='a-conta'>NÚMERO DA CONTA</label>
              <input type='text' id='a-conta' name='conta' placeholder='12345-6'>
            </div>
          </div>
        </fieldset>

        <div class='acoes'>
          <button type='submit'>Enviar solicitação</button>
        </div>
      </form>

      <form id='form-docentes' class='form' data-form='docentes' hidden novalidate>
        <div class='erros' hidden></div>

        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class='campos'>
            <div class='campo s2'>
              <label for='d-nome'>NOME COMPLETO - SEM ABREVIAR</label>
              <input type='text' id='d-nome' name='nome' placeholder='João Pedro da Silva'>
            </div>
            <div class='campo'>
              <label for='d-nusp'>N. USP</label>
              <input type='text' id='d-nusp' name='nusp' placeholder='1234567'>
            </div>
            <div class='campo'>
              <label for='d-programa'>PROGRAMA</label>
              <input type='text' id='d-programa' name='programa' placeholder='Matemática Aplicada'>
            </div>
            <div class='campo s2'>
              <label for='d-email'>E-MAIL</label>
              <input type='text' id='d-email' name='email' placeholder='joao.silva@usp.br'>
            </div>
            <div class='campo s2'>
              <label for='d-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input type='text' id='d-evento' name='evento' placeholder='Banca de defesa de doutorado'>
            </div>
            <div class='campo s2'>
              <label for='d-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input type='text' id='d-periodo' name='periodo' placeholder='3 a 5 de setembro de 2025'>
            </div>
            <div class='campo'>
              <label for='d-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input type='text' id='d-cidade-evento' name='cidade_evento' placeholder='Campinas'>
            </div>
            <div class='campo'>
              <label for='d-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input type='text' id='d-estado-evento' name='estado_evento' placeholder='SP'>
            </div>
            <div class='campo'>
              <label for='d-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input type='text' id='d-pais-evento' name='pais_evento' placeholder='Brasil'>
            </div>
            <div class='campo'>
              <label for='d-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
              <input type='text' id='d-link' name='link' placeholder='https://evento.com.br'>
            </div>
            <div class='campo'>
              <label for='d-valor'>VALOR SOLICITADO (R$)</label>
              <input type='text' id='d-valor' name='valor' data-formato='moeda' placeholder='150000'>
            </div>
            <div class='campo s2'>
              <label for='d-detalhamento'>DETALHAMENTO DO PEDIDO</label>
              <textarea id='d-detalhamento' name='detalhamento' placeholder='Passagem rodoviária e diárias'></textarea>
            </div>
            <div class='campo'>
              <label for='d-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id='d-apresentacao' name='apresentacao'>
                <option value=''>Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class='campos'>
            <div class='campo'>
              <label for='d-data-nascimento'>DATA DE NASCIMENTO</label>
              <input type='text' id='d-data-nascimento' name='data_nascimento' data-formato='data' placeholder='15031975'>
            </div>
            <div class='campo'>
              <label for='d-logradouro'>LOGRADOURO</label>
              <input type='text' id='d-logradouro' name='logradouro' placeholder='Av. Prof. Luciano Gualberto'>
            </div>
            <div class='campo'>
              <label for='d-numero'>NÚMERO</label>
              <input type='text' id='d-numero' name='numero' placeholder='403'>
            </div>
            <div class='campo'>
              <label for='d-complemento'>COMPLEMENTO</label>
              <input type='text' id='d-complemento' name='complemento' placeholder='Bloco B'>
            </div>
            <div class='campo'>
              <label for='d-bairro'>BAIRRO</label>
              <input type='text' id='d-bairro' name='bairro' placeholder='Butantã'>
            </div>
            <div class='campo'>
              <label for='d-cep'>CEP</label>
              <input type='text' id='d-cep' name='cep' data-formato='cep' placeholder='05508090'>
            </div>
            <div class='campo'>
              <label for='d-cidade'>CIDADE</label>
              <input type='text' id='d-cidade' name='cidade' placeholder='São Paulo'>
            </div>
            <div class='campo'>
              <label for='d-estado'>ESTADO</label>
              <input type='text' id='d-estado' name='estado' placeholder='SP'>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class='campos'>
            <div class='campo s2'>
              <label for='d-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input type='text' id='d-cpf' name='cpf' data-formato='cpf' placeholder='98765432100'>
            </div>
            <div class='campo s2'>
              <label for='d-rg-rnm'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input type='text' id='d-rg-rnm' name='rg_rnm' placeholder='98.765.432-1'>
            </div>
            <div class='campo s2'>
              <label for='d-banco'>NOME DO BANCO</label>
              <input type='text' id='d-banco' name='banco' placeholder='Banco do Brasil'>
            </div>
            <div class='campo'>
              <label for='d-agencia'>NÚMERO DA AGÊNCIA</label>
              <input type='text' id='d-agencia' name='agencia' placeholder='0183'>
            </div>
            <div class='campo'>
              <label for='d-conta'>NÚMERO DA CONTA</label>
              <input type='text' id='d-conta' name='conta' placeholder='12345-6'>
            </div>
          </div>
        </fieldset>

        <div class='acoes'>
          <button type='submit'>Enviar solicitação</button>
        </div>
      </form>
    </div>

    <div id='confirmacao-view' hidden>
      <h2>Solicitação registrada</h2>
      <pre id='oficio' class='oficio'></pre>
    </div>
  </main>

  <script src='app.js'></script>
</body>
</html>
