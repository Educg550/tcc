<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <div class="marca">
    <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="titulos">
      <h1>Universidade de São Paulo</h1>
      <p>Pós-Graduação do Instituto de Matemática e Estatística</p>
    </div>
  </div>
</header>
<nav class="abas" id="abas">
  <button type="button" class="aba ativa" data-formulario="alunos">ALUNOS</button>
  <button type="button" class="aba" data-formulario="docentes">DOCENTES</button>
</nav>
<main>
  <div id="formularios">
    <form id="form-alunos" novalidate></form>
    <form id="form-docentes" novalidate hidden></form>
  </div>
  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <div class="oficio" id="oficio"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
