<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <img class="marca" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="titulos">
    <h1>Universidade de São Paulo</h1>
    <p>Auxílio Financeiro - Programa de Pós-Graduação do IME</p>
  </div>
</header>

<main id="formulario">
  <nav class="abas" aria-label="Tipo de solicitante">
    <button type="button" class="aba ativa" data-aba="ALUNOS">ALUNOS</button>
    <button type="button" class="aba" data-aba="DOCENTES">DOCENTES</button>
  </nav>

  <section class="painel" id="painel-ALUNOS">
    <form data-aba="ALUNOS" novalidate>
      <div class="erros" role="alert"></div>

      <div class="bloco">
        <h2>SOLICITANTE E EVENTO</h2>
        <div class="campos">
          <div class="campo largo">
            <label for="alu-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input type="text" id="alu-nome" name="NOME COMPLETO - SEM ABREVIAR" placeholder="Ex.: Maria de Souza Silva">
          </div>
          <div class="campo">
            <label for="alu-n-usp">N. USP</label>
            <input type="text" id="alu-n-usp" name="N. USP" placeholder="Ex.: 1234567">
          </div>
          <div class="campo">
            <label for="alu-programa">PROGRAMA</label>
            <input type="text" id="alu-programa" name="PROGRAMA" placeholder="Ex.: Ciência da Computação">
          </div>
          <div class="campo">
            <label for="alu-nivel">NÍVEL</label>
            <select id="alu-nivel" name="NÍVEL">
              <option value="" selected disabled>Selecione: Mestrado ou Doutorado</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class="campo">
            <label for="alu-tipo">TIPO DE AUXÍLIO</label>
            <select id="alu-tipo" name="TIPO DE AUXÍLIO">
              <option value="" selected disabled>Selecione o auxílio desejado</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>
          <div class="campo">
            <label for="alu-email">E-MAIL</label>
            <input type="text" id="alu-email" name="E-MAIL" placeholder="Ex.: maria.ss@usp.br">
          </div>
          <div class="campo largo">
            <label for="alu-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type="text" id="alu-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Ex.: Simpósio Brasileiro de Computação">
          </div>
          <div class="campo">
            <label for="alu-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="alu-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: 10 a 15 de agosto de 2025">
          </div>
          <div class="campo">
            <label for="alu-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="alu-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo">
            <label for="alu-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="alu-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: SP">
          </div>
          <div class="campo">
            <label for="alu-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="alu-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: Brasil">
          </div>
          <div class="campo">
            <label for="alu-link-evento">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="alu-link-evento" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: eventos.usp.br/simposio">
          </div>
          <div class="campo">
            <label for="alu-valor">VALOR SOLICITADO (R$)</label>
            <input type="text" id="alu-valor" name="VALOR SOLICITADO (R$)" class="formato-moeda" placeholder="Digite só dígitos: 150000 vira R$ 1.500,00">
          </div>
          <div class="campo largo">
            <label for="alu-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="alu-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Ex.: Inscrição no evento e passagem aérea"></textarea>
          </div>
          <div class="campo">
            <label for="alu-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="alu-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="" selected disabled>Selecione uma opção</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </div>

      <div class="bloco">
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="campos">
          <div class="campo">
            <label for="alu-nascimento">DATA DE NASCIMENTO</label>
            <input type="text" id="alu-nascimento" name="DATA DE NASCIMENTO" class="formato-data" placeholder="Ex.: 01021980">
          </div>
          <div class="campo largo">
            <label for="alu-logradouro">LOGRADOURO</label>
            <input type="text" id="alu-logradouro" name="LOGRADOURO" placeholder="Ex.: Rua do Anfiteatro">
          </div>
          <div class="campo">
            <label for="alu-numero">NÚMERO</label>
            <input type="text" id="alu-numero" name="NÚMERO" placeholder="Ex.: 181">
          </div>
          <div class="campo">
            <label for="alu-complemento">COMPLEMENTO</label>
            <input type="text" id="alu-complemento" name="COMPLEMENTO" placeholder="Ex.: Bloco A, sala 12">
          </div>
          <div class="campo">
            <label for="alu-bairro">BAIRRO</label>
            <input type="text" id="alu-bairro" name="BAIRRO" placeholder="Ex.: Butantã">
          </div>
          <div class="campo">
            <label for="alu-cep">CEP</label>
            <input type="text" id="alu-cep" name="CEP" class="formato-cep" placeholder="Ex.: 05508090">
          </div>
          <div class="campo">
            <label for="alu-cidade">CIDADE</label>
            <input type="text" id="alu-cidade" name="CIDADE" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo">
            <label for="alu-estado">ESTADO</label>
            <input type="text" id="alu-estado" name="ESTADO" placeholder="Ex.: SP">
          </div>
        </div>
      </div>

      <div class="bloco">
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="campos">
          <div class="campo">
            <label for="alu-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="alu-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" class="formato-cpf" placeholder="Ex.: 11144477735">
          </div>
          <div class="campo">
            <label for="alu-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="alu-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="Ex.: 12.345.678-9">
          </div>
          <div class="campo">
            <label for="alu-banco">NOME DO BANCO</label>
            <input type="text" id="alu-banco" name="NOME DO BANCO" placeholder="Ex.: Banco do Brasil">
          </div>
          <div class="campo">
            <label for="alu-agencia">NÚMERO DA AGÊNCIA</label>
            <input type="text" id="alu-agencia" name="NÚMERO DA AGÊNCIA" placeholder="Ex.: 1234">
          </div>
          <div class="campo">
            <label for="alu-conta">NÚMERO DA CONTA</label>
            <input type="text" id="alu-conta" name="NÚMERO DA CONTA" placeholder="Ex.: 98765-4">
          </div>
        </div>
      </div>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section class="painel" id="painel-DOCENTES" hidden>
    <form data-aba="DOCENTES" novalidate>
      <div class="erros" role="alert"></div>

      <div class="bloco">

          <div class="campo">
            <label for="doc-programa">PROGRAMA</label>
            <input type="text" id="doc-programa" name="PROGRAMA" placeholder="Ex.: Ciência da Computação">
          </div>
          <div class="campo">
            <label for="doc-email">E-MAIL</label>
            <input type="text" id="doc-email" name="E-MAIL" placeholder="Ex.: maria.ss@usp.br">
          </div>
          <div class="campo">
            <label for="doc-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type="text" id="doc-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Ex.: Simpósio Brasileiro de Computação">
          </div>
          <div class="campo">
            <label for="doc-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="doc-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: 10 a 15 de agosto de 2025">
          </div>
          <div class="campo">
            <label for="doc-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>

          </div>
          <div class="campo">
            <label for="doc-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="doc-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: SP">
          </div>
          <div class="campo">

            <input type="text" id="doc-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: Brasil">
          </div>
          <div class="campo">

            <input type="text" id="doc-link-evento" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: eventos.usp.br/simposio">
          </div>
          <div class="campo">

          </div>
          <div class="campo largo">

          </div>
          <div class="campo">
            <label for="doc-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="doc-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="" selected disabled>Selecione uma opção</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </div>

      <div class="bloco">
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="campos">
          <div class="campo">
            <label for="doc-nascimento">DATA DE NASCIMENTO</label>
            <input type="text" id="doc-nascimento" name="DATA DE NASCIMENTO" class="formato-data" placeholder="Ex.: 01021980">
          </div>
          <div class="campo largo">
            <label for="doc-logradouro">LOGRADOURO</label>
            <input type="text" id="doc-logradouro" name="LOGRADOURO" placeholder="Ex.: Rua do Anfiteatro">
          </div>
          <div class="campo">
            <label for="doc-numero">NÚMERO</label>
            <input type="text" id="doc-numero" name="NÚMERO" placeholder="Ex.: 181">
          </div>
          <div class="campo">
            <label for="doc-complemento">COMPLEMENTO</label>
            <input type="text" id="doc-complemento" name="COMPLEMENTO" placeholder="Ex.: Bloco A, sala 12">
          </div>
          <div class="campo">
            <label for="doc-bairro">BAIRRO</label>
            <input type="text" id="doc-bairro" name="BAIRRO" placeholder="Ex.: Butantã">
          </div>
          <div class="campo">
            <label for="doc-cep">CEP</label>
            <input type="text" id="doc-cep" name="CEP" class="formato-cep" placeholder="Ex.: 05508090">
          </div>
          <div class="campo">
            <label for="doc-cidade">CIDADE</label>
            <input type="text" id="doc-cidade" name="CIDADE" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo">
            <label for="doc-estado">ESTADO</label>
            <input type="text" id="doc-estado" name="ESTADO" placeholder="Ex.: SP">
          </div>
        </div>
      </div>

      <div class="bloco">
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="campos">
          <div class="campo">
            <label for="doc-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="doc-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" class="formato-cpf" placeholder="Ex.: 11144477735">
          </div>
          <div class="campo">
            <label for="doc-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>

          <div class="campo">

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>
</main>

<section id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <pre id="oficio"></pre>
</section>

<script src="app.js"></script>
</body>
</html>
