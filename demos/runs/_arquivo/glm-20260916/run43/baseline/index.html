<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div>
      <h1>Universidade de São Paulo</h1>
      <p class="programa">Pós-Graduação do Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <main>
    <nav class="abas">
      <button type="button" class="aba ativa" data-alvo="form-alunos">ALUNOS</button>
      <button type="button" class="aba" data-alvo="form-docentes">DOCENTES</button>
    </nav>

    <form id="form-alunos" class="formulario" data-tipo="alunos">
      <div class="erros" hidden></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo c3">
            <label for="al-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="al-nome" name="nome" type="text" placeholder="Maria Souza da Silva">
          </div>
          <div class="campo c2">
            <label for="al-nusp">N. USP</label>
            <input id="al-nusp" name="nusp" type="text" inputmode="numeric" placeholder="1234567">
          </div>
          <div class="campo c3">
            <label for="al-programa">PROGRAMA</label>
            <input id="al-programa" name="programa" type="text" placeholder="Ciência da Computação">
          </div>
          <div class="campo c2">
            <label for="al-nivel">NÍVEL</label>
            <select id="al-nivel" name="nivel">
              <option value="">Selecione</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class="campo c2">
            <label for="al-tipo-auxilio">TIPO DE AUXÍLIO</label>
            <select id="al-tipo-auxilio" name="tipo_auxilio">
              <option value="">Selecione</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>

          <div class="campo c3">
            <label for="al-email">E-MAIL</label>
            <input id="al-email" name="email" type="text" placeholder="maria.souza@usp.br">
          </div>
          <div class="campo c5">
            <label for="al-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="al-evento" name="evento" type="text" placeholder="Congresso Brasileiro de Matemática">
          </div>
          <div class="campo c4">
            <label for="al-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="al-periodo" name="periodo" type="text" placeholder="10/01/2025 a 15/01/2025">
          </div>

          <div class="campo c3">
            <label for="al-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="al-cidade-evento" name="cidade_evento" type="text" placeholder="Rio de Janeiro">
          </div>
          <div class="campo c3">
            <label for="al-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="al-estado-evento" name="estado_evento" type="text" placeholder="RJ">
          </div>
          <div class="campo c3">
            <label for="al-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="al-pais-evento" name="pais_evento" type="text" placeholder="Brasil">
          </div>
          <div class="campo c3">
            <label for="al-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="al-link" name="link" type="text" placeholder="https://evento.org.br/2025">
          </div>

          <div class="campo c2">
            <label for="al-valor">VALOR SOLICITADO (R$)</label>
            <input id="al-valor" name="valor" type="text" inputmode="numeric" data-formato="moeda" placeholder="150000">
          </div>
          <div class="campo c4">
            <label for="al-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="al-apresentacao" name="apresentacao">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo c6">
            <label for="al-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="al-detalhamento" name="detalhamento" rows="2" placeholder="Passagem aérea e hospedagem para apresentação de trabalho"></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo c2">
            <label for="al-data-nascimento">DATA DE NASCIMENTO</label>
            <input id="al-data-nascimento" name="data_nascimento" type="text" inputmode="numeric" data-formato="data" placeholder="01011990">
          </div>
          <div class="campo c4">
            <label for="al-logradouro">LOGRADOURO</label>
            <input id="al-logradouro" name="logradouro" type="text" placeholder="Rua do Matão">
          </div>
          <div class="campo c2">
            <label for="al-numero">NÚMERO</label>
            <input id="al-numero" name="numero" type="text" placeholder="1010">
          </div>
          <div class="campo c4">
            <label for="al-complemento">COMPLEMENTO</label>
            <input id="al-complemento" name="complemento" type="text" placeholder="Sala 12">
          </div>

          <div class="campo c4">
            <label for="al-bairro">BAIRRO</label>
            <input id="al-bairro" name="bairro" type="text" placeholder="Cidade Universitária">
          </div>
          <div class="campo c2">
            <label for="al-cep">CEP</label>
            <input id="al-cep" name="cep" type="text" inputmode="numeric" data-formato="cep" placeholder="05508090">
          </div>
          <div class="campo c3">
            <label for="al-cidade">CIDADE</label>
            <input id="al-cidade" name="cidade" type="text" placeholder="São Paulo">
          </div>
          <div class="campo c3">
            <label for="al-estado">ESTADO</label>
            <input id="al-estado" name="estado" type="text" placeholder="SP">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo c3">
            <label for="al-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="al-cpf" name="cpf" type="text" inputmode="numeric" data-formato="cpf" placeholder="12345678909">
          </div>
          <div class="campo c3">
            <label for="al-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="al-rg" name="rg" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo c2">
            <label for="al-banco">NOME DO BANCO</label>
            <input id="al-banco" name="banco" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo c2">
            <label for="al-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="al-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo c2">
            <label for="al-conta">NÚMERO DA CONTA</label>
            <input id="al-conta" name="conta" type="text" placeholder="98765-4">
          </div>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>

    <form id="form-docentes" class="formulario" data-tipo="docentes" hidden>
      <div class="erros" hidden></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo c3">
            <label for="do-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="do-nome" name="nome" type="text" placeholder="João Pereira de Almeida">
          </div>
          <div class="campo c2">
            <label for="do-nusp">N. USP</label>
            <input id="do-nusp" name="nusp" type="text" inputmode="numeric" placeholder="1234567">
          </div>
          <div class="campo c4">
            <label for="do-programa">PROGRAMA</label>
            <input id="do-programa" name="programa" type="text" placeholder="Estatística">
          </div>
          <div class="campo c3">
            <label for="do-email">E-MAIL</label>
            <input id="do-email" name="email" type="text" placeholder="joao.almeida@ime.usp.br">
          </div>

          <div class="campo c5">
            <label for="do-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="do-evento" name="evento" type="text" placeholder="Banca de defesa de mestrado">
          </div>
          <div class="campo c4">
            <label for="do-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="do-periodo" name="periodo" type="text" placeholder="20/03/2025 a 22/03/2025">
          </div>
          <div class="campo c3">
            <label for="do-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="do-link" name="link" type="text" placeholder="https://evento.org.br/2025">
          </div>

          <div class="campo c4">
            <label for="do-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="do-cidade-evento" name="cidade_evento" type="text" placeholder="São Paulo">
          </div>
          <div class="campo c4">
            <label for="do-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="do-estado-evento" name="estado_evento" type="text" placeholder="SP">
          </div>
          <div class="campo c4">
            <label for="do-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="do-pais-evento" name="pais_evento" type="text" placeholder="Brasil">
          </div>

          <div class="campo c2">
            <label for="do-valor">VALOR SOLICITADO (R$)</label>
            <input id="do-valor" name="valor" type="text" inputmode="numeric" data-formato="moeda" placeholder="150000">
          </div>
          <div class="campo c4">
            <label for="do-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="do-apresentacao" name="apresentacao">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo c6">
            <label for="do-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="do-detalhamento" name="detalhamento" rows="2" placeholder="Passagem e diárias para participação em banca de defesa"></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo c2">
            <label for="do-data-nascimento">DATA DE NASCIMENTO</label>
            <input id="do-data-nascimento" name="data_nascimento" type="text" inputmode="numeric" data-formato="data" placeholder="01011990">
          </div>
          <div class="campo c4">
            <label for="do-logradouro">LOGRADOURO</label>
            <input id="do-logradouro" name="logradouro" type="text" placeholder="Rua do Matão">
          </div>
          <div class="campo c2">
            <label for="do-numero">NÚMERO</label>
            <input id="do-numero" name="numero" type="text" placeholder="1010">
          </div>
          <div class="campo c4">
            <label for="do-complemento">COMPLEMENTO</label>
            <input id="do-complemento" name="complemento" type="text" placeholder="Sala 12">
          </div>

          <div class="campo c4">
            <label for="do-bairro">BAIRRO</label>
            <input id="do-bairro" name="bairro" type="text" placeholder="Cidade Universitária">
          </div>
          <div class="campo c2">
            <label for="do-cep">CEP</label>
            <input id="do-cep" name="cep" type="text" inputmode="numeric" data-formato="cep" placeholder="05508090">
          </div>
          <div class="campo c3">
            <label for="do-cidade">CIDADE</label>
            <input id="do-cidade" name="cidade" type="text" placeholder="São Paulo">
          </div>
          <div class="campo c3">
            <label for="do-estado">ESTADO</label>
            <input id="do-estado" name="estado" type="text" placeholder="SP">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo c3">
            <label for="do-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="do-cpf" name="cpf" type="text" inputmode="numeric" data-formato="cpf" placeholder="12345678909">
          </div>
          <div class="campo c3">
            <label for="do-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="do-rg" name="rg" type="text" placeholder="12.345.678-9">
          </div>
          <div class="campo c2">
            <label for="do-banco">NOME DO BANCO</label>
            <input id="do-banco" name="banco" type="text" placeholder="Banco do Brasil">
          </div>
          <div class="campo c2">
            <label for="do-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="do-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234">
          </div>
          <div class="campo c2">
            <label for="do-conta">NÚMERO DA CONTA</label>
            <input id="do-conta" name="conta" type="text" placeholder="98765-4">
          </div>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>

    <section id="confirmacao" hidden>
      <h2>Solicitação registrada</h2>
      <pre class="oficio"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
