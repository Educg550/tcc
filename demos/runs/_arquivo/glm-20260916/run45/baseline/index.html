<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<header class='cabecalho'>
  <img class='logo' src='assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
  <div>
    <h1>Universidade de São Paulo</h1>
    <p class='programa'>Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>
<nav class='abas' id='abas' role='tablist'>
  <button type='button' class='aba ativa' role='tab' aria-selected='true' data-alvo='painel-alunos'>ALUNOS</button>
  <button type='button' class='aba' role='tab' aria-selected='false' data-alvo='painel-docentes'>DOCENTES</button>
</nav>
<main>
  <section class='painel' id='painel-alunos'>
    <form class='formulario' data-perfil='alunos' novalidate>
      <div class='erros' hidden></div>
      <div class='blocos'>
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class='grade'>
            <div class='campo largo'>
              <label for='alunos-nome'>NOME COMPLETO - SEM ABREVIAR</label>
              <input id='alunos-nome' name='nome' type='text' placeholder='Ex.: Maria de Souza Silva'>
            </div>
            <div class='campo'>
              <label for='alunos-n-usp'>N. USP</label>
              <input id='alunos-n-usp' name='n_usp' type='text' placeholder='Ex.: 1234567'>
            </div>
            <div class='campo'>
              <label for='alunos-programa'>PROGRAMA</label>
              <input id='alunos-programa' name='programa' type='text' placeholder='Ex.: Ciência da Computação'>
            </div>
            <div class='campo'>
              <label for='alunos-nivel'>NÍVEL</label>
              <select id='alunos-nivel' name='nivel'>
                <option value=''>Selecione o nível</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select>
            </div>
            <div class='campo'>
              <label for='alunos-tipo-auxilio'>TIPO DE AUXÍLIO</label>
              <select id='alunos-tipo-auxilio' name='tipo_auxilio'>
                <option value=''>Selecione o tipo</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select>
            </div>
            <div class='campo'>
              <label for='alunos-email'>E-MAIL</label>
              <input id='alunos-email' name='email' type='text' placeholder='Ex.: maria.silva@usp.br'>
            </div>
            <div class='campo'>
              <label for='alunos-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id='alunos-evento' name='evento' type='text' placeholder='Ex.: Congresso Brasileiro de Matemática'>
            </div>
            <div class='campo'>
              <label for='alunos-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id='alunos-periodo' name='periodo' type='text' placeholder='Ex.: 10/08/2025 a 15/08/2025'>
            </div>
            <div class='campo'>
              <label for='alunos-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id='alunos-cidade-evento' name='cidade_evento' type='text' placeholder='Ex.: Salvador'>
            </div>
            <div class='campo'>
              <label for='alunos-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id='alunos-estado-evento' name='estado_evento' type='text' placeholder='Ex.: BA'>
            </div>
            <div class='campo'>
              <label for='alunos-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id='alunos-pais-evento' name='pais_evento' type='text' placeholder='Ex.: Brasil'>
            </div>
            <div class='campo'>
              <label for='alunos-link-evento'>LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id='alunos-link-evento' name='link_evento' type='text' placeholder='Ex.: https://www.evento.org.br'>
            </div>
            <div class='campo'>
              <label for='alunos-valor'>VALOR SOLICITADO (R$)</label>
              <input id='alunos-valor' name='valor' type='text' placeholder='Ex.: 150000'>
            </div>
            <div class='campo largo'>
              <label for='alunos-detalhamento'>DETALHAMENTO DO PEDIDO</label>
              <textarea id='alunos-detalhamento' name='detalhamento' rows='3' placeholder='Ex.: Inscrição no evento e passagem aérea de ida e volta'></textarea>
            </div>
            <div class='campo largo'>
              <label for='alunos-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id='alunos-apresentacao' name='apresentacao'>
                <option value=''>Selecione uma opção</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class='grade'>
            <div class='campo'>
              <label for='alunos-data-nascimento'>DATA DE NASCIMENTO</label>
              <input id='alunos-data-nascimento' name='data_nascimento' type='text' placeholder='Ex.: 01021980'>
            </div>
            <div class='campo'>
              <label for='alunos-logradouro'>LOGRADOURO</label>
              <input id='alunos-logradouro' name='logradouro' type='text' placeholder='Ex.: Rua do Matão'>
            </div>
            <div class='campo'>
              <label for='alunos-numero'>NÚMERO</label>
              <input id='alunos-numero' name='numero' type='text' placeholder='Ex.: 1010'>
            </div>
            <div class='campo'>
              <label for='alunos-complemento'>COMPLEMENTO</label>
              <input id='alunos-complemento' name='complemento' type='text' placeholder='Ex.: Sala 254'>
            </div>
            <div class='campo'>
              <label for='alunos-bairro'>BAIRRO</label>
              <input id='alunos-bairro' name='bairro' type='text' placeholder='Ex.: Cidade Universitária'>
            </div>
            <div class='campo'>
              <label for='alunos-cep'>CEP</label>
              <input id='alunos-cep' name='cep' type='text' placeholder='Ex.: 05508090'>
            </div>
            <div class='campo'>
              <label for='alunos-cidade'>CIDADE</label>
              <input id='alunos-cidade' name='cidade' type='text' placeholder='Ex.: São Paulo'>
            </div>
            <div class='campo'>
              <label for='alunos-estado'>ESTADO</label>
              <input id='alunos-estado' name='estado' type='text' placeholder='Ex.: SP'>
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class='grade'>
            <div class='campo'>
              <label for='alunos-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id='alunos-cpf' name='cpf' type='text' placeholder='Ex.: 12345678909'>
            </div>
            <div class='campo'>
              <label for='alunos-rg-rnm'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id='alunos-rg-rnm' name='rg_rnm' type='text' placeholder='Ex.: 12.345.678-9'>
            </div>
            <div class='campo'>
              <label for='alunos-banco'>NOME DO BANCO</label>
              <input id='alunos-banco' name='banco' type='text' placeholder='Ex.: Banco do Brasil'>
            </div>
            <div class='campo'>
              <label for='alunos-agencia'>NÚMERO DA AGÊNCIA</label>
              <input id='alunos-agencia' name='agencia' type='text' placeholder='Ex.: 1234'>
            </div>
            <div class='campo'>
              <label for='alunos-conta'>NÚMERO DA CONTA</label>
              <input id='alunos-conta' name='conta' type='text' placeholder='Ex.: 12345-6'>
            </div>
          </div>
        </fieldset>
      </div>
      <button type='submit' class='enviar'>Enviar solicitação</button>
    </form>
  </section>

  <section class='painel' id='painel-docentes' hidden>
    <form class='formulario' data-perfil='docentes' novalidate>
      <div class='erros' hidden></div>
      <div class='blocos'>
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class='grade'>
            <div class='campo largo'>
              <label for='docentes-nome'>NOME COMPLETO - SEM ABREVIAR</label>
              <input id='docentes-nome' name='nome' type='text' placeholder='Ex.: João de Souza Silva'>
            </div>
            <div class='campo'>
              <label for='docentes-n-usp'>N. USP</label>
              <input id='docentes-n-usp' name='n_usp' type='text' placeholder='Ex.: 1234567'>
            </div>
            <div class='campo'>
              <label for='docentes-programa'>PROGRAMA</label>
              <input id='docentes-programa' name='programa' type='text' placeholder='Ex.: Matemática Aplicada'>
            </div>
            <div class='campo'>
              <label for='docentes-email'>E-MAIL</label>
              <input id='docentes-email' name='email' type='text' placeholder='Ex.: joao.silva@usp.br'>
            </div>
            <div class='campo'>
              <label for='docentes-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id='docentes-evento' name='evento' type='text' placeholder='Ex.: Banca de defesa de mestrado'>
            </div>
            <div class='campo'>
              <label for='docentes-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id='docentes-periodo' name='periodo' type='text' placeholder='Ex.: 10/08/2025 a 15/08/2025'>
            </div>
            <div class='campo'>
              <label for='docentes-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id='docentes-cidade-evento' name='cidade_evento' type='text' placeholder='Ex.: Campinas'>
            </div>
            <div class='campo'>
              <label for='docentes-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id='docentes-estado-evento' name='estado_evento' type='text' placeholder='Ex.: SP'>
            </div>
            <div class='campo'>
              <label for='docentes-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id='docentes-pais-evento' name='pais_evento' type='text' placeholder='Ex.: Brasil'>
            </div>
            <div class='campo'>
              <label for='docentes-link-evento'>LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id='docentes-link-evento' name='link_evento' type='text' placeholder='Ex.: https://www.evento.org.br'>
            </div>
            <div class='campo'>
              <label for='docentes-valor'>VALOR SOLICITADO (R$)</label>
              <input id='docentes-valor' name='valor' type='text' placeholder='Ex.: 150000'>
            </div>
            <div class='campo largo'>
              <label for='docentes-detalhamento'>DETALHAMENTO DO PEDIDO</label>
              <textarea id='docentes-detalhamento' name='detalhamento' rows='3' placeholder='Ex.: Passagem aérea para participação em banca'></textarea>
            </div>
            <div class='campo largo'>
              <label for='docentes-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id='docentes-apresentacao' name='apresentacao'>
                <option value=''>Selecione uma opção</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class='grade'>
            <div class='campo'>
              <label for='docentes-data-nascimento'>DATA DE NASCIMENTO</label>
              <input id='docentes-data-nascimento' name='data_nascimento' type='text' placeholder='Ex.: 01021980'>
            </div>
            <div class='campo'>
              <label for='docentes-logradouro'>LOGRADOURO</label>
              <input id='docentes-logradouro' name='logradouro' type='text' placeholder='Ex.: Rua do Matão'>
            </div>
            <div class='campo'>
              <label for='docentes-numero'>NÚMERO</label>
              <input id='docentes-numero' name='numero' type='text' placeholder='Ex.: 1010'>
            </div>
            <div class='campo'>
              <label for='docentes-complemento'>COMPLEMENTO</label>
              <input id='docentes-complemento' name='complemento' type='text' placeholder='Ex.: Sala 254'>
            </div>
            <div class='campo'>
              <label for='docentes-bairro'>BAIRRO</label>
              <input id='docentes-bairro' name='bairro' type='text' placeholder='Ex.: Cidade Universitária'>
            </div>
            <div class='campo'>
              <label for='docentes-cep'>CEP</label>
              <input id='docentes-cep' name='cep' type='text' placeholder='Ex.: 05508090'>
            </div>
            <div class='campo'>
              <label for='docentes-cidade'>CIDADE</label>
              <input id='docentes-cidade' name='cidade' type='text' placeholder='Ex.: São Paulo'>
            </div>
            <div class='campo'>
              <label for='docentes-estado'>ESTADO</label>
              <input id='docentes-estado' name='estado' type='text' placeholder='Ex.: SP'>
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class='grade'>
            <div class='campo'>
              <label for='docentes-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id='docentes-cpf' name='cpf' type='text' placeholder='Ex.: 12345678909'>
            </div>
            <div class='campo'>
              <label for='docentes-rg-rnm'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id='docentes-rg-rnm' name='rg_rnm' type='text' placeholder='Ex.: 12.345.678-9'>
            </div>
            <div class='campo'>
              <label for='docentes-banco'>NOME DO BANCO</label>
              <input id='docentes-banco' name='banco' type='text' placeholder='Ex.: Banco do Brasil'>
            </div>
            <div class='campo'>
              <label for='docentes-agencia'>NÚMERO DA AGÊNCIA</label>
              <input id='docentes-agencia' name='agencia' type='text' placeholder='Ex.: 1234'>
            </div>
            <div class='campo'>
              <label for='docentes-conta'>NÚMERO DA CONTA</label>
              <input id='docentes-conta' name='conta' type='text' placeholder='Ex.: 12345-6'>
            </div>
          </div>
        </fieldset>
      </div>
      <button type='submit' class='enviar'>Enviar solicitação</button>
    </form>
  </section>

  <section class='confirmacao' id='confirmacao' hidden>
    <h2>Solicitação registrada</h2>
    <pre id='oficio'></pre>
  </section>
</main>
<script src='app.js'></script>
</body>
</html>
