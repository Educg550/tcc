<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel='stylesheet' href='/style.css'>
</head>
<body>
<header class='cabecalho'>
  <img class='logo' src='/assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
  <div class='identificacao'>
    <h1>Universidade de São Paulo</h1>
    <p class='programa'>Programa de Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>

<main class='conteudo'>
  <section id='formularios'>
    <nav class='abas'>
      <button type='button' class='aba ativa' data-painel='painel-alunos'>ALUNOS</button>
      <button type='button' class='aba' data-painel='painel-docentes'>DOCENTES</button>
    </nav>

    <form id='painel-alunos' class='painel ativo' novalidate>
      <div class='erros'></div>

      <h2 class='titulo-bloco'>SOLICITANTE E EVENTO</h2>
      <div class='grade'>
        <div class='campo col-2'>
          <label for='alunos-nome-completo'>NOME COMPLETO - SEM ABREVIAR</label>
          <input id='alunos-nome-completo' name='nome_completo' type='text' placeholder='Ex.: Maria da Silva'>
        </div>
        <div class='campo'>
          <label for='alunos-numero-usp'>N. USP</label>
          <input id='alunos-numero-usp' name='numero_usp' type='text' inputmode='numeric' placeholder='Ex.: 1234567'>
        </div>
        <div class='campo'>
          <label for='alunos-programa'>PROGRAMA</label>
          <input id='alunos-programa' name='programa' type='text' placeholder='Ex.: Ciência da Computação'>
        </div>
        <div class='campo'>
          <label for='alunos-nivel'>NÍVEL</label>
          <select id='alunos-nivel' name='nivel'>
            <option value=''>Selecione</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select>
        </div>
        <div class='campo'>
          <label for='alunos-tipo-auxilio'>TIPO DE AUXÍLIO</label>
          <select id='alunos-tipo-auxilio' name='tipo_auxilio'>
            <option value=''>Selecione</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select>
        </div>
        <div class='campo'>
          <label for='alunos-email'>E-MAIL</label>
          <input id='alunos-email' name='email' type='text' placeholder='Ex.: maria@usp.br'>
        </div>
        <div class='campo col-2'>
          <label for='alunos-nome-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input id='alunos-nome-evento' name='nome_evento' type='text' placeholder='Ex.: SBBD'>
        </div>
        <div class='campo'>
          <label for='alunos-periodo-evento'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input id='alunos-periodo-evento' name='periodo_evento' type='text' placeholder='Ex.: 1 a 4 de outubro de 2025'>
        </div>
        <div class='campo'>
          <label for='alunos-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input id='alunos-cidade-evento' name='cidade_evento' type='text' placeholder='Ex.: São Paulo'>
        </div>
        <div class='campo'>
          <label for='alunos-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input id='alunos-estado-evento' name='estado_evento' type='text' placeholder='Ex.: SP'>
        </div>
        <div class='campo'>
          <label for='alunos-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input id='alunos-pais-evento' name='pais_evento' type='text' placeholder='Ex.: Brasil'>
        </div>
        <div class='campo'>
          <label for='alunos-link-evento'>LINK DO EVENTO, EXAME OU DEFESA</label>
          <input id='alunos-link-evento' name='link_evento' type='text' placeholder='Ex.: https://sbbd.org.br'>
        </div>
        <div class='campo'>
          <label for='alunos-valor-solicitado'>VALOR SOLICITADO (R$)</label>
          <input id='alunos-valor-solicitado' name='valor_solicitado' type='text' inputmode='numeric' data-formato='moeda' placeholder='Ex.: R$ 1.500,00'>
        </div>
        <div class='campo col-2'>
          <label for='alunos-detalhamento'>DETALHAMENTO DO PEDIDO</label>
          <textarea id='alunos-detalhamento' name='detalhamento' rows='2' placeholder='Ex.: Passagens aéreas e inscrição no evento.'></textarea>
        </div>
        <div class='campo'>
          <label for='alunos-apresentacao-trabalho'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id='alunos-apresentacao-trabalho' name='apresentacao_trabalho'>
            <option value=''>Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </div>
      </div>

      <h2 class='titulo-bloco'>ENDEREÇO DO SOLICITANTE</h2>
      <div class='grade'>
        <div class='campo'>
          <label for='alunos-data-nascimento'>DATA DE NASCIMENTO</label>
          <input id='alunos-data-nascimento' name='data_nascimento' type='text' inputmode='numeric' data-formato='data' placeholder='Ex.: 01/02/1980'>
        </div>
        <div class='campo col-2'>
          <label for='alunos-logradouro'>LOGRADOURO</label>
          <input id='alunos-logradouro' name='logradouro' type='text' placeholder='Ex.: Rua do Anfiteatro'>
        </div>
        <div class='campo'>
          <label for='alunos-numero'>NÚMERO</label>
          <input id='alunos-numero' name='numero' type='text' placeholder='Ex.: 181'>
        </div>
        <div class='campo'>
          <label for='alunos-complemento'>COMPLEMENTO</label>
          <input id='alunos-complemento' name='complemento' type='text' placeholder='Ex.: Sala 214'>
        </div>
        <div class='campo'>
          <label for='alunos-bairro'>BAIRRO</label>
          <input id='alunos-bairro' name='bairro' type='text' placeholder='Ex.: Cidade Universitária'>
        </div>
        <div class='campo'>
          <label for='alunos-cep'>CEP</label>
          <input id='alunos-cep' name='cep' type='text' inputmode='numeric' data-formato='cep' placeholder='Ex.: 05508-090'>
        </div>
        <div class='campo'>
          <label for='alunos-cidade'>CIDADE</label>
          <input id='alunos-cidade' name='cidade' type='text' placeholder='Ex.: São Paulo'>
        </div>
        <div class='campo'>
          <label for='alunos-estado'>ESTADO</label>
          <input id='alunos-estado' name='estado' type='text' placeholder='Ex.: SP'>
        </div>
      </div>

      <h2 class='titulo-bloco'>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class='grade'>
        <div class='campo'>
          <label for='alunos-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id='alunos-cpf' name='cpf' type='text' inputmode='numeric' data-formato='cpf' placeholder='Ex.: 123.456.789-09'>
        </div>
        <div class='campo'>
          <label for='alunos-rg-rnm'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id='alunos-rg-rnm' name='rg_rnm' type='text' placeholder='Ex.: 12.345.678-9'>
        </div>
        <div class='campo'>
          <label for='alunos-nome-banco'>NOME DO BANCO</label>
          <input id='alunos-nome-banco' name='nome_banco' type='text' placeholder='Ex.: Banco do Brasil'>
        </div>
        <div class='campo'>
          <label for='alunos-numero-agencia'>NÚMERO DA AGÊNCIA</label>
          <input id='alunos-numero-agencia' name='numero_agencia' type='text' inputmode='numeric' placeholder='Ex.: 1234'>
        </div>
        <div class='campo'>
          <label for='alunos-numero-conta'>NÚMERO DA CONTA</label>
          <input id='alunos-numero-conta' name='numero_conta' type='text' placeholder='Ex.: 12345-6'>
        </div>
      </div>

      <button type='submit' class='enviar'>Enviar solicitação</button>
    </form>

    <form id='painel-docentes' class='painel' novalidate>
      <div class='erros'></div>

      <h2 class='titulo-bloco'>SOLICITANTE E EVENTO</h2>
      <div class='grade'>
        <div class='campo col-2'>
          <label for='docentes-nome-completo'>NOME COMPLETO - SEM ABREVIAR</label>
          <input id='docentes-nome-completo' name='nome_completo' type='text' placeholder='Ex.: Maria da Silva'>
        </div>
        <div class='campo'>
          <label for='docentes-numero-usp'>N. USP</label>
          <input id='docentes-numero-usp' name='numero_usp' type='text' inputmode='numeric' placeholder='Ex.: 1234567'>
        </div>
        <div class='campo'>
          <label for='docentes-programa'>PROGRAMA</label>
          <input id='docentes-programa' name='programa' type='text' placeholder='Ex.: Ciência da Computação'>
        </div>
        <div class='campo'>
          <label for='docentes-email'>E-MAIL</label>
          <input id='docentes-email' name='email' type='text' placeholder='Ex.: maria@usp.br'>
        </div>
        <div class='campo col-3'>
          <label for='docentes-nome-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input id='docentes-nome-evento' name='nome_evento' type='text' placeholder='Ex.: SBBD'>
        </div>
        <div class='campo'>
          <label for='docentes-periodo-evento'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input id='docentes-periodo-evento' name='periodo_evento' type='text' placeholder='Ex.: 1 a 4 de outubro de 2025'>
        </div>
        <div class='campo'>
          <label for='docentes-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input id='docentes-cidade-evento' name='cidade_evento' type='text' placeholder='Ex.: São Paulo'>
        </div>
        <div class='campo'>
          <label for='docentes-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input id='docentes-estado-evento' name='estado_evento' type='text' placeholder='Ex.: SP'>
        </div>
        <div class='campo'>
          <label for='docentes-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input id='docentes-pais-evento' name='pais_evento' type='text' placeholder='Ex.: Brasil'>
        </div>
        <div class='campo'>
          <label for='docentes-link-evento'>LINK DO EVENTO, EXAME OU DEFESA</label>
          <input id='docentes-link-evento' name='link_evento' type='text' placeholder='Ex.: https://sbbd.org.br'>
        </div>
        <div class='campo'>
          <label for='docentes-valor-solicitado'>VALOR SOLICITADO (R$)</label>
          <input id='docentes-valor-solicitado' name='valor_solicitado' type='text' inputmode='numeric' data-formato='moeda' placeholder='Ex.: R$ 1.500,00'>
        </div>
        <div class='campo col-2'>
          <label for='docentes-detalhamento'>DETALHAMENTO DO PEDIDO</label>
          <textarea id='docentes-detalhamento' name='detalhamento' rows='2' placeholder='Ex.: Passagens aéreas e inscrição no evento.'></textarea>
        </div>
        <div class='campo'>
          <label for='docentes-apresentacao-trabalho'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id='docentes-apresentacao-trabalho' name='apresentacao_trabalho'>
            <option value=''>Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </div>
      </div>

      <h2 class='titulo-bloco'>ENDEREÇO DO SOLICITANTE</h2>
      <div class='grade'>
        <div class='campo'>
          <label for='docentes-data-nascimento'>DATA DE NASCIMENTO</label>
          <input id='docentes-data-nascimento' name='data_nascimento' type='text' inputmode='numeric' data-formato='data' placeholder='Ex.: 01/02/1980'>
        </div>
        <div class='campo col-2'>
          <label for='docentes-logradouro'>LOGRADOURO</label>
          <input id='docentes-logradouro' name='logradouro' type='text' placeholder='Ex.: Rua do Anfiteatro'>
        </div>
        <div class='campo'>
          <label for='docentes-numero'>NÚMERO</label>
          <input id='docentes-numero' name='numero' type='text' placeholder='Ex.: 181'>
        </div>
        <div class='campo'>
          <label for='docentes-complemento'>COMPLEMENTO</label>
          <input id='docentes-complemento' name='complemento' type='text' placeholder='Ex.: Sala 214'>
        </div>
        <div class='campo'>
          <label for='docentes-bairro'>BAIRRO</label>
          <input id='docentes-bairro' name='bairro' type='text' placeholder='Ex.: Cidade Universitária'>
        </div>
        <div class='campo'>
          <label for='docentes-cep'>CEP</label>
          <input id='docentes-cep' name='cep' type='text' inputmode='numeric' data-formato='cep' placeholder='Ex.: 05508-090'>
        </div>
        <div class='campo'>
          <label for='docentes-cidade'>CIDADE</label>
          <input id='docentes-cidade' name='cidade' type='text' placeholder='Ex.: São Paulo'>
        </div>
        <div class='campo'>
          <label for='docentes-estado'>ESTADO</label>
          <input id='docentes-estado' name='estado' type='text' placeholder='Ex.: SP'>
        </div>
      </div>

      <h2 class='titulo-bloco'>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class='grade'>
        <div class='campo'>
          <label for='docentes-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id='docentes-cpf' name='cpf' type='text' inputmode='numeric' data-formato='cpf' placeholder='Ex.: 123.456.789-09'>
        </div>
        <div class='campo'>
          <label for='docentes-rg-rnm'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id='docentes-rg-rnm' name='rg_rnm' type='text' placeholder='Ex.: 12.345.678-9'>
        </div>
        <div class='campo'>
          <label for='docentes-nome-banco'>NOME DO BANCO</label>
          <input id='docentes-nome-banco' name='nome_banco' type='text' placeholder='Ex.: Banco do Brasil'>
        </div>
        <div class='campo'>
          <label for='docentes-numero-agencia'>NÚMERO DA AGÊNCIA</label>
          <input id='docentes-numero-agencia' name='numero_agencia' type='text' inputmode='numeric' placeholder='Ex.: 1234'>
        </div>
        <div class='campo'>
          <label for='docentes-numero-conta'>NÚMERO DA CONTA</label>
          <input id='docentes-numero-conta' name='numero_conta' type='text' placeholder='Ex.: 12345-6'>
        </div>
      </div>

      <button type='submit' class='enviar'>Enviar solicitação</button>
    </form>
  </section>

  <section id='confirmacao' hidden>
    <h2>Solicitação registrada</h2>
    <pre id='texto-oficio'></pre>
  </section>
</main>

<script src='/app.js'></script>
</body>
</html>
