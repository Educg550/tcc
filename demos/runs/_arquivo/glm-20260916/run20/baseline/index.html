<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div>
    <h1>Universidade de São Paulo</h1>
    <p>Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>
<main id="formulario">
  <nav class="abas" aria-label="Tipo de solicitante">
    <button type="button" id="aba-alunos" class="aba ativa">ALUNOS</button>
    <button type="button" id="aba-docentes" class="aba">DOCENTES</button>
  </nav>
  <form id="form-alunos" novalidate></form>
  <form id="form-docentes" class="oculta" novalidate></form>
</main>
<section id="confirmacao" class="oculta">
  <h2>Solicitação registrada</h2>
  <pre id="oficio"></pre>
</section>
<script src="/app.js"></script>
</body>
</html>
