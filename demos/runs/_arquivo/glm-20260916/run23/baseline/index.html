<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação do IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="cabecalho-texto">
    <h1 class="universidade">Universidade de São Paulo</h1>
    <span class="programa">Programa de Pós-Graduação do IME</span>
  </div>
</header>

<main>
  <section id="formulario-view">
    <nav class="abas">
      <button type="button" id="aba-alunos" class="aba ativa" role="tab" aria-selected="true">ALUNOS</button>
      <button type="button" id="aba-docentes" class="aba" role="tab" aria-selected="false">DOCENTES</button>
    </nav>
    <form id="form-alunos" class="formulario" novalidate></form>
    <form id="form-docentes" class="formulario oculto" novalidate></form>
  </section>

  <section id="confirmacao-view" class="oculto">
    <h2 class="titulo-confirmacao">Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
