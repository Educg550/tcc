<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel='stylesheet' href='/style.css'>
<script src='/app.js' defer></script>
</head>
<body>
<header class='cabecalho'>
  <div class='marca'>
    <img class='logo-usp' src='/assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
    <div>
      <h1>Universidade de São Paulo</h1>
      <p class='programa-ime'>Pós-Graduação do Instituto de Matemática e Estatística</p>
    </div>
  </div>
</header>
<nav class='abas'>
  <button type='button' class='aba ativa' data-aba='alunos'>ALUNOS</button>
  <button type='button' class='aba' data-aba='docentes'>DOCENTES</button>
</nav>
<main>
  <form id='form-alunos' class='formulario' data-aba='alunos' novalidate>
    <div class='erros' role='alert'></div>
    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class='grade'>
        <label class='c6'>NOME COMPLETO - SEM ABREVIAR
          <input type='text' name='nome' placeholder='Maria de Souza' required>
        </label>
        <label class='c2'>N. USP
          <input type='text' name='n_usp' placeholder='1234567' required>
        </label>
        <label class='c4'>PROGRAMA
          <input type='text' name='programa' placeholder='Ciência da Computação' required>
        </label>
        <label class='c3'>NÍVEL
          <select name='nivel' required>
            <option value=''>Selecione o nível</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select>
        </label>
        <label class='c4'>TIPO DE AUXÍLIO
          <select name='tipo_auxilio' required>
            <option value=''>Selecione o auxílio</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select>
        </label>
        <label class='c5'>E-MAIL
          <input type='email' name='email' placeholder='maria.souza@usp.br' required>
        </label>
        <label class='c6'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA
          <input type='text' name='nome_evento' placeholder='Simpósio Brasileiro de Computação' required>
        </label>
        <label class='c6'>PERÍODO DO EVENTO, EXAME OU DEFESA
          <input type='text' name='periodo_evento' placeholder='10 a 15 de julho de 2025' required>
        </label>
        <label class='c3'>CIDADE DO EVENTO, EXAME OU DEFESA
          <input type='text' name='cidade_evento' placeholder='São Paulo' required>
        </label>
        <label class='c2'>ESTADO DO EVENTO, EXAME OU DEFESA
          <input type='text' name='estado_evento' placeholder='SP' required>
        </label>
        <label class='c3'>PAÍS DO EVENTO, EXAME OU DEFESA
          <input type='text' name='pais_evento' placeholder='Brasil' required>
        </label>
        <label class='c4'>LINK DO EVENTO, EXAME OU DEFESA
          <input type='text' name='link_evento' placeholder='https://sbc.org.br/evento'>
        </label>
        <label class='c2'>VALOR SOLICITADO (R$)
          <input type='text' name='valor_solicitado' data-formato='valor' placeholder='150000' required>
        </label>
        <label class='c6'>DETALHAMENTO DO PEDIDO
          <textarea name='detalhamento' rows='2' placeholder='Inscrição e passagem aérea' required></textarea>
        </label>
        <label class='c4'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
          <select name='apresentacao' required>
            <option value=''>Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </label>
      </div>
    </fieldset>
    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class='grade'>
        <label class='c2'>DATA DE NASCIMENTO
          <input type='text' name='data_nascimento' data-formato='data' placeholder='01021980' required>
        </label>
        <label class='c5'>LOGRADOURO
          <input type='text' name='logradouro' placeholder='Rua do Anfiteatro' required>
        </label>
        <label class='c2'>NÚMERO
          <input type='text' name='numero' placeholder='101' required>
        </label>
        <label class='c3'>COMPLEMENTO
          <input type='text' name='complemento' placeholder='Sala 12'>
        </label>
        <label class='c4'>BAIRRO
          <input type='text' name='bairro' placeholder='Butantã' required>
        </label>
        <label class='c2'>CEP
          <input type='text' name='cep' data-formato='cep' placeholder='05508090' required>
        </label>
        <label class='c3'>CIDADE
          <input type='text' name='cidade' placeholder='São Paulo' required>
        </label>
        <label class='c3'>ESTADO
          <input type='text' name='estado' placeholder='SP' required>
        </label>
      </div>
    </fieldset>
    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class='grade'>
        <label class='c3'>CPF (SEPARADOS POR PONTOS E TRAÇO)
          <input type='text' name='cpf' data-formato='cpf' placeholder='12345678909' required>
        </label>
        <label class='c4'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
          <input type='text' name='rg_rnm' placeholder='12.345.678-9' required>
        </label>
        <label class='c5'>NOME DO BANCO
          <input type='text' name='nome_banco' placeholder='Banco do Brasil' required>
        </label>
        <label class='c2'>NÚMERO DA AGÊNCIA
          <input type='text' name='agencia' placeholder='1234' required>
        </label>
        <label class='c4'>NÚMERO DA CONTA
          <input type='text' name='conta' placeholder='12345-6' required>
        </label>
      </div>
    </fieldset>
    <button type='submit' class='enviar'>Enviar solicitação</button>
  </form>
  <form id='form-docentes' class='formulario' data-aba='docentes' novalidate hidden>
    <div class='erros' role='alert'></div>
    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class='grade'>
        <label class='c6'>NOME COMPLETO - SEM ABREVIAR
          <input type='text' name='nome' placeholder='João de Oliveira' required>
        </label>
        <label class='c2'>N. USP
          <input type='text' name='n_usp' placeholder='1234567' required>
        </label>
        <label class='c4'>PROGRAMA
          <input type='text' name='programa' placeholder='Física Matemática' required>
        </label>
        <label class='c5'>E-MAIL
          <input type='email' name='email' placeholder='joao.oliveira@usp.br' required>
        </label>
        <label class='c7'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA
          <input type='text' name='nome_evento' placeholder='Banca de defesa de mestrado' required>
        </label>
        <label class='c6'>PERÍODO DO EVENTO, EXAME OU DEFESA
          <input type='text' name='periodo_evento' placeholder='10 a 15 de julho de 2025' required>
        </label>
        <label class='c3'>CIDADE DO EVENTO, EXAME OU DEFESA
          <input type='text' name='cidade_evento' placeholder='São Paulo' required>
        </label>
        <label class='c2'>ESTADO DO EVENTO, EXAME OU DEFESA
          <input type='text' name='estado_evento' placeholder='SP' required>
        </label>
        <label class='c3'>PAÍS DO EVENTO, EXAME OU DEFESA
          <input type='text' name='pais_evento' placeholder='Brasil' required>
        </label>
        <label class='c4'>LINK DO EVENTO, EXAME OU DEFESA
          <input type='text' name='link_evento' placeholder='https://ime.usp.br'>
        </label>
        <label class='c3'>VALOR SOLICITADO (R$)
          <input type='text' name='valor_solicitado' data-formato='valor' placeholder='150000' required>
        </label>
        <label class='c6'>DETALHAMENTO DO PEDIDO
          <textarea name='detalhamento' rows='2' placeholder='Passagem e diárias' required></textarea>
        </label>
        <label class='c3'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
          <select name='apresentacao' required>
            <option value=''>Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </label>
      </div>
    </fieldset>
    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class='grade'>
        <label class='c2'>DATA DE NASCIMENTO
          <input type='text' name='data_nascimento' data-formato='data' placeholder='01021980' required>
        </label>
        <label class='c5'>LOGRADOURO
          <input type='text' name='logradouro' placeholder='Rua do Anfiteatro' required>
        </label>
        <label class='c2'>NÚMERO
          <input type='text' name='numero' placeholder='101' required>
        </label>
        <label class='c3'>COMPLEMENTO
          <input type='text' name='complemento' placeholder='Sala 12'>
        </label>
        <label class='c4'>BAIRRO
          <input type='text' name='bairro' placeholder='Butantã' required>
        </label>
        <label class='c2'>CEP
          <input type='text' name='cep' data-formato='cep' placeholder='05508090' required>
        </label>
        <label class='c3'>CIDADE
          <input type='text' name='cidade' placeholder='São Paulo' required>
        </label>
        <label class='c3'>ESTADO
          <input type='text' name='estado' placeholder='SP' required>
        </label>
      </div>
    </fieldset>
    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class='grade'>
        <label class='c3'>CPF (SEPARADOS POR PONTOS E TRAÇO)
          <input type='text' name='cpf' data-formato='cpf' placeholder='12345678909' required>
        </label>
        <label class='c4'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
          <input type='text' name='rg_rnm' placeholder='12.345.678-9' required>
        </label>
        <label class='c5'>NOME DO BANCO
          <input type='text' name='nome_banco' placeholder='Banco do Brasil' required>
        </label>
        <label class='c2'>NÚMERO DA AGÊNCIA
          <input type='text' name='agencia' placeholder='1234' required>
        </label>
        <label class='c4'>NÚMERO DA CONTA
          <input type='text' name='conta' placeholder='12345-6' required>
        </label>
      </div>
    </fieldset>
    <button type='submit' class='enviar'>Enviar solicitação</button>
  </form>
  <section id='confirmacao' class='confirmacao' hidden>
    <h2>Solicitação registrada</h2>
    <pre id='oficio'></pre>
  </section>
</main>
</body>
</html>
