<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="identificacao">
    <h1>Universidade de São Paulo</h1>
    <p class="programa">Pós-Graduação - Instituto de Matemática e Estatística</p>
  </div>
</header>

<main id="formulario">
  <nav class="abas">
    <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>

  <section class="painel" id="painel-alunos">
    <form class="solicitacao" data-aba="ALUNOS">
      <div class="erros" role="alert"></div>
      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="campos">
          <label class="c2">NOME COMPLETO - SEM ABREVIAR<input name="NOME COMPLETO - SEM ABREVIAR" placeholder="Maria da Silva"></label>
          <label>N. USP<input name="N. USP" inputmode="numeric" placeholder="1234567"></label>
          <label>PROGRAMA<input name="PROGRAMA" placeholder="Ciência da Computação"></label>
          <label>NÍVEL<select name="NÍVEL"><option value="">Selecione</option><option>Mestrado</option><option>Doutorado</option></select></label>
          <label>TIPO DE AUXÍLIO<select name="TIPO DE AUXÍLIO"><option value="">Selecione</option><option>Participação em evento</option><option>Banca de exame ou defesa</option><option>Outro</option></select></label>
          <label class="c2">E-MAIL<input name="E-MAIL" placeholder="maria@usp.br"></label>
          <label class="c2">NOME DO EVENTO / BANCA DE EXAME OU DEFESA<input name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="SBBD 2025"></label>
          <label class="c2">PERÍODO DO EVENTO, EXAME OU DEFESA<input name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="1 a 4 de outubro de 2025"></label>
          <label>CIDADE DO EVENTO, EXAME OU DEFESA<input name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="São Paulo"></label>
          <label>ESTADO DO EVENTO, EXAME OU DEFESA<input name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="SP"></label>
          <label>PAÍS DO EVENTO, EXAME OU DEFESA<input name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil"></label>
          <label>LINK DO EVENTO, EXAME OU DEFESA<input name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="www.exemplo.com.br"></label>
          <label>VALOR SOLICITADO (R$)<input class="fmt-moeda" name="VALOR SOLICITADO (R$)" inputmode="numeric" placeholder="150000"></label>
          <label class="c3">DETALHAMENTO DO PEDIDO<textarea name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Passagem aérea e inscrição no evento."></textarea></label>
          <label class="c4">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?<select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?"><option value="">Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="campos">
          <label>DATA DE NASCIMENTO<input class="fmt-data" name="DATA DE NASCIMENTO" inputmode="numeric" placeholder="01021980"></label>
          <label class="c2">LOGRADOURO<input name="LOGRADOURO" placeholder="Rua do Anfiteatro"></label>
          <label>NÚMERO<input name="NÚMERO" placeholder="181"></label>
          <label>COMPLEMENTO<input name="COMPLEMENTO" placeholder="Sala 214"></label>
          <label class="c2">BAIRRO<input name="BAIRRO" placeholder="Cidade Universitária"></label>
          <label>CEP<input class="fmt-cep" name="CEP" inputmode="numeric" placeholder="05508090"></label>
          <label class="c2">CIDADE<input name="CIDADE" placeholder="São Paulo"></label>
          <label class="c2">ESTADO<input name="ESTADO" placeholder="SP"></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="campos">
          <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input class="fmt-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" inputmode="numeric" placeholder="12345678909"></label>
          <label class="c2">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9"></label>
          <label>NOME DO BANCO<input name="NOME DO BANCO" placeholder="Banco do Brasil"></label>
          <label class="c2">NÚMERO DA AGÊNCIA<input name="NÚMERO DA AGÊNCIA" inputmode="numeric" placeholder="1234"></label>
          <label class="c2">NÚMERO DA CONTA<input name="NÚMERO DA CONTA" placeholder="98765-4"></label>
        </div>
      </fieldset>
      <div class="acoes">
        <button type="submit">Enviar solicitação</button>
      </div>
    </form>
  </section>

  <section class="painel" id="painel-docentes" hidden>
    <form class="solicitacao" data-aba="DOCENTES">
      <div class="erros" role="alert"></div>
      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="campos">
          <label class="c2">NOME COMPLETO - SEM ABREVIAR<input name="NOME COMPLETO - SEM ABREVIAR" placeholder="Maria da Silva"></label>
          <label>N. USP<input name="N. USP" inputmode="numeric" placeholder="1234567"></label>
          <label>PROGRAMA<input name="PROGRAMA" placeholder="Ciência da Computação"></label>
          <label class="c2">E-MAIL<input name="E-MAIL" placeholder="maria@usp.br"></label>
          <label class="c2">NOME DO EVENTO / BANCA DE EXAME OU DEFESA<input name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="SBBD 2025"></label>
          <label class="c2">PERÍODO DO EVENTO, EXAME OU DEFESA<input name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="1 a 4 de outubro de 2025"></label>
          <label>CIDADE DO EVENTO, EXAME OU DEFESA<input name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="São Paulo"></label>
          <label>ESTADO DO EVENTO, EXAME OU DEFESA<input name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="SP"></label>
          <label>PAÍS DO EVENTO, EXAME OU DEFESA<input name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil"></label>
          <label class="c2">LINK DO EVENTO, EXAME OU DEFESA<input name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="www.exemplo.com.br"></label>
          <label>VALOR SOLICITADO (R$)<input class="fmt-moeda" name="VALOR SOLICITADO (R$)" inputmode="numeric" placeholder="150000"></label>
          <label class="c3">DETALHAMENTO DO PEDIDO<textarea name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Passagem aérea e inscrição no evento."></textarea></label>
          <label class="c4">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?<select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?"><option value="">Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="campos">
          <label>DATA DE NASCIMENTO<input class="fmt-data" name="DATA DE NASCIMENTO" inputmode="numeric" placeholder="01021980"></label>
          <label class="c2">LOGRADOURO<input name="LOGRADOURO" placeholder="Rua do Anfiteatro"></label>
          <label>NÚMERO<input name="NÚMERO" placeholder="181"></label>
          <label>COMPLEMENTO<input name="COMPLEMENTO" placeholder="Sala 214"></label>
          <label class="c2">BAIRRO<input name="BAIRRO" placeholder="Cidade Universitária"></label>
          <label>CEP<input class="fmt-cep" name="CEP" inputmode="numeric" placeholder="05508090"></label>
          <label class="c2">CIDADE<input name="CIDADE" placeholder="São Paulo"></label>
          <label class="c2">ESTADO<input name="ESTADO" placeholder="SP"></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="campos">
          <label>CPF (SEPARADOS POR PONTOS E TRAÇO)<input class="fmt-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" inputmode="numeric" placeholder="12345678909"></label>
          <label class="c2">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)<input name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9"></label>
          <label>NOME DO BANCO<input name="NOME DO BANCO" placeholder="Banco do Brasil"></label>
          <label class="c2">NÚMERO DA AGÊNCIA<input name="NÚMERO DA AGÊNCIA" inputmode="numeric" placeholder="1234"></label>
          <label class="c2">NÚMERO DA CONTA<input name="NÚMERO DA CONTA" placeholder="98765-4"></label>
        </div>
      </fieldset>
      <div class="acoes">
        <button type="submit">Enviar solicitação</button>
      </div>
    </form>
  </section>
</main>

<section id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <pre id="oficio"></pre>
</section>

<script src="app.js"></script>
</body>
</html>
