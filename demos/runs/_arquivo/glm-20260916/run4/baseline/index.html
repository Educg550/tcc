<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel='stylesheet' href='/style.css'>
</head>
<body>
<header class='cabecalho'>
  <img class='logo' src='/assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
  <div class='titulos'>
    <h1>Universidade de São Paulo</h1>
    <p>Programa de Pós-Graduação do IME-USP</p>
  </div>
</header>

<nav class='abas' id='abas' aria-label='Tipo de solicitante'>
  <button type='button' class='aba ativa' data-alvo='painel-alunos'>ALUNOS</button>
  <button type='button' class='aba' data-alvo='painel-docentes'>DOCENTES</button>
</nav>

<main id='conteudo'>
  <form id='painel-alunos' class='painel solicitacao' data-aba='alunos'>
    <div class='erros' role='alert' hidden></div>
    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class='grid'>
        <label class='campo span-2'><span class='rotulo'>NOME COMPLETO - SEM ABREVIAR</span>
          <input name='nome_completo' type='text' placeholder='Ex.: Maria de Souza Silva'></label>
        <label class='campo'><span class='rotulo'>N. USP</span>
          <input name='n_usp' type='text' placeholder='Ex.: 9876543'></label>
        <label class='campo'><span class='rotulo'>PROGRAMA</span>
          <input name='programa' type='text' placeholder='Ex.: Ciência da Computação'></label>
        <label class='campo'><span class='rotulo'>NÍVEL</span>
          <select name='nivel'>
            <option value='' selected>Ex.: Doutorado</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select></label>
        <label class='campo'><span class='rotulo'>TIPO DE AUXÍLIO</span>
          <select name='tipo_auxilio'>
            <option value='' selected>Ex.: Outro</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select></label>
        <label class='campo span-2'><span class='rotulo'>E-MAIL</span>
          <input name='email' type='text' placeholder='Ex.: maria.silva@usp.br'></label>
        <label class='campo span-2'><span class='rotulo'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
          <input name='nome_evento' type='text' placeholder='Ex.: CSBC 2025'></label>
        <label class='campo'><span class='rotulo'>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
          <input name='periodo_evento' type='text' placeholder='Ex.: 10 a 12/09/2025'></label>
        <label class='campo'><span class='rotulo'>CIDADE DO EVENTO, EXAME OU DEFESA</span>
          <input name='cidade_evento' type='text' placeholder='Ex.: São Paulo'></label>
        <label class='campo'><span class='rotulo'>ESTADO DO EVENTO, EXAME OU DEFESA</span>
          <input name='estado_evento' type='text' placeholder='Ex.: SP'></label>
        <label class='campo'><span class='rotulo'>PAÍS DO EVENTO, EXAME OU DEFESA</span>
          <input name='pais_evento' type='text' placeholder='Ex.: Brasil'></label>
        <label class='campo span-2'><span class='rotulo'>LINK DO EVENTO, EXAME OU DEFESA</span>
          <input name='link_evento' type='text' placeholder='Ex.: https://csbc.sbc.org.br'></label>
        <label class='campo'><span class='rotulo'>VALOR SOLICITADO (R$)</span>
          <input name='valor_solicitado' type='text' data-mascara='moeda' placeholder='Ex.: 150000'></label>
        <label class='campo'><span class='rotulo'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
          <select name='apresentacao'>
            <option value='' selected>Ex.: Pôster</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select></label>
        <label class='campo span-2'><span class='rotulo'>DETALHAMENTO DO PEDIDO</span>
          <textarea name='detalhamento' rows='2' placeholder='Ex.: Inscrição no evento e passagem aérea.'></textarea></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class='grid'>
        <label class='campo'><span class='rotulo'>DATA DE NASCIMENTO</span>
          <input name='data_nascimento' type='text' data-mascara='data' placeholder='Ex.: 01021980'></label>
        <label class='campo'><span class='rotulo'>LOGRADOURO</span>
          <input name='logradouro' type='text' placeholder='Ex.: Rua do Anfiteatro'></label>
        <label class='campo'><span class='rotulo'>NÚMERO</span>
          <input name='numero' type='text' placeholder='Ex.: 181'></label>
        <label class='campo'><span class='rotulo'>COMPLEMENTO</span>
          <input name='complemento' type='text' placeholder='Ex.: Sala 214'></label>
        <label class='campo'><span class='rotulo'>BAIRRO</span>
          <input name='bairro' type='text' placeholder='Ex.: Butantã'></label>
        <label class='campo'><span class='rotulo'>CEP</span>
          <input name='cep' type='text' data-mascara='cep' placeholder='Ex.: 05508090'></label>
        <label class='campo'><span class='rotulo'>CIDADE</span>
          <input name='cidade' type='text' placeholder='Ex.: São Paulo'></label>
        <label class='campo'><span class='rotulo'>ESTADO</span>
          <input name='estado' type='text' placeholder='Ex.: SP'></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class='grid'>
        <label class='campo'><span class='rotulo'>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input name='cpf' type='text' data-mascara='cpf' placeholder='Ex.: 12345678909'></label>
        <label class='campo'><span class='rotulo'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input name='rg_rnm' type='text' placeholder='Ex.: 12.345.678-9'></label>
        <label class='campo span-2'><span class='rotulo'>NOME DO BANCO</span>
          <input name='nome_banco' type='text' placeholder='Ex.: Banco do Brasil'></label>
        <label class='campo'><span class='rotulo'>NÚMERO DA AGÊNCIA</span>
          <input name='agencia' type='text' placeholder='Ex.: 0034'></label>
        <label class='campo'><span class='rotulo'>NÚMERO DA CONTA</span>
          <input name='conta' type='text' placeholder='Ex.: 12345-6'></label>
      </div>
    </fieldset>
    <div class='acoes'>
      <button type='submit' class='enviar'>Enviar solicitação</button>
    </div>
  </form>

  <form id='painel-docentes' class='painel solicitacao' data-aba='docentes' hidden>
    <div class='erros' role='alert' hidden></div>
    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class='grid'>
        <label class='campo span-2'><span class='rotulo'>NOME COMPLETO - SEM ABREVIAR</span>
          <input name='nome_completo' type='text' placeholder='Ex.: João Cardoso Lima'></label>
        <label class='campo'><span class='rotulo'>N. USP</span>
          <input name='n_usp' type='text' placeholder='Ex.: 1234567'></label>
        <label class='campo'><span class='rotulo'>PROGRAMA</span>
          <input name='programa' type='text' placeholder='Ex.: Estatística'></label>
        <label class='campo span-2'><span class='rotulo'>E-MAIL</span>
          <input name='email' type='text' placeholder='Ex.: joao.lima@ime.usp.br'></label>
        <label class='campo span-2'><span class='rotulo'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
          <input name='nome_evento' type='text' placeholder='Ex.: Banca de defesa de mestrado'></label>
        <label class='campo'><span class='rotulo'>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
          <input name='periodo_evento' type='text' placeholder='Ex.: 03 e 04/08/2025'></label>
        <label class='campo'><span class='rotulo'>CIDADE DO EVENTO, EXAME OU DEFESA</span>
          <input name='cidade_evento' type='text' placeholder='Ex.: Campinas'></label>
        <label class='campo'><span class='rotulo'>ESTADO DO EVENTO, EXAME OU DEFESA</span>
          <input name='estado_evento' type='text' placeholder='Ex.: SP'></label>
        <label class='campo'><span class='rotulo'>PAÍS DO EVENTO, EXAME OU DEFESA</span>
          <input name='pais_evento' type='text' placeholder='Ex.: Brasil'></label>
        <label class='campo span-2'><span class='rotulo'>LINK DO EVENTO, EXAME OU DEFESA</span>
          <input name='link_evento' type='text' placeholder='Ex.: https://www.ime.usp.br/evento'></label>
        <label class='campo'><span class='rotulo'>VALOR SOLICITADO (R$)</span>
          <input name='valor_solicitado' type='text' data-mascara='moeda' placeholder='Ex.: 150000'></label>
        <label class='campo'><span class='rotulo'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
          <select name='apresentacao'>
            <option value='' selected>Ex.: Outra</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select></label>
        <label class='campo span-4'><span class='rotulo'>DETALHAMENTO DO PEDIDO</span>
          <textarea name='detalhamento' rows='2' placeholder='Ex.: Passagem rodoviária para participação em banca.'></textarea></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class='grid'>
        <label class='campo'><span class='rotulo'>DATA DE NASCIMENTO</span>
          <input name='data_nascimento' type='text' data-mascara='data' placeholder='Ex.: 01021980'></label>
        <label class='campo'><span class='rotulo'>LOGRADOURO</span>
          <input name='logradouro' type='text' placeholder='Ex.: Rua do Matão'></label>
        <label class='campo'><span class='rotulo'>NÚMERO</span>
          <input name='numero' type='text' placeholder='Ex.: 1010'></label>
        <label class='campo'><span class='rotulo'>COMPLEMENTO</span>
          <input name='complemento' type='text' placeholder='Ex.: Sala 25'></label>
        <label class='campo'><span class='rotulo'>BAIRRO</span>
          <input name='bairro' type='text' placeholder='Ex.: Cidade Universitária'></label>
        <label class='campo'><span class='rotulo'>CEP</span>
          <input name='cep' type='text' data-mascara='cep' placeholder='Ex.: 05508090'></label>
        <label class='campo'><span class='rotulo'>CIDADE</span>
          <input name='cidade' type='text' placeholder='Ex.: São Paulo'></label>
        <label class='campo'><span class='rotulo'>ESTADO</span>
          <input name='estado' type='text' placeholder='Ex.: SP'></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class='grid'>
        <label class='campo'><span class='rotulo'>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input name='cpf' type='text' data-mascara='cpf' placeholder='Ex.: 12345678909'></label>
        <label class='campo'><span class='rotulo'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input name='rg_rnm' type='text' placeholder='Ex.: 12.345.678-9'></label>
        <label class='campo span-2'><span class='rotulo'>NOME DO BANCO</span>
          <input name='nome_banco' type='text' placeholder='Ex.: Banco do Brasil'></label>
        <label class='campo'><span class='rotulo'>NÚMERO DA AGÊNCIA</span>
          <input name='agencia' type='text' placeholder='Ex.: 0034'></label>
        <label class='campo'><span class='rotulo'>NÚMERO DA CONTA</span>
          <input name='conta' type='text' placeholder='Ex.: 12345-6'></label>
      </div>
    </fieldset>
    <div class='acoes'>
      <button type='submit' class='enviar'>Enviar solicitação</button>
    </div>
  </form>
</main>

<section id='confirmacao' hidden>
  <h2>Solicitação registrada</h2>
  <pre id='texto-oficio'></pre>
</section>

<script src='/app.js'></script>
</body>
</html>
