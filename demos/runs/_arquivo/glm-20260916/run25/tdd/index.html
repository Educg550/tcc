<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel='stylesheet' href='style.css'>
</head>
<body>
  <header class='cabecalho'>
    <img class='logo' src='assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
    <div class='titulo'>
      <h1>Universidade de São Paulo</h1>
      <p>Pós-Graduação do Instituto de Matemática e Estatística</p>
    </div>
  </header>
  <main>
    <div id='visao-formulario'>
      <nav class='abas'>
        <button type='button' class='aba ativa' data-aba='ALUNOS'>ALUNOS</button>
        <button type='button' class='aba' data-aba='DOCENTES'>DOCENTES</button>
      </nav>
      <section class='painel' id='painel-ALUNOS'>
        <form data-aba='ALUNOS' novalidate>
          <div class='erros' hidden></div>
          <fieldset>
            <legend>SOLICITANTE E EVENTO</legend>
            <div class='campos'>
              <div class='campo c-2'>
                <label for='al-nome'>NOME COMPLETO - SEM ABREVIAR</label>
                <input id='al-nome' name='nomeCompleto' type='text' placeholder='Maria de Souza'>
              </div>
              <div class='campo'>
                <label for='al-nusp'>N. USP</label>
                <input id='al-nusp' name='nUSP' type='text' inputmode='numeric' placeholder='8765432'>
              </div>
              <div class='campo'>
                <label for='al-programa'>PROGRAMA</label>
                <input id='al-programa' name='programa' type='text' placeholder='Ciência da Computação'>
              </div>
              <div class='campo'>
                <label for='al-nivel'>NÍVEL</label>
                <select id='al-nivel' name='nivel'>
                  <option value=''></option>
                  <option>Mestrado</option>
                  <option>Doutorado</option>
                </select>
              </div>
              <div class='campo'>
                <label for='al-tipo'>TIPO DE AUXÍLIO</label>
                <select id='al-tipo' name='tipo_auxilio'>
                  <option value=''></option>
                  <option>Participação em evento</option>
                  <option>Banca de exame ou defesa</option>
                  <option>Outro</option>
                </select>
              </div>
              <div class='campo c-2'>
                <label for='al-email'>E-MAIL</label>
                <input id='al-email' name='email' type='email' placeholder='maria.souza@usp.br'>
              </div>
              <div class='campo c-2'>
                <label for='al-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
                <input id='al-evento' name='nomeEvento' type='text' placeholder='SBES 2025'>
              </div>
              <div class='campo c-2'>
                <label for='al-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
                <input id='al-periodo' name='periodoEvento' type='text' placeholder='20 a 24 de outubro de 2025'>
              </div>
              <div class='campo'>
                <label for='al-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
                <input id='al-cidade-evento' name='cidadeEvento' type='text' placeholder='Salvador'>
              </div>
              <div class='campo'>
                <label for='al-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
                <input id='al-estado-evento' name='estadoEvento' type='text' placeholder='BA'>
              </div>
              <div class='campo'>
                <label for='al-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
                <input id='al-pais-evento' name='paisEvento' type='text' placeholder='Brasil'>
              </div>
              <div class='campo'>
                <label for='al-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
                <input id='al-link' name='linkEvento' type='text' placeholder='https://evento.example.br'>
              </div>
              <div class='campo'>
                <label for='al-valor'>VALOR SOLICITADO (R$)</label>
                <input id='al-valor' name='valorSolicitado' type='text' inputmode='numeric' data-mascara='moeda' placeholder='150000'>
              </div>
              <div class='campo c-3'>
                <label for='al-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
                <select id='al-apresentacao' name='apresentacaoTrabalho'>
                  <option value=''></option>
                  <option>Pôster</option>
                  <option>Apresentação oral</option>
                  <option>Outra</option>
                  <option>Não irá apresentar trabalho</option>
                </select>
              </div>
              <div class='campo c-4'>
                <label for='al-detalhamento'>DETALHAMENTO DO PEDIDO</label>
                <textarea id='al-detalhamento' name='detalhamentoPedido' rows='2' placeholder='Inscrição, passagens aéreas e diárias.'></textarea>
              </div>
            </div>
          </fieldset>
          <fieldset>
            <legend>ENDEREÇO DO SOLICITANTE</legend>
            <div class='campos'>
              <div class='campo'>
                <label for='al-nascimento'>DATA DE NASCIMENTO</label>
                <input id='al-nascimento' name='dataNascimento' type='text' inputmode='numeric' data-mascara='data' placeholder='01021990'>
              </div>
              <div class='campo'>
                <label for='al-logradouro'>LOGRADOURO</label>
                <input id='al-logradouro' name='logradouro' type='text' placeholder='Rua do Anfiteatro'>
              </div>
              <div class='campo'>
                <label for='al-numero'>NÚMERO</label>
                <input id='al-numero' name='numero_endereco' type='text' placeholder='181'>
              </div>
              <div class='campo'>
                <label for='al-complemento'>COMPLEMENTO</label>
                <input id='al-complemento' name='complemento' type='text' placeholder='Sala 5'>
              </div>
              <div class='campo'>
                <label for='al-bairro'>BAIRRO</label>
                <input id='al-bairro' name='bairro' type='text' placeholder='Butantã'>
              </div>
              <div class='campo'>
                <label for='al-cep'>CEP</label>
                <input id='al-cep' name='cep' type='text' inputmode='numeric' data-mascara='cep' placeholder='05508090'>
              </div>
              <div class='campo'>
                <label for='al-cidade'>CIDADE</label>
                <input id='al-cidade' name='cidade' type='text' placeholder='São Paulo'>
              </div>
              <div class='campo'>
                <label for='al-estado'>ESTADO</label>
                <input id='al-estado' name='estado' type='text' placeholder='SP'>
              </div>
            </div>
          </fieldset>
          <fieldset>
            <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
            <div class='campos'>
              <div class='campo'>
                <label for='al-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
                <input id='al-cpf' name='cpf' type='text' inputmode='numeric' data-mascara='cpf' placeholder='11144477735'>
              </div>
              <div class='campo'>
                <label for='al-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
                <input id='al-rg' name='rg' type='text' placeholder='12.345.678-9'>
              </div>
              <div class='campo c-2'>
                <label for='al-banco'>NOME DO BANCO</label>
                <input id='al-banco' name='banco' type='text' placeholder='Banco do Brasil'>
              </div>
              <div class='campo'>
                <label for='al-agencia'>NÚMERO DA AGÊNCIA</label>
                <input id='al-agencia' name='agencia' type='text' inputmode='numeric' placeholder='1234'>
              </div>
              <div class='campo'>
                <label for='al-conta'>NÚMERO DA CONTA</label>
                <input id='al-conta' name='conta' type='text' placeholder='98765-4'>
              </div>
            </div>
          </fieldset>
          <div class='acoes'>
            <button type='submit'>Enviar solicitação</button>
          </div>
        </form>
      </section>
      <section class='painel' id='painel-DOCENTES' hidden>
        <form data-aba='DOCENTES' novalidate>
          <div class='erros' hidden></div>
          <fieldset>

                <input id='doc-email' name='email' type='email' placeholder='maria.souza@usp.br'>
              </div>
              <div class='campo c-2'>
                <label for='doc-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>

              <div class='campo c-2'>

              </div>
              <div class='campo'>

              </div>
              <div class='campo'>
                <label for='doc-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
                <input id='doc-estado-evento' name='estadoEvento' type='text' placeholder='BA'>
              </div>
              <div class='campo'>
                <label for='doc-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
                <input id='doc-pais-evento' name='paisEvento' type='text' placeholder='Brasil'>
              </div>
              <div class='campo'>

              </div>
              <div class='campo'>
                <label for='doc-valor'>VALOR SOLICITADO (R$)</label>
                <input id='doc-valor' name='valorSolicitado' type='text' inputmode='numeric' data-mascara='moeda' placeholder='150000'>
              </div>
              <div class='campo'>
                <label for='doc-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
                <select id='doc-apresentacao' name='apresentacaoTrabalho'>

                  <option>Pôster</option>
                  <option>Apresentação oral</option>
                  <option>Outra</option>
                  <option>Não irá apresentar trabalho</option>
                </select>
              </div>
              <div class='campo c-4'>
                <label for='doc-detalhamento'>DETALHAMENTO DO PEDIDO</label>
                <textarea id='doc-detalhamento' name='detalhamentoPedido' rows='2' placeholder='Inscrição, passagens aéreas e diárias.'></textarea>
              </div>
            </div>
          </fieldset>
          <fieldset>
            <legend>ENDEREÇO DO SOLICITANTE</legend>
            <div class='campos'>
              <div class='campo'>
                <label for='doc-nascimento'>DATA DE NASCIMENTO</label>
                <input id='doc-nascimento' name='dataNascimento' type='text' inputmode='numeric' data-mascara='data' placeholder='01021990'>
              </div>
              <div class='campo'>
                <label for='doc-logradouro'>LOGRADOURO</label>
                <input id='doc-logradouro' name='logradouro' type='text' placeholder='Rua do Anfiteatro'>
              </div>
              <div class='campo'>
                <label for='doc-numero'>NÚMERO</label>
                <input id='doc-numero' name='numero_endereco' type='text' placeholder='181'>
              </div>
              <div class='campo'>
                <label for='doc-complemento'>COMPLEMENTO</label>
                <input id='doc-complemento' name='complemento' type='text' placeholder='Sala 5'>
              </div>
              <div class='campo'>
                <label for='doc-bairro'>BAIRRO</label>
                <input id='doc-bairro' name='bairro' type='text' placeholder='Butantã'>
              </div>
              <div class='campo'>
                <label for='doc-cep'>CEP</label>
                <input id='doc-cep' name='cep' type='text' inputmode='numeric' data-mascara='cep' placeholder='05508090'>
              </div>
              <div class='campo'>
                <label for='doc-cidade'>CIDADE</label>
                <input id='doc-cidade' name='cidade' type='text' placeholder='São Paulo'>
              </div>
              <div class='campo'>
                <label for='doc-estado'>ESTADO</label>
                <input id='doc-estado' name='estado' type='text' placeholder='SP'>
              </div>
            </div>
          </fieldset>
          <fieldset>
            <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
            <div class='campos'>
              <div class='campo'>
                <label for='doc-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
                <input id='doc-cpf' name='cpf' type='text' inputmode='numeric' data-mascara='cpf' placeholder='11144477735'>
              </div>
              <div class='campo'>
                <label for='doc-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
                <input id='doc-rg' name='rg' type='text' placeholder='12.345.678-9'>
              </div>
              <div class='campo c-2'>
                <label for='doc-banco'>NOME DO BANCO</label>
                <input id='doc-banco' name='banco' type='text' placeholder='Banco do Brasil'>
              </div>
              <div class='campo'>
                <label for='doc-agencia'>NÚMERO DA AGÊNCIA</label>
                <input id='doc-agencia' name='agencia' type='text' inputmode='numeric' placeholder='1234'>
              </div>
              <div class='campo'>
                <label for='doc-conta'>NÚMERO DA CONTA</label>
                <input id='doc-conta' name='conta' type='text' placeholder='98765-4'>
              </div>
            </div>
          </fieldset>
          <div class='acoes'>
            <button type='submit'>Enviar solicitação</button>
          </div>
        </form>
      </section>
    </div>
    <div id='visao-confirmacao' hidden>
      <h2>Solicitação registrada</h2>
      <pre id='oficio'></pre>
    </div>
  </main>
  <script src='app.js'></script>
</body>
</html>
