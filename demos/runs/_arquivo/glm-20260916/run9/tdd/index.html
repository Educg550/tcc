<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div>
      <h1>Universidade de São Paulo</h1>
      <p>Solicitação de Auxílio Financeiro - Pós-Graduação do IME</p>
    </div>
  </header>

  <main id="formulario">
    <nav class="abas">
      <button type="button" id="aba-alunos" class="aba ativa">ALUNOS</button>
      <button type="button" id="aba-docentes" class="aba">DOCENTES</button>
    </nav>

    <form id="form-alunos" novalidate>
      <div class="erros" id="erros-alunos"></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <label class="campo c3">NOME COMPLETO - SEM ABREVIAR
            <input name="NOME COMPLETO - SEM ABREVIAR" placeholder="Maria de Souza">
          </label>
          <label class="campo">N. USP
            <input name="N. USP" placeholder="1234567">
          </label>
          <label class="campo c2">PROGRAMA
            <input name="PROGRAMA" placeholder="Ciência da Computação">
          </label>
          <label class="campo">NÍVEL
            <select name="NÍVEL">
              <option value="">Selecione</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </label>
          <label class="campo">TIPO DE AUXÍLIO
            <select name="TIPO DE AUXÍLIO">
              <option value="">Selecione</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </label>
          <label class="campo c2">E-MAIL
            <input name="E-MAIL" placeholder="maria@usp.br">
          </label>
          <label class="campo c2">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
            <input name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Simpósio Brasileiro de Computação">
          </label>
          <label class="campo c2">PERÍODO DO EVENTO, EXAME OU DEFESA
            <input name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="1 a 5 de setembro de 2025">
          </label>
          <label class="campo">CIDADE DO EVENTO, EXAME OU DEFESA
            <input name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Salvador">
          </label>
          <label class="campo">ESTADO DO EVENTO, EXAME OU DEFESA
            <input name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="BA">
          </label>
          <label class="campo">PAÍS DO EVENTO, EXAME OU DEFESA
            <input name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil">
          </label>
          <label class="campo c2">LINK DO EVENTO, EXAME OU DEFESA
            <input name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="https://sbc.org.br/simposio">
          </label>
          <label class="campo">VALOR SOLICITADO (R$)
            <input name="VALOR SOLICITADO (R$)" placeholder="150000">
          </label>
          <label class="campo c3">DETALHAMENTO DO PEDIDO
            <textarea name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Inscrição e passagem aérea"></textarea>
          </label>
          <label class="campo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
            <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="campo">DATA DE NASCIMENTO
            <input name="DATA DE NASCIMENTO" placeholder="01021980">
          </label>
          <label class="campo c2">LOGRADOURO
            <input name="LOGRADOURO" placeholder="Rua do Anfiteatro">
          </label>
          <label class="campo">NÚMERO
            <input name="NÚMERO" placeholder="181">
          </label>
          <label class="campo">COMPLEMENTO
            <input name="COMPLEMENTO" placeholder="Sala 222">
          </label>
          <label class="campo c2">BAIRRO
            <input name="BAIRRO" placeholder="Butantã">
          </label>
          <label class="campo">CEP
            <input name="CEP" placeholder="05508090">
          </label>
          <label class="campo c2">CIDADE
            <input name="CIDADE" placeholder="São Paulo">
          </label>
          <label class="campo c2">ESTADO
            <input name="ESTADO" placeholder="SP">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="campo">CPF (SEPARADOS POR PONTOS E TRAÇO)
            <input name="CPF (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12345678909">
          </label>
          <label class="campo c2">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
            <input name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
          </label>
          <label class="campo">NOME DO BANCO
            <input name="NOME DO BANCO" placeholder="Banco do Brasil">
          </label>
          <label class="campo">NÚMERO DA AGÊNCIA
            <input name="NÚMERO DA AGÊNCIA" placeholder="1234">
          </label>
          <label class="campo c2">NÚMERO DA CONTA
            <input name="NÚMERO DA CONTA" placeholder="98765-4">
          </label>
        </div>
      </fieldset>

      <button class="enviar" type="submit">Enviar solicitação</button>
    </form>

    <form id="form-docentes" hidden novalidate>
      <div class="erros" id="erros-docentes"></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <label class="campo c3">NOME COMPLETO - SEM ABREVIAR
            <input name="NOME COMPLETO - SEM ABREVIAR" placeholder="Maria de Souza">
          </label>
          <label class="campo">N. USP
            <input name="N. USP" placeholder="1234567">
          </label>
          <label class="campo c2">PROGRAMA
            <input name="PROGRAMA" placeholder="Ciência da Computação">
          </label>
          <label class="campo c2">E-MAIL
            <input name="E-MAIL" placeholder="maria@usp.br">
          </label>
          <label class="campo c2">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
            <input name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Simpósio Brasileiro de Computação">
          </label>
          <label class="campo c2">PERÍODO DO EVENTO, EXAME OU DEFESA
            <input name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="1 a 5 de setembro de 2025">
          </label>
          <label class="campo">CIDADE DO EVENTO, EXAME OU DEFESA
            <input name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Salvador">
          </label>
          <label class="campo">ESTADO DO EVENTO, EXAME OU DEFESA
            <input name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="BA">
          </label>
          <label class="campo">PAÍS DO EVENTO, EXAME OU DEFESA
            <input name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil">
          </label>
          <label class="campo">LINK DO EVENTO, EXAME OU DEFESA
            <input name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="https://sbc.org.br/simposio">
          </label>
          <label class="campo">VALOR SOLICITADO (R$)
            <input name="VALOR SOLICITADO (R$)" placeholder="150000">
          </label>
          <label class="campo c2">DETALHAMENTO DO PEDIDO
            <textarea name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Inscrição e passagem aérea"></textarea>
          </label>
          <label class="campo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
            <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <label class="campo">DATA DE NASCIMENTO
            <input name="DATA DE NASCIMENTO" placeholder="01021980">
          </label>
          <label class="campo c2">LOGRADOURO
            <input name="LOGRADOURO" placeholder="Rua do Anfiteatro">
          </label>
          <label class="campo">NÚMERO
            <input name="NÚMERO" placeholder="181">
          </label>
          <label class="campo">COMPLEMENTO
            <input name="COMPLEMENTO" placeholder="Sala 222">
          </label>
          <label class="campo c2">BAIRRO
            <input name="BAIRRO" placeholder="Butantã">
          </label>
          <label class="campo">CEP
            <input name="CEP" placeholder="05508090">
          </label>
          <label class="campo c2">CIDADE
            <input name="CIDADE" placeholder="São Paulo">
          </label>
          <label class="campo c2">ESTADO
            <input name="ESTADO" placeholder="SP">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <label class="campo">CPF (SEPARADOS POR PONTOS E TRAÇO)
            <input name="CPF (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12345678909">
          </label>
          <label class="campo c2">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
            <input name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
          </label>
          <label class="campo">NOME DO BANCO
            <input name="NOME DO BANCO" placeholder="Banco do Brasil">
          </label>
          <label class="campo">NÚMERO DA AGÊNCIA
            <input name="NÚMERO DA AGÊNCIA" placeholder="1234">
          </label>
          <label class="campo c2">NÚMERO DA CONTA
            <input name="NÚMERO DA CONTA" placeholder="98765-4">
          </label>
        </div>
      </fieldset>

      <button class="enviar" type="submit">Enviar solicitação</button>
    </form>
  </main>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
