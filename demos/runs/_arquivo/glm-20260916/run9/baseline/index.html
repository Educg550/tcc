<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="pagina">
  <header class="cabecalho">
    <img class="logo" src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="titulos">
      <h1>Universidade de São Paulo</h1>
      <p class="programa">Pós-Graduação do IME-USP</p>
    </div>
  </header>
  <main class="conteudo">
    <section id="formulario">
      <nav class="abas" aria-label="Tipo de solicitante">
        <button type="button" class="aba ativa" data-aba="alunos" aria-selected="true">ALUNOS</button>
        <button type="button" class="aba" data-aba="docentes" aria-selected="false">DOCENTES</button>
      </nav>

      <form id="painel-alunos" class="painel solicitacao" data-tipo="alunos" novalidate>
        <div class="erros oculto" role="alert"></div>

        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grade">
            <label class="campo c2"><span>NOME COMPLETO - SEM ABREVIAR</span>
              <input name="nome_completo" placeholder="Ex.: Maria de Lourdes Souza e Silva"></label>
            <label class="campo"><span>N. USP</span>
              <input name="n_usp" inputmode="numeric" placeholder="Ex.: 8765432"></label>
            <label class="campo"><span>PROGRAMA</span>
              <input name="programa" placeholder="Ex.: Ciência da Computação"></label>
            <label class="campo"><span>NÍVEL</span>
              <select name="nivel">
                <option value="">Selecione...</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select></label>
            <label class="campo"><span>TIPO DE AUXÍLIO</span>
              <select name="tipo_auxilio">
                <option value="">Selecione...</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select></label>
            <label class="campo c2"><span>E-MAIL</span>
              <input type="email" name="email" placeholder="Ex.: maria.silva@usp.br"></label>
            <label class="campo c2"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
              <input name="nome_evento" placeholder="Ex.: Congresso Brasileiro de Matemática"></label>
            <label class="campo c2"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
              <input name="periodo_evento" placeholder="Ex.: 05/09/2025 a 08/09/2025"></label>
            <label class="campo"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
              <input name="cidade_evento" placeholder="Ex.: Rio de Janeiro"></label>
            <label class="campo"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
              <input name="estado_evento" placeholder="Ex.: RJ"></label>
            <label class="campo"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
              <input name="pais_evento" placeholder="Ex.: Brasil"></label>
            <label class="campo"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
              <input name="link_evento" placeholder="Ex.: https://www.evento.org.br"></label>
            <label class="campo"><span>VALOR SOLICITADO (R$)</span>
              <input name="valor_solicitado" data-formato="moeda" inputmode="numeric" placeholder="Ex.: 150000"></label>
            <label class="campo"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
              <select name="apresentacao">
                <option value="">Selecione...</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select></label>
            <label class="campo c2"><span>DETALHAMENTO DO PEDIDO</span>
              <textarea name="detalhamento" rows="2" placeholder="Ex.: Inscrição no evento e passagem aérea de ida e volta"></textarea></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <label class="campo"><span>DATA DE NASCIMENTO</span>
              <input name="data_nascimento" data-formato="data" inputmode="numeric" placeholder="Ex.: 01021980"></label>
            <label class="campo c2"><span>LOGRADOURO</span>
              <input name="logradouro" placeholder="Ex.: Rua do Matão"></label>
            <label class="campo"><span>NÚMERO</span>
              <input name="numero" placeholder="Ex.: 1010"></label>
            <label class="campo"><span>COMPLEMENTO</span>
              <input name="complemento" placeholder="Ex.: Sala 214"></label>
            <label class="campo c2"><span>BAIRRO</span>
              <input name="bairro" placeholder="Ex.: Cidade Universitária"></label>
            <label class="campo"><span>CEP</span>
              <input name="cep" data-formato="cep" inputmode="numeric" placeholder="Ex.: 05508090"></label>
            <label class="campo c2"><span>CIDADE</span>
              <input name="cidade" placeholder="Ex.: São Paulo"></label>
            <label class="campo c2"><span>ESTADO</span>
              <input name="estado" placeholder="Ex.: SP"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <label class="campo c2"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input name="cpf" data-formato="cpf" inputmode="numeric" placeholder="Ex.: 12345678909"></label>
            <label class="campo c2"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input name="rg_rnm" placeholder="Ex.: 12.345.678-9"></label>
            <label class="campo c2"><span>NOME DO BANCO</span>
              <input name="nome_banco" placeholder="Ex.: Banco do Brasil"></label>
            <label class="campo"><span>NÚMERO DA AGÊNCIA</span>
              <input name="agencia" inputmode="numeric" placeholder="Ex.: 4321"></label>
            <label class="campo"><span>NÚMERO DA CONTA</span>
              <input name="numero_conta" placeholder="Ex.: 98765-4"></label>
          </div>
        </fieldset>

        <button class="enviar" type="submit">Enviar solicitação</button>
      </form>

      <form id="painel-docentes" class="painel solicitacao oculto" data-tipo="docentes" novalidate>
        <div class="erros oculto" role="alert"></div>

        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grade">
            <label class="campo c2"><span>NOME COMPLETO - SEM ABREVIAR</span>
              <input name="nome_completo" placeholder="Ex.: João Cardoso de Miranda"></label>
            <label class="campo"><span>N. USP</span>
              <input name="n_usp" inputmode="numeric" placeholder="Ex.: 1234567"></label>
            <label class="campo"><span>PROGRAMA</span>
              <input name="programa" placeholder="Ex.: Estatística"></label>
            <label class="campo c2"><span>E-MAIL</span>
              <input type="email" name="email" placeholder="Ex.: joao.miranda@ime.usp.br"></label>
            <label class="campo c2"><span>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
              <input name="nome_evento" placeholder="Ex.: Banca de defesa de mestrado"></label>
            <label class="campo c2"><span>PERÍODO DO EVENTO, EXAME OU DEFESA</span>
              <input name="periodo_evento" placeholder="Ex.: 12/10/2025"></label>
            <label class="campo"><span>CIDADE DO EVENTO, EXAME OU DEFESA</span>
              <input name="cidade_evento" placeholder="Ex.: São Paulo"></label>
            <label class="campo"><span>ESTADO DO EVENTO, EXAME OU DEFESA</span>
              <input name="estado_evento" placeholder="Ex.: SP"></label>
            <label class="campo"><span>PAÍS DO EVENTO, EXAME OU DEFESA</span>
              <input name="pais_evento" placeholder="Ex.: Brasil"></label>
            <label class="campo"><span>LINK DO EVENTO, EXAME OU DEFESA</span>
              <input name="link_evento" placeholder="Ex.: https://www.ime.usp.br"></label>
            <label class="campo"><span>VALOR SOLICITADO (R$)</span>
              <input name="valor_solicitado" data-formato="moeda" inputmode="numeric" placeholder="Ex.: 250000"></label>
            <label class="campo"><span>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
              <select name="apresentacao">
                <option value="">Selecione...</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select></label>
            <label class="campo c4"><span>DETALHAMENTO DO PEDIDO</span>
              <textarea name="detalhamento" rows="2" placeholder="Ex.: Passagem aérea para participação em banca de defesa"></textarea></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <label class="campo"><span>DATA DE NASCIMENTO</span>
              <input name="data_nascimento" data-formato="data" inputmode="numeric" placeholder="Ex.: 01021980"></label>
            <label class="campo c2"><span>LOGRADOURO</span>
              <input name="logradouro" placeholder="Ex.: Rua do Matão"></label>
            <label class="campo"><span>NÚMERO</span>
              <input name="numero" placeholder="Ex.: 1010"></label>
            <label class="campo"><span>COMPLEMENTO</span>
              <input name="complemento" placeholder="Ex.: Sala 214"></label>
            <label class="campo c2"><span>BAIRRO</span>
              <input name="bairro" placeholder="Ex.: Cidade Universitária"></label>
            <label class="campo"><span>CEP</span>
              <input name="cep" data-formato="cep" inputmode="numeric" placeholder="Ex.: 05508090"></label>
            <label class="campo c2"><span>CIDADE</span>
              <input name="cidade" placeholder="Ex.: São Paulo"></label>
            <label class="campo c2"><span>ESTADO</span>
              <input name="estado" placeholder="Ex.: SP"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <label class="campo c2"><span>CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input name="cpf" data-formato="cpf" inputmode="numeric" placeholder="Ex.: 12345678909"></label>
            <label class="campo c2"><span>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input name="rg_rnm" placeholder="Ex.: 12.345.678-9"></label>
            <label class="campo c2"><span>NOME DO BANCO</span>
              <input name="nome_banco" placeholder="Ex.: Banco do Brasil"></label>
            <label class="campo"><span>NÚMERO DA AGÊNCIA</span>
              <input name="agencia" inputmode="numeric" placeholder="Ex.: 4321"></label>
            <label class="campo"><span>NÚMERO DA CONTA</span>
              <input name="numero_conta" placeholder="Ex.: 98765-4"></label>
          </div>
        </fieldset>

        <button class="enviar" type="submit">Enviar solicitação</button>
      </form>
    </section>

    <section id="confirmacao" class="oculto">
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
