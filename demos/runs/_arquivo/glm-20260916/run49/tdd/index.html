<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div>
    <h1>Universidade de São Paulo</h1>
    <p>Pós-Graduação do IME &mdash; Solicitação de Auxílio Financeiro</p>
  </div>
</header>

<main>
<section id="formulario-view">
  <nav class="abas" aria-label="Tipo de solicitante">
    <button type="button" class="aba ativa" data-alvo="form-alunos">ALUNOS</button>
    <button type="button" class="aba" data-alvo="form-docentes">DOCENTES</button>
  </nav>

  <form id="form-alunos" class="formulario" data-aba="alunos" novalidate>
    <div class="erros" hidden></div>

    <section class="bloco">
      <h2>SOLICITANTE E EVENTO</h2>
      <div class="grade">
        <label class="campo campo-largo">NOME COMPLETO - SEM ABREVIAR
          <input type="text" name="nome_completo" placeholder="Ex.: Maria da Silva">
        </label>
        <label class="campo">N. USP
          <input type="text" name="n_usp" inputmode="numeric" placeholder="Ex.: 1234567">
        </label>
        <label class="campo">PROGRAMA
          <input type="text" name="programa" placeholder="Ex.: Ciência da Computação">
        </label>
        <label class="campo">NÍVEL
          <select name="nivel">
            <option value="">Selecione</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select>
        </label>
        <label class="campo">TIPO DE AUXÍLIO
          <select name="tipo_auxilio">
            <option value="">Selecione</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select>
        </label>
        <label class="campo">E-MAIL
          <input type="text" name="email" placeholder="Ex.: maria@usp.br">
        </label>
        <label class="campo campo-largo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
          <input type="text" name="nome_evento" placeholder="Ex.: Simpósio Brasileiro de Computação">
        </label>
        <label class="campo">PERÍODO DO EVENTO, EXAME OU DEFESA
          <input type="text" name="periodo_evento" placeholder="Ex.: 1 a 5 de julho de 2025">
        </label>
        <label class="campo">CIDADE DO EVENTO, EXAME OU DEFESA
          <input type="text" name="cidade_evento" placeholder="Ex.: São Paulo">
        </label>
        <label class="campo">ESTADO DO EVENTO, EXAME OU DEFESA
          <input type="text" name="estado_evento" placeholder="Ex.: SP">
        </label>
        <label class="campo">PAÍS DO EVENTO, EXAME OU DEFESA
          <input type="text" name="pais_evento" placeholder="Ex.: Brasil">
        </label>
        <label class="campo">LINK DO EVENTO, EXAME OU DEFESA
          <input type="text" name="link_evento" placeholder="Ex.: https://evento.example.br">
        </label>
        <label class="campo">VALOR SOLICITADO (R$)
          <input type="text" name="valor_solicitado" inputmode="numeric" placeholder="Ex.: 150000">
        </label>
        <label class="campo campo-largo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
          <select name="apresentacao_trabalho">
            <option value="">Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </label>
        <label class="campo campo-inteira">DETALHAMENTO DO PEDIDO
          <textarea name="detalhamento" rows="2" placeholder="Ex.: Inscrição e passagens aéreas."></textarea>
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <label class="campo">DATA DE NASCIMENTO
          <input type="text" name="data_nascimento" inputmode="numeric" placeholder="Ex.: 01021980">
        </label>
        <label class="campo campo-largo">LOGRADOURO
          <input type="text" name="logradouro" placeholder="Ex.: Rua do Anfiteatro">
        </label>
        <label class="campo">NÚMERO
          <input type="text" name="numero" placeholder="Ex.: 181">
        </label>
        <label class="campo">COMPLEMENTO
          <input type="text" name="complemento" placeholder="Ex.: Sala 5">
        </label>
        <label class="campo">BAIRRO
          <input type="text" name="bairro" placeholder="Ex.: Butantã">
        </label>
        <label class="campo">CEP
          <input type="text" name="cep" inputmode="numeric" placeholder="Ex.: 05508090">
        </label>
        <label class="campo">CIDADE
          <input type="text" name="cidade" placeholder="Ex.: São Paulo">
        </label>
        <label class="campo">ESTADO
          <input type="text" name="estado" placeholder="Ex.: SP">
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <label class="campo">CPF (SEPARADOS POR PONTOS E TRAÇO)
          <input type="text" name="cpf" inputmode="numeric" placeholder="Ex.: 52998224725">
        </label>
        <label class="campo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
          <input type="text" name="rg_rnm" placeholder="Ex.: 12.345.678-9">
        </label>
        <label class="campo">NOME DO BANCO
          <input type="text" name="nome_banco" placeholder="Ex.: Banco do Brasil">
        </label>
        <label class="campo">NÚMERO DA AGÊNCIA
          <input type="text" name="numero_agencia" inputmode="numeric" placeholder="Ex.: 1234">
        </label>
        <label class="campo campo-largo">NÚMERO DA CONTA
          <input type="text" name="numero_conta" placeholder="Ex.: 98765-4">
        </label>
      </div>
    </section>

    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>

  <form id="form-docentes" class="formulario" data-aba="docentes" novalidate hidden>
    <div class="erros" hidden></div>

    <section class="bloco">
      <h2>SOLICITANTE E EVENTO</h2>
      <div class="grade">
        <label class="campo campo-largo">NOME COMPLETO - SEM ABREVIAR
          <input type="text" name="nome_completo" placeholder="Ex.: João Pereira">
        </label>
        <label class="campo">N. USP
          <input type="text" name="n_usp" inputmode="numeric" placeholder="Ex.: 7654321">
        </label>
        <label class="campo campo-largo">PROGRAMA
          <input type="text" name="programa" placeholder="Ex.: Estatística">
        </label>
        <label class="campo">E-MAIL
          <input type="text" name="email" placeholder="Ex.: joao@ime.usp.br">
        </label>
        <label class="campo campo-largo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
          <input type="text" name="nome_evento" placeholder="Ex.: Banca de defesa de mestrado">
        </label>
        <label class="campo">PERÍODO DO EVENTO, EXAME OU DEFESA
          <input type="text" name="periodo_evento" placeholder="Ex.: 10 de agosto de 2025">
        </label>
        <label class="campo">CIDADE DO EVENTO, EXAME OU DEFESA
          <input type="text" name="cidade_evento" placeholder="Ex.: Campinas">
        </label>
        <label class="campo">ESTADO DO EVENTO, EXAME OU DEFESA
          <input type="text" name="estado_evento" placeholder="Ex.: SP">
        </label>
        <label class="campo">PAÍS DO EVENTO, EXAME OU DEFESA
          <input type="text" name="pais_evento" placeholder="Ex.: Brasil">
        </label>
        <label class="campo">LINK DO EVENTO, EXAME OU DEFESA
          <input type="text" name="link_evento" placeholder="Ex.: https://evento.example.br">
        </label>
        <label class="campo">VALOR SOLICITADO (R$)
          <input type="text" name="valor_solicitado" inputmode="numeric" placeholder="Ex.: 30000">
        </label>
        <label class="campo campo-largo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
          <select name="apresentacao_trabalho">
            <option value="">Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </label>
        <label class="campo campo-inteira">DETALHAMENTO DO PEDIDO
          <textarea name="detalhamento" rows="2" placeholder="Ex.: Reembolso de transporte."></textarea>
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <label class="campo">DATA DE NASCIMENTO
          <input type="text" name="data_nascimento" inputmode="numeric" placeholder="Ex.: 15031975">
        </label>
        <label class="campo campo-largo">LOGRADOURO
          <input type="text" name="logradouro" placeholder="Ex.: Av. Professor Lineu Prestes">
        </label>
        <label class="campo">NÚMERO
          <input type="text" name="numero" placeholder="Ex.: 338">
        </label>
        <label class="campo">COMPLEMENTO
          <input type="text" name="complemento" placeholder="Ex.: Sala 12">
        </label>
        <label class="campo">BAIRRO
          <input type="text" name="bairro" placeholder="Ex.: Cidade Universitária">
        </label>
        <label class="campo">CEP
          <input type="text" name="cep" inputmode="numeric" placeholder="Ex.: 05508000">
        </label>
        <label class="campo">CIDADE
          <input type="text" name="cidade" placeholder="Ex.: São Paulo">
        </label>
        <label class="campo">ESTADO
          <input type="text" name="estado" placeholder="Ex.: SP">
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <label class="campo">CPF (SEPARADOS POR PONTOS E TRAÇO)
          <input type="text" name="cpf" inputmode="numeric" placeholder="Ex.: 52998224725">
        </label>
        <label class="campo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
          <input type="text" name="rg_rnm" placeholder="Ex.: 98.765.432-1">
        </label>
        <label class="campo">NOME DO BANCO
          <input type="text" name="nome_banco" placeholder="Ex.: Itaú">
        </label>
        <label class="campo">NÚMERO DA AGÊNCIA
          <input type="text" name="numero_agencia" inputmode="numeric" placeholder="Ex.: 0912">
        </label>
        <label class="campo campo-largo">NÚMERO DA CONTA
          <input type="text" name="numero_conta" placeholder="Ex.: 45678-9">
        </label>
      </div>
    </section>

    <button type="submit" class="enviar">Enviar solicitação</button>
  </form>
</section>

<section id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <pre id="oficio"></pre>
  <button type="button" id="voltar" class="enviar">Nova solicitação</button>
</section>
</main>

<script src="/app.js"></script>
</body>
</html>
