<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<header class='cabecalho'>
  <div class='marca'>
    <img class='logo' src='assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
    <div>
      <p class='universidade'>Universidade de São Paulo</p>
      <p class='subtitulo'>Pós-Graduação do IME</p>
    </div>
  </div>
</header>

<main id='conteudo'>
  <nav class='abas' aria-label='Tipo de solicitante'>
    <button type='button' class='aba ativa' data-aba='alunos'>ALUNOS</button>
    <button type='button' class='aba' data-aba='docentes'>DOCENTES</button>
  </nav>

  <form id='form-alunos' class='formulario' novalidate>
    <div class='erros' aria-live='polite'></div>

    <section class='bloco'>
      <h2>SOLICITANTE E EVENTO</h2>
      <div class='grade'>
        <div class='campo c8'>
          <label for='al-nome'>NOME COMPLETO - SEM ABREVIAR</label>
          <input id='al-nome' name='nome_completo' type='text' placeholder='Ex.: Maria da Silva Souza'>
        </div>
        <div class='campo c4'>
          <label for='al-nusp'>N. USP</label>
          <input id='al-nusp' name='n_usp' type='text' inputmode='numeric' placeholder='Ex.: 8765432'>
        </div>
        <div class='campo c6'>
          <label for='al-programa'>PROGRAMA</label>
          <input id='al-programa' name='programa' type='text' placeholder='Ex.: Ciência da Computação'>
        </div>
        <div class='campo c3'>
          <label for='al-nivel'>NÍVEL</label>
          <select id='al-nivel' name='nivel'>
            <option value='' selected>Selecione...</option>
            <option value='Mestrado'>Mestrado</option>
            <option value='Doutorado'>Doutorado</option>
          </select>
        </div>
        <div class='campo c3'>
          <label for='al-tipo'>TIPO DE AUXÍLIO</label>
          <select id='al-tipo' name='tipo_auxilio'>
            <option value='' selected>Selecione...</option>
            <option value='Participação em evento'>Participação em evento</option>
            <option value='Banca de exame ou defesa'>Banca de exame ou defesa</option>
            <option value='Outro'>Outro</option>
          </select>
        </div>
        <div class='campo c6'>
          <label for='al-email'>E-MAIL</label>
          <input id='al-email' name='email' type='text' placeholder='Ex.: maria.souza@usp.br'>
        </div>
        <div class='campo c6'>
          <label for='al-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input id='al-evento' name='nome_evento' type='text' placeholder='Ex.: SBBD 2025'>
        </div>
        <div class='campo c4'>
          <label for='al-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input id='al-periodo' name='periodo_evento' type='text' placeholder='Ex.: 6 a 9 de outubro de 2025'>
        </div>
        <div class='campo c3'>
          <label for='al-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input id='al-cidade-evento' name='cidade_evento' type='text' placeholder='Ex.: Rio de Janeiro'>
        </div>
        <div class='campo c2'>
          <label for='al-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input id='al-estado-evento' name='estado_evento' type='text' placeholder='Ex.: RJ'>
        </div>
        <div class='campo c3'>
          <label for='al-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input id='al-pais-evento' name='pais_evento' type='text' placeholder='Ex.: Brasil'>
        </div>
        <div class='campo c4'>
          <label for='al-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
          <input id='al-link' name='link_evento' type='text' placeholder='Ex.: https://sbbd.org.br/2025'>
        </div>
        <div class='campo c3'>
          <label for='al-valor'>VALOR SOLICITADO (R$)</label>
          <input id='al-valor' name='valor_solicitado' type='text' inputmode='numeric' data-formato='moeda' placeholder='Ex.: 150000'>
        </div>
        <div class='campo c5'>
          <label for='al-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id='al-apresentacao' name='apresentacao_trabalho'>
            <option value='' selected>Selecione...</option>
            <option value='Pôster'>Pôster</option>
            <option value='Apresentação oral'>Apresentação oral</option>
            <option value='Outra'>Outra</option>
            <option value='Não irá apresentar trabalho'>Não irá apresentar trabalho</option>
          </select>
        </div>
        <div class='campo c12'>
          <label for='al-detalhamento'>DETALHAMENTO DO PEDIDO</label>
          <textarea id='al-detalhamento' name='detalhamento' rows='2' placeholder='Ex.: Inscrição no evento e passagem aérea de ida e volta.'></textarea>
        </div>
      </div>
    </section>

    <section class='bloco'>
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class='grade'>
        <div class='campo c3'>
          <label for='al-nascimento'>DATA DE NASCIMENTO</label>
          <input id='al-nascimento' name='data_nascimento' type='text' inputmode='numeric' data-formato='data' placeholder='Ex.: 01021980'>
        </div>
        <div class='campo c5'>
          <label for='al-logradouro'>LOGRADOURO</label>
          <input id='al-logradouro' name='logradouro' type='text' placeholder='Ex.: Rua do Anfiteatro'>
        </div>
        <div class='campo c2'>
          <label for='al-numero'>NÚMERO</label>
          <input id='al-numero' name='numero' type='text' placeholder='Ex.: 181'>
        </div>
        <div class='campo c2'>
          <label for='al-complemento'>COMPLEMENTO</label>
          <input id='al-complemento' name='complemento' type='text' placeholder='Ex.: Sala 214'>
        </div>
        <div class='campo c4'>
          <label for='al-bairro'>BAIRRO</label>
          <input id='al-bairro' name='bairro' type='text' placeholder='Ex.: Butantã'>
        </div>
        <div class='campo c3'>
          <label for='al-cep'>CEP</label>
          <input id='al-cep' name='cep' type='text' inputmode='numeric' data-formato='cep' placeholder='Ex.: 05508090'>
        </div>
        <div class='campo c3'>
          <label for='al-cidade'>CIDADE</label>
          <input id='al-cidade' name='cidade' type='text' placeholder='Ex.: São Paulo'>
        </div>
        <div class='campo c2'>
          <label for='al-estado'>ESTADO</label>
          <input id='al-estado' name='estado' type='text' placeholder='Ex.: SP'>
        </div>
      </div>
    </section>

    <section class='bloco'>
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class='grade'>
        <div class='campo c3'>
          <label for='al-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id='al-cpf' name='cpf' type='text' inputmode='numeric' data-formato='cpf' placeholder='Ex.: 12345678909'>
        </div>
        <div class='campo c4'>
          <label for='al-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id='al-rg' name='rg_rnm' type='text' placeholder='Ex.: 12.345.678-9'>
        </div>
        <div class='campo c5'>
          <label for='al-banco'>NOME DO BANCO</label>
          <input id='al-banco' name='nome_banco' type='text' placeholder='Ex.: Banco do Brasil'>
        </div>
        <div class='campo c3'>
          <label for='al-agencia'>NÚMERO DA AGÊNCIA</label>
          <input id='al-agencia' name='numero_agencia' type='text' inputmode='numeric' placeholder='Ex.: 1234'>
        </div>
        <div class='campo c3'>
          <label for='al-conta'>NÚMERO DA CONTA</label>
          <input id='al-conta' name='numero_conta' type='text' placeholder='Ex.: 98765-4'>
        </div>
      </div>
    </section>

    <button type='submit' class='enviar'>Enviar solicitação</button>
  </form>

  <form id='form-docentes' class='formulario oculto' novalidate>
    <div class='erros' aria-live='polite'></div>

    <section class='bloco'>

        <div class='campo c4'>

          <input id='do-nusp' name='n_usp' type='text' inputmode='numeric' placeholder='Ex.: 8765432'>
        </div>
        <div class='campo c6'>
          <label for='do-programa'>PROGRAMA</label>
          <input id='do-programa' name='programa' type='text' placeholder='Ex.: Ciência da Computação'>
        </div>
        <div class='campo c6'>
          <label for='do-email'>E-MAIL</label>
          <input id='do-email' name='email' type='text' placeholder='Ex.: maria.souza@usp.br'>
        </div>
        <div class='campo c6'>
          <label for='do-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input id='do-evento' name='nome_evento' type='text' placeholder='Ex.: SBBD 2025'>
        </div>
        <div class='campo c6'>
          <label for='do-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input id='do-periodo' name='periodo_evento' type='text' placeholder='Ex.: 6 a 9 de outubro de 2025'>
        </div>
        <div class='campo c3'>
          <label for='do-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input id='do-cidade-evento' name='cidade_evento' type='text' placeholder='Ex.: Rio de Janeiro'>
        </div>
        <div class='campo c2'>
          <label for='do-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input id='do-estado-evento' name='estado_evento' type='text' placeholder='Ex.: RJ'>
        </div>
        <div class='campo c3'>
          <label for='do-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input id='do-pais-evento' name='pais_evento' type='text' placeholder='Ex.: Brasil'>

        <div class='campo c4'>

        </div>
        <div class='campo c3'>
          <label for='do-valor'>VALOR SOLICITADO (R$)</label>

        </div>
        <div class='campo c9'>
          <label for='do-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id='do-apresentacao' name='apresentacao_trabalho'>
            <option value='' selected>Selecione...</option>
            <option value='Pôster'>Pôster</option>
            <option value='Apresentação oral'>Apresentação oral</option>
            <option value='Outra'>Outra</option>
            <option value='Não irá apresentar trabalho'>Não irá apresentar trabalho</option>
          </select>
        </div>
        <div class='campo c12'>
          <label for='do-detalhamento'>DETALHAMENTO DO PEDIDO</label>
          <textarea id='do-detalhamento' name='detalhamento' rows='2' placeholder='Ex.: Inscrição no evento e passagem aérea de ida e volta.'></textarea>
        </div>
      </div>
    </section>

    <section class='bloco'>
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class='grade'>
        <div class='campo c3'>
          <label for='do-nascimento'>DATA DE NASCIMENTO</label>
          <input id='do-nascimento' name='data_nascimento' type='text' inputmode='numeric' data-formato='data' placeholder='Ex.: 01021980'>
        </div>
        <div class='campo c5'>
          <label for='do-logradouro'>LOGRADOURO</label>
          <input id='do-logradouro' name='logradouro' type='text' placeholder='Ex.: Rua do Anfiteatro'>
        </div>
        <div class='campo c2'>
          <label for='do-numero'>NÚMERO</label>
          <input id='do-numero' name='numero' type='text' placeholder='Ex.: 181'>
        </div>
        <div class='campo c2'>
          <label for='do-complemento'>COMPLEMENTO</label>
          <input id='do-complemento' name='complemento' type='text' placeholder='Ex.: Sala 214'>
        </div>
        <div class='campo c4'>
          <label for='do-bairro'>BAIRRO</label>
          <input id='do-bairro' name='bairro' type='text' placeholder='Ex.: Butantã'>
        </div>
        <div class='campo c3'>
          <label for='do-cep'>CEP</label>
          <input id='do-cep' name='cep' type='text' inputmode='numeric' data-formato='cep' placeholder='Ex.: 05508090'>
        </div>
        <div class='campo c3'>
          <label for='do-cidade'>CIDADE</label>
          <input id='do-cidade' name='cidade' type='text' placeholder='Ex.: São Paulo'>
        </div>
        <div class='campo c2'>
          <label for='do-estado'>ESTADO</label>
          <input id='do-estado' name='estado' type='text' placeholder='Ex.: SP'>
        </div>
      </div>
    </section>

    <section class='bloco'>
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class='grade'>
        <div class='campo c3'>
          <label for='do-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id='do-cpf' name='cpf' type='text' inputmode='numeric' data-formato='cpf' placeholder='Ex.: 12345678909'>
        </div>
        <div class='campo c4'>
          <label for='do-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id='do-rg' name='rg_rnm' type='text' placeholder='Ex.: 12.345.678-9'>
        </div>
        <div class='campo c5'>
          <label for='do-banco'>NOME DO BANCO</label>
          <input id='do-banco' name='nome_banco' type='text' placeholder='Ex.: Banco do Brasil'>
        </div>
        <div class='campo c3'>
          <label for='do-agencia'>NÚMERO DA AGÊNCIA</label>

        </div>
      </div>
    </section>

    <button type='submit' class='enviar'>Enviar solicitação</button>
  </form>
</main>

<section id='confirmacao' class='confirmacao oculto'>
  <h1>Solicitação registrada</h1>
  <pre id='oficio' class='oficio'></pre>
</section>

<script src='app.js'></script>
</body>
</html>
