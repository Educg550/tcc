<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <div class="marca">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  </div>
  <div class="titulos">
    <p class="instituicao">Universidade de São Paulo</p>
    <p class="programa">Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>
<main class="pagina">
  <section id="formulario">
    <nav class="abas" role="tablist" aria-label="Tipo de solicitante">
      <button type="button" class="aba ativa" id="aba-alunos" role="tab" aria-selected="true" aria-controls="form-alunos">ALUNOS</button>
      <button type="button" class="aba" id="aba-docentes" role="tab" aria-selected="false" aria-controls="form-docentes">DOCENTES</button>
    </nav>
    <form class="formulario" id="form-alunos" role="tabpanel" aria-labelledby="aba-alunos" data-papel="alunos" novalidate>
      <div class="erros" hidden></div>
      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo c5">
            <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input type="text" id="a-nome" name="NOME COMPLETO - SEM ABREVIAR" placeholder="Maria Antonieta da Silva">
          </div>
          <div class="campo c2">
            <label for="a-n-usp">N. USP</label>
            <input type="text" id="a-n-usp" name="N. USP" placeholder="1234567" inputmode="numeric">
          </div>
          <div class="campo c3">
            <label for="a-programa">PROGRAMA</label>
            <input type="text" id="a-programa" name="PROGRAMA" placeholder="Ciência da Computação">
          </div>
          <div class="campo c2">
            <label for="a-nivel">NÍVEL</label>
            <select id="a-nivel" name="NÍVEL">
              <option value="" selected disabled hidden>Ex.: Mestrado</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class="campo c3">
            <label for="a-tipo">TIPO DE AUXÍLIO</label>
            <select id="a-tipo" name="TIPO DE AUXÍLIO">
              <option value="" selected disabled hidden>Ex.: Participação em evento</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>
          <div class="campo c4">
            <label for="a-email">E-MAIL</label>
            <input type="text" id="a-email" name="E-MAIL" placeholder="maria.antonieta@usp.br">
          </div>
          <div class="campo c5">
            <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type="text" id="a-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Congresso Brasileiro de Matemática">
          </div>
          <div class="campo c3">
            <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="a-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="12/09/2025 a 16/09/2025">
          </div>
          <div class="campo c3">
            <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="a-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="São Paulo">
          </div>
          <div class="campo c2">
            <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="a-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="SP">
          </div>
          <div class="campo c2">
            <label for="a-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="a-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil">
          </div>
          <div class="campo c2">
            <label for="a-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="a-link" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="https://evento.org.br">
          </div>
          <div class="campo c3">
            <label for="a-valor">VALOR SOLICITADO (R$)</label>
            <input type="text" id="a-valor" name="VALOR SOLICITADO (R$)" placeholder="R$ 1.500,00" inputmode="numeric">
          </div>
          <div class="campo c6">
            <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="a-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Passagem aérea, inscrição e hospedagem"></textarea>
          </div>
          <div class="campo c3">
            <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="a-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="" selected disabled hidden>Ex.: Pôster</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo c2">
            <label for="a-nascimento">DATA DE NASCIMENTO</label>
            <input type="text" id="a-nascimento" name="DATA DE NASCIMENTO" placeholder="01/02/1980" inputmode="numeric">
          </div>
          <div class="campo c4">
            <label for="a-logradouro">LOGRADOURO</label>
            <input type="text" id="a-logradouro" name="LOGRADOURO" placeholder="Rua do Anfiteatro">
          </div>
          <div class="campo c2">
            <label for="a-numero">NÚMERO</label>
            <input type="text" id="a-numero" name="NÚMERO" placeholder="123">
          </div>
          <div class="campo c4">
            <label for="a-complemento">COMPLEMENTO</label>
            <input type="text" id="a-complemento" name="COMPLEMENTO" placeholder="Apto 42, Bloco B">
          </div>
          <div class="campo c4">
            <label for="a-bairro">BAIRRO</label>
            <input type="text" id="a-bairro" name="BAIRRO" placeholder="Butantã">
          </div>
          <div class="campo c2">
            <label for="a-cep">CEP</label>
            <input type="text" id="a-cep" name="CEP" placeholder="05508-090" inputmode="numeric">
          </div>
          <div class="campo c4">
            <label for="a-cidade">CIDADE</label>
            <input type="text" id="a-cidade" name="CIDADE" placeholder="São Paulo">
          </div>
          <div class="campo c2">
            <label for="a-estado">ESTADO</label>
            <input type="text" id="a-estado" name="ESTADO" placeholder="SP">
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo c3">
            <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="a-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" placeholder="123.456.789-09" inputmode="numeric">
          </div>
          <div class="campo c3">
            <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="a-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
          </div>
          <div class="campo c3">
            <label for="a-banco">NOME DO BANCO</label>
            <input type="text" id="a-banco" name="NOME DO BANCO" placeholder="Banco do Brasil">
          </div>
          <div class="campo c3">
            <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
            <input type="text" id="a-agencia" name="NÚMERO DA AGÊNCIA" placeholder="1234" inputmode="numeric">
          </div>
          <div class="campo c3">
            <label for="a-conta">NÚMERO DA CONTA</label>
            <input type="text" id="a-conta" name="NÚMERO DA CONTA" placeholder="12345-6">
          </div>
        </div>
      </fieldset>
      <button class="enviar" type="submit">Enviar solicitação</button>
    </form>
    <form class="formulario" id="form-docentes" role="tabpanel" aria-labelledby="aba-docentes" data-papel="docentes" hidden novalidate>
      <div class="erros" hidden></div>
      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo c5">
            <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input type="text" id="d-nome" name="NOME COMPLETO - SEM ABREVIAR" placeholder="João Pedro Cardoso">
          </div>
          <div class="campo c2">
            <label for="d-n-usp">N. USP</label>
            <input type="text" id="d-n-usp" name="N. USP" placeholder="1234567" inputmode="numeric">
          </div>
          <div class="campo c5">
            <label for="d-programa">PROGRAMA</label>
            <input type="text" id="d-programa" name="PROGRAMA" placeholder="Estatística">
          </div>
          <div class="campo c4">
            <label for="d-email">E-MAIL</label>
            <input type="text" id="d-email" name="E-MAIL" placeholder="joao.pedro@ime.usp.br">
          </div>
          <div class="campo c8">
            <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type="text" id="d-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Banca de defesa de doutorado">
          </div>
          <div class="campo c3">
            <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="d-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="12/09/2025 a 16/09/2025">
          </div>
          <div class="campo c3">
            <label for="d-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="d-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Rio de Janeiro">
          </div>
          <div class="campo c2">
            <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="d-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="RJ">
          </div>
          <div class="campo c2">
            <label for="d-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="d-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil">
          </div>
          <div class="campo c2">
            <label for="d-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="d-link" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="https://evento.org.br">
          </div>
          <div class="campo c3">
            <label for="d-valor">VALOR SOLICITADO (R$)</label>
            <input type="text" id="d-valor" name="VALOR SOLICITADO (R$)" placeholder="R$ 1.500,00" inputmode="numeric">
          </div>
          <div class="campo c6">
            <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="d-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Passagem aérea, inscrição e hospedagem"></textarea>
          </div>
          <div class="campo c3">
            <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="d-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="" selected disabled hidden>Ex.: Apresentação oral</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo c2">
            <label for="d-nascimento">DATA DE NASCIMENTO</label>
            <input type="text" id="d-nascimento" name="DATA DE NASCIMENTO" placeholder="01/02/1980" inputmode="numeric">
          </div>
          <div class="campo c4">
            <label for="d-logradouro">LOGRADOURO</label>
            <input type="text" id="d-logradouro" name="LOGRADOURO" placeholder="Rua do Anfiteatro">
          </div>
          <div class="campo c2">
            <label for="d-numero">NÚMERO</label>
            <input type="text" id="d-numero" name="NÚMERO" placeholder="123">
          </div>
          <div class="campo c4">
            <label for="d-complemento">COMPLEMENTO</label>
            <input type="text" id="d-complemento" name="COMPLEMENTO" placeholder="Apto 42, Bloco B">
          </div>
          <div class="campo c4">
            <label for="d-bairro">BAIRRO</label>
            <input type="text" id="d-bairro" name="BAIRRO" placeholder="Butantã">
          </div>
          <div class="campo c2">
            <label for="d-cep">CEP</label>
            <input type="text" id="d-cep" name="CEP" placeholder="05508-090" inputmode="numeric">
          </div>
          <div class="campo c4">
            <label for="d-cidade">CIDADE</label>
            <input type="text" id="d-cidade" name="CIDADE" placeholder="São Paulo">
          </div>
          <div class="campo c2">
            <label for="d-estado">ESTADO</label>
            <input type="text" id="d-estado" name="ESTADO" placeholder="SP">
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo c3">
            <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="d-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" placeholder="123.456.789-09" inputmode="numeric">
          </div>
          <div class="campo c3">
            <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="d-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
          </div>
          <div class="campo c3">
            <label for="d-banco">NOME DO BANCO</label>
            <input type="text" id="d-banco" name="NOME DO BANCO" placeholder="Banco do Brasil">
          </div>
          <div class="campo c3">
            <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
            <input type="text" id="d-agencia" name="NÚMERO DA AGÊNCIA" placeholder="1234" inputmode="numeric">
          </div>
          <div class="campo c3">
            <label for="d-conta">NÚMERO DA CONTA</label>
            <input type="text" id="d-conta" name="NÚMERO DA CONTA" placeholder="12345-6">
          </div>
        </div>
      </fieldset>
      <button class="enviar" type="submit">Enviar solicitação</button>
    </form>
  </section>
  <section id="confirmacao" hidden>
    <h1>Solicitação registrada</h1>
    <pre id="oficio"></pre>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
