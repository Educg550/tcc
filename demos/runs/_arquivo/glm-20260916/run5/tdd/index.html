<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="titulos">
    <h1>Universidade de São Paulo</h1>
    <p class="programa">Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>
<nav class="abas">
  <button class="aba ativa" type="button" data-alvo="form-alunos">ALUNOS</button>
  <button class="aba" type="button" data-alvo="form-docentes">DOCENTES</button>
</nav>
<main>
<div id="formularios">

<form id="form-alunos" class="formulario" data-aba="ALUNOS">
  <div class="erros"></div>
  <section class="bloco">
    <h2>SOLICITANTE E EVENTO</h2>
    <div class="campos">
      <label class="span-6">NOME COMPLETO - SEM ABREVIAR
        <input name="NOME COMPLETO - SEM ABREVIAR" placeholder="Maria Souza">
      </label>
      <label class="span-3">N. USP
        <input name="N. USP" placeholder="1234567" inputmode="numeric">
      </label>
      <label class="span-3">PROGRAMA
        <input name="PROGRAMA" placeholder="Ciência da Computação">
      </label>
      <label class="span-3">NÍVEL
        <select name="NÍVEL">
          <option value="">Selecione</option>
          <option>Mestrado</option>
          <option>Doutorado</option>
        </select>
      </label>
      <label class="span-4">TIPO DE AUXÍLIO
        <select name="TIPO DE AUXÍLIO">
          <option value="">Selecione</option>
          <option>Participação em evento</option>
          <option>Banca de exame ou defesa</option>
          <option>Outro</option>
        </select>
      </label>
      <label class="span-5">E-MAIL
        <input name="E-MAIL" placeholder="maria@usp.br">
      </label>
      <label class="span-6">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
        <input name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Congresso Brasileiro de Computação">
      </label>
      <label class="span-6">PERÍODO DO EVENTO, EXAME OU DEFESA
        <input name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="10/03/2025 a 15/03/2025">
      </label>
      <label class="span-3">CIDADE DO EVENTO, EXAME OU DEFESA
        <input name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="São Paulo">
      </label>
      <label class="span-2">ESTADO DO EVENTO, EXAME OU DEFESA
        <input name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="SP">
      </label>
      <label class="span-3">PAÍS DO EVENTO, EXAME OU DEFESA
        <input name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil">
      </label>
      <label class="span-4">LINK DO EVENTO, EXAME OU DEFESA
        <input name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="https://evento.example.br">
      </label>
      <label class="span-3">VALOR SOLICITADO (R$)
        <input name="VALOR SOLICITADO (R$)" placeholder="150000" inputmode="numeric" data-formato="moeda">
      </label>
      <label class="span-6">DETALHAMENTO DO PEDIDO
        <textarea name="DETALHAMENTO DO PEDIDO" placeholder="Passagens aéreas e hospedagem"></textarea>
      </label>
      <label class="span-3">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
        <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
          <option value="">Selecione</option>
          <option>Pôster</option>
          <option>Apresentação oral</option>
          <option>Outra</option>
          <option>Não irá apresentar trabalho</option>
        </select>
      </label>
    </div>
  </section>
  <section class="bloco">
    <h2>ENDEREÇO DO SOLICITANTE</h2>
    <div class="campos">
      <label class="span-3">DATA DE NASCIMENTO
        <input name="DATA DE NASCIMENTO" placeholder="01021980" inputmode="numeric" data-formato="data">
      </label>
      <label class="span-4">LOGRADOURO
        <input name="LOGRADOURO" placeholder="Rua do Anfiteatro">
      </label>
      <label class="span-2">NÚMERO
        <input name="NÚMERO" placeholder="101">
      </label>
      <label class="span-3">COMPLEMENTO
        <input name="COMPLEMENTO" placeholder="Sala 5">
      </label>
      <label class="span-4">BAIRRO
        <input name="BAIRRO" placeholder="Butantã">
      </label>
      <label class="span-3">CEP
        <input name="CEP" placeholder="05508090" inputmode="numeric" data-formato="cep">
      </label>
      <label class="span-3">CIDADE
        <input name="CIDADE" placeholder="São Paulo">
      </label>
      <label class="span-2">ESTADO
        <input name="ESTADO" placeholder="SP">
      </label>
    </div>
  </section>
  <section class="bloco">
    <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
    <div class="campos">
      <label class="span-3">CPF (SEPARADOS POR PONTOS E TRAÇO)
        <input name="CPF (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12345678909" inputmode="numeric" data-formato="cpf">
      </label>
      <label class="span-3">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
        <input name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
      </label>
      <label class="span-2">NOME DO BANCO
        <input name="NOME DO BANCO" placeholder="Banco do Brasil">
      </label>
      <label class="span-2">NÚMERO DA AGÊNCIA
        <input name="NÚMERO DA AGÊNCIA" placeholder="1234" inputmode="numeric">
      </label>
      <label class="span-2">NÚMERO DA CONTA
        <input name="NÚMERO DA CONTA" placeholder="98765-4">
      </label>
    </div>
  </section>
  <p class="acoes"><button type="submit">Enviar solicitação</button></p>
</form>

<form id="form-docentes" class="formulario" data-aba="DOCENTES" hidden>
  <div class="erros"></div>
  <section class="bloco">
    <h2>SOLICITANTE E EVENTO</h2>
    <div class="campos">
      <label class="span-6">NOME COMPLETO - SEM ABREVIAR
        <input name="NOME COMPLETO - SEM ABREVIAR" placeholder="Carlos Andrade">
      </label>
      <label class="span-3">N. USP
        <input name="N. USP" placeholder="7654321" inputmode="numeric">
      </label>
      <label class="span-3">PROGRAMA
        <input name="PROGRAMA" placeholder="Estatística">
      </label>
      <label class="span-6">E-MAIL
        <input name="E-MAIL" placeholder="carlos@ime.usp.br">
      </label>
      <label class="span-6">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
        <input name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Banca de defesa de mestrado">
      </label>
      <label class="span-4">PERÍODO DO EVENTO, EXAME OU DEFESA
        <input name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="10/03/2025 a 15/03/2025">
      </label>
      <label class="span-3">CIDADE DO EVENTO, EXAME OU DEFESA
        <input name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="São Paulo">
      </label>
      <label class="span-2">ESTADO DO EVENTO, EXAME OU DEFESA
        <input name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="SP">
      </label>
      <label class="span-3">PAÍS DO EVENTO, EXAME OU DEFESA
        <input name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil">
      </label>
      <label class="span-4">LINK DO EVENTO, EXAME OU DEFESA
        <input name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="https://evento.example.br">
      </label>
      <label class="span-3">VALOR SOLICITADO (R$)
        <input name="VALOR SOLICITADO (R$)" placeholder="25000" inputmode="numeric" data-formato="moeda">
      </label>
      <label class="span-5">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
        <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
          <option value="">Selecione</option>
          <option>Pôster</option>
          <option>Apresentação oral</option>
          <option>Outra</option>
          <option>Não irá apresentar trabalho</option>
        </select>
      </label>
      <label class="span-12">DETALHAMENTO DO PEDIDO
        <textarea name="DETALHAMENTO DO PEDIDO" placeholder="Passagens rodoviárias"></textarea>
      </label>
    </div>
  </section>
  <section class="bloco">
    <h2>ENDEREÇO DO SOLICITANTE</h2>
    <div class="campos">
      <label class="span-3">DATA DE NASCIMENTO
        <input name="DATA DE NASCIMENTO" placeholder="01021980" inputmode="numeric" data-formato="data">
      </label>
      <label class="span-4">LOGRADOURO
        <input name="LOGRADOURO" placeholder="Rua do Anfiteatro">
      </label>
      <label class="span-2">NÚMERO
        <input name="NÚMERO" placeholder="101">
      </label>
      <label class="span-3">COMPLEMENTO
        <input name="COMPLEMENTO" placeholder="Sala 5">
      </label>
      <label class="span-4">BAIRRO
        <input name="BAIRRO" placeholder="Butantã">
      </label>
      <label class="span-3">CEP
        <input name="CEP" placeholder="05508090" inputmode="numeric" data-formato="cep">
      </label>
      <label class="span-3">CIDADE
        <input name="CIDADE" placeholder="São Paulo">
      </label>
      <label class="span-2">ESTADO
        <input name="ESTADO" placeholder="SP">
      </label>
    </div>
  </section>
  <section class="bloco">
    <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
    <div class="campos">
      <label class="span-3">CPF (SEPARADOS POR PONTOS E TRAÇO)
        <input name="CPF (SEPARADOS POR PONTOS E TRAÇO)" placeholder="98765432100" inputmode="numeric" data-formato="cpf">
      </label>
      <label class="span-3">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
        <input name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
      </label>
      <label class="span-2">NOME DO BANCO
        <input name="NOME DO BANCO" placeholder="Banco do Brasil">
      </label>
      <label class="span-2">NÚMERO DA AGÊNCIA
        <input name="NÚMERO DA AGÊNCIA" placeholder="1234" inputmode="numeric">
      </label>
      <label class="span-2">NÚMERO DA CONTA
        <input name="NÚMERO DA CONTA" placeholder="98765-4">
      </label>
    </div>
  </section>
  <p class="acoes"><button type="submit">Enviar solicitação</button></p>
</form>

</div>
<section id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <div class="oficio"></div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
