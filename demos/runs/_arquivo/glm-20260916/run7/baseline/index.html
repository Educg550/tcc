<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="identificacao">
      <p class="universidade">Universidade de São Paulo</p>
      <p class="programa">Pós-Graduação do IME-USP</p>
    </div>
  </header>

  <nav class="abas" role="tablist" aria-label="Tipo de solicitante">
    <button type="button" class="aba" role="tab" id="aba-alunos" aria-selected="true" data-painel="painel-alunos">ALUNOS</button>
    <button type="button" class="aba" role="tab" id="aba-docentes" aria-selected="false" data-painel="painel-docentes">DOCENTES</button>
  </nav>

  <main>
    <section class="painel" id="painel-alunos" role="tabpanel" aria-labelledby="aba-alunos">
      <form class="solicitacao" data-perfil="alunos" novalidate>
        <div class="erros" hidden></div>

        <section class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="grade">
            <label class="campo span2">
              <span class="rotulo">NOME COMPLETO - SEM ABREVIAR</span>
              <input type="text" name="NOME COMPLETO - SEM ABREVIAR" placeholder="Maria Aparecida da Silva">
            </label>
            <label class="campo">
              <span class="rotulo">N. USP</span>
              <input type="text" name="N. USP" inputmode="numeric" placeholder="8765432">
            </label>
            <label class="campo">
              <span class="rotulo">PROGRAMA</span>
              <input type="text" name="PROGRAMA" placeholder="Ciência da Computação">
            </label>
            <label class="campo">
              <span class="rotulo">NÍVEL</span>
              <select name="NÍVEL">
                <option value="">Selecione</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select>
            </label>
            <label class="campo">
              <span class="rotulo">TIPO DE AUXÍLIO</span>
              <select name="TIPO DE AUXÍLIO">
                <option value="">Selecione</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select>
            </label>
            <label class="campo span2">
              <span class="rotulo">E-MAIL</span>
              <input type="email" name="E-MAIL" placeholder="maria.silva@usp.br">
            </label>
            <label class="campo span2">
              <span class="rotulo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
              <input type="text" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Simpósio Brasileiro de Computação">
            </label>
            <label class="campo span2">
              <span class="rotulo">PERÍODO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="12/05/2025 a 15/05/2025">
            </label>
            <label class="campo">
              <span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Rio de Janeiro">
            </label>
            <label class="campo">
              <span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="RJ">
            </label>
            <label class="campo">
              <span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil">
            </label>
            <label class="campo">
              <span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="https://evento.sbc.org.br">
            </label>
            <label class="campo">
              <span class="rotulo">VALOR SOLICITADO (R$)</span>
              <input type="text" name="VALOR SOLICITADO (R$)" data-mascara="valor" inputmode="numeric" placeholder="150000">
            </label>
            <label class="campo span2">
              <span class="rotulo">DETALHAMENTO DO PEDIDO</span>
              <textarea name="DETALHAMENTO DO PEDIDO" placeholder="Inscrição no evento e passagem aérea de ida e volta"></textarea>
            </label>
            <label class="campo">
              <span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
              <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
                <option value="">Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </label>
          </div>
        </section>

        <section class="bloco">
          <h2>ENDEREÇO DO SOLICITANTE</h2>
          <div class="grade cinco">
            <label class="campo">
              <span class="rotulo">DATA DE NASCIMENTO</span>
              <input type="text" name="DATA DE NASCIMENTO" data-mascara="data" inputmode="numeric" placeholder="01021980">
            </label>
            <label class="campo span2">
              <span class="rotulo">LOGRADOURO</span>
              <input type="text" name="LOGRADOURO" placeholder="Rua do Matão">
            </label>
            <label class="campo">
              <span class="rotulo">NÚMERO</span>
              <input type="text" name="NÚMERO" placeholder="1010">
            </label>
            <label class="campo">
              <span class="rotulo">COMPLEMENTO</span>
              <input type="text" name="COMPLEMENTO" placeholder="Sala 224">
            </label>
            <label class="campo">
              <span class="rotulo">BAIRRO</span>
              <input type="text" name="BAIRRO" placeholder="Cidade Universitária">
            </label>
            <label class="campo">
              <span class="rotulo">CEP</span>
              <input type="text" name="CEP" data-mascara="cep" inputmode="numeric" placeholder="05508090">
            </label>
            <label class="campo">
              <span class="rotulo">CIDADE</span>
              <input type="text" name="CIDADE" placeholder="São Paulo">
            </label>
            <label class="campo span2">
              <span class="rotulo">ESTADO</span>
              <input type="text" name="ESTADO" placeholder="SP">
            </label>
          </div>
        </section>

        <section class="bloco">
          <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class="grade cinco">
            <label class="campo">
              <span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input type="text" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" data-mascara="cpf" inputmode="numeric" placeholder="12345678909">
            </label>
            <label class="campo">
              <span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input type="text" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
            </label>
            <label class="campo">
              <span class="rotulo">NOME DO BANCO</span>
              <input type="text" name="NOME DO BANCO" placeholder="Banco do Brasil">
            </label>
            <label class="campo">
              <span class="rotulo">NÚMERO DA AGÊNCIA</span>
              <input type="text" name="NÚMERO DA AGÊNCIA" inputmode="numeric" placeholder="4321">
            </label>
            <label class="campo">
              <span class="rotulo">NÚMERO DA CONTA</span>
              <input type="text" name="NÚMERO DA CONTA" placeholder="12345-6">
            </label>
          </div>
        </section>

        <div class="acoes">
          <button type="submit" class="enviar">Enviar solicitação</button>
        </div>
      </form>
    </section>

    <section class="painel" id="painel-docentes" role="tabpanel" aria-labelledby="aba-docentes" hidden>
      <form class="solicitacao" data-perfil="docentes" novalidate>
        <div class="erros" hidden></div>

        <section class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="grade">
            <label class="campo span2">
              <span class="rotulo">NOME COMPLETO - SEM ABREVIAR</span>
              <input type="text" name="NOME COMPLETO - SEM ABREVIAR" placeholder="João Pedro de Oliveira">
            </label>
            <label class="campo">
              <span class="rotulo">N. USP</span>
              <input type="text" name="N. USP" inputmode="numeric" placeholder="1234567">
            </label>
            <label class="campo">
              <span class="rotulo">PROGRAMA</span>
              <input type="text" name="PROGRAMA" placeholder="Estatística">
            </label>
            <label class="campo span2">
              <span class="rotulo">E-MAIL</span>
              <input type="email" name="E-MAIL" placeholder="joao.oliveira@ime.usp.br">
            </label>
            <label class="campo span2">
              <span class="rotulo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
              <input type="text" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Banca de defesa de doutorado">
            </label>
            <label class="campo span2">
              <span class="rotulo">PERÍODO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="12/05/2025 a 15/05/2025">
            </label>
            <label class="campo">
              <span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="São Paulo">
            </label>
            <label class="campo">
              <span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="SP">
            </label>
            <label class="campo span2">
              <span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil">
            </label>
            <label class="campo">
              <span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>
              <input type="text" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="https://www.ime.usp.br/evento">
            </label>
            <label class="campo">
              <span class="rotulo">VALOR SOLICITADO (R$)</span>
              <input type="text" name="VALOR SOLICITADO (R$)" data-mascara="valor" inputmode="numeric" placeholder="150000">
            </label>
            <label class="campo span3">
              <span class="rotulo">DETALHAMENTO DO PEDIDO</span>
              <textarea name="DETALHAMENTO DO PEDIDO" placeholder="Passagem aérea para participação em banca de defesa"></textarea>
            </label>
            <label class="campo">
              <span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
              <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
                <option value="">Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </label>
          </div>
        </section>

        <section class="bloco">
          <h2>ENDEREÇO DO SOLICITANTE</h2>
          <div class="grade cinco">
            <label class="campo">
              <span class="rotulo">DATA DE NASCIMENTO</span>
              <input type="text" name="DATA DE NASCIMENTO" data-mascara="data" inputmode="numeric" placeholder="01021980">
            </label>
            <label class="campo span2">
              <span class="rotulo">LOGRADOURO</span>
              <input type="text" name="LOGRADOURO" placeholder="Rua do Matão">
            </label>
            <label class="campo">
              <span class="rotulo">NÚMERO</span>
              <input type="text" name="NÚMERO" placeholder="1010">
            </label>
            <label class="campo">
              <span class="rotulo">COMPLEMENTO</span>
              <input type="text" name="COMPLEMENTO" placeholder="Sala 224">
            </label>
            <label class="campo">
              <span class="rotulo">BAIRRO</span>
              <input type="text" name="BAIRRO" placeholder="Cidade Universitária">
            </label>
            <label class="campo">
              <span class="rotulo">CEP</span>
              <input type="text" name="CEP" data-mascara="cep" inputmode="numeric" placeholder="05508090">
            </label>
            <label class="campo">
              <span class="rotulo">CIDADE</span>
              <input type="text" name="CIDADE" placeholder="São Paulo">
            </label>
            <label class="campo span2">
              <span class="rotulo">ESTADO</span>
              <input type="text" name="ESTADO" placeholder="SP">
            </label>
          </div>
        </section>

        <section class="bloco">
          <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class="grade cinco">
            <label class="campo">
              <span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input type="text" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" data-mascara="cpf" inputmode="numeric" placeholder="12345678909">
            </label>
            <label class="campo">
              <span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
              <input type="text" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
            </label>
            <label class="campo">
              <span class="rotulo">NOME DO BANCO</span>
              <input type="text" name="NOME DO BANCO" placeholder="Banco do Brasil">
            </label>
            <label class="campo">
              <span class="rotulo">NÚMERO DA AGÊNCIA</span>
              <input type="text" name="NÚMERO DA AGÊNCIA" inputmode="numeric" placeholder="4321">
            </label>
            <label class="campo">
              <span class="rotulo">NÚMERO DA CONTA</span>
              <input type="text" name="NÚMERO DA CONTA" placeholder="12345-6">
            </label>
          </div>
        </section>

        <div class="acoes">
          <button type="submit" class="enviar">Enviar solicitação</button>
        </div>
      </form>
    </section>

    <section id="confirmacao" hidden>
      <h1 class="titulo-confirmacao">Solicitação registrada</h1>
      <pre class="oficio"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
