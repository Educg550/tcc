<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div>
      <h1>Universidade de São Paulo</h1>
      <p class="programa">Pós-Graduação do IME-USP</p>
    </div>
  </header>

  <main id="conteudo">
    <nav class="abas" aria-label="Formulários de solicitação de auxílio financeiro">
      <button type="button" class="aba ativa" id="aba-alunos" aria-selected="true" aria-controls="painel-alunos">ALUNOS</button>
      <button type="button" class="aba" id="aba-docentes" aria-selected="false" aria-controls="painel-docentes">DOCENTES</button>
    </nav>

    <section class="painel" id="painel-alunos">
      <form id="form-alunos" data-formulario="alunos" novalidate>
        <div class="erros" hidden></div>

        <section class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="grade">
            <label class="c2">NOME COMPLETO - SEM ABREVIAR
              <input type="text" name="NOME COMPLETO - SEM ABREVIAR" placeholder="Maria Aparecida de Souza">
            </label>
            <label>N. USP
              <input type="text" name="N. USP" inputmode="numeric" placeholder="1234567">
            </label>
            <label>PROGRAMA
              <input type="text" name="PROGRAMA" placeholder="Ciência da Computação">
            </label>
            <label>NÍVEL
              <select name="NÍVEL">
                <option value="">Ex.: Mestrado</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select>
            </label>
            <label>TIPO DE AUXÍLIO
              <select name="TIPO DE AUXÍLIO">
                <option value="">Ex.: Participação em evento</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select>
            </label>
            <label class="c2">E-MAIL
              <input type="text" name="E-MAIL" placeholder="maria.aparecida@usp.br">
            </label>
            <label class="c2">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
              <input type="text" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Congresso Brasileiro de Computação 2026">
            </label>
            <label>PERÍODO DO EVENTO, EXAME OU DEFESA
              <input type="text" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="10/03/2026 a 14/03/2026">
            </label>
            <label>CIDADE DO EVENTO, EXAME OU DEFESA
              <input type="text" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Rio de Janeiro">
            </label>
            <label>ESTADO DO EVENTO, EXAME OU DEFESA
              <input type="text" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="RJ">
            </label>
            <label>PAÍS DO EVENTO, EXAME OU DEFESA
              <input type="text" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil">
            </label>
            <label class="c2">LINK DO EVENTO, EXAME OU DEFESA
              <input type="text" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="https://cbcomp2026.sbc.org.br">
            </label>
            <label>VALOR SOLICITADO (R$)
              <input type="text" name="VALOR SOLICITADO (R$)" inputmode="numeric" placeholder="150000" data-mascara="moeda">
            </label>
            <label class="c3">DETALHAMENTO DO PEDIDO
              <textarea name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Passagem aérea de ida e volta e inscrição no evento"></textarea>
            </label>
            <label class="c4">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
              <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
                <option value="">Ex.: Pôster</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </label>
          </div>
        </section>

        <section class="bloco">
          <h2>ENDEREÇO DO SOLICITANTE</h2>
          <div class="grade">
            <label>DATA DE NASCIMENTO
              <input type="text" name="DATA DE NASCIMENTO" inputmode="numeric" placeholder="01/02/1980" data-mascara="data">
            </label>
            <label>LOGRADOURO
              <input type="text" name="LOGRADOURO" placeholder="Rua do Anfiteatro">
            </label>
            <label>NÚMERO
              <input type="text" name="NÚMERO" placeholder="181">
            </label>
            <label>COMPLEMENTO
              <input type="text" name="COMPLEMENTO" placeholder="Sala 212">
            </label>
            <label>BAIRRO
              <input type="text" name="BAIRRO" placeholder="Butantã">
            </label>
            <label>CEP
              <input type="text" name="CEP" inputmode="numeric" placeholder="05508-090" data-mascara="cep">
            </label>
            <label>CIDADE
              <input type="text" name="CIDADE" placeholder="São Paulo">
            </label>
            <label>ESTADO
              <input type="text" name="ESTADO" placeholder="SP">
            </label>
          </div>
        </section>

        <section class="bloco">
          <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class="grade grade-5">
            <label>CPF (SEPARADOS POR PONTOS E TRAÇO)
              <input type="text" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" inputmode="numeric" placeholder="123.456.789-09" data-mascara="cpf">
            </label>
            <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
              <input type="text" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
            </label>
            <label>NOME DO BANCO
              <input type="text" name="NOME DO BANCO" placeholder="Banco do Brasil">
            </label>
            <label>NÚMERO DA AGÊNCIA
              <input type="text" name="NÚMERO DA AGÊNCIA" inputmode="numeric" placeholder="0001">
            </label>
            <label>NÚMERO DA CONTA
              <input type="text" name="NÚMERO DA CONTA" placeholder="12345-6">
            </label>
          </div>
        </section>

        <div class="acoes">
          <button type="submit" class="enviar">Enviar solicitação</button>
        </div>
      </form>
    </section>

    <section class="painel" id="painel-docentes" hidden>
      <form id="form-docentes" data-formulario="docentes" novalidate>
        <div class="erros" hidden></div>

        <section class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="grade">
            <label class="c2">NOME COMPLETO - SEM ABREVIAR
              <input type="text" name="NOME COMPLETO - SEM ABREVIAR" placeholder="João Carlos Moreira">
            </label>
            <label>N. USP
              <input type="text" name="N. USP" inputmode="numeric" placeholder="1234567">
            </label>
            <label>PROGRAMA
              <input type="text" name="PROGRAMA" placeholder="Estatística">
            </label>
            <label class="c2">E-MAIL
              <input type="text" name="E-MAIL" placeholder="joao.moreira@usp.br">
            </label>
            <label class="c2">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
              <input type="text" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Banca de defesa de mestrado - IME-USP">
            </label>
            <label>PERÍODO DO EVENTO, EXAME OU DEFESA
              <input type="text" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="20/04/2026 a 20/04/2026">
            </label>
            <label>CIDADE DO EVENTO, EXAME OU DEFESA
              <input type="text" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Campinas">
            </label>
            <label>ESTADO DO EVENTO, EXAME OU DEFESA
              <input type="text" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="SP">
            </label>
            <label>PAÍS DO EVENTO, EXAME OU DEFESA
              <input type="text" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil">
            </label>
            <label>LINK DO EVENTO, EXAME OU DEFESA
              <input type="text" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="https://www.ime.usp.br">
            </label>
            <label>VALOR SOLICITADO (R$)
              <input type="text" name="VALOR SOLICITADO (R$)" inputmode="numeric" placeholder="150000" data-mascara="moeda">
            </label>
            <label class="c2">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
              <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
                <option value="">Ex.: Pôster</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </label>
            <label class="c4">DETALHAMENTO DO PEDIDO
              <textarea name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Passagem rodoviária e diárias para participação em banca"></textarea>
            </label>
          </div>
        </section>

        <section class="bloco">
          <h2>ENDEREÇO DO SOLICITANTE</h2>
          <div class="grade">
            <label>DATA DE NASCIMENTO
              <input type="text" name="DATA DE NASCIMENTO" inputmode="numeric" placeholder="01/02/1980" data-mascara="data">
            </label>
            <label>LOGRADOURO
              <input type="text" name="LOGRADOURO" placeholder="Rua do Anfiteatro">
            </label>
            <label>NÚMERO
              <input type="text" name="NÚMERO" placeholder="181">
            </label>
            <label>COMPLEMENTO
              <input type="text" name="COMPLEMENTO" placeholder="Sala 212">
            </label>
            <label>BAIRRO
              <input type="text" name="BAIRRO" placeholder="Butantã">
            </label>
            <label>CEP
              <input type="text" name="CEP" inputmode="numeric" placeholder="05508-090" data-mascara="cep">
            </label>
            <label>CIDADE
              <input type="text" name="CIDADE" placeholder="São Paulo">
            </label>
            <label>ESTADO
              <input type="text" name="ESTADO" placeholder="SP">
            </label>
          </div>
        </section>

        <section class="bloco">
          <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class="grade grade-5">
            <label>CPF (SEPARADOS POR PONTOS E TRAÇO)
              <input type="text" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" inputmode="numeric" placeholder="123.456.789-09" data-mascara="cpf">
            </label>
            <label>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
              <input type="text" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
            </label>
            <label>NOME DO BANCO
              <input type="text" name="NOME DO BANCO" placeholder="Banco do Brasil">
            </label>
            <label>NÚMERO DA AGÊNCIA
              <input type="text" name="NÚMERO DA AGÊNCIA" inputmode="numeric" placeholder="0001">
            </label>
            <label>NÚMERO DA CONTA
              <input type="text" name="NÚMERO DA CONTA" placeholder="12345-6">
            </label>
          </div>
        </section>

        <div class="acoes">
          <button type="submit" class="enviar">Enviar solicitação</button>
        </div>
      </form>
    </section>
  </main>

  <section class="confirmacao" id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre class="oficio" id="oficio"></pre>
  </section>

  <script src="/app.js"></script>
</body>
</html>
