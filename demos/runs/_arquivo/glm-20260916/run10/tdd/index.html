<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="cabecalho-nomes">
      <p class="universidade">Universidade de São Paulo</p>
      <p class="programa-nome">Pós-Graduação do Instituto de Matemática e Estatística</p>
    </div>
  </header>
  <nav class="abas">
    <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>
  <main>
    <section class="painel" id="painel-alunos">
      <div class="erros" id="erros-alunos" hidden></div>
      <form id="form-alunos" novalidate>
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grade">
            <label class="f6">NOME COMPLETO - SEM ABREVIAR
              <input name="nome_completo" type="text" placeholder="Maria de Souza Silva" required>
            </label>
            <label>N. USP
              <input name="n_usp" type="text" inputmode="numeric" placeholder="8765432" required>
            </label>
            <label>PROGRAMA
              <input name="programa" type="text" placeholder="Ciência da Computação" required>
            </label>
            <label>NÍVEL
              <select name="nivel" required>
                <option value="">Selecione</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select>
            </label>
            <label>TIPO DE AUXÍLIO
              <select name="tipo_auxilio" required>
                <option value="">Selecione</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select>
            </label>
            <label>E-MAIL
              <input name="email" type="email" placeholder="maria.souza@usp.br" required>
            </label>
            <label class="f6">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
              <input name="nome_do_evento" type="text" placeholder="Simpósio Brasileiro de Banco de Dados" required>
            </label>
            <label>PERÍODO DO EVENTO, EXAME OU DEFESA
              <input name="periodo_do_evento" type="text" placeholder="22 a 25 de setembro de 2025" required>
            </label>
            <label>CIDADE DO EVENTO, EXAME OU DEFESA
              <input name="cidade_do_evento" type="text" placeholder="Campinas" required>
            </label>
            <label>ESTADO DO EVENTO, EXAME OU DEFESA
              <input name="estado_do_evento" type="text" placeholder="SP" required>
            </label>
            <label>PAÍS DO EVENTO, EXAME OU DEFESA
              <input name="pais_do_evento" type="text" placeholder="Brasil" required>
            </label>
            <label>LINK DO EVENTO, EXAME OU DEFESA
              <input name="link_do_evento" type="url" placeholder="https://sbbd.org.br/2025">
            </label>
            <label>VALOR SOLICITADO (R$)
              <input name="valor_solicitado" type="text" inputmode="numeric" class="fmt-valor" placeholder="Ex.: 150000" required>
            </label>
            <label class="f9">DETALHAMENTO DO PEDIDO
              <textarea name="detalhamento" rows="2" placeholder="Passagem aérea e inscrição no evento." required></textarea>
            </label>
            <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
              <select name="apresentacao_trabalho" required>
                <option value="">Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </label>
          </div>
        </fieldset>
        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <label>DATA DE NASCIMENTO
              <input name="data_de_nascimento" type="text" inputmode="numeric" class="fmt-data" placeholder="01021980" required>
            </label>
            <label>LOGRADOURO
              <input name="logradouro" type="text" placeholder="Rua do Anfiteatro" required>
            </label>
            <label>NÚMERO
              <input name="numero" type="text" placeholder="155" required>
            </label>
            <label>COMPLEMENTO
              <input name="complemento" type="text" placeholder="Sala 10">
            </label>
            <label>BAIRRO
              <input name="bairro" type="text" placeholder="Cidade Universitária" required>
            </label>
            <label>CEP
              <input name="cep" type="text" inputmode="numeric" class="fmt-cep" placeholder="05508090" required>
            </label>
            <label>CIDADE
              <input name="cidade" type="text" placeholder="São Paulo" required>
            </label>
            <label>ESTADO
              <input name="estado" type="text" placeholder="SP" required>
            </label>
          </div>
        </fieldset>
        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <label class="f6">CPF (SEPARADOS POR PONTOS E TRAÇO)
              <input name="cpf" type="text" inputmode="numeric" class="fmt-cpf" placeholder="12345678909" required>
            </label>
            <label class="f6">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
              <input name="rg_rnm" type="text" placeholder="12.345.678-9" required>
            </label>
            <label class="f4">NOME DO BANCO
              <input name="nome_banco" type="text" placeholder="Banco do Brasil" required>
            </label>
            <label class="f4">NÚMERO DA AGÊNCIA
              <input name="numero_agencia" type="text" inputmode="numeric" placeholder="1234" required>
            </label>
            <label class="f4">NÚMERO DA CONTA
              <input name="numero_conta" type="text" placeholder="98765-4" required>
            </label>
          </div>
        </fieldset>
        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>
    <section class="painel" id="painel-docentes" hidden>
      <div class="erros" id="erros-docentes" hidden></div>
      <form id="form-docentes" novalidate>

              <input name="email" type="email" placeholder="maria.souza@usp.br" required>
            </label>
            <label class="f6">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
              <input name="nome_do_evento" type="text" placeholder="Simpósio Brasileiro de Banco de Dados" required>

              <input name="periodo_do_evento" type="text" placeholder="22 a 25 de setembro de 2025" required>

            </label>
            <label>ESTADO DO EVENTO, EXAME OU DEFESA

            <label>PAÍS DO EVENTO, EXAME OU DEFESA
              <input name="pais_do_evento" type="text" placeholder="Brasil" required>

            <label>LINK DO EVENTO, EXAME OU DEFESA

            <label>VALOR SOLICITADO (R$)
              <input name="valor_solicitado" type="text" inputmode="numeric" class="fmt-valor" placeholder="Ex.: 150000" required>
            </label>
            <label class="f9">DETALHAMENTO DO PEDIDO
              <textarea name="detalhamento" rows="2" placeholder="Passagem aérea e inscrição no evento." required></textarea>
            </label>
            <label>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
              <select name="apresentacao_trabalho" required>
                <option value="">Selecione</option>

                <option>Apresentação oral</option>

              </select>
            </label>
          </div>
        </fieldset>
        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <label>DATA DE NASCIMENTO
              <input name="data_de_nascimento" type="text" inputmode="numeric" class="fmt-data" placeholder="01021980" required>
            </label>
            <label>LOGRADOURO
              <input name="logradouro" type="text" placeholder="Rua do Anfiteatro" required>
            </label>
            <label>NÚMERO
              <input name="numero" type="text" placeholder="155" required>
            </label>
            <label>COMPLEMENTO
              <input name="complemento" type="text" placeholder="Sala 10">
            </label>
            <label>BAIRRO
              <input name="bairro" type="text" placeholder="Cidade Universitária" required>
            </label>
            <label>CEP
              <input name="cep" type="text" inputmode="numeric" class="fmt-cep" placeholder="05508090" required>
            </label>
            <label>CIDADE
              <input name="cidade" type="text" placeholder="São Paulo" required>
            </label>
            <label>ESTADO
              <input name="estado" type="text" placeholder="SP" required>
            </label>
          </div>
        </fieldset>
        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <label class="f6">CPF (SEPARADOS POR PONTOS E TRAÇO)
              <input name="cpf" type="text" inputmode="numeric" class="fmt-cpf" placeholder="12345678909" required>
            </label>
            <label class="f6">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
              <input name="rg_rnm" type="text" placeholder="12.345.678-9" required>
            </label>
            <label class="f4">NOME DO BANCO
              <input name="nome_banco" type="text" placeholder="Banco do Brasil" required>
            </label>
            <label class="f4">NÚMERO DA AGÊNCIA
              <input name="numero_agencia" type="text" inputmode="numeric" placeholder="1234" required>
            </label>
            <label class="f4">NÚMERO DA CONTA
              <input name="numero_conta" type="text" placeholder="98765-4" required>
            </label>
          </div>
        </fieldset>
        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>
    <section class="painel" id="confirmacao" hidden>
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </section>
  </main>
</body>
</html>
