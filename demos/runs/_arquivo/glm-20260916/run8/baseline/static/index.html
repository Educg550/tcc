<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel='stylesheet' href='/static/style.css'>
</head>
<body>
<header class='cabecalho'>
  <img src='/assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo' class='logo'>
  <div>
    <h1>Universidade de São Paulo</h1>
    <p class='programa'>Programa de Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>
<main>
  <section id='formulario'>
    <div class='abas' role='tablist' aria-label='Tipo de solicitante'>
      <button type='button' id='aba-alunos' class='aba ativa' role='tab' aria-selected='true' aria-controls='form-alunos'>ALUNOS</button>
      <button type='button' id='aba-docentes' class='aba' role='tab' aria-selected='false' aria-controls='form-docentes'>DOCENTES</button>
    </div>

    <form id='form-alunos' class='painel' role='tabpanel' aria-labelledby='aba-alunos' novalidate>
      <div class='erros' role='alert' hidden></div>
      <section class='bloco'>
        <h2>SOLICITANTE E EVENTO</h2>
        <div class='campos'>
          <div class='campo c8'>
            <label for='alu-nome'>NOME COMPLETO - SEM ABREVIAR</label>
            <input type='text' id='alu-nome' name='nome_completo' placeholder='Ex.: Maria Aparecida de Souza'>
          </div>
          <div class='campo c3'>
            <label for='alu-n-usp'>N. USP</label>
            <input type='text' id='alu-n-usp' name='n_usp' inputmode='numeric' placeholder='Ex.: 1234567'>
          </div>
          <div class='campo c5'>
            <label for='alu-programa'>PROGRAMA</label>
            <input type='text' id='alu-programa' name='programa' placeholder='Ex.: Ciência da Computação'>
          </div>
          <div class='campo c4'>
            <label for='alu-nivel'>NÍVEL</label>
            <select id='alu-nivel' name='nivel'>
              <option value='' selected>Selecione…</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class='campo c7'>
            <label for='alu-tipo'>TIPO DE AUXÍLIO</label>
            <select id='alu-tipo' name='tipo_auxilio'>
              <option value='' selected>Selecione…</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>
          <div class='campo c6'>
            <label for='alu-email'>E-MAIL</label>
            <input type='email' id='alu-email' name='email' placeholder='Ex.: maria.souza@usp.br'>
          </div>
          <div class='campo c7'>
            <label for='alu-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type='text' id='alu-evento' name='nome_evento' placeholder='Ex.: Congresso Brasileiro de Matemática'>
          </div>
          <div class='campo c4'>
            <label for='alu-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='alu-periodo' name='periodo_evento' placeholder='Ex.: 12 a 16 de janeiro de 2026'>
          </div>
          <div class='campo c3'>
            <label for='alu-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='alu-cidade-evento' name='cidade_evento' placeholder='Ex.: Rio de Janeiro'>
          </div>
          <div class='campo c3'>
            <label for='alu-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='alu-estado-evento' name='estado_evento' placeholder='Ex.: RJ'>
          </div>
          <div class='campo c3'>
            <label for='alu-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='alu-pais-evento' name='pais_evento' placeholder='Ex.: Brasil'>
          </div>
          <div class='campo c7'>
            <label for='alu-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='alu-link' name='link_evento' placeholder='Ex.: https://www.evento.org.br'>
          </div>
          <div class='campo c4'>
            <label for='alu-valor'>VALOR SOLICITADO (R$)</label>
            <input type='text' id='alu-valor' name='valor_solicitado' inputmode='numeric' data-formato='valor' placeholder='Ex.: 150000 (R$ 1.500,00)'>
          </div>
          <div class='campo c9'>
            <label for='alu-detalhamento'>DETALHAMENTO DO PEDIDO</label>
            <textarea id='alu-detalhamento' name='detalhamento' rows='2' placeholder='Ex.: Inscrição no evento e passagem aérea de ida e volta'></textarea>
          </div>
          <div class='campo c7'>
            <label for='alu-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id='alu-apresentacao' name='apresentacao_trabalho'>
              <option value='' selected>Selecione…</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </section>
      <section class='bloco'>
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class='campos'>
          <div class='campo c4'>
            <label for='alu-data-nascimento'>DATA DE NASCIMENTO</label>
            <input type='text' id='alu-data-nascimento' name='data_nascimento' inputmode='numeric' data-formato='data' placeholder='Ex.: 01021980'>
          </div>
          <div class='campo c8'>
            <label for='alu-logradouro'>LOGRADOURO</label>
            <input type='text' id='alu-logradouro' name='logradouro' placeholder='Ex.: Rua do Matão'>
          </div>
          <div class='campo c3'>
            <label for='alu-numero'>NÚMERO</label>
            <input type='text' id='alu-numero' name='numero' placeholder='Ex.: 1010'>
          </div>
          <div class='campo c5'>
            <label for='alu-complemento'>COMPLEMENTO</label>
            <input type='text' id='alu-complemento' name='complemento' placeholder='Ex.: Sala 234-A'>
          </div>
          <div class='campo c6'>
            <label for='alu-bairro'>BAIRRO</label>
            <input type='text' id='alu-bairro' name='bairro' placeholder='Ex.: Cidade Universitária'>
          </div>
          <div class='campo c4'>
            <label for='alu-cep'>CEP</label>
            <input type='text' id='alu-cep' name='cep' inputmode='numeric' data-formato='cep' placeholder='Ex.: 05508090'>
          </div>
          <div class='campo c6'>
            <label for='alu-cidade'>CIDADE</label>
            <input type='text' id='alu-cidade' name='cidade' placeholder='Ex.: São Paulo'>
          </div>
          <div class='campo c4'>
            <label for='alu-estado'>ESTADO</label>
            <input type='text' id='alu-estado' name='estado' placeholder='Ex.: SP'>
          </div>
        </div>
      </section>
      <section class='bloco'>
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class='campos'>
          <div class='campo c4'>
            <label for='alu-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type='text' id='alu-cpf' name='cpf' inputmode='numeric' data-formato='cpf' placeholder='Ex.: 12345678909'>
          </div>
          <div class='campo c4'>
            <label for='alu-rg-rnm'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type='text' id='alu-rg-rnm' name='rg_rnm' placeholder='Ex.: 12.345.678-9'>
          </div>
          <div class='campo c5'>
            <label for='alu-banco'>NOME DO BANCO</label>
            <input type='text' id='alu-banco' name='nome_banco' placeholder='Ex.: Banco do Brasil'>
          </div>
          <div class='campo c3'>
            <label for='alu-agencia'>NÚMERO DA AGÊNCIA</label>
            <input type='text' id='alu-agencia' name='agencia' inputmode='numeric' placeholder='Ex.: 1234'>
          </div>
          <div class='campo c4'>
            <label for='alu-conta'>NÚMERO DA CONTA</label>
            <input type='text' id='alu-conta' name='numero_conta' placeholder='Ex.: 12345-6'>
          </div>
        </div>
      </section>
      <button type='submit' class='enviar'>Enviar solicitação</button>
    </form>

    <form id='form-docentes' class='painel' role='tabpanel' aria-labelledby='aba-docentes' novalidate hidden>
      <div class='erros' role='alert' hidden></div>
      <section class='bloco'>
        <h2>SOLICITANTE E EVENTO</h2>
        <div class='campos'>
          <div class='campo c8'>
            <label for='doc-nome'>NOME COMPLETO - SEM ABREVIAR</label>
            <input type='text' id='doc-nome' name='nome_completo' placeholder='Ex.: João Carlos de Oliveira'>
          </div>
          <div class='campo c3'>
            <label for='doc-n-usp'>N. USP</label>
            <input type='text' id='doc-n-usp' name='n_usp' inputmode='numeric' placeholder='Ex.: 1234567'>
          </div>
          <div class='campo c5'>
            <label for='doc-programa'>PROGRAMA</label>
            <input type='text' id='doc-programa' name='programa' placeholder='Ex.: Estatística'>
          </div>
          <div class='campo c4'>
            <label for='doc-email'>E-MAIL</label>
            <input type='email' id='doc-email' name='email' placeholder='Ex.: joao.oliveira@usp.br'>
          </div>
          <div class='campo c10'>
            <label for='doc-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type='text' id='doc-evento' name='nome_evento' placeholder='Ex.: Banca de defesa de mestrado de Maria Souza'>
          </div>
          <div class='campo c10'>
            <label for='doc-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='doc-periodo' name='periodo_evento' placeholder='Ex.: 3 de abril de 2026, das 14h às 17h'>
          </div>
          <div class='campo c5'>
            <label for='doc-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='doc-cidade-evento' name='cidade_evento' placeholder='Ex.: Campinas'>
          </div>
          <div class='campo c3'>
            <label for='doc-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='doc-estado-evento' name='estado_evento' placeholder='Ex.: SP'>
          </div>
          <div class='campo c4'>
            <label for='doc-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='doc-pais-evento' name='pais_evento' placeholder='Ex.: Brasil'>
          </div>
          <div class='campo c8'>
            <label for='doc-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='doc-link' name='link_evento' placeholder='Ex.: https://www.evento.org.br'>
          </div>
          <div class='campo c4'>
            <label for='doc-valor'>VALOR SOLICITADO (R$)</label>
            <input type='text' id='doc-valor' name='valor_solicitado' inputmode='numeric' data-formato='valor' placeholder='Ex.: 150000 (R$ 1.500,00)'>
          </div>
          <div class='campo c9'>
            <label for='doc-detalhamento'>DETALHAMENTO DO PEDIDO</label>
            <textarea id='doc-detalhamento' name='detalhamento' rows='2' placeholder='Ex.: Passagem aérea e diária para participação em banca'></textarea>
          </div>
          <div class='campo c7'>
            <label for='doc-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id='doc-apresentacao' name='apresentacao_trabalho'>
              <option value='' selected>Selecione…</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </section>
      <section class='bloco'>
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class='campos'>
          <div class='campo c4'>
            <label for='doc-data-nascimento'>DATA DE NASCIMENTO</label>
            <input type='text' id='doc-data-nascimento' name='data_nascimento' inputmode='numeric' data-formato='data' placeholder='Ex.: 01021980'>
          </div>
          <div class='campo c8'>
            <label for='doc-logradouro'>LOGRADOURO</label>
            <input type='text' id='doc-logradouro' name='logradouro' placeholder='Ex.: Avenida Professor Lineu Prestes'>
          </div>
          <div class='campo c3'>
            <label for='doc-numero'>NÚMERO</label>
            <input type='text' id='doc-numero' name='numero' placeholder='Ex.: 1010'>
          </div>
          <div class='campo c5'>
            <label for='doc-complemento'>COMPLEMENTO</label>
            <input type='text' id='doc-complemento' name='complemento' placeholder='Ex.: Apto 52'>
          </div>
          <div class='campo c6'>
            <label for='doc-bairro'>BAIRRO</label>
            <input type='text' id='doc-bairro' name='bairro' placeholder='Ex.: Butantã'>
          </div>
          <div class='campo c4'>
            <label for='doc-cep'>CEP</label>
            <input type='text' id='doc-cep' name='cep' inputmode='numeric' data-formato='cep' placeholder='Ex.: 05508090'>
          </div>
          <div class='campo c6'>
            <label for='doc-cidade'>CIDADE</label>
            <input type='text' id='doc-cidade' name='cidade' placeholder='Ex.: São Paulo'>
          </div>
          <div class='campo c4'>
            <label for='doc-estado'>ESTADO</label>
            <input type='text' id='doc-estado' name='estado' placeholder='Ex.: SP'>
          </div>
        </div>
      </section>
      <section class='bloco'>
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class='campos'>
          <div class='campo c4'>
            <label for='doc-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type='text' id='doc-cpf' name='cpf' inputmode='numeric' data-formato='cpf' placeholder='Ex.: 12345678909'>
          </div>
          <div class='campo c4'>
            <label for='doc-rg-rnm'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type='text' id='doc-rg-rnm' name='rg_rnm' placeholder='Ex.: 12.345.678-9'>
          </div>
          <div class='campo c5'>
            <label for='doc-banco'>NOME DO BANCO</label>
            <input type='text' id='doc-banco' name='nome_banco' placeholder='Ex.: Banco do Brasil'>
          </div>
          <div class='campo c3'>
            <label for='doc-agencia'>NÚMERO DA AGÊNCIA</label>
            <input type='text' id='doc-agencia' name='agencia' inputmode='numeric' placeholder='Ex.: 1234'>
          </div>
          <div class='campo c4'>
            <label for='doc-conta'>NÚMERO DA CONTA</label>
            <input type='text' id='doc-conta' name='numero_conta' placeholder='Ex.: 12345-6'>
          </div>
        </div>
      </section>
      <button type='submit' class='enviar'>Enviar solicitação</button>
    </form>
  </section>

  <section id='confirmacao' hidden>
    <h2 class='titulo-confirmacao'>Solicitação registrada</h2>
    <pre id='oficio' class='oficio'></pre>
  </section>
</main>
<script src='/static/app.js'></script>
</body>
</html>
