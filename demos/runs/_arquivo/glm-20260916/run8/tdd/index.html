<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="cabecalho-texto">
    <h1>Universidade de São Paulo</h1>
    <p>Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>

<nav class="abas">
  <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
  <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
</nav>

<main>
  <section id="painel-alunos">
    <form id="form-alunos">
      <div class="erros"></div>

      <h2>SOLICITANTE E EVENTO</h2>
      <div class="bloco">
        <div class="campo largura-2">
          <label for="alunos_nome">NOME COMPLETO - SEM ABREVIAR</label>
          <input type="text" id="alunos_nome" name="nome" placeholder="Maria de Souza">
        </div>
        <div class="campo">
          <label for="alunos_n_usp">N. USP</label>
          <input type="text" id="alunos_n_usp" name="n_usp" placeholder="1234567">
        </div>
        <div class="campo">
          <label for="alunos_programa">PROGRAMA</label>
          <input type="text" id="alunos_programa" name="programa" placeholder="Ciência da Computação">
        </div>
        <div class="campo">
          <label for="alunos_nivel">NÍVEL</label>
          <select id="alunos_nivel" name="nivel">
            <option value="">Selecione o nível</option>
            <option value="Mestrado">Mestrado</option>
            <option value="Doutorado">Doutorado</option>
          </select>
        </div>
        <div class="campo">
          <label for="alunos_tipo_auxilio">TIPO DE AUXÍLIO</label>
          <select id="alunos_tipo_auxilio" name="tipo_auxilio">
            <option value="">Selecione o tipo de auxílio</option>
            <option value="Participação em evento">Participação em evento</option>
            <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
        <div class="campo largura-2">
          <label for="alunos_email">E-MAIL</label>
          <input type="text" id="alunos_email" name="email" placeholder="maria@usp.br">
        </div>
        <div class="campo largura-2">
          <label for="alunos_evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input type="text" id="alunos_evento" name="evento" placeholder="SBBD">
        </div>
        <div class="campo largura-2">
          <label for="alunos_periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="alunos_periodo" name="periodo" placeholder="1 a 3 de outubro de 2025">
        </div>
        <div class="campo">
          <label for="alunos_cidade_evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="alunos_cidade_evento" name="cidade_evento" placeholder="São Paulo">
        </div>
        <div class="campo">
          <label for="alunos_estado_evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="alunos_estado_evento" name="estado_evento" placeholder="SP">
        </div>
        <div class="campo">
          <label for="alunos_pais_evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="alunos_pais_evento" name="pais_evento" placeholder="Brasil">
        </div>
        <div class="campo">
          <label for="alunos_link_evento">LINK DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="alunos_link_evento" name="link_evento" placeholder="https://sbbd.org.br/2025">
        </div>
        <div class="campo">
          <label for="alunos_valor">VALOR SOLICITADO (R$)</label>
          <input type="text" id="alunos_valor" name="valor" placeholder="R$ 1.500,00">
        </div>
        <div class="campo largura-2">
          <label for="alunos_detalhamento">DETALHAMENTO DO PEDIDO</label>
          <textarea id="alunos_detalhamento" name="detalhamento" rows="2" placeholder="Inscrição no evento e passagem aérea"></textarea>
        </div>
        <div class="campo">
          <label for="alunos_apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id="alunos_apresentacao" name="apresentacao">
            <option value="">Selecione uma opção</option>
            <option value="Pôster">Pôster</option>
            <option value="Apresentação oral">Apresentação oral</option>
            <option value="Outra">Outra</option>
            <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
          </select>
        </div>
      </div>

      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="bloco">
        <div class="campo">
          <label for="alunos_data_nascimento">DATA DE NASCIMENTO</label>
          <input type="text" id="alunos_data_nascimento" name="data_nascimento" placeholder="01/02/1980">
        </div>
        <div class="campo">
          <label for="alunos_logradouro">LOGRADOURO</label>
          <input type="text" id="alunos_logradouro" name="logradouro" placeholder="Rua do Anfiteatro">
        </div>
        <div class="campo">
          <label for="alunos_numero">NÚMERO</label>
          <input type="text" id="alunos_numero" name="numero" placeholder="181">
        </div>
        <div class="campo">
          <label for="alunos_complemento">COMPLEMENTO</label>
          <input type="text" id="alunos_complemento" name="complemento" placeholder="Sala 222">
        </div>
        <div class="campo">
          <label for="alunos_bairro">BAIRRO</label>
          <input type="text" id="alunos_bairro" name="bairro" placeholder="Butantã">
        </div>
        <div class="campo">
          <label for="alunos_cep">CEP</label>
          <input type="text" id="alunos_cep" name="cep" placeholder="05508-090">
        </div>
        <div class="campo">
          <label for="alunos_cidade">CIDADE</label>
          <input type="text" id="alunos_cidade" name="cidade" placeholder="São Paulo">
        </div>
        <div class="campo">
          <label for="alunos_estado">ESTADO</label>
          <input type="text" id="alunos_estado" name="estado" placeholder="SP">
        </div>
      </div>

      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="bloco cinco">
        <div class="campo">
          <label for="alunos_cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input type="text" id="alunos_cpf" name="cpf" placeholder="123.456.789-09">
        </div>
        <div class="campo">
          <label for="alunos_rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input type="text" id="alunos_rg" name="rg" placeholder="12.345.678-9">
        </div>
        <div class="campo">
          <label for="alunos_banco">NOME DO BANCO</label>
          <input type="text" id="alunos_banco" name="banco" placeholder="Banco do Brasil">
        </div>
        <div class="campo">
          <label for="alunos_agencia">NÚMERO DA AGÊNCIA</label>
          <input type="text" id="alunos_agencia" name="agencia" placeholder="1234">
        </div>
        <div class="campo">
          <label for="alunos_conta">NÚMERO DA CONTA</label>
          <input type="text" id="alunos_conta" name="conta" placeholder="12345-6">
        </div>
      </div>

      <button type="submit">Enviar solicitação</button>
    </form>
  </section>

  <section id="painel-docentes" hidden>
    <form id="form-docentes">
      <div class="erros"></div>

      <h2>SOLICITANTE E EVENTO</h2>
      <div class="bloco">
        <div class="campo largura-2">
          <label for="docentes_nome">NOME COMPLETO - SEM ABREVIAR</label>
          <input type="text" id="docentes_nome" name="nome" placeholder="Maria de Souza">
        </div>
        <div class="campo">
          <label for="docentes_n_usp">N. USP</label>
          <input type="text" id="docentes_n_usp" name="n_usp" placeholder="1234567">
        </div>
        <div class="campo">
          <label for="docentes_programa">PROGRAMA</label>
          <input type="text" id="docentes_programa" name="programa" placeholder="Ciência da Computação">
        </div>
        <div class="campo largura-2">
          <label for="docentes_email">E-MAIL</label>
          <input type="text" id="docentes_email" name="email" placeholder="maria@usp.br">
        </div>
        <div class="campo largura-2">
          <label for="docentes_evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input type="text" id="docentes_evento" name="evento" placeholder="SBBD">
        </div>
        <div class="campo largura-2">
          <label for="docentes_periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="docentes_periodo" name="periodo" placeholder="1 a 3 de outubro de 2025">
        </div>
        <div class="campo">
          <label for="docentes_cidade_evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="docentes_cidade_evento" name="cidade_evento" placeholder="São Paulo">
        </div>
        <div class="campo">
          <label for="docentes_estado_evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="docentes_estado_evento" name="estado_evento" placeholder="SP">
        </div>
        <div class="campo">
          <label for="docentes_pais_evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="docentes_pais_evento" name="pais_evento" placeholder="Brasil">
        </div>
        <div class="campo">
          <label for="docentes_link_evento">LINK DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="docentes_link_evento" name="link_evento" placeholder="https://sbbd.org.br/2025">
        </div>
        <div class="campo">
          <label for="docentes_valor">VALOR SOLICITADO (R$)</label>
          <input type="text" id="docentes_valor" name="valor" placeholder="R$ 1.500,00">
        </div>
        <div class="campo largura-2">
          <label for="docentes_detalhamento">DETALHAMENTO DO PEDIDO</label>
          <textarea id="docentes_detalhamento" name="detalhamento" rows="2" placeholder="Inscrição no evento e passagem aérea"></textarea>
        </div>
        <div class="campo">
          <label for="docentes_apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id="docentes_apresentacao" name="apresentacao">
            <option value="">Selecione uma opção</option>
            <option value="Pôster">Pôster</option>
            <option value="Apresentação oral">Apresentação oral</option>
            <option value="Outra">Outra</option>
            <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
          </select>
        </div>
      </div>

      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="bloco">
        <div class="campo">
          <label for="docentes_data_nascimento">DATA DE NASCIMENTO</label>
          <input type="text" id="docentes_data_nascimento" name="data_nascimento" placeholder="01/02/1980">
        </div>
        <div class="campo">
          <label for="docentes_logradouro">LOGRADOURO</label>
          <input type="text" id="docentes_logradouro" name="logradouro" placeholder="Rua do Anfiteatro">
        </div>
        <div class="campo">
          <label for="docentes_numero">NÚMERO</label>
          <input type="text" id="docentes_numero" name="numero" placeholder="181">
        </div>
        <div class="campo">
          <label for="docentes_complemento">COMPLEMENTO</label>
          <input type="text" id="docentes_complemento" name="complemento" placeholder="Sala 222">
        </div>
        <div class="campo">
          <label for="docentes_bairro">BAIRRO</label>
          <input type="text" id="docentes_bairro" name="bairro" placeholder="Butantã">
        </div>
        <div class="campo">
          <label for="docentes_cep">CEP</label>
          <input type="text" id="docentes_cep" name="cep" placeholder="05508-090">
        </div>
        <div class="campo">
          <label for="docentes_cidade">CIDADE</label>
          <input type="text" id="docentes_cidade" name="cidade" placeholder="São Paulo">
        </div>
        <div class="campo">
          <label for="docentes_estado">ESTADO</label>
          <input type="text" id="docentes_estado" name="estado" placeholder="SP">
        </div>
      </div>

      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="bloco cinco">
        <div class="campo">
          <label for="docentes_cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input type="text" id="docentes_cpf" name="cpf" placeholder="123.456.789-09">
        </div>
        <div class="campo">
          <label for="docentes_rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input type="text" id="docentes_rg" name="rg" placeholder="12.345.678-9">
        </div>
        <div class="campo">
          <label for="docentes_banco">NOME DO BANCO</label>
          <input type="text" id="docentes_banco" name="banco" placeholder="Banco do Brasil">
        </div>
        <div class="campo">
          <label for="docentes_agencia">NÚMERO DA AGÊNCIA</label>
          <input type="text" id="docentes_agencia" name="agencia" placeholder="1234">
        </div>
        <div class="campo">
          <label for="docentes_conta">NÚMERO DA CONTA</label>
          <input type="text" id="docentes_conta" name="conta" placeholder="12345-6">
        </div>
      </div>

      <button type="submit">Enviar solicitação</button>
    </form>
  </section>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
