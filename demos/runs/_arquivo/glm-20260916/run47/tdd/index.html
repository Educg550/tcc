<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro — Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="cabecalho">
  <div class="marca">
    <img class="logo" src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="nomes">
      <h1 class="universidade">Universidade de São Paulo</h1>
      <p class="programa">Pós-Graduação do IME — Solicitação de Auxílio Financeiro</p>
    </div>
  </div>
</header>

<main class="conteudo" id="conteudo">
  <nav class="abas">
    <button type="button" class="aba active" data-aba="alunos" aria-selected="true">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes" aria-selected="false">DOCENTES</button>
  </nav>

  <section class="painel" id="painel-alunos">
    <form class="formulario" id="form-alunos" data-aba="alunos" novalidate>
      <div class="erros" hidden></div>
      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo c4">
            <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input type="text" id="a-nome" name="nome_completo" placeholder="Ex.: Maria de Souza Silva">
          </div>
          <div class="campo c2">
            <label for="a-n-usp">N. USP</label>
            <input type="text" id="a-n-usp" name="n_usp" inputmode="numeric" placeholder="Ex.: 1234567">
          </div>
          <div class="campo c3">
            <label for="a-programa">PROGRAMA</label>
            <input type="text" id="a-programa" name="programa" placeholder="Ex.: Ciência da Computação">
          </div>
          <div class="campo c3">
            <label for="a-nivel">NÍVEL</label>
            <select id="a-nivel" name="nivel" placeholder="Ex.: Mestrado">
              <option value="">Selecione</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class="campo c3">
            <label for="a-tipo">TIPO DE AUXÍLIO</label>
            <select id="a-tipo" name="tipo_auxilio" placeholder="Ex.: Participação em evento">
              <option value="">Selecione</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>
          <div class="campo c4">
            <label for="a-email">E-MAIL</label>
            <input type="text" id="a-email" name="email" placeholder="Ex.: maria@usp.br">
          </div>
          <div class="campo c5">
            <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type="text" id="a-evento" name="nome_evento" placeholder="Ex.: Simpósio Brasileiro de Computação">
          </div>
          <div class="campo c4">
            <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="a-periodo" name="periodo_evento" placeholder="Ex.: 10 a 15 de março de 2025">
          </div>
          <div class="campo c3">
            <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="a-cidade-evento" name="cidade_evento" placeholder="Ex.: Rio de Janeiro">
          </div>
          <div class="campo c2">
            <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="a-estado-evento" name="estado_evento" placeholder="Ex.: RJ">
          </div>
          <div class="campo c3">
            <label for="a-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="a-pais-evento" name="pais_evento" placeholder="Ex.: Brasil">
          </div>
          <div class="campo c3">
            <label for="a-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="a-link" name="link_evento" placeholder="Ex.: www.evento.org.br">
          </div>
          <div class="campo c2">
            <label for="a-valor">VALOR SOLICITADO (R$)</label>
            <input type="text" id="a-valor" name="valor_solicitado" inputmode="numeric" placeholder="Ex.: 150000 = R$ 1.500,00">
          </div>
          <div class="campo c4">
            <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="a-detalhamento" name="detalhamento" rows="2" placeholder="Ex.: Passagem aérea e inscrição no evento"></textarea>
          </div>
          <div class="campo c3">
            <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="a-apresentacao" name="apresentacao" placeholder="Ex.: Pôster">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo c2">
            <label for="a-nascimento">DATA DE NASCIMENTO</label>
            <input type="text" id="a-nascimento" name="data_nascimento" inputmode="numeric" placeholder="Ex.: 01021980">
          </div>
          <div class="campo c4">
            <label for="a-logradouro">LOGRADOURO</label>
            <input type="text" id="a-logradouro" name="logradouro" placeholder="Ex.: Rua do Anfiteatro">
          </div>
          <div class="campo c2">
            <label for="a-numero">NÚMERO</label>
            <input type="text" id="a-numero" name="numero" placeholder="Ex.: 181">
          </div>
          <div class="campo c4">
            <label for="a-complemento">COMPLEMENTO</label>
            <input type="text" id="a-complemento" name="complemento" placeholder="Ex.: Sala 12">
          </div>
          <div class="campo c3">
            <label for="a-bairro">BAIRRO</label>
            <input type="text" id="a-bairro" name="bairro" placeholder="Ex.: Butantã">
          </div>
          <div class="campo c3">
            <label for="a-cep">CEP</label>
            <input type="text" id="a-cep" name="cep" inputmode="numeric" placeholder="Ex.: 05508090">
          </div>
          <div class="campo c4">
            <label for="a-cidade">CIDADE</label>
            <input type="text" id="a-cidade" name="cidade" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo c2">
            <label for="a-estado">ESTADO</label>
            <input type="text" id="a-estado" name="estado" placeholder="Ex.: SP">
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo c4">
            <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="a-cpf" name="cpf" inputmode="numeric" placeholder="Ex.: 12345678909">
          </div>
          <div class="campo c4">
            <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="a-rg" name="rg_rnm" placeholder="Ex.: 12.345.678-9">
          </div>
          <div class="campo c4">
            <label for="a-banco">NOME DO BANCO</label>
            <input type="text" id="a-banco" name="banco" placeholder="Ex.: Banco do Brasil">
          </div>
          <div class="campo c3">
            <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
            <input type="text" id="a-agencia" name="agencia" inputmode="numeric" placeholder="Ex.: 1234">
          </div>
          <div class="campo c3">
            <label for="a-conta">NÚMERO DA CONTA</label>
            <input type="text" id="a-conta" name="conta" placeholder="Ex.: 98765-4">
          </div>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>

  <section class="painel" id="painel-docentes" hidden>
    <form class="formulario" id="form-docentes" data-aba="docentes" novalidate>
      <div class="erros" hidden></div>
      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo c4">
            <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input type="text" id="d-nome" name="nome_completo" placeholder="Ex.: Maria de Souza Silva">
          </div>
          <div class="campo c2">
            <label for="d-n-usp">N. USP</label>
            <input type="text" id="d-n-usp" name="n_usp" inputmode="numeric" placeholder="Ex.: 1234567">
          </div>
          <div class="campo c6">
            <label for="d-programa">PROGRAMA</label>
            <input type="text" id="d-programa" name="programa" placeholder="Ex.: Ciência da Computação">
          </div>
          <div class="campo c4">
            <label for="d-email">E-MAIL</label>
            <input type="text" id="d-email" name="email" placeholder="Ex.: maria@usp.br">
          </div>
          <div class="campo c8">
            <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type="text" id="d-evento" name="nome_evento" placeholder="Ex.: Banca de defesa de mestrado">
          </div>
          <div class="campo c4">
            <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="d-periodo" name="periodo_evento" placeholder="Ex.: 10 a 15 de março de 2025">
          </div>
          <div class="campo c3">
            <label for="d-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="d-cidade-evento" name="cidade_evento" placeholder="Ex.: Rio de Janeiro">
          </div>
          <div class="campo c2">
            <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="d-estado-evento" name="estado_evento" placeholder="Ex.: RJ">
          </div>
          <div class="campo c3">
            <label for="d-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="d-pais-evento" name="pais_evento" placeholder="Ex.: Brasil">
          </div>
          <div class="campo c3">
            <label for="d-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input type="text" id="d-link" name="link_evento" placeholder="Ex.: www.evento.org.br">
          </div>
          <div class="campo c2">
            <label for="d-valor">VALOR SOLICITADO (R$)</label>
            <input type="text" id="d-valor" name="valor_solicitado" inputmode="numeric" placeholder="Ex.: 150000 = R$ 1.500,00">
          </div>
          <div class="campo c4">
            <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="d-detalhamento" name="detalhamento" rows="2" placeholder="Ex.: Passagem aérea e inscrição no evento"></textarea>
          </div>
          <div class="campo c3">
            <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="d-apresentacao" name="apresentacao" placeholder="Ex.: Pôster">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo c2">
            <label for="d-nascimento">DATA DE NASCIMENTO</label>
            <input type="text" id="d-nascimento" name="data_nascimento" inputmode="numeric" placeholder="Ex.: 01021980">
          </div>
          <div class="campo c4">
            <label for="d-logradouro">LOGRADOURO</label>
            <input type="text" id="d-logradouro" name="logradouro" placeholder="Ex.: Rua do Anfiteatro">
          </div>
          <div class="campo c2">
            <label for="d-numero">NÚMERO</label>
            <input type="text" id="d-numero" name="numero" placeholder="Ex.: 181">
          </div>
          <div class="campo c4">
            <label for="d-complemento">COMPLEMENTO</label>
            <input type="text" id="d-complemento" name="complemento" placeholder="Ex.: Sala 12">
          </div>
          <div class="campo c3">
            <label for="d-bairro">BAIRRO</label>
            <input type="text" id="d-bairro" name="bairro" placeholder="Ex.: Butantã">
          </div>
          <div class="campo c3">
            <label for="d-cep">CEP</label>
            <input type="text" id="d-cep" name="cep" inputmode="numeric" placeholder="Ex.: 05508090">
          </div>
          <div class="campo c4">
            <label for="d-cidade">CIDADE</label>
            <input type="text" id="d-cidade" name="cidade" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo c2">
            <label for="d-estado">ESTADO</label>
            <input type="text" id="d-estado" name="estado" placeholder="Ex.: SP">
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo c4">
            <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="d-cpf" name="cpf" inputmode="numeric" placeholder="Ex.: 12345678909">
          </div>
          <div class="campo c4">
            <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type="text" id="d-rg" name="rg_rnm" placeholder="Ex.: 12.345.678-9">
          </div>
          <div class="campo c4">
            <label for="d-banco">NOME DO BANCO</label>
            <input type="text" id="d-banco" name="banco" placeholder="Ex.: Banco do Brasil">
          </div>
          <div class="campo c3">
            <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
            <input type="text" id="d-agencia" name="agencia" inputmode="numeric" placeholder="Ex.: 1234">
          </div>
          <div class="campo c3">
            <label for="d-conta">NÚMERO DA CONTA</label>
            <input type="text" id="d-conta" name="conta" placeholder="Ex.: 98765-4">
          </div>
        </div>
      </fieldset>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </section>
</main>

<section class="confirmacao" id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <pre class="oficio" id="oficio"></pre>
</section>

<script src="/app.js"></script>
</body>
</html>
