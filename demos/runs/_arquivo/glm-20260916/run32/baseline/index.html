<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<div class='barra-topo'></div>
<header>
<img src='assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
<div class='titulo'>
<h1>Universidade de São Paulo</h1>
<p class='programa'>Pós-Graduação do Instituto de Matemática e Estatística</p>
</div>
</header>
<main>
<div id='solicitacao'>
<nav class='abas'>
<button type='button' class='aba ativa' data-aba='ALUNOS'>ALUNOS</button>
<button type='button' class='aba' data-aba='DOCENTES'>DOCENTES</button>
</nav>
<div id='formularios'>

<form data-aba='ALUNOS' novalidate>
<div class='erros' hidden></div>
<section class='bloco'>
<h2>SOLICITANTE E EVENTO</h2>
<div class='grade'>
<div class='campo c4'>
<label for='a-nome'>NOME COMPLETO - SEM ABREVIAR</label>
<input id='a-nome' name='nome' placeholder='Maria Souza da Silva'>
</div>
<div class='campo c1'>
<label for='a-n-usp'>N. USP</label>
<input id='a-n-usp' name='n_usp' inputmode='numeric' placeholder='1234567'>
</div>
<div class='campo c3'>
<label for='a-programa'>PROGRAMA</label>
<input id='a-programa' name='programa' placeholder='Ciência da Computação'>
</div>
<div class='campo c2'>
<label for='a-nivel'>NÍVEL</label>
<select id='a-nivel' name='nivel'>
<option value=''>Escolha o nível</option>
<option>Mestrado</option>
<option>Doutorado</option>
</select>
</div>
<div class='campo c3'>
<label for='a-tipo'>TIPO DE AUXÍLIO</label>
<select id='a-tipo' name='tipo_auxilio'>
<option value=''>Escolha o tipo de auxílio</option>
<option>Participação em evento</option>
<option>Banca de exame ou defesa</option>
<option>Outro</option>
</select>
</div>
<div class='campo c4'>
<label for='a-email'>E-MAIL</label>
<input id='a-email' name='email' placeholder='maria.silva@usp.br'>
</div>
<div class='campo c3'>
<label for='a-valor'>VALOR SOLICITADO (R$)</label>
<input id='a-valor' name='valor' inputmode='numeric' data-formato='valor' placeholder='R$ 1.500,00'>
</div>
<div class='campo c4'>
<label for='a-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
<input id='a-evento' name='evento' placeholder='Congresso da SBC'>
</div>
<div class='campo c3'>
<label for='a-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
<input id='a-periodo' name='periodo' placeholder='10/07/2025 a 14/07/2025'>
</div>
<div class='campo c3'>
<label for='a-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
<input id='a-cidade-evento' name='cidade_evento' placeholder='Rio de Janeiro'>
</div>
<div class='campo c2'>
<label for='a-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
<input id='a-estado-evento' name='estado_evento' placeholder='RJ'>
</div>
<div class='campo c2'>
<label for='a-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
<input id='a-pais-evento' name='pais_evento' placeholder='Brasil'>
</div>
<div class='campo c3'>
<label for='a-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
<input id='a-link' name='link_evento' placeholder='https://www.evento.org.br'>
</div>
<div class='campo c3'>
<label for='a-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
<select id='a-apresentacao' name='apresentacao'>
<option value=''>Escolha uma opção</option>
<option>Pôster</option>
<option>Apresentação oral</option>
<option>Outra</option>
<option>Não irá apresentar trabalho</option>
</select>
</div>
<div class='campo c10'>
<label for='a-detalhamento'>DETALHAMENTO DO PEDIDO</label>
<textarea id='a-detalhamento' name='detalhamento' rows='2' placeholder='Inscrição no evento e passagem aérea de ida e volta'></textarea>
</div>
</div>
</section>
<section class='bloco'>
<h2>ENDEREÇO DO SOLICITANTE</h2>
<div class='grade'>
<div class='campo c2'>
<label for='a-nascimento'>DATA DE NASCIMENTO</label>
<input id='a-nascimento' name='data_nascimento' inputmode='numeric' data-formato='data' placeholder='01/02/1980'>
</div>
<div class='campo c4'>
<label for='a-logradouro'>LOGRADOURO</label>
<input id='a-logradouro' name='logradouro' placeholder='Rua do Matão'>
</div>
<div class='campo c2'>
<label for='a-numero'>NÚMERO</label>
<input id='a-numero' name='numero' placeholder='1010'>
</div>
<div class='campo c2'>
<label for='a-bairro'>BAIRRO</label>
<input id='a-bairro' name='bairro' placeholder='Cidade Universitária'>
</div>
<div class='campo c3'>
<label for='a-complemento'>COMPLEMENTO</label>
<input id='a-complemento' name='complemento' placeholder='Apto 42'>
</div>
<div class='campo c2'>
<label for='a-cep'>CEP</label>
<input id='a-cep' name='cep' inputmode='numeric' data-formato='cep' placeholder='05508-090'>
</div>
<div class='campo c3'>
<label for='a-cidade'>CIDADE</label>
<input id='a-cidade' name='cidade' placeholder='São Paulo'>
</div>
<div class='campo c2'>
<label for='a-estado'>ESTADO</label>
<input id='a-estado' name='estado' placeholder='SP'>
</div>
</div>
</section>
<section class='bloco'>
<h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
<div class='grade'>
<div class='campo c3'>
<label for='a-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
<input id='a-cpf' name='cpf' inputmode='numeric' data-formato='cpf' placeholder='123.456.789-09'>
</div>
<div class='campo c3'>
<label for='a-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
<input id='a-rg' name='rg' placeholder='12.345.678-9'>
</div>
<div class='campo c4'>
<label for='a-banco'>NOME DO BANCO</label>
<input id='a-banco' name='banco' placeholder='Banco do Brasil'>
</div>
<div class='campo c2'>
<label for='a-agencia'>NÚMERO DA AGÊNCIA</label>
<input id='a-agencia' name='agencia' inputmode='numeric' placeholder='1234'>
</div>
<div class='campo c3'>
<label for='a-conta'>NÚMERO DA CONTA</label>
<input id='a-conta' name='conta' placeholder='12345-6'>
</div>
</div>
</section>
<div class='acoes'>
<button type='submit'>Enviar solicitação</button>
</div>
</form>

<form data-aba='DOCENTES' novalidate hidden>
<div class='erros' hidden></div>
<section class='bloco'>
<h2>SOLICITANTE E EVENTO</h2>
<div class='grade'>
<div class='campo c4'>
<label for='d-nome'>NOME COMPLETO - SEM ABREVIAR</label>
<input id='d-nome' name='nome' placeholder='João Almeida Ferraz'>
</div>
<div class='campo c1'>
<label for='d-n-usp'>N. USP</label>
<input id='d-n-usp' name='n_usp' inputmode='numeric' placeholder='1234567'>
</div>
<div class='campo c5'>
<label for='d-programa'>PROGRAMA</label>
<input id='d-programa' name='programa' placeholder='Estatística'>
</div>
<div class='campo c5'>
<label for='d-email'>E-MAIL</label>
<input id='d-email' name='email' placeholder='joao.ferraz@usp.br'>
</div>
<div class='campo c5'>
<label for='d-valor'>VALOR SOLICITADO (R$)</label>
<input id='d-valor' name='valor' inputmode='numeric' data-formato='valor' placeholder='R$ 1.500,00'>
</div>
<div class='campo c4'>
<label for='d-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
<input id='d-evento' name='evento' placeholder='Banca de defesa de mestrado'>
</div>
<div class='campo c3'>
<label for='d-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
<input id='d-periodo' name='periodo' placeholder='10/07/2025 a 14/07/2025'>
</div>
<div class='campo c3'>
<label for='d-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
<input id='d-cidade-evento' name='cidade_evento' placeholder='Campinas'>
</div>
<div class='campo c2'>
<label for='d-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
<input id='d-estado-evento' name='estado_evento' placeholder='SP'>
</div>
<div class='campo c2'>
<label for='d-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
<input id='d-pais-evento' name='pais_evento' placeholder='Brasil'>
</div>
<div class='campo c3'>
<label for='d-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
<input id='d-link' name='link_evento' placeholder='https://www.evento.org.br'>
</div>
<div class='campo c3'>
<label for='d-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
<select id='d-apresentacao' name='apresentacao'>
<option value=''>Escolha uma opção</option>
<option>Pôster</option>
<option>Apresentação oral</option>
<option>Outra</option>
<option>Não irá apresentar trabalho</option>
</select>
</div>
<div class='campo c10'>
<label for='d-detalhamento'>DETALHAMENTO DO PEDIDO</label>
<textarea id='d-detalhamento' name='detalhamento' rows='2' placeholder='Passagem rodoviária e diárias para a banca'></textarea>
</div>
</div>
</section>
<section class='bloco'>
<h2>ENDEREÇO DO SOLICITANTE</h2>
<div class='grade'>
<div class='campo c2'>
<label for='d-nascimento'>DATA DE NASCIMENTO</label>
<input id='d-nascimento' name='data_nascimento' inputmode='numeric' data-formato='data' placeholder='01/02/1980'>
</div>
<div class='campo c4'>
<label for='d-logradouro'>LOGRADOURO</label>
<input id='d-logradouro' name='logradouro' placeholder='Rua do Matão'>
</div>
<div class='campo c2'>
<label for='d-numero'>NÚMERO</label>
<input id='d-numero' name='numero' placeholder='1010'>
</div>
<div class='campo c2'>
<label for='d-bairro'>BAIRRO</label>
<input id='d-bairro' name='bairro' placeholder='Cidade Universitária'>
</div>
<div class='campo c3'>
<label for='d-complemento'>COMPLEMENTO</label>
<input id='d-complemento' name='complemento' placeholder='Sala 12'>
</div>
<div class='campo c2'>
<label for='d-cep'>CEP</label>
<input id='d-cep' name='cep' inputmode='numeric' data-formato='cep' placeholder='05508-090'>
</div>
<div class='campo c3'>
<label for='d-cidade'>CIDADE</label>
<input id='d-cidade' name='cidade' placeholder='São Paulo'>
</div>
<div class='campo c2'>
<label for='d-estado'>ESTADO</label>
<input id='d-estado' name='estado' placeholder='SP'>
</div>
</div>
</section>
<section class='bloco'>
<h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
<div class='grade'>
<div class='campo c3'>
<label for='d-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
<input id='d-cpf' name='cpf' inputmode='numeric' data-formato='cpf' placeholder='123.456.789-09'>
</div>
<div class='campo c3'>
<label for='d-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
<input id='d-rg' name='rg' placeholder='12.345.678-9'>
</div>
<div class='campo c4'>
<label for='d-banco'>NOME DO BANCO</label>
<input id='d-banco' name='banco' placeholder='Banco do Brasil'>
</div>
<div class='campo c2'>
<label for='d-agencia'>NÚMERO DA AGÊNCIA</label>
<input id='d-agencia' name='agencia' inputmode='numeric' placeholder='1234'>
</div>
<div class='campo c3'>
<label for='d-conta'>NÚMERO DA CONTA</label>
<input id='d-conta' name='conta' placeholder='12345-6'>
</div>
</div>
</section>
<div class='acoes'>
<button type='submit'>Enviar solicitação</button>
</div>
</form>

</div>
</div>
<section id='confirmacao' hidden>
<h2>Solicitação registrada</h2>
<pre id='oficio'></pre>
</section>
</main>
<script src='app.js'></script>
</body>
</html>
