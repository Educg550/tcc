<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro — Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="cabecalho-texto">
      <p class="universidade">Universidade de São Paulo</p>
      <p class="programa">Pós-Graduação do IME-USP</p>
    </div>
  </header>

  <main id="formulario">
    <nav class="abas" role="tablist" aria-label="Tipo de solicitante">
      <button type="button" class="aba ativa" id="aba-alunos" role="tab" aria-selected="true">ALUNOS</button>
      <button type="button" class="aba" id="aba-docentes" role="tab" aria-selected="false">DOCENTES</button>
    </nav>
    <form id="form-solicitacao" role="tabpanel" novalidate></form>
  </main>

  <main id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio"></pre>
  </main>

  <script src="/app.js"></script>
</body>
</html>
