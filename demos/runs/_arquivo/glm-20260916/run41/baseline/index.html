<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel='stylesheet' href='/style.css'>
</head>
<body>

<header class='cabecalho'>
  <img class='logo' src='/assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
  <div>
    <h1>Universidade de São Paulo</h1>
    <p class='programa'>Pós-Graduação do IME-USP</p>
  </div>
</header>

<div id='formularios'>
  <nav class='abas' aria-label='Tipo de solicitante'>
    <button type='button' class='aba ativa' id='aba-alunos' data-painel='painel-alunos' role='tab' aria-selected='true'>ALUNOS</button>
    <button type='button' class='aba' id='aba-docentes' data-painel='painel-docentes' role='tab' aria-selected='false'>DOCENTES</button>
  </nav>

  <section class='painel ativa' id='painel-alunos' role='tabpanel' aria-labelledby='aba-alunos'>
    <form class='solicitacao' data-origem='alunos' novalidate>
      <div class='erros oculto' role='alert'></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class='grade grade-4'>
          <div class='campo c2'>
            <label for='a-nome'>NOME COMPLETO - SEM ABREVIAR</label>
            <input type='text' id='a-nome' name='nome' placeholder='Ex.: Maria de Souza Oliveira'>
          </div>
          <div class='campo'>
            <label for='a-nusp'>N. USP</label>
            <input type='text' id='a-nusp' name='nusp' inputmode='numeric' placeholder='Ex.: 1234567'>
          </div>
          <div class='campo'>
            <label for='a-programa'>PROGRAMA</label>
            <input type='text' id='a-programa' name='programa' placeholder='Ex.: Ciência da Computação'>
          </div>
          <div class='campo'>
            <label for='a-nivel'>NÍVEL</label>
            <select id='a-nivel' name='nivel'>
              <option value=''>Selecione…</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class='campo'>
            <label for='a-tipo'>TIPO DE AUXÍLIO</label>
            <select id='a-tipo' name='tipo_auxilio'>
              <option value=''>Selecione…</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>
          <div class='campo c2'>
            <label for='a-email'>E-MAIL</label>
            <input type='text' id='a-email' name='email' placeholder='Ex.: maria.oliveira@usp.br'>
          </div>
          <div class='campo c2'>
            <label for='a-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type='text' id='a-evento' name='evento' placeholder='Ex.: Simpósio Brasileiro de Engenharia de Software'>
          </div>
          <div class='campo c2'>
            <label for='a-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='a-periodo' name='periodo' placeholder='Ex.: 10 a 12 de setembro de 2025'>
          </div>
          <div class='campo'>
            <label for='a-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='a-cidade-evento' name='cidade_evento' placeholder='Ex.: Salvador'>
          </div>
          <div class='campo'>
            <label for='a-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='a-estado-evento' name='estado_evento' placeholder='Ex.: Bahia'>
          </div>
          <div class='campo'>
            <label for='a-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='a-pais-evento' name='pais_evento' placeholder='Ex.: Brasil'>
          </div>
          <div class='campo'>
            <label for='a-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='a-link' name='link' placeholder='Ex.: https://www.evento.com.br (opcional)'>
          </div>
          <div class='campo'>
            <label for='a-valor'>VALOR SOLICITADO (R$)</label>
            <input type='text' id='a-valor' name='valor' data-formato='moeda' inputmode='numeric' placeholder='Ex.: 150000'>
          </div>
          <div class='campo c3'>
            <label for='a-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id='a-apresentacao' name='apresentacao'>
              <option value=''>Selecione…</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class='campo c4'>
            <label for='a-detalhamento'>DETALHAMENTO DO PEDIDO</label>
            <textarea id='a-detalhamento' name='detalhamento' rows='2' placeholder='Ex.: Inscrição no evento e passagem aérea de ida e volta'></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class='grade grade-4'>
          <div class='campo'>
            <label for='a-nascimento'>DATA DE NASCIMENTO</label>
            <input type='text' id='a-nascimento' name='nascimento' data-formato='data' inputmode='numeric' placeholder='Ex.: 01021980'>
          </div>
          <div class='campo'>
            <label for='a-logradouro'>LOGRADOURO</label>
            <input type='text' id='a-logradouro' name='logradouro' placeholder='Ex.: Rua do Matão'>
          </div>
          <div class='campo'>
            <label for='a-numero'>NÚMERO</label>
            <input type='text' id='a-numero' name='numero' placeholder='Ex.: 1010'>
          </div>
          <div class='campo'>
            <label for='a-complemento'>COMPLEMENTO</label>
            <input type='text' id='a-complemento' name='complemento' placeholder='Ex.: Bloco B, sala 214 (opcional)'>
          </div>
          <div class='campo'>
            <label for='a-bairro'>BAIRRO</label>
            <input type='text' id='a-bairro' name='bairro' placeholder='Ex.: Cidade Universitária'>
          </div>
          <div class='campo'>
            <label for='a-cep'>CEP</label>
            <input type='text' id='a-cep' name='cep' data-formato='cep' inputmode='numeric' placeholder='Ex.: 05508090'>
          </div>
          <div class='campo'>
            <label for='a-cidade'>CIDADE</label>
            <input type='text' id='a-cidade' name='cidade' placeholder='Ex.: São Paulo'>
          </div>
          <div class='campo'>
            <label for='a-estado'>ESTADO</label>
            <input type='text' id='a-estado' name='estado' placeholder='Ex.: SP'>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class='grade grade-5'>
          <div class='campo'>
            <label for='a-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type='text' id='a-cpf' name='cpf' data-formato='cpf' inputmode='numeric' placeholder='Ex.: 12345678909'>
          </div>
          <div class='campo'>
            <label for='a-rgrnm'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type='text' id='a-rgrnm' name='rgrnm' placeholder='Ex.: 12.345.678-9'>
          </div>
          <div class='campo'>
            <label for='a-banco'>NOME DO BANCO</label>
            <input type='text' id='a-banco' name='banco' placeholder='Ex.: Banco do Brasil'>
          </div>
          <div class='campo'>
            <label for='a-agencia'>NÚMERO DA AGÊNCIA</label>
            <input type='text' id='a-agencia' name='agencia' inputmode='numeric' placeholder='Ex.: 1234'>
          </div>
          <div class='campo'>
            <label for='a-conta'>NÚMERO DA CONTA</label>
            <input type='text' id='a-conta' name='conta' placeholder='Ex.: 12345-6'>
          </div>
        </div>
      </fieldset>

      <div class='acoes'>
        <button type='submit' class='enviar'>Enviar solicitação</button>
      </div>
    </form>
  </section>

  <section class='painel' id='painel-docentes' role='tabpanel' aria-labelledby='aba-docentes'>
    <form class='solicitacao' data-origem='docentes' novalidate>
      <div class='erros oculto' role='alert'></div>

      <fieldset>
        <legend>SOLICITANTE E EVENTO</legend>
        <div class='grade grade-4'>
          <div class='campo c2'>
            <label for='d-nome'>NOME COMPLETO - SEM ABREVIAR</label>
            <input type='text' id='d-nome' name='nome' placeholder='Ex.: João Cardoso Pereira'>
          </div>
          <div class='campo'>
            <label for='d-nusp'>N. USP</label>
            <input type='text' id='d-nusp' name='nusp' inputmode='numeric' placeholder='Ex.: 1234567'>
          </div>
          <div class='campo'>
            <label for='d-programa'>PROGRAMA</label>
            <input type='text' id='d-programa' name='programa' placeholder='Ex.: Ciência da Computação'>
          </div>
          <div class='campo c2'>
            <label for='d-email'>E-MAIL</label>
            <input type='text' id='d-email' name='email' placeholder='Ex.: joao.pereira@usp.br'>
          </div>
          <div class='campo c2'>
            <label for='d-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input type='text' id='d-evento' name='evento' placeholder='Ex.: Banca de defesa de doutorado de Maria Souza'>
          </div>
          <div class='campo c2'>
            <label for='d-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='d-periodo' name='periodo' placeholder='Ex.: 10 a 12 de setembro de 2025'>
          </div>
          <div class='campo'>
            <label for='d-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='d-cidade-evento' name='cidade_evento' placeholder='Ex.: Salvador'>
          </div>
          <div class='campo'>
            <label for='d-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='d-estado-evento' name='estado_evento' placeholder='Ex.: Bahia'>
          </div>
          <div class='campo'>
            <label for='d-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='d-pais-evento' name='pais_evento' placeholder='Ex.: Brasil'>
          </div>
          <div class='campo'>
            <label for='d-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
            <input type='text' id='d-link' name='link' placeholder='Ex.: https://www.evento.com.br (opcional)'>
          </div>
          <div class='campo'>
            <label for='d-valor'>VALOR SOLICITADO (R$)</label>
            <input type='text' id='d-valor' name='valor' data-formato='moeda' inputmode='numeric' placeholder='Ex.: 150000'>
          </div>
          <div class='campo'>
            <label for='d-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id='d-apresentacao' name='apresentacao'>
              <option value=''>Selecione…</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class='campo c4'>
            <label for='d-detalhamento'>DETALHAMENTO DO PEDIDO</label>
            <textarea id='d-detalhamento' name='detalhamento' rows='2' placeholder='Ex.: Passagem aérea de ida e volta para a banca'></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class='grade grade-4'>
          <div class='campo'>
            <label for='d-nascimento'>DATA DE NASCIMENTO</label>
            <input type='text' id='d-nascimento' name='nascimento' data-formato='data' inputmode='numeric' placeholder='Ex.: 01021980'>
          </div>
          <div class='campo'>
            <label for='d-logradouro'>LOGRADOURO</label>
            <input type='text' id='d-logradouro' name='logradouro' placeholder='Ex.: Rua do Matão'>
          </div>
          <div class='campo'>
            <label for='d-numero'>NÚMERO</label>
            <input type='text' id='d-numero' name='numero' placeholder='Ex.: 1010'>
          </div>
          <div class='campo'>
            <label for='d-complemento'>COMPLEMENTO</label>
            <input type='text' id='d-complemento' name='complemento' placeholder='Ex.: Bloco B, sala 214 (opcional)'>
          </div>
          <div class='campo'>
            <label for='d-bairro'>BAIRRO</label>
            <input type='text' id='d-bairro' name='bairro' placeholder='Ex.: Cidade Universitária'>
          </div>
          <div class='campo'>
            <label for='d-cep'>CEP</label>
            <input type='text' id='d-cep' name='cep' data-formato='cep' inputmode='numeric' placeholder='Ex.: 05508090'>
          </div>
          <div class='campo'>
            <label for='d-cidade'>CIDADE</label>
            <input type='text' id='d-cidade' name='cidade' placeholder='Ex.: São Paulo'>
          </div>
          <div class='campo'>
            <label for='d-estado'>ESTADO</label>
            <input type='text' id='d-estado' name='estado' placeholder='Ex.: SP'>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class='grade grade-5'>
          <div class='campo'>
            <label for='d-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type='text' id='d-cpf' name='cpf' data-formato='cpf' inputmode='numeric' placeholder='Ex.: 12345678909'>
          </div>
          <div class='campo'>
            <label for='d-rgrnm'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input type='text' id='d-rgrnm' name='rgrnm' placeholder='Ex.: 12.345.678-9'>
          </div>
          <div class='campo'>
            <label for='d-banco'>NOME DO BANCO</label>
            <input type='text' id='d-banco' name='banco' placeholder='Ex.: Banco do Brasil'>
          </div>
          <div class='campo'>
            <label for='d-agencia'>NÚMERO DA AGÊNCIA</label>
            <input type='text' id='d-agencia' name='agencia' inputmode='numeric' placeholder='Ex.: 1234'>
          </div>
          <div class='campo'>
            <label for='d-conta'>NÚMERO DA CONTA</label>
            <input type='text' id='d-conta' name='conta' placeholder='Ex.: 12345-6'>
          </div>
        </div>
      </fieldset>

      <div class='acoes'>
        <button type='submit' class='enviar'>Enviar solicitação</button>
      </div>
    </form>
  </section>
</div>

<section id='confirmacao' class='oculto'>
  <h2>Solicitação registrada</h2>
  <pre id='oficio'></pre>
</section>

<script src='/app.js'></script>
</body>
</html>
