<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<header class='cabecalho'>
  <img class='logo' src='assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
  <div>
    <h1 class='nome-ies'>Universidade de São Paulo</h1>
    <p class='nome-programa'>Pós-Graduação do IME-USP</p>
  </div>
</header>
<main>
<section id='formulario-view'>
  <nav class='abas'>
    <button type='button' class='aba ativa' id='aba-alunos' data-alvo='form-alunos'>ALUNOS</button>
    <button type='button' class='aba' id='aba-docentes' data-alvo='form-docentes'>DOCENTES</button>
  </nav>
  <form id='form-alunos' class='form' novalidate>
    <div class='erros'></div>
    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class='grade'>
        <div class='campo span-3'>
          <label for='a-nome'>NOME COMPLETO - SEM ABREVIAR</label>
          <input type='text' id='a-nome' name='NOME COMPLETO - SEM ABREVIAR' placeholder='Ex.: Maria de Souza Silva'>
        </div>
        <div class='campo'>
          <label for='a-nusp'>N. USP</label>
          <input type='text' id='a-nusp' name='N. USP' placeholder='Ex.: 1234567'>
        </div>
        <div class='campo span-2'>
          <label for='a-programa'>PROGRAMA</label>
          <input type='text' id='a-programa' name='PROGRAMA' placeholder='Ex.: Matemática'>
        </div>
        <div class='campo'>
          <label for='a-nivel'>NÍVEL</label>
          <select id='a-nivel' name='NÍVEL'>
            <option value=''>Selecione...</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select>
        </div>
        <div class='campo span-2'>
          <label for='a-tipo'>TIPO DE AUXÍLIO</label>
          <select id='a-tipo' name='TIPO DE AUXÍLIO'>
            <option value=''>Selecione...</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select>
        </div>
        <div class='campo span-3'>
          <label for='a-email'>E-MAIL</label>
          <input type='text' id='a-email' name='E-MAIL' placeholder='Ex.: maria.silva@usp.br'>
        </div>
        <div class='campo span-3'>
          <label for='a-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input type='text' id='a-evento' name='NOME DO EVENTO / BANCA DE EXAME OU DEFESA' placeholder='Ex.: Congresso Brasileiro de Matemática'>
        </div>
        <div class='campo span-3'>
          <label for='a-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input type='text' id='a-periodo' name='PERÍODO DO EVENTO, EXAME OU DEFESA' placeholder='Ex.: 10/08/2025 a 14/08/2025'>
        </div>
        <div class='campo span-2'>
          <label for='a-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input type='text' id='a-cidade-evento' name='CIDADE DO EVENTO, EXAME OU DEFESA' placeholder='Ex.: Salvador'>
        </div>
        <div class='campo'>
          <label for='a-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input type='text' id='a-estado-evento' name='ESTADO DO EVENTO, EXAME OU DEFESA' placeholder='Ex.: BA'>
        </div>
        <div class='campo'>
          <label for='a-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input type='text' id='a-pais-evento' name='PAÍS DO EVENTO, EXAME OU DEFESA' placeholder='Ex.: Brasil'>
        </div>
        <div class='campo span-2'>
          <label for='a-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
          <input type='text' id='a-link' name='LINK DO EVENTO, EXAME OU DEFESA' placeholder='Ex.: https://cbm2025.org.br'>
        </div>
        <div class='campo span-2'>
          <label for='a-valor'>VALOR SOLICITADO (R$)</label>
          <input type='text' id='a-valor' name='VALOR SOLICITADO (R$)' placeholder='Ex.: 150000' data-formato='valor'>
        </div>
        <div class='campo span-4'>
          <label for='a-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id='a-apresentacao' name='IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?'>
            <option value=''>Selecione...</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </div>
        <div class='campo span-6'>
          <label for='a-detalhamento'>DETALHAMENTO DO PEDIDO</label>
          <textarea id='a-detalhamento' name='DETALHAMENTO DO PEDIDO' rows='2' placeholder='Ex.: Passagem aérea e inscrição no evento'></textarea>
        </div>
      </div>
    </fieldset>
    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class='grade'>
        <div class='campo'>
          <label for='a-nascimento'>DATA DE NASCIMENTO</label>
          <input type='text' id='a-nascimento' name='DATA DE NASCIMENTO' placeholder='Ex.: 01021980' data-formato='data'>
        </div>
        <div class='campo span-2'>
          <label for='a-logradouro'>LOGRADOURO</label>
          <input type='text' id='a-logradouro' name='LOGRADOURO' placeholder='Ex.: Rua do Matão'>
        </div>
        <div class='campo'>
          <label for='a-numero'>NÚMERO</label>
          <input type='text' id='a-numero' name='NÚMERO' placeholder='Ex.: 1010'>
        </div>
        <div class='campo span-2'>
          <label for='a-complemento'>COMPLEMENTO</label>
          <input type='text' id='a-complemento' name='COMPLEMENTO' placeholder='Ex.: Sala 245'>
        </div>
        <div class='campo'>
          <label for='a-bairro'>BAIRRO</label>
          <input type='text' id='a-bairro' name='BAIRRO' placeholder='Ex.: Cidade Universitária'>
        </div>
        <div class='campo'>
          <label for='a-cep'>CEP</label>
          <input type='text' id='a-cep' name='CEP' placeholder='Ex.: 05508090' data-formato='cep'>
        </div>
        <div class='campo span-3'>
          <label for='a-cidade'>CIDADE</label>
          <input type='text' id='a-cidade' name='CIDADE' placeholder='Ex.: São Paulo'>
        </div>
        <div class='campo'>
          <label for='a-estado'>ESTADO</label>
          <input type='text' id='a-estado' name='ESTADO' placeholder='Ex.: SP'>
        </div>
      </div>
    </fieldset>
    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class='grade'>
        <div class='campo'>
          <label for='a-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input type='text' id='a-cpf' name='CPF (SEPARADOS POR PONTOS E TRAÇO)' placeholder='Ex.: 12345678909' data-formato='cpf'>
        </div>
        <div class='campo span-2'>
          <label for='a-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input type='text' id='a-rg' name='RG / RNM (SEPARADOS POR PONTOS E TRAÇO)' placeholder='Ex.: 12.345.678-9'>
        </div>
        <div class='campo'>
          <label for='a-banco'>NOME DO BANCO</label>
          <input type='text' id='a-banco' name='NOME DO BANCO' placeholder='Ex.: Banco do Brasil'>
        </div>
        <div class='campo'>
          <label for='a-agencia'>NÚMERO DA AGÊNCIA</label>
          <input type='text' id='a-agencia' name='NÚMERO DA AGÊNCIA' placeholder='Ex.: 1234'>
        </div>
        <div class='campo'>
          <label for='a-conta'>NÚMERO DA CONTA</label>
          <input type='text' id='a-conta' name='NÚMERO DA CONTA' placeholder='Ex.: 12345-6'>
        </div>
      </div>
    </fieldset>
    <button type='submit' class='botao-enviar'>Enviar solicitação</button>
  </form>
  <form id='form-docentes' class='form' hidden novalidate>
    <div class='erros'></div>
    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class='grade'>
        <div class='campo span-3'>
          <label for='d-nome'>NOME COMPLETO - SEM ABREVIAR</label>
          <input type='text' id='d-nome' name='NOME COMPLETO - SEM ABREVIAR' placeholder='Ex.: João Carvalho Neto'>
        </div>
        <div class='campo'>
          <label for='d-nusp'>N. USP</label>
          <input type='text' id='d-nusp' name='N. USP' placeholder='Ex.: 1234567'>
        </div>
        <div class='campo span-2'>
          <label for='d-programa'>PROGRAMA</label>
          <input type='text' id='d-programa' name='PROGRAMA' placeholder='Ex.: Estatística'>
        </div>
        <div class='campo span-3'>
          <label for='d-email'>E-MAIL</label>
          <input type='text' id='d-email' name='E-MAIL' placeholder='Ex.: joao.neto@usp.br'>
        </div>
        <div class='campo span-3'>
          <label for='d-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input type='text' id='d-evento' name='NOME DO EVENTO / BANCA DE EXAME OU DEFESA' placeholder='Ex.: Banca de defesa de mestrado'>
        </div>
        <div class='campo span-3'>
          <label for='d-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input type='text' id='d-periodo' name='PERÍODO DO EVENTO, EXAME OU DEFESA' placeholder='Ex.: 03/09/2025'>
        </div>
        <div class='campo span-2'>
          <label for='d-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input type='text' id='d-cidade-evento' name='CIDADE DO EVENTO, EXAME OU DEFESA' placeholder='Ex.: Campinas'>
        </div>
        <div class='campo'>
          <label for='d-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input type='text' id='d-estado-evento' name='ESTADO DO EVENTO, EXAME OU DEFESA' placeholder='Ex.: SP'>
        </div>
        <div class='campo span-2'>
          <label for='d-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input type='text' id='d-pais-evento' name='PAÍS DO EVENTO, EXAME OU DEFESA' placeholder='Ex.: Brasil'>
        </div>
        <div class='campo span-2'>
          <label for='d-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
          <input type='text' id='d-link' name='LINK DO EVENTO, EXAME OU DEFESA' placeholder='Ex.: https://eventos.org.br'>
        </div>
        <div class='campo span-2'>
          <label for='d-valor'>VALOR SOLICITADO (R$)</label>
          <input type='text' id='d-valor' name='VALOR SOLICITADO (R$)' placeholder='Ex.: 150000' data-formato='valor'>
        </div>
        <div class='campo span-3'>
          <label for='d-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id='d-apresentacao' name='IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?'>
            <option value=''>Selecione...</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </div>
        <div class='campo span-3'>
          <label for='d-detalhamento'>DETALHAMENTO DO PEDIDO</label>
          <textarea id='d-detalhamento' name='DETALHAMENTO DO PEDIDO' rows='2' placeholder='Ex.: Diárias e passagem para banca externa'></textarea>
        </div>
      </div>
    </fieldset>
    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class='grade'>
        <div class='campo'>
          <label for='d-nascimento'>DATA DE NASCIMENTO</label>
          <input type='text' id='d-nascimento' name='DATA DE NASCIMENTO' placeholder='Ex.: 01021980' data-formato='data'>
        </div>
        <div class='campo span-2'>
          <label for='d-logradouro'>LOGRADOURO</label>
          <input type='text' id='d-logradouro' name='LOGRADOURO' placeholder='Ex.: Rua do Matão'>
        </div>
        <div class='campo'>
          <label for='d-numero'>NÚMERO</label>
          <input type='text' id='d-numero' name='NÚMERO' placeholder='Ex.: 1010'>
        </div>
        <div class='campo span-2'>
          <label for='d-complemento'>COMPLEMENTO</label>
          <input type='text' id='d-complemento' name='COMPLEMENTO' placeholder='Ex.: Sala 245'>
        </div>
        <div class='campo'>
          <label for='d-bairro'>BAIRRO</label>
          <input type='text' id='d-bairro' name='BAIRRO' placeholder='Ex.: Cidade Universitária'>
        </div>
        <div class='campo'>
          <label for='d-cep'>CEP</label>
          <input type='text' id='d-cep' name='CEP' placeholder='Ex.: 05508090' data-formato='cep'>
        </div>
        <div class='campo span-3'>
          <label for='d-cidade'>CIDADE</label>
          <input type='text' id='d-cidade' name='CIDADE' placeholder='Ex.: São Paulo'>
        </div>
        <div class='campo'>
          <label for='d-estado'>ESTADO</label>
          <input type='text' id='d-estado' name='ESTADO' placeholder='Ex.: SP'>
        </div>
      </div>
    </fieldset>
    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class='grade'>
        <div class='campo'>
          <label for='d-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input type='text' id='d-cpf' name='CPF (SEPARADOS POR PONTOS E TRAÇO)' placeholder='Ex.: 12345678909' data-formato='cpf'>
        </div>
        <div class='campo span-2'>
          <label for='d-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input type='text' id='d-rg' name='RG / RNM (SEPARADOS POR PONTOS E TRAÇO)' placeholder='Ex.: 12.345.678-9'>
        </div>
        <div class='campo'>
          <label for='d-banco'>NOME DO BANCO</label>
          <input type='text' id='d-banco' name='NOME DO BANCO' placeholder='Ex.: Banco do Brasil'>
        </div>
        <div class='campo'>
          <label for='d-agencia'>NÚMERO DA AGÊNCIA</label>
          <input type='text' id='d-agencia' name='NÚMERO DA AGÊNCIA' placeholder='Ex.: 1234'>
        </div>
        <div class='campo'>
          <label for='d-conta'>NÚMERO DA CONTA</label>
          <input type='text' id='d-conta' name='NÚMERO DA CONTA' placeholder='Ex.: 12345-6'>
        </div>
      </div>
    </fieldset>
    <button type='submit' class='botao-enviar'>Enviar solicitação</button>
  </form>
</section>
<section id='confirmacao-view' hidden>
  <h2>Solicitação registrada</h2>
  <pre class='oficio' id='oficio'></pre>
</section>
</main>
<script src='app.js'></script>
</body>
</html>
