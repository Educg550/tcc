<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxílio Financeiro | Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="titulos">
    <span class="universidade">Universidade de São Paulo</span>
    <span class="programa">Programa de Pós-Graduação do Instituto de Matemática e Estatística</span>
  </div>
</header>
<main>
  <nav class="abas">
    <button class="aba ativa" type="button" data-alvo="painel-alunos">ALUNOS</button>
    <button class="aba" type="button" data-alvo="painel-docentes">DOCENTES</button>
  </nav>

  <section class="painel" id="painel-alunos">
    <form class="solicitacao" data-aba="ALUNOS" novalidate>
      <div class="erros" hidden></div>
      <section>
        <h2>SOLICITANTE E EVENTO</h2>
        <div class="grade">
          <div class="campo c2">
            <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="a-nome" name="NOME COMPLETO - SEM ABREVIAR" placeholder="Maria de Souza">
          </div>
          <div class="campo">
            <label for="a-nusp">N. USP</label>
            <input id="a-nusp" name="N. USP" inputmode="numeric" placeholder="1234567">
          </div>
          <div class="campo">
            <label for="a-programa">PROGRAMA</label>
            <input id="a-programa" name="PROGRAMA" placeholder="Ciência da Computação">
          </div>
          <div class="campo">
            <label for="a-nivel">NÍVEL</label>
            <select id="a-nivel" name="NÍVEL">
              <option value="">Selecione</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class="campo c2">
            <label for="a-tipo">TIPO DE AUXÍLIO</label>
            <select id="a-tipo" name="TIPO DE AUXÍLIO">
              <option value="">Selecione</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>
          <div class="campo">
            <label for="a-email">E-MAIL</label>
            <input id="a-email" name="E-MAIL" type="email" placeholder="maria@usp.br">
          </div>
          <div class="campo c2">
            <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="a-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="SBBC 2025">
          </div>
          <div class="campo">
            <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="10/06/2025 a 13/06/2025">
          </div>
          <div class="campo">
            <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Águas de Lindóia">
          </div>
          <div class="campo">
            <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="SP">
          </div>
          <div class="campo">
            <label for="a-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil">
          </div>
          <div class="campo">
            <label for="a-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-link" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="https://sbbc.org.br/2025">
          </div>
          <div class="campo">
            <label for="a-valor">VALOR SOLICITADO (R$)</label>
            <input id="a-valor" name="VALOR SOLICITADO (R$)" data-formato="moeda" inputmode="numeric" placeholder="1500">
          </div>
          <div class="campo c2">
            <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="a-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Passagem aérea e inscrição"></textarea>
          </div>
          <div class="campo c2">
            <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="a-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </section>
      <section>
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="grade">
          <div class="campo">
            <label for="a-data">DATA DE NASCIMENTO</label>
            <input id="a-data" name="DATA DE NASCIMENTO" data-formato="data" inputmode="numeric" placeholder="01021980">
          </div>
          <div class="campo">
            <label for="a-logradouro">LOGRADOURO</label>
            <input id="a-logradouro" name="LOGRADOURO" placeholder="Rua do Anfiteatro">
          </div>
          <div class="campo">
            <label for="a-numero">NÚMERO</label>
            <input id="a-numero" name="NÚMERO" placeholder="181">
          </div>
          <div class="campo">
            <label for="a-complemento">COMPLEMENTO</label>
            <input id="a-complemento" name="COMPLEMENTO" placeholder="Sala 222">
          </div>
          <div class="campo">
            <label for="a-bairro">BAIRRO</label>
            <input id="a-bairro" name="BAIRRO" placeholder="Cidade Universitária">
          </div>
          <div class="campo">
            <label for="a-cep">CEP</label>
            <input id="a-cep" name="CEP" data-formato="cep" inputmode="numeric" placeholder="05508090">
          </div>
          <div class="campo">
            <label for="a-cidade">CIDADE</label>
            <input id="a-cidade" name="CIDADE" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="a-estado">ESTADO</label>
            <input id="a-estado" name="ESTADO" placeholder="SP">
          </div>
        </div>
      </section>
      <section>
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="grade">
          <div class="campo c2">
            <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" data-formato="cpf" inputmode="numeric" placeholder="12345678909">
          </div>
          <div class="campo c2">
            <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
          </div>
          <div class="campo c2">
            <label for="a-banco">NOME DO BANCO</label>
            <input id="a-banco" name="NOME DO BANCO" placeholder="Banco do Brasil">
          </div>
          <div class="campo">
            <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="a-agencia" name="NÚMERO DA AGÊNCIA" inputmode="numeric" placeholder="0001">
          </div>
          <div class="campo">
            <label for="a-conta">NÚMERO DA CONTA</label>
            <input id="a-conta" name="NÚMERO DA CONTA" placeholder="12345-6">
          </div>
        </div>
      </section>
      <div class="acoes">
        <button type="submit">Enviar solicitação</button>
      </div>
    </form>
  </section>

  <section class="painel" id="painel-docentes" hidden>
    <form class="solicitacao" data-aba="DOCENTES" novalidate>
      <div class="erros" hidden></div>
      <section>

          <div class="campo">
            <label for="d-email">E-MAIL</label>

          <div class="campo c2">
            <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>

          </div>
          <div class="campo">

          </div>
          <div class="campo">

            <input id="d-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Águas de Lindóia">
          </div>
          <div class="campo">
            <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="SP">

          <div class="campo">

          <div class="campo">

          <div class="campo c2">

          </div>
          <div class="campo">

            <select id="d-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
              <option value="">Selecione</option>

              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </section>
      <section>
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="grade">
          <div class="campo">
            <label for="d-data">DATA DE NASCIMENTO</label>
            <input id="d-data" name="DATA DE NASCIMENTO" data-formato="data" inputmode="numeric" placeholder="01021980">
          </div>
          <div class="campo">
            <label for="d-logradouro">LOGRADOURO</label>
            <input id="d-logradouro" name="LOGRADOURO" placeholder="Rua do Anfiteatro">
          </div>
          <div class="campo">
            <label for="d-numero">NÚMERO</label>
            <input id="d-numero" name="NÚMERO" placeholder="181">
          </div>
          <div class="campo">
            <label for="d-complemento">COMPLEMENTO</label>
            <input id="d-complemento" name="COMPLEMENTO" placeholder="Sala 222">
          </div>
          <div class="campo">
            <label for="d-bairro">BAIRRO</label>
            <input id="d-bairro" name="BAIRRO" placeholder="Cidade Universitária">
          </div>
          <div class="campo">
            <label for="d-cep">CEP</label>
            <input id="d-cep" name="CEP" data-formato="cep" inputmode="numeric" placeholder="05508090">
          </div>
          <div class="campo">
            <label for="d-cidade">CIDADE</label>
            <input id="d-cidade" name="CIDADE" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="d-estado">ESTADO</label>
            <input id="d-estado" name="ESTADO" placeholder="SP">
          </div>
        </div>
      </section>
      <section>
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="grade">
          <div class="campo c2">
            <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" data-formato="cpf" inputmode="numeric" placeholder="12345678909">
          </div>
          <div class="campo c2">
            <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
          </div>
          <div class="campo c2">
            <label for="d-banco">NOME DO BANCO</label>
            <input id="d-banco" name="NOME DO BANCO" placeholder="Banco do Brasil">
          </div>
          <div class="campo">
            <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="d-agencia" name="NÚMERO DA AGÊNCIA" inputmode="numeric" placeholder="0001">
          </div>
          <div class="campo">

        </div>
      </section>
      <div class="acoes">

      </div>
    </form>
  </section>

  <section id="confirmacao" hidden>
    <h1>Solicitação registrada</h1>
    <pre id="oficio"></pre>
    <button id="voltar" type="button">Nova solicitação</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
