<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <div class="marca">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div>
      <h1>Universidade de São Paulo</h1>
      <p class="programa">Pós-Graduação do Instituto de Matemática e Estatística</p>
    </div>
  </div>
</header>

<main>
  <div id="formulario">
    <nav class="abas" aria-label="Tipo de solicitante">
      <button type="button" class="aba ativa" data-form="form-alunos">ALUNOS</button>
      <button type="button" class="aba" data-form="form-docentes">DOCENTES</button>
    </nav>

    <form id="form-alunos" class="formulario" data-perfil="ALUNOS" novalidate>
      <div class="erros" hidden></div>

      <h2>SOLICITANTE E EVENTO</h2>
      <div class="grade">
        <div class="campo c5">
          <label for="al-nome">NOME COMPLETO - SEM ABREVIAR</label>
          <input type="text" id="al-nome" name="NOME COMPLETO - SEM ABREVIAR" placeholder="Maria Aparecida da Silva">
        </div>
        <div class="campo c2">
          <label for="al-nusp">N. USP</label>
          <input type="text" id="al-nusp" name="N. USP" placeholder="1234567" inputmode="numeric">
        </div>
        <div class="campo c5">
          <label for="al-programa">PROGRAMA</label>
          <input type="text" id="al-programa" name="PROGRAMA" placeholder="Ciência da Computação">
        </div>
        <div class="campo c3">
          <label for="al-nivel">NÍVEL</label>
          <select id="al-nivel" name="NÍVEL">
            <option value="">Selecione</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select>
        </div>
        <div class="campo c4">
          <label for="al-tipo">TIPO DE AUXÍLIO</label>
          <select id="al-tipo" name="TIPO DE AUXÍLIO">
            <option value="">Selecione</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select>
        </div>
        <div class="campo c5">
          <label for="al-email">E-MAIL</label>
          <input type="email" id="al-email" name="E-MAIL" placeholder="maria.aparecida@usp.br">
        </div>
        <div class="campo c6">
          <label for="al-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input type="text" id="al-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Congresso Brasileiro de Computação">
        </div>
        <div class="campo c6">
          <label for="al-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="al-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="10 a 14 de março de 2025">
        </div>
        <div class="campo c4">
          <label for="al-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="al-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="São Paulo">
        </div>
        <div class="campo c3">
          <label for="al-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="al-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="SP">
        </div>
        <div class="campo c5">
          <label for="al-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="al-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil">
        </div>
        <div class="campo c4">
          <label for="al-link">LINK DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="al-link" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="www.evento.com.br">
        </div>
        <div class="campo c3">
          <label for="al-valor">VALOR SOLICITADO (R$)</label>
          <input type="text" id="al-valor" name="VALOR SOLICITADO (R$)" placeholder="150000" inputmode="numeric" data-formato="valor">
        </div>
        <div class="campo c5">
          <label for="al-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id="al-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
            <option value="">Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </div>
        <div class="campo c12">
          <label for="al-detalhamento">DETALHAMENTO DO PEDIDO</label>
          <textarea id="al-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Inscrição no evento e passagem aérea de ida e volta"></textarea>
        </div>
      </div>

      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <div class="campo c2">
          <label for="al-nascimento">DATA DE NASCIMENTO</label>
          <input type="text" id="al-nascimento" name="DATA DE NASCIMENTO" placeholder="01021980" inputmode="numeric" data-formato="data">
        </div>
        <div class="campo c5">
          <label for="al-logradouro">LOGRADOURO</label>
          <input type="text" id="al-logradouro" name="LOGRADOURO" placeholder="Rua do Matão">
        </div>
        <div class="campo c2">
          <label for="al-numero">NÚMERO</label>
          <input type="text" id="al-numero" name="NÚMERO" placeholder="1010">
        </div>
        <div class="campo c3">
          <label for="al-complemento">COMPLEMENTO</label>
          <input type="text" id="al-complemento" name="COMPLEMENTO" placeholder="Sala 212">
        </div>
        <div class="campo c4">
          <label for="al-bairro">BAIRRO</label>
          <input type="text" id="al-bairro" name="BAIRRO" placeholder="Cidade Universitária">
        </div>
        <div class="campo c3">
          <label for="al-cep">CEP</label>
          <input type="text" id="al-cep" name="CEP" placeholder="05508090" inputmode="numeric" data-formato="cep">
        </div>
        <div class="campo c3">
          <label for="al-cidade">CIDADE</label>
          <input type="text" id="al-cidade" name="CIDADE" placeholder="São Paulo">
        </div>
        <div class="campo c2">
          <label for="al-estado">ESTADO</label>
          <input type="text" id="al-estado" name="ESTADO" placeholder="SP">
        </div>
      </div>

      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <div class="campo c4">
          <label for="al-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input type="text" id="al-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12345678909" inputmode="numeric" data-formato="cpf">
        </div>
        <div class="campo c4">
          <label for="al-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input type="text" id="al-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
        </div>
        <div class="campo c4">
          <label for="al-banco">NOME DO BANCO</label>
          <input type="text" id="al-banco" name="NOME DO BANCO" placeholder="Banco do Brasil">
        </div>
        <div class="campo c3">
          <label for="al-agencia">NÚMERO DA AGÊNCIA</label>
          <input type="text" id="al-agencia" name="NÚMERO DA AGÊNCIA" placeholder="0001" inputmode="numeric">
        </div>
        <div class="campo c3">
          <label for="al-conta">NÚMERO DA CONTA</label>
          <input type="text" id="al-conta" name="NÚMERO DA CONTA" placeholder="12345-6">
        </div>
      </div>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>

    <form id="form-docentes" class="formulario" data-perfil="DOCENTES" novalidate hidden>
      <div class="erros" hidden></div>

      <h2>SOLICITANTE E EVENTO</h2>
      <div class="grade">
        <div class="campo c5">
          <label for="doc-nome">NOME COMPLETO - SEM ABREVIAR</label>
          <input type="text" id="doc-nome" name="NOME COMPLETO - SEM ABREVIAR" placeholder="João Carlos de Oliveira">
        </div>
        <div class="campo c2">
          <label for="doc-nusp">N. USP</label>
          <input type="text" id="doc-nusp" name="N. USP" placeholder="1234567" inputmode="numeric">
        </div>
        <div class="campo c5">
          <label for="doc-programa">PROGRAMA</label>
          <input type="text" id="doc-programa" name="PROGRAMA" placeholder="Estatística">
        </div>
        <div class="campo c5">
          <label for="doc-email">E-MAIL</label>
          <input type="email" id="doc-email" name="E-MAIL" placeholder="joao.oliveira@ime.usp.br">
        </div>
        <div class="campo c6">
          <label for="doc-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input type="text" id="doc-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Banca de defesa de doutorado de Maria Souza">
        </div>
        <div class="campo c6">
          <label for="doc-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="doc-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="10 a 14 de março de 2025">
        </div>
        <div class="campo c4">
          <label for="doc-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="doc-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Campinas">
        </div>
        <div class="campo c3">
          <label for="doc-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="doc-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="SP">
        </div>
        <div class="campo c5">
          <label for="doc-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="doc-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Brasil">
        </div>
        <div class="campo c4">
          <label for="doc-link">LINK DO EVENTO, EXAME OU DEFESA</label>
          <input type="text" id="doc-link" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="www.evento.com.br">
        </div>
        <div class="campo c3">
          <label for="doc-valor">VALOR SOLICITADO (R$)</label>
          <input type="text" id="doc-valor" name="VALOR SOLICITADO (R$)" placeholder="150000" inputmode="numeric" data-formato="valor">
        </div>
        <div class="campo c5">
          <label for="doc-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id="doc-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
            <option value="">Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </div>
        <div class="campo c12">
          <label for="doc-detalhamento">DETALHAMENTO DO PEDIDO</label>
          <textarea id="doc-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Passagem aérea e diárias para participação em banca"></textarea>
        </div>
      </div>

      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <div class="campo c2">
          <label for="doc-nascimento">DATA DE NASCIMENTO</label>
          <input type="text" id="doc-nascimento" name="DATA DE NASCIMENTO" placeholder="01021980" inputmode="numeric" data-formato="data">
        </div>
        <div class="campo c5">
          <label for="doc-logradouro">LOGRADOURO</label>
          <input type="text" id="doc-logradouro" name="LOGRADOURO" placeholder="Rua do Matão">
        </div>
        <div class="campo c2">
          <label for="doc-numero">NÚMERO</label>
          <input type="text" id="doc-numero" name="NÚMERO" placeholder="1010">
        </div>
        <div class="campo c3">
          <label for="doc-complemento">COMPLEMENTO</label>
          <input type="text" id="doc-complemento" name="COMPLEMENTO" placeholder="Sala 212">
        </div>
        <div class="campo c4">
          <label for="doc-bairro">BAIRRO</label>
          <input type="text" id="doc-bairro" name="BAIRRO" placeholder="Cidade Universitária">
        </div>
        <div class="campo c3">
          <label for="doc-cep">CEP</label>
          <input type="text" id="doc-cep" name="CEP" placeholder="05508090" inputmode="numeric" data-formato="cep">
        </div>
        <div class="campo c3">
          <label for="doc-cidade">CIDADE</label>
          <input type="text" id="doc-cidade" name="CIDADE" placeholder="São Paulo">
        </div>
        <div class="campo c2">
          <label for="doc-estado">ESTADO</label>
          <input type="text" id="doc-estado" name="ESTADO" placeholder="SP">
        </div>
      </div>

      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <div class="campo c4">
          <label for="doc-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input type="text" id="doc-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12345678909" inputmode="numeric" data-formato="cpf">
        </div>
        <div class="campo c4">
          <label for="doc-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input type="text" id="doc-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="12.345.678-9">
        </div>
        <div class="campo c4">
          <label for="doc-banco">NOME DO BANCO</label>
          <input type="text" id="doc-banco" name="NOME DO BANCO" placeholder="Banco do Brasil">
        </div>
        <div class="campo c3">
          <label for="doc-agencia">NÚMERO DA AGÊNCIA</label>
          <input type="text" id="doc-agencia" name="NÚMERO DA AGÊNCIA" placeholder="0001" inputmode="numeric">
        </div>
        <div class="campo c3">
          <label for="doc-conta">NÚMERO DA CONTA</label>
          <input type="text" id="doc-conta" name="NÚMERO DA CONTA" placeholder="12345-6">
        </div>
      </div>

      <button type="submit" class="enviar">Enviar solicitação</button>
    </form>
  </div>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre class="oficio" id="oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
