<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel='stylesheet' href='/style.css'>
</head>
<body>
<header class='cabecalho'>
  <img class='logo' src='assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
  <div class='titulos'>
    <h1>Universidade de São Paulo</h1>
    <p class='subtitulo'>Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>
<main>
  <div id='formularios'>
    <nav class='abas'>
      <button type='button' class='aba aba-ativa' data-aba='alunos'>ALUNOS</button>
      <button type='button' class='aba' data-aba='docentes'>DOCENTES</button>
    </nav>

    <section class='painel' id='painel-alunos'>
      <form id='form-alunos' class='solicitacao' novalidate>
        <div class='erros oculto' role='alert'></div>
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class='grade'>
            <div class='campo c4'><label for='alunos-nome'>NOME COMPLETO - SEM ABREVIAR</label>
              <input id='alunos-nome' name='nome' type='text' placeholder='Maria Souza da Silva'></div>
            <div class='campo c2'><label for='alunos-n-usp'>N. USP</label>
              <input id='alunos-n-usp' name='n_usp' type='text' placeholder='1234567'></div>
            <div class='campo c3'><label for='alunos-programa'>PROGRAMA</label>
              <input id='alunos-programa' name='programa' type='text' placeholder='Ciência da Computação'></div>
            <div class='campo c3'><label for='alunos-nivel'>NIVEL</label>
              <select id='alunos-nivel' name='nivel'>
                <option value=''>Selecione</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select></div>
            <div class='campo c3'><label for='alunos-tipo'>TIPO DE AUXILIO</label>
              <select id='alunos-tipo' name='tipo_auxilio'>
                <option value=''>Selecione</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select></div>
            <div class='campo c4'><label for='alunos-email'>E-MAIL</label>
              <input id='alunos-email' name='email' type='text' placeholder='maria.souza@usp.br'></div>
            <div class='campo c2'><label for='alunos-valor'>VALOR SOLICITADO (R$)</label>
              <input id='alunos-valor' name='valor' type='text' placeholder='150000'></div>
            <div class='campo c3'><label for='alunos-apresentacao'>IRA APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id='alunos-apresentacao' name='apresentacao'>
                <option value=''>Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select></div>
            <div class='campo c5'><label for='alunos-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id='alunos-evento' name='evento' type='text' placeholder='SBMF 2025'></div>
            <div class='campo c4'><label for='alunos-periodo'>PERIODO DO EVENTO, EXAME OU DEFESA</label>
              <input id='alunos-periodo' name='periodo' type='text' placeholder='22 a 26 de setembro de 2025'></div>
            <div class='campo c3'><label for='alunos-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id='alunos-link' name='link_evento' type='text' placeholder='https://evento.org.br'></div>
            <div class='campo c3'><label for='alunos-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id='alunos-cidade-evento' name='cidade_evento' type='text' placeholder='Recife'></div>
            <div class='campo c2'><label for='alunos-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id='alunos-estado-evento' name='estado_evento' type='text' placeholder='PE'></div>
            <div class='campo c2'><label for='alunos-pais-evento'>PAIS DO EVENTO, EXAME OU DEFESA</label>
              <input id='alunos-pais-evento' name='pais_evento' type='text' placeholder='Brasil'></div>
            <div class='campo c5'><label for='alunos-detalhamento'>DETALHAMENTO DO PEDIDO</label>
              <textarea id='alunos-detalhamento' name='detalhamento' placeholder='Ex.: passagem aérea e inscrição no evento.'></textarea></div>
          </div>
        </fieldset>
        <fieldset>
          <legend>ENDERECO DO SOLICITANTE</legend>
          <div class='grade'>
            <div class='campo c3'><label for='alunos-data'>DATA DE NASCIMENTO</label>
              <input id='alunos-data' name='data_nascimento' type='text' placeholder='01021980'></div>
            <div class='campo c5'><label for='alunos-logradouro'>LOGRADOURO</label>
              <input id='alunos-logradouro' name='logradouro' type='text' placeholder='Rua do Anfiteatro'></div>
            <div class='campo c2'><label for='alunos-numero'>NUMERO</label>
              <input id='alunos-numero' name='numero' type='text' placeholder='123'></div>
            <div class='campo c2'><label for='alunos-cep'>CEP</label>
              <input id='alunos-cep' name='cep' type='text' placeholder='05508090'></div>
            <div class='campo c4'><label for='alunos-bairro'>BAIRRO</label>
              <input id='alunos-bairro' name='bairro' type='text' placeholder='Cidade Universitária'></div>
            <div class='campo c3'><label for='alunos-complemento'>COMPLEMENTO</label>
              <input id='alunos-complemento' name='complemento' type='text' placeholder='Sala 214'></div>
            <div class='campo c3'><label for='alunos-cidade'>CIDADE</label>
              <input id='alunos-cidade' name='cidade' type='text' placeholder='São Paulo'></div>
            <div class='campo c2'><label for='alunos-estado'>ESTADO</label>
              <input id='alunos-estado' name='estado' type='text' placeholder='SP'></div>
          </div>
        </fieldset>
        <fieldset>
          <legend>INFORMACOES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class='grade'>
            <div class='campo c3'><label for='alunos-cpf'>CPF (SEPARADOS POR PONTOS E TRACO)</label>
              <input id='alunos-cpf' name='cpf' type='text' placeholder='12345678909'></div>
            <div class='campo c3'><label for='alunos-rg'>RG / RNM (SEPARADOS POR PONTOS E TRACO)</label>
              <input id='alunos-rg' name='rg_rnm' type='text' placeholder='12.345.678-9'></div>
            <div class='campo c2'><label for='alunos-banco'>NOME DO BANCO</label>
              <input id='alunos-banco' name='banco' type='text' placeholder='Banco do Brasil'></div>
            <div class='campo c2'><label for='alunos-agencia'>NUMERO DA AGENCIA</label>
              <input id='alunos-agencia' name='agencia' type='text' placeholder='0183'></div>
            <div class='campo c2'><label for='alunos-conta'>NUMERO DA CONTA</label>
              <input id='alunos-conta' name='conta' type='text' placeholder='45678-9'></div>
          </div>
        </fieldset>
        <div class='acoes'><button type='submit' class='enviar'>Enviar solicitação</button></div>
      </form>
    </section>

    <section class='painel oculto' id='painel-docentes'>
      <form id='form-docentes' class='solicitacao' novalidate>
        <div class='erros oculto' role='alert'></div>
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class='grade'>
            <div class='campo c4'><label for='docentes-nome'>NOME COMPLETO - SEM ABREVIAR</label>
              <input id='docentes-nome' name='nome' type='text' placeholder='Pedro Alves do Nascimento'></div>
            <div class='campo c2'><label for='docentes-n-usp'>N. USP</label>
              <input id='docentes-n-usp' name='n_usp' type='text' placeholder='7654321'></div>
            <div class='campo c3'><label for='docentes-programa'>PROGRAMA</label>
              <input id='docentes-programa' name='programa' type='text' placeholder='Estatística'></div>
            <div class='campo c3'><label for='docentes-email'>E-MAIL</label>
              <input id='docentes-email' name='email' type='text' placeholder='pedro.nascimento@usp.br'></div>
            <div class='campo c2'><label for='docentes-valor'>VALOR SOLICITADO (R$)</label>
              <input id='docentes-valor' name='valor' type='text' placeholder='200000'></div>
            <div class='campo c4'><label for='docentes-apresentacao'>IRA APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id='docentes-apresentacao' name='apresentacao'>
                <option value=''>Selecione</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select></div>
            <div class='campo c6'><label for='docentes-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id='docentes-evento' name='evento' type='text' placeholder='Defesa de mestrado de Ana Lima'></div>
            <div class='campo c4'><label for='docentes-periodo'>PERIODO DO EVENTO, EXAME OU DEFESA</label>
              <input id='docentes-periodo' name='periodo' type='text' placeholder='10 de outubro de 2025'></div>
            <div class='campo c3'><label for='docentes-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id='docentes-cidade-evento' name='cidade_evento' type='text' placeholder='São Paulo'></div>
            <div class='campo c2'><label for='docentes-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id='docentes-estado-evento' name='estado_evento' type='text' placeholder='SP'></div>
            <div class='campo c3'><label for='docentes-pais-evento'>PAIS DO EVENTO, EXAME OU DEFESA</label>
              <input id='docentes-pais-evento' name='pais_evento' type='text' placeholder='Brasil'></div>
            <div class='campo c5'><label for='docentes-link'>LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id='docentes-link' name='link_evento' type='text' placeholder='https://evento.org.br'></div>
            <div class='campo c7'><label for='docentes-detalhamento'>DETALHAMENTO DO PEDIDO</label>
              <textarea id='docentes-detalhamento' name='detalhamento' placeholder='Ex.: diária para participação em banca.'></textarea></div>
          </div>
        </fieldset>
        <fieldset>
          <legend>ENDERECO DO SOLICITANTE</legend>
          <div class='grade'>
            <div class='campo c3'><label for='docentes-data'>DATA DE NASCIMENTO</label>
              <input id='docentes-data' name='data_nascimento' type='text' placeholder='03121975'></div>
            <div class='campo c5'><label for='docentes-logradouro'>LOGRADOURO</label>
              <input id='docentes-logradouro' name='logradouro' type='text' placeholder='Avenida Professor Lineu Prestes'></div>
            <div class='campo c2'><label for='docentes-numero'>NUMERO</label>
              <input id='docentes-numero' name='numero' type='text' placeholder='65'></div>
            <div class='campo c2'><label for='docentes-cep'>CEP</label>
              <input id='docentes-cep' name='cep' type='text' placeholder='05508090'></div>
            <div class='campo c4'><label for='docentes-bairro'>BAIRRO</label>
              <input id='docentes-bairro' name='bairro' type='text' placeholder='Butantã'></div>
            <div class='campo c3'><label for='docentes-complemento'>COMPLEMENTO</label>
              <input id='docentes-complemento' name='complemento' type='text' placeholder='Sala 214'></div>
            <div class='campo c3'><label for='docentes-cidade'>CIDADE</label>
              <input id='docentes-cidade' name='cidade' type='text' placeholder='São Paulo'></div>
            <div class='campo c2'><label for='docentes-estado'>ESTADO</label>
              <input id='docentes-estado' name='estado' type='text' placeholder='SP'></div>
          </div>
        </fieldset>
        <fieldset>
          <legend>INFORMACOES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class='grade'>
            <div class='campo c3'><label for='docentes-cpf'>CPF (SEPARADOS POR PONTOS E TRACO)</label>
              <input id='docentes-cpf' name='cpf' type='text' placeholder='98765432100'></div>
            <div class='campo c3'><label for='docentes-rg'>RG / RNM (SEPARADOS POR PONTOS E TRACO)</label>
              <input id='docentes-rg' name='rg_rnm' type='text' placeholder='23.456.789-0'></div>
            <div class='campo c2'><label for='docentes-banco'>NOME DO BANCO</label>
              <input id='docentes-banco' name='banco' type='text' placeholder='Caixa Econômica Federal'></div>
            <div class='campo c2'><label for='docentes-agencia'>NUMERO DA AGENCIA</label>
              <input id='docentes-agencia' name='agencia' type='text' placeholder='0001'></div>
            <div class='campo c2'><label for='docentes-conta'>NUMERO DA CONTA</label>
              <input id='docentes-conta' name='conta' type='text' placeholder='12345-6'></div>
          </div>
        </fieldset>
        <div class='acoes'><button type='submit' class='enviar'>Enviar solicitação</button></div>
      </form>
    </section>
  </div>

  <section id='confirmacao' class='oculto'>
    <h2>Solicitação registrada</h2>
    <pre id='texto-oficio'></pre>
  </section>
</main>
<script src='/app.js'></script>
</body>
</html>
