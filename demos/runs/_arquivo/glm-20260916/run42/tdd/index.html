<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <div class="marca">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="nomes">
      <p class="universidade">Universidade de São Paulo</p>
      <p class="programa">Programa de Pós-Graduação - IME-USP</p>
    </div>
  </div>
</header>
<main>
  <nav class="abas" aria-label="Tipo de solicitante">
    <button type="button" class="aba ativa" data-alvo="painel-alunos">ALUNOS</button>
    <button type="button" class="aba" data-alvo="painel-docentes">DOCENTES</button>
  </nav>

  <section id="confirmacao" class="confirmacao oculto">
    <h1>Solicitação registrada</h1>
    <div id="oficio" class="oficio"></div>
  </section>

  <form id="painel-alunos" class="painel" novalidate>
    <div class="erros" aria-live="polite"></div>
    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class="grade">
        <label class="c4">NOME COMPLETO - SEM ABREVIAR
          <input name="NOME COMPLETO - SEM ABREVIAR" placeholder="Ex.: Maria Aparecida da Silva">
        </label>
        <label class="c2">N. USP
          <input name="N. USP" inputmode="numeric" placeholder="Ex.: 1234567">
        </label>
        <label class="c3">PROGRAMA
          <input name="PROGRAMA" placeholder="Ex.: Ciência da Computação">
        </label>
        <label class="c3">NÍVEL
          <select name="NÍVEL">
            <option value="" selected>Selecione…</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select>
        </label>
        <label class="c3">TIPO DE AUXÍLIO
          <select name="TIPO DE AUXÍLIO">
            <option value="" selected>Selecione…</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select>
        </label>
        <label class="c3">E-MAIL
          <input name="E-MAIL" placeholder="Ex.: nome@usp.br">
        </label>
        <label class="c6">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
          <input name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Ex.: SBBD 2025">
        </label>
        <label class="c4">PERÍODO DO EVENTO, EXAME OU DEFESA
          <input name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: 12 a 15 de outubro de 2025">
        </label>
        <label class="c3">CIDADE DO EVENTO, EXAME OU DEFESA
          <input name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: São Paulo">
        </label>
        <label class="c2">ESTADO DO EVENTO, EXAME OU DEFESA
          <input name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: SP">
        </label>
        <label class="c3">PAÍS DO EVENTO, EXAME OU DEFESA
          <input name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: Brasil">
        </label>
        <label class="c3">LINK DO EVENTO, EXAME OU DEFESA
          <input name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: https://evento.org.br">
        </label>
        <label class="c2">VALOR SOLICITADO (R$)
          <input name="VALOR SOLICITADO (R$)" inputmode="numeric" placeholder="Ex.: 150000">
        </label>
        <label class="c3">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
          <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
            <option value="" selected>Selecione…</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </label>
        <label class="c4">DETALHAMENTO DO PEDIDO
          <textarea name="DETALHAMENTO DO PEDIDO" placeholder="Ex.: Passagem aérea e inscrição no evento"></textarea>
        </label>
      </div>
    </fieldset>
    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class="grade">
        <label class="c2">DATA DE NASCIMENTO
          <input name="DATA DE NASCIMENTO" inputmode="numeric" placeholder="Ex.: 01021980">
        </label>
        <label class="c4">LOGRADOURO
          <input name="LOGRADOURO" placeholder="Ex.: Rua do Anfiteatro">
        </label>
        <label class="c2">NÚMERO
          <input name="NÚMERO" placeholder="Ex.: 123">
        </label>
        <label class="c4">COMPLEMENTO
          <input name="COMPLEMENTO" placeholder="Ex.: Sala 5 (opcional)">
        </label>
        <label class="c4">BAIRRO
          <input name="BAIRRO" placeholder="Ex.: Cidade Universitária">
        </label>
        <label class="c2">CEP
          <input name="CEP" inputmode="numeric" placeholder="Ex.: 05508090">
        </label>
        <label class="c3">CIDADE
          <input name="CIDADE" placeholder="Ex.: São Paulo">
        </label>
        <label class="c3">ESTADO
          <input name="ESTADO" placeholder="Ex.: SP">
        </label>
      </div>
    </fieldset>
    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="grade">
        <label class="c3">CPF (SEPARADOS POR PONTOS E TRAÇO)
          <input name="CPF (SEPARADOS POR PONTOS E TRAÇO)" inputmode="numeric" placeholder="Ex.: 12345678909">
        </label>
        <label class="c3">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
          <input name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="Ex.: 12.345.678-9">
        </label>
        <label class="c6">NOME DO BANCO
          <input name="NOME DO BANCO" placeholder="Ex.: Banco do Brasil">
        </label>
        <label class="c2">NÚMERO DA AGÊNCIA
          <input name="NÚMERO DA AGÊNCIA" inputmode="numeric" placeholder="Ex.: 1234">
        </label>
        <label class="c4">NÚMERO DA CONTA
          <input name="NÚMERO DA CONTA" placeholder="Ex.: 56789-0">
        </label>
      </div>
    </fieldset>
    <div class="acoes">
      <button type="submit">Enviar solicitação</button>
    </div>
  </form>

  <form id="painel-docentes" class="painel oculto" novalidate>
    <div class="erros" aria-live="polite"></div>
    <fieldset>
      <legend>SOLICITANTE E EVENTO</legend>
      <div class="grade">
        <label class="c4">NOME COMPLETO - SEM ABREVIAR
          <input name="NOME COMPLETO - SEM ABREVIAR" placeholder="Ex.: João Pedro dos Santos">
        </label>
        <label class="c2">N. USP
          <input name="N. USP" inputmode="numeric" placeholder="Ex.: 2345678">
        </label>
        <label class="c3">PROGRAMA
          <input name="PROGRAMA" placeholder="Ex.: Estatística">
        </label>
        <label class="c3">E-MAIL
          <input name="E-MAIL" placeholder="Ex.: nome@ime.usp.br">
        </label>
        <label class="c6">NOME DO EVENTO / BANCA DE EXAME OU DEFESA
          <input name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Ex.: Banca de defesa de mestrado">
        </label>
        <label class="c6">PERÍODO DO EVENTO, EXAME OU DEFESA
          <input name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: 3 a 5 de novembro de 2025">
        </label>
        <label class="c3">CIDADE DO EVENTO, EXAME OU DEFESA
          <input name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: Campinas">
        </label>
        <label class="c2">ESTADO DO EVENTO, EXAME OU DEFESA
          <input name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: SP">
        </label>
        <label class="c2">PAÍS DO EVENTO, EXAME OU DEFESA
          <input name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: Brasil">
        </label>
        <label class="c3">LINK DO EVENTO, EXAME OU DEFESA
          <input name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: https://evento.org.br">
        </label>
        <label class="c2">VALOR SOLICITADO (R$)
          <input name="VALOR SOLICITADO (R$)" inputmode="numeric" placeholder="Ex.: 250000">
        </label>
        <label class="c4">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?
          <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
            <option value="" selected>Selecione…</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </label>
        <label class="c6">DETALHAMENTO DO PEDIDO
          <textarea name="DETALHAMENTO DO PEDIDO" placeholder="Ex.: Passagem rodoviária e diárias"></textarea>
        </label>
      </div>
    </fieldset>
    <fieldset>
      <legend>ENDEREÇO DO SOLICITANTE</legend>
      <div class="grade">
        <label class="c2">DATA DE NASCIMENTO
          <input name="DATA DE NASCIMENTO" inputmode="numeric" placeholder="Ex.: 15031975">
        </label>
        <label class="c4">LOGRADOURO
          <input name="LOGRADOURO" placeholder="Ex.: Avenida Professor Lineu Prestes">
        </label>
        <label class="c2">NÚMERO
          <input name="NÚMERO" placeholder="Ex.: 65">
        </label>
        <label class="c4">COMPLEMENTO
          <input name="COMPLEMENTO" placeholder="Ex.: Bloco C (opcional)">
        </label>
        <label class="c4">BAIRRO
          <input name="BAIRRO" placeholder="Ex.: Butantã">
        </label>
        <label class="c2">CEP
          <input name="CEP" inputmode="numeric" placeholder="Ex.: 05508000">
        </label>
        <label class="c3">CIDADE
          <input name="CIDADE" placeholder="Ex.: São Paulo">
        </label>
        <label class="c3">ESTADO
          <input name="ESTADO" placeholder="Ex.: SP">
        </label>
      </div>
    </fieldset>
    <fieldset>
      <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
      <div class="grade">
        <label class="c3">CPF (SEPARADOS POR PONTOS E TRAÇO)
          <input name="CPF (SEPARADOS POR PONTOS E TRAÇO)" inputmode="numeric" placeholder="Ex.: 98765432100">
        </label>
        <label class="c3">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)
          <input name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="Ex.: 98.765.432-1">
        </label>
        <label class="c6">NOME DO BANCO
          <input name="NOME DO BANCO" placeholder="Ex.: Itaú">
        </label>
        <label class="c2">NÚMERO DA AGÊNCIA
          <input name="NÚMERO DA AGÊNCIA" inputmode="numeric" placeholder="Ex.: 0987">
        </label>
        <label class="c4">NÚMERO DA CONTA
          <input name="NÚMERO DA CONTA" placeholder="Ex.: 43210-1">
        </label>
      </div>
    </fieldset>
    <div class="acoes">
      <button type="submit">Enviar solicitação</button>
    </div>
  </form>
</main>
<script src="app.js"></script>
</body>
</html>
