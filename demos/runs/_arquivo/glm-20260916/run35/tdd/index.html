<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação do IME-USP</title>
  <link rel='stylesheet' href='/style.css'>
</head>
<body>
  <header class='cabecalho'>
    <img class='logo' src='/assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
    <div class='identificacao'>
      <h1>Universidade de São Paulo</h1>
      <p class='programa'>Pós-Graduação do IME-USP &mdash; Auxílio Financeiro</p>
    </div>
  </header>

  <main>
    <div id='formulario'>
      <div class='abas' role='tablist' aria-label='Tipo de solicitante'>
        <button type='button' class='aba ativa' id='aba-alunos' data-alvo='painel-alunos' role='tab' aria-selected='true'>ALUNOS</button>
        <button type='button' class='aba' id='aba-docentes' data-alvo='painel-docentes' role='tab' aria-selected='false'>DOCENTES</button>
      </div>

      <section class='painel' id='painel-alunos'>
        <div class='erros' id='erros-alunos' hidden></div>
        <form id='form-alunos' data-aba='alunos' novalidate>
          <fieldset>
            <legend>SOLICITANTE E EVENTO</legend>
            <div class='grade'>
              <div class='campo c4'><label for='a-nome'>NOME COMPLETO - SEM ABREVIAR</label><input type='text' id='a-nome' name='nome' placeholder='Maria de Souza Silva'></div>
              <div class='campo c2'><label for='a-nusp'>N. USP</label><input type='text' id='a-nusp' name='n_usp' placeholder='1234567'></div>
              <div class='campo c3'><label for='a-programa'>PROGRAMA</label><input type='text' id='a-programa' name='programa' placeholder='Ciência da Computação'></div>
              <div class='campo c3'><label for='a-nivel'>NÍVEL</label><select id='a-nivel' name='nivel'><option value=''>Selecione</option><option>Mestrado</option><option>Doutorado</option></select></div>
              <div class='campo c3'><label for='a-auxilio'>TIPO DE AUXÍLIO</label><select id='a-auxilio' name='auxilio'><option value=''>Selecione</option><option>Participação em evento</option><option>Banca de exame ou defesa</option><option>Outro</option></select></div>
              <div class='campo c4'><label for='a-email'>E-MAIL</label><input type='text' id='a-email' name='email' placeholder='nome@usp.br'></div>
              <div class='campo c8'><label for='a-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label><input type='text' id='a-evento' name='evento' placeholder='Simpósio Brasileiro de Banco de Dados'></div>
              <div class='campo c4'><label for='a-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label><input type='text' id='a-periodo' name='periodo' placeholder='1 a 3 de julho de 2025'></div>
              <div class='campo c3'><label for='a-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label><input type='text' id='a-cidade-evento' name='cidade_evento' placeholder='São Paulo'></div>
              <div class='campo c2'><label for='a-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label><input type='text' id='a-estado-evento' name='estado_evento' placeholder='SP'></div>
              <div class='campo c3'><label for='a-pais'>PAÍS DO EVENTO, EXAME OU DEFESA</label><input type='text' id='a-pais' name='pais' placeholder='Brasil'></div>
              <div class='campo c4'><label for='a-link'>LINK DO EVENTO, EXAME OU DEFESA</label><input type='text' id='a-link' name='link' placeholder='ime.usp.br/evento'></div>
              <div class='campo c3'><label for='a-valor'>VALOR SOLICITADO (R$)</label><input type='text' id='a-valor' name='valor' data-mascara='moeda' placeholder='150000'></div>
              <div class='campo c5'><label for='a-detalhamento'>DETALHAMENTO DO PEDIDO</label><textarea id='a-detalhamento' name='detalhamento' rows='2' placeholder='Passagem aérea e inscrição no evento'></textarea></div>
              <div class='campo c4'><label for='a-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label><select id='a-apresentacao' name='apresentacao'><option value=''>Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></div>
            </div>
          </fieldset>
          <fieldset>
            <legend>ENDEREÇO DO SOLICITANTE</legend>
            <div class='grade'>
              <div class='campo c3'><label for='a-nascimento'>DATA DE NASCIMENTO</label><input type='text' id='a-nascimento' name='nascimento' data-mascara='data' placeholder='01021980'></div>
              <div class='campo c4'><label for='a-logradouro'>LOGRADOURO</label><input type='text' id='a-logradouro' name='logradouro' placeholder='Rua do Anfiteatro'></div>
              <div class='campo c1'><label for='a-numero'>NÚMERO</label><input type='text' id='a-numero' name='numero' placeholder='181'></div>
              <div class='campo c4'><label for='a-complemento'>COMPLEMENTO</label><input type='text' id='a-complemento' name='complemento' placeholder='Sala 222'></div>
              <div class='campo c4'><label for='a-bairro'>BAIRRO</label><input type='text' id='a-bairro' name='bairro' placeholder='Cidade Universitária'></div>
              <div class='campo c2'><label for='a-cep'>CEP</label><input type='text' id='a-cep' name='cep' data-mascara='cep' placeholder='05508090'></div>
              <div class='campo c3'><label for='a-cidade'>CIDADE</label><input type='text' id='a-cidade' name='cidade' placeholder='São Paulo'></div>
              <div class='campo c3'><label for='a-estado'>ESTADO</label><input type='text' id='a-estado' name='estado' placeholder='SP'></div>
            </div>
          </fieldset>
          <fieldset>
            <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
            <div class='grade'>
              <div class='campo c3'><label for='a-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label><input type='text' id='a-cpf' name='cpf' data-mascara='cpf' placeholder='12345678909'></div>
              <div class='campo c4'><label for='a-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label><input type='text' id='a-rg' name='rg' placeholder='12.345.678-9'></div>
              <div class='campo c5'><label for='a-banco'>NOME DO BANCO</label><input type='text' id='a-banco' name='banco' placeholder='Banco do Brasil'></div>
              <div class='campo c3'><label for='a-agencia'>NÚMERO DA AGÊNCIA</label><input type='text' id='a-agencia' name='agencia' placeholder='1234'></div>
              <div class='campo c4'><label for='a-conta'>NÚMERO DA CONTA</label><input type='text' id='a-conta' name='conta' placeholder='98765-4'></div>
            </div>
          </fieldset>
          <button type='submit'>Enviar solicitação</button>
        </form>
      </section>

      <section class='painel' id='painel-docentes' hidden>
        <div class='erros' id='erros-docentes' hidden></div>
        <form id='form-docentes' data-aba='docentes' novalidate>
          <fieldset>
            <legend>SOLICITANTE E EVENTO</legend>
            <div class='grade'>
              <div class='campo c4'><label for='d-nome'>NOME COMPLETO - SEM ABREVIAR</label><input type='text' id='d-nome' name='nome' placeholder='Maria de Souza Silva'></div>
              <div class='campo c2'><label for='d-nusp'>N. USP</label><input type='text' id='d-nusp' name='n_usp' placeholder='1234567'></div>
              <div class='campo c6'><label for='d-programa'>PROGRAMA</label><input type='text' id='d-programa' name='programa' placeholder='Ciência da Computação'></div>
              <div class='campo c4'><label for='d-email'>E-MAIL</label><input type='text' id='d-email' name='email' placeholder='nome@usp.br'></div>
              <div class='campo c8'><label for='d-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label><input type='text' id='d-evento' name='evento' placeholder='Banca de defesa de qualificação'></div>
              <div class='campo c4'><label for='d-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label><input type='text' id='d-periodo' name='periodo' placeholder='1 a 3 de julho de 2025'></div>
              <div class='campo c3'><label for='d-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label><input type='text' id='d-cidade-evento' name='cidade_evento' placeholder='São Paulo'></div>
              <div class='campo c2'><label for='d-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label><input type='text' id='d-estado-evento' name='estado_evento' placeholder='SP'></div>
              <div class='campo c3'><label for='d-pais'>PAÍS DO EVENTO, EXAME OU DEFESA</label><input type='text' id='d-pais' name='pais' placeholder='Brasil'></div>
              <div class='campo c4'><label for='d-link'>LINK DO EVENTO, EXAME OU DEFESA</label><input type='text' id='d-link' name='link' placeholder='ime.usp.br/evento'></div>
              <div class='campo c3'><label for='d-valor'>VALOR SOLICITADO (R$)</label><input type='text' id='d-valor' name='valor' data-mascara='moeda' placeholder='150000'></div>
              <div class='campo c5'><label for='d-detalhamento'>DETALHAMENTO DO PEDIDO</label><textarea id='d-detalhamento' name='detalhamento' rows='2' placeholder='Passagem e diárias para a banca'></textarea></div>
              <div class='campo c4'><label for='d-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label><select id='d-apresentacao' name='apresentacao'><option value=''>Selecione</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></div>
            </div>
          </fieldset>
          <fieldset>
            <legend>ENDEREÇO DO SOLICITANTE</legend>
            <div class='grade'>
              <div class='campo c3'><label for='d-nascimento'>DATA DE NASCIMENTO</label><input type='text' id='d-nascimento' name='nascimento' data-mascara='data' placeholder='01021980'></div>
              <div class='campo c4'><label for='d-logradouro'>LOGRADOURO</label><input type='text' id='d-logradouro' name='logradouro' placeholder='Rua do Anfiteatro'></div>
              <div class='campo c1'><label for='d-numero'>NÚMERO</label><input type='text' id='d-numero' name='numero' placeholder='181'></div>
              <div class='campo c4'><label for='d-complemento'>COMPLEMENTO</label><input type='text' id='d-complemento' name='complemento' placeholder='Sala 222'></div>
              <div class='campo c4'><label for='d-bairro'>BAIRRO</label><input type='text' id='d-bairro' name='bairro' placeholder='Cidade Universitária'></div>
              <div class='campo c2'><label for='d-cep'>CEP</label><input type='text' id='d-cep' name='cep' data-mascara='cep' placeholder='05508090'></div>
              <div class='campo c3'><label for='d-cidade'>CIDADE</label><input type='text' id='d-cidade' name='cidade' placeholder='São Paulo'></div>
              <div class='campo c3'><label for='d-estado'>ESTADO</label><input type='text' id='d-estado' name='estado' placeholder='SP'></div>
            </div>
          </fieldset>
          <fieldset>
            <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
            <div class='grade'>
              <div class='campo c3'><label for='d-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label><input type='text' id='d-cpf' name='cpf' data-mascara='cpf' placeholder='12345678909'></div>
              <div class='campo c4'><label for='d-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label><input type='text' id='d-rg' name='rg' placeholder='12.345.678-9'></div>
              <div class='campo c5'><label for='d-banco'>NOME DO BANCO</label><input type='text' id='d-banco' name='banco' placeholder='Banco do Brasil'></div>
              <div class='campo c3'><label for='d-agencia'>NÚMERO DA AGÊNCIA</label><input type='text' id='d-agencia' name='agencia' placeholder='1234'></div>
              <div class='campo c4'><label for='d-conta'>NÚMERO DA CONTA</label><input type='text' id='d-conta' name='conta' placeholder='98765-4'></div>
            </div>
          </fieldset>
          <button type='submit'>Enviar solicitação</button>
        </form>
      </section>
    </div>

    <section id='confirmacao' hidden>
      <h2>Solicitação registrada</h2>
      <pre id='oficio'></pre>
    </section>
  </main>

  <script src='/app.js' defer></script>
</body>
</html>
