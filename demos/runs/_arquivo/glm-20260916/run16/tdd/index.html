<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <div class="marca">
    <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  </div>
  <div class="titulos">
    <h1 class="universidade">Universidade de São Paulo</h1>
    <p class="programa">Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>

<nav class="abas" aria-label="Escolha do formulário">
  <button type="button" class="aba ativa" data-aba="form-alunos">ALUNOS</button>
  <button type="button" class="aba" data-aba="form-docentes">DOCENTES</button>
</nav>

<main>
  <form id="form-alunos" class="formulario ativo" data-aba="ALUNOS" novalidate>
    <div class="erros" hidden></div>

    <section class="bloco">
      <h2>SOLICITANTE E EVENTO</h2>
      <div class="grade">
        <label class="campo l2"><span class="rotulo">NOME COMPLETO - SEM ABREVIAR</span>
          <input type="text" name="NOME COMPLETO - SEM ABREVIAR" placeholder="Ex.: Maria Souza Silva">
        </label>
        <label class="campo"><span class="rotulo">N. USP</span>
          <input type="text" name="N. USP" inputmode="numeric" placeholder="Ex.: 1234567">
        </label>
        <label class="campo"><span class="rotulo">PROGRAMA</span>
          <input type="text" name="PROGRAMA" placeholder="Ex.: Ciência da Computação">
        </label>
        <label class="campo"><span class="rotulo">NÍVEL</span>
          <select name="NÍVEL">
            <option value="">Selecione</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select>
        </label>
        <label class="campo"><span class="rotulo">TIPO DE AUXÍLIO</span>
          <select name="TIPO DE AUXÍLIO">
            <option value="">Selecione</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select>
        </label>
        <label class="campo l2"><span class="rotulo">E-MAIL</span>
          <input type="text" name="E-MAIL" placeholder="Ex.: maria.silva@usp.br">
        </label>
        <label class="campo l2"><span class="rotulo">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span>
          <input type="text" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" placeholder="Ex.: SBBD 2025">
        </label>
        <label class="campo l2"><span class="rotulo">PERÍODO DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="PERÍODO DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: 29/09/2025 a 02/10/2025">
        </label>
        <label class="campo"><span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="CIDADE DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: Rio de Janeiro">
        </label>
        <label class="campo"><span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="ESTADO DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: RJ">
        </label>
        <label class="campo"><span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: Brasil">
        </label>
        <label class="campo"><span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="LINK DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: sbbd.org.br">
        </label>
        <label class="campo"><span class="rotulo">VALOR SOLICITADO (R$)</span>
          <input type="text" name="VALOR SOLICITADO (R$)" inputmode="numeric" placeholder="Ex.: 150000">
        </label>
        <label class="campo l3"><span class="rotulo">DETALHAMENTO DO PEDIDO</span>
          <textarea name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Ex.: Inscrição no evento e passagem aérea."></textarea>
        </label>
        <label class="campo l2"><span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
          <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
            <option value="">Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <label class="campo"><span class="rotulo">DATA DE NASCIMENTO</span>
          <input type="text" name="DATA DE NASCIMENTO" inputmode="numeric" placeholder="Ex.: 01021980">
        </label>
        <label class="campo l2"><span class="rotulo">LOGRADOURO</span>
          <input type="text" name="LOGRADOURO" placeholder="Ex.: Rua do Anfiteatro">
        </label>
        <label class="campo"><span class="rotulo">NÚMERO</span>
          <input type="text" name="NÚMERO" placeholder="Ex.: 181">
        </label>
        <label class="campo"><span class="rotulo">COMPLEMENTO</span>
          <input type="text" name="COMPLEMENTO" placeholder="Ex.: Sala 222">
        </label>
        <label class="campo l2"><span class="rotulo">BAIRRO</span>
          <input type="text" name="BAIRRO" placeholder="Ex.: Cidade Universitária">
        </label>
        <label class="campo"><span class="rotulo">CEP</span>
          <input type="text" name="CEP" inputmode="numeric" placeholder="Ex.: 05508090">
        </label>
        <label class="campo"><span class="rotulo">CIDADE</span>
          <input type="text" name="CIDADE" placeholder="Ex.: São Paulo">
        </label>
        <label class="campo"><span class="rotulo">ESTADO</span>
          <input type="text" name="ESTADO" placeholder="Ex.: SP">
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <label class="campo l2"><span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" inputmode="numeric" placeholder="Ex.: 12345678909">
        </label>
        <label class="campo l2"><span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="Ex.: 12.345.678-9">
        </label>
        <label class="campo l2"><span class="rotulo">NOME DO BANCO</span>
          <input type="text" name="NOME DO BANCO" placeholder="Ex.: Banco do Brasil">
        </label>
        <label class="campo"><span class="rotulo">NÚMERO DA AGÊNCIA</span>
          <input type="text" name="NÚMERO DA AGÊNCIA" inputmode="numeric" placeholder="Ex.: 1234">
        </label>
        <label class="campo"><span class="rotulo">NÚMERO DA CONTA</span>
          <input type="text" name="NÚMERO DA CONTA" placeholder="Ex.: 98765-4">
        </label>
      </div>
    </section>

    <div class="acoes">
      <button type="submit" class="enviar">Enviar solicitação</button>
    </div>
  </form>

        <label class="campo"><span class="rotulo">CIDADE DO EVENTO, EXAME OU DEFESA</span>

        <label class="campo"><span class="rotulo">ESTADO DO EVENTO, EXAME OU DEFESA</span>

        <label class="campo"><span class="rotulo">PAÍS DO EVENTO, EXAME OU DEFESA</span>
          <input type="text" name="PAÍS DO EVENTO, EXAME OU DEFESA" placeholder="Ex.: Brasil">
        </label>
        <label class="campo"><span class="rotulo">LINK DO EVENTO, EXAME OU DEFESA</span>

        <label class="campo l2"><span class="rotulo">DETALHAMENTO DO PEDIDO</span>

        </label>
        <label class="campo l2"><span class="rotulo">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span>
          <select name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">

            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>ENDEREÇO DO SOLICITANTE</h2>
      <div class="grade">
        <label class="campo"><span class="rotulo">DATA DE NASCIMENTO</span>
          <input type="text" name="DATA DE NASCIMENTO" inputmode="numeric" placeholder="Ex.: 01021980">
        </label>
        <label class="campo l2"><span class="rotulo">LOGRADOURO</span>
          <input type="text" name="LOGRADOURO" placeholder="Ex.: Rua do Anfiteatro">
        </label>
        <label class="campo"><span class="rotulo">NÚMERO</span>
          <input type="text" name="NÚMERO" placeholder="Ex.: 181">
        </label>
        <label class="campo"><span class="rotulo">COMPLEMENTO</span>
          <input type="text" name="COMPLEMENTO" placeholder="Ex.: Sala 222">
        </label>
        <label class="campo l2"><span class="rotulo">BAIRRO</span>
          <input type="text" name="BAIRRO" placeholder="Ex.: Cidade Universitária">
        </label>
        <label class="campo"><span class="rotulo">CEP</span>
          <input type="text" name="CEP" inputmode="numeric" placeholder="Ex.: 05508090">
        </label>
        <label class="campo"><span class="rotulo">CIDADE</span>
          <input type="text" name="CIDADE" placeholder="Ex.: São Paulo">
        </label>
        <label class="campo"><span class="rotulo">ESTADO</span>
          <input type="text" name="ESTADO" placeholder="Ex.: SP">
        </label>
      </div>
    </section>

    <section class="bloco">
      <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
      <div class="grade">
        <label class="campo l2"><span class="rotulo">CPF (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" inputmode="numeric" placeholder="Ex.: 12345678909">
        </label>
        <label class="campo l2"><span class="rotulo">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span>
          <input type="text" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" placeholder="Ex.: 12.345.678-9">
        </label>
        <label class="campo l2"><span class="rotulo">NOME DO BANCO</span>
          <input type="text" name="NOME DO BANCO" placeholder="Ex.: Banco do Brasil">
        </label>
        <label class="campo"><span class="rotulo">NÚMERO DA AGÊNCIA</span>
          <input type="text" name="NÚMERO DA AGÊNCIA" inputmode="numeric" placeholder="Ex.: 1234">
        </label>
        <label class="campo"><span class="rotulo">NÚMERO DA CONTA</span>
          <input type="text" name="NÚMERO DA CONTA" placeholder="Ex.: 98765-4">
        </label>
      </div>
    </section>

    <div class="acoes">
      <button type="submit" class="enviar">Enviar solicitação</button>
    </div>
  </form>

  <section id="confirmacao" class="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre class="oficio" id="oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
