<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxílio Financeiro - Pós-Graduação IME-USP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div>
    <h1>Universidade de São Paulo</h1>
    <p>Programa de Pós-Graduação do Instituto de Matemática e Estatística</p>
  </div>
</header>
<div id="formularios">
  <nav class="abas" aria-label="Tipo de solicitante">
    <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>
  <main>
    <section class="painel" data-aba="alunos">
      <form data-aba="alunos" novalidate>
        <div class="erros" role="alert" hidden></div>
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grade">
            <div class="campo w10">
              <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input id="a-nome" name="NOME COMPLETO - SEM ABREVIAR" type="text" placeholder="Ex.: Maria Aparecida da Silva">
            </div>
            <div class="campo w4">
              <label for="a-nusp">N. USP</label>
              <input id="a-nusp" name="N. USP" type="text" inputmode="numeric" placeholder="Ex.: 1234567">
            </div>
            <div class="campo w6">
              <label for="a-programa">PROGRAMA</label>
              <input id="a-programa" name="PROGRAMA" type="text" placeholder="Ex.: Ciência da Computação">
            </div>
            <div class="campo w4">
              <label for="a-nivel">NÍVEL</label>
              <select id="a-nivel" name="NÍVEL">
                <option value="" selected>Ex.: Mestrado</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select>
            </div>
            <div class="campo w8">
              <label for="a-tipo">TIPO DE AUXÍLIO</label>
              <select id="a-tipo" name="TIPO DE AUXÍLIO">
                <option value="" selected>Ex.: Participação em evento</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select>
            </div>
            <div class="campo w8">
              <label for="a-email">E-MAIL</label>
              <input id="a-email" name="E-MAIL" type="text" placeholder="Ex.: maria.silva@usp.br">
            </div>
            <div class="campo w10">
              <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id="a-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" type="text" placeholder="Ex.: Congresso da SBC">
            </div>
            <div class="campo w10">
              <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: 10 a 14 de março de 2025">
            </div>
            <div class="campo w5">
              <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: Belo Horizonte">
            </div>
            <div class="campo w5">
              <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: MG">
            </div>
            <div class="campo w5">
              <label for="a-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: Brasil">
            </div>
            <div class="campo w5">
              <label for="a-link-evento">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-link-evento" name="LINK DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: https://csbc.sbc.org.br">
            </div>
            <div class="campo w5">
              <label for="a-valor">VALOR SOLICITADO (R$)</label>
              <input id="a-valor" name="VALOR SOLICITADO (R$)" type="text" inputmode="numeric" placeholder="Ex.: R$ 1.500,00">
            </div>
            <div class="campo w15">
              <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="a-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
                <option value="" selected>Ex.: Pôster</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
            <div class="campo w20">
              <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="a-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Ex.: Inscrição no evento e passagem aérea"></textarea>
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <div class="campo w5">
              <label for="a-nascimento">DATA DE NASCIMENTO</label>
              <input id="a-nascimento" name="DATA DE NASCIMENTO" type="text" inputmode="numeric" placeholder="Ex.: 01/02/1980">
            </div>
            <div class="campo w10">
              <label for="a-logradouro">LOGRADOURO</label>
              <input id="a-logradouro" name="LOGRADOURO" type="text" placeholder="Ex.: Rua do Matão">
            </div>
            <div class="campo w5">
              <label for="a-numero">NÚMERO</label>
              <input id="a-numero" name="NÚMERO" type="text" placeholder="Ex.: 1010">
            </div>
            <div class="campo w4">
              <label for="a-complemento">COMPLEMENTO</label>
              <input id="a-complemento" name="COMPLEMENTO" type="text" placeholder="Ex.: Apto 42, bloco B">
            </div>
            <div class="campo w4">
              <label for="a-bairro">BAIRRO</label>
              <input id="a-bairro" name="BAIRRO" type="text" placeholder="Ex.: Cidade Universitária">
            </div>
            <div class="campo w4">
              <label for="a-cep">CEP</label>
              <input id="a-cep" name="CEP" type="text" inputmode="numeric" placeholder="Ex.: 05508-090">
            </div>
            <div class="campo w4">
              <label for="a-cidade">CIDADE</label>
              <input id="a-cidade" name="CIDADE" type="text" placeholder="Ex.: São Paulo">
            </div>
            <div class="campo w4">
              <label for="a-estado">ESTADO</label>
              <input id="a-estado" name="ESTADO" type="text" placeholder="Ex.: SP">
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <div class="campo w4">
              <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="a-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" type="text" inputmode="numeric" placeholder="Ex.: 123.456.789-09">
            </div>
            <div class="campo w5">
              <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="a-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" type="text" placeholder="Ex.: 12.345.678-9">
            </div>
            <div class="campo w4">
              <label for="a-banco">NOME DO BANCO</label>
              <input id="a-banco" name="NOME DO BANCO" type="text" placeholder="Ex.: Banco do Brasil">
            </div>
            <div class="campo w3">
              <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
              <input id="a-agencia" name="NÚMERO DA AGÊNCIA" type="text" inputmode="numeric" placeholder="Ex.: 4321">
            </div>
            <div class="campo w4">
              <label for="a-conta">NÚMERO DA CONTA</label>
              <input id="a-conta" name="NÚMERO DA CONTA" type="text" placeholder="Ex.: 12345-6">
            </div>
          </div>
        </fieldset>
        <button class="enviar" type="submit">Enviar solicitação</button>
      </form>
    </section>
    <section class="painel" data-aba="docentes" hidden>
      <form data-aba="docentes" novalidate>
        <div class="erros" role="alert" hidden></div>
        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grade">
            <div class="campo w10">
              <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input id="d-nome" name="NOME COMPLETO - SEM ABREVIAR" type="text" placeholder="Ex.: João Cardoso de Oliveira">
            </div>
            <div class="campo w4">
              <label for="d-nusp">N. USP</label>
              <input id="d-nusp" name="N. USP" type="text" inputmode="numeric" placeholder="Ex.: 7654321">
            </div>
            <div class="campo w6">
              <label for="d-programa">PROGRAMA</label>
              <input id="d-programa" name="PROGRAMA" type="text" placeholder="Ex.: Estatística">
            </div>
            <div class="campo w5">
              <label for="d-email">E-MAIL</label>
              <input id="d-email" name="E-MAIL" type="text" placeholder="Ex.: joao.oliveira@usp.br">
            </div>
            <div class="campo w10">
              <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id="d-evento" name="NOME DO EVENTO / BANCA DE EXAME OU DEFESA" type="text" placeholder="Ex.: Banca de defesa de doutorado">
            </div>
            <div class="campo w5">
              <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-periodo" name="PERÍODO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: 3 e 4 de junho de 2025">
            </div>
            <div class="campo w5">
              <label for="d-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-cidade-evento" name="CIDADE DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: São Paulo">
            </div>
            <div class="campo w5">
              <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-estado-evento" name="ESTADO DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: SP">
            </div>
            <div class="campo w5">
              <label for="d-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-pais-evento" name="PAÍS DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: Brasil">
            </div>
            <div class="campo w5">
              <label for="d-link-evento">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-link-evento" name="LINK DO EVENTO, EXAME OU DEFESA" type="text" placeholder="Ex.: https://ime.usp.br">
            </div>
            <div class="campo w5">
              <label for="d-valor">VALOR SOLICITADO (R$)</label>
              <input id="d-valor" name="VALOR SOLICITADO (R$)" type="text" inputmode="numeric" placeholder="Ex.: R$ 1.500,00">
            </div>
            <div class="campo w15">
              <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="d-apresentacao" name="IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?">
                <option value="" selected>Ex.: Pôster</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
            <div class="campo w20">
              <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="d-detalhamento" name="DETALHAMENTO DO PEDIDO" rows="2" placeholder="Ex.: Diárias e passagem para memória externa da banca"></textarea>
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grade">
            <div class="campo w5">
              <label for="d-nascimento">DATA DE NASCIMENTO</label>
              <input id="d-nascimento" name="DATA DE NASCIMENTO" type="text" inputmode="numeric" placeholder="Ex.: 01/02/1980">
            </div>
            <div class="campo w10">
              <label for="d-logradouro">LOGRADOURO</label>
              <input id="d-logradouro" name="LOGRADOURO" type="text" placeholder="Ex.: Rua do Anfiteatro">
            </div>
            <div class="campo w5">
              <label for="d-numero">NÚMERO</label>
              <input id="d-numero" name="NÚMERO" type="text" placeholder="Ex.: 181">
            </div>
            <div class="campo w4">
              <label for="d-complemento">COMPLEMENTO</label>
              <input id="d-complemento" name="COMPLEMENTO" type="text" placeholder="Ex.: Sala 204, bloco C">
            </div>
            <div class="campo w4">
              <label for="d-bairro">BAIRRO</label>
              <input id="d-bairro" name="BAIRRO" type="text" placeholder="Ex.: Butantã">
            </div>
            <div class="campo w4">
              <label for="d-cep">CEP</label>
              <input id="d-cep" name="CEP" type="text" inputmode="numeric" placeholder="Ex.: 05508-090">
            </div>
            <div class="campo w4">
              <label for="d-cidade">CIDADE</label>
              <input id="d-cidade" name="CIDADE" type="text" placeholder="Ex.: São Paulo">
            </div>
            <div class="campo w4">
              <label for="d-estado">ESTADO</label>
              <input id="d-estado" name="ESTADO" type="text" placeholder="Ex.: SP">
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grade">
            <div class="campo w4">
              <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="d-cpf" name="CPF (SEPARADOS POR PONTOS E TRAÇO)" type="text" inputmode="numeric" placeholder="Ex.: 123.456.789-09">
            </div>
            <div class="campo w5">
              <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="d-rg" name="RG / RNM (SEPARADOS POR PONTOS E TRAÇO)" type="text" placeholder="Ex.: 98.765.432-1">
            </div>
            <div class="campo w4">
              <label for="d-banco">NOME DO BANCO</label>
              <input id="d-banco" name="NOME DO BANCO" type="text" placeholder="Ex.: Caixa Econômica Federal">
            </div>
            <div class="campo w3">
              <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
              <input id="d-agencia" name="NÚMERO DA AGÊNCIA" type="text" inputmode="numeric" placeholder="Ex.: 1234">
            </div>
            <div class="campo w4">
              <label for="d-conta">NÚMERO DA CONTA</label>
              <input id="d-conta" name="NÚMERO DA CONTA" type="text" placeholder="Ex.: 65432-1">
            </div>
          </div>
        </fieldset>
        <button class="enviar" type="submit">Enviar solicitação</button>
      </form>
    </section>
  </main>
</div>
<section id="confirmacao" hidden>
  <h2>Solicitação registrada</h2>
  <pre class="oficio" id="oficio"></pre>
</section>
<script src="app.js"></script>
</body>
</html>
