<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel='stylesheet' href='style.css'>
</head>
<body>
  <header class='cabecalho'>
    <div class='marca'>
      <img class='logo' src='assets/usp-logo.png' alt='Universidade de São Paulo'>
      <div class='nomes'>
        <span class='universidade'>Universidade de São Paulo</span>
        <span class='programa'>Pós-Graduação do Instituto de Matemática e Estatística (IME)</span>
      </div>
    </div>
  </header>

  <main>
    <nav class='abas' aria-label='Tipo de solicitação'>
      <button type='button' class='aba ativa' data-aba='alunos'>ALUNOS</button>
      <button type='button' class='aba' data-aba='docentes'>DOCENTES</button>
    </nav>

    <form id='form-alunos' class='formulario' data-aba='alunos' novalidate>
      <div class='erros' role='alert' hidden></div>

      <fieldset class='bloco b1'>
        <h2 class='titulo-bloco'>SOLICITANTE E EVENTO</h2>

        <div class='campo c6'>
          <label for='a-nome'>NOME COMPLETO - SEM ABREVIAR</label>
          <input id='a-nome' name='nome' type='text' data-rotulo='NOME COMPLETO - SEM ABREVIAR' placeholder='Maria Souza da Silva'>
        </div>
        <div class='campo c2'>
          <label for='a-nusp'>N. USP</label>
          <input id='a-nusp' name='n_usp' type='text' data-rotulo='N. USP' placeholder='1234567'>
        </div>
        <div class='campo c4'>
          <label for='a-programa'>PROGRAMA</label>
          <input id='a-programa' name='programa' type='text' data-rotulo='PROGRAMA' placeholder='Ciência da Computação'>
        </div>
        <div class='campo c3'>
          <label for='a-nivel'>NÍVEL</label>
          <select id='a-nivel' name='nivel' data-rotulo='NÍVEL'>
            <option value=''>Selecione</option>
            <option>Mestrado</option>
            <option>Doutorado</option>
          </select>
        </div>
        <div class='campo c4'>
          <label for='a-tipo'>TIPO DE AUXÍLIO</label>
          <select id='a-tipo' name='tipo_auxilio' data-rotulo='TIPO DE AUXÍLIO'>
            <option value=''>Selecione</option>
            <option>Participação em evento</option>
            <option>Banca de exame ou defesa</option>
            <option>Outro</option>
          </select>
        </div>
        <div class='campo c5'>
          <label for='a-email'>E-MAIL</label>
          <input id='a-email' name='email' type='text' data-rotulo='E-MAIL' placeholder='maria.souza@usp.br'>
        </div>
        <div class='campo c6'>
          <label for='a-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input id='a-evento' name='evento' type='text' data-rotulo='NOME DO EVENTO / BANCA DE EXAME OU DEFESA' placeholder='SBES 2025'>
        </div>
        <div class='campo c6'>
          <label for='a-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input id='a-periodo' name='periodo' type='text' data-rotulo='PERÍODO DO EVENTO, EXAME OU DEFESA' placeholder='15/09/2025 a 19/09/2025'>
        </div>
      </fieldset>

      <fieldset class='bloco b3'>
        <h2 class='titulo-bloco'>ENDEREÇO DO SOLICITANTE</h2>

        <div class='campo c3'>
          <label for='a-nascimento'>DATA DE NASCIMENTO</label>
          <input id='a-nascimento' name='nascimento' type='text' data-rotulo='DATA DE NASCIMENTO' data-formato='data' placeholder='01/02/1980'>
        </div>
        <div class='campo c5'>
          <label for='a-logradouro'>LOGRADOURO</label>
          <input id='a-logradouro' name='logradouro' type='text' data-rotulo='LOGRADOURO' placeholder='Rua do Anfiteatro'>
        </div>
        <div class='campo c2'>
          <label for='a-numero'>NÚMERO</label>
          <input id='a-numero' name='numero' type='text' data-rotulo='NÚMERO' placeholder='375'>
        </div>
        <div class='campo c2'>
          <label for='a-complemento'>COMPLEMENTO</label>
          <input id='a-complemento' name='complemento' type='text' data-rotulo='COMPLEMENTO' placeholder='Sala 2'>
        </div>
        <div class='campo c4'>
          <label for='a-bairro'>BAIRRO</label>
          <input id='a-bairro' name='bairro' type='text' data-rotulo='BAIRRO' placeholder='Butantã'>
        </div>
        <div class='campo c3'>
          <label for='a-cep'>CEP</label>
          <input id='a-cep' name='cep' type='text' data-rotulo='CEP' data-formato='cep' placeholder='05508-090'>
        </div>
        <div class='campo c3'>
          <label for='a-cidade'>CIDADE</label>
          <input id='a-cidade' name='cidade' type='text' data-rotulo='CIDADE' placeholder='São Paulo'>
        </div>
        <div class='campo c2'>
          <label for='a-estado'>ESTADO</label>
          <input id='a-estado' name='estado' type='text' data-rotulo='ESTADO' placeholder='SP'>
        </div>
      </fieldset>

      <fieldset class='bloco b4'>
        <h2 class='titulo-bloco'>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>

        <div class='campo c3'>
          <label for='a-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id='a-cpf' name='cpf' type='text' data-rotulo='CPF (SEPARADOS POR PONTOS E TRAÇO)' data-formato='cpf' placeholder='123.456.789-09'>
        </div>
        <div class='campo c3'>
          <label for='a-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id='a-rg' name='rg_rnm' type='text' data-rotulo='RG / RNM (SEPARADOS POR PONTOS E TRAÇO)' placeholder='12.345.678-9'>
        </div>
        <div class='campo c2'>
          <label for='a-banco'>NOME DO BANCO</label>
          <input id='a-banco' name='banco' type='text' data-rotulo='NOME DO BANCO' placeholder='Banco do Brasil'>
        </div>
        <div class='campo c2'>
          <label for='a-agencia'>NÚMERO DA AGÊNCIA</label>
          <input id='a-agencia' name='agencia' type='text' data-rotulo='NÚMERO DA AGÊNCIA' placeholder='0123'>
        </div>
        <div class='campo c2'>
          <label for='a-conta'>NÚMERO DA CONTA</label>
          <input id='a-conta' name='conta' type='text' data-rotulo='NÚMERO DA CONTA' placeholder='45678-9'>
        </div>
      </fieldset>

      <fieldset class='bloco b2'>
        <div class='campo c4'>
          <label for='a-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input id='a-cidade-evento' name='cidade_evento' type='text' data-rotulo='CIDADE DO EVENTO, EXAME OU DEFESA' placeholder='Porto Alegre'>
        </div>
        <div class='campo c2'>
          <label for='a-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input id='a-estado-evento' name='estado_evento' type='text' data-rotulo='ESTADO DO EVENTO, EXAME OU DEFESA' placeholder='RS'>
        </div>
        <div class='campo c3'>
          <label for='a-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input id='a-pais-evento' name='pais_evento' type='text' data-rotulo='PAÍS DO EVENTO, EXAME OU DEFESA' placeholder='Brasil'>
        </div>
        <div class='campo c3'>
          <label for='a-link-evento'>LINK DO EVENTO, EXAME OU DEFESA</label>
          <input id='a-link-evento' name='link_evento' type='text' data-rotulo='LINK DO EVENTO, EXAME OU DEFESA' placeholder='https://sbes.org.br/2025'>
        </div>
        <div class='campo c3'>
          <label for='a-valor'>VALOR SOLICITADO (R$)</label>
          <input id='a-valor' name='valor' type='text' data-rotulo='VALOR SOLICITADO (R$)' data-formato='moeda' placeholder='R$ 1.500,00'>
        </div>
        <div class='campo c5'>
          <label for='a-detalhamento'>DETALHAMENTO DO PEDIDO</label>
          <textarea id='a-detalhamento' name='detalhamento' rows='2' data-rotulo='DETALHAMENTO DO PEDIDO' placeholder='Inscrição e passagem aérea para o evento.'></textarea>
        </div>
        <div class='campo c4'>
          <label for='a-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id='a-apresentacao' name='apresentacao' data-rotulo='IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?'>
            <option value=''>Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </div>
      </fieldset>

      <button type='submit'>Enviar solicitação</button>
    </form>

    <form id='form-docentes' class='formulario' data-aba='docentes' novalidate hidden>
      <div class='erros' role='alert' hidden></div>

      <fieldset class='bloco b1'>
        <h2 class='titulo-bloco'>SOLICITANTE E EVENTO</h2>

        <div class='campo c6'>
          <label for='d-nome'>NOME COMPLETO - SEM ABREVIAR</label>
          <input id='d-nome' name='nome' type='text' data-rotulo='NOME COMPLETO - SEM ABREVIAR' placeholder='João Prado Martins'>
        </div>
        <div class='campo c2'>
          <label for='d-nusp'>N. USP</label>
          <input id='d-nusp' name='n_usp' type='text' data-rotulo='N. USP' placeholder='1234567'>
        </div>
        <div class='campo c4'>
          <label for='d-programa'>PROGRAMA</label>
          <input id='d-programa' name='programa' type='text' data-rotulo='PROGRAMA' placeholder='Física Matemática'>
        </div>
        <div class='campo c6'>
          <label for='d-email'>E-MAIL</label>
          <input id='d-email' name='email' type='text' data-rotulo='E-MAIL' placeholder='joao.prado@ime.usp.br'>
        </div>
        <div class='campo c6'>
          <label for='d-evento'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
          <input id='d-evento' name='evento' type='text' data-rotulo='NOME DO EVENTO / BANCA DE EXAME OU DEFESA' placeholder='Banca de mestrado de Ana Lima'>
        </div>
        <div class='campo c4'>
          <label for='d-periodo'>PERÍODO DO EVENTO, EXAME OU DEFESA</label>
          <input id='d-periodo' name='periodo' type='text' data-rotulo='PERÍODO DO EVENTO, EXAME OU DEFESA' placeholder='03/11/2025'>
        </div>
      </fieldset>

      <fieldset class='bloco b3'>
        <h2 class='titulo-bloco'>ENDEREÇO DO SOLICITANTE</h2>

        <div class='campo c3'>
          <label for='d-nascimento'>DATA DE NASCIMENTO</label>
          <input id='d-nascimento' name='nascimento' type='text' data-rotulo='DATA DE NASCIMENTO' data-formato='data' placeholder='10/12/1975'>
        </div>
        <div class='campo c5'>
          <label for='d-logradouro'>LOGRADOURO</label>
          <input id='d-logradouro' name='logradouro' type='text' data-rotulo='LOGRADOURO' placeholder='Av. Professor Lineu Prestes'>
        </div>
        <div class='campo c2'>
          <label for='d-numero'>NÚMERO</label>
          <input id='d-numero' name='numero' type='text' data-rotulo='NÚMERO' placeholder='910'>
        </div>
        <div class='campo c2'>
          <label for='d-complemento'>COMPLEMENTO</label>
          <input id='d-complemento' name='complemento' type='text' data-rotulo='COMPLEMENTO' placeholder='Sala 2'>
        </div>
        <div class='campo c4'>
          <label for='d-bairro'>BAIRRO</label>
          <input id='d-bairro' name='bairro' type='text' data-rotulo='BAIRRO' placeholder='Cidade Universitária'>
        </div>
        <div class='campo c3'>
          <label for='d-cep'>CEP</label>
          <input id='d-cep' name='cep' type='text' data-rotulo='CEP' data-formato='cep' placeholder='05508-000'>
        </div>
        <div class='campo c3'>
          <label for='d-cidade'>CIDADE</label>
          <input id='d-cidade' name='cidade' type='text' data-rotulo='CIDADE' placeholder='São Paulo'>
        </div>
        <div class='campo c2'>
          <label for='d-estado'>ESTADO</label>
          <input id='d-estado' name='estado' type='text' data-rotulo='ESTADO' placeholder='SP'>
        </div>
      </fieldset>

      <fieldset class='bloco b4'>
        <h2 class='titulo-bloco'>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>

        <div class='campo c3'>
          <label for='d-cpf'>CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id='d-cpf' name='cpf' type='text' data-rotulo='CPF (SEPARADOS POR PONTOS E TRAÇO)' data-formato='cpf' placeholder='987.654.321-00'>
        </div>
        <div class='campo c3'>
          <label for='d-rg'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
          <input id='d-rg' name='rg_rnm' type='text' data-rotulo='RG / RNM (SEPARADOS POR PONTOS E TRAÇO)' placeholder='98.765.432-1'>
        </div>
        <div class='campo c2'>
          <label for='d-banco'>NOME DO BANCO</label>
          <input id='d-banco' name='banco' type='text' data-rotulo='NOME DO BANCO' placeholder='Itaú'>
        </div>
        <div class='campo c2'>
          <label for='d-agencia'>NÚMERO DA AGÊNCIA</label>
          <input id='d-agencia' name='agencia' type='text' data-rotulo='NÚMERO DA AGÊNCIA' placeholder='0999'>
        </div>
        <div class='campo c2'>
          <label for='d-conta'>NÚMERO DA CONTA</label>
          <input id='d-conta' name='conta' type='text' data-rotulo='NÚMERO DA CONTA' placeholder='11223-3'>
        </div>
      </fieldset>

      <fieldset class='bloco b2'>
        <div class='campo c3'>
          <label for='d-cidade-evento'>CIDADE DO EVENTO, EXAME OU DEFESA</label>
          <input id='d-cidade-evento' name='cidade_evento' type='text' data-rotulo='CIDADE DO EVENTO, EXAME OU DEFESA' placeholder='São Paulo'>
        </div>
        <div class='campo c2'>
          <label for='d-estado-evento'>ESTADO DO EVENTO, EXAME OU DEFESA</label>
          <input id='d-estado-evento' name='estado_evento' type='text' data-rotulo='ESTADO DO EVENTO, EXAME OU DEFESA' placeholder='SP'>
        </div>
        <div class='campo c3'>
          <label for='d-pais-evento'>PAÍS DO EVENTO, EXAME OU DEFESA</label>
          <input id='d-pais-evento' name='pais_evento' type='text' data-rotulo='PAÍS DO EVENTO, EXAME OU DEFESA' placeholder='Brasil'>
        </div>
        <div class='campo c4'>
          <label for='d-link-evento'>LINK DO EVENTO, EXAME OU DEFESA</label>
          <input id='d-link-evento' name='link_evento' type='text' data-rotulo='LINK DO EVENTO, EXAME OU DEFESA' placeholder='https://ime.usp.br/'>
        </div>
        <div class='campo c3'>
          <label for='d-valor'>VALOR SOLICITADO (R$)</label>
          <input id='d-valor' name='valor' type='text' data-rotulo='VALOR SOLICITADO (R$)' data-formato='moeda' placeholder='R$ 300,00'>
        </div>
        <div class='campo c5'>
          <label for='d-apresentacao'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
          <select id='d-apresentacao' name='apresentacao' data-rotulo='IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?'>
            <option value=''>Selecione</option>
            <option>Pôster</option>
            <option>Apresentação oral</option>
            <option>Outra</option>
            <option>Não irá apresentar trabalho</option>
          </select>
        </div>
        <div class='campo c12'>
          <label for='d-detalhamento'>DETALHAMENTO DO PEDIDO</label>
          <textarea id='d-detalhamento' name='detalhamento' rows='2' data-rotulo='DETALHAMENTO DO PEDIDO' placeholder='Passagem rodoviária para participação em banca.'></textarea>
        </div>
      </fieldset>

      <button type='submit'>Enviar solicitação</button>
    </form>

    <section id='confirmacao' class='confirmacao' hidden>
      <h1>Solicitação registrada</h1>
      <pre id='oficio'></pre>
    </section>
  </main>

  <script src='app.js'></script>
</body>
</html>
