<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel='stylesheet' href='style.css'>
</head>
<body>
  <header class='cabecalho'>
    <img class='logo' src='assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'>
    <div class='cabecalho-texto'>
      <h1>Universidade de São Paulo</h1>
      <p class='subtitulo'>Programa de Pós-Graduação do Instituto de Matemática e Estatística</p>
    </div>
  </header>
  <main>
    <div id='area-formulario'>
      <nav class='abas' aria-label='Tipo de solicitante'>
        <button type='button' class='aba ativa' data-aba='alunos' aria-selected='true'>ALUNOS</button>
        <button type='button' class='aba' data-aba='docentes' aria-selected='false'>DOCENTES</button>
      </nav>
      <form id='form-alunos' class='formulario' aria-label='Solicitação de auxílio financeiro - Alunos'></form>
      <form id='form-docentes' class='formulario' aria-label='Solicitação de auxílio financeiro - Docentes' hidden></form>
    </div>
    <section id='confirmacao' class='confirmacao' hidden>
      <h2>Solicitação registrada</h2>
      <pre id='oficio' class='oficio'></pre>
    </section>
  </main>
  <script src='app.js'></script>
</body>
</html>
