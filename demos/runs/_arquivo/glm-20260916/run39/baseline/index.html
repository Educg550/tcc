<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div class="titulos">
      <span class="universidade">Universidade de São Paulo</span>
      <span class="programa">Pós-Graduação do Instituto de Matemática e Estatística</span>
    </div>
  </header>

  <main class="conteudo">
    <nav class="abas" id="abas">
      <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
      <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
    </nav>

    <section id="formulario">
      <form id="form-alunos" class="form" data-perfil="alunos" novalidate>
        <div class="erros" hidden></div>

        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grid">
            <div class="campo c2">
              <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input id="a-nome" name="nome" type="text" placeholder="Maria de Souza Santos">
            </div>
            <div class="campo">
              <label for="a-n-usp">N. USP</label>
              <input id="a-n-usp" name="n_usp" type="text" inputmode="numeric" placeholder="8765432">
            </div>
            <div class="campo">
              <label for="a-programa">PROGRAMA</label>
              <input id="a-programa" name="programa" type="text" placeholder="Ciência da Computação">
            </div>
            <div class="campo">
              <label for="a-nivel">NÍVEL</label>
              <select id="a-nivel" name="nivel">
                <option value="" selected>Selecione</option>
                <option value="Mestrado">Mestrado</option>
                <option value="Doutorado">Doutorado</option>
              </select>
            </div>
            <div class="campo">
              <label for="a-tipo">TIPO DE AUXÍLIO</label>
              <select id="a-tipo" name="tipo_auxilio">
                <option value="" selected>Selecione</option>
                <option value="Participação em evento">Participação em evento</option>
                <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
                <option value="Outro">Outro</option>
              </select>
            </div>
            <div class="campo c2">
              <label for="a-email">E-MAIL</label>
              <input id="a-email" name="email" type="email" placeholder="maria.santos@usp.br">
            </div>
            <div class="campo c2">
              <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id="a-evento" name="evento" type="text" placeholder="Congresso da SBC">
            </div>
            <div class="campo">
              <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-periodo" name="periodo" type="text" placeholder="10/03/2025 a 14/03/2025">
            </div>
            <div class="campo">
              <label for="a-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-cidade-evento" name="cidade_evento" type="text" placeholder="Rio de Janeiro">
            </div>
            <div class="campo">
              <label for="a-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-estado-evento" name="estado_evento" type="text" placeholder="RJ">
            </div>
            <div class="campo">
              <label for="a-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-pais-evento" name="pais_evento" type="text" placeholder="Brasil">
            </div>
            <div class="campo c2">
              <label for="a-link-evento">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id="a-link-evento" name="link_evento" type="text" placeholder="https://www.exemplo.br/evento">
            </div>
            <div class="campo">
              <label for="a-valor">VALOR SOLICITADO (R$)</label>
              <input id="a-valor" name="valor" type="text" inputmode="numeric" data-formato="valor" placeholder="150000">
            </div>
            <div class="campo c2">
              <label for="a-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="a-detalhamento" name="detalhamento" rows="2" placeholder="Inscrição no evento e passagem aérea"></textarea>
            </div>
            <div class="campo">
              <label for="a-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="a-apresentacao" name="apresentacao">
                <option value="" selected>Selecione</option>
                <option value="Pôster">Pôster</option>
                <option value="Apresentação oral">Apresentação oral</option>
                <option value="Outra">Outra</option>
                <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
              </select>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grid grid-5">
            <div class="campo">
              <label for="a-data-nascimento">DATA DE NASCIMENTO</label>
              <input id="a-data-nascimento" name="data_nascimento" type="text" inputmode="numeric" data-formato="data" placeholder="01021980">
            </div>
            <div class="campo c2">
              <label for="a-logradouro">LOGRADOURO</label>
              <input id="a-logradouro" name="logradouro" type="text" placeholder="Rua do Anfiteatro">
            </div>
            <div class="campo">
              <label for="a-numero">NÚMERO</label>
              <input id="a-numero" name="numero" type="text" placeholder="181">
            </div>
            <div class="campo">
              <label for="a-complemento">COMPLEMENTO</label>
              <input id="a-complemento" name="complemento" type="text" placeholder="Apto 52">
            </div>
            <div class="campo c2">
              <label for="a-bairro">BAIRRO</label>
              <input id="a-bairro" name="bairro" type="text" placeholder="Butantã">
            </div>
            <div class="campo">
              <label for="a-cep">CEP</label>
              <input id="a-cep" name="cep" type="text" inputmode="numeric" data-formato="cep" placeholder="05508090">
            </div>
            <div class="campo">
              <label for="a-cidade">CIDADE</label>
              <input id="a-cidade" name="cidade" type="text" placeholder="São Paulo">
            </div>
            <div class="campo">
              <label for="a-estado">ESTADO</label>
              <input id="a-estado" name="estado" type="text" placeholder="SP">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grid">
            <div class="campo">
              <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="a-cpf" name="cpf" type="text" inputmode="numeric" data-formato="cpf" placeholder="12345678909">
            </div>
            <div class="campo">
              <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="a-rg" name="rg" type="text" placeholder="12.345.678-9">
            </div>
            <div class="campo c2">
              <label for="a-banco">NOME DO BANCO</label>
              <input id="a-banco" name="banco" type="text" placeholder="Banco do Brasil">
            </div>
            <div class="campo c2">
              <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
              <input id="a-agencia" name="agencia" type="text" inputmode="numeric" placeholder="1234">
            </div>
            <div class="campo c2">
              <label for="a-conta">NÚMERO DA CONTA</label>
              <input id="a-conta" name="conta" type="text" placeholder="12345-6">
            </div>
          </div>
        </fieldset>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>

      <form id="form-docentes" class="form" data-perfil="docentes" novalidate hidden>
        <div class="erros" hidden></div>

        <fieldset>
          <legend>SOLICITANTE E EVENTO</legend>
          <div class="grid">
            <div class="campo c2">
              <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input id="d-nome" name="nome" type="text" placeholder="João Cardoso da Silva">
            </div>
            <div class="campo">
              <label for="d-n-usp">N. USP</label>
              <input id="d-n-usp" name="n_usp" type="text" inputmode="numeric" placeholder="1234567">
            </div>
            <div class="campo">
              <label for="d-programa">PROGRAMA</label>
              <input id="d-programa" name="programa" type="text" placeholder="Matemática Aplicada">
            </div>
            <div class="campo c2">
              <label for="d-email">E-MAIL</label>
              <input id="d-email" name="email" type="email" placeholder="joao.silva@ime.usp.br">
            </div>
            <div class="campo c2">
              <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id="d-evento" name="evento" type="text" placeholder="Banca de defesa de mestrado">
            </div>
            <div class="campo">
              <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-periodo" name="periodo" type="text" placeholder="22/04/2025 a 22/04/2025">
            </div>
            <div class="campo">
              <label for="d-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-cidade-evento" name="cidade_evento" type="text" placeholder="São Paulo">
            </div>
            <div class="campo">
              <label for="d-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-estado-evento" name="estado_evento" type="text" placeholder="SP">
            </div>
            <div class="campo">
              <label for="d-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-pais-evento" name="pais_evento" type="text" placeholder="Brasil">
            </div>
            <div class="campo c2">
              <label for="d-link-evento">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id="d-link-evento" name="link_evento" type="text" placeholder="https://www.exemplo.br/defesa">
            </div>
            <div class="campo">
              <label for="d-valor">VALOR SOLICITADO (R$)</label>
              <input id="d-valor" name="valor" type="text" inputmode="numeric" data-formato="valor" placeholder="150000">
            </div>
            <div class="campo">
              <label for="d-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="d-apresentacao" name="apresentacao">
                <option value="" selected>Selecione</option>
                <option value="Pôster">Pôster</option>
                <option value="Apresentação oral">Apresentação oral</option>
                <option value="Outra">Outra</option>
                <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
              </select>
            </div>
            <div class="campo c4">
              <label for="d-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="d-detalhamento" name="detalhamento" rows="2" placeholder="Passagem aérea para participação em banca"></textarea>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>ENDEREÇO DO SOLICITANTE</legend>
          <div class="grid grid-5">
            <div class="campo">
              <label for="d-data-nascimento">DATA DE NASCIMENTO</label>
              <input id="d-data-nascimento" name="data_nascimento" type="text" inputmode="numeric" data-formato="data" placeholder="01021980">
            </div>
            <div class="campo c2">
              <label for="d-logradouro">LOGRADOURO</label>
              <input id="d-logradouro" name="logradouro" type="text" placeholder="Rua do Anfiteatro">
            </div>
            <div class="campo">
              <label for="d-numero">NÚMERO</label>
              <input id="d-numero" name="numero" type="text" placeholder="181">
            </div>
            <div class="campo">
              <label for="d-complemento">COMPLEMENTO</label>
              <input id="d-complemento" name="complemento" type="text" placeholder="Sala 204">
            </div>
            <div class="campo c2">
              <label for="d-bairro">BAIRRO</label>
              <input id="d-bairro" name="bairro" type="text" placeholder="Cidade Universitária">
            </div>
            <div class="campo">
              <label for="d-cep">CEP</label>
              <input id="d-cep" name="cep" type="text" inputmode="numeric" data-formato="cep" placeholder="05508090">
            </div>
            <div class="campo">
              <label for="d-cidade">CIDADE</label>
              <input id="d-cidade" name="cidade" type="text" placeholder="São Paulo">
            </div>
            <div class="campo">
              <label for="d-estado">ESTADO</label>
              <input id="d-estado" name="estado" type="text" placeholder="SP">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
          <div class="grid">
            <div class="campo">
              <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="d-cpf" name="cpf" type="text" inputmode="numeric" data-formato="cpf" placeholder="98765432100">
            </div>
            <div class="campo">
              <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="d-rg" name="rg" type="text" placeholder="98.765.432-1">
            </div>
            <div class="campo c2">
              <label for="d-banco">NOME DO BANCO</label>
              <input id="d-banco" name="banco" type="text" placeholder="Banco do Brasil">
            </div>
            <div class="campo c2">
              <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
              <input id="d-agencia" name="agencia" type="text" inputmode="numeric" placeholder="4321">
            </div>
            <div class="campo c2">
              <label for="d-conta">NÚMERO DA CONTA</label>
              <input id="d-conta" name="conta" type="text" placeholder="65432-1">
            </div>
          </div>
        </fieldset>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>

    <section id="confirmacao" hidden>
      <h2>Solicitação registrada</h2>
      <pre id="oficio"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
