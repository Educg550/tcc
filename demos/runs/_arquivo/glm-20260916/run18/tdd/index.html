<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pós-Graduação IME-USP · Solicitação de Auxílio Financeiro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
  <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div>
    <h1>Universidade de São Paulo</h1>
    <p class="subtitulo">Pós-Graduação do IME · Solicitação de Auxílio Financeiro</p>
  </div>
</header>

<main>
  <div id="formulario">
    <nav class="abas">
      <button type="button" class="aba ativa" data-alvo="painel-alunos">ALUNOS</button>
      <button type="button" class="aba" data-alvo="painel-docentes">DOCENTES</button>
    </nav>

    <section class="painel" id="painel-alunos">
      <form data-aba="ALUNOS" novalidate>
        <div class="erros" role="alert" hidden></div>

        <section class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="campos">
            <div class="campo c4">
              <label for="al-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input id="al-nome" name="nome_completo" type="text" placeholder="Ex.: Maria de Souza">
            </div>
            <div class="campo c2">
              <label for="al-nusp">N. USP</label>
              <input id="al-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="Ex.: 1234567">
            </div>
            <div class="campo c3">
              <label for="al-programa">PROGRAMA</label>
              <input id="al-programa" name="programa" type="text" placeholder="Ex.: Ciência da Computação">
            </div>
            <div class="campo c3">
              <label for="al-nivel">NÍVEL</label>
              <select id="al-nivel" name="nivel" placeholder="Ex.: Mestrado">
                <option value="">Selecione o nível</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select>
            </div>

            <div class="campo c3">
              <label for="al-tipo">TIPO DE AUXÍLIO</label>
              <select id="al-tipo" name="tipo_auxilio" placeholder="Ex.: Participação em evento">
                <option value="">Selecione o tipo</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select>
            </div>
            <div class="campo c4">
              <label for="al-email">E-MAIL</label>
              <input id="al-email" name="email" type="text" placeholder="Ex.: maria@usp.br">
            </div>
            <div class="campo c5">
              <label for="al-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id="al-evento" name="nome_evento" type="text" placeholder="Ex.: Congresso Brasileiro de Computação">
            </div>

            <div class="campo c4">
              <label for="al-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id="al-periodo" name="periodo_evento" type="text" placeholder="Ex.: 10/03/2025 a 15/03/2025">
            </div>
            <div class="campo c3">
              <label for="al-cidade-ev">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id="al-cidade-ev" name="cidade_evento" type="text" placeholder="Ex.: São Paulo">
            </div>
            <div class="campo c2">
              <label for="al-estado-ev">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id="al-estado-ev" name="estado_evento" type="text" placeholder="Ex.: SP">
            </div>
            <div class="campo c3">
              <label for="al-pais-ev">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id="al-pais-ev" name="pais_evento" type="text" placeholder="Ex.: Brasil">
            </div>

            <div class="campo c5">
              <label for="al-link">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id="al-link" name="link_evento" type="text" placeholder="Ex.: https://evento.org.br/2025">
            </div>
            <div class="campo c3">
              <label for="al-valor">VALOR SOLICITADO (R$)</label>
              <input id="al-valor" name="valor_solicitado" type="text" inputmode="numeric" placeholder="Ex.: 150000">
            </div>

            <div class="campo c8">
              <label for="al-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="al-detalhamento" name="detalhamento" rows="2" placeholder="Ex.: Passagens aéreas e inscrição no evento."></textarea>
            </div>
            <div class="campo c4">
              <label for="al-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="al-apresentacao" name="apresentacao_trabalho" placeholder="Ex.: Pôster">
                <option value="">Selecione uma opção</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
          </div>
        </section>

        <section class="bloco">
          <h2>ENDEREÇO DO SOLICITANTE</h2>
          <div class="campos">
            <div class="campo c2">
              <label for="al-data">DATA DE NASCIMENTO</label>
              <input id="al-data" name="data_nascimento" type="text" inputmode="numeric" placeholder="Ex.: 01021980">
            </div>
            <div class="campo c5">
              <label for="al-logradouro">LOGRADOURO</label>
              <input id="al-logradouro" name="logradouro" type="text" placeholder="Ex.: Rua do Anfiteatro">
            </div>
            <div class="campo c2">
              <label for="al-numero">NÚMERO</label>
              <input id="al-numero" name="numero" type="text" placeholder="Ex.: 375">
            </div>
            <div class="campo c3">
              <label for="al-complemento">COMPLEMENTO</label>
              <input id="al-complemento" name="complemento" type="text" placeholder="Ex.: Sala 5">
            </div>

            <div class="campo c3">
              <label for="al-cep">CEP</label>
              <input id="al-cep" name="cep" type="text" inputmode="numeric" placeholder="Ex.: 05508090">
            </div>
            <div class="campo c3">
              <label for="al-bairro">BAIRRO</label>
              <input id="al-bairro" name="bairro" type="text" placeholder="Ex.: Butantã">
            </div>
            <div class="campo c3">
              <label for="al-cidade">CIDADE</label>
              <input id="al-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
            </div>
            <div class="campo c3">
              <label for="al-estado">ESTADO</label>
              <input id="al-estado" name="estado" type="text" placeholder="Ex.: SP">
            </div>
          </div>
        </section>

        <section class="bloco">
          <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class="campos">
            <div class="campo c3">
              <label for="al-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="al-cpf" name="cpf" type="text" inputmode="numeric" placeholder="Ex.: 12345678909">
            </div>
            <div class="campo c3">
              <label for="al-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="al-rg" name="rg_rnm" type="text" placeholder="Ex.: 12.345.678-9">
            </div>
            <div class="campo c4">
              <label for="al-banco">NOME DO BANCO</label>
              <input id="al-banco" name="nome_banco" type="text" placeholder="Ex.: Banco do Brasil">
            </div>
            <div class="campo c2">
              <label for="al-agencia">NÚMERO DA AGÊNCIA</label>
              <input id="al-agencia" name="agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234">
            </div>
            <div class="campo c3">
              <label for="al-conta">NÚMERO DA CONTA</label>
              <input id="al-conta" name="conta" type="text" placeholder="Ex.: 98765-4">
            </div>
          </div>
        </section>

        <div class="acoes">
          <button type="submit" class="enviar">Enviar solicitação</button>
        </div>
      </form>
    </section>

    <section class="painel" id="painel-docentes" hidden>
      <form data-aba="DOCENTES" novalidate>
        <div class="erros" role="alert" hidden></div>

        <section class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="campos">
            <div class="campo c4">
              <label for="dc-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input id="dc-nome" name="nome_completo" type="text" placeholder="Ex.: João Pereira">
            </div>
            <div class="campo c2">
              <label for="dc-nusp">N. USP</label>
              <input id="dc-nusp" name="n_usp" type="text" inputmode="numeric" placeholder="Ex.: 1234567">
            </div>
            <div class="campo c6">
              <label for="dc-programa">PROGRAMA</label>
              <input id="dc-programa" name="programa" type="text" placeholder="Ex.: Ciência da Computação">
            </div>

            <div class="campo c4">
              <label for="dc-email">E-MAIL</label>
              <input id="dc-email" name="email" type="text" placeholder="Ex.: joao@usp.br">
            </div>
            <div class="campo c8">
              <label for="dc-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id="dc-evento" name="nome_evento" type="text" placeholder="Ex.: Banca de defesa de mestrado">
            </div>

            <div class="campo c4">
              <label for="dc-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id="dc-periodo" name="periodo_evento" type="text" placeholder="Ex.: 10/03/2025 a 15/03/2025">
            </div>
            <div class="campo c3">
              <label for="dc-cidade-ev">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id="dc-cidade-ev" name="cidade_evento" type="text" placeholder="Ex.: São Paulo">
            </div>
            <div class="campo c2">
              <label for="dc-estado-ev">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id="dc-estado-ev" name="estado_evento" type="text" placeholder="Ex.: SP">
            </div>
            <div class="campo c3">
              <label for="dc-pais-ev">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id="dc-pais-ev" name="pais_evento" type="text" placeholder="Ex.: Brasil">
            </div>

            <div class="campo c5">
              <label for="dc-link">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id="dc-link" name="link_evento" type="text" placeholder="Ex.: https://evento.org.br/2025">
            </div>
            <div class="campo c3">
              <label for="dc-valor">VALOR SOLICITADO (R$)</label>
              <input id="dc-valor" name="valor_solicitado" type="text" inputmode="numeric" placeholder="Ex.: 150000">
            </div>

            <div class="campo c8">
              <label for="dc-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="dc-detalhamento" name="detalhamento" rows="2" placeholder="Ex.: Diárias e passagens para banca."></textarea>
            </div>
            <div class="campo c4">
              <label for="dc-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="dc-apresentacao" name="apresentacao_trabalho" placeholder="Ex.: Pôster">
                <option value="">Selecione uma opção</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
          </div>
        </section>

        <section class="bloco">
          <h2>ENDEREÇO DO SOLICITANTE</h2>
          <div class="campos">
            <div class="campo c2">
              <label for="dc-data">DATA DE NASCIMENTO</label>
              <input id="dc-data" name="data_nascimento" type="text" inputmode="numeric" placeholder="Ex.: 01021980">
            </div>
            <div class="campo c5">
              <label for="dc-logradouro">LOGRADOURO</label>
              <input id="dc-logradouro" name="logradouro" type="text" placeholder="Ex.: Rua do Anfiteatro">
            </div>
            <div class="campo c2">
              <label for="dc-numero">NÚMERO</label>
              <input id="dc-numero" name="numero" type="text" placeholder="Ex.: 375">
            </div>
            <div class="campo c3">
              <label for="dc-complemento">COMPLEMENTO</label>
              <input id="dc-complemento" name="complemento" type="text" placeholder="Ex.: Sala 5">
            </div>

            <div class="campo c3">
              <label for="dc-cep">CEP</label>
              <input id="dc-cep" name="cep" type="text" inputmode="numeric" placeholder="Ex.: 05508090">
            </div>
            <div class="campo c3">
              <label for="dc-bairro">BAIRRO</label>
              <input id="dc-bairro" name="bairro" type="text" placeholder="Ex.: Butantã">
            </div>
            <div class="campo c3">
              <label for="dc-cidade">CIDADE</label>
              <input id="dc-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
            </div>
            <div class="campo c3">
              <label for="dc-estado">ESTADO</label>
              <input id="dc-estado" name="estado" type="text" placeholder="Ex.: SP">
            </div>
          </div>
        </section>

        <section class="bloco">
          <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class="campos">
            <div class="campo c3">
              <label for="dc-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="dc-cpf" name="cpf" type="text" inputmode="numeric" placeholder="Ex.: 12345678909">
            </div>
            <div class="campo c3">
              <label for="dc-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="dc-rg" name="rg_rnm" type="text" placeholder="Ex.: 12.345.678-9">
            </div>
            <div class="campo c4">
              <label for="dc-banco">NOME DO BANCO</label>
              <input id="dc-banco" name="nome_banco" type="text" placeholder="Ex.: Banco do Brasil">
            </div>
            <div class="campo c2">
              <label for="dc-agencia">NÚMERO DA AGÊNCIA</label>
              <input id="dc-agencia" name="agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234">
            </div>
            <div class="campo c3">
              <label for="dc-conta">NÚMERO DA CONTA</label>
              <input id="dc-conta" name="conta" type="text" placeholder="Ex.: 98765-4">
            </div>
          </div>
        </section>

        <div class="acoes">
          <button type="submit" class="enviar">Enviar solicitação</button>
        </div>
      </form>
    </section>
  </div>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="texto-oficio"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
