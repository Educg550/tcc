<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Solicitação de Auxílio Financeiro | Pós-Graduação IME-USP</title>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<header class='cabecalho'>
  <div class='logo-margem'><img class='logo' src='assets/usp-logo.png' alt='Logotipo da Universidade de São Paulo'></div>
  <div class='nomes-institucionais'>
    <p class='nome-universidade'>Universidade de São Paulo</p>
    <p class='nome-programa'>Pós-Graduação do IME-USP</p>
  </div>
</header>
<main>
  <div id='formulario-area'>
    <nav class='abas' role='tablist' aria-label='Tipo de solicitante'>
      <button type='button' class='aba ativa' id='aba-alunos' data-painel='painel-alunos' role='tab' aria-selected='true'>ALUNOS</button>
      <button type='button' class='aba' id='aba-docentes' data-painel='painel-docentes' role='tab' aria-selected='false'>DOCENTES</button>
    </nav>
    <section class='painel' id='painel-alunos' role='tabpanel' aria-labelledby='aba-alunos'>
      <form class='solicitacao' data-tipo='alunos' novalidate>
        <div class='erros' hidden></div>
        <section class='bloco'>
          <h2 class='bloco-titulo'>SOLICITANTE E EVENTO</h2>
          <div class='grade'>
            <label class='campo c2'><span class='rotulo'>NOME COMPLETO - SEM ABREVIAR</span><input type='text' name='nome_completo' placeholder='Ex.: Maria Silva de Oliveira'></label>
            <label class='campo c1'><span class='rotulo'>N. USP</span><input type='text' name='n_usp' placeholder='Ex.: 9876543'></label>
            <label class='campo c2'><span class='rotulo'>PROGRAMA</span><input type='text' name='programa' placeholder='Ex.: Ciência da Computação'></label>
            <label class='campo c1'><span class='rotulo'>NÍVEL</span><select name='nivel'><option value=''>Ex.: Mestrado</option><option>Mestrado</option><option>Doutorado</option></select></label>
            <label class='campo c2'><span class='rotulo'>TIPO DE AUXÍLIO</span><select name='tipo_auxilio'><option value=''>Ex.: Participação em evento</option><option>Participação em evento</option><option>Banca de exame ou defesa</option><option>Outro</option></select></label>
            <label class='campo c2'><span class='rotulo'>E-MAIL</span><input type='email' name='email' placeholder='Ex.: maria.silva@usp.br'></label>
            <label class='campo c2'><span class='rotulo'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input type='text' name='nome_evento' placeholder='Ex.: Congresso Brasileiro de Informática'></label>
            <label class='campo c2'><span class='rotulo'>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input type='text' name='periodo_evento' placeholder='Ex.: 10 a 14 de julho de 2025'></label>
            <label class='campo c2'><span class='rotulo'>CIDADE DO EVENTO, EXAME OU DEFESA</span><input type='text' name='cidade_evento' placeholder='Ex.: Salvador'></label>
            <label class='campo c1'><span class='rotulo'>ESTADO DO EVENTO, EXAME OU DEFESA</span><input type='text' name='estado_evento' placeholder='Ex.: Bahia'></label>
            <label class='campo c1'><span class='rotulo'>PAÍS DO EVENTO, EXAME OU DEFESA</span><input type='text' name='pais_evento' placeholder='Ex.: Brasil'></label>
            <label class='campo c2'><span class='rotulo'>LINK DO EVENTO, EXAME OU DEFESA</span><input type='text' name='link_evento' placeholder='Ex.: https://www.csbc.org.br'></label>
            <label class='campo c1'><span class='rotulo'>VALOR SOLICITADO (R$)</span><input type='text' name='valor_solicitado' data-formato='valor' placeholder='Ex.: 150000'></label>
            <label class='campo c3 alta'><span class='rotulo'>DETALHAMENTO DO PEDIDO</span><textarea name='detalhamento' placeholder='Ex.: Passagem aérea e inscrição no evento'></textarea></label>
            <label class='campo c3'><span class='rotulo'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span><select name='apresentacao_trabalho'><option value=''>Ex.: Pôster</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
          </div>
        </section>
        <section class='bloco'>
          <h2 class='bloco-titulo'>ENDEREÇO DO SOLICITANTE</h2>
          <div class='grade'>
            <label class='campo c1'><span class='rotulo'>DATA DE NASCIMENTO</span><input type='text' name='data_nascimento' data-formato='data' placeholder='Ex.: 01021980'></label>
            <label class='campo c2'><span class='rotulo'>LOGRADOURO</span><input type='text' name='logradouro' placeholder='Ex.: Rua do Anfiteatro'></label>
            <label class='campo c1'><span class='rotulo'>NÚMERO</span><input type='text' name='numero' placeholder='Ex.: 181'></label>
            <label class='campo c1'><span class='rotulo'>COMPLEMENTO</span><input type='text' name='complemento' placeholder='Ex.: Sala 212'></label>
            <label class='campo c1'><span class='rotulo'>BAIRRO</span><input type='text' name='bairro' placeholder='Ex.: Butantã'></label>
            <label class='campo c1'><span class='rotulo'>CEP</span><input type='text' name='cep' data-formato='cep' placeholder='Ex.: 05508090'></label>
            <label class='campo c3'><span class='rotulo'>CIDADE</span><input type='text' name='cidade' placeholder='Ex.: São Paulo'></label>
            <label class='campo c2'><span class='rotulo'>ESTADO</span><input type='text' name='estado' placeholder='Ex.: SP'></label>
          </div>
        </section>
        <section class='bloco'>
          <h2 class='bloco-titulo'>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class='grade'>
            <label class='campo c2'><span class='rotulo'>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input type='text' name='cpf' data-formato='cpf' placeholder='Ex.: 52998224725'></label>
            <label class='campo c2'><span class='rotulo'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input type='text' name='rg_rnm' placeholder='Ex.: 12.345.678-9'></label>
            <label class='campo c2'><span class='rotulo'>NOME DO BANCO</span><input type='text' name='nome_banco' placeholder='Ex.: Banco do Brasil'></label>
            <label class='campo c3'><span class='rotulo'>NÚMERO DA AGÊNCIA</span><input type='text' name='agencia' placeholder='Ex.: 4321'></label>
            <label class='campo c3'><span class='rotulo'>NÚMERO DA CONTA</span><input type='text' name='conta' placeholder='Ex.: 123456-7'></label>
          </div>
        </section>
        <div class='acoes'><button type='submit' class='botao'>Enviar solicitação</button></div>
      </form>
    </section>
    <section class='painel' id='painel-docentes' role='tabpanel' aria-labelledby='aba-docentes' hidden>
      <form class='solicitacao' data-tipo='docentes' novalidate>
        <div class='erros' hidden></div>
        <section class='bloco'>
          <h2 class='bloco-titulo'>SOLICITANTE E EVENTO</h2>
          <div class='grade'>
            <label class='campo c2'><span class='rotulo'>NOME COMPLETO - SEM ABREVIAR</span><input type='text' name='nome_completo' placeholder='Ex.: João Cardoso de Souza'></label>
            <label class='campo c1'><span class='rotulo'>N. USP</span><input type='text' name='n_usp' placeholder='Ex.: 9876543'></label>
            <label class='campo c2'><span class='rotulo'>PROGRAMA</span><input type='text' name='programa' placeholder='Ex.: Estatística'></label>
            <label class='campo c1'><span class='rotulo'>E-MAIL</span><input type='email' name='email' placeholder='Ex.: joao.souza@usp.br'></label>
            <label class='campo c2'><span class='rotulo'>NOME DO EVENTO / BANCA DE EXAME OU DEFESA</span><input type='text' name='nome_evento' placeholder='Ex.: Banca de mestrado de Ana Lima'></label>
            <label class='campo c2'><span class='rotulo'>PERÍODO DO EVENTO, EXAME OU DEFESA</span><input type='text' name='periodo_evento' placeholder='Ex.: 3 e 4 de setembro de 2025'></label>
            <label class='campo c2'><span class='rotulo'>CIDADE DO EVENTO, EXAME OU DEFESA</span><input type='text' name='cidade_evento' placeholder='Ex.: São Paulo'></label>
            <label class='campo c1'><span class='rotulo'>ESTADO DO EVENTO, EXAME OU DEFESA</span><input type='text' name='estado_evento' placeholder='Ex.: SP'></label>
            <label class='campo c1'><span class='rotulo'>PAÍS DO EVENTO, EXAME OU DEFESA</span><input type='text' name='pais_evento' placeholder='Ex.: Brasil'></label>
            <label class='campo c2'><span class='rotulo'>LINK DO EVENTO, EXAME OU DEFESA</span><input type='text' name='link_evento' placeholder='Ex.: https://www.ime.usp.br'></label>
            <label class='campo c2'><span class='rotulo'>VALOR SOLICITADO (R$)</span><input type='text' name='valor_solicitado' data-formato='valor' placeholder='Ex.: 150000'></label>
            <label class='campo c3'><span class='rotulo'>DETALHAMENTO DO PEDIDO</span><textarea name='detalhamento' placeholder='Ex.: Diárias e passagem rodoviária'></textarea></label>
            <label class='campo c3'><span class='rotulo'>IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</span><select name='apresentacao_trabalho'><option value=''>Ex.: Pôster</option><option>Pôster</option><option>Apresentação oral</option><option>Outra</option><option>Não irá apresentar trabalho</option></select></label>
          </div>
        </section>
        <section class='bloco'>
          <h2 class='bloco-titulo'>ENDEREÇO DO SOLICITANTE</h2>
          <div class='grade'>
            <label class='campo c1'><span class='rotulo'>DATA DE NASCIMENTO</span><input type='text' name='data_nascimento' data-formato='data' placeholder='Ex.: 01021980'></label>
            <label class='campo c2'><span class='rotulo'>LOGRADOURO</span><input type='text' name='logradouro' placeholder='Ex.: Rua do Anfiteatro'></label>
            <label class='campo c1'><span class='rotulo'>NÚMERO</span><input type='text' name='numero' placeholder='Ex.: 181'></label>
            <label class='campo c1'><span class='rotulo'>COMPLEMENTO</span><input type='text' name='complemento' placeholder='Ex.: Sala 212'></label>
            <label class='campo c1'><span class='rotulo'>BAIRRO</span><input type='text' name='bairro' placeholder='Ex.: Butantã'></label>
            <label class='campo c1'><span class='rotulo'>CEP</span><input type='text' name='cep' data-formato='cep' placeholder='Ex.: 05508090'></label>
            <label class='campo c3'><span class='rotulo'>CIDADE</span><input type='text' name='cidade' placeholder='Ex.: São Paulo'></label>
            <label class='campo c2'><span class='rotulo'>ESTADO</span><input type='text' name='estado' placeholder='Ex.: SP'></label>
          </div>
        </section>
        <section class='bloco'>
          <h2 class='bloco-titulo'>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class='grade'>
            <label class='campo c2'><span class='rotulo'>CPF (SEPARADOS POR PONTOS E TRAÇO)</span><input type='text' name='cpf' data-formato='cpf' placeholder='Ex.: 52998224725'></label>
            <label class='campo c2'><span class='rotulo'>RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</span><input type='text' name='rg_rnm' placeholder='Ex.: 12.345.678-9'></label>
            <label class='campo c2'><span class='rotulo'>NOME DO BANCO</span><input type='text' name='nome_banco' placeholder='Ex.: Banco do Brasil'></label>
            <label class='campo c3'><span class='rotulo'>NÚMERO DA AGÊNCIA</span><input type='text' name='agencia' placeholder='Ex.: 4321'></label>
            <label class='campo c3'><span class='rotulo'>NÚMERO DA CONTA</span><input type='text' name='conta' placeholder='Ex.: 123456-7'></label>
          </div>
        </section>
        <div class='acoes'><button type='submit' class='botao'>Enviar solicitação</button></div>
      </form>
    </section>
  </div>
  <section class='confirmacao' id='confirmacao' hidden>
    <h2 class='confirmacao-titulo'>Solicitação registrada</h2>
    <pre class='oficio' id='oficio-texto'></pre>
  </section>
</main>
<script src='app.js'></script>
</body>
</html>
