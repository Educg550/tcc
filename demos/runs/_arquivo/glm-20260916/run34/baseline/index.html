<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div>
      <h1 class="universidade">Universidade de São Paulo</h1>
      <p class="programa">Pós-Graduação do Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <main>
    <div id="formularios">
      <nav class="abas">
        <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
        <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
      </nav>

      <form id="form-alunos" class="formulario" data-origem="alunos" novalidate>
        <div class="erros"></div>

        <section class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="grade">
            <div class="campo c6">
              <label for="al-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input type="text" id="al-nome" name="nome" placeholder="Maria Aparecida de Souza">
            </div>
            <div class="campo c3">
              <label for="al-nusp">N. USP</label>
              <input type="text" id="al-nusp" name="nusp" placeholder="1234567">
            </div>
            <div class="campo c5">
              <label for="al-programa">PROGRAMA</label>
              <input type="text" id="al-programa" name="programa" placeholder="Ciência da Computação">
            </div>
            <div class="campo c4">
              <label for="al-nivel">NÍVEL</label>
              <select id="al-nivel" name="nivel">
                <option value="">Ex.: Mestrado</option>
                <option>Mestrado</option>
                <option>Doutorado</option>
              </select>
            </div>
            <div class="campo c6">
              <label for="al-tipo">TIPO DE AUXÍLIO</label>
              <select id="al-tipo" name="tipo">
                <option value="">Ex.: Participação em evento</option>
                <option>Participação em evento</option>
                <option>Banca de exame ou defesa</option>
                <option>Outro</option>
              </select>
            </div>
            <div class="campo c5">
              <label for="al-email">E-MAIL</label>
              <input type="text" id="al-email" name="email" placeholder="maria.souza@usp.br">
            </div>
            <div class="campo c9">
              <label for="al-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input type="text" id="al-evento" name="evento" placeholder="Congresso da SBC">
            </div>
            <div class="campo c6">
              <label for="al-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="al-periodo" name="periodo" placeholder="10/06/2025 a 14/06/2025">
            </div>
            <div class="campo c4">
              <label for="al-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="al-cidade-evento" name="cidade_evento" placeholder="Brasília">
            </div>
            <div class="campo c6">
              <label for="al-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="al-estado-evento" name="estado_evento" placeholder="Distrito Federal">
            </div>
            <div class="campo c6">
              <label for="al-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="al-pais-evento" name="pais_evento" placeholder="Brasil">
            </div>
            <div class="campo c7">
              <label for="al-link">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="al-link" name="link" placeholder="https://evento.org.br">
            </div>
            <div class="campo c5">
              <label for="al-valor">VALOR SOLICITADO (R$)</label>
              <input type="text" id="al-valor" name="valor" placeholder="R$ 1.500,00" data-formato="moeda">
            </div>
            <div class="campo c16">
              <label for="al-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="al-detalhamento" name="detalhamento" rows="2" placeholder="Ex.: Passagem aérea e inscrição no evento."></textarea>
            </div>
            <div class="campo c8">
              <label for="al-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="al-apresentacao" name="apresentacao">
                <option value="">Ex.: Pôster</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
          </div>
        </section>

        <section class="bloco">
          <h2>ENDEREÇO DO SOLICITANTE</h2>
          <div class="grade">
            <div class="campo c4">
              <label for="al-nascimento">DATA DE NASCIMENTO</label>
              <input type="text" id="al-nascimento" name="nascimento" placeholder="01/02/1980" data-formato="data">
            </div>
            <div class="campo c7">
              <label for="al-logradouro">LOGRADOURO</label>
              <input type="text" id="al-logradouro" name="logradouro" placeholder="Rua do Anfiteatro">
            </div>
            <div class="campo c3">
              <label for="al-numero">NÚMERO</label>
              <input type="text" id="al-numero" name="numero" placeholder="180">
            </div>
            <div class="campo c6">
              <label for="al-complemento">COMPLEMENTO</label>
              <input type="text" id="al-complemento" name="complemento" placeholder="Sala 212">
            </div>
            <div class="campo c4">
              <label for="al-bairro">BAIRRO</label>
              <input type="text" id="al-bairro" name="bairro" placeholder="Butantã">
            </div>
            <div class="campo c4">
              <label for="al-cep">CEP</label>
              <input type="text" id="al-cep" name="cep" placeholder="05508-090" data-formato="cep">
            </div>
            <div class="campo c10">
              <label for="al-cidade">CIDADE</label>
              <input type="text" id="al-cidade" name="cidade" placeholder="São Paulo">
            </div>
            <div class="campo c10">
              <label for="al-estado">ESTADO</label>
              <input type="text" id="al-estado" name="estado" placeholder="São Paulo">
            </div>
          </div>
        </section>

        <section class="bloco">
          <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class="grade">
            <div class="campo c5">
              <label for="al-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input type="text" id="al-cpf" name="cpf" placeholder="123.456.789-09" data-formato="cpf">
            </div>
            <div class="campo c5">
              <label for="al-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input type="text" id="al-rg" name="rg" placeholder="12.345.678-9">
            </div>
            <div class="campo c6">
              <label for="al-banco">NOME DO BANCO</label>
              <input type="text" id="al-banco" name="banco" placeholder="Banco do Brasil">
            </div>
            <div class="campo c3">
              <label for="al-agencia">NÚMERO DA AGÊNCIA</label>
              <input type="text" id="al-agencia" name="agencia" placeholder="0102">
            </div>
            <div class="campo c5">
              <label for="al-conta">NÚMERO DA CONTA</label>
              <input type="text" id="al-conta" name="conta" placeholder="12345-6">
            </div>
          </div>
        </section>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>

      <form id="form-docentes" class="formulario oculto" data-origem="docentes" novalidate>
        <div class="erros"></div>

        <section class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="grade">
            <div class="campo c6">
              <label for="dc-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input type="text" id="dc-nome" name="nome" placeholder="João Carlos Pereira">
            </div>
            <div class="campo c3">
              <label for="dc-nusp">N. USP</label>
              <input type="text" id="dc-nusp" name="nusp" placeholder="1234567">
            </div>
            <div class="campo c5">
              <label for="dc-programa">PROGRAMA</label>
              <input type="text" id="dc-programa" name="programa" placeholder="Estatística">
            </div>
            <div class="campo c10">
              <label for="dc-email">E-MAIL</label>
              <input type="text" id="dc-email" name="email" placeholder="joao.pereira@ime.usp.br">
            </div>
            <div class="campo c12">
              <label for="dc-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input type="text" id="dc-evento" name="evento" placeholder="Banca de defesa de mestrado">
            </div>
            <div class="campo c4">
              <label for="dc-valor">VALOR SOLICITADO (R$)</label>
              <input type="text" id="dc-valor" name="valor" placeholder="R$ 1.500,00" data-formato="moeda">
            </div>
            <div class="campo c8">
              <label for="dc-apresentacao">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="dc-apresentacao" name="apresentacao">
                <option value="">Ex.: Pôster</option>
                <option>Pôster</option>
                <option>Apresentação oral</option>
                <option>Outra</option>
                <option>Não irá apresentar trabalho</option>
              </select>
            </div>
            <div class="campo c6">
              <label for="dc-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="dc-periodo" name="periodo" placeholder="10/06/2025 a 14/06/2025">
            </div>
            <div class="campo c6">
              <label for="dc-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="dc-cidade-evento" name="cidade_evento" placeholder="Brasília">
            </div>
            <div class="campo c4">
              <label for="dc-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="dc-estado-evento" name="estado_evento" placeholder="Distrito Federal">
            </div>
            <div class="campo c4">
              <label for="dc-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="dc-pais-evento" name="pais_evento" placeholder="Brasil">
            </div>
            <div class="campo c4">
              <label for="dc-link">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input type="text" id="dc-link" name="link" placeholder="https://evento.org.br">
            </div>
            <div class="campo c24">
              <label for="dc-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="dc-detalhamento" name="detalhamento" rows="2" placeholder="Ex.: Diárias e passagem para banca externa."></textarea>
            </div>
          </div>
        </section>

        <section class="bloco">
          <h2>ENDEREÇO DO SOLICITANTE</h2>
          <div class="grade">
            <div class="campo c4">
              <label for="dc-nascimento">DATA DE NASCIMENTO</label>
              <input type="text" id="dc-nascimento" name="nascimento" placeholder="01/02/1980" data-formato="data">
            </div>
            <div class="campo c7">
              <label for="dc-logradouro">LOGRADOURO</label>
              <input type="text" id="dc-logradouro" name="logradouro" placeholder="Rua do Anfiteatro">
            </div>
            <div class="campo c3">
              <label for="dc-numero">NÚMERO</label>
              <input type="text" id="dc-numero" name="numero" placeholder="180">
            </div>
            <div class="campo c6">
              <label for="dc-complemento">COMPLEMENTO</label>
              <input type="text" id="dc-complemento" name="complemento" placeholder="Sala 212">
            </div>
            <div class="campo c4">
              <label for="dc-bairro">BAIRRO</label>
              <input type="text" id="dc-bairro" name="bairro" placeholder="Butantã">
            </div>
            <div class="campo c4">
              <label for="dc-cep">CEP</label>
              <input type="text" id="dc-cep" name="cep" placeholder="05508-090" data-formato="cep">
            </div>
            <div class="campo c10">
              <label for="dc-cidade">CIDADE</label>
              <input type="text" id="dc-cidade" name="cidade" placeholder="São Paulo">
            </div>
            <div class="campo c10">
              <label for="dc-estado">ESTADO</label>
              <input type="text" id="dc-estado" name="estado" placeholder="São Paulo">
            </div>
          </div>
        </section>

        <section class="bloco">
          <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class="grade">
            <div class="campo c5">
              <label for="dc-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input type="text" id="dc-cpf" name="cpf" placeholder="123.456.789-09" data-formato="cpf">
            </div>
            <div class="campo c5">
              <label for="dc-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input type="text" id="dc-rg" name="rg" placeholder="12.345.678-9">
            </div>
            <div class="campo c6">
              <label for="dc-banco">NOME DO BANCO</label>
              <input type="text" id="dc-banco" name="banco" placeholder="Banco do Brasil">
            </div>
            <div class="campo c3">
              <label for="dc-agencia">NÚMERO DA AGÊNCIA</label>
              <input type="text" id="dc-agencia" name="agencia" placeholder="0102">
            </div>
            <div class="campo c5">
              <label for="dc-conta">NÚMERO DA CONTA</label>
              <input type="text" id="dc-conta" name="conta" placeholder="12345-6">
            </div>
          </div>
        </section>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </div>

    <section id="confirmacao" class="oculto">
      <h2>Solicitação registrada</h2>
      <pre class="oficio" id="oficio"></pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
