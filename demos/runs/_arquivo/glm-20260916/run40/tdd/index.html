<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxílio Financeiro — Pós-Graduação IME-USP</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="cabecalho">
  <img class="logo" src="/assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
  <div class="titulos">
    <h1>Universidade de São Paulo</h1>
    <p class="programa">Programa de Pós-Graduação — IME-USP</p>
  </div>
</header>

<main>
  <section id="solicitacao">
    <nav class="abas">
      <button type="button" id="aba-alunos" class="aba ativa">ALUNOS</button>
      <button type="button" id="aba-docentes" class="aba">DOCENTES</button>
    </nav>

    <form id="form-alunos" class="formulario">
      <div id="erros-alunos" class="erros" hidden></div>

      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo span2">
            <label for="a-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="a-nome" name="nome_completo" type="text" placeholder="Ex.: Maria de Souza">
          </div>
          <div class="campo">
            <label for="a-nusp">N. USP</label>
            <input id="a-nusp" name="numero_usp" type="text" inputmode="numeric" placeholder="Ex.: 1234567">
          </div>
          <div class="campo">
            <label for="a-programa">PROGRAMA</label>
            <input id="a-programa" name="programa" type="text" placeholder="Ex.: Ciência da Computação">
          </div>
          <div class="campo">
            <label for="a-nivel">NÍVEL</label>
            <select id="a-nivel" name="nivel">
              <option value="">Selecione…</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class="campo">
            <label for="a-tipo">TIPO DE AUXÍLIO</label>
            <select id="a-tipo" name="tipo_auxilio">
              <option value="">Selecione…</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>
          <div class="campo span2">
            <label for="a-email">E-MAIL</label>
            <input id="a-email" name="email" type="text" placeholder="Ex.: maria@usp.br">
          </div>
          <div class="campo span2">
            <label for="a-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="a-evento" name="nome_evento" type="text" placeholder="Ex.: Congresso Brasileiro de Computação">
          </div>
          <div class="campo span2">
            <label for="a-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-periodo" name="periodo_evento" type="text" placeholder="Ex.: 10/03/2025 a 14/03/2025">
          </div>
          <div class="campo">
            <label for="a-cidev">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-cidev" name="cidade_evento" type="text" placeholder="Ex.: Gramado">
          </div>
          <div class="campo">
            <label for="a-estev">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-estev" name="estado_evento" type="text" placeholder="Ex.: RS">
          </div>
          <div class="campo">
            <label for="a-pais">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-pais" name="pais_evento" type="text" placeholder="Ex.: Brasil">
          </div>
          <div class="campo">
            <label for="a-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="a-link" name="link_evento" type="text" placeholder="Ex.: https://evento.org.br">
          </div>
          <div class="campo">
            <label for="a-valor">VALOR SOLICITADO (R$)</label>
            <input id="a-valor" name="valor_solicitado" type="text" inputmode="numeric" data-fmt-moeda placeholder="Ex.: 150000">
          </div>
          <div class="campo span3">
            <label for="a-apres">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="a-apres" name="apresentacao_trabalho">
              <option value="">Selecione…</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo span4">
            <label for="a-detalhe">DETALHAMENTO DO PEDIDO</label>
            <textarea id="a-detalhe" name="detalhamento" rows="2" placeholder="Ex.: Passagem aérea e inscrição no evento"></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo">
            <label for="a-nasc">DATA DE NASCIMENTO</label>
            <input id="a-nasc" name="data_nascimento" type="text" inputmode="numeric" data-fmt-data placeholder="Ex.: 01021980">
          </div>
          <div class="campo span2">
            <label for="a-log">LOGRADOURO</label>
            <input id="a-log" name="logradouro" type="text" placeholder="Ex.: Rua do Anfiteatro">
          </div>
          <div class="campo">
            <label for="a-num">NÚMERO</label>
            <input id="a-num" name="numero" type="text" placeholder="Ex.: 181">
          </div>
          <div class="campo">
            <label for="a-comp">COMPLEMENTO</label>
            <input id="a-comp" name="complemento" type="text" placeholder="Ex.: Sala 10">
          </div>
          <div class="campo span2">
            <label for="a-bairro">BAIRRO</label>
            <input id="a-bairro" name="bairro" type="text" placeholder="Ex.: Butantã">
          </div>
          <div class="campo">
            <label for="a-cep">CEP</label>
            <input id="a-cep" name="cep" type="text" inputmode="numeric" data-fmt-cep placeholder="Ex.: 05508090">
          </div>
          <div class="campo span2">
            <label for="a-cidade">CIDADE</label>
            <input id="a-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo span2">
            <label for="a-estado">ESTADO</label>
            <input id="a-estado" name="estado" type="text" placeholder="Ex.: SP">
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo span2">
            <label for="a-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-cpf" name="cpf" type="text" inputmode="numeric" data-fmt-cpf placeholder="Ex.: 12345678909">
          </div>
          <div class="campo span2">
            <label for="a-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="a-rg" name="rg_rnm" type="text" placeholder="Ex.: 12.345.678-9">
          </div>
          <div class="campo span2">
            <label for="a-banco">NOME DO BANCO</label>
            <input id="a-banco" name="nome_banco" type="text" placeholder="Ex.: Banco do Brasil">
          </div>
          <div class="campo">
            <label for="a-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="a-agencia" name="numero_agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234">
          </div>
          <div class="campo">
            <label for="a-conta">NÚMERO DA CONTA</label>
            <input id="a-conta" name="numero_conta" type="text" placeholder="Ex.: 98765-4">
          </div>
        </div>
      </fieldset>

      <div class="acoes">
        <button type="submit" class="enviar">Enviar solicitação</button>
      </div>
    </form>

    <form id="form-docentes" class="formulario" hidden>
      <div id="erros-docentes" class="erros" hidden></div>

      <fieldset class="bloco">
        <legend>SOLICITANTE E EVENTO</legend>
        <div class="grade">
          <div class="campo span2">
            <label for="d-nome">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="d-nome" name="nome_completo" type="text" placeholder="Ex.: João Fernandes">
          </div>
          <div class="campo">
            <label for="d-nusp">N. USP</label>
            <input id="d-nusp" name="numero_usp" type="text" inputmode="numeric" placeholder="Ex.: 1234567">
          </div>
          <div class="campo">
            <label for="d-programa">PROGRAMA</label>
            <input id="d-programa" name="programa" type="text" placeholder="Ex.: Estatística">
          </div>
          <div class="campo span2">
            <label for="d-email">E-MAIL</label>
            <input id="d-email" name="email" type="text" placeholder="Ex.: joao@ime.usp.br">
          </div>
          <div class="campo span2">
            <label for="d-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="d-evento" name="nome_evento" type="text" placeholder="Ex.: Defesa de mestrado de Ana Lima">
          </div>
          <div class="campo span2">
            <label for="d-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-periodo" name="periodo_evento" type="text" placeholder="Ex.: 10/03/2025 a 14/03/2025">
          </div>
          <div class="campo">
            <label for="d-cidev">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-cidev" name="cidade_evento" type="text" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo">
            <label for="d-estev">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-estev" name="estado_evento" type="text" placeholder="Ex.: SP">
          </div>
          <div class="campo">
            <label for="d-pais">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-pais" name="pais_evento" type="text" placeholder="Ex.: Brasil">
          </div>
          <div class="campo">
            <label for="d-link">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="d-link" name="link_evento" type="text" placeholder="Ex.: https://evento.org.br">
          </div>
          <div class="campo">
            <label for="d-valor">VALOR SOLICITADO (R$)</label>
            <input id="d-valor" name="valor_solicitado" type="text" inputmode="numeric" data-fmt-moeda placeholder="Ex.: 150000">
          </div>
          <div class="campo">
            <label for="d-apres">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="d-apres" name="apresentacao_trabalho">
              <option value="">Selecione…</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
          <div class="campo span4">
            <label for="d-detalhe">DETALHAMENTO DO PEDIDO</label>
            <textarea id="d-detalhe" name="detalhamento" rows="2" placeholder="Ex.: Passagem e diárias para banca externa"></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>ENDEREÇO DO SOLICITANTE</legend>
        <div class="grade">
          <div class="campo">
            <label for="d-nasc">DATA DE NASCIMENTO</label>
            <input id="d-nasc" name="data_nascimento" type="text" inputmode="numeric" data-fmt-data placeholder="Ex.: 01021980">
          </div>
          <div class="campo span2">
            <label for="d-log">LOGRADOURO</label>
            <input id="d-log" name="logradouro" type="text" placeholder="Ex.: Rua do Anfiteatro">
          </div>
          <div class="campo">
            <label for="d-num">NÚMERO</label>
            <input id="d-num" name="numero" type="text" placeholder="Ex.: 181">
          </div>
          <div class="campo">
            <label for="d-comp">COMPLEMENTO</label>
            <input id="d-comp" name="complemento" type="text" placeholder="Ex.: Sala 10">
          </div>
          <div class="campo span2">
            <label for="d-bairro">BAIRRO</label>
            <input id="d-bairro" name="bairro" type="text" placeholder="Ex.: Butantã">
          </div>
          <div class="campo">
            <label for="d-cep">CEP</label>
            <input id="d-cep" name="cep" type="text" inputmode="numeric" data-fmt-cep placeholder="Ex.: 05508090">
          </div>
          <div class="campo span2">
            <label for="d-cidade">CIDADE</label>
            <input id="d-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo span2">
            <label for="d-estado">ESTADO</label>
            <input id="d-estado" name="estado" type="text" placeholder="Ex.: SP">
          </div>
        </div>
      </fieldset>

      <fieldset class="bloco">
        <legend>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</legend>
        <div class="grade">
          <div class="campo span2">
            <label for="d-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-cpf" name="cpf" type="text" inputmode="numeric" data-fmt-cpf placeholder="Ex.: 12345678909">
          </div>
          <div class="campo span2">
            <label for="d-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="d-rg" name="rg_rnm" type="text" placeholder="Ex.: 12.345.678-9">
          </div>
          <div class="campo span2">
            <label for="d-banco">NOME DO BANCO</label>
            <input id="d-banco" name="nome_banco" type="text" placeholder="Ex.: Banco do Brasil">
          </div>
          <div class="campo">
            <label for="d-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="d-agencia" name="numero_agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234">
          </div>
          <div class="campo">
            <label for="d-conta">NÚMERO DA CONTA</label>
            <input id="d-conta" name="numero_conta" type="text" placeholder="Ex.: 98765-4">
          </div>
        </div>
      </fieldset>

      <div class="acoes">
        <button type="submit" class="enviar">Enviar solicitação</button>
      </div>
    </form>
  </section>

  <section id="confirmacao" hidden>
    <h2>Solicitação registrada</h2>
    <pre id="oficio" class="oficio"></pre>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
