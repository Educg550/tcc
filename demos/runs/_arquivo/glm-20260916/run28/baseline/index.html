<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Auxílio Financeiro - Pós-Graduação IME-USP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <img src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo" class="logo">
    <div class="identidade">
      <h1 class="nome-ies">Universidade de São Paulo</h1>
      <p class="nome-programa">Pós-Graduação do IME-USP</p>
    </div>
  </header>

  <main>
    <div class="abas" role="tablist" aria-label="Tipo de solicitante">
      <button type="button" class="aba ativa" id="aba-alunos" role="tab" aria-selected="true" aria-controls="painel-alunos">ALUNOS</button>
      <button type="button" class="aba" id="aba-docentes" role="tab" aria-selected="false" aria-controls="painel-docentes">DOCENTES</button>
    </div>

    <section class="painel" id="painel-alunos" role="tabpanel" aria-labelledby="aba-alunos">
      <form id="form-alunos" class="solicitacao" data-aba="alunos" novalidate>
        <div class="erros" role="alert" hidden></div>

        <section class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="campos">
            <div class="campo c2">
              <label for="alunos-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input id="alunos-nome" name="nome_completo" type="text" placeholder="Ex.: Maria Antonieta da Silva Souza">
            </div>
            <div class="campo">
              <label for="alunos-n-usp">N. USP</label>
              <input id="alunos-n-usp" name="n_usp" type="text" inputmode="numeric" placeholder="Ex.: 9876543">
            </div>
            <div class="campo">
              <label for="alunos-programa">PROGRAMA</label>
              <input id="alunos-programa" name="programa" type="text" placeholder="Ex.: Ciência da Computação">
            </div>
            <div class="campo">
              <label for="alunos-nivel">NÍVEL</label>
              <select id="alunos-nivel" name="nivel">
                <option value="" selected>Selecione</option>
                <option value="Mestrado">Mestrado</option>
                <option value="Doutorado">Doutorado</option>
              </select>
            </div>
            <div class="campo c2">
              <label for="alunos-tipo-auxilio">TIPO DE AUXÍLIO</label>
              <select id="alunos-tipo-auxilio" name="tipo_auxilio">
                <option value="" selected>Selecione</option>
                <option value="Participação em evento">Participação em evento</option>
                <option value="Banca de exame ou defesa">Banca de exame ou defesa</option>
                <option value="Outro">Outro</option>
              </select>
            </div>
            <div class="campo">
              <label for="alunos-email">E-MAIL</label>
              <input id="alunos-email" name="email" type="text" placeholder="Ex.: maria.souza@usp.br">
            </div>
            <div class="campo c2">
              <label for="alunos-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id="alunos-evento" name="nome_evento" type="text" placeholder="Ex.: Simpósio Brasileiro de Computação">
            </div>
            <div class="campo">
              <label for="alunos-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id="alunos-periodo" name="periodo_evento" type="text" placeholder="Ex.: 10 a 14 de agosto de 2026">
            </div>
            <div class="campo">
              <label for="alunos-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id="alunos-cidade-evento" name="cidade_evento" type="text" placeholder="Ex.: Rio de Janeiro">
            </div>
            <div class="campo">
              <label for="alunos-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id="alunos-estado-evento" name="estado_evento" type="text" placeholder="Ex.: RJ">
            </div>
            <div class="campo">
              <label for="alunos-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id="alunos-pais-evento" name="pais_evento" type="text" placeholder="Ex.: Brasil">
            </div>
            <div class="campo c2">
              <label for="alunos-link">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id="alunos-link" name="link_evento" type="text" placeholder="Ex.: https://eventos.usp.br/simbcomp2026">
            </div>
            <div class="campo">
              <label for="alunos-valor">VALOR SOLICITADO (R$)</label>
              <input id="alunos-valor" name="valor_solicitado" type="text" inputmode="numeric" data-formato="moeda" placeholder="Ex.: 150000">
            </div>
            <div class="campo c3">
              <label for="alunos-apresenta">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="alunos-apresenta" name="ira_apresentar">
                <option value="" selected>Selecione</option>
                <option value="Pôster">Pôster</option>
                <option value="Apresentação oral">Apresentação oral</option>
                <option value="Outra">Outra</option>
                <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
              </select>
            </div>
            <div class="campo c4">
              <label for="alunos-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="alunos-detalhamento" name="detalhamento" rows="2" placeholder="Ex.: Inscrição no evento e passagem aérea ida e volta."></textarea>
            </div>
          </div>
        </section>

        <section class="bloco">
          <h2>ENDEREÇO DO SOLICITANTE</h2>
          <div class="campos">
            <div class="campo">
              <label for="alunos-nascimento">DATA DE NASCIMENTO</label>
              <input id="alunos-nascimento" name="data_nascimento" type="text" inputmode="numeric" data-formato="data" data-max="8" placeholder="Ex.: 01021980">
            </div>
            <div class="campo c2">
              <label for="alunos-logradouro">LOGRADOURO</label>
              <input id="alunos-logradouro" name="logradouro" type="text" placeholder="Ex.: Rua do Matão">
            </div>
            <div class="campo">
              <label for="alunos-numero">NÚMERO</label>
              <input id="alunos-numero" name="numero" type="text" placeholder="Ex.: 1010">
            </div>
            <div class="campo c2">
              <label for="alunos-complemento">COMPLEMENTO</label>
              <input id="alunos-complemento" name="complemento" type="text" placeholder="Ex.: Sala 234, Bloco B">
            </div>
            <div class="campo">
              <label for="alunos-bairro">BAIRRO</label>
              <input id="alunos-bairro" name="bairro" type="text" placeholder="Ex.: Cidade Universitária">
            </div>
            <div class="campo">
              <label for="alunos-cep">CEP</label>
              <input id="alunos-cep" name="cep" type="text" inputmode="numeric" data-formato="cep" data-max="8" placeholder="Ex.: 05508090">
            </div>
            <div class="campo c2">
              <label for="alunos-cidade">CIDADE</label>
              <input id="alunos-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
            </div>
            <div class="campo c2">
              <label for="alunos-estado">ESTADO</label>
              <input id="alunos-estado" name="estado" type="text" placeholder="Ex.: SP">
            </div>
          </div>
        </section>

        <section class="bloco">
          <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class="campos">
            <div class="campo c2">
              <label for="alunos-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="alunos-cpf" name="cpf" type="text" inputmode="numeric" data-formato="cpf" data-max="11" placeholder="Ex.: 12345678909">
            </div>
            <div class="campo">
              <label for="alunos-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="alunos-rg" name="rg_rnm" type="text" placeholder="Ex.: 12.345.678-9">
            </div>
            <div class="campo">
              <label for="alunos-banco">NOME DO BANCO</label>
              <input id="alunos-banco" name="nome_banco" type="text" placeholder="Ex.: Banco do Brasil">
            </div>
            <div class="campo">
              <label for="alunos-agencia">NÚMERO DA AGÊNCIA</label>
              <input id="alunos-agencia" name="agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234">
            </div>
            <div class="campo c3">
              <label for="alunos-conta">NÚMERO DA CONTA</label>
              <input id="alunos-conta" name="numero_conta" type="text" placeholder="Ex.: 12345-6">
            </div>
          </div>
        </section>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>

    <section class="painel" id="painel-docentes" role="tabpanel" aria-labelledby="aba-docentes" hidden>
      <form id="form-docentes" class="solicitacao" data-aba="docentes" novalidate>
        <div class="erros" role="alert" hidden></div>

        <section class="bloco">
          <h2>SOLICITANTE E EVENTO</h2>
          <div class="campos">
            <div class="campo c2">
              <label for="docentes-nome">NOME COMPLETO - SEM ABREVIAR</label>
              <input id="docentes-nome" name="nome_completo" type="text" placeholder="Ex.: Maria Antonieta da Silva Souza">
            </div>
            <div class="campo">
              <label for="docentes-n-usp">N. USP</label>
              <input id="docentes-n-usp" name="n_usp" type="text" inputmode="numeric" placeholder="Ex.: 9876543">
            </div>
            <div class="campo">
              <label for="docentes-programa">PROGRAMA</label>
              <input id="docentes-programa" name="programa" type="text" placeholder="Ex.: Ciência da Computação">
            </div>
            <div class="campo">
              <label for="docentes-email">E-MAIL</label>
              <input id="docentes-email" name="email" type="text" placeholder="Ex.: maria.souza@usp.br">
            </div>
            <div class="campo c2">
              <label for="docentes-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
              <input id="docentes-evento" name="nome_evento" type="text" placeholder="Ex.: Simpósio Brasileiro de Computação">
            </div>
            <div class="campo">
              <label for="docentes-periodo">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
              <input id="docentes-periodo" name="periodo_evento" type="text" placeholder="Ex.: 10 a 14 de agosto de 2026">
            </div>
            <div class="campo">
              <label for="docentes-cidade-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
              <input id="docentes-cidade-evento" name="cidade_evento" type="text" placeholder="Ex.: Rio de Janeiro">
            </div>
            <div class="campo">
              <label for="docentes-estado-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
              <input id="docentes-estado-evento" name="estado_evento" type="text" placeholder="Ex.: RJ">
            </div>
            <div class="campo">
              <label for="docentes-pais-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
              <input id="docentes-pais-evento" name="pais_evento" type="text" placeholder="Ex.: Brasil">
            </div>
            <div class="campo">
              <label for="docentes-link">LINK DO EVENTO, EXAME OU DEFESA</label>
              <input id="docentes-link" name="link_evento" type="text" placeholder="Ex.: https://eventos.usp.br/simbcomp2026">
            </div>
            <div class="campo">
              <label for="docentes-valor">VALOR SOLICITADO (R$)</label>
              <input id="docentes-valor" name="valor_solicitado" type="text" inputmode="numeric" data-formato="moeda" placeholder="Ex.: 150000">
            </div>
            <div class="campo c3">
              <label for="docentes-apresenta">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
              <select id="docentes-apresenta" name="ira_apresentar">
                <option value="" selected>Selecione</option>
                <option value="Pôster">Pôster</option>
                <option value="Apresentação oral">Apresentação oral</option>
                <option value="Outra">Outra</option>
                <option value="Não irá apresentar trabalho">Não irá apresentar trabalho</option>
              </select>
            </div>
            <div class="campo c4">
              <label for="docentes-detalhamento">DETALHAMENTO DO PEDIDO</label>
              <textarea id="docentes-detalhamento" name="detalhamento" rows="2" placeholder="Ex.: Inscrição no evento e passagem aérea ida e volta."></textarea>
            </div>
          </div>
        </section>

        <section class="bloco">
          <h2>ENDEREÇO DO SOLICITANTE</h2>
          <div class="campos">
            <div class="campo">
              <label for="docentes-nascimento">DATA DE NASCIMENTO</label>
              <input id="docentes-nascimento" name="data_nascimento" type="text" inputmode="numeric" data-formato="data" data-max="8" placeholder="Ex.: 01021980">
            </div>
            <div class="campo c2">
              <label for="docentes-logradouro">LOGRADOURO</label>
              <input id="docentes-logradouro" name="logradouro" type="text" placeholder="Ex.: Rua do Matão">
            </div>
            <div class="campo">
              <label for="docentes-numero">NÚMERO</label>
              <input id="docentes-numero" name="numero" type="text" placeholder="Ex.: 1010">
            </div>
            <div class="campo c2">
              <label for="docentes-complemento">COMPLEMENTO</label>
              <input id="docentes-complemento" name="complemento" type="text" placeholder="Ex.: Sala 234, Bloco B">
            </div>
            <div class="campo">
              <label for="docentes-bairro">BAIRRO</label>
              <input id="docentes-bairro" name="bairro" type="text" placeholder="Ex.: Cidade Universitária">
            </div>
            <div class="campo">
              <label for="docentes-cep">CEP</label>
              <input id="docentes-cep" name="cep" type="text" inputmode="numeric" data-formato="cep" data-max="8" placeholder="Ex.: 05508090">
            </div>
            <div class="campo c2">
              <label for="docentes-cidade">CIDADE</label>
              <input id="docentes-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
            </div>
            <div class="campo c2">
              <label for="docentes-estado">ESTADO</label>
              <input id="docentes-estado" name="estado" type="text" placeholder="Ex.: SP">
            </div>
          </div>
        </section>

        <section class="bloco">
          <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
          <div class="campos">
            <div class="campo c2">
              <label for="docentes-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="docentes-cpf" name="cpf" type="text" inputmode="numeric" data-formato="cpf" data-max="11" placeholder="Ex.: 12345678909">
            </div>
            <div class="campo">
              <label for="docentes-rg">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
              <input id="docentes-rg" name="rg_rnm" type="text" placeholder="Ex.: 12.345.678-9">
            </div>
            <div class="campo">
              <label for="docentes-banco">NOME DO BANCO</label>
              <input id="docentes-banco" name="nome_banco" type="text" placeholder="Ex.: Banco do Brasil">
            </div>
            <div class="campo">
              <label for="docentes-agencia">NÚMERO DA AGÊNCIA</label>
              <input id="docentes-agencia" name="agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234">
            </div>
            <div class="campo c3">
              <label for="docentes-conta">NÚMERO DA CONTA</label>
              <input id="docentes-conta" name="numero_conta" type="text" placeholder="Ex.: 12345-6">
            </div>
          </div>
        </section>

        <button type="submit" class="enviar">Enviar solicitação</button>
      </form>
    </section>

    <section class="painel" id="confirmacao" hidden>
      <h2>Solicitação registrada</h2>
      <pre class="oficio" id="texto-oficio"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
