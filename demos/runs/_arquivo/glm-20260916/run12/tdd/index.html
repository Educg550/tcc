<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auxílio Financeiro | Pós-Graduação do IME-USP</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="cabecalho">
    <img class="logo" src="assets/usp-logo.png" alt="Logotipo da Universidade de São Paulo">
    <div>
      <p class="universidade">Universidade de São Paulo</p>
      <p class="programa">Programa de Pós-Graduação do Instituto de Matemática e Estatística</p>
    </div>
  </header>

  <nav class="abas">
    <button type="button" class="aba ativa" data-aba="alunos">ALUNOS</button>
    <button type="button" class="aba" data-aba="docentes">DOCENTES</button>
  </nav>

  <main id="formularios">
    <form id="form-alunos" class="painel" novalidate>
      <input type="hidden" name="aba" value="alunos">
      <div class="erros" hidden></div>

      <section class="bloco">
        <h2>SOLICITANTE E EVENTO</h2>
        <div class="campos">
          <div class="campo c5">
            <label for="alunos-nome-completo">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="alunos-nome-completo" name="nome_completo" type="text" placeholder="Ex.: Maria Souza da Silva">
          </div>
          <div class="campo c2">
            <label for="alunos-n-usp">N. USP</label>
            <input id="alunos-n-usp" name="n_usp" type="text" inputmode="numeric" placeholder="Ex.: 1234567">
          </div>
          <div class="campo c3">
            <label for="alunos-programa">PROGRAMA</label>
            <input id="alunos-programa" name="programa" type="text" placeholder="Ex.: Ciência da Computação">
          </div>
          <div class="campo c2">
            <label for="alunos-nivel">NÍVEL</label>
            <select id="alunos-nivel" name="nivel">
              <option value="">Selecione</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class="campo c4">
            <label for="alunos-tipo-de-auxilio">TIPO DE AUXÍLIO</label>
            <select id="alunos-tipo-de-auxilio" name="tipo_de_auxilio">
              <option value="">Selecione</option>
              <option>Participação em evento</option>
              <option>Banca de exame ou defesa</option>
              <option>Outro</option>
            </select>
          </div>
          <div class="campo c4">
            <label for="alunos-email">E-MAIL</label>
            <input id="alunos-email" name="email" type="text" placeholder="Ex.: maria.souza@usp.br">
          </div>
          <div class="campo c4">
            <label for="alunos-nome-do-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="alunos-nome-do-evento" name="nome_do_evento" type="text" placeholder="Ex.: Simpósio Brasileiro de Bancos de Dados">
          </div>
          <div class="campo c4">
            <label for="alunos-periodo-do-evento">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="alunos-periodo-do-evento" name="periodo_do_evento" type="text" placeholder="Ex.: 30/09/2025 a 03/10/2025">
          </div>
          <div class="campo c3">
            <label for="alunos-cidade-do-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="alunos-cidade-do-evento" name="cidade_do_evento" type="text" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo c2">
            <label for="alunos-estado-do-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="alunos-estado-do-evento" name="estado_do_evento" type="text" placeholder="Ex.: SP">
          </div>
          <div class="campo c3">
            <label for="alunos-pais-do-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="alunos-pais-do-evento" name="pais_do_evento" type="text" placeholder="Ex.: Brasil">
          </div>
          <div class="campo c7">
            <label for="alunos-link-do-evento">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="alunos-link-do-evento" name="link_do_evento" type="text" placeholder="Ex.: www.evento.org.br/2025">
          </div>
          <div class="campo c5">
            <label for="alunos-valor-solicitado">VALOR SOLICITADO (R$)</label>
            <input id="alunos-valor-solicitado" name="valor_solicitado" type="text" inputmode="numeric" data-mascara="moeda" placeholder="Ex.: 150000">
          </div>
          <div class="campo c12">
            <label for="alunos-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="alunos-detalhamento" name="detalhamento_do_pedido" rows="2" placeholder="Ex.: Passagem aérea e inscrição no evento."></textarea>
          </div>
          <div class="campo c4">
            <label for="alunos-apresentacao-trabalho">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="alunos-apresentacao-trabalho" name="apresentacao_trabalho">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="campos">
          <div class="campo c2">
            <label for="alunos-data-de-nascimento">DATA DE NASCIMENTO</label>
            <input id="alunos-data-de-nascimento" name="data_de_nascimento" type="text" inputmode="numeric" data-mascara="data" placeholder="Ex.: 01021980">
          </div>
          <div class="campo c5">
            <label for="alunos-logradouro">LOGRADOURO</label>
            <input id="alunos-logradouro" name="logradouro" type="text" placeholder="Ex.: Rua do Anfiteatro">
          </div>
          <div class="campo c2">
            <label for="alunos-numero">NÚMERO</label>
            <input id="alunos-numero" name="numero" type="text" placeholder="Ex.: 181">
          </div>
          <div class="campo c3">
            <label for="alunos-complemento">COMPLEMENTO</label>
            <input id="alunos-complemento" name="complemento" type="text" placeholder="Ex.: Sala 214">
          </div>
          <div class="campo c4">
            <label for="alunos-bairro">BAIRRO</label>
            <input id="alunos-bairro" name="bairro" type="text" placeholder="Ex.: Butantã">
          </div>
          <div class="campo c2">
            <label for="alunos-cep">CEP</label>
            <input id="alunos-cep" name="cep" type="text" inputmode="numeric" data-mascara="cep" placeholder="Ex.: 05508090">
          </div>
          <div class="campo c4">
            <label for="alunos-cidade">CIDADE</label>
            <input id="alunos-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo c2">
            <label for="alunos-estado">ESTADO</label>
            <input id="alunos-estado" name="estado" type="text" placeholder="Ex.: SP">
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="campos">
          <div class="campo c4">
            <label for="alunos-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="alunos-cpf" name="cpf" type="text" inputmode="numeric" data-mascara="cpf" placeholder="Ex.: 12345678909">
          </div>
          <div class="campo c4">
            <label for="alunos-rg-rnm">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="alunos-rg-rnm" name="rg_rnm" type="text" placeholder="Ex.: 12.345.678-9">
          </div>
          <div class="campo c4">
            <label for="alunos-nome-do-banco">NOME DO BANCO</label>
            <input id="alunos-nome-do-banco" name="nome_do_banco" type="text" placeholder="Ex.: Banco do Brasil">
          </div>
          <div class="campo c2">
            <label for="alunos-numero-da-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="alunos-numero-da-agencia" name="numero_da_agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234">
          </div>
          <div class="campo c4">
            <label for="alunos-numero-da-conta">NÚMERO DA CONTA</label>
            <input id="alunos-numero-da-conta" name="numero_da_conta" type="text" placeholder="Ex.: 98765-4">
          </div>
        </div>
      </section>

      <div class="acoes">
        <button type="submit">Enviar solicitação</button>
      </div>
    </form>

    <form id="form-docentes" class="painel" hidden novalidate>
      <input type="hidden" name="aba" value="docentes">
      <div class="erros" hidden></div>

      <section class="bloco">
        <h2>SOLICITANTE E EVENTO</h2>
        <div class="campos">
          <div class="campo c5">
            <label for="docentes-nome-completo">NOME COMPLETO - SEM ABREVIAR</label>
            <input id="docentes-nome-completo" name="nome_completo" type="text" placeholder="Ex.: João Cardoso de Oliveira">
          </div>
          <div class="campo c2">
            <label for="docentes-n-usp">N. USP</label>
            <input id="docentes-n-usp" name="n_usp" type="text" inputmode="numeric" placeholder="Ex.: 1234567">
          </div>
          <div class="campo c5">
            <label for="docentes-programa">PROGRAMA</label>
            <input id="docentes-programa" name="programa" type="text" placeholder="Ex.: Estatística">
          </div>
          <div class="campo c4">
            <label for="docentes-email">E-MAIL</label>
            <input id="docentes-email" name="email" type="text" placeholder="Ex.: joao.oliveira@usp.br">
          </div>
          <div class="campo c8">
            <label for="docentes-nome-do-evento">NOME DO EVENTO / BANCA DE EXAME OU DEFESA</label>
            <input id="docentes-nome-do-evento" name="nome_do_evento" type="text" placeholder="Ex.: Banca de defesa de Ana Lima">
          </div>
          <div class="campo c4">
            <label for="docentes-periodo-do-evento">PERÍODO DO EVENTO, EXAME OU DEFESA</label>
            <input id="docentes-periodo-do-evento" name="periodo_do_evento" type="text" placeholder="Ex.: 12/11/2025 a 14/11/2025">
          </div>
          <div class="campo c3">
            <label for="docentes-cidade-do-evento">CIDADE DO EVENTO, EXAME OU DEFESA</label>
            <input id="docentes-cidade-do-evento" name="cidade_do_evento" type="text" placeholder="Ex.: Campinas">
          </div>
          <div class="campo c2">
            <label for="docentes-estado-do-evento">ESTADO DO EVENTO, EXAME OU DEFESA</label>
            <input id="docentes-estado-do-evento" name="estado_do_evento" type="text" placeholder="Ex.: SP">
          </div>
          <div class="campo c3">
            <label for="docentes-pais-do-evento">PAÍS DO EVENTO, EXAME OU DEFESA</label>
            <input id="docentes-pais-do-evento" name="pais_do_evento" type="text" placeholder="Ex.: Brasil">
          </div>
          <div class="campo c7">
            <label for="docentes-link-do-evento">LINK DO EVENTO, EXAME OU DEFESA</label>
            <input id="docentes-link-do-evento" name="link_do_evento" type="text" placeholder="Ex.: www.evento.org.br/2025">
          </div>
          <div class="campo c5">
            <label for="docentes-valor-solicitado">VALOR SOLICITADO (R$)</label>
            <input id="docentes-valor-solicitado" name="valor_solicitado" type="text" inputmode="numeric" data-mascara="moeda" placeholder="Ex.: 250000">
          </div>
          <div class="campo c12">
            <label for="docentes-detalhamento">DETALHAMENTO DO PEDIDO</label>
            <textarea id="docentes-detalhamento" name="detalhamento_do_pedido" rows="2" placeholder="Ex.: Passagem rodoviária para a banca."></textarea>
          </div>
          <div class="campo c4">
            <label for="docentes-apresentacao-trabalho">IRÁ APRESENTAR TRABALHO NO EVENTO? QUE TIPO?</label>
            <select id="docentes-apresentacao-trabalho" name="apresentacao_trabalho">
              <option value="">Selecione</option>
              <option>Pôster</option>
              <option>Apresentação oral</option>
              <option>Outra</option>
              <option>Não irá apresentar trabalho</option>
            </select>
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>ENDEREÇO DO SOLICITANTE</h2>
        <div class="campos">
          <div class="campo c2">
            <label for="docentes-data-de-nascimento">DATA DE NASCIMENTO</label>
            <input id="docentes-data-de-nascimento" name="data_de_nascimento" type="text" inputmode="numeric" data-mascara="data" placeholder="Ex.: 05031975">
          </div>
          <div class="campo c5">
            <label for="docentes-logradouro">LOGRADOURO</label>
            <input id="docentes-logradouro" name="logradouro" type="text" placeholder="Ex.: Rua do Matão">
          </div>
          <div class="campo c2">
            <label for="docentes-numero">NÚMERO</label>
            <input id="docentes-numero" name="numero" type="text" placeholder="Ex.: 1010">
          </div>
          <div class="campo c3">
            <label for="docentes-complemento">COMPLEMENTO</label>
            <input id="docentes-complemento" name="complemento" type="text" placeholder="Ex.: Bloco C">
          </div>
          <div class="campo c4">
            <label for="docentes-bairro">BAIRRO</label>
            <input id="docentes-bairro" name="bairro" type="text" placeholder="Ex.: Cidade Universitária">
          </div>
          <div class="campo c2">
            <label for="docentes-cep">CEP</label>
            <input id="docentes-cep" name="cep" type="text" inputmode="numeric" data-mascara="cep" placeholder="Ex.: 05508090">
          </div>
          <div class="campo c4">
            <label for="docentes-cidade">CIDADE</label>
            <input id="docentes-cidade" name="cidade" type="text" placeholder="Ex.: São Paulo">
          </div>
          <div class="campo c2">
            <label for="docentes-estado">ESTADO</label>
            <input id="docentes-estado" name="estado" type="text" placeholder="Ex.: SP">
          </div>
        </div>
      </section>

      <section class="bloco">
        <h2>INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO</h2>
        <div class="campos">
          <div class="campo c4">
            <label for="docentes-cpf">CPF (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="docentes-cpf" name="cpf" type="text" inputmode="numeric" data-mascara="cpf" placeholder="Ex.: 12345678909">
          </div>
          <div class="campo c4">
            <label for="docentes-rg-rnm">RG / RNM (SEPARADOS POR PONTOS E TRAÇO)</label>
            <input id="docentes-rg-rnm" name="rg_rnm" type="text" placeholder="Ex.: 12.345.678-9">
          </div>
          <div class="campo c4">
            <label for="docentes-nome-do-banco">NOME DO BANCO</label>
            <input id="docentes-nome-do-banco" name="nome_do_banco" type="text" placeholder="Ex.: Banco do Brasil">
          </div>
          <div class="campo c2">
            <label for="docentes-numero-da-agencia">NÚMERO DA AGÊNCIA</label>
            <input id="docentes-numero-da-agencia" name="numero_da_agencia" type="text" inputmode="numeric" placeholder="Ex.: 1234">
          </div>
          <div class="campo c4">
            <label for="docentes-numero-da-conta">NÚMERO DA CONTA</label>
            <input id="docentes-numero-da-conta" name="numero_da_conta" type="text" placeholder="Ex.: 98765-4">
          </div>
        </div>
      </section>

      <div class="acoes">
        <button type="submit">Enviar solicitação</button>
      </div>
    </form>
  </main>

  <section id="confirmacao" hidden>
    <h1>Solicitação registrada</h1>
    <pre id="oficio"></pre>
  </section>
</body>
</html>
