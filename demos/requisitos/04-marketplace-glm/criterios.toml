[[criterios]]
identificador = "C1"
tipo = "deterministico"
acao = "Abrir a página inicial e buscar por Bicicleta urbana."
resultado_esperado = "O catálogo mostra o anúncio sem exigir login, com preço em reais e acesso ao detalhe."

[[criterios]]
identificador = "C2"
tipo = "deterministico"
acao = "Abrir a página inicial, entrar como Carla, acessar Anunciar e cadastrar um produto válido."
resultado_esperado = "Carla pode vender com a mesma conta usada para comprar; o anúncio aparece no catálogo e em Meus anúncios."

[[criterios]]
identificador = "C3"
tipo = "deterministico"
acao = "Abrir a página inicial, entrar como Carla, favoritar um anúncio e recarregar a página."
resultado_esperado = "O favorito persiste e aparece em Favoritos, podendo ser removido."

[[criterios]]
identificador = "C4"
tipo = "deterministico"
acao = "Abrir a página inicial, entrar como Carla, comprar uma unidade de um anúncio da Ana e abrir Minhas compras."
resultado_esperado = "O pedido mostra quantidade, total, endereço e estado pending; o estoque do anúncio diminui."

[[criterios]]
identificador = "C5"
tipo = "deterministico"
acao = "Abrir a página inicial, entrar como Carla, comprar um anúncio da Ana, cancelar o pedido antes de envio e recarregar."
resultado_esperado = "O pedido continua cancelled e o estoque foi devolvido uma única vez."

[[criterios]]
identificador = "C6"
tipo = "deterministico"
acao = "Abrir a página inicial, entrar como Carla, abrir um anúncio da Ana, clicar em Conversar e enviar uma mensagem."
resultado_esperado = "A conversa aparece na lista e a mensagem persiste após recarregar."

[[criterios]]
identificador = "C7"
tipo = "deterministico"
acao = "Abrir a página inicial, entrar como Ana e abrir Meus anúncios para editar o preço e desativar um anúncio próprio."
resultado_esperado = "A edição persiste; o anúncio desativado permanece na área da Ana e desaparece do catálogo público."

[[criterios]]
identificador = "C8"
tipo = "subjetivo"
acao = "Abrir a página inicial em desktop e em uma janela estreita, navegar pelo catálogo, detalhe e cadastro."
resultado_esperado = "A aplicação tem apresentação coerente de marketplace, navegação utilizável e formulários legíveis em ambos os tamanhos."
