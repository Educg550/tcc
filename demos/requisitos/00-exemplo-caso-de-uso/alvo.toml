# Como o harness opera o software gerado. 
# O placeholder `{porta}` é substituída por uma porta livre na hora de subir o app para o CUA avaliar.
comando_app = "uvicorn app:app --host 127.0.0.1 --port {porta}"
comando_teste = "pytest -q --tb=short"

[modelos]
test_writer = "deepseek/deepseek-v4-flash"
coder = "deepseek/deepseek-v4-flash"
cua = "anthropic/claude-opus-5"

# Teto por etapa
[orcamento]
passos = 12
custo_usd = 0.25
tempo_s = 900
