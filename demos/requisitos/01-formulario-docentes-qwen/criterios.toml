[[criterios]]
identificador = "C1"
tipo = "subjetivo"
acao = '''
Abrir a página inicial e olhar a tela inteira, rolando até o fim.
'''
resultado_esperado = '''
A página se identifica como página da Universidade de São Paulo pelo logotipo USP em
destaque no topo, acompanhado do nome da instituição por escrito, com folga em volta do
logotipo. O brasão da USP - o escudo - não aparece em lugar nenhum da página. O azul do
logotipo é a cor dominante da página, a tipografia é sem serifa, e os campos estão em
blocos separados por espaçamento, não numa lista sem estilo nenhum.
'''

[[criterios]]
identificador = "C2"
tipo = "deterministico"
acao = '''
Abrir a página inicial e olhar a tela inteira, rolando até o fim.
'''
resultado_esperado = '''
Há duas abas, `ALUNOS` e `DOCENTES` nessa ordem, e a aba `ALUNOS` está ativa. Os campos
estão divididos em três seções, com os títulos `SOLICITANTE E EVENTO`,
`ENDEREÇO DO SOLICITANTE` e `INFORMAÇÕES PARA PAGAMENTO / REEMBOLSO`, e ao fim há um
botão `Enviar solicitação`.
'''

[[criterios]]
identificador = "C3"
tipo = "deterministico"
acao = '''
Abrir a página inicial, conferir que os campos `NÍVEL` e `TIPO DE AUXÍLIO` estão na tela,
e então clicar na aba `DOCENTES`.
'''
resultado_esperado = '''
A aba `DOCENTES` fica ativa e o formulário mostrado não tem mais os campos `NÍVEL` nem
`TIPO DE AUXÍLIO` - eles existem só na aba `ALUNOS`. Os outros campos continuam lá.
'''

[[criterios]]
identificador = "C4"
tipo = "deterministico"
acao = '''
Abrir a página inicial e, na aba `ALUNOS`, digitar `João Souza` no campo
`NOME COMPLETO - SEM ABREVIAR` e `Matemática Aplicada` no campo `PROGRAMA`. Clicar na aba
`DOCENTES`, digitar `Maria Silva` no campo `NOME COMPLETO - SEM ABREVIAR` dela, e voltar
para a aba `ALUNOS`.
'''
resultado_esperado = '''
A aba `ALUNOS` volta a ficar ativa com o que tinha sido digitado nela ainda no lugar:
`João Souza` em `NOME COMPLETO - SEM ABREVIAR` e `Matemática Aplicada` em `PROGRAMA`. A
troca de aba não apagou o preenchimento.
'''

[[criterios]]
identificador = "C5"
tipo = "deterministico"
acao = '''
Abrir a página inicial. Digitar `1500` no campo `VALOR SOLICITADO (R$)` e sair do campo.
Depois apagar o conteúdo do campo, digitar `150000000` e sair do campo de novo. Não
enviar o formulário.
'''
resultado_esperado = '''
Na primeira vez o campo passa a mostrar `R$ 15,00`; na segunda, `R$ 1.500.000,00`.
'''

[[criterios]]
identificador = "C6"
tipo = "deterministico"
acao = '''
Abrir a página inicial. Digitar `12345678909` no campo
`CPF (SEPARADOS POR PONTOS E TRAÇO)` e sair do campo, sem enviar o formulário.
'''
resultado_esperado = '''
O campo passa a mostrar `123.456.789-09`.
'''

[[criterios]]
identificador = "C7"
tipo = "deterministico"
acao = '''
Abrir a página inicial e clicar em `Enviar solicitação` sem preencher nenhum campo.
'''
resultado_esperado = '''
A mensagem `Preencha todos os campos` aparece no topo do formulário e o ofício não é
gerado.
'''

[[criterios]]
identificador = "C8"
tipo = "deterministico"
acao = '''
Abrir a página inicial, preencher apenas o campo `N. USP` com `abc123` e clicar em
`Enviar solicitação`.
'''
resultado_esperado = '''
A mensagem `N. USP deve conter apenas números` aparece no topo do formulário.
'''

[[criterios]]
identificador = "C9"
tipo = "deterministico"
acao = '''
Abrir a página inicial, preencher apenas o campo `VALOR SOLICITADO (R$)` com `0` e
clicar em `Enviar solicitação`.
'''
resultado_esperado = '''
A mensagem `Valor solicitado deve ser maior que 0` aparece no topo do formulário e o
ofício não é gerado.
'''

[[criterios]]
identificador = "C10"
tipo = "deterministico"
acao = '''
Abrir a página inicial e preencher o formulário da aba `ALUNOS`, que já está ativa,
inteiro, usando exatamente estes valores nos campos citados e valores plausíveis que você
mesmo escolher em todos os outros campos obrigatórios:

- `NOME COMPLETO - SEM ABREVIAR`: `João Souza`
- `N. USP`: `7654321`
- `PROGRAMA`: `Matemática Aplicada`
- `NÍVEL`: `Mestrado`
- `TIPO DE AUXÍLIO`: `Participação em evento`
- `VALOR SOLICITADO (R$)`: `150000`
- `CPF (SEPARADOS POR PONTOS E TRAÇO)`: `52998224725`
- `DATA DE NASCIMENTO`: `01021980`

Depois clicar em `Enviar solicitação`.
'''
resultado_esperado = '''
A página mostra `Solicitação registrada` e o ofício abaixo contém
`Interessada(o): João Souza - 7654321`,
`Assunto: Solicitação de Auxílio Financeiro - Participação em evento`,
`Programa: Matemática Aplicada - Mestrado` e `Valor solicitado: R$ 1.500,00`, sem nenhum
marcador `<<...>>` sobrando.
'''

[[criterios]]
identificador = "C11"
tipo = "deterministico"
acao = '''
Abrir a página inicial, clicar na aba `DOCENTES` e preencher o formulário dela inteiro,
usando exatamente estes valores nos campos citados e valores plausíveis que você mesmo
escolher em todos os outros campos obrigatórios:

- `NOME COMPLETO - SEM ABREVIAR`: `Maria Silva`
- `N. USP`: `1234567`
- `PROGRAMA`: `Ciência da Computação`
- `VALOR SOLICITADO (R$)`: `150000`
- `CPF (SEPARADOS POR PONTOS E TRAÇO)`: `12345678909`

Depois clicar em `Enviar solicitação`.
'''
resultado_esperado = '''
A página mostra `Solicitação registrada` e o ofício abaixo contém
`Interessada(o): Maria Silva - 1234567`,
`Assunto: Solicitação de Auxílio Financeiro - Verba do programa`,
`Programa: Ciência da Computação`, `Valor solicitado: R$ 1.500,00` e
`CPF: 123.456.789-09`, sem nenhum marcador `<<...>>` sobrando.
'''

[[criterios]]
identificador = "C12"
tipo = "deterministico"
acao = '''
Abrir a página inicial e preencher o formulário da aba `ALUNOS`, que já está ativa,
inteiro, com valores plausíveis que você mesmo escolher, usando `52998224725` em
`CPF (SEPARADOS POR PONTOS E TRAÇO)` e digitando `32121990` em `DATA DE NASCIMENTO`.
Depois clicar em `Enviar solicitação`.
'''
resultado_esperado = '''
A página continua no formulário e não mostra `Solicitação registrada`. No topo do
formulário da aba `ALUNOS` aparece a mensagem `Data de nascimento inválida`.
'''

[[criterios]]
identificador = "C13"
tipo = "deterministico"
acao = '''
Abrir a página inicial e preencher o formulário da aba `ALUNOS`, que já está ativa,
inteiro, com valores plausíveis que você mesmo escolher, digitando `01021980` em
`DATA DE NASCIMENTO` e `12345678900` em `CPF (SEPARADOS POR PONTOS E TRAÇO)`.
Depois clicar em `Enviar solicitação`.
'''
resultado_esperado = '''
A página continua no formulário e não mostra `Solicitação registrada`. No topo do
formulário da aba `ALUNOS` aparece a mensagem `CPF inválido`.
'''

[[criterios]]
identificador = "C14"
tipo = "subjetivo"
acao = '''
Abrir a página inicial e observar a tela sem rolar a página.
'''
resultado_esperado = '''
Tudo cabe na tela de uma vez, sem rolagem vertical: o cabeçalho da USP, os três blocos de
campos da aba `ALUNOS` e o botão `Enviar solicitação` estão visíveis ao mesmo tempo. Os
campos estão distribuídos em mais de uma coluna, não empilhados numa coluna única.
'''
