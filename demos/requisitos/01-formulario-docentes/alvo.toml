comando_app = "uvicorn app:app --host 127.0.0.1 --port {porta}"
comando_teste = "pytest -q --tb=short"

[modelos]
test_writer = "deepseek/deepseek-v4-flash"
coder = "deepseek/deepseek-v4-flash"
cua = "google/gemini-2.5-flash"

# Teto por etapa. Maior que o do exemplo: duas abas, 26 campos e quatro máscaras dão
# mais rodada de pytest vermelho antes de fechar.
[orcamento]
passos = 20
custo_usd = 0.80
tempo_s = 1800
