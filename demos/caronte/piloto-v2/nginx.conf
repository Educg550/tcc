events { worker_connections 256; }
http {
    include mime.types;
    client_max_body_size 10M;
    # Resolve a cada requisição: backend recriado ou morto não derruba nem trava o proxy.
    resolver 127.0.0.11 valid=1s;
    server {
        listen 80;
        listen 443 ssl;
        ssl_certificate /tls/cert.pem;
        ssl_certificate_key /tls/key.pem;
        location /backend/ { set $u prejanus-back; rewrite ^/backend/(.*)$ /$1 break; proxy_pass http://$u:8000; }
        location /local/ { set $u local; rewrite ^/local/(.*)$ /$1 break; proxy_pass http://$u:8000; }
        location /sem-atalho/ { set $u sem-atalho; rewrite ^/sem-atalho/(.*)$ /$1 break; proxy_pass http://$u:8000; }
        location /prejanus { set $u front; proxy_pass http://$u:3000; }
        location /static {
            alias /usr/share/nginx/static-assets/dist;
        }
        location / { set $u forms; proxy_pass http://$u:5000; }
    }
}
