events { worker_connections 256; }
http {
    include mime.types;
    client_max_body_size 10M;
    server {
        listen 80;
        listen 443 ssl;
        ssl_certificate /tls/cert.pem;
        ssl_certificate_key /tls/key.pem;
        location /backend/ { proxy_pass http://prejanus-back:8000/; }
        location /local/ { proxy_pass http://local:8000/; }
        location /sem-atalho/ { proxy_pass http://sem-atalho:8000/; }
        location /prejanus { proxy_pass http://front:3000; }
        location /static {
            alias /usr/share/nginx/static-assets/dist;
        }
        location / { proxy_pass http://forms:5000; }
    }
}
